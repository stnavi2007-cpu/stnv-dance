<style>
:root{
  --wall:#FBEFD2; --wall2:#F6E3B8; --floor:#C99A66; --floor2:#B5854F;
  --board:#2F5D50; --board2:#274E43; --frame:#8A5A2E; --chalk:#F7F3E8; --chalk-y:#FFE27A;
  --ink:#4A2E14; --ink2:#7A5A3A; --paper:#FFFDF6; --line:#E6D3A8;
  --carrot:#F08A24; --carrot-d:#C96A0C; --maru:#E4483B; --batsu:#2C6FBB; --leaf:#5DAA4A;
  --shadow:0 3px 0 rgba(74,46,20,.22);
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --kyo:"Klee One","YuKyokasho Yoko","YuKyokasho","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#3A3226; --wall2:#332B20; --floor:#5E4526; --floor2:#4E381D;
    --board:#23463C; --board2:#1C3A31; --frame:#5E3D1E; --ink:#F4E6CC; --ink2:#CDB894;
    --paper:#4A4032; --line:#6B5B3E; --shadow:0 3px 0 rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --wall:#3A3226; --wall2:#332B20; --floor:#5E4526; --floor2:#4E381D;
  --board:#23463C; --board2:#1C3A31; --frame:#5E3D1E; --ink:#F4E6CC; --ink2:#CDB894;
  --paper:#4A4032; --line:#6B5B3E; --shadow:0 3px 0 rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
body{position:fixed;inset:0;height:100%;width:100%;margin:0;background:var(--wall);color:var(--ink);font-family:var(--ui);font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--batsu);outline-offset:2px}
.app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--wall)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* 分かち書き: ことばの とちゅうで おらない */
.bubble,.letter,.exp .cap,.exp .memoNote,.gift,.q-sub,.modal p,.stamp,.techoLead,.gprompt,.gend{word-break:normal;overflow-wrap:break-word;line-break:strict;text-align:left}
.exp .cap,.gift,.modal p,.gprompt,.gend{text-align:center}
/* ふきだし */
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;
  font-size:17px;line-height:1.55;min-height:52px;box-shadow:var(--shadow)}
.bubble::after{content:"";position:absolute;width:16px;height:16px;background:var(--paper);border:3px solid var(--ink);
  border-top:0;border-right:0}
.bubble.down::after{left:50%;bottom:-11px;transform:translateX(-50%) rotate(-45deg)}
.bubble.left::after{left:-11px;top:26px;transform:rotate(45deg)}


/* なぞり */
.tr{position:absolute;inset:0;touch-action:none}
.tr canvas{position:absolute;inset:0;width:100%;height:100%}
.trTip{position:absolute;left:0;right:0;top:6px;text-align:center;font-family:var(--ui);font-size:14px;opacity:.85;pointer-events:none}
/* ポテ */
.pote{display:inline-block;position:relative;height:100%;transform-origin:50% 100%}
.pote .pimg{display:block;height:100%;width:auto;filter:drop-shadow(0 5px 3px rgba(60,35,10,.28))}
.pote .wear{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.poteBox{display:flex;justify-content:center}
.pote{will-change:transform}
.pote.idle{animation:breathe 3.4s ease-in-out infinite,sway 6s ease-in-out infinite}
.pote.hop{animation:hop .5s cubic-bezier(.3,1.4,.5,1) 2}
.pote.tilt{animation:tilt 1.4s ease-in-out infinite}
.pote.write{animation:write .22s linear infinite}
.pote.sleep{animation:breathe 4.6s ease-in-out infinite}.pote.sleep .pimg{filter:drop-shadow(0 5px 3px rgba(60,35,10,.28)) brightness(.82)}
.pote.munch{animation:munch .32s ease-in-out 6}
.pote.wiggle{animation:wiggle .6s ease-in-out 2}
.pote.spin .pimg{animation:spinSquash .27s ease-in-out infinite}
.pote.happy{animation:happy .5s ease-in-out 3}
.pote.peek{animation:peek 1.2s ease-in-out infinite}
@keyframes munch{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95) rotate(-2deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}
@keyframes sway{0%,100%{rotate:-1.5deg}50%{rotate:1.5deg}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}28%{transform:translateY(-26px) scale(.96,1.06)}55%{transform:translateY(0) scale(1.06,.92)}72%{transform:translateY(-6px) scale(.99,1.01)}}
@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes write{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}75%{transform:translate(-2px,1px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
@keyframes happy{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-4deg)}75%{transform:translateY(-14px) rotate(4deg)}}
@keyframes peek{0%,100%{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(6px) rotate(3deg)}}
/* 4枚を切り替える 疑似3D 1かいてん(よこ ちぢみで まわってる かんじ) */
@keyframes spinSquash{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}


/* ホーム */

/* おみせ・きがえ・ごはん */

/* あそび */

.gift b{display:block;font-size:64px;line-height:1.2;animation:hop .6s ease-out 2}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:900}
.card .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;border-top:1px dashed var(--line);font-weight:500}
.card .row:first-of-type{border-top:0}
.card .row b{font-weight:900;text-align:right}
.stamp{display:flex;align-items:center;gap:8px;font-size:15px;padding:5px 0;font-weight:700}
.stamp i{font-style:normal;width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.stamp.got i{border-color:var(--maru);color:var(--maru);transform:rotate(-12deg);font-weight:900}
.stamp.now{color:var(--carrot-d)}
.adult{font-weight:500;font-size:14px;line-height:1.75}
.adult button.s{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;margin:4px 6px 4px 0;background:var(--wall2);font-size:14px;font-weight:700}
.adult button.s.sel{background:var(--carrot);color:#fff;border-color:var(--carrot-d)}
.adult input{font:inherit;font-size:20px;width:90px;padding:6px;border:2px solid var(--ink);border-radius:8px;text-align:center;background:var(--paper);color:var(--ink)}
@media (max-height:700px){.q-emoji{font-size:34px}.q-sub{font-size:16px}}
@media (max-height:640px){.stage{height:108px}.stage .poteBox{height:98px;width:80px}.ctrl.num{min-height:222px}.ctrl.slim{min-height:0}.pad button{min-height:42px}.judge button{min-height:96px}}
@media (prefers-reduced-motion:reduce){.pote,.gift b,.zzz{animation:none!important}.hana.go path{animation-duration:.01s}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ホーム -->
  <section class="screen" id="home">
    <div class="top"><h1>ポテの がっこう</h1><div class="days" id="daysTxt"></div><div class="carrot" id="carrotTxt">🥕 0</div></div>
    <div class="room" id="room">
      <div class="shelf" id="shelf" aria-label="ポテの たからもの"></div>
      <div class="bubble down" id="homeBubble" role="button" tabindex="0"></div>
      <div class="deco" id="deco"></div>
      <div class="poteBox"><span class="pote idle" id="homePote"><img class="pimg" alt="ポテ" draggable="false"><svg class="wear" viewBox="0 0 416 560"></svg></span></div>
      <div class="zzz">💤</div>
    </div>
    <div class="acts" id="acts"><button id="btnFeed"><span id="belly"></span></button><button id="btnWear">👒 きがえ</button><button id="btnPlay">🎈 あそぶ</button></div>
    <div class="subjects" id="subjects"></div>
    <div class="nav">
      <button id="btnShop">🏪 おみせ</button>
      <button id="btnTecho">📒 てちょう</button>
      <button id="btnLetters">💌 おてがみ</button>
      <button id="btnAdult">🔑 おうち</button>
    </div>
  </section>

  <!-- レッスン -->
  <section class="screen" id="lesson">
    <div class="lbar"><button class="x" id="btnQuit" aria-label="やめる">✕</button><div class="prog" id="prog"></div><div style="width:40px"></div></div>
    <div class="board" id="board"></div>
    <div class="stage"><div class="poteBox"><span class="pote idle" id="lesPote"><img class="pimg" alt="ポテ" draggable="false"><svg class="wear" viewBox="0 0 416 560"></svg></span></div><div class="bubble left" id="lesBubble"></div></div>
    <div class="ctrl" id="ctrl"></div>
  </section>

  <!-- あそび -->
  <section class="screen" id="game"><div class="hd"><button class="x" id="btnGameQuit" aria-label="やめる">✕</button><h2 id="gameTitle"></h2><div class="gprog" id="gprog"></div></div>
    <div class="gprompt" id="gprompt"></div><div class="garea" id="garea"></div>
    <div class="stage" style="height:112px"><div class="poteBox" style="height:100px;width:84px"><span class="pote idle" id="gamePote"><img class="pimg" alt="ポテ" draggable="false"><svg class="wear" viewBox="0 0 416 560"></svg></span></div><div class="bubble left" id="gameBubble"></div></div>
  </section>

  <!-- おわり -->
  <section class="screen" id="finish"><div class="sheet" id="finishBody"></div></section>

  <!-- てちょう / てがみ / おとな -->
  <section class="screen" id="page"><div class="hd"><button class="x" id="btnBack" aria-label="もどる">←</button><h2 id="pageTitle"></h2></div><div class="sheet" id="pageBody"></div></section>
</div>

function freshState(){

    carrot:0,owned:["g:balloon"],inv:{},wearing:{},fed:{},play:{},gameBest:{},belly:50,bellyDate:"",

function normalize(o){
  const b=freshState();if(!o||typeof o!=="object")return b;
  const s=Object.assign(b,o);s.settings=Object.assign(freshState().settings,o.settings||{});
  SKILL_IDS.forEach(id=>{s.skills[id]=Object.assign({lv:0,hist:[],n:0},(o.skills||{})[id]||{})});
  ["items","days"].forEach(k=>{if(!s[k]||typeof s[k]!=="object")s[k]={}});
  ["room","letters","log","owned"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  if(!s.owned.includes("g:balloon"))s.owned.push("g:balloon"); // ふうせんは デフォルト
  ["inv","wearing","fed","play","gameBest"].forEach(k=>{if(!s[k]||typeof s[k]!=="object")s[k]={}});if(typeof s.carrot!=="number")s.carrot=0;if(typeof s.belly!=="number")s.belly=50;if(s.belly<=3&&!s.bellyPct){s.belly=Math.round(s.belly*33);s.bellyPct=1}if(typeof s.bellyDate!=="string")s.bellyDate="";
  return s;
}

let AC=null;
function ac(){if(AC)return AC;try{const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}catch(e){}return AC}
function tone(f,t,d,type,vol,f2){if(!S.settings.sfx)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||"sine";
  const t0=a.currentTime+t;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.18,t0+.015);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.05)}catch(e){}}
const SFX={
  pui(){tone(1300,0,.12,"sine",.2,2300);tone(1500,.16,.14,"sine",.2,2600)},
  tap(){tone(620,0,.06,"triangle",.12)},
  chalk(){tone(2400+rnd(900),0,.035,"square",.035)},
  ok(){tone(784,0,.14,"triangle",.16);tone(1047,.12,.22,"triangle",.16)},
  hana(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.14))},
  hmm(){tone(392,0,.16,"sine",.13);tone(440,.18,.2,"sine",.13)},
  gift(){[659,784,988,1319].forEach((f,i)=>tone(f,i*.11,.3,"sine",.15))}
};

function chu(kind){
  if(!S.settings.sfx||FAST())return;const a=ac();if(!a)return;
  const one=(t,f1,f2,d,v)=>{tone(f1,t,d,"sine",v||.16,f2)};
  if(kind==="long"){one(0,1500,2600,.22,.15)}            // チュー
  else if(kind==="happy"){one(0,1400,2400,.1);one(.13,1600,2700,.1);one(.27,1800,3000,.14)} // チュチュチュ！
  else if(kind==="hmm"){one(0,1700,1100,.2,.12)}         // チュゥ…(さがる)
  else{one(0,1500,2500,.09);one(.12,1500,2500,.11)}      // チュッチュ
}

const uniq=a=>a.filter((x,i)=>x!==""&&x!=null&&a.indexOf(x)===i);
function framesHTML(cells){ // cells: 20この "a"|"b"|"x"|""
  let h='<div class="frames">';
  for(let f=0;f<2;f++){const part=cells.slice(f*10,f*10+10);if(f===1&&!part.some(c=>c))break;
    h+='<div class="frame10">'+part.map(c=>'<i class="'+(c||"")+'"></i>').join("")+"</div>";}
  return h+"</div>";
}
function mkAdd(a,b,lv){const ans=a+b,carry=(a<10&&b<10&&ans>10&&a>0&&b>0);
  const cells=[];for(let i=0;i<20;i++)cells.push(i<a?"a":i<ans?"b":"");
  let cap;
  if(carry){const need=10-a,rest=b-need;cap=`${a}は あと ${need}で 10。<br>${b}を ${need}と ${rest}に わけるよ。<br>10と ${rest}で <b>${ans}</b>。`}
  else if(a===0||b===0)cap=`0は「なにも ない」。<br>${a}と 0で <b>${ans}</b>の まま。`;
  else if(a===10)cap=`10と ${b}で <b>${ans}</b>。`;
  else if(a>10)cap=`${a-10}と ${b}で ${a-10+b}。<br>10と ${a-10+b}で <b>${ans}</b>。`;
  else cap=`${a}こ と ${b}こ を あわせると <b>${ans}</b>こ。`;
  return {key:`add:${a}+${b}`,lv,type:"num",ans:String(ans),label:`${a}＋${b}`,
    wrongs:uniq([ans-1,ans+1,carry?ans-10:ans+2,(a===0||b===0)?0:ans+2].filter(x=>x>=0&&x!==ans).map(String)),
    q:{main:`${a} ＋ ${b} ＝ `},say:`${a}たす${b}は、いくつ？`,
    explain:()=>framesHTML(cells)+`<div class="cap">${cap}</div>`};
}
function mkSub(a,b,lv){const ans=a-b,borrow=(a>10&&b>a-10&&b<a);
  const cells=[];for(let i=0;i<20;i++)cells.push(i<a?"a":"");
  let cap;
  if(borrow){for(let i=10-b;i<10;i++)cells[i]="x";
    cap=`${a}を 10と ${a-10}に わけるよ。<br>10から ${b}を ひいて ${10-b}。<br>${10-b}と ${a-10}で <b>${ans}</b>。`}
  else if(b===0){cap=`0は なにも とらない。だから <b>${ans}</b>の まま。`}
  else if(a===b){for(let i=0;i<a;i++)cells[i]="x";cap=`ぜんぶ とると、なにも のこらない。<br>のこりは <b>0</b>。`}
  else{for(let i=a-b;i<a;i++)cells[i]="x";
    cap=a>10?`${a-10}から ${b}を ひいて ${a-10-b}。<br>10と ${a-10-b}で <b>${ans}</b>。`:`${a}こ から ${b}こ とると、のこりは <b>${ans}</b>こ。`}
  return {key:`sub:${a}-${b}`,lv,type:"num",ans:String(ans),label:`${a}−${b}`,
    wrongs:uniq([borrow?10+(b-(a-10)):ans+1,ans-1,ans+1,ans+2].filter(x=>x>=0&&x!==ans).map(String)),
    q:{main:`${a} − ${b} ＝ `},say:`${a}ひく${b}は、いくつ？`,
    explain:()=>framesHTML(cells)+`<div class="cap">${cap}</div>`};
}

const TAGS={

  "count":["かぞえる","count"],"next":["つぎの かず・まえの かず","count"],"to10":["10の ともだち","count"],"tens":["10の まとまり","count"],"cmp":["おおきさくらべ","count"],

  "kata:0":["カタカナ","kata"],"kata:1":["のばす カタカナ","kata"],"kanji:shape":["かんじの かたち","kanji"],"kanji:r":["かんじの よみ","kanji"],

  "shape":["かたちの なまえ","katachi"],"len":["ながさくらべ","katachi"],"shapecount":["かたちを かぞえる","katachi"],"units":["なんこぶんの ながさ","katachi"],

function tagOf(it){const k=it.key;
  if(k.startsWith("add:")){const [a,b]=k.slice(4).split("+").map(Number);if(a===0||b===0)return "add:0";if(a<10&&b<10&&a+b>10)return "add:carry";if(a+b<=5)return "add:5";if(a+b<=10)return "add:10";return "add:big"}
  if(k.startsWith("sub:")){const [a,b]=k.slice(4).split("-").map(Number);if(b===0||a===b)return "sub:0";if(a>10&&b>a-10)return "sub:borrow";if(a<=5)return "sub:5";if(a<=10)return "sub:10";return "sub:big"}
  if(k.startsWith("miss:"))return "miss";if(k.startsWith("add3:"))return "add3";if(k.startsWith("sub3:"))return "sub3";
  if(k.startsWith("count:"))return "count";if(k.startsWith("next:"))return "next";if(k.startsWith("to10:"))return "to10";if(k.startsWith("tens:"))return "tens";if(k.startsWith("cmp:"))return "cmp";
  if(k.startsWith("clock:")){const m=Number(k.split(":")[2]);return m===0?"clock:0":m===30?"clock:30":"clock:m"}
  if(k.startsWith("kotoba:"))return "kotoba:"+k.split(":")[1];
  if(k.startsWith("kata:"))return "kata:"+it.lv;
  if(k.startsWith("kanji:r:"))return "kanji:r";if(k.startsWith("kanji:"))return "kanji:shape";
  if(k.startsWith("bun:"))return "bun:"+k.split(":")[1];
  if(k.startsWith("shape:"))return "shape";if(k.startsWith("len:"))return "len";if(k.startsWith("shapecount:"))return "shapecount";if(k.startsWith("units:"))return "units";
  if(k.startsWith("grp:"))return "grp";if(k.startsWith("opp:"))return "opp";if(k.startsWith("sent:"))return "sent";
  if(k.startsWith("trace:"))return "trace:"+it.lv;
  return "other"}

function analyze(days){const since=addDays(-(days||30));const by={};let judged=0,jok=0,hand=0,handOk=0,tap=0,tapOk=0,msSum=0,msN=0;
  S.log.forEach(e=>{if(e.d<since)return;const it=itemByKey(e.k);if(!it)return;const t=tagOf(it);const b=by[t]||(by[t]={n:0,ok:0,ms:0});b.n++;b.ok+=e.ok;b.ms+=e.ms||0;
    if(e.j!=null){judged++;jok+=e.j}if(e.h!=null){if(e.h){hand++;handOk+=e.ok}else{tap++;tapOk+=e.ok}}if(e.ms){msSum+=e.ms;msN++}});
  const rows=Object.entries(by).map(([t,b])=>({t,name:(TAGS[t]||[t])[0],skill:(TAGS[t]||["",""])[1],n:b.n,rate:b.ok/b.n,ms:b.ms/b.n}));
  const weak=rows.filter(r=>r.n>=3&&r.rate<0.7).sort((a,b)=>a.rate-b.rate);
  const strong=rows.filter(r=>r.n>=3&&r.rate>=0.9).sort((a,b)=>b.n-a.n);
  return {rows,weak,strong,judged,jok,hand,handOk,tap,tapOk,avgMs:msN?msSum/msN:0}}

/* ---------- がめん きりかえ ---------- */
let TOKEN=0;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id))}
function setBubble(el,t){el.innerHTML=esc(disp(t));el.dataset.t=t}
function poteSet(el,view,anim){el.querySelector(".pimg").src=IMG[view];el.className="pote "+(anim||"idle");el.querySelector(".wear").innerHTML=view==="front"?wearSVG():""}
function poteHTML(id,view,anim){return `<span class="pote ${anim||"idle"}" id="${id}"><img class="pimg" src="${IMG[view]}" alt="ポテ"><svg class="wear" viewBox="0 0 416 560">${view==="front"?wearSVG():""}</svg></span>`}

/* ---------- ホーム ---------- */
function todayCount(){return S.days[ymd()]||0}
function canPlayNow(){const t=ymd();return todayCount()>=(S.settings.limit||3)&&!(S.play[t]>0)&&ownedGames().length>0&&S.belly>0}
function reachedLimit(){return todayCount()>=(S.settings.limit||3)}
function asleep(){const t=ymd();return reachedLimit()&&(S.play[t]>0||ownedGames().length===0||S.belly<=0)}
function stars(id){const lv=S.skills[id].lv,max=SK[id].levels.length;return "★".repeat(Math.min(lv,max))+"☆".repeat(Math.max(0,max-lv))}
function showHome(){
  TOKEN++;shush();show("home");
  const z=asleep();$("#room").classList.toggle("asleep",z);$("#home").classList.toggle("asleep",z);
  poteSet($("#homePote"),z?"back":"front",z?"sleep":"idle");
  $("#shelf").textContent="";
  $("#deco").innerHTML=Object.entries(DECO).filter(([k])=>S.owned.includes("d:"+k)).map(([k,v])=>`<span style="${v.pos}">${v.e}</span>`).join("");
  carrotTxt();
  tickBelly();$("#belly").innerHTML="🍽️ "+bellyHTML(52);$("#btnFeed").classList.toggle("hungry",S.belly===0);
  const canPlay=canPlayNow();$("#btnPlay").className=canPlay?"on":"off";
  const nd=Object.keys(S.days).length;$("#daysTxt").textContent=nd?`がっこう ${nd}にちめ`:"";
  $("#subjects").innerHTML=SKILL_IDS.map(id=>`<button class="subj" data-skill="${id}"><span class="ic">${SK[id].icon}</span><span class="nm">${SK[id].name}</span><span class="st">${stars(id)}</span>${(!z&&S.wish===id)?'<span class="wish">ポテの おねがい</span>':""}</button>`).join("");
  if(!S.met){$("#subjects").innerHTML=`<button class="big-btn go" id="btnYes" style="grid-column:1/-1;min-height:72px">いいよ！ せんせいに なる</button>`;
    $("#btnYes").onclick=()=>{ac();chu("happy");S.met=true;save(true);showHome();$("#homePote").className="pote hop";
      setBubble($("#homeBubble"),L.yes())}}
  let t;
  const unread=S.letters.some(l=>l.parent&&!l.read);
  homeIdleLoop();
  const bl=BELLY_LINE();
  if(!S.met)t=L.first();else if(unread)t=L.newLetter();else if(z)t=L.sleepy();else if(bl&&Math.random()<.6)t=bl;else if(S.wish&&SK[S.wish])t=L.wish(SK[S.wish].name);else t=L.hello();
  setBubble($("#homeBubble"),t);
  $("#btnLetters").textContent=unread?"💌 おてがみ ●":"💌 おてがみ";
}
$("#subjects").addEventListener("click",e=>{const b=e.target.closest(".subj");if(!b||asleep())return;ac();SFX.tap();S.met=true;startLesson(b.dataset.skill)});

function buildSession(skill){
  const sk=SK[skill],lv=Math.min(S.skills[skill].lv,sk.levels.length-1),today=ymd();
  const due=shuffle(sk.items.filter(it=>S.items[it.key]&&S.items[it.key].due&&S.items[it.key].due<=today&&it.lv<=lv));
  const cur=shuffle(sk.items.filter(it=>it.lv===lv));
  const fresh=cur.filter(it=>!S.items[it.key]||!S.items[it.key].seen);
  const out=[];const add=it=>{if(it&&out.length<5&&!out.includes(it))out.push(it)};
  const wk=weakTags();const weakItems=shuffle(sk.items.filter(it=>it.lv<=lv&&wk.includes(tagOf(it))));
  weakItems.slice(0,2).forEach(add);
  due.slice(0,3).forEach(add);fresh.forEach(add);cur.forEach(add);
  if(lv>0)shuffle(sk.items.filter(it=>it.lv<lv)).forEach(add);
  let list=shuffle(out);
  // ほかの きょうかの ふくしゅう(インターリーブ)を 1もん
  const others=[];SKILL_IDS.forEach(id=>{if(id!==skill)SK[id].items.forEach(it=>{const st=S.items[it.key];if(st&&st.box>=1&&st.due&&st.due<=today)others.push(it)})});
  let bonus=others.length?pick(others):null;
  const avg=list.reduce((s,it)=>s+((S.items[it.key]||{}).box||0),0)/Math.max(1,list.length);
  const nWrong=avg<1.5?3:2;
  const plan=shuffle(list.map((_,i)=>i<nWrong));
  const handPlan=shuffle(list.map((_,i)=>i<2));
  return {skill,lv,list,plan,handPlan,bonus,i:0,total:list.length+(bonus?1:0),results:[],requeued:{},fixedLabels:[],bothLabels:[],leveled:null};
}

function traceScore(g,c,W,H,dpr){

  const gAt=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&gd[(y*w+x)*4+3]>40;

    if(gi){gN++;let ok=si;if(!ok){for(let dy=-R;dy<=R&&!ok;dy+=step)for(let dx=-R;dx<=R&&!ok;dx+=step){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<w&&yy<h&&sd[(yy*w+xx)*4+3]>40)ok=true}}if(ok)hit++}

     <p style="margin:10px 0 2px">1日の授業の上限(超えるとポテが寝ます)</p>${[2,3,5].map(n=>`<button class="s ${s.limit===n?"sel":""}" data-set="limit:${n}">${n}回</button>`).join("")}
     <p style="margin:10px 0 2px">今日だけ特別に</p><button class="s" data-set="wake">ポテを起こす(今日の回数を0に戻す)</button>
     <p style="margin:10px 0 2px">📨 レポートの自動送信</p>
     <p style="margin:0 0 6px;font-size:13px">授業が終わるたびに、このレポートを自動で家族のメールに送ります。設定にはGoogleアカウントが要ります(手順はチャットで渡した「自動送信のつくりかた」を参照)。</p>
     <input id="autoUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(s.autoUrl||"")}" style="width:100%;font-size:13px;text-align:left;padding:8px">
     <div style="margin:6px 0"><button class="s ${s.autoMode==="day"?"sel":""}" data-set="auto:day">1日1回</button><button class="s ${s.autoMode==="each"?"sel":""}" data-set="auto:each">授業のたび</button><button class="s" data-set="auto:save">URLを保存</button><button class="s" data-set="auto:test">いま送る(テスト)</button></div>
     <div style="font-size:13px">${s.autoUrl?`設定済み。送信回数：${S.autoCount||0}回${S.autoLast?"(最後："+S.autoLast.replace(/-/g,"/")+")":""}`:"未設定"}</div>
     <p style="margin:10px 0 2px">やり直し</p><button class="s" data-set="reset">記録をすべて消す</button></div>
   <div class="card adult"><h3>このアプリのしくみ</h3>
     <p style="margin:4px 0">お子さんが「先生」、ポテが「生徒」です。お子さんは先に自分の答えをメモし(思い出す練習)、そのあとポテの答えに ◯ か ✕ をつけます。ポテは小学1年生がつまずきやすい形でわざと間違えます。</p>
     <p style="margin:4px 0">お子さんの答えが違っていたときは、バツ音や減点は出さず「いっしょに たしかめよう」に進み、同じ問題が授業の最後と翌日にもう一度出ます。正解した問題は 1日→3日→7日→14日→30日 と間をあけて復習に出ます。</p>
     <p style="margin:4px 0">今の段階で直近8問中7問を正解すると、次の段階に進みます。点数やランキング、連続ログインの仕掛けはありません。</p>
     <p style="margin:4px 0">「せんせいの こたえメモ」は、5問のうち2問が「手で書く」形になります(数字・ひらがな・カタカナ・漢字)。書いたあとに「かいたのは どれ？」で自分の答えを選ぶので、書く練習と選ぶ練習の両方になります。「ぶんしょうだい」は場面を絵で見せて、たし算・ひき算・ちがい・順番を扱います。「かく」は黒板のうすい字を指でなぞります(はみ出しが大きいときは1回だけやり直し、2回目は必ず合格にします)。</p>
     <p style="margin:4px 0">🥕にんじんは、授業1回で3本(ポテの間違いを直すと最大＋2本)。正解の数では増えません。おみせで、ごはん・ふく・へやのかざり・あそびの道具と交換します。</p>
     <p style="margin:4px 0">ポテの「おなか」は0〜100%。1日たつごとに40%減り、ごはんで回復します(レタス＋15%、にんじん＋25%、りんご＋35%、とうもろこし＋45%、いちご＋60%)。0%だと「あそびの じかん」で遊べません。80%以上で遊ぶと🥕が1本多くもらえます。</p>
     <p style="margin:4px 0">「あそびの じかん」は、授業を1回するごとに1回だけ。ゲームの問題は、お子さんがすでに授業でやった問題から出るので、遊びがそのまま復習になります。ゲームで間違えた問題は翌日の授業に出ます。</p></div>`);
  $("#btnShare").onclick=shareReport;
  $("#pmsgSend").onclick=()=>{const t=$("#pmsg").value;const lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
    if(!lines.length){$("#pmsgDone").textContent="文が空です。";return}
    S.letters.push({d:ymd(),lines,parent:true,read:false});if(S.letters.length>20)S.letters=S.letters.slice(-20);save(true);
    $("#pmsg").value="";$("#pmsgDone").textContent="届けました。ホーム画面でポテが知らせます。"};
  $("#pageBody").onclick=e=>{const b=e.target.closest("[data-set]");if(!b)return;const v=b.dataset.set;
    if(v.startsWith("sfx:")){S.settings.sfx=v.endsWith("1")}
    else if(v.startsWith("limit:"))S.settings.limit=Number(v.split(":")[1]);
    else if(v.startsWith("auto:")){const m=v.slice(5);
      if(m==="day"||m==="each")S.settings.autoMode=m;
      else if(m==="save"){S.settings.autoUrl=($("#autoUrl").value||"").trim()}
      else if(m==="test"){S.settings.autoUrl=($("#autoUrl").value||"").trim();save(true);const keep=S.autoLast;S.autoLast="";autoSend("テスト送信");if(!S.settings.autoUrl){S.autoLast=keep}
        ask(S.settings.autoUrl?"送りました。1〜2分で届かなければ、URLか手順を確認してください。":"URLが空です。","OK","OK");adultPage();return}}
    else if(v==="wake"){S.days[ymd()]=0}
    else if(v==="reset"){ask("記録をすべて消します。元に戻せません。","消さない","すべて消す").then(keepIt=>{if(keepIt)return;const keep=S.settings;S=freshState();S.settings=keep;save(true);adultPage()});return}
    save(true);adultPage()};
}
