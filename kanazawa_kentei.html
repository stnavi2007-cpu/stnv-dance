"},{"n":12,"q":"金沢21世紀美術館は、主にどのような美術品を展示しているか。","o":["伝統工芸（陶芸、漆芸、友禅など）","西洋の伝統美術作品（印象派の油絵や彫刻など）","日本の伝統美術作品（日本画など）","現代美術の作品（前衛的な絵画や彫刻、ポップアートなど）"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":13,"q":"金沢の旧町名の由来として正しくないものはどれか。","o":["小将町・・・藩主を護衛する小姓頭や小姓組の侍の屋敷がおかれた","主計町・・・藩士、富田主計の邸地があった","柿木畠・・・利家の出身地から来た商人、足軽などが住んでいた","長土塀・・・武士の屋敷の土塀が長く続いていた"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":14,"q":"明治31年（1898年）に、石川県で初めて営業を開始した「馬車鉄道」（線路の上の乗り物を馬が引っ張る鉄道）は、どことどこを結んでいたか。","o":["金石〜長田","金沢駅〜粟崎","三馬〜松任","野町〜額"],"a":1,"e":"","g":"歴史"},{"n":15,"q":"金沢市では、昭和20年（1945年）以前から栽培され、現在も金沢で栽培されている野菜15品目を「加賀野菜」と定めている。短く太い形が特徴で、甘みが強く煮崩れしにくい「○○だいこん」もその一つである。○にあてはまる漢字は何か。","o":["源助","桜島","青首","時無"],"a":1,"e":"","g":"食・行事"},{"n":16,"q":"大正14年（1925年）に、平沢嘉太郎が、浅野川電鉄と協力して巨額の資本を投じて作った一大レジャー施設は何か。","o":["宝塚遊園","金沢ヘルスセンター","粟崎遊園","涛々園"],"a":3,"e":"","g":"歴史"},{"n":17,"q":"加賀藩初代藩主の前田利家は武勇に優れていて、「（　　）の又左」といわれていた。どのような武器の名手だったか。","o":["弓","刀","鉄砲","槍"],"a":4,"e":"","g":"歴史"},{"n":18,"q":"金沢の年中行事を説明した文章として、正しくないものはどれか。","o":["1月初旬に出初式が行われるが、これは江戸時代の「加賀鳶」の伝統をうけついでいるものである","7月1日には、氷室の饅頭や竹輪を食べると一年間病気にかからないといわれている","お盆にお墓参りをするときには、「切籠」と呼ばれるあかりをつるす","3月15日の涅槃絵では、子どもたちは金沢に古くから伝わる「旗源平」で遊ぶ"],"a":4,"e":"","g":"食・行事"},{"n":19,"q":"8〜10世紀頃、現在の朝鮮民主主義人民共和国付近には、「渤海」という国があった。この国と日本との交流はさかんで、金沢の犀川河口が渤海の使者の受け入れ口であったといわれている。この交流があったことの証拠として「文様入り帯金具」が発見された金沢の遺跡は何か。","o":["塚崎遺跡","畝田ナベタ遺跡","高畠遺跡","真脇遺跡"],"a":2,"e":"","g":"歴史"},{"n":21,"q":"金沢市は伝統工芸が盛んであるが、生産量の全国に占める割合が99％を占めているものは何か。","o":["友禅染め","金箔","漆器","陶器"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":22,"q":"徳川家康は、前田利家の跡を継いだ前田利長が家康を討つ準備をしているという噂を聞き、加賀征伐の準備を始めた。その時、「母を思うがあまり、家をつぶすことがあってはならぬ。前田家のために母を捨てよ。」と利長に伝え、自ら人質として江戸へと旅立ったのはだれか。","o":["芳春院","天徳院","北政所","豪姫"],"a":1,"e":"","g":"偉人・人物"},{"n":23,"q":"明治21年（1888年）に日本初の耕地整理事業を成し遂げ、農業を発展させる土台をつくったのはだれか。","o":["森下八左衛門","後藤太兵衛","大野弁吉","高多久兵衛"],"a":4,"e":"","g":"偉人・人物"},{"n":24,"q":"高齢化社会を意識したコミュニティバスは、長町ルート、菊川ルート、材木ルート、此花ルートといった、公共交通の不便な地域を中心に、住宅地と交通の便利なところや商店街などを結んで循環している。大人100円、子ども50円で乗ることができるこのバスは、何というバスか。","o":["まちバス","兼六園シャトル","金沢ライトアップバス","ふらっとバス"],"a":4,"e":"","g":"市政・最近の話題"},{"n":25,"q":"冬の加賀料理といえば「かぶら寿し」があげられる。金沢の正月に欠かせないかぶら寿しに使われている食材は何か。","o":["加能ガニ","鯛","鰤","甘エビ"],"a":3,"e":"","g":"食・行事"},{"n":26,"q":"金沢市の水道は水質が良いことで全国的に有名である。この水源から採取された水は「金沢の水」として販売もされているが、その水源は次のうちのどれか。","o":["犀川上流のダム","浅野川上流のダム","井戸水","河北潟の水"],"a":1,"e":"","g":"自然・産業"},{"n":27,"q":"犀川と浅野川に挟まれた金沢市の中央部分は小立野とよばれている。ここの地形は次のうちのどれか。","o":["盆地","扇状地","三角州","台地"],"a":4,"e":"","g":"自然・産業"},{"n":28,"q":"金沢は大きな災害にあわなかったため、道路にはある特徴がみられる。どのような特徴か。","o":["金沢城を中心にして道路が放射状に延びている","迷路のようなせまい路地が多い","碁盤目のように整然としている","中心になる道路が1本あり、ほかには発達していない"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":29,"q":"現在、金沢城公園になっている場所には、以前何があったか。","o":["金沢大学","金沢市役所","金沢能楽美術館","石川県立歴史博物館"],"a":1,"e":"","g":"歴史"},{"n":30,"q":"「本多の森」にある、戦争中兵器の倉庫として使われていた赤レンガの建物は、終戦後昭和21年（1946年）に、平和を望む金沢市民の熱意によって、大学として生まれ変わった。現在小立野にあるこの大学は、どのような特色を持つ大学か。","o":["日本の伝統音楽や海外の音楽を学ぶことに特色をもつ大学","医学や介護、福祉を学ぶことに特色をもつ大学","美術や工芸、デザインを学ぶことに特色をもつ大学","化学や工業、機械を学ぶことに特色をもつ大学"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":31,"q":"大正4年（1915年）から昭和26年（1951年）まで金石の地でくりひろげられ、現在は卯辰山で毎年行われている高校のスポーツ大会の種目はどれか。","o":["相撲","野球","水泳","マラソン"],"a":1,"e":"","g":"食・行事"},{"n":32,"q":"金沢市は西部から東部に進むに従って標高が上がり、険しい地形となっている。金沢市で最も標高の高い山を何というか。","o":["医王山","キゴ山","奈良岳","三子牛山"],"a":3,"e":"","g":"自然・産業"},{"n":33,"q":"金沢で、昭和9年（1934年）から建てられてきた善隣館が現在、主に行っている活動はどれか。","o":["まちを元気にする商業活動","大雪のときに雪をどかす除雪活動","まちをきれいにする清掃活動","地域の人々とともに助け合う福祉活動"],"a":4,"e":"","g":"市政・最近の話題"},{"n":34,"q":"下のマークは、「まちのり」という、平成24年（2012年）3月に金沢市でスタートした、人や環境にやさしい公共レンタサイクルシステムのシンボルマークである。「まちのり」を説明したものとして、正しくないものはどれか。","o":["1日200円で、何回でも自転車を借りることができる","だれでもかんたんに自転車を借りることができる","自転車をみんなで共同利用できる","1回借りたら1日中返さなくてもよい"],"a":4,"e":"","g":"市政・最近の話題"},{"n":35,"q":"現在、石川県の人口は約116万人であるが、そのおよそ何％が金沢市に集中しているか。","o":["20％","40％","60％","80％"],"a":2,"e":"","g":"市政・最近の話題"},{"n":36,"q":"金沢市内で大正8年（1919年）につくられて以降、昭和42年（1967年）に廃止されるまで、金沢市民の足として親しまれていた乗り物がある。この乗り物は現在も福井市や富山市で走っている。さて、この乗り物は何か。","o":["路面電車（市内電車）","トロリーバス","モノレール","地下鉄"],"a":1,"e":"","g":"歴史"},{"n":37,"q":"平成27年（2015年）春に北陸新幹線が金沢まで開通し、東京まで乗り換えなしで行くことができる。北陸新幹線が通らない県はどこか。","o":["新潟県","富山県","岐阜県","長野県"],"a":3,"e":"","g":"市政・最近の話題"},{"n":38,"q":"明治時代に津田米次郎が発明したものは何か。","o":["羽二重を織る力織機","安全マッチ","うずまきポンプ","箔打ち機"],"a":1,"e":"","g":"偉人・人物"},{"n":39,"q":"文禄元年（1592年）、本格的な金沢城造りが始まったが、その周囲に位置する高くて頑丈な石垣の「石」は、どこの山から切り出されたものか。","o":["医王山","白山","戸室山","卯辰山"],"a":3,"e":"","g":"歴史"},{"n":40,"q":"加賀藩の「年寄」という藩の政治の最高の役職を務めた、本多氏・横山氏・長氏・奥村氏・前田氏・村井氏などを何というか。","o":["足軽","平士","与力","八家"],"a":4,"e":"","g":"歴史"},{"n":41,"q":"明治11年（1878年）に、旧加賀藩士の島田一良らが、当時の藩閥政治に対する不満から、東京麹町区紀尾井町の路上で、馬車で皇居へ向かう途中の政府高官を暗殺する事件を起こした。この時暗殺された内務卿（政府高官）はだれか。","o":["西郷隆盛","木戸孝允","大久保利通","板垣退助"],"a":3,"e":"","g":"歴史"},{"n":42,"q":"金沢の中心部に平成22年（2010年）4月に開館した「しいのき迎賓館」には、ギャラリー、観光案内所、レストランなどがもうけられている。もとはどのような建物だったか。","o":["裁判所","学校","県庁","図書館"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":43,"q":"明治時代に前田利家をまつるためにつくられた尾山神社の神門は、4色のギヤマン（色ガラス）がはめこまれており、当時としては大変珍しい建築物で、国の重要文化財に指定されている。この神門建設に携わり、金沢市の二代目市長となったのは、だれか。","o":["長谷川準也","稲垣嘉方","横山隆興","津田吉之助"],"a":1,"e":"","g":"偉人・人物"},{"n":44,"q":"金沢市で裏通りを歩いていると「こんな町が残っていたのか」と思うような、すてきな通りに出会う。写真は金石地区の写真である。このような「歴史を感じさせるちょっとしたいいまちなみ」を守るために、金沢市では平成6年（1994年）にきまりを作った。何というきまりか。","o":["駐車場条例","こまちなみ保存条例","金沢住宅地条例","みちしるべ条例"],"a":2,"e":"","g":"市政・最近の話題"},{"n":45,"q":"百万石まつりの記念行事として金沢城公園で再現された、藩政期に藩主の嫡子誕生や藩主の官位昇進などの慶事を、城下町挙げて祝った行事を何というか。","o":["喜慶日","大安日","大祭り","盆正月"],"a":4,"e":"","g":"食・行事"},{"n":46,"q":"下の地図のように、金沢の町には「六斗の（　　）」など他の都市ではあまり見られない広い空間がある。（　　）にはどの言葉が入るか。","o":["袋小路","広場","避難場所","広見"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":47,"q":"平安時代はじめの823年、加賀国が誕生した。どの国から分離したか。","o":["越中国","越前国","越後国","能登国"],"a":2,"e":"","g":"歴史"},{"n":48,"q":"明治20年（1887年）金沢で開校し、今の金沢大学の前身となった学校はどれか。","o":["第一高等中学校","第二高等中学校","第三高等中学校","第四高等中学校"],"a":4,"e":"","g":"歴史"},{"n":49,"q":"室町時代、金沢を含め北陸地方に一向宗（浄土真宗）を広めた人はだれか。","o":["親鸞","法然","蓮如","日蓮"],"a":3,"e":"","g":"歴史"},{"n":50,"q":"金沢は自然の豊かな土地で、山間地区から平地まで変化に富んでいる。森の都ともいわれる金沢市の、総面積に占める森林の割合は、何％か。","o":["40％","50％","60％","70％"],"a":3,"e":"","g":"自然・産業"}]},{"id":"j6c","label":"第6回ジュニア（中学生版）2011","q":[{"n":1,"q":"室町時代に、加賀の国の守護であった ,"a":1,"e":"","g":"歴史"},{"n":32,"q":"金沢には、昔から伝わる年中行事が今も数多く残っています。その中には、仏教や加賀百万石が関係したものが多くあります。次の中で、今ではあまり行われていないものはどれでしょうか。","o":["お盆にはお墓へ「きりこ」を持って行く。","加賀鳶出初式が行なわれる。","氷室まんじゅうを食べる。","お正月に宝船の絵を買う。"],"a":4,"e":"","g":"食・行事"},{"n":33,"q":"1895年（明治28年）金沢市長町に生まれ、1934年（昭和9年）「日本野鳥の会」をつくった（　　）は、自然のままの鳥と親しもうという思いをこめて「野鳥」ということば言葉もつくりました。この人はだれでしょうか。","o":["中西悟堂","三宅雪嶺","藤岡東圃","木村栄"],"a":1,"e":"","g":"偉人・人物"},{"n":34,"q":"金沢市と東京とは約300km離れています。では、金沢市と大阪市とは約何km離れているでしょうか。","o":["約200km","約250km","約300km","約350km"],"a":2,"e":"","g":"自然・産業"},{"n":35,"q":"金沢市は現在世界の7つの都市と姉妹都市になっています。その中の1つがアメリカのバッファロー市ですが、フランスではどこの都市と姉妹都市になっているでしょうか。","o":["ロサンゼルス市","パリ市","イルクーツク市","ナンシー市"],"a":4,"e":"","g":"市政・最近の話題"},{"n":36,"q":"三代藩主前田利常は、小松の町人板屋兵四郎に辰巳用水を作らせました。用水ができるまでに2年かかりましたが、そのとき、絵のような測量機を使いました。この測量器具は何といわれたでしょうか。","o":["もっこ","望遠鏡","見盤","方位台"],"a":3,"e":"","g":"歴史"},{"n":37,"q":"「高峰賞」で知られる高峰譲吉は心臓の働きを活発にしたり、血止めの働きもしたりする（　　）を発見しました。（　　）にあてはまるのは何でしょうか。","o":["タカジアスターゼ","インスリン","アドレナリン","カテキン"],"a":3,"e":"","g":"偉人・人物"},{"n":38,"q":"金沢市には多くの坂があります。江戸時代から坂の上に石工の職人の町があったことから名付けられ、清立寺坂、吹矢坂、くの字坂、Ｗ坂ともいわれている坂はどれでしょうか。","o":["嫁坂","広坂","馬坂","石伐坂"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":39,"q":"加賀藩には、「八家」と呼ばれ、一万石以上という大きな領地があたえられ、藩の政治の最高の役職になる家来がいました。「八家」でないのはどれでしょうか。","o":["武田","本多","横山","長"],"a":1,"e":"","g":"歴史"},{"n":40,"q":"西洋化を進めた明治時代には、金沢にも新聞、写真、人力車、洋服などが登場し、人々は新しいものに興味を持つようになりました。金沢で発行された新聞の第1号は、次のどれでしょうか。","o":["開化新聞","文化新聞","北陸新聞","金沢新聞"],"a":1,"e":"","g":"歴史"},{"n":41,"q":"加賀には数多くの伝統工芸が残っていますが、漆塗りの上に金や銀で絵模様を描いたものは何でしょうか。","o":["加賀友禅","加賀蒔絵","加賀象嵌","加賀刺繍"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":42,"q":"五代藩主前田綱紀の時代である1697年（元禄10年）の金沢の町の人口は、6万8636人だったといわれています。当時の1位は江戸でしたが、金沢は何位だったでしょうか。","o":["2位","4位","7位","10位"],"a":2,"e":"","g":"歴史"},{"n":43,"q":"金沢市の町名には、江戸時代の町の特色を表した町名が多くありました。それぞれ町名の由来で、正しくないものはどれでしょうか。","o":["金沢城の石垣用の戸室石を運んだ道筋なので、石引町。","町の川縁に多くの菊が植えられていたので、菊川町。","藩の材木蔵があったので、木倉町。","多くの寺があったので、寺町。"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":44,"q":"金沢には多くの用水が作られました。次の用水の中で、もともとかんがい（田んぼに水を引く）のために作られた用水ではないのは "","g":"偉人・人物"},{"n":22,"q":"加賀藩初代藩主の前田利家が亡くなったあとに正室まつが、名のった名前は何ですか。","o":["芳春院","寿福院","天徳院","高台院"],"a":1,"e":"","g":"偉人・人物"},{"n":23,"q":"明治21年（1888年）石川郡安原村(現在の上安原町）で、日本で最初の耕地整理事業（さまざまな形の田んぼを、たて、よこ一定の長さに整理すること）を成し遂げ、農業の発展に大きく貢献した人物はだれですか。","o":["森下八左衛門","稲垣義方","高多久兵衛","後藤太兵衛"],"a":3,"e":"","g":"偉人・人物"},{"n":24,"q":"大人100円、子ども50円で乗ることができる金沢を走るふらっとバスは、此花ルートなど、4つのルートを走っています。走っていないルートはどこですか。","o":["長町ルート","卯辰山ルート","菊川ルート","材木ルート"],"a":2,"e":"","g":"市政・最近の話題"},{"n":25,"q":"笠舞1丁目に名工といわれた藤原清光の碑がたっています。清光はどのような仕事をしていましたか。","o":["刀鍛冶","桶職人","鉄砲鍛冶","大工"],"a":1,"e":"","g":"美術・工芸・芸能"},{"n":26,"q":"明治時代に入ると、武士の生活はとても苦しくなりました。そこで、明治16年（1883年）に士族を救うために移住がすすめられました。3回の入植で金沢の79家族が移住し、前田村がつくられました。それは現在のどの都道府県ですか。","o":["北海道","青森県","岩手県","秋田県"],"a":1,"e":"","g":"歴史"},{"n":27,"q":"安政5年（1858年）、「安政の泣き一揆」がおこりました。この騒ぎで処刑された7人の霊をなぐさめるために、観音町の寿経寺に七稲地蔵がまつられています。さて、「安政の泣き一揆」のさけび声は、どのような声ですか。","o":["「ひもじいわいやー、米くれまいやー」","「年貢まけろー」","「仕事くれまいやー」","「市松やーい」"],"a":1,"e":"","g":"歴史"},{"n":30,"q":"金沢とその近郊でお正月によく食べるお菓子「福梅」について、正しく説明しているものはどれですか。","o":["兼六園のたくさんの紅梅が毎年美しく咲くので「福梅」と名付けられた","北野天満宮の献茶式で出された梅型のお菓子をヒントに前田家が作った","十三代藩主の前田斉広が金沢城二の丸御殿を新築した時に、お祝いにつくらせた","珠姫と三代藩主の前田利常の婚儀（結婚式）の時に出されたお菓子である"],"a":2,"e":"","g":"食・行事"},{"n":31,"q":"明治7年（1874年）、長町の川岸に、金沢市の二代目市長である長谷川準也によってつくられたのは、どのような工場ですか。","o":["製鉄場","ビール工場","製糸場","紡績工場"],"a":3,"e":"","g":"歴史"},{"n":34,"q":"自転車を借りたり、返したりすることがだれでもかんたんにでき、人にも環境にもやさしい金沢市公共レンタサイクルの出発式が平成24年（2012年）3月24日にありました。この公共レンタサイクルの愛称は何ですか。","o":["自転車のり","ベビのり","なみのり","まちのり"],"a":4,"e":"","g":"市政・最近の話題"},{"n":35,"q":"雨の多い金沢では市内21カ所にだれでも自由に借りることができる置き傘を無料で設置しています。金沢駅東口には、金沢を訪れる人に差し出す雨傘をイメージしたガラスのドームがあります。その建物は何とよばれていますか。","o":["百万石ドーム","もてなしドーム","金沢ドーム","雨傘ドーム"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":36,"q":"昔のまちなみを大切にする金沢市では、旧町名を復活させるという動きがあります。旧町名にはその土地にまつわる言い伝えなどがたくさんあり、住んでいる人たちにとっても、愛着やほこりを感じることができるのです。実際に復活した旧町名はどれですか。","o":["南町","九枚町","栄町","元車町"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":37,"q":"平成27年（2015年）春に北陸新幹線が金沢まで開通し、鉄道で東京と行き来する時間がとても短くなります。北陸新幹線を使うと、金沢から東京までどれくらいの時間がかかりますか。","o":["約1時間","約2時間30分","約4時間30分","約6時間"],"a":2,"e":"","g":"市政・最近の話題"},{"n":39,"q":"金石から金沢市の中心部へ一直線にのびる広い道路・金石街道（宮腰往還）は、港と中心部の間で荷物をスムーズに運べるようにつくられました。この道路はいつごろつくられましたか。","o":["江戸時代","明治時代","昭和年代","平成時代"],"a":1,"e":"","g":"歴史"},{"n":40,"q":"寿永2年（1183年）、平家は平維盛を総大将に、源氏は木曾義仲を中心に戦いました。その戦いの場所はどこですか。","o":["倶利伽羅","安宅","宮腰（金石）","鳴和"],"a":1,"e":"","g":"歴史"},{"n":41,"q":"金沢は本州のほぼ中央部にありますが、次の4つの都市で金沢から直線距離にして一番遠く離れている都市はどこですか。","o":["東京","名古屋","北九州","那覇"],"a":4,"e":"","g":"自然・産業"},{"n":43,"q":"緯度の変化を計算するXYの公式にZ項を発見し、地球上の緯度観測をより正確におこなえるようにしたのはだれですか。","o":["木村栄","高峰譲吉","谷口吉郎","枝権兵衛"],"a":1,"e":"","g":"偉人・人物"},{"n":45,"q":"金沢でお盆のお墓まいりをするときにつるす「あかり」のことを何といいますか。","o":["ちょうちん","きりこ","とうろう","ぼんぼり"],"a":2,"e":"","g":"食・行事"},{"n":47,"q":"金沢には加賀友禅や加賀蒔絵など、たくさんの伝統工芸が残っています。金沢の伝統工芸ではないものはどれですか。","o":["金沢和傘","二俣和紙","輪島塗","加賀提灯"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":48,"q":"金沢市では、加賀野菜など金沢市が生み出した商品や製品、また人や文化を国内外に発信しています。それらをまとめて何といいますか。","o":["金沢ナンバー","金沢ブランド","金沢フード","金沢グッズ"],"a":2,"e":"","g":"市政・最近の話題"},{"n":49,"q":"金沢市ではみんなが気持ちよくくらしていくために、一人ひとりがルールを守り、他の人にやさしくすることをめざしていく都市宣言を、平成19年（2007年）9月19日に議決しました。その都市宣言とは何ですか。","o":["グッドマナー実践都市宣言","安全・安心都市宣言","環境都市宣言","平和都市宣言"],"a":1,"e":"","g":"市政・最近の話題"},{"n":50,"q":"加賀藩三代藩主の前田利常は、力の強かった一向宗（浄土真宗）を信仰する人々をうまくおさめるために、お寺を3ヶ所に集めました。その3ヶ所に、あてはまらないのはどこですか。","o":["小立野台地","卯辰山麓","寺町台","兼六町"],"a":4,"e":"","g":"寺社・建造物・まち"}]},{"id":"j8e","label":"第8回ジュニア（小学生版）2013","q":[{"n":1,"q":"金沢市を流れる浅野川は、金沢の南東方向から北西方向に流れています。浅野川の水が流れ込む石川県で最も大きな湖はどれでしょうか。","o":["邑知潟","柴山潟","河北潟","琵琶湖"],"a":3,"e":"","g":"自然・産業"},{"n":2,"q":"金沢にはたくさんの方言があります。「きんかんなまなま」という方言の意味はどれでしょうか。","o":["道が凍ったようす","物が散らかったようす","魚が新鮮なようす","とても恐ろしいようす"],"a":1,"e":"","g":"金沢ことば"},{"n":3,"q":"加賀藩5代藩主の前田綱紀は、日本中から有名な学者を招き、藩内で学問を奨励しました。当時たくさん招いた学者の中で、漢学（中国の学問）では日本一といわれていた学者は誰でしょうか。","o":["木下順庵","津田米次郎","北方心泉","西田幾多郎"],"a":1,"e":"","g":"偉人・人物"},{"n":5,"q":"金沢城の堀を一部埋め立ててつくられた白鳥路という散歩道があります。そこには、金沢の三文豪の像がおかれています。次の中で、三文豪ではない人は誰でしょうか。","o":["室生犀星","徳田秋声","泉鏡花","尾山篤二郎"],"a":4,"e":"","g":"文学"},{"n":8,"q":"石川県沖で水揚げされたズワイガニは「加能ガニ」と呼ばれています。「加能ガニ」の中でも、金沢沖で獲れ金沢港に水揚げされた雌のズワイガニを何というでしょうか。","o":["加賀ズワイ","かないわ香箱","越前ガニ","紅ズワイ"],"a":2,"e":"","g":"自然・産業"},{"n":10,"q":"加賀藩初代藩主の前田利家は、加賀百万石にふさわしい城下町として、金沢を大きく発展させました。その功績をたたえて毎年6月に行われている祭りはどれでしょうか。","o":["ラ・フォル・ジュルネ","金沢ルネッサンスまつり","百万石まつり","山王まつり"],"a":3,"e":"","g":"食・行事"},{"n":11,"q":"金沢の伝統工芸「加賀友禅」や「九谷焼」で大切にされている、加賀五彩と呼ばれる5つの色があります。「赤」、「黄」、「緑」、「紺青」と、あとひとつは何色でしょうか。","o":["黒","紫","白","桃"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":12,"q":"金沢21世紀美術館は高い評価を受け、海外からも多くの観光客が訪れています。この美術館の愛称は何でしょうか。","o":["しろびぃ","かなびぃ","いしびぃ","まるびぃ"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":15,"q":"金沢の今町に生まれ、台湾に大きなダムや水路を完成させることで、不毛の大地を豊かな平野に変えた金沢の偉人は誰でしょうか。","o":["八田與一","中西悟堂","三宅雪嶺","木村栄"],"a":1,"e":"","g":"偉人・人物"},{"n":17,"q":"金沢の伝統工芸は藩政時代から守り続けられてきました。この昔から伝わる多くの伝統工芸の技を学ぶために、1989年（平成元）に建てられた施設は何でしょうか。","o":["中村記念美術館","前田土佐守家資料館","ふるさと偉人館","卯辰山工芸工房"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":19,"q":"茶の湯が盛んになった加賀藩では、いろいろな和菓子が考えられました。加賀藩5代藩主の前田綱紀の時代につくられるようになり、無病息災を祈って7月1日に食べるまんじゅうを何というでしょうか。","o":["五色まんじゅう","加賀まんじゅう","氷室まんじゅう","七夕まんじゅう"],"a":3,"e":"","g":"食・行事"},{"n":20,"q":"1894年（明治27）に、強い消化効力のある胃腸薬「タカジアスターゼ」を発明したのは誰でしょうか。","o":["杉田玄白","長谷川準也","赤羽萬次郎","高峰譲吉"],"a":4,"e":"","g":"偉人・人物"},{"n":21,"q":"金沢市は富山県と接しています。富山県との県境にそびえる標高939メートルの山を何というでしょうか。","o":["卯辰山","医王山","倉ヶ岳","立山"],"a":2,"e":"","g":"自然・産業"},{"n":22,"q":"仏教の考え方を英語の本や講演をとおして、アメリカをはじめとする世界中の人たちに広めた金沢市出身の哲学者は誰でしょうか。","o":["鈴木大拙","藤岡作太郎","蓮如","高山右近"],"a":1,"e":"","g":"偉人・人物"},{"n":24,"q":"加賀藩初代藩主の前田利家が、越前府中（福井県越前市）で初めて大名になったときに仕えていた殿様は誰でしょうか。","o":["織田信長","豊臣秀吉","佐々成政","柴田勝家"],"a":1,"e":"","g":"歴史"},{"n":26,"q":"日本で初めて、クリの巨大木柱根が350本以上（日本最多数）も発見され、毎年夏休みに古代体験まつりが開かれる縄文時代の遺跡はどこでしょうか。","o":["北塚遺跡","チカモリ遺跡","梅田遺跡","西念・南新保遺跡"],"a":2,"e":"","g":"歴史"},{"n":27,"q":"芋ほり藤五郎が砂金を洗った場所といわれる金洗沢（金城霊沢）は、どこにあるでしょうか。","o":["兼六園","金沢城","尾山神社","天徳院"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":28,"q":"農民や僧たちが中心になって一向一揆を起こし、守護である富樫氏をたおしたことから、加賀の国は「誰の持ちたる国」といわれるようになったでしょうか。","o":["町人","武士","職人","百姓"],"a":4,"e":"","g":"歴史"},{"n":29,"q":"金沢城のシンボル「石川門」の瓦は、普通の瓦に比べ落ち着いた銀色で、気品にみちた 沢市は公共交通を利用しやすくする一方で、金沢のまちを取り巻く内、中、外の3つの道路を整備しました。この道路を何というでしょうか。","o":["環状道路","自転車道路","生活道路","高速道路"],"a":1,"e":"","g":"市政・最近の話題"},{"n":12,"q":"狭くて入り組んだ金沢の旧市街を友禅模様に飾られたバスが4ルート走っています。誰もが気軽に買い物や散策に出かけられるよう、バスの入口から出口まで低くて段差のない床になっていることから名付けられたこのバスを何というでしょうか。","o":["べんりバス","ふらっとバス","まちなかバス","こまわりバス"],"a":2,"e":"","g":"市政・最近の話題"},{"n":14,"q":"1580年（天正8）に金沢御堂（尾山御坊）は金沢城となり、江戸時代の終わりまで政治の中心となっていました。この城の最初の城主は誰でしょうか。","o":["佐久間盛政","前田利常","前田光高","前田利長"],"a":1,"e":"","g":"歴史"},{"n":16,"q":"北陸新幹線の金沢駅舎は、犀川と浅野川を表現した曲面の屋根に、金沢漆器を思わせる外壁を取り入れ、「（　　）と（　　）」の調和をイメージしています。（　　）に入る言葉は何でしょうか。","o":["伝統・創造","伝統・継承","未来・創造","未来・継承"],"a":1,"e":"","g":"市政・最近の話題"},{"n":19,"q":"金沢が誇る清流や、緑豊かな自然、歴史あるまちなみを守りつつ、未来の子供たちに美しく健全なまち金沢を残そうと、1998年（平成10）に金沢市議会で議決されたのは次のどれでしょうか。","o":["用水保全条例","緑の都市宣言","こまちなみ保存条例","環境都市宣言"],"a":4,"e":"","g":"市政・最近の話題"},{"n":20,"q":"金沢市では、工芸に限らず、創造的なものづくりを国の内外に発信しています。手仕事の「手」とよいものを見極める「目」を表現した下のシンボルマークを何というでしょうか。","o":["テトメデス","テシゴトン","クラフトス","テメイイネ"],"a":1,"e":"","g":"市政・最近の話題"},{"n":22,"q":"金沢ではお祭りの楽しみのひとつに（　　）があります。お祭りが近づくとお囃子や棒振りの練習が始まり、若者から子供たちへと技が伝えられていきます。（　　）に入る言葉は何でしょうか。","o":["はしご登り","餅つき踊り","獅子舞","加賀宝生"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":23,"q":"1887年（明治20）、国は金沢に（　　）高等中学校を開校しました。のちに（　　）高等学校となり、日本を支える多くの人々を育てました。（　　）に入る言葉はどれでしょうか。","o":["第一","第二","第三","第四"],"a":4,"e":"","g":"歴史"},{"n":30,"q":"金沢では、市内のいたるところで沢やわき水が見られるほど昔から水が豊かで、この沢やわき水のことを（　　）と呼んでいます。（　　）に入る言葉は何でしょうか。","o":["ぶつぶつ","わっくわっく","どんどこ","もっくり"],"a":4,"e":"","g":"金沢ことば"},{"n":31,"q":"金沢では、火災発生の知らせで市民（消防団の団員）が消防車に乗り込み、火災現場へ行って消火にあたっています。金沢はこうした（　　）（消防団）が多いまちといわれています。（　　）に入る言葉は何でしょうか。","o":["消防応援","勇敢消防","義勇消防","ボランティア消防"],"a":3,"e":"","g":"市政・最近の話題"},{"n":35,"q":"金沢では、明治時代にすぐれた業績を残し、世界に誇ることのできる有名な人々を輩出しています。1894年（明治27）に、強い消化効力のある胃腸薬「タカジアスターゼ」を発明し、世界の薬学・医学の発展に大きく貢献した人は誰でしょうか。","o":["杉田玄白","高峰譲吉","野口英世","北里柴三郎"],"a":2,"e":"","g":"偉人・人物"},{"n":36,"q":"加賀藩3代藩主の前田利常は、金沢のあちこちにあった寺を卯辰山のふもとや、寺町・小立野に集め金沢城下を整備しました。城に水を引くため、利常が板屋兵四郎に命じてつくらせた用水を何というでしょうか。","o":["大野庄用水","長坂用水","鞍月用水","辰巳用水"],"a":4,"e":"","g":"歴史"},{"n":40,"q":"2004年（平成16）に金沢森本インターチェンジができ、さらに2012年（平成24）には白山インターチェンジが新設された新潟、富山、石川、福井、滋賀を結ぶ高速道路を何というでしょうか。","o":["北陸自動車道","のと里山海道","東名高速道路","名神高速道路"],"a":1,"e":"","g":"自然・産業"},{"n":42,"q":"金沢が生んだ三文豪の一人で、「うつくしき川は流れたりそのほとりに我は住みぬ」ではじまる詩『犀川』などがおさめられた詩集『抒情小曲集』の作者は誰でしょうか。","o":["徳田秋声","竹久夢二","室生犀星","泉鏡花"],"a":3,"e":"","g":"文学"},{"n":45,"q":"今から約450年前の1546年（天文15）に、金沢御堂（尾山御坊）が建てられました。それは現在のどのあたりでしょうか。","o":["金沢城公園のあたり","小立野宝円寺のあたり","卯辰山のふもと","金沢駅のあたり"],"a":1,"e":"","g":"歴史"},{"n":46,"q":"江戸時代、茶の湯がさかんになった加賀藩では色々な和菓子が考え出され、藩主への献上菓子として多く作られてきました。加賀藩2代藩主の前田利長の頃に作られた、結婚などのお祝い事のときに配られる和菓子を何というでしょうか。","o":["辻占","福梅","五色生菓子","金菓糖"],"a":3,"e":"","g":"食・行事"}]},{"id":"j10e","label":"第10回ジュニア（小学生版）2015","q":[{"n":2,"q":"1584年（天正12）に起きた、越中（富山県）の佐々成政と、加賀藩初代藩主の前田利家との戦いを何というでしょうか。","o":["倶利伽羅の合戦","志雄山の合戦","宮腰（金石）の合戦","末森の戦い"],"a":4,"e":"","g":"歴史"},{"n":6,"q":"金沢には、昔から金沢で栽培されている「加賀野菜」や、金沢の風土を生かして生産された「金沢そだち」など、多くの農産物があります。次のうち、「金沢そだち」の3品目にあてはまらないものはどれでしょうか。","o":["すいか","だいこん","なし","しいたけ"],"a":4,"e":"","g":"自然・産業"},{"n":8,"q":"加賀藩初代藩主の前田利家は、勇猛なだけでなく、戦の最中も軍用金や兵糧米の蓄えの計算をきめ細やかに行うなど、経済的な面でも優れた武将であったといわれています。利家が計算を行うため、いつも持ち歩いていたものは何でしょうか。","o":["算盤","茶器","軍配","秤"],"a":1,"e":"","g":"偉人・人物"},{"n":9,"q":"水が豊富なまち金沢は「用水のまち」としても有名で、用水は金沢市民の暮らしとは切っても切れない関係にありますが、市内を流れる用水の数はいくつあるでしょうか。","o":["15","35","55","75"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":10,"q":"城下町金沢は、大きな災害にあわなかったため、金沢城などの歴史的建築物やそのまわりの道に、藩政時代の城下町の面影が残っています。細く曲がりくねった小路をぬけたときに出会うことがある、広く開けた空間を何というでしょうか。","o":["集会場","広見","路地","公園"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":11,"q":"1488年（長享2）の長享の一揆で、加賀国の守護である富樫政親は、一揆軍に倒されてしまいました。こうして、富樫政親の滅んだ加賀国は「（　　）の持ちたる国」といわれるようになりました。（　　）に入る言葉は何でしょうか。","o":["武士","細工人","百姓","藩主"],"a":3,"e":"","g":"歴史"},{"n":13,"q":"金沢市は雪国としても知られ、昔の人々は雪とともに生きてきました。ところが、雪が1ヶ月も降り続き、生活に大混乱を与えた年があり、除雪や消雪などの雪対策が行われるようになりました。さて、この年の大雪のことを何というでしょうか。","o":["二四豪雪","三八豪雪","四五豪雪","五五豪雪"],"a":2,"e":"","g":"自然・産業"},{"n":14,"q":"1604年（慶長9）、加賀藩2代藩主の前田利長が関ヶ原の戦いで勝った記念に行われたのが始まりとされる能楽「寺中神事能」が演じられている神社はどれでしょうか。","o":["石浦神社","小坂神社","尾山神社","大野湊神社"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":15,"q":"金沢市では、歴史があり、町の特色を表している旧町名を1999年（平成11）以降復活させています。その第1号となった町名はどれでしょうか。","o":["主計町","飛梅町","南町","六枚町"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":16,"q":"1592年（文禄元）、加賀藩初代藩主の前田利家が、長男の利長に命じて本格的な城造りを始めました。その時中心になったのは、キリシタン大名としても有名な（　　）でした。（　　）には誰が入るでしょうか。","o":["高山右近","板屋兵四郎","前田利常","佐久間盛政"],"a":1,"e":"","g":"偉人・人物"},{"n":21,"q":"「加賀は天下の書府」であるとほめたたえたのは、江戸時代を代表する学者として有名な（　　）です。（　　）には誰が入るでしょうか。","o":["木下順庵","新井白石","稲生若水","前田綱紀"],"a":2,"e":"","g":"歴史"},{"n":22,"q":"明治から昭和にかけて、仏教を説明する英語の本を出版したり講演したりして、仏教の考え方を外国に伝えた人物がいます。2011年（平成23）には、この人物への理解を深めるため（　　）館が開設されました。（　　）には誰が入るでしょうか。","o":["鈴木大拙","木村栄","高峰譲吉","八田與一"],"a":1,"e":"","g":"偉人・人物"},{"n":23,"q":"金沢にはたくさんの方言があります。金沢の方言で、「雪に足がはまる」状態を表すのは次のどれでしょうか。","o":["ごぼる","じゃまない","むたむた","かたがる"],"a":1,"e":"","g":"金沢ことば"},{"n":27,"q":"金沢に初めて電灯がともったのは1894年（明治27）で、兼六園で開かれた関西府県連合共進会場と尾山神社の門前です。この計画の中心となった2代目の金沢市長は誰でしょうか。","o":["稲垣義方","山出保","長谷川準也","山野之義"],"a":3,"e":"","g":"偉人・人物"},{"n":28,"q":"兼六園に接し、緑に囲まれた「本多の森」に、3棟のレンガづくりの建物があります。2015年（平成27）4月にリニューアルし、愛称が「いしかわ赤レンガミュージアム」となった建物はどれでしょうか。","o":["金沢21世紀美術館","金沢くらしの博物館","石川県立能楽堂","石川県立歴史博物館"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":29,"q":"加賀藩藩主の前田利長や前田利常は、金沢城や城下を守るため、城の東西に堀を築きました。金沢城のまわりを二重に囲んで築かれたこの堀を何というでしょうか。","o":["大手堀","いもり堀","百間堀","惣構堀"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":30,"q":"金沢市では、自動車による渋滞をなくすために、歩行者と、バスなどの公共交通を優先するまちづくりを進めてきました。そのひとつである、自転車を借りたり返したりすることが簡単にできる、金沢市公共レンタサイクルを何というでしょうか。","o":["ベビのり","まちのり","のりのり","かるのり"],"a":2,"e":"","g":"市政・最近の話題"},{"n":35,"q":"江戸時代の初め、土地を開き水田を作るためには用水が必要でした。その頃に後藤太兵衛が中心となって完成させた、野田山の周辺をぐるっと回るように造られた用水を何というでしょうか。","o":["辰巳用水","長坂用水","七ヶ用水","鞍月用水"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":36,"q":"金沢には4つの市立図書館があります。そのうち、2011年（平成23）に開館した最も新しい図書館はどれでしょうか。","o":["玉川図書館","泉野図書館","玉川こども図書館","金沢海みらい図書館"],"a":4,"e":"","g":"市政・最近の話題"},{"n":43,"q":"江戸時代の加賀藩中級武士の屋敷の様子をよく伝え、金沢市の史跡文化財に指定されている家の住人であった（　　）は、藩から重要な職を任されていましたが、最後は藩から能登島に流されて生涯を終えました。（　　）には誰が入るでしょうか。","o":["道君","大野弁吉","寺島蔵人","木曽義仲"],"a":3,"e":"","g":"偉人・人物"},{"n":47,"q":"金沢には昔から伝わる年中行事が今も数多く残っていますが、江戸時代に、加賀藩から江戸の将軍に冬の間に保存しておいた氷を献上したことにちなんだ行事を何というでしょうか。","o":["出初式","氷室","左義長","ひな祭り"],"a":2,"e":"","g":"食・行事"}]},{"id":"j12e","label":"第12回ジュニア（小学生版）2017","q":[{"n":1,"q":"金沢市では、毎年6月に今の金沢市のもとをつくった（　　）の功績をたたえて「百万石まつり」が開かれています。（　　）には誰が入るでしょうか。","o":["織田信長","徳川家康","柴田勝家","前田利家"],"a":4,"e":"","g":"歴史"},{"n":3,"q":"「源助大根」や「へた紫ナス」など、1945年（昭和20）以前から現在まで、主に金沢で栽培されている野菜15品目を何というでしょうか。","o":["石川野菜","加賀野菜","昔野菜","金沢野菜"],"a":2,"e":"","g":"食・行事"},{"n":5,"q":"火災の知らせで消防団員の市民が消防車に乗り込み、火災現場へ行って消火にあたっています。金沢はこうした（　　）が多いまちといわれています。（　　）には何が入るでしょうか。","o":["消防応援","火災消防","義勇消防","ボランティア消防"],"a":3,"e":"","g":"市政・最近の話題"},{"n":6,"q":"線路上の乗り物を馬が引っ張るのを馬車鉄道といいます。1898年（明治31）石川県初の馬車鉄道が営業されたのは次のうちどの区間でしょうか。","o":["松任町～三馬村","野町～小立野","上金石～長田","兼六園下～寺町"],"a":3,"e":"","g":"歴史"},{"n":9,"q":"加賀藩3代藩主前田利常は、城下のあちらこちらに散らばっていた寺院を犀川口、浅野川口、小立野台に集めました。また、各村にあった一向宗の有力な寺院は金沢城下に散在させました。宝円寺など、前田家ゆかりの寺院が多くある寺院群はどれでしょうか。","o":["小立野寺院群","卯辰山山麓寺院群","寺町寺院群","法華宗寺院群"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":10,"q":"金沢には方言が今も数多く残っています。その中で、行儀がよい子を表す方言は、次のうちどれでしょうか。","o":["きかん子","じゃまない子","かたい子","むたむたな子"],"a":3,"e":"","g":"金沢ことば"},{"n":11,"q":"特別な建物の跡と思われる巨大なクリの木柱根が350本以上も発見された遺跡はどこでしょうか。","o":["チカモリ遺跡","畝田遺跡","北塚遺跡","寺中遺跡"],"a":1,"e":"","g":"歴史"},{"n":14,"q":"今から約40年～50年前には、金沢のいろいろなところで、水がわき出ていました。金沢ではこのような場所を水がわき出す様子から、何と呼ぶでしょうか。","o":["もっくり","とっくり","そっくり","ざっくり"],"a":1,"e":"","g":"金沢ことば"},{"n":18,"q":"加賀国の守護富樫政親がほろんだ後、加賀を治める本願寺の本拠地ともいえる尾山御坊が建てられました。尾山御坊が建てられたと考えられている場所は現在のどこの付近でしょうか。","o":["金沢駅付近","卯辰山付近","金沢海みらい図書館付近","金沢城公園付近"],"a":4,"e":"","g":"歴史"},{"n":20,"q":"金沢の方言には「こんにちは・こんばんは」を表す「まいどさん」などのあいさつ言葉があります。親しい人への「ありがとう」を表す金沢の方言は、次のうちどれでしょうか。","o":["じゃまない","あんやと","いんぎらぁっと","りくつな"],"a":2,"e":"","g":"金沢ことば"},{"n":23,"q":"江戸時代には街道が整えられ、物が運ばれたり、人が通ったりしました。金沢城下の上口と呼ばれる泉新町から、犀川大橋－片町－香林坊－南町－堤町－尾張町－橋場町－浅野川大橋、下口と呼ばれる大樋町を通るルートは何と呼ばれていたでしょうか。","o":["北陸自動車道","石川街道","北国街道","二俣街道"],"a":3,"e":"","g":"歴史"},{"n":24,"q":"金沢には、昔から伝わる年中行事が今も数多く残っています。金沢市内の消防団員が新年に出揃い、裸放水とはしご登りをする行事の名前は何でしょうか。","o":["出初式","左義長","地蔵盆","歳の市"],"a":1,"e":"","g":"食・行事"},{"n":25,"q":"加賀藩5代藩主前田綱紀は、学問好きで、多くの書物を集めたので、新井白石から「加賀は天下の（　　）」と言われ、うらやましがられました。（　　）には何が入るでしょうか。","o":["台所","政所","大学","書府"],"a":4,"e":"","g":"歴史"},{"n":26,"q":"金沢には藩政時代の文化が今もたくさん残っています。金石町や大野町では（　　）と呼ばれる珍しい行事が行われています。山伏が正月と祭りの時期に行っていたのが起源といわれています。この（　　）は市無形民俗文化財に指定されています。（　　）には何が入るでしょうか。","o":["獅子舞","餅つき踊り","悪魔払い","さかたおどり"],"a":3,"e":"","g":"食・行事"},{"n":28,"q":"室町時代は、戦いや争いが絶え間なく起こりました。人々は心の平安を求めて宗教にすがりました。このような時代に、北陸で浄土真宗を広めたのは誰でしょうか。","o":["蓮如","妙珍","運良","日乗"],"a":1,"e":"","g":"歴史"},{"n":29,"q":"加賀藩によって、金沢に招かれた京都の名工青木木米が、卯辰山のふもとの春日山で窯を開き再興した金沢の代表的な焼き物は何でしょうか。","o":["珠洲焼","九谷焼","信楽焼","清水焼"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":30,"q":"渤海は飛鳥時代末期に唐から独立した国です。渤海は唐に対抗するために、奈良時代から平安時代にかけて、日本との交流を進めたといわれています。遺跡から航海の無事を祈った鏡や、文様入り帯金具が発見された場所はどこでしょうか。","o":["犀川の河口","浅野川の河口","森下川の河口","伏見川の河口"],"a":1,"e":"","g":"歴史"},{"n":33,"q":"機械動力式の織機のことを力織機といいます。1900年（明治33）に、日本初のうすい絹織物を織る力織機を発明したのは、次のうち誰でしょうか。","o":["森下八左衛門","三浦彦太郎","大野弁吉","津田米次郎"],"a":4,"e":"","g":"偉人・人物"},{"n":35,"q":"珠姫は江戸幕府2代将軍徳川秀忠の次女で、徳川・前田両家を結ぶため、わずか3歳の時、加賀藩3代藩主前田利常の妻として金沢にやってきました。しかし、24歳という若さで亡くなりました。利常はその死を悲しみ、お寺をつくりました。このお寺には珠姫が作ったとされる紙ひな人形が置いてありますが、何というお寺でしょうか。","o":["伏見寺","宝円寺","松月寺","天徳院"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":45,"q":"江戸時代のはじめ、後藤太兵衛が中心となり、寺町台地一帯をうるおす用水をつくりました。この用水によって泉野村や泉野出村、泉野新村の水田から、たくさんの米が取れるようになったといわれています。野田山の周辺をぐるっと回るようにつくられたこの用水を何というでしょうか。","o":["大野庄用水","鞍月用水","辰巳用水","長坂用水"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":48,"q":"1592年（文禄元）、豊臣秀吉の命を受けて九州に出向いていた前田利家が、留守の利長に命じて、金沢城の本格的な城づくりが始まりました。その時に、金沢城の石垣にする石を切り出したことで有名な山はどれでしょうか。","o":["白山","卯辰山","戸室山","野田山"],"a":3,"e":"","g":"歴史"},{"n":49,"q":"金沢には、昔から伝わる風習が今も数多く残っています。その中で、お盆のお墓参りをするときに、持っていくものは、次のうちどれでしょうか。","o":["提灯","ランプ","雪洞","切籠"],"a":4,"e":"","g":"食・行事"}]},{"id":"j11e","label":"第11回ジュニア（小学生版）2016","q":[{"n":3,"q":"この大会は、国民に希望をあたえることと、体育を純粋なスポーツにすることを目標に計画され、第2回大会が「初の地方大会」として1947年（昭和22）に石川県で開催されました。この大会を何というでしょうか。","o":["金沢交歓球技大会","全国高等学校総合体育大会","全日本学生選手権大会","国民体育大会"],"a":4,"e":"","g":"歴史"},{"n":4,"q":"1671年（寛文11）、後藤太兵衛が寺町台地に田んぼを作るための用水を完成させました。犀川の支流の内川から水を引き、野田山の周りをぐるっと回るようにつくられた、この用水を何というでしょうか。","o":["鞍月用水","長坂用水","旭用水","大野庄用水"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":7,"q":"1925年(大正14)、平沢嘉太郎と浅野川電鉄が協力して、日本海を望む砂丘地に大きなレジャー施設をつくりました。劇場、料亭、レストラン、動物園、大浴場、野球場などをそなえた、この施設を何というでしょうか。","o":["卯辰山公園","日本海遊園","兼六園","粟崎遊園"],"a":4,"e":"","g":"歴史"},{"n":12,"q":"明治時代になると、身分制がなくなり、自分の力で生活を切り開いていくことが大切であると考えられるようになりました。そこで金沢藩では、1870年（明治3）に（　　）を開き、漢字・習字・算術などを教えました。（　　）には何が入るでしょうか。","o":["小学所","善隣館","御細工所","金沢医学館"],"a":1,"e":"","g":"歴史"},{"n":13,"q":"現在は金沢市郊外の角間にありますが、2005年（平成17）に移転するまでは金沢城内にあった大学はどれでしょうか。","o":["北陸大学","金沢星稜大学","金沢美術工芸大学","金沢大学"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":14,"q":"紀元前300年から紀元後300年までの約600年間は弥生時代と呼ばれ、大陸や朝鮮半島から新しい技術が伝わりました。金沢市で竪穴式住居跡や、弥生時代の土器・木製品が大量に出土したことで注目された遺跡はどこでしょうか。","o":["おまる塚古墳","西念・南新保遺跡","若松本泉寺跡","畝田ナベタ遺跡"],"a":2,"e":"","g":"歴史"},{"n":15,"q":"加賀藩3代藩主の前田利常の妻は、徳川2代将軍秀忠の娘である珠姫です。珠姫がつくったとされる紙ひな人形がある、珠姫ゆかりのお寺はどれでしょうか。","o":["芳春院","伏見寺","大乗寺","天徳院"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":24,"q":"金沢が生んだ三文豪として、室生犀星・徳田秋声・泉鏡花がいますが、「抒情小曲集」や「幼年時代」、「性に眼覚める頃」などの作品を発表した作家は誰でしょうか。","o":["徳田秋声","室生犀星","泉鏡花","尾崎紅葉"],"a":2,"e":"","g":"文学"},{"n":35,"q":"江戸時代では、金沢城まで水が行きわたらず、水不足になることがありました。1632年（寛永9）、金沢城に水を引くために、町人の板屋兵四郎がつくりあげた用水は次のうちどれでしょうか。","o":["小橋用水","泉用水","辰巳用水","旭用水"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":39,"q":"金沢市には、2004年（平成16）、市民が現代美術に触れるとともに、いろいろな芸術活動が行える場所として開館した美術館があります。小学4年生が作品を鑑賞する「ミュージアム・クルーズ」も行っている、この美術館を何というでしょうか。","o":["石川県立美術館","金沢21世紀美術館","金沢市立中村記念美術館","金沢能楽美術館"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":43,"q":"1707年（宝永4）、土屋又三郎が、1年間の農家の仕事について、月ごとにやるべき農作業を示した本を完成させました。北陸地方の農業の書物として特に有名な、この本を何というでしょうか。","o":["寺嶋随筆","老の道種","耕稼春秋","庶物類纂"],"a":3,"e":"","g":"歴史"},{"n":49,"q":"1616年（元和2）、加賀藩3代藩主の前田利常は、城下のあちらこちらに散らばっていた寺院や寺社を犀川口、浅野川口、小立野台に集め、3つの寺院群をつくりました。今年、「いしかわ歴史遺産」にも認定された、その3つの寺院群にあてはまらないものはどれでしょうか。","o":["蓮如寺院群","寺町寺院群","卯辰山麓寺院群","小立野寺院群"],"a":1,"e":"","g":"寺社・建造物・まち"}]},{"id":"j13e","label":"第13回ジュニア（小学生版）2018","q":[{"n":2,"q":"金沢にはさまざまなボランティア団体があります。そのうち、1994年（平成6）に設立され、金沢の方言で「こんにちは」を意味する名前の観光ボランティアガイドのことを何というでしょうか。","o":["おかげさん","ごきげんさん","まいどさん","ひゃくまんさん"],"a":3,"e":"","g":"市政・最近の話題"},{"n":4,"q":"江戸時代の有名な学者新井白石は「加賀は天下の書府」とほめたたえました。理由は、加賀藩5代藩主前田綱紀が、貴重な書物を国中から集めたことによりますが、もう一つの理由は何でしょうか。","o":["日本で初めての公共図書館ができたから","日本一大きな書店があったから","本を大量生産していたから","有名な学者を日本中から金沢に招いたから"],"a":4,"e":"","g":"歴史"},{"n":5,"q":"高尾城を築いた富樫政親は加賀一国の守護となりました。しかし、その政治に反対した農民や僧たちが中心となって政親を倒した後、加賀国は何と呼ばれたでしょうか。","o":["百姓の持ちたる国","武士の持ちたる国","地頭の持ちたる国","一向宗の持ちたる国"],"a":1,"e":"","g":"歴史"},{"n":6,"q":"尾山御坊のまわりにつくられた町には、西町、堤町、後町、南町などがあります。これらの町は金沢の始まりとなりました。このような町を何というでしょうか。","o":["金沢城下町","金沢本町","金沢寺内町","金沢地子町"],"a":3,"e":"","g":"歴史"},{"n":9,"q":"1874年（明治7）長町の川岸に、当時としては群馬県の富岡製糸場についで全国第2位の大きさの「金沢製糸場」がつくられました。この製糸場は金沢の近代工業が発展していくさきがけとなりましたが、「金沢製糸場」をつくり、金沢市の第2代市長にもなった人物は誰でしょうか。","o":["津田米次郎","長谷川準也","森下八左衛門","中橋徳五郎"],"a":2,"e":"","g":"偉人・人物"},{"n":12,"q":"縄文人は、高度な技術をもち、おしゃれで感性豊かな自然人でした。金沢市にある縄文時代中期の遺跡で、日本で初めての石の指輪や、ヒスイのペンダントが出土したのはどこでしょうか。","o":["吉野ヶ里遺跡","北塚遺跡","御経塚遺跡","三内丸山遺跡"],"a":2,"e":"","g":"歴史"},{"n":13,"q":"金沢市と富山県との境に位置し、スポーツセンター、自然公園、スキー場などがある山は次のうちどれでしょうか。","o":["奈良岳","大門山","国見山","医王山"],"a":4,"e":"","g":"自然・産業"},{"n":15,"q":"金沢には様々な伝統産業がありますが、中でも「加賀友禅」は、宮崎友禅斎によって作られた日本を代表する友禅染めです。加賀友禅は草花模様を主体にした絵画的な図柄が多く、加賀友禅で用いられる特徴的な技法として「ぼかし」がありますが、病葉の美を表した技法を何というでしょうか。","o":["青花","地染め","虫食い","友禅流し"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":16,"q":"加賀藩初代藩主前田利家の時代には、金沢城の中心は本丸にありましたが、1631年（寛永8）の大火災の後は再建されませんでした。その本丸に代わって政治の中心となった御殿はどこにあったでしょうか。","o":["玉泉院丸","二の丸","三の丸","新丸"],"a":2,"e":"","g":"歴史"},{"n":17,"q":"室町時代には、争いが絶え間なく起こりました。この時代に北陸にやって来た蓮如によって、加賀の農民たちに広まった仏教の宗派は次のうちどれでしょうか。","o":["浄土真宗","日蓮宗","曹洞宗","臨済宗"],"a":1,"e":"","g":"歴史"},{"n":20,"q":"加賀藩初代藩主前田利家が亡くなると、徳川家康は何かと無理を押しつけてきました。天下を取るために前田家の力をおそれていたからです。そこで、前田家には争いの意思がないことを信用してもらうために、富山城に隠居することで前田家を守った藩主は誰でしょうか。","o":["前田利長","前田利常","前田綱紀","前田斉広"],"a":1,"e":"","g":"歴史"},{"n":25,"q":"大正時代の終わり頃、金沢の海岸近くに大きなレジャー施設がつくられました。当時の人々が娯楽の場として楽しんだこの施設は何でしょうか。","o":["金石公園","西部緑地公園","粟崎遊園","日本海遊園"],"a":3,"e":"","g":"歴史"},{"n":26,"q":"武士が活躍した鎌倉時代には、「倶利伽羅の合戦」に代表されるように石川や富山でも源平の戦いがありました。このとき、加賀国の林・富樫・倉光・疋田という武士たちが味方について戦った人物は誰でしょうか。","o":["平維盛","源頼朝","源義経","源（木曽）義仲"],"a":4,"e":"","g":"歴史"},{"n":27,"q":"金沢市の地形は、東部には医王の山々があり、西部の海岸に向かって丘陵地から平野へと変化し、次第になだらかになっています。市の中心部は、犀川と浅野川が南東方向から北西方向にほぼ並行して流れており、この2つの河川の間は細長く台地がのびています。この犀川と浅野川の間の台地を何というでしょうか。","o":["小立野台地","寺町台地","長坂台地","卯辰台地"],"a":1,"e":"","g":"自然・産業"},{"n":37,"q":"加賀藩初代藩主前田利家の妻まつ（芳春院）は賢女と言われており、ある戦いの際には「城が落ちたら生きて帰るな」と利家たちを叱咤激励したとされていますが、この戦いを何というでしょうか。","o":["末森城の戦い","関ヶ原の戦い","豊臣秀吉との戦い","織田信長との戦い"],"a":1,"e":"","g":"歴史"},{"n":43,"q":"金沢には、その名前の由来となっているように、「沢」や「わき水」が多くあり、豊かで清らかな水を生かした様々な伝統産業があります。金沢の伝統産業の中で全国の総生産量の99％を占めているものがありますが、それは何でしょうか。","o":["絹織物","象嵌","水引き","金箔"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":46,"q":"江戸時代に北前船の立ち寄る港町として栄えた金石は、旧町名の復活を進めています。宮腰出身の豪商の生涯や北前船の歴史を知ることのできる金石地区にある資料館は次のうちどれでしょうか。","o":["木谷藤右衛門記念館","北前船の里資料館","老舗記念館","銭屋五兵衛記念館"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":48,"q":"「第2の市民芸術村」として2018年（平成30）5月に金沢市俵町にオープンした創作活動の拠点「俵スタジオ」は、それまであった建物を改築してできた施設です。改築される前は何の建物だったでしょうか。","o":["工場","美術館","小学校","公民館"],"a":3,"e":"","g":"市政・最近の話題"}]},{"id":"j14e","label":"第14回ジュニア（小学生版）2019","q":[{"n":1,"q":"金沢には加賀友禅や加賀蒔絵など、たくさんの伝統工芸があります。加賀藩初代藩主前田利家が金沢城入場後に、加賀藩御料紙（藩主や一族が使う紙）の指定産地になってから飛躍的に発展をとげた和紙を何というでしょうか。","o":["越前和紙","二俣和紙","能登和紙","金沢和紙"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":3,"q":"加賀藩3代藩主前田利常の妻は、徳川2代将軍秀忠の娘である珠姫です。珠姫がつくったとされる「紙ひな人形」が所蔵されている、珠姫ゆかりのお寺はどこでしょうか。","o":["雨宝院","大乗寺","妙立寺","天徳院"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":9,"q":"高尾城を築いた富樫政親は加賀一国の守護となりました。しかし、その政治に反対した農民や僧たちが中心となって守護富樫政親を倒したことにより、この後、加賀国は何と呼ばれたでしょうか。","o":["百姓の持ちたる国","僧侶の持ちたる国","町人の持ちたる国","一向宗の国"],"a":1,"e":"","g":"歴史"},{"n":16,"q":"1963年（昭和38）、北陸地方を中心に全国規模で降った大雪は「昭和三八豪雪」と呼ばれ、金沢市民の生活にも大きな被害を与えました。豪雪に名称がつけられたのは気象庁が始まって以来初めてのことであり、金沢気象台では観測史上最大の積雪量を記録しました。この時の金沢での最大積雪は何㎝だったでしょうか。","o":["91㎝","121㎝","181㎝","251㎝"],"a":3,"e":"","g":"自然・産業"},{"n":17,"q":"1858年（安政5）、凶作により米の値段が上がったことから、生活に苦しむ約2000人の人々が卯辰山から金沢城に向かって「ひもじいわいやー」「米くれまいやー」と叫び苦しさを訴えました。この訴えは何と呼ばれているでしょうか。","o":["土一揆","世直し一揆","泣き一揆","一向一揆"],"a":3,"e":"","g":"歴史"},{"n":23,"q":"2019年（平成31）4月、雨や雪などの天候に左右されず、年間を通して様々な運動ができる「屋内交流広場」が「金沢プール」の横に建てられました。この施設の愛称はどれでしょうか。","o":["アンブレーラかなざわ","ウテンケッコー","かなざわっこ広場","あめるんパーク"],"a":4,"e":"","g":"市政・最近の話題"},{"n":25,"q":"金沢市は、緑に恵まれた「森の都」と呼ぶにふさわしいまちですが、近年は人々と森や自然のふれあいが少なくなり、森林が荒れてきてます。そこで市民みんなで森を守り育てる活動をする目的で市が2003年(平成15)につくった条例は何でしょうか。","o":["金沢市伝統環境保存条例","金沢市自然環境保全条例","金沢市まちづくり条例","金沢市森づくり条例"],"a":4,"e":"","g":"市政・最近の話題"},{"n":29,"q":"金沢市は本州のほぼ中央部にあって、日本海に面しています。金沢市からの直線距離は、大阪市まで約250㎞、札幌市まで約800㎞です。では、首都の東京までは約何㎞でしょうか。","o":["200㎞","300㎞","450㎞","600㎞"],"a":2,"e":"","g":"自然・産業"},{"n":30,"q":"江戸時代、金沢町の町人のほとんどは（　　）に住んでおり、藩主の土地を使わせてもらっていることから地子銀を納めなくてはなりませんでした。（　　）に入る区分はどれでしょうか。","o":["本町","七ヶ所","地子町","寺社門前地"],"a":3,"e":"","g":"歴史"},{"n":32,"q":"加賀藩初代藩主前田利家が亡くなると、前田家に対し徳川家康は何かと無理を押しつけてきました。天下を取るために前田家の力をおそれていたからです。そこで、前田家には争いの意思がないことを信用してもらうために、富山城に隠居することで前田家を守ったのは誰でしょう。","o":["前田利長","前田慶寧","前田綱紀","珠姫"],"a":1,"e":"","g":"歴史"},{"n":40,"q":"兼六園に接し、緑に囲まれた「本多の森」に三棟の赤レンガづくりの建物があります。現在は「県立歴史博物館」になっていますが、1955年（昭和30）には、大学として使われていました。その大学の名前は何でしょうか。","o":["石川県立大学","石川県立看護大学","金沢大学","金沢美術工芸大学"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":42,"q":"2008年（平成20）の大雨は浅野川を氾濫させ、流域では大きな被害がありました。このような局地的な豪雨に対して、金沢市の同報防災無線の音声では住民に届かない所があることがわかったため、市がその対策として孤立するおそれがある山間地の各町会長宅に備えた災害情報伝達システムは何でしょうか。","o":["雨水情報システム","電光情報表示システム","自主防災組織無線システム","衛星電話システム"],"a":2,"e":"","g":"市政・最近の話題"},{"n":45,"q":"金沢の寺町や泉野がある寺町台地は水を得にくい土地でした。この土地で水田を作るために山中にトンネルを掘ったり、藪を切り開いたりして完成させた用水はどれでしょうか。","o":["長坂用水","泉用水","大野庄用水","辰巳用水"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":46,"q":"金沢には様々な伝統産業がありますが、中でも「加賀友禅」は、宮崎友禅斎によって作られた日本を代表する友禅染めです。加賀友禅は草花模様を主体にした絵画的な図柄が多く、加賀友禅で用いられる特徴的な技法として病葉の美を表した「虫食い」がありますが、その他に柄の端を濃く描き、中心に行くほど薄くぼかして行く技法を何というでしょうか。","o":["青花","地染め","ぼかし","友禅流し"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":48,"q":"金沢三文豪の一人である泉鏡花の作品は、正しく生きていく人々や弱い人々の姿を書き表したものが多くあります。次の中で泉鏡花の作品はどれでしょうか。","o":["抒情小曲集","縮図","義血狭血","幼年時代"],"a":3,"e":"","g":"文学"},{"n":49,"q":"金沢は雪国として知られ、市民は雪とともに生きてきました。北陸特有の湿った雪の重みで枝が折れないように木には（　　）が施され、その光景は金沢の冬の風物詩となっています。（　　）に入る言葉はどれでしょうか。","o":["雪囲い","こもかけ","枝守り","雪吊り"],"a":4,"e":"","g":"自然・産業"}]}];
// 分野タグ（本番の金沢検定の出題区分に寄せた分類。各問題の g に付与済み）
const GENRES=["歴史","偉人・人物","寺社・建造物・まち","美術・工芸・芸能","文学","食・行事","市政・最近の話題","自然・産業","金沢ことば"];
const ALL=[];
ROUNDS.forEach(r=>r.q.forEach(q=>ALL.push({...q,key:r.id+"-"+q.n,src:r.label+" 問"+q.n,g:q.g||"その他"})));

// ---- 記録（ブラウザに保存） ----
const store={
  load(){try{return JSON.parse(localStorage.getItem("kk_v2")||"null")||{q:{},hist:[]};}catch(e){return this._m||{q:{},hist:[]};}},
  save(s){this._m=s;try{localStorage.setItem("kk_v2",JSON.stringify(s));}catch(e){}}
};
let S=store.load();   // S.q[key]={seen,ok,ng,streak,last}  S.hist=[{d,mode,n,ok,rate}]
const rec=k=>S.q[k]||(S.q[k]={seen:0,ok:0,ng:0,streak:0,last:0});
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const KANA=["ア","イ","ウ","エ"];
const $app=document.getElementById("app");
const pct=(a,b)=>b?Math.round(a/b*100):0;

// 重み付き抽選：未出題・不正解が多い・連続正解が少ない問題ほど出やすい
function weighted(base,n){
  const items=base.map(q=>{const r=rec(q.key);let w=1;if(r.seen===0)w+=2;w+=r.ng*2;w-=Math.min(r.streak,3)*0.3;if(r.streak>=3)w*=0.4;return{q,w:Math.max(w,0.15)};});
  const out=[];while(out.length<n&&items.length){let t=items.reduce((s,x)=>s+x.w,0),x=Math.random()*t,i=0;for(;i<items.length;i++){x-=items[i].w;if(x<=0)break;}i=Math.min(i,items.length-1);out.push(items[i].q);items.splice(i,1);}
  return out;
}

// ---- メニュー ----
function menu(){
  const weakL=ALL.filter(q=>{const r=rec(q.key);return r.ng>0&&r.streak<2;});
  const seen=ALL.filter(q=>rec(q.key).seen>0).length;
  const tot=ALL.reduce((s,q)=>s+rec(q.key).seen,0),ok=ALL.reduce((s,q)=>s+rec(q.key).ok,0);
  const examN=Math.min(100,ALL.length);
  $app.innerHTML=`
   <h2>今日はどれで攻める？</h2>
   <p class="hint">登録 ${ALL.length} 問。出題は「まだ見てへん問題」「間違えた問題」ほど当たりやすい重み付きランダム。</p>
   <button class="btn" data-m="exam"><strong>模擬試験 ${examN}問</strong><small>本番形式：解説なしで最後まで解いて一括採点・90分タイマー</small></button>
   <button class="btn kusa" data-m="drill"><strong>練習 20問</strong><small>1問ごとに正誤と解説。空き時間用</small></button>
   <button class="btn enji" data-m="weak" ${weakL.length?"":"disabled"}><strong>苦手だけ</strong><small>${weakL.length?"未克服 "+weakL.length+" 問（2連続正解で卒業）":"未克服の問題なし"}</small></button>
   <button class="btn murasaki" data-m="genre"><strong>分野を選んで練習</strong><small>弱い分野を集中的に</small></button>
   <button class="btn odo" data-m="stats"><strong>成績・分析</strong><small>正答率 ${pct(ok,tot)}%　既出 ${seen}/${ALL.length} 問　受験 ${S.hist.length} 回</small></button>
   <p class="stat">合格ライン：正答率80%以上（金沢検定初級の本番と同じ）</p>`;
  $app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>({exam:()=>start("exam"),drill:()=>start("drill"),weak:()=>start("weak"),genre:genreMenu,stats:stats})[b.dataset.m]());
}
function genreMenu(){
  $app.innerHTML=`<h2>分野を選ぶ</h2><p class="hint">その分野の問題だけ、重み付きで最大20問。</p>`+
   GENRES.map(g=>{const qs=ALL.filter(q=>q.g===g);const t=qs.reduce((s,q)=>s+rec(q.key).seen,0),o=qs.reduce((s,q)=>s+rec(q.key).ok,0);
     return `<button class="btn murasaki" data-g="${g}" ${qs.length?"":"disabled"}><strong>${g}</strong><small>${qs.length}問　正答率 ${t?pct(o,t)+"%":"—"}</small></button>`;}).join("")+
   `<button class="next ghost" id="bk">メニューへ戻る</button>`;
  $app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>start("genre",b.dataset.g));
  document.getElementById("bk").onclick=menu;
}

// ---- 出題 ----
let M={};
function start(mode,genre){
  let base=ALL,n;
  if(mode==="weak"){base=ALL.filter(q=>{const r=rec(q.key);return r.ng>0&&r.streak<2;});n=base.length;}
  else if(mode==="genre"){base=ALL.filter(q=>q.g===genre);n=Math.min(20,base.length);}
  else if(mode==="exam"){n=Math.min(100,base.length);}
  else n=Math.min(20,base.length);
  M={mode,genre,pool:weighted(base,n),idx:0,ans:[],loop:false,round:0,t0:Date.now(),timer:null};
  if(mode==="exam"){M.timer=setInterval(tick,1000);}
  ask();
}
function tick(){const el=document.getElementById("tm");if(!el)return;const s=Math.max(0,5400-Math.floor((Date.now()-M.t0)/1000));el.textContent=`残り ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;if(s===0){clearInterval(M.timer);finish();}}
function ask(){
  const q=M.pool[M.idx],order=shuffle([0,1,2,3]),tot=M.pool.length;
  const ok=M.ans.filter(a=>a.ok).length,ng=M.ans.length-ok;
  $app.innerHTML=`
   <div class="top"><span>${M.loop?"弱点つぶし "+M.round+"周目":"問 "+(M.idx+1)+" / "+tot}</span><span>${M.mode==="exam"?'<span class="timer" id="tm"></span>':"正解 "+ok+"　不正解 "+ng}</span></div>
   <div class="bar"><i style="width:${M.mode==="exam"?M.idx/tot*100:ok/tot*100}%"></i>${M.mode==="exam"?"":`<b style="left:${ok/tot*100}%;width:${ng/tot*100}%"></b>`}</div>
   <p class="src"><span class="tag">${q.g}</span>${q.src}</p>
   <p class="q">${q.q}</p>
   ${order.map((oi,k)=>`<button class="opt" data-o="${oi}"><span class="k">${KANA[k]}</span>${q.o[oi]}</button>`).join("")}
   <div id="fb"></div>`;
  if(M.mode==="exam")tick();
  $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(q,+b.dataset.o,b));
  window.scrollTo(0,0);
}
function record(q,ok){const r=rec(q.key);r.seen++;r.last=Date.now();if(ok){r.ok++;r.streak++;}else{r.ng++;r.streak=0;}store.save(S);}
function answer(q,chosen,btn){
  const ok=chosen===q.a-1;
  M.ans.push({q,ok,chosen});
  if(!M.loop)record(q,ok); else if(ok){const r=rec(q.key);r.streak++;store.save(S);}
  $app.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  if(M.mode==="exam"){btn.classList.add("sel");setTimeout(()=>{M.idx++;M.idx<M.pool.length?ask():finish();},250);return;}
  $app.querySelectorAll(".opt").forEach(b=>{if(+b.dataset.o===q.a-1)b.classList.add("right");else if(b===btn)b.classList.add("wrong");});
  document.getElementById("fb").innerHTML=`
    <p class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解　正解は「"+q.o[q.a-1]+"」"}</p>
    <div class="exp"><div class="lab">解説（公式PDFより）</div>${q.e||'<span style="opacity:.6">この回は問題用紙のみ公開（公式解説なし）</span>'}</div>
    <button class="next" id="nx">${M.idx+1<M.pool.length?"次の問題へ":"結果を見る"}</button>`;
  const nx=document.getElementById("nx");nx.focus();nx.onclick=()=>{M.idx++;M.idx<M.pool.length?ask():finish();};
}

// ---- 結果 ----
function finish(){
  if(M.timer){clearInterval(M.timer);M.timer=null;}
  const missed=M.ans.filter(a=>!a.ok).map(a=>a.q);
  if(M.loop){
    if(!missed.length){$app.innerHTML=`<h2>弱点、全部つぶした</h2><p class="pass ok">${M.round}周で完全制覇。</p><button class="next" id="bk">メニューへ戻る</button>`;document.getElementById("bk").onclick=menu;return;}
    M.pool=shuffle(missed);M.ans=[];M.idx=0;M.round++;ask();return;
  }
  const tot=M.pool.length,ok=tot-missed.length,rate=pct(ok,tot),pass=rate>=80;
  S.hist.unshift({d:Date.now(),mode:M.mode,n:tot,ok,rate,sec:Math.floor((Date.now()-M.t0)/1000)});S.hist=S.hist.slice(0,50);store.save(S);
  // 分野別
  const gs={};M.ans.forEach(a=>{const g=gs[a.q.g]||(gs[a.q.g]={t:0,o:0});g.t++;if(a.ok)g.o++;});
  const label={exam:"模擬試験",drill:"練習",weak:"苦手だけ",genre:"分野練習"}[M.mode];
  $app.innerHTML=`
   <h2>${label}の結果</h2>
   <p class="big">${rate}<small>%（${ok} / ${tot}）</small></p>
   <p class="pass ${pass?"ok":"ng"}">${pass?"合格ライン到達。この調子や。":"80%に届いてへん。間違えた問題を今つぶす。"}</p>
   <h2 style="font-size:16px">今回の分野別</h2>
   ${Object.keys(gs).map(g=>gbar(g,gs[g].o,gs[g].t)).join("")}
   ${missed.length?`<h2 style="font-size:16px;margin-top:18px">間違えた ${missed.length} 問</h2>
   <ul class="miss">${M.ans.filter(a=>!a.ok).map(a=>`<li>${a.q.q}<span>選んだ：${a.q.o[a.chosen]}　→　正解：${a.q.o[a.q.a-1]}　｜ ${a.q.src}</span><div class="e">${a.q.e||'<span style="opacity:.6">この回は問題用紙のみ公開（公式解説なし）</span>'}</div></li>`).join("")}</ul>
   <div class="loopnote">間違えた問題だけをもう一度出す。全問正解するまで何周でも続く。</div>
   <button class="next" id="lp">弱点つぶしを始める</button>`:""}
   <button class="next ghost" id="bk">メニューへ戻る</button>`;
  const lp=document.getElementById("lp");if(lp)lp.onclick=()=>{M.loop=true;M.round=1;M.mode="drill";M.pool=shuffle(missed);M.ans=[];M.idx=0;ask();};
  document.getElementById("bk").onclick=menu;
}
function gbar(g,o,t){const r=pct(o,t);return`<div class="g"><div class="n"><span>${g}</span><span>${r}%（${o}/${t}）</span></div><div class="t"><i class="${r<60?"low":r<80?"mid":""}" style="width:${r}%"></i></div></div>`;}

// ---- 成績・分析 ----
function stats(){
  const tot=ALL.reduce((s,q)=>s+rec(q.key).seen,0),ok=ALL.reduce((s,q)=>s+rec(q.key).ok,0);
  const mastered=ALL.filter(q=>rec(q.key).streak>=2).length,weak=ALL.filter(q=>{const r=rec(q.key);return r.ng>0&&r.streak<2;}).length,unseen=ALL.filter(q=>rec(q.key).seen===0).length;
  const exams=S.hist.filter(h=>h.mode==="exam");
  const worst=ALL.filter(q=>rec(q.key).ng>0).sort((a,b)=>rec(b.key).ng-rec(a.key).ng).slice(0,10);
  $app.innerHTML=`
   <h2>成績・分析</h2>
   <div class="kv">
    <div><b>${pct(ok,tot)}%</b><small>通算正答率（${ok}/${tot}）</small></div>
    <div><b>${mastered}</b><small>克服済み（2連続正解）</small></div>
    <div><b>${weak}</b><small>未克服</small></div>
    <div><b>${unseen}</b><small>未出題</small></div>
   </div>
   <h2 style="font-size:16px">分野別 通算正答率</h2>
   ${GENRES.map(g=>{const qs=ALL.filter(q=>q.g===g);const t=qs.reduce((s,q)=>s+rec(q.key).seen,0),o=qs.reduce((s,q)=>s+rec(q.key).ok,0);return t?gbar(g,o,t):"";}).join("")||"<p class='hint'>まだ回答なし</p>"}
   <h2 style="font-size:16px;margin-top:18px">模擬試験の推移</h2>
   ${exams.length?`<table class="h">${exams.slice(0,10).map(h=>`<tr><td>${new Date(h.d).toLocaleDateString("ja-JP")}</td><td>${h.ok}/${h.n}</td><td><b style="color:${h.rate>=80?"var(--kusa)":"var(--enji)"}">${h.rate}%</b></td><td>${Math.floor(h.sec/60)}分</td></tr>`).join("")}</table>`:"<p class='hint'>まだ模擬試験を受けてへん</p>"}
   <h2 style="font-size:16px;margin-top:18px">よく間違える問題</h2>
   ${worst.length?`<ul class="miss">${worst.map(q=>`<li>${q.q.slice(0,50)}…<span>${rec(q.key).ng}回ミス　正解：${q.o[q.a-1]}</span></li>`).join("")}</ul>`:"<p class='hint'>なし</p>"}
   <button class="next ghost" id="bk">メニューへ戻る</button>
   <button class="next ghost" id="rs" style="color:var(--enji);border-color:var(--enji)">記録をすべて消す</button>`;
  document.getElementById("bk").onclick=menu;
  document.getElementById("rs").onclick=()=>{if(confirm("成績記録をすべて消す。ええか？")){S={q:{},hist:[]};store.save(S);menu();}};
}
menu();
</script>
</body>
</html>
