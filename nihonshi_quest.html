<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本史クエスト">
<meta name="theme-color" content="#f3efe6">
<meta name="robots" content="noindex">
<style>*{box-sizing:border-box}html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>日本史クエスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script>try{var t=localStorage.getItem("nq_theme");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
/* 和綴じの教科書：生成りの紙＋藍＋墨。スマホ縦で「問題→答え→次へ」を1画面に */
:root{
  --bg:#f3efe6; --card:#fbf9f3; --fg:#211d18; --muted:#6f685c; --line:#ddd4c2;
  --accent:#2d4a7a; --accent-soft:#e4e9f2; --onacc:#ffffff;
  --right:#2f7d4f; --right-bg:#e2f0e5; --wrong:#b23a35; --wrong-bg:#f6e2df; --warn:#9a6a12; --warn-bg:#f5ead3;
  --shadow:0 1px 3px rgba(40,30,15,.12);
  --disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17140f; --card:#221e18; --fg:#ece6da; --muted:#a39a89; --line:#3a3227;
  --accent:#8fb0e0; --accent-soft:#232c3a; --onacc:#10151d;
  --right:#7fc99a; --right-bg:#1d2e22; --wrong:#e39b96; --wrong-bg:#33211f; --warn:#e2b25a; --warn-bg:#33291a;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#17140f; --card:#221e18; --fg:#ece6da; --muted:#a39a89; --line:#3a3227;
  --accent:#8fb0e0; --accent-soft:#232c3a; --onacc:#10151d;
  --right:#7fc99a; --right-bg:#1d2e22; --wrong:#e39b96; --wrong-bg:#33211f; --warn:#e2b25a; --warn-bg:#33291a;
  --shadow:0 1px 3px rgba(0,0,0,.4); color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.6;-webkit-text-size-adjust:100%}
button{font-family:var(--body);color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
ruby rt{font-size:.56em;font-weight:400;color:var(--muted);letter-spacing:0}
body.noruby rt{display:none}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hbar{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));min-height:44px}
.logo{font-family:var(--disp);font-weight:800;font-size:1.1rem;margin-right:auto;cursor:pointer}
.logo b{color:var(--accent)}
.ib{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;font-size:.76rem;cursor:pointer;line-height:1}
.ib.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

main{padding-bottom:40px}
.lead{font-family:var(--disp);font-size:1.4rem;font-weight:800;text-wrap:balance;margin:18px 0 2px}
.sub{color:var(--muted);font-size:.84rem;margin-bottom:14px}
.sec{font-size:.74rem;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.sec .r{margin-left:auto;font-weight:500;letter-spacing:0}
.big{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--onacc);border:none;border-radius:13px;padding:14px 15px;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:var(--shadow);margin-bottom:9px}
.big .em{font-size:1.25rem;line-height:1;flex:none}
.big .tx{min-width:0;flex:1}
.big small{display:block;font-weight:400;font-size:.76rem;opacity:.85;margin-top:2px}
.big.gh{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.big .n{flex:none;color:var(--muted);font-weight:700;font-size:.8rem}
.big:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.chip small{opacity:.75;margin-left:3px}
.eras{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.era{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow);min-width:0}
.era .nm{font-family:var(--disp);font-weight:800;font-size:1rem;display:block}
.era .mt{color:var(--muted);font-size:.72rem;display:block}
.era .pb{height:3px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.era .pb i{display:block;height:100%;background:var(--accent)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(15,10,5,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-family:var(--disp);font-size:1.25rem;margin:0 0 4px}
.sheet p{color:var(--muted);font-size:.82rem;margin:0 0 12px}
.foot{color:var(--muted);font-size:.72rem;text-align:center;margin:26px 0 8px;line-height:1.7}

/* 出題画面 */
.qtop{display:flex;align-items:center;gap:6px;margin:10px 0 2px;font-size:.74rem;flex-wrap:wrap}
.tag{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:2px 10px;font-family:var(--disp)}
.tag.t2{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--body);font-weight:500}
.count{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.quit{border:none;background:none;color:var(--muted);font-size:.74rem;cursor:pointer;padding:2px 4px;text-decoration:underline}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--accent)}
.q{font-family:var(--disp);font-weight:600;font-size:1.06rem;line-height:1.6;margin-bottom:10px;max-height:30vh;overflow-y:auto}
.hist{font-size:.72rem;color:var(--muted);margin:-4px 0 8px;font-variant-numeric:tabular-nums}
.hist b{font-weight:700}.hist .o{color:var(--right)}.hist .x{color:var(--wrong)}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:.95rem;cursor:pointer;box-shadow:var(--shadow);line-height:1.55}
.opt .k{flex:none;width:21px;height:21px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.76rem;display:grid;place-items:center;margin-top:1px}
.opt.ok{border-color:var(--right);background:var(--right-bg)}.opt.ok .k{background:var(--right);color:var(--card)}
.opt.ng{border-color:var(--wrong);background:var(--wrong-bg)}.opt.ng .k{background:var(--wrong);color:var(--card)}
.opt:disabled{cursor:default}
.prevbtn{margin-top:10px;border:1px dashed var(--line);background:none;border-radius:10px;padding:8px 10px;font-size:.8rem;color:var(--muted);cursor:pointer;width:100%}
.reviewnote{background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:6px 10px;font-size:.78rem;margin:8px 0;font-weight:700}
.exp{margin-top:12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.exp summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;font-size:.82rem;color:var(--accent)}
.exp summary::-webkit-details-marker{display:none}
.exp .b{padding:0 12px 12px;font-size:.9rem;line-height:1.75}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(30,20,10,.12);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.abar .in{max-width:560px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vd{font-family:var(--disp);font-weight:800;font-size:1rem;flex:none}
.vd.o{color:var(--right)}.vd.x{color:var(--wrong)}
.al{font-size:.84rem;color:var(--muted);min-width:0;flex:1 1 140px}
.al b{color:var(--fg)}
.row{display:flex;gap:8px;width:100%}
.nx{flex:1;background:var(--accent);color:var(--onacc);border:none;border-radius:11px;padding:12px;font-weight:700;font-size:1rem;cursor:pointer}
.fl{flex:none;width:52px;border:1px solid var(--line);background:var(--bg);border-radius:11px;font-size:1.1rem;cursor:pointer}
.fl.on{background:var(--warn-bg);border-color:var(--warn)}
.grad{width:100%;font-size:.76rem;color:var(--right);font-weight:700}
body.hasbar main{padding-bottom:170px}

/* 結果・成績 */
.score{font-family:var(--disp);text-align:center;margin:22px 0 4px}
.score .bg{font-size:2.8rem;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.score .pc{color:var(--muted);margin-top:6px}
.msg{text-align:center;font-family:var(--disp);font-size:1.05rem;font-weight:700;margin:4px 0 18px}
.rv{border:1px solid var(--line);border-left:4px solid var(--wrong);border-radius:10px;background:var(--card);padding:9px 12px;margin-bottom:8px}
.rv .rq{font-size:.9rem;line-height:1.55}
.rv .ra{font-size:.82rem;margin-top:4px}.rv .ra b{color:var(--right)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.stat .h{display:flex;align-items:baseline;gap:8px}
.stat .h b{font-family:var(--disp);font-size:1rem}
.stat .h span{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.danger{border:1px solid var(--wrong);color:var(--wrong);background:none;border-radius:10px;padding:9px 12px;font-size:.84rem;cursor:pointer;width:100%;margin-top:6px}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.84rem;z-index:40;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <span class="logo" id="logo">日本<b>史</b>クエスト</span>

</div></header>
<main class="wrap"><div id="view"></div></main>
<div class="abar" id="abar" hidden><div class="in" id="abarIn"></div></div>
<div id="sheet"></div>

  ["junban","年代順",["junban"]],["jinbutsu","人物",["jinbutsu"]],["sakuhin","作品",["sakuhin"]],["yogo","用語",["yogo"]],["shogun","将軍・執権",["shogun"]]];

/* ---------- ふりがな ---------- */
const RIDX={};Object.keys(DATA.ruby).forEach(k=>{(RIDX[k[0]]=RIDX[k[0]]||[]).push(k)});
Object.values(RIDX).forEach(a=>a.sort((x,y)=>y.length-x.length));
const CTX=DATA.ctx;
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function R(t){
  let o="",i=0;
  while(i<t.length){
    const c=t[i], ks=RIDX[c]; let h=null;
    if(ks) for(const k of ks){ if(t.startsWith(k,i)){h=k;break;} }
    if(h){ o+="<ruby>"+esc(h)+"<rt>"+esc(DATA.ruby[h])+"</rt></ruby>"; i+=h.length; continue; }
    if(CTX[c]){ const [rd,fs]=CTX[c]; if(fs.some(f=>f===""?i===t.length-1:t.startsWith(f,i+1))){ o+="<ruby>"+c+"<rt>"+rd+"</rt></ruby>"; i++; continue; } }
    o+=esc(c); i++;
  }
  return o;
}

function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- 出題の範囲 ---------- */
function typeOn(q){return ST.types.includes(T2G[q.t]);}
function sig(){return ST.types.slice().sort().join(",");}
function listFor(mode,era){
  const gi=GROUPS.findIndex(g=>g[0]===era);
  return Q.filter(q=>typeOn(q)&&(mode==="all"||(mode==="only"&&q.g===era)||(mode==="from"&&GROUPS.findIndex(g=>g[0]===q.g)>=gi))).map(q=>q.id);
}
function scopeKey(mode,era){return mode+":"+(era||"")+"|"+sig();}
function scopeLabel(mode,era){return mode==="all"?"全部・時代順":mode==="only"?GNAME[era]+"だけ":GNAME[era]+"から最後まで";}

  h+=`</div>
  <div class="sec">記録</div>
  <button class="big gh" onclick="stats()"><span class="em">📊</span><span class="tx">成績・時代別の正答率</span></button>
  <div class="foot">中学〜高校の日本史教科書で太字になる重要事項をもとに作った問題です。<br>元号は、改元の月とできごとの月がずれて答えがまぎらわしいものは出題していません。<br>記録はこの端末のブラウザに保存されます。<br>最終更新：2026年10月22日</div>`;
  view.innerHTML=h; scrollTo(0,0);
}
function togType(k){
  const i=ST.types.indexOf(k);
  if(i>=0){ if(ST.types.length===1){toast("最低1つは選んでください");return;} ST.types.splice(i,1);} else ST.types.push(k);
  save(); menu();
}
function eraSheet(k){
  const L=listFor("only",k), F=listFor("from",k), p=ST.prog[scopeKey("only",k)]||0, pf=ST.prog[scopeKey("from",k)]||0;
  $("#sheet").innerHTML=`<div class="sheet" onclick="if(event.target===this)this.remove()"><div class="in">
   <h3>${GNAME[k]}</h3><p>時代の流れの順に出題します。途中でやめても、次は続きから。</p>
   <button class="big" onclick="startSeq('only','${k}')"><span class="em">▶</span><span class="tx">${GNAME[k]}だけ${p&&p<L.length?"・続きから":""}<small>${p&&p<L.length?`${p+1}問目から／`:""}全${L.length}問</small></span></button>
   <button class="big gh" onclick="startSeq('from','${k}')"><span class="em">⏩</span><span class="tx">${GNAME[k]}から最後まで${pf&&pf<F.length?"・続きから":""}<small>${pf&&pf<F.length?`${pf+1}問目から／`:""}全${F.length.toLocaleString()}問</small></span></button>
   ${(p||pf)?`<button class="big gh" onclick="resetProg('${k}')"><span class="em">↺</span><span class="tx">この時代の進み具合を最初にもどす<small>正答率や苦手の記録は消えません</small></span></button>`:""}
   <button class="big gh" onclick="$('#sheet').innerHTML=''"><span class="em">✕</span><span class="tx">閉じる</span></button>
  </div></div>`;
}
function resetProg(k){delete ST.prog[scopeKey("only",k)];delete ST.prog[scopeKey("from",k)];save();menu();toast("進み具合を最初にもどしました");}

/* ---------- セッション ---------- */
function newSess(o){S=Object.assign({idx:0,right:0,done:0,wrong:[],ans:null,prev:null,review:false,t0:Date.now()},o);saveSess();}
function saveSess(){if(!S)return;lset("nq_sess",{mode:S.mode,list:S.list,idx:S.idx,right:S.right,done:S.done,wrong:S.wrong,label:S.label,scope:S.scope||null,ans:S.ans,prev:S.prev,t0:S.t0});}
function endSession(){S=null;try{localStorage.removeItem("nq_sess");}catch(e){}}
function confirmLeave(){return true;}
function startSeq(mode,era){
  const list=listFor(mode,era); if(!list.length){toast("この範囲に問題がありません");return;}
  const sk=scopeKey(mode,era); let p=ST.prog[sk]||0; if(p>=list.length)p=0;
  newSess({mode:"seq",list,idx:p,label:scopeLabel(mode,era),scope:sk}); $("#sheet").innerHTML=""; show();
}
function worst(ids){
  return ids.slice().sort((a,b)=>{const ra=ST.rec[a]||{s:0,n:0,k:0},rb=ST.rec[b]||{s:0,n:0,k:0};
    if((ra.s||0)!==(rb.s||0))return (ra.s||0)-(rb.s||0);
    const pa=ra.n?ra.k/ra.n:0,pb=rb.n?rb.k/rb.n:0; if(pa!==pb)return pa-pb; return (rb.n-rb.k)-(ra.n-ra.k);});
}
function startList(kind){
  const ids=Object.keys(ST[kind]).filter(id=>id in QI); if(!ids.length)return;
  newSess({mode:kind,list:worst(ids),label:kind==="ng"?"苦手だけ":"要注意だけ"}); show();
}
function startRandom(){
  const pool=Q.filter(typeOn).map(q=>q.id); for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  newSess({mode:"rand",list:pool.slice(0,20),label:"ランダム20問"}); show();
}

/* ---------- 出題 ---------- */
function shuf4(){const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const KN=["ア","イ","ウ","エ"];
function histHtml(id){const r=ST.rec[id]; if(!r||!r.n) return `<div class="hist">はじめての問題</div>`;
  return `<div class="hist">過去 ${[...(r.l||"")].map(c=>`<b class="${c==="○"?"o":"x"}">${c}</b>`).join("")}　通算 ${r.k}/${r.n}${(r.s||0)>=3?"　🎓":""}</div>`;}
function head(q,i,n){
  return `<div class="qtop"><span class="tag">${GNAME[q.g]}</span><span class="tag t2">${TNAME[T2G[q.t]]}</span><span class="tag t2">${S.label}</span>
  <span class="count">${(i+1).toLocaleString()} / ${n.toLocaleString()}</span><button class="quit" onclick="quit()">中断</button></div>
  <div class="bar"><i style="width:${Math.round(i/n*100)}%"></i></div>`;
}
function optsHtml(q,order,mark,chosen){
  return `<div class="opts">`+order.map((oi,p)=>{
    let c=""; if(mark){ if(oi===q.a)c="ok"; else if(oi===chosen)c="ng"; }
    return `<button class="opt ${c}" data-oi="${oi}" ${mark?"disabled":""} onclick="answer(${oi})"><span class="k">${KN[p]}</span><span>${R(q.o[oi])}</span></button>`;}).join("")+`</div>`;
}
function show(){
  if(!S)return menu();
  if(S.idx>=S.list.length) return finish();
  const q=Q[QI[S.list[S.idx]]]; if(!q){S.idx++;return show();}
  S.review=false;
  if(!S.ans||S.ans.id!==q.id) S.ans={id:q.id,order:shuf4(),chosen:null};
  saveSess();
  let h=head(q,S.idx,S.list.length)+`<div class="q">${R(q.q)}</div>`+histHtml(q.id)+optsHtml(q,S.ans.order,S.ans.chosen!=null,S.ans.chosen);
  if(S.prev && S.ans.chosen==null) h+=`<button class="prevbtn" onclick="showPrev()">← 前の問題を見直す</button>`;
  view.innerHTML=h; scrollTo(0,0);
  if(S.ans.chosen!=null) afterAnswer(q,S.ans.chosen,false); else hideBar();
}
function answer(oi){
  if(!S||S.review)return; const q=Q[QI[S.list[S.idx]]]; if(S.ans.chosen!=null)return;
  S.ans.chosen=oi; const ok=oi===q.a;
  S.done++; if(ok)S.right++; else if(!S.wrong.includes(q.id))S.wrong.push(q.id);
  const r=ST.rec[q.id]||{n:0,k:0,s:0,l:""}; r.n++; if(ok){r.k++;r.s=(r.s||0)+1;}else r.s=0; r.l=((r.l||"")+(ok?"○":"×")).slice(-10); ST.rec[q.id]=r;
  let grad="";
  if(!ok) ST.ng[q.id]=1;
  else{ if(ST.ng[q.id]&&r.s>=3){delete ST.ng[q.id];grad="🎓 3回連続正解で苦手を卒業";}
        if(ST.flag[q.id]&&r.s>=3){delete ST.flag[q.id];grad=(grad?grad+"・":"🎓 ")+"要注意も卒業";} }
  if(S.mode==="seq") ST.prog[S.scope]=S.idx+1;
  save(); saveSess();
  view.querySelectorAll(".opt").forEach(b=>{const o=+b.dataset.oi;b.disabled=true;if(o===q.a)b.classList.add("ok");else if(o===oi)b.classList.add("ng");});
  const pb=view.querySelector(".prevbtn"); if(pb)pb.remove();
  afterAnswer(q,oi,true,grad);
}
function afterAnswer(q,oi,fresh,grad){
  const ok=oi===q.a;
  if(!view.querySelector(".exp")){const d=document.createElement("details");d.className="exp";d.innerHTML=`<summary>ポイント ▼ 解説をひらく</summary><div class="b">${R(q.x)}</div>`;view.appendChild(d);}
  document.body.classList.add("hasbar");
  $("#abarIn").innerHTML=`<span class="vd ${ok?"o":"x"}">${ok?"○ 正解":"× 不正解"}</span><span class="al">正解：<b>${R(q.o[q.a])}</b></span>
   ${grad?`<span class="grad">${grad}</span>`:""}
   <div class="row"><button class="nx" onclick="next()">${S.idx+1<S.list.length?"次の問題へ →":"結果を見る →"}</button>
   <button class="fl ${ST.flag[q.id]?"on":""}" onclick="togFlag('${q.id}',this)" aria-label="要注意に入れる">🔖</button></div>`;
  abar.hidden=false;
}
function togFlag(id,el){ if(ST.flag[id]){delete ST.flag[id];toast("要注意から外しました");} else {ST.flag[id]=1;toast("🔖 要注意に入れました");} save(); el.classList.toggle("on",!!ST.flag[id]); }
function next(){
  const q=Q[QI[S.list[S.idx]]]; S.prev={id:q.id,order:S.ans.order,chosen:S.ans.chosen};
  S.idx++; S.ans=null; saveSess(); show();
}
function showPrev(){
  const p=S.prev, q=Q[QI[p.id]]; S.review=true;
  let h=head(q,S.idx-1,S.list.length)+`<div class="reviewnote">見直し中（記録には入りません）</div><div class="q">${R(q.q)}</div>`+histHtml(q.id)+optsHtml(q,p.order,true,p.chosen)
   +`<details class="exp" open><summary>ポイント</summary><div class="b">${R(q.x)}</div></details>`;
  view.innerHTML=h; scrollTo(0,0); document.body.classList.add("hasbar");
  $("#abarIn").innerHTML=`<span class="al">正解：<b>${R(q.o[q.a])}</b></span><div class="row"><button class="nx" onclick="show()">→ 今の問題に戻る</button></div>`;
  abar.hidden=false;
}
function quit(){ finish(true); }

/* ---------- 結果 ---------- */
function finish(stopped){
  hideBar();
  const n=S.done, r=S.right, pct=n?Math.round(r/n*100):0, done=!stopped&&S.idx>=S.list.length;
  if(done&&S.mode==="seq") ST.prog[S.scope]=0, save();
  const msg=!n?"またいつでも続きからどうぞ":pct===100?"全問正解！お見事":pct>=80?"ようできてる。この調子":pct>=60?"あと少し。苦手で固めよう":"苦手だけで復習すると伸びるで";
  let h=`<div class="score"><div class="bg">${r} / ${n}</div><div class="pc">${n?`正答率 ${pct}％・`:""}${S.label}${done&&S.mode==="seq"?"・最後まで制覇":""}</div></div><div class="msg">${msg}</div>`;
  if(S.mode==="seq"&&!done) h+=`<div class="sub" style="text-align:center">次は ${(ST.prog[S.scope]||0)+1} 問目から続きます</div>`;
  if(S.wrong.length){ h+=`<div class="sec">今回まちがえた問題（${S.wrong.length}）・苦手に入りました</div>`;
    S.wrong.forEach(id=>{const q=Q[QI[id]];h+=`<div class="rv"><div class="rq">${R(q.q)}</div><div class="ra">正解：<b>${R(q.o[q.a])}</b></div></div>`;}); }
  h+=`<div style="margin-top:16px">`;
  if(S.wrong.length) h+=`<button class="big" onclick="retryWrong()"><span class="em">🔁</span><span class="tx">今回まちがえた${S.wrong.length}問をやり直す</span></button>`;
  h+=`<button class="big gh" onclick="endSession();menu()"><span class="em">☰</span><span class="tx">メニューへ戻る</span></button></div>`;
  const w=S.wrong.slice(); S.lastWrong=w;
  if(S.mode==="seq"&&stopped&&S.ans&&S.ans.chosen!=null){}
  view.innerHTML=h; scrollTo(0,0);
  window._lastWrong=w; endSession();
}
function retryWrong(){ const w=window._lastWrong||[]; if(!w.length)return; newSess({mode:"retry",list:w.slice(),label:"まちがい直し"}); show(); }

/* ---------- 成績 ---------- */
function stats(){
  hideBar();
  let tn=0,tk=0,ans=0; Object.values(ST.rec).forEach(r=>{tn+=r.n;tk+=r.k;ans++;});
  let h=`<div class="lead">成績</div><div class="sub">解いた問題 ${ans.toLocaleString()} / ${Q.length.toLocaleString()}・通算 ${tk.toLocaleString()} / ${tn.toLocaleString()} 正解${tn?`（${Math.round(tk/tn*100)}％）`:""}</div>
  <div class="sec">時代別（最新の回答で集計）</div>`;
  function block(name,ids){let a=0,o=0;ids.forEach(id=>{const r=ST.rec[id];if(r&&r.n){a++;if(r.l.slice(-1)==="○")o++;}});
    const p=a?Math.round(o/a*100):0, col=!a?"var(--line)":p>=80?"var(--right)":p>=60?"var(--warn)":"var(--wrong)";
    return `<div class="stat"><div class="h"><b>${name}</b><span>${a?p+"％":"未回答"}</span></div><div class="l">解いた ${a}/${ids.length}・苦手 ${ids.filter(id=>ST.ng[id]).length}</div><div class="meter"><i style="width:${a?p:0}%;background:${col}"></i></div></div>`;}
  GROUPS.forEach(([k,n])=>{h+=block(n,Q.filter(q=>q.g===k).map(q=>q.id));});
  h+=`<div class="sec">種類別</div>`;
  TYPES.forEach(([k,n,ts])=>{h+=block(n,Q.filter(q=>ts.includes(q.t)).map(q=>q.id));});
  h+=`<div class="sec">記録の消去</div><button class="danger" id="rs" onclick="askReset()">すべての記録を消す</button>
  <button class="big gh" style="margin-top:14px" onclick="menu()"><span class="em">☰</span><span class="tx">メニューへ戻る</span></button>`;
  view.innerHTML=h; scrollTo(0,0);
}
function askReset(){const b=$("#rs"); if(b.dataset.c){ST={rec:{},ng:{},flag:{},prog:{},types:ST.types};save();toast("記録を消しました");menu();} else {b.dataset.c=1;b.textContent="本当に消す（もう一度タップ）";}}

/* ---------- 起動：途中の問題があれば再開 ---------- */
(function boot(){
  const s=lget("nq_sess",null);
  if(s&&s.list&&s.list.length&&Date.now()-(s.t0||0)<7*864e5&&s.idx<s.list.length){
    S=Object.assign({review:false},s);
    if(S.ans&&S.ans.chosen!=null){ const q=Q[QI[S.list[S.idx]]]; S.prev={id:q.id,order:S.ans.order,chosen:S.ans.chosen}; S.idx++; S.ans=null; }
    show(); return;
  }
  menu();
})();
</script>
