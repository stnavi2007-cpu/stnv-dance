らきち）","杉田定一（すぎたていいち）","島田一良（しまだいちろう）","遠藤秀景（えんどうひでかげ）"],"a":3,"e":"島田一良は、泉寺町（いずみでらまち）の三光寺（さんこうじ）に集まり、「三光寺派」となり、政治を変えるためには言論ではなく、武力も必要だと考えた。この事件は藩閥（はんばつ）政府に対する最後の武力による抵抗（ていこう）で、これ以後は言論による自由民権運動へと完全に移り変わっていった。","g":"偉人・人物"},{"n":11,"q":"金沢港は 1954 年（昭和 29）に、大野港ともう一つの港が合併（がっぺい）してできた。もう一つの港はどれか。","o":["金石（かないわ）港","粟崎（あわがさき）港","浅野川（あさのがわ）港","専光寺（せんこうじ）港"],"a":1,"e":"江戸（えど）時代、金石は宮腰（みやのこし）と呼ばれ、北前船が立ち寄る港町としておおいに栄えた。","g":"市政・最近の話題"},{"n":12,"q":"第二次世界大戦が終わってから2年後の、1947 年（昭和 22）、金沢である全国的な大会が開催（かいさい）された。この大会の開会式のセレモニーでは、市内の小学生による「若い力」が初めて披露（ひろう）されたが、この大会は何か。","o":["緑の国民大会","海の国民大会","国民体育大会","山の国民大会"],"a":3,"e":"国民に希望をあたえることと体育を純粋（じゅんすい）なスポーツにすることを目標に、第1回大会は京都府で開かれ、次の第2回大会が「初の地方大会」として石川県で開催された。","g":"歴史"},{"n":13,"q":"大正時代から昭和初期にかけて金沢の市街地は「モダン都市」の色合いがこくなり、石造りやレンガ造りの建物が建てられた。金沢のモダンな文化の象徴（しょうちょう）となった香林坊（こうりんぼう）は当時、何と呼ばれたか。","o":["ＫＯＵＲＩＮ（コウリン）","ＢＯＵ（ボウ）","ＫＯＵＢＯＵ（コウボウ）","ＲＩＮＢＯＵ（リンボウ）"],"a":4,"e":"香林坊では、カフェ文化が花開き、最盛期（さいせいき）には80軒（けん）ともいわれる数のカフェが市内にオープンし、官庁やビジネス街のサラリーマンたちを引きつけた。","g":"歴史"},{"n":14,"q":"金沢には、1873 年（明治6）に軍隊が創設され、2年後に□とよばれた部隊になった。1896 年（明治 29）には第九師団配下となり、日露（にちろ）戦争にも参加した。□に入る名前はどれか。","o":["第五連隊","第七連隊","第十連隊","第十五連隊"],"a":2,"e":"第九師団の時、金沢には1万人以上の兵士やその家族が住むこととなり、その数は当時の市の人口の 10 分の1にあたる。このことから、金沢は「軍都」と呼ばれていた。","g":"歴史"},{"n":15,"q":"現在、金沢市は世界の7都市と姉妹都市提携（ていけい）をしており、多くの交流事業を行っている。姉妹都市提携をしているのは、アメリカ合衆国の「バッファロー市」、ブラジル共和国の「ポルト・アレグレ市」、ベルギー王国の「ゲント市」、フランス共和国の「ナンシー市」、中華（ちゅうか）人民共和国の「蘇州（スーチョウ）市」、大韓（だいかん）民国の「全州（ジョンジュ）市」とあと1都市はロシア連邦（れんぽう）の何という都市か。","o":["ブラーツク市","イルクーツク市","ヤクーツク市","ペトロザボーツク市"],"a":2,"e":"イルクーツク市とは中学生同士の交流事業が行われており、ホームステイ、学校訪問、意見交換（こうかん）会などを通して交流を深めている。","g":"市政・最近の話題"},{"n":16,"q":"金沢には、優れた陶器（とうき）がある。青木木米（あおきもくべい）が再興した九谷焼と裏千家の千仙叟（せんのせんそう）が京都から一緒（いっしょ）に連れてきた陶器の焼物師である陶工（とうこう）の長左衛門（ちょうざえもん）が焼いた□がある。□に入るものはどれか。","o":["大樋焼（おおひやき）","春日焼（かすがやき）","京焼（きょうやき）","越前焼（えちぜんやき）"],"a":1,"e":"大樋焼は、ろくろを使わず手びねりによって 1 つ 1 つ手でつくられる。釉薬（ゆうやく）がとけているときに窯（かま）から引き出す製法から、独特の味わいのある飴色（あめいろ）の茶器が作り出される。","g":"美術・工芸・芸能"},{"n":17,"q":"1871 年（明治 4）、横山町（よこやまちょう）で生まれ、25 歳（さい）の時に東京へ出て、尾崎紅葉（おざきこうよう）の門下生になり、「あらくれ」「縮図（しゅくず）」などの作品を発表した、2021 年（令和 3）に生誕 150 年をむかえる金沢が生んだ三文豪（ぶんごう）の1人は誰（だれ）か。","o":["泉鏡花（いずみきょうか）","室生犀星（むろうさいせい）","竹久夢二（たけひさゆめじ）","徳田秋聲（とくだしゅうせい）"],"a":4,"e":"浅野川（あさのがわ）にかかる梅ノ橋（うめのはし）のたもとにある徳田秋聲（とくだしゅうせい）記念館は、黒瓦（くろがわら）屋根の採用、格子を取り入れた外観、土塀（どべい）など、周辺の環境（かんきょう）に調和し、金沢の街並みに似合う建物で、多くの遺品・直筆原稿（げんこう）・筆跡（ひっせき）・初版本などを収蔵している。","g":"文学"},{"n":18,"q":"明治の初め、金沢での近代工業の始まりとされる工場が、長谷川準也（はせがわじゅんや）によって現在の中央小学校の所に建てられたが、何の工場か。","o":["製糸","製陶（せいとう）","製布","製紙"],"a":1,"e":"「金沢製糸場」は、1874 年（明治7）つくられた。当時としては、国が作った富岡製糸場（群馬県）に次いで、全国第2位の大きな工場だった。蚕（かいこ）のまゆから糸をつむぐ半木製（はんもくせい）のくり糸機が 200 台あり、鞍月（くらつき）用水から水を引き、大きな水車を使ってこの機械（きかい）を動かした。","g":"歴史"},{"n":19,"q":"加賀藩（はん）では、1792 年（寬政（かんせい）4）に、現在の兼六園内に藩校（はんこう）を建てた。このうち、士農工商の身分を問わず、8歳（さい）以上の男子が入校でき、儒学（じゅがく）を中心に漢字・算術・医学・天文学などを学ぶことができた藩校を何というか。","o":["経武館（けいぶかん）","壮猶館（そうゆうかん）","適塾（てきじゅく）","明倫堂（めいりんどう）"],"a":4,"e":"経武館も兼六園内に建てられた。経武館は、武芸の鍛錬（たんれん）を目的として剣術（けんじゅつ）・弓術（きゅうじゅつ）・柔術（じゅうじゅつ）・槍術（そうじゅつ）などを学ぶことができた。","g":"歴史"},{"n":20,"q":"金沢には、金沢をホームタウンとしたスポーツ団体があるが、ドイツ語にちなむ言葉と金沢の方言にも通ずるサッカーのチーム名はどれか。","o":["金沢学院クラブ","ツエーゲン金沢","石川ミリオンスターズ","金沢武士団（サムライズ）"],"a":2,"e":"ドイツ語で「2」を意味する”Zwei（ツヴァイ）”と「進む」を意味する”Gehen（ゲーン）”から「チームとサポーターがともに進んでいく」という意味。また、金沢弁で「強いんだ！（つぇーげん！）」の意味も持つ。","g":"市政・最近の話題"},{"n":21,"q":"金沢市では、未来を担う子どもの健やかな育ちと子育て家庭を支える施策（しさく）を積極的に展開し、市民一人ひとりが未来の金沢を創る子どもたちのために役割を持ち、子どもを安心して産み育てられる環境（かんきょう）づくりの推進のために 2020 年（令和2）に「かなざわ子育て夢プラン 2020」をつくった。このプランの基本理念「みんなで□支え合う　子育ての喜びを分かち合う　まち金沢」の□に入るのは何か。","o":["つながり","まとまり","くらし","創造し"],"a":1,"e":"子どもを持ちたい希望がかえられ、誰（だれ）もが子育ての喜びを共有できる社会を目指そうとつくられたプランである。","g":"市政・最近の話題"},{"n":22,"q":"江戸（えど）時代中期に、天候の異常で加賀藩内（はんない）にたくさんの生活に困窮（こんきゅう）した住民が出た時、金沢の笠舞（かさまい）に「お救い小屋」を設けて、食糧（しょくりょう）や衣料をあたえただけでなく、自立して生活できるよう、職業訓練のようなことや新田を開いて移住させるなどの政策をとった。この政策の指導をしたのは加賀藩何代藩主の誰（だれ）か。","o":["2代藩主前田利長（まえだとしなが）","3代藩主前田利常（まえだとしつね）","5代藩主前田綱紀（まえだつなのり）","6代藩主前田吉徳（まえだよしのり）"],"a":3,"e":"「お救い小屋」は、幕末まで存続した。特に、1830 年（天保（てんぽう）元）からの数年間、加賀藩でも大変な飢饉（ききん）におそわれ、この時「お救い小屋」には 4000 人もの人々が収容された。","g":"歴史"},{"n":23,"q":"金沢市では、スポーツを盛んにすることで、まちの活力を高めようとしている。2019 年（平成 31）には、雨の日が多い金沢でもいろいろな運動ができ、子どもの運動機能の発達をサポートする屋内交流広場がオープンしたが、この屋内交流広場の愛称（あいしょう）は何か。","o":["はれるんパーク","あめるんパーク","ふせぐんパーク","うるるんパーク"],"a":2,"e":"金沢プールに隣接（りんせつ）した交流広場で、「のびのび広場」や「親子アスレチックゾーン」などの総合施設（しせつ）である。","g":"市政・最近の話題"},{"n":24,"q":"1584 年（天正 12）に起こった末森（すえもり）の戦いは、加賀藩（はん）初代藩主前田利家（まえだとしいえ）と越中（えっちゅう）の□との戦いである。□に入るのは誰（だれ）か。","o":["柴田勝家（しばたかついえ）","徳川家康（とくがわいえやす）","佐々成政（さっさなりまさ）","豊臣秀吉（とよとみでひよし）"],"a":3,"e":"この末森の戦いは、秀吉の天下統一を進めるうえで大きな役割を果たした。利家にとっても加賀、能登、越中を治めるきっかけになった。","g":"歴史"},{"n":25,"q":"江戸（えど）時代、金沢の町の真ん中に位置する金沢城は、加賀藩主（はんしゅ）が住み、藩の仕事をする武士が勤めていた。明治になると軍隊が入った。第二次世界大戦後に軍隊にかわり、ある施設（しせつ）が整備されたがその施設はどれか。","o":["観光会館","レジャーランド","展望台","大学"],"a":4,"e":"1949 年(昭和 24)、新制大学として金沢大学が誕生し、法文・教育・理の3学部は金沢城内にキャンパスがあった。以後、角間（かくま）キャンパス移転まで全国的にもめずらしい「お城の中の大学」として親しまれた。1996 年（平成8）に石川県は金沢大学の跡地（あとち）を取得し、金沢城公園として整備を始めた。築城以来、初めて市民が自由に出入りできる場所となった。","g":"歴史"},{"n":26,"q":"もともと紡績（ぼうせき）工場の施設（しせつ）だった場所を、1996 年（平成8）に市民が自主的に企画（きかく）したコンサートや芸術の練習の場として開設したが、現在は何と呼ばれているか。","o":["金沢市民芸術村","金沢市文化ホール","本多の森ホール","石川県立美術館"],"a":1,"e":"金沢市民芸術村では、市民が自主的に企画したコンサートや芸術・文化（演劇（えんげき）・音楽など）の練習の場として親しまれている。","g":"市政・最近の話題"},{"n":27,"q":"金沢市は、清流や緑豊かな自然、歴史あるまちなみを守りつつ、未来の子どもたちに美しく健全なまち金沢を残そうと、1998 年（平成 10）に「環境（かんきょう）都市宣言」を議決した。さらに、2016 年（平成 28）には、「文化を育み、心をうるおす豊かな自然を明日に」を基本理念として、水と緑に育まれたすべての生命が光かがやくまちをめざして「金沢版□戦略」を定めた。□に入る言葉はどれか。","o":["持続社会","環境基本","森の都建設","生物多様性"],"a":4,"e":"「金沢版生物多様性戦略」の基本目標として「自然や生きものを大切にした環境づくり」「生物多様性を未来に継承（けいしょう）していくためのひとづくり」をかかげている。","g":"市政・最近の話題"},{"n":28,"q":"2020 年（令和 2）12 月、「伝統建築工匠（こうしょう）の技」が国連教育科学文化機関［UNESCO（ユネスコ）］の無形文化遺産に登録されることが決定した。そのなかには、金沢の伝統工芸もふくまれているがどれか。","o":["加賀友禅（かがゆうぜん）","金沢仏壇（かなざわぶつだん）","縁付金箔（えんつけきんぱく）","金沢和傘（かなざわわがさ）"],"a":3,"e":"縁付(えんつけ)は、柿渋(かきしぶ)などを染みこませた和紙とうすく延ばした金を交互（こうご）にはさみ、くり返し打ち延ばす製法で、完成した金箔(きんぱく)をうすい和紙にのせたとき、紙が箔（はく）を縁（ふち）取るように見えることから「縁付(えんつけ)」と呼ばれている。","g":"美術・工芸・芸能"},{"n":29,"q":"金沢市では、「金沢市地域□計画」に基づき、近隣（きんりん）の人々と心を通わせ、助け合えるまちの実現のため、人々が集う地域サロンの開催（かいさい）や世代間交流などを行ってきた。□に入るものはどれか。","o":["健康","介護（かいご）","保護","福祉（ふくし）"],"a":4,"e":"近年では、各地域で高齢（こうれい）者の見守りや声かけ、除雪などのボランティアの協力が行われている。","g":"市政・最近の話題"},{"n":30,"q":"江戸（えど）時代後半に、京都から金沢に移り住んで染め物の技法を伝え「加賀友禅（かがゆうぜん）」を作り出したのは誰（だれ）か。","o":["五十嵐道甫（いがらしどうほ）","清水九兵衛（しみずくへい）","宮崎友禅斎（みやざきゆうぜんさい）","後藤程乗（ごとうていじょう）"],"a":3,"e":"宮崎友禅斎は、34 歳（さい）頃（ごろ）から京都で新しい模様染めを発表し、友禅染で知られるようになった。60 歳を過ぎた 1718 年(享保（きょうほう）3)頃、金沢に移り住んで、加賀染を改良した「加賀友禅」を作り出した。","g":"偉人・人物"},{"n":31,"q":"1888 年（明治 21）、現在の上安原町において日本で最初の耕地整理を行い、農業発展の基礎（きそ）をつくったのは誰（だれ）か。","o":["高多久兵衛（たかたきゅうべえ）","勝海舟（かつかいしゅう）","大石内蔵助（おおいしくらのすけ）","黒川良安（くろかわまさやす）"],"a":1,"e":"高多久兵衛は田を区画整理し、農業の改革をうったえた。高多久兵衛の耕地整理の成功を見に多くの人が各地から訪れた。","g":"偉人・人物"},{"n":32,"q":"1974 年（昭和 49）、金沢市議会で「緑の都市宣言」が議決された。「･･･（略）人類の生存と繁栄（はんえい）のために、失われゆく緑を回復し、保全し、発展させ、かけがえのない自然を守り続けたいと願う。この願いをこめて私たちすべての市民は、うるわしい自然を今に伝えほこり高き\"□の都（みやこ）金沢\"を永遠の緑のまちにすることを宣言する。」という内容であったが、□に入るのは何か。","o":["水","草","森","花"],"a":3,"e":"緑化推進市民運動の母体として「緑を育て金沢を美しくする会」が中心となり、「緑あふれる金沢」写真コンテストや花いっぱい運動などが行われている。","g":"市政・最近の話題"},{"n":33,"q":"金沢の町は能や狂言（きょうげん）などの芸能が盛んな町といわれている。「安宅（あたか）」という謡曲（ようきょく）の中で、弁慶（べんけい）が舞（まい）をまった時の歌の文句が付いた町名があるがどれか。","o":["鳴和（なるわ）","富樫（とがし）","卯辰（うたつ）","安江（やすえ）"],"a":1,"e":"弁慶が舞を舞ったとされる場所は、金沢北郊（ほっこう）の「鹿島（かしま）神社」といわれ、境内には「鳴和の滝（たき）」という小さな滝があり、弁慶の足跡（あしあと）といわれる大きな穴も残っている。","g":"寺社・建造物・まち"},{"n":34,"q":"加賀藩（はん）14 代藩主前田慶寧（まえだよしやす）は、加賀藩の人々が豊かに生活できるように、「養生所（ようじょうしょ）」、「撫育所（ぶいくしょ）」、「神社」などを建てたが、どこの山を開発して建てたか。","o":["卯辰山（うたつやま）","医王山（いおうぜん）","戸室山（とむろやま）","キゴ山"],"a":1,"e":"加賀藩 14 代藩主前田慶寧は、福沢諭吉（ふくざわゆきち）の「西洋事情」を読み、ヨーロッパでは貧しい人々を救う制度や病院施設（しせつ）が整っていることを知り、加賀藩でも建設を進めた。","g":"歴史"},{"n":35,"q":"1925 年（大正 14）、平沢嘉太郎（ひらさわかたろう）が浅野川電鉄と協力し、巨額（きょがく）の資本を投じて建設した一大レジャー施設（しせつ）を何というか。","o":["玉泉院丸庭園（ぎょくせんいんまるていえん）","宝塚遊園（たからづかゆうえん）","粟崎遊園（あわがさきゆうえん）","兼六園（けんろくえん）"],"a":3,"e":"粟崎遊園は劇場・料亭（りょうてい）・レストラン・動物園・大浴場・野球場などを備えた施設で、宝塚をまねた「粟崎少女歌劇（かげき）」も組織された。","g":"寺社・建造物・まち"},{"n":36,"q":"金沢は古くから城下町として栄え、人々は伝統的な生活文化を営んできた。そのため、まちを歩いていると「歴史を感じさせるちょっとしたいいまちなみ」が見られる場所も多い。この「歴史を感じさせるちょっとしたいいまちなみ」守るために、金沢市では 1994 年（平成6）に条例を制定した。何という条例か。","o":["駐車（ちゅうしゃ）場条例","みちしるべ条例","金沢住宅地条例","こまちなみ保存条例"],"a":4,"e":"「こまちなみ保存条例」とは、歴史的な建物が残る小さなまちなみを「こまちなみ」と呼び、その景観や雰囲気（ふんいき）を大切にしていくための条例である。","g":"市政・最近の話題"},{"n":37,"q":"加賀藩（はん）で貨幣（かへい）ができたのは加賀藩初代藩主前田利家（まえだとしいえ）の頃（ころ）で豊臣秀吉（とよとみひでよし）にならって多くの金・銀貨をつくらせたのがはじまりとされているが、貨幣に対して紙幣を発行した加賀藩 10 代藩主は誰（だれ）か。","o":["前田光高（まえだみつたか）","前田重教（まえだしげみち）","前田利次（まえだとしつぐ）","前田宗辰（まえだむねとき）"],"a":2,"e":"1755 年（宝暦（ほうれき）5）に加賀藩の中だけで通用する紙のお金「藩札（銀札）」を発行した。しかし、人々が紙のお金を信用しなかったために経済は混乱し、物価はどんどん値上がりした。","g":"歴史"},{"n":38,"q":"今から 300 年前に、加賀藩（はん）は金沢の町中に分かれていた市場を1カ所に集め「金沢の台所」として近江町（おうみちょう）市場が開設された。その場所は次のどこか。","o":["片町（かたまち）","香林坊（こうりんぼう）","武蔵ヶ辻（むさしがつじ）","橋場町（はしばちょう）"],"a":3,"e":"近江町市場は 1721 年（享保 6）に市場の原型ができたと伝えられている。その後、2009 年（平成 21）再開発事業により生まれ変わり、「近江町いちば館」が開業し、2020 年（令和2）には「近江町ふれあい館」も新たに開業した。2021年（令和3）、近江町市場では 300 周年イベントが行われている。","g":"寺社・建造物・まち"},{"n":39,"q":"2020 年（令和 2）10 月、日本海側初の国立美術館として、国立工芸館が開館した。この国立工芸館の名誉（めいよ）館長に就任したのは誰（だれ）か。","o":["三浦知良（みうらかずよし）","中田英寿（なかたひでとし）","本田圭佑（ほんだけいすけ）","中山雅史（なかやままさし）"],"a":2,"e":"元サッカー日本代表の中田英寿氏は、現役引退後、日本全国をめぐり、数多くの工芸作家や工房（こうぼう）などを訪問して交流を深めるなど、日本の伝統文化や工芸の発展に精力的に取り組んできた。","g":"市政・最近の話題"},{"n":40,"q":"第二次世界大戦中、工場などに働きに出て、空襲（くうしゅう）で犠牲（ぎせい）になった少女たちをとむらうため、卯辰山（うたつやま）の山頂付近に建立されたのは何か。","o":["殉難（じゅんなん）おとめの像","天保義民（てんぽうぎみん）の碑（ひ）","七稲地蔵（なないねじぞう）","百工比照（ひゃくこうひしょう）"],"a":1,"e":"金沢から愛知県の豊川（とよかわ）にある海軍の工場に出向き、働いた少女の霊（れい）をとむらうために建てられた。この工場は空襲を受け、460 人にのぼる少女が犠牲となった。","g":"歴史"},{"n":41,"q":"金沢市では、高齢（こうれい）者のために「長寿（ちょうじゅ）安心プラン」を定めているが、すべての人が平等に普通（ふつう）の生活がおくれるまちをめざし、1998 年（平成 10）に策定したプランを何というか。","o":["バリアフリープラン金沢","ユニバーサルデザインプラン金沢","ノーマライゼーションプラン金沢","ポジティブアクションプラン金沢"],"a":3,"e":"「ノーマライゼーション」とは、人権そのものであり、例えば、障がいのある人たちなど社会的支援（しえん）を必要としている人々をいわゆるノーマルな人にすることを目的としているのではなく、その障害を共に受容することであり、彼（かれ）らにノーマルな生活条件を提供することというものである。「ノーマライゼーションプラン金沢」は、社会環境（かんきょう）の変化に合わせて、改訂（かいてい）を重ね、2021 年（令和3）にも改訂された。","g":"市政・最近の話題"},{"n":42,"q":"江戸（えど）時代、金沢城では水が行きわたらず、水不足になることがあった。そこで金沢城に水を引くため、加賀藩（はん）3代藩主の前田利常（まえだとしつね）が□に造らせた辰巳用水（たつみようすい）が現存している。□には誰が入るか。","o":["奥村永富（おくむらながとみ）","板屋兵四郎（いたやへいしろう）","大野弁吉（おおのべんきち）","稲生若水（いのうじゃくすい）"],"a":2,"e":"辰巳用水は、兼六園から金沢城内に水を引くため、逆サイフォンという原理を利用した。金沢の町には辰巳用水をはじめ鞍月（くらつき）用水、長坂用水などの55 本の用水が流れ、用水の長さを全部合わせると約 150 ㎞になるといわれている。用水は、農業灌漑（かんがい）、消火や融雪（ゆうせつ）のほかに城下町の景観を引き立てる働きをしており、金沢市民のくらしと深い関係がある。","g":"偉人・人物"},{"n":43,"q":"1289 年（正応（しょうおう）2）、曹洞宗永平寺（そうとうしゅうえいへいじ）の名僧（めいそう）である徹通義介（てっつうぎかい）が、加賀国を治めていた富樫家尚（とがしいえなお）にたのまれて開いた寺はどれか。","o":["東大寺（とうだいじ）","総持寺（そうじじ）","薬師寺（やくしじ）","大乘寺（だいじょうじ）"],"a":4,"e":"大乘寺は、現在の野々市市に創建した。その後、現在の金沢市本町に移転し、さらに、江戸時代初期には 加賀藩（はん）家老本多家の菩提寺（ぼだいじ）となり、現在の金沢市本多町に移転している。寺が現在地に移転したのは 1697 年（元禄（げんろく）10）のことである。","g":"寺社・建造物・まち"},{"n":44,"q":"平安時代の終わり頃（ごろ）から鎌倉時代の初めにかけて新しい仏教の流れが広まった。中でも阿弥陀如来（あみだにょらい）を信仰（しんこう）する宗派の勢いは北陸地方で強いものがあり、加賀地方では、時の守護職ともたたかい「一向一揆（いっこういっき）」ともいわれた。その主導的働きをしたのはどの宗派か。","o":["浄土宗（じょうどしゅう）","浄土真宗（じょうどしんしゅう）","曹洞宗（そうとうしゅう）","法華宗（ほっけしゅう）"],"a":2,"e":"「加賀一向一揆」は、1488 年（長享（ちょうきょう）2）、加賀国で勃発（ぼっぱつ）した一向一揆中最大のもの。20 万の一向宗（浄土真宗）徒が守護の富樫政親（とがしまさちか）をほろぼし、以後 100 年近く同国を統治した。","g":"歴史"},{"n":45,"q":"1546 年（天文（てんぶん）15）、本願寺が加賀を治める本拠地（ほんきょち）として金沢御堂（みどう）（尾山御坊（おやまごぼう））を建てた。金沢御堂（尾山御坊）があったといわれている場所は現在のどこにあたるか。","o":["金石付近","片町付近","湯涌（ゆわく）温泉付近","金沢城公園付近"],"a":4,"e":"金沢御堂には、京都の本願寺から本尊（ほんぞん）の仏様や親鸞（しんらん）の肖像画（しょうぞうが）などがおくられてきて、ここが加賀の一向宗（いっこうしゅう）の中心となりました。","g":"歴史"},{"n":46,"q":"交通網（もう）の整備を通して地域の発展と活性化が進められているが、金沢外環状（かんじょう）道路（山側環状）と接続し 2004 年（平成 16）につくられた北陸自動車道の IC（インターチェンジ）を何というか。","o":["金沢西 IC","金沢東 IC","金沢森本 IC","金沢港 IC"],"a":3,"e":"2012 年（平成 24）4月には白山 IC が新設され、外環状道路（海側環状）にも接続された。","g":"市政・最近の話題"},{"n":47,"q":"1870 年（明治3）、金沢藩（はん）では6か所の小学所（しょうがくしょ）を開いて、7・8歳（さい）から 14・15 歳の子どもに漢字・習字・算術などを教えた。1871 年（明治4）にはさらに5か所の小学所を開いたが、その時の生徒数は何人をこえていたか。","o":["2000 人","3000 人","4000 人","5000 人"],"a":1,"e":"小学所は、1872 年（明治5）には「小学校」とされ、石川県内に 945 校をつくる計画であった。しかし、国民の多くが反対し、就学率（しゅうがくりつ）は高くなかった。","g":"歴史"},{"n":48,"q":"金沢では、婚姻（こんいん）などのお祝いの時、蒸籠（せいろ）に入れた五色生菓子（ごしきなまがし）をふるまう。この五色とは何を表したものか。","o":["色の五彩（九谷（くたに）五彩）：赤・黄・緑・紺青・紫","自然の状況（じょうきょう）：日・月・山・海・里","味の五味：甘・酸・鹽（しお・塩の旧字）・苦・辛（しん）","陰陽（いんよう）五行：木・火・土・金・水"],"a":2,"e":"五色生菓子は、1601 年（慶長（けいちょう）6）、2代将軍徳川秀忠（とくがわひでただ）の娘（むすめ）である珠姫（たまひめ）（のちの天徳院（てんとくいん））が加賀藩（はん）3代藩主前田利常（まえだとしつね）に輿（こし）入れしたときに献上（けんじょう）したとされている。","g":"食・行事"},{"n":49,"q":"江戸（えど）時代、金沢の町を治めるために、「町方二日読（まちかたふつかよみ）」と呼ばれる法令を出した。この法令のところどころに見られる言葉は次のどれか。","o":["泥棒の用心（どろぼうのようじん）","雷の用心（かみなりのようじん）","雪の用心（ゆきのようじん）","火の用心（ひのようじん）"],"a":4,"e":"加賀藩（はん）は「町方二日読」を出すことで、町人は町人らしく身分をわきまえて行動することを求めた。町人の日常生活において守らなくてはいけないことが書かれていた。","g":"歴史"},{"n":50,"q":"金沢で SDGs（持続可能な開発目標）を効果的に進めるにあたり、「金沢の風土、歴史、文化をふまえること」、「経済、社会、環境（かんきょう）の3つの側面を包括的（ほうかつてき）にとらえること」という視点から5つの方向性を導きだした。この取り組みの目標とする年はどれか。","o":["2030 年","2040 年","2050 年","2060 年"],"a":1,"e":"SDGs とは、2015 年（平成 27）9 月、国連サミットで採択（さいたく）された 2030年までの国際目標で、持続可能な世界を実現するための 17 のゴール（目標）と169 のターゲット（具体目標）から構成されている。地球上の誰（だれ）一人として取り残さない（leave no one behind）ことをちかい、発展途上（とじょう）国のみならず、先進国自身の普遍（ふへん）的な取組を推進している。","g":"市政・最近の話題"}]},{"id":"jhome","label":"ジュニア＠ほーむ（中学生版）2020","q":[{"n":1,"q":"金沢駅兼六園口（東口）は、雨や雪の多い金沢で「駅を降りた人に傘を差し出す、（　　）の心」を表現した（　　）ドームができたことで、雨や雪に左右されない明るい空間になった。（　　）に入る言葉はどれか。","o":["もてなし","金沢","思いやり","雪国"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":2,"q":"かつて金沢では花嫁が嫁入りのときに（　　）を持参し、花嫁の家の仏間の入り口にかける風習があった。（　　）に入る言葉はどれか。","o":["花嫁掛け軸","花嫁のれん","花嫁しめ縄","花嫁すだれ"],"a":2,"e":"","g":"食・行事"},{"n":3,"q":"1947年（昭和22）に、第2回国民体育大会が石川県で開催された。その大会歌として「参加者全員で歌える歌を」ということからできあがり、小学校連合体育大会で演じられている歌はどれか。","o":["ふるさと","若い力","うみ","ラジオ体操の歌"],"a":2,"e":"","g":"食・行事"},{"n":4,"q":"金沢は、加賀藩のころから学問や芸術が盛んで、明治以降も文化面で優れた人物を輩出してきた。「金沢の三文豪」は近年再注目されているが、その3人とは誰か。","o":["室生犀星・西田幾多郎・鈴木大拙","室生犀星・泉鏡花・徳田秋聲","泉鏡花・徳田秋聲・西田幾多郎","泉鏡花・室生犀星・鈴木大拙"],"a":2,"e":"","g":"文学"},{"n":5,"q":"金沢の気候は日本海側気候に属している。この気候の特徴として正しいものはどれか。","o":["年間を通じて天気が安定しており、雨がほとんど降らない","季節風の影響で夏は雨が多いが、冬は逆に晴れることが多い","季節風の影響で冬は特に雨や雪が多く降る","1年を通して気温が高く、雨は多いが雪は見られない"],"a":3,"e":"","g":"自然・産業"},{"n":6,"q":"加賀藩の身分の低い武士のくらしについて正しく述べている文章はどれか。","o":["土地を俸禄(給料)として与えられる千石以上の知行取りであった","俸禄(給料)のみでは生活できず、家族とともに内職をして生計を立てた","俸禄(給料)のみで十分生活していくことができた","1万石以上の領地が与えられ、豊かなくらしをしていた"],"a":2,"e":"","g":"歴史"},{"n":7,"q":"金沢には、金沢市無形民俗文化財に指定された伝統行事が今も数多く残っている。斧や刀、弓を持った山伏が各家をまわる金石町や大野町で行われている行事はどれか。","o":["加賀獅子","悪魔払い","加賀万歳","さかたおどり"],"a":2,"e":"","g":"食・行事"},{"n":8,"q":"1889年（明治22）の市制施行時、10万人に満たなかった金沢市の人口は、2020年（令和2）4月現在およそ何万人か。","o":["6万人","46万人","66万人","86万人"],"a":2,"e":"","g":"市政・最近の話題"},{"n":9,"q":"金沢市は石川県の加賀地方の北部に位置し、いくつかの市や町と接しているが、金沢市と接していないのはどれか。","o":["野々市市","白山市","能美市","津幡町"],"a":3,"e":"","g":"自然・産業"},{"n":10,"q":"金沢の地域福祉活動の原点でもあり、生活相談や授産・託児の援助など地域の福祉・社会教育の拠点として1934年（昭和9）から建てられた施設はどれか。","o":["友好館","善隣館","交流館","福祉館"],"a":2,"e":"","g":"歴史"},{"n":11,"q":"金沢の農業は米作りが中心であるが、市街地近郊では、野菜・花・果物などいろいろな種類が生産されている。そのうち、1945年（昭和20）以前から金沢で生産され、金沢市が認定している「加賀野菜」は何品目あるか。","o":["11品目","13品目","15品目","17品目"],"a":3,"e":"","g":"自然・産業"},{"n":12,"q":"金沢市は地域コミュニティの再生を推進するため、歴史ある旧町名の復活に取り組んでおり、現在までに20の町名が復活している。また、2020年（令和2）秋頃には、北前船ゆかりの地である金石地区の5町名が復活する見通しである。さて、これまでに復活した旧町名のうち、町名の由来として正しくないものはどれか。","o":["六枚町・・・藩政時代、この町の土地の借り賃である地子銀が年間6枚であったため","柿木畠・・・「柿の木のもとでは火が止まる」という言い伝えを信じ、火事を防ぐために柿の木を植えたため","南町・・・藩政時代、加賀藩が治めた領土の最も南に位置していたため","木倉町・・・藩政時代、藩の材木倉があったため"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":13,"q":"金沢市は、東経136度、北緯36度の位置にあるが、ほぼ同じ緯度にある世界の都市はどれか。","o":["シドニー（オーストラリア）","ミラノ（イタリア）","サンフランシスコ（アメリカ）","ロンドン（イギリス）"],"a":3,"e":"","g":"自然・産業"},{"n":14,"q":"加賀藩14代藩主前田慶寧が行ったこととして正しく述べている文章はどれか。","o":["卯辰山の開発に取り組み、病院である「養生所」、仕事場を提供する「撫育所」などを建てた","加賀藩の財政が苦しくなったため、新しい考え方で財政改革を行う大槻朝元を、足軽という低い身分から、高い身分の武士へと取り立て、重臣たちから反感を買った","明倫堂と経武館を現在の兼六園内に建てた","漢学で知られる木下順庵や本草学の第一人者である稲生若水を金沢に住まわせて学問を奨励した"],"a":1,"e":"","g":"偉人・人物"},{"n":15,"q":"金沢の年中行事を説明した文章として、正しくないものはどれか。","o":["1月初旬に出初式が行われるが、これは江戸時代の「加賀鳶」の伝統を受け継いでいるものである","氷室の朔日（7月1日）に氷室饅頭や竹輪を食べると一年間病気にかからないといわれている","お盆にお墓参りをするときには、「切籠」をつるす","1月15日の左義長では、笹や竹に短冊をつるす"],"a":4,"e":"","g":"食・行事"},{"n":16,"q":"金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともとは、防火の目的でつくられたといわれているこの空間を何というか。","o":["大通り","路地","公園","広見"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":17,"q":"徳川家康は、加賀藩2代藩主前田利長が家康を討つ準備をしているという噂を聞き、加賀征伐の準備を始めた。その時、「母を思うがあまり、家をつぶすことがあってはならぬ。前田家のために母を捨てよ。」と利長に伝え、自ら人質として江戸へと旅立ったのは誰か。","o":["芳春院","濃姫","北政所","豪姫"],"a":1,"e":"","g":"偉人・人物"},{"n":18,"q":"2014年（平成26）、金沢市は「めざすべき金沢の子ども像」を策定した。それを、市内の中学生が分かりやすく、覚えやすい言葉で表現した、子供たちの考え方や行動の基本的な約束事を何というか。","o":["男女共同参画都市宣言","金沢市民憲章","かなざわ子育て夢プラン","金沢子どもかがやき宣言"],"a":4,"e":"","g":"市政・最近の話題"},{"n":19,"q":"加賀には、室町時代から加賀絹を梅の樹皮の煎汁に浸して染める無地染めがあり、「加賀染め」といわれていた。そこから発展し、「ぼかし」や「虫食い」などの技法を用いるようになった伝統工芸は何か。","o":["加賀友禅","加賀繍","二俣和紙","加賀蒔絵"],"a":1,"e":"","g":"美術・工芸・芸能"},{"n":20,"q":"金沢市は、西から東へとだんだん標高が上がり、険しい地形となっている。犀川の水源にもなっている、金沢市で最も高い山はどれか。","o":["三子牛山","医王山","奈良岳","キゴ山"],"a":3,"e":"","g":"自然・産業"},{"n":21,"q":"二俣地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作っており、それらは加賀藩主やその一族が公式儀礼や日常生活で利用していた。その伝統工芸品はどれか。","o":["ろうそく","和紙","友禅","漆器"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":22,"q":"金沢市では、1945年（昭和20）以前から栽培され、現在も主として金沢で栽培されている野菜を「加賀野菜」と定めている。短く太い形が特徴で、甘みが強く煮崩れしにくい「（　　）だいこん」もその一つである。（　　）に入る言葉はどれか。","o":["源助","桜島","青首","時無し"],"a":1,"e":"","g":"食・行事"},{"n":23,"q":"参勤交代は、大名が1年おきに領地と江戸に住み、その妻子を人質として江戸の屋敷におくことを命じたものである。江戸に向かう加賀藩の大名行列は諸大名の中でも最大の規模であった。そのコースは3つあったといわれているが、北国下街道を通る約480キロメートルのコースにはどれだけの期間を要したか。","o":["3日","13日","1ヶ月","1年"],"a":2,"e":"","g":"歴史"},{"n":24,"q":"2015年（平成27）に北陸新幹線が金沢まで開業し、金沢━東京間を乗り換えすることなく、片道約2時間30分で行き来できるようになった。2020年（令和2）現在、金沢━（　　）間の延伸工事が進められ、最終的には大阪市にまで延伸される予定となっている。（　　）に入る都市はどこか。","o":["小矢部[富山県]","敦賀[福井県]","高山[岐阜県]","七尾[石川県]"],"a":2,"e":"","g":"市政・最近の話題"},{"n":25,"q":"江戸時代には多くの科学者が金沢で活躍した。その中で、「優れたからくり師」、「加賀の平賀源内」と称され、からくりや工芸品、エレキテル、写真術などを残したのは誰か。","o":["飯盛里安","大野弁吉","土屋又三郎","渋川春海"],"a":2,"e":"","g":"偉人・人物"},{"n":26,"q":"1858年（安政5）に、凶作による米の値上がりに苦しむ2,000人ほどの人々が卯辰山から金沢城にいる加賀藩13代藩主前田斉泰に向かって、「ひもじいわいやー」「米くれまいやー」と叫んで救済を訴えた一揆を何というか。","o":["加賀の一向一揆","徳政一揆","馬借一揆","泣き一揆"],"a":4,"e":"","g":"歴史"},{"n":27,"q":"金沢は昔から能楽が盛んで「空から謡が降ってくる」といわれるまちだが、現在も金沢で盛んな能楽の流派はどれか。","o":["宝生流","金春流","金剛流","観世流"],"a":1,"e":"","g":"美術・工芸・芸能"},{"n":28,"q":"2020年（令和2）4月現在、石川県の人口は約113万人であるが、そのおよそ何％が金沢市に集中しているか。","o":["20％","40％","60％","80％"],"a":2,"e":"","g":"市政・最近の話題"},{"n":29,"q":"金沢市の北部には、石川県で最も大きな潟があったが、現在はその3分の2が干拓され、農地となっている。その潟はどれか。","o":["河北潟","邑知潟","木場潟","柴山潟"],"a":1,"e":"","g":"自然・産業"},{"n":30,"q":"2008年（平成20）、観測史上例のない大雨によって川の水があふれ、道路や土地が水に浸かり、広い範囲で被害が発生した。このとき、55年ぶりに氾濫した川はどれか。","o":["伏見川","犀川","金腐川","浅野川"],"a":4,"e":"","g":"自然・産業"},{"n":31,"q":"金沢の今町に生まれ、台湾に当時アジア最大といわれた烏山頭ダムや16,000キロメートルに及ぶ水路を完成させ、不毛の大地を豊かな平野に変えた金沢の偉人は誰か。","o":["三宅雪嶺","中西悟堂","八田與一","木村栄"],"a":3,"e":"","g":"偉人・人物"},{"n":32,"q":"金沢の地形を眺めると、東部の山地から西部の海岸に向かって川が流れていることがわかる。金沢を流れる川で最も長い川はどれか。","o":["森下川","木曳川","犀川","高橋川"],"a":3,"e":"","g":"自然・産業"},{"n":33,"q":"1631年（寛永8）の大火災の後、本丸に変わって政治の中心になった藩主の住まいで、内外装の材料や寸法、技法などを記した仕様書が2020年（令和2）に玉川図書館近世史料館で見つかり、復元が検討されている金沢城の建物はどれか。","o":["天守閣","一の丸御殿","二の丸御殿","大手門"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":34,"q":"2019年（令和元）5月に、「荒波を越えた男たちの夢が紡いだ異空間～北前船寄港地・船主集落～」として北前船ゆかりの金沢市が「日本遺産」に追加登録された。北前船船主として一代で約300万両にのぼる富を築いた宮腰（現在の金石）の豪商は誰か。","o":["木谷（木屋）藤右衛門","高多久兵衛","銭屋五兵衛","土屋九兵衛"],"a":3,"e":"","g":"偉人・人物"},{"n":35,"q":"江戸時代、小立野台地の先端にある金沢城では水が行きわたらず、水不足になることがあった。そこで、金沢城に水を引くため、加賀藩3代藩主前田利常が板屋兵四郎に造らせた用水はどれか。","o":["大野庄用水","長坂用水","鞍月用水","辰巳用水"],"a":4,"e":"","g":"歴史"},{"n":36,"q":"1669年（寛文9）、加賀に起きた暴風雨による洪水のために、多くの窮民（貧乏で生活に困っている人々）が出た。彼らを助けるために、当時では全国的にも例のない「お救い小屋」を建設した加賀藩5代藩主は誰か。","o":["前田綱紀","前田吉徳","前田利長","前田斉広"],"a":1,"e":"","g":"歴史"},{"n":37,"q":"明治時代に、国が現在の大学にあたる高等中学校を全国に5校つくった。金沢の広坂につくられたそのうちの1校は金沢大学のもとになったが、この学校の校名を何というか。","o":["第一高等中学校","第二高等中学校","第三高等中学校","第四高等中学校"],"a":4,"e":"","g":"歴史"},{"n":38,"q":"1888年（明治21）、石川郡安原村（現在の上安原町）で、日本初の耕地整理事業（曲がりくねった畦で仕切られたさまざまな形の田を縦・横一定の長さに調整し、農道や水路を計画的に配置する）を成しとげたのは誰か。","o":["高多久兵衛","長谷川準也","森下八左衛門","赤羽萬次郎"],"a":1,"e":"","g":"偉人・人物"},{"n":39,"q":"金沢市の市章は1891年（明治24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。","o":["桜","梅","松","桃"],"a":2,"e":"","g":"市政・最近の話題"},{"n":40,"q":"1878年（明治11）、当時の藩閥政治（薩摩・長州・土佐・肥前の4藩が実権を握る政治）に不満を持った旧加賀藩士の島田一良らが、東京麹町区紀尾井町の路上で、馬車で皇居へ向かう途中の政府高官を暗殺する事件を起こした。この時、暗殺された政府高官は誰か。","o":["木戸孝允","西郷隆盛","大久保利通","板垣退助"],"a":3,"e":"","g":"歴史"},{"n":41,"q":"春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子があり、生活の中に彩りと美を添えている。次のうち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。","o":["金花糖","五色生菓子","氷室まんじゅう","辻占"],"a":4,"e":"","g":"食・行事"},{"n":42,"q":"金沢市は、国内のさまざまな都市と交流を行っており、2020年（令和2）現在、12都市と「都市協定」を結んでいる。その中で、江戸時代に加賀藩の下屋敷があったことから「金沢橋」や「金沢小学校」などの地名が残っている、金沢市とゆかりの深い都市はどれか。","o":["長野市（長野県）","板橋区（東京都）","高崎市（群馬県）","高山市（岐阜県）"],"a":2,"e":"","g":"市政・最近の話題"},{"n":43,"q":"2019年（平成31）3月に、金沢でＳＤＧs“Sustainable Development Goals(持続可能な開発目標)”を効果的に進めるにあたり、「金沢の風土、歴史、文化を踏まえること」、「経済、社会、環境の3つの側面を包括的に捉えること」という視点から5つの方向性を導きだした。このＳＤＧｓは持続可能な世界を実現するため、世界が抱える課題に対する（　　）のゴール（目標）とそれらを達成するための169のターゲット（具体目標）から構成されている。（　　）に入る数字はどれか。","o":["1","3","17","108"],"a":3,"e":"","g":"市政・最近の話題"},{"n":44,"q":"金沢仏壇の製造には、御細工所（加賀藩の工芸製作工場）の木地師、塗師、蒔絵師、彫刻師、金具師が完全分業体制であたっていた。金沢仏壇の特色として正しいものはどれか。","o":["繊細で変色しやすい","組み立てに釘がたくさん使われている","加賀蒔絵や金箔が使われている","加賀友禅がふんだんに使われている"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":45,"q":"1874年(明治7)、「金沢製糸場」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月用水から水を引き、大きな水車を使って機械を動かしていた。この「金沢製糸場」をつくった人物は誰か。","o":["稲垣義方","森下八左衛門","長谷川準也","津田米次郎"],"a":3,"e":"","g":"偉人・人物"},{"n":46,"q":"鎌倉時代のはじめには、金沢の高尾町・泉野町付近から三馬・久安付近を支配し、のちに加賀国の守護となり、歌舞伎「勧進帳」では安宅の関で源義経と弁慶を通したと伝えられている一族はどれか。","o":["林氏","前田氏","久安氏","富樫氏"],"a":4,"e":"","g":"歴史"},{"n":47,"q":"馬車鉄道しかなかった金沢にはじめて電車が走ったのは、1914年（大正3）である。今はもう走っていないが、その路線と営業していた鉄道会社はどれか。","o":["鶴来～野々市（石川電鉄）","武蔵ヶ辻～香林坊（香林坊電鉄）","金沢～内灘（浅野川電鉄）","金石～長田（金石電鉄）"],"a":4,"e":"","g":"歴史"},{"n":48,"q":"加賀藩2代藩主前田利長や3代藩主前田利常は金沢城を守るために、二重に堀を造らせ、堀の内側には土を高く盛り上げた土居を築かせた。これらは何と呼ばれているか。","o":["腰曲輪","馬出","惣構","逆茂木"],"a":3,"e":"","g":"歴史"},{"n":49,"q":"金沢市では、東部にある医王山や南部にある平栗などの森林で、ニホンカモシカやギフチョウのようなめずらしい動物を見ることができる。金沢市の面積のうち、森林が占める割合は約何割か。","o":["約1割","約3割","約6割","約9割"],"a":3,"e":"","g":"自然・産業"},{"n":50,"q":"金沢市では、自動車による渋滞をなくすために、歩行者や自転車、バスなどの（　　）交通を優先するまちづくりを進めてきた。具体的には、バス停留所に屋根やベンチを設置することでバスを待ちやすい環境を整えたり、「ふらっとバス」や（　　）シェアサイクル「まちのり」を導入することで移動手段の利便性を向上させたりしている。（　　）に入る言葉はどれか。","o":["鉄道","公共","水上","特殊"],"a":2,"e":"","g":"市政・最近の話題"}]},{"id":"j14c","label":"第14回ジュニア（中学生版）2019","q":[{"n":1,"q":"加賀藩2代藩主前田利長や3代藩主前田利常は金沢城を守るために、二重に堀を造らせ、堀の内側には土を高く盛り上げた土居を築かせた。これらは何と呼ばれているか。","o":["用水","土塀","惣構","堤防"],"a":3,"e":"","g":"歴史"},{"n":2,"q":"二俣地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作っており、それらは加賀藩主やその一族が公式儀礼や日常生活で利用していた。その伝統工芸品はどれか。","o":["ろうそく","和紙","友禅","漆器"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":3,"q":"室町時代、富樫政親と富樫幸千代の兄弟間で加賀国の守護職をめぐって権力争いが行われたが、その際に富樫政親が館の背後にそびえる山に築いた城はどれか。","o":["高尾城","七尾城","金沢城","小丸山城"],"a":1,"e":"","g":"歴史"},{"n":4,"q":"金沢市では文化的景観を守るために、ひとつひとつの建物や用水を保全するだけでなく、条例で地区を決め、その地区全体のまちなみや風景を守ってきた。また、伝統芸能、工芸技術の保存や後継者を育てることにも力を入れており、これらの取り組みが発展して金沢市は国から2009年（平成21）に（　　）に認定された。（　　）に当てはまる言葉はどれか。","o":["文化都市","伝統都市","工芸都市","歴史都市"],"a":4,"e":"","g":"市政・最近の話題"},{"n":5,"q":"近年の発掘調査の結果、縄文時代の人々は高度な技術をもち、おしゃれで感性豊かであったことが明らかになっている。日本ではじめての石の指輪が出土した金沢の遺跡はどこか。","o":["畝田遺跡","北塚遺跡","七ツ塚遺跡","チカモリ遺跡"],"a":2,"e":"","g":"歴史"},{"n":6,"q":"金沢市の水道は水質が良いことで全国的に有名であり、「金沢の水」として販売されているが、その水源はどれか。","o":["金沢城の地下水","河北潟の水","伏見川上流の水","犀川上流の水"],"a":4,"e":"","g":"市政・最近の話題"},{"n":7,"q":"2010年（平成22）に金沢の中心部に開館した「しいのき迎賓館」は、ギャラリー、セレクトショップ、レストランなどが設けられているが、以前はどのような建物であったか。","o":["美術館","県庁","金沢大学","市立図書館"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":8,"q":"1587年（天正15）、バテレン追放令で大名の地位を失った（　　）は、加賀藩2代藩主前田利長の許しを得て、金沢で宣教活動を行っていた。その後、徳川家康のキリスト教禁止令により国外追放されても（　　）は決してキリスト教を捨てることはしなかった。そのことがフランシスコ・ローマ法王に認められ、2016年（平成28）にカトリックの「福者」に認定されたことを受け、2018年（平成30）には金沢市長がローマ法王に謁見している。（　　）に当てはまる武将は誰か。","o":["高山右近","浅井長政","直江兼続","明智光秀"],"a":1,"e":"","g":"偉人・人物"},{"n":9,"q":"金沢には、今に伝わる年中行事が多く残っているが、6月にある無病息災を願う行事はどれか。","o":["人形供養","針供養","しょうぶ湯","地蔵盆"],"a":3,"e":"","g":"食・行事"},{"n":10,"q":"尾山御坊のあった小立野台地は、金沢の名前の由来である芋掘藤五郎伝説からも分かるように昔は砂金がたくさんとれた。小立野台地で砂金を発見したのはどのような人々か。","o":["本願寺僧とともに近江から移ってきた商人たち","有松・泉で活躍した金物職人たち","金屋とよばれる鉄や金を求め歩く流浪の人々","当時最高の石垣造りの技術を持っていた近江国出身の穴太衆"],"a":3,"e":"","g":"歴史"},{"n":11,"q":"金沢市は、社会教育の面で、年齢を問わずすべての市民が生涯にわたって学習できるような機会を設けているが、中でも高齢者のために様々な講座を実施しているものを何というか。","o":["忠信大学校","高砂大学校","社会大学校","長寿大学校"],"a":2,"e":"","g":"市政・最近の話題"},{"n":12,"q":"1854年（安政元）、幕府が開国したことに影響を受け、加賀藩でも洋式兵学校が開校した。西洋砲術・洋楽・航海学・測量学・英仏の語学などの科目がおかれたこの教育機関を何というか。","o":["壮猶館","明倫堂","経武館","善隣館"],"a":1,"e":"","g":"歴史"},{"n":13,"q":"金沢市には、歴史ある旧町名や昔の地名が多く残っているが、旧町名や昔の地名が忘れ去られることがないように、その由来を刻んだ標柱を何というか。","o":["金沢まちしるべ","旧町名しるべ","歴史由来しるべ","歴史のまちしるべ"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":14,"q":"平安時代の初め823年（弘仁14）、加賀国が誕生した。それはどこの国から分かれて誕生したのか。","o":["越前国","能登国","越中国","越後国"],"a":1,"e":"","g":"歴史"},{"n":15,"q":"金沢の市街地近郊では米や野菜、果物などいろいろな種類の作物が生産されている。金沢の風土を生かして生産された「金沢そだち」と呼ばれている作物の組み合わせとして正しいものはどれか。","o":["さつまいも・にんじん・しいたけ","だいこん・さつまいも・いちご","だいこん・すいか・なし","すいか・じゃがいも・かぶら"],"a":3,"e":"","g":"自然・産業"},{"n":16,"q":"金沢では古くから、たくさんの絹織物を生産してきた。父の吉之助が考えた水車で動く機械に感動し、自分も絹動力織機の発明に取り組んで完成させたのは誰か。","o":["長谷川準也","津田米次郎","森下八左衛門","高多久兵衛"],"a":2,"e":"","g":"偉人・人物"},{"n":17,"q":"金沢市は、石川県のほぼ中央に位置しており、いろいろな地形があるが、犀川の南側に広がっている台地を何というか。","o":["寺町台地","犀川台地","卯辰台地","浅野川台地"],"a":1,"e":"","g":"自然・産業"},{"n":18,"q":"金沢には、明治時代にすぐれた文学作品を残した三文豪と呼ばれる人たちがいる。有名な尾崎紅葉の門下生となり、「義血侠血」「照葉狂言」「高野聖」などの名作を残したのは誰か。","o":["徳田秋声","室生犀星","泉鏡花","竹久夢二"],"a":3,"e":"","g":"文学"},{"n":19,"q":"金沢には、古いまちなみが残っている地区があるが、これらの地区で美しいまちなみを守るため行っていることはどれか。","o":["道路上の電柱をなくす","木を植える","きれいな建物に建て替える","道路の幅を広くする"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":20,"q":"金沢にはたくさんの方言がある。そのうち、「てきない」とはどのような意味か。","o":["敵がだれもいないこと","散らかった様子","苦しい","かわいらしい"],"a":3,"e":"","g":"金沢ことば"},{"n":21,"q":"金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともと、防火のためにつくられたといわれているこの空間を何というか。","o":["防火地","広見","大路","大広場"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":22,"q":"大正デモクラシーとは、大正期を中心に盛んになった民主主義をもとめた動きのことである。1917年（大正6）の衆議院議員総選挙における石川県選挙区に憲政会から立候補し、財産や税金の額によって政治に参加することを制限するのはいけないことだと熱心に訴え続けた人物は誰か。","o":["中橋徳五郎","平沢嘉太郎","永井柳太郎","山森隆"],"a":3,"e":"","g":"偉人・人物"},{"n":23,"q":"加賀藩3代藩主前田利常は、城下のあちらこちらに散らばっていた一向宗以外の寺院を犀川口や浅野川口、小立野台に集めた。忍者寺として有名な妙立寺や国の天然記念物の大桜がある松月寺などがある寺院群はどれか。","o":["犀川寺院群","小立野寺院群","卯辰山山麓寺院群","寺町寺院群"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":24,"q":"「氷室の朔日」は、加賀藩から江戸の将軍に氷を献上したことにちなんだ行事である。この7月1日に無病息災を祈って食べる饅頭を何というか。","o":["朔日饅頭","氷室饅頭","献上饅頭","加賀饅頭"],"a":2,"e":"","g":"食・行事"},{"n":25,"q":"2019年（令和元）7月、金沢に建築博物館である「谷口吉郎・吉生記念金沢建築館」が誕生し、金沢にゆかりのある世界的な建築士の谷口吉郎・吉生親子に関する資料が展示されている。二人が設計した建物は数多く残されているが、唯一親子が共同で設計した建物が金沢にはあり、煉瓦造の棟とコルテン鋼の外壁の棟が融合した姿は人々を魅了している。その建物はどれか。","o":["鈴木大拙館","玉川図書館","伝統産業工芸館","金沢文芸館"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":26,"q":"江戸時代の北陸地方における農業の書物「耕稼春秋」には農家の月ごとにする仕事や作るべき作物、肥料や農具のことなどが書かれているが、この書物を書いたのは誰か。","o":["高山右近","前田綱紀","土屋又三郎","板屋兵四郎"],"a":3,"e":"","g":"偉人・人物"},{"n":27,"q":"加賀藩3代藩主前田利常は美術工芸に目を向け、全国の名工を金沢に招いた。金・銀・鉄などの地金に他の金属をはめ込み、刀や馬具、置物や髪飾りなどに施す細工を何というか。","o":["加賀友禅","加賀繍","加賀五彩","加賀象嵌"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":28,"q":"金沢市では歴史のある旧町名を復活させる取り組みが各地で行われており、2019年（令和元）5月1日にも東山地区の（　　）が旧町名を復活させた。町名の由来は前田家が安産祈願のため参拝していた観音院が卯辰山から移されたとき、観音院から浅野川大橋までの道を広げたことによるものであるが、（　　）に入る町名はどれか。","o":["高道町","観音町","材木町","子来町"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":29,"q":"金沢市では、2010年（平成22）に親子が豊かな時間を共有できる環境を整えたり、公共施設のバリアフリー化などを進めているが、そのためにつくられた計画を何というか。","o":["かなざわ子育て夢プラン","かなざわバリアフリー推進プラン","かなざわ保育プラン","かなざわ親子教育推進プラン"],"a":1,"e":"","g":"市政・最近の話題"},{"n":30,"q":"金沢には藩政時代の文化が多く残っているが、文化文政（1804～1829年）のころ大石藤五郎が定着させた年の初めのお祝いに踊る踊りは何か。","o":["寺中神事能","加賀宝生","上野町餅つき踊","加賀万歳"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":31,"q":"2019年（令和元）5月に、「荒波を越えた男たちの夢が紡いだ異空間～北前船寄港地・船主集落～」として北前船ゆかりの金沢市が「日本遺産」に追加登録された。北前船船主として一代で約300万両にのぼる富を築いた宮腰の豪商は誰か。","o":["木谷（木屋）藤右衛門","高多久兵衛","銭屋五兵衛","土屋九兵衛"],"a":3,"e":"","g":"偉人・人物"},{"n":32,"q":"金沢市の姉妹都市は全部で7都市あるが、中国にある姉妹都市はどこか。","o":["蘇州市","上海市","北京市","大連市"],"a":1,"e":"","g":"市政・最近の話題"},{"n":33,"q":"加賀藩5代藩主前田綱紀は有名な学者を日本中から金沢に招いたり、貴重な書物を国中から集めたりしていたため、江戸時代を代表する学者に「加賀は天下の書府」とほめたたえられた。この学者とは誰か。","o":["新井白石","木下順庵","稲生若水","室鳩巣"],"a":1,"e":"","g":"歴史"},{"n":34,"q":"2012年（平成24）に金沢市でスタートした、人や環境にやさしい公共レンタサイクルシステム「まちのり」を説明したものはどれか。","o":["1度借りたら3日間返さなくてもよい。","支払いは現金のみであり、クレジットカードでの支払いはできない。","自転車は、借りた場所（ポート）と違うポートにも返却できる。","利用できるのは、観光客限定である。"],"a":3,"e":"","g":"市政・最近の話題"},{"n":35,"q":"西洋化を進めた明治時代には、金沢にも新聞、写真、人力車、洋服等が登場し、人々が新しいものに興味を持ち始めた。金沢で最初に発刊された新聞はどれか。","o":["金沢新聞","石川新聞","北陸新聞","開化新聞"],"a":4,"e":"","g":"歴史"},{"n":36,"q":"金沢市は昔から地下水にめぐまれ、井戸がたくさんつくられていたが、大正時代の大干ばつをきっかけに上水道の整備が進められた。金沢市につくられた最初の浄水場はどれか。","o":["内川浄水場","末浄水場","犀川浄水場","浅野川浄水場"],"a":2,"e":"","g":"歴史"},{"n":37,"q":"金沢市は、森林が面積の約6割を占めているが、森林の整備を進めたり、森林と親しむ機会をつくったりすることを定めている条例を何というか。","o":["かなざわ森林条例","かなざわ遊林条例","金沢環境森林条例","金沢市森づくり条例"],"a":4,"e":"","g":"市政・最近の話題"},{"n":38,"q":"19世紀の加賀藩には多くの科学者がいたが、関口開はどのような分野で活躍したか。","o":["「天然痘」にかからないための種痘を加賀藩で最初におこなった。","「加賀の平賀源内」とも称され、エレキテルやたくさんのからくり、工芸品を残した。","西洋の数学の本を日本語に訳し、「新撰数学」は22万部のベストセラーになった。","測量技術にすぐれ、今とほとんど変わらない正確な地図である「加越能三州郡分略絵図」を作成した。"],"a":3,"e":"","g":"偉人・人物"},{"n":39,"q":"金沢市は、「スポーツで人とまちを元気にする」ことに積極的に取り組むことで、さらなる活力と魅力のあるまちづくりを進めている。その一環として年齢・性別等にとらわれない「ｅスポーツ」の普及にも力を入れており、技術や創作力を持った人材の育成やｅスポーツを通した人々の交流の活性化等を目標としている。このｅスポーツとはどのような競技か。","o":["課題に対し、誰がよりよい解決策を提案できるか競い合う競技","日本伝統の昔遊びによる対戦競技","アクロバティックで危険な動きを競い合う競技","電子機器（コンピューター等）を使った対戦競技"],"a":4,"e":"","g":"市政・最近の話題"},{"n":40,"q":"金沢は能楽がさかんな町であり、武家のみでなく、庶民にも広く親しまれたことから「金沢に行くと空から謡が降ってくる」と例えられる程であった。次のうち加賀藩5代藩主前田綱紀が取り入れたことにより、金沢で能楽が栄えるきっかけとなった流派はどれか。","o":["金春流","観世流","宝生流","金剛流"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":41,"q":"1898年（明治31）、石川県で初めて営業を開始した「馬車鉄道」（線路の上の乗り物を馬が引っ張る鉄道）は、どことどこを結んでいたか。","o":["上金石～長田","鞍月～粟崎","三馬～松任","野町～額"],"a":1,"e":"","g":"歴史"},{"n":42,"q":"現在、金沢城跡は、金沢城公園として市民の憩いの場になっている。それ以前に、この場所にあった建物はどれか。","o":["石川県立美術館","金沢大学","玉川図書館","金沢市役所"],"a":2,"e":"","g":"歴史"},{"n":43,"q":"17世紀に起きた洪水により、加賀藩では多くの窮民（貧乏で生活に困っている人々）がでた。そこで、当時全国的に例のない「お救い小屋」を設置した加賀藩主は誰か。","o":["初代藩主前田利家","2代藩主前田利長","3代藩主前田利常","5代藩主前田綱紀"],"a":4,"e":"","g":"歴史"},{"n":44,"q":"金沢は雪国としても知られているが、雪の重みで木の枝が折れないように樹木に施されるものは何か。","o":["こもかけ","雪囲い","雪吊り","枝守り"],"a":3,"e":"","g":"自然・産業"},{"n":45,"q":"加賀藩3代藩主前田利常は、1651年（慶安4）から1656年（明暦2）に、村々の田の良し悪しや広さを調べ、その村の米の取れ高から年貢の率を決め、藩へ納める年貢を決めた。この改革を何というか。","o":["太閤検地","版籍奉還","村御印","改作仕法（改作法）"],"a":4,"e":"","g":"歴史"},{"n":46,"q":"金沢は水がきれいなまちとしても有名であるが、金沢の川が清流である証として多く捕れた魚はどれか。","o":["ごり","めだか","いわな","うぐい"],"a":1,"e":"","g":"自然・産業"},{"n":47,"q":"江戸時代末期の天保時代に、上田作之丞は中級武士の出身ながら学問に優れ、私塾「拠遊館」を開いた。この拠遊館には藩のことを真剣に考えようとする優れた中級武士や下級武士が大勢集まり議論したが、彼らは会合の時にそろってある衣服を身に付けていたことから何と呼ばれるようになったか。","o":["長羽織党","黒羽織党","単衣羽織党","赤羽織党"],"a":2,"e":"","g":"歴史"},{"n":48,"q":"江戸時代、参勤交代により大名は1年おきに領地と江戸を行き来しており、加賀藩の大名行列は、江戸まで徒歩での大移動であった。コースは3つあったが、主にどのコースが選ばれたか。","o":["越前福井道","北国上街道","北国下街道","東海道"],"a":3,"e":"","g":"歴史"},{"n":49,"q":"近江町市場では2009年（平成21）の再開発事業により生まれ変わった。新たに観光のシンボルとなった建物を何というか。","o":["近江町いちば館","近江町青果館","近江町鮮魚館","近江町アーケード"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":50,"q":"金沢城の西側にある玉泉院丸の中に、現在工事中（2020年完成予定）の「鼠多門」があり、水堀をまたぐ橋によって金谷出丸（現在の尾山神社境内）からの出入口となっていた。この門はなぜ鼠多門と名付けられたか。","o":["門の老朽化により、きしむ音が鼠の鳴く音に聞こえたため","炭を混ぜた漆喰の使用により、壁全体が鼠色に見えたため","建築した人の名前が鼠多門であったため","大泥棒の鼠小僧を捕らえるための仕掛けがいくつも施されていたため"],"a":2,"e":"","g":"寺社・建造物・まち"}]},{"id":"j11c","label":"第11回ジュニア（中学生版）2016","q":[{"n":1,"q":"金沢は冬に雪が多く降る気候である。雪の重みで枝が折れないよう、冬の間、樹木に施されるものは何か。","o":["雪化粧","間垣","雪吊り","こも掛け"],"a":3,"e":"","g":"自然・産業"},{"n":2,"q":"加賀藩初代藩主の前田利家は、15才の時に、小姓（殿様の身の回りの世話をする武士）として織田信長に仕えた。若い頃の利家は、喧嘩早く、「（　　）の又左」といわれ、人々におそれられた。（　　）には何が入るか。","o":["刀","斧","槍","弓"],"a":3,"e":"","g":"偉人・人物"},{"n":3,"q":"大樋焼は、加賀藩5代藩主の前田綱紀が、茶道普及のために裏千家の始祖（最初に始めた人）と楽焼の陶工を京都から招いたことから始まった。次のうち、大樋焼の工程の特徴はどれか。","o":["ろくろや型を使って整える。","一つ一つ手びねりでつくる。","五彩の彩色をする。","金・銀をほどこし400度で焼いて完成する。"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":4,"q":"金沢には多くの方言があるが、金沢の方言「たいそい」の意味はどれか。","o":["疲れた","ありがとう","おそろしい","ゆったりと"],"a":1,"e":"","g":"金沢ことば"},{"n":5,"q":"加賀には、室町時代から加賀絹を梅の樹皮の煎汁（煮出した汁）に浸して染める無地染めがあり、「加賀染め」といわれていた。その後、「ぼかし」や「虫喰い」などの技法を用いて発展した、表現に味わいがある伝統工芸は何か。","o":["加賀象嵌","二俣和紙","加賀友禅","金沢仏壇"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":6,"q":"百万石まつりは、金沢市のもとをつくった前田利家の功績をたたえて開かれている。百万石まつりが毎年6月に開かれるのは、利家が6月にあることを行ったといわれているからであるが、それは何か。","o":["加賀藩初代藩主になった","織田信長の家来になった","辰巳用水をつくらせた","金沢入城をはたした"],"a":4,"e":"","g":"食・行事"},{"n":7,"q":"加賀藩5代藩主の前田綱紀の時代である1697年（元禄10）には、金沢の町は発展をとげ、江戸・大坂・京都に次ぐほどの大都市になった。当時の町の人口は約何人だったか。","o":["約6,900人","約69,000人","約690,000人","約6,900,000人"],"a":2,"e":"","g":"歴史"},{"n":8,"q":"1838年（天保9）、凶作に苦しむ農民を救うため、村役人たちが年貢米をまけてほしいと藩に願い出る事件がおきたが、村役人たちはとらえられ、家族ともども越中五箇山へ流刑となった。そのおよそ60年後、事件の真相を知った（　　）はこれらの人を天保義民といってたたえた。（　　）には誰が入るか。","o":["寺島蔵人","銭屋五兵衛","土屋又三郎","勝海舟"],"a":4,"e":"","g":"歴史"},{"n":9,"q":"明治時代、国は今の大学にあたる高等中学校を5校つくった。そのうちの1校が金沢につくられ、のちの金沢大学になった。この学校がつくられた当時の学校名は何か。","o":["第一高等中学校","第二高等中学校","第三高等中学校","第四高等中学校"],"a":4,"e":"","g":"歴史"},{"n":10,"q":"金沢市では、すべての市民が生涯にわたって、いつでも学習ができるように、いろいろな機会を設けている。このような生涯学習情報に、市民がいつでも触れられるようにするため、金沢市が定期的に発行している、イベントや講座を紹介する冊子は何か。","o":["いいね金沢","Ｙｏｕｓ（ユース）","みまっ誌","かけはし"],"a":3,"e":"","g":"市政・最近の話題"},{"n":11,"q":"第2次世界大戦中、工場などに働きに出て、空襲で犠牲になった少女たちをとむらうため、卯辰山の山頂付近に建立されたのは何か。","o":["笠舞の地蔵","非人清光の碑","天保義民の碑","殉難おとめの像"],"a":4,"e":"","g":"歴史"},{"n":12,"q":"金沢市では、歴史ある旧町名や昔の地名が忘れ去られることのないように、旧町名や坂道、用水などの由来を刻んだ標柱「歴史のまちしるべ」を建てた。1999年（平成11）、最初に復活した、加賀藩士の屋敷があったという由来のある町名は何か。","o":["主計町","袋町","飛梅町","木倉町"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":13,"q":"ある年、金沢のまちに連日20㎝を越える雪が降り続き、最大積雪181㎝の大雪となった。建物があいついで倒れ、車が動かなくなるなど、市民生活に大混乱を与えたこの大雪を何というか。","o":["20豪雪","38豪雪","55豪雪","81豪雪"],"a":2,"e":"","g":"歴史"},{"n":14,"q":"今年、第100回を迎えた高校相撲金沢大会。現在は卯辰山で行われているが、1915年（大正4）に、第1回大会にあたる「学生角力大会」が開催された場所はどこか。","o":["金沢城跡","三小牛山","金石","香林坊"],"a":3,"e":"","g":"歴史"},{"n":15,"q":"金沢市には、石川ミリオンスターズ、ツエーゲン金沢、金沢武士団の3つのプロスポーツチームがあるが、この3つのプロスポーツチームにあてはまらないスポーツはどれか。","o":["バレーボール","野球","サッカー","バスケットボール"],"a":1,"e":"","g":"市政・最近の話題"},{"n":16,"q":"金沢にはさまざまな伝統産業が息づいており、加賀友禅の友禅流しや、上質な和紙作りには清らかな水がどうしても必要である。金沢の川が清流である証拠として、昔から、ある小魚がたくさんとれ、金沢の特産品「○○の佃煮」としても有名である。○○にあてはまる2文字の小魚は何か。","o":["あゆ","ぼら","ごり","ふな"],"a":3,"e":"","g":"自然・産業"},{"n":17,"q":"明治時代に入ると、江戸時代の武士たちは士族となったが、俸禄（武士の給与）がなくなるなど、生活が苦しくなった。そこで、士族救済のために移住がすすめられるようになったが、79家族がその地に渡り、前田村を作った都道府県はどれか。","o":["東京都","北海道","大阪府","沖縄県"],"a":2,"e":"","g":"歴史"},{"n":18,"q":"加賀藩3代藩主の前田利常は、火事が広がらないように（　　）と呼ばれる火除地をつくった。（　　）には何が入るか。","o":["高台","広場","検地","広見"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":19,"q":"金沢市は、1962年（昭和37）にアメリカ合衆国のバッファロー市と姉妹都市提携を結び、現在では世界の7都市と姉妹都市提携をしている。次のうち、姉妹都市ではない都市はどこか。","o":["リオデジャネイロ市","全州市","ゲント市","ナンシー市"],"a":1,"e":"","g":"市政・最近の話題"},{"n":20,"q":"1471年（文明3）、蓮如は親鸞の教えを伝えるために、北陸を旅することを決意した。金沢市内にある蓮如にゆかりのある寺はどれか。","o":["妙成寺","二俣本泉寺","傳燈寺","大乗寺"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":21,"q":"金沢市では、東部にある医王山や南部にある平栗などの森林で、ニホンカモシカやギフチョウのようなめずらしい動物を見ることができる。金沢市の面積のうち、森林が占める割合は約何割か。","o":["約1割","約3割","約6割","約9割"],"a":3,"e":"","g":"自然・産業"},{"n":22,"q":"金沢は、藩政時代から今日まで、さまざまな分野で活躍する多くの人々を育んできた。その中で、緯度の変化を計算するⅩＹの公式にＺ項を発見し、地球上の緯度観測をより正確に行えるようにした人物は誰か。","o":["高峰譲吉","鈴木大拙","木村栄","八田與一"],"a":3,"e":"","g":"偉人・人物"},{"n":23,"q":"兼六園に接し、緑に囲まれた「本多の森」に、「いしかわ赤レンガミュージアム」の愛称で親しまれている3棟の赤レンガづくりの建物がある。1946年（昭和21）、この場所に開設され、現在は小立野にキャンパスを移した大学はどれか。","o":["金沢美術工芸大学","金沢星稜大学","北陸大学","金沢大学"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":24,"q":"金沢には多くの川が流れている。これらの川では、舟によって各地の産物が金沢城下に運ばれ、人々の通行手段としても利用されたが、加賀藩の年貢米を運ぶのに利用された川はどれか。","o":["小矢部川","森下川","手取川","木曳川"],"a":2,"e":"","g":"歴史"},{"n":25,"q":"「加賀の平賀源内」とも称された大野弁吉は、1801年（享和元）京都に生まれた。弁吉は幼少のころから非凡な才能をあらわし、長崎に出てオランダ人に西洋医学や理化学、天文学を学んだ。次のうち、弁吉に関係の深い事柄はどれか。","o":["天然痘","測量技術","新撰数学","からくり師"],"a":4,"e":"","g":"偉人・人物"},{"n":26,"q":"金沢市は、1889年（明治22）に誕生してから、隣接する町や村などを編入・合併しつつ市の面積を拡大してきた。現在の金沢市の面積は、金沢市が誕生したときの面積と比べて約何倍になっているか。","o":["4倍","10倍","40倍","100倍"],"a":3,"e":"","g":"市政・最近の話題"},{"n":27,"q":"金沢が生んだ三文豪として、泉鏡花、室生犀星、徳田秋声がいる。次のうち、泉鏡花の作品ではないものはどれか。","o":["あらくれ","高野聖","義血侠血","照葉狂言"],"a":1,"e":"","g":"文学"},{"n":28,"q":"金沢市で1番高い山は標高1,644ｍで、犀川の水源にもなっている。この山の名前は何か。","o":["医王山","白山","キゴ山","奈良岳"],"a":4,"e":"","g":"自然・産業"},{"n":29,"q":"江戸時代の金沢では、町の格づけがされていた。伝馬役(藩主の荷物や人を運ぶために運搬用の馬や費用を負担する)や町夫(道路・橋・堤防などの工事に人足を提供する)を負担する町で、比較的生活に余裕のある町人が住んでいた町を何というか。","o":["相対請地","七ヶ所","本町","地子町"],"a":3,"e":"","g":"歴史"},{"n":30,"q":"金沢市内の南部に豊かな自然に恵まれた山がある。その山には加賀藩初代藩主の前田利家とその正室の芳春院など前田家一族の墓や、金沢を代表する多くの著名人の墓があるが、その山を何というか。","o":["卯辰山","野田山","戸室山","医王山"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":31,"q":"2008年（平成20）、観測史上例のない大雨によって川の水があふれ、道路や土地が水に浸かり、広い範囲で被害が出た。このとき、55年ぶりに氾濫した川はどれか。","o":["浅野川","金腐川","犀川","内川"],"a":1,"e":"","g":"自然・産業"},{"n":32,"q":"加賀藩で貨幣ができたのは加賀藩初代藩主の前田利家の頃である。豊臣秀吉にならって多くの金・銀貨をつくらせたのがはじまりだとされているが、次のうち、貨幣のもとになる金銀が産出した山はどれか。","o":["白山","大門山","キゴ山","宝達山"],"a":4,"e":"","g":"歴史"},{"n":33,"q":"春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子があり、生活の中に彩りと美を添えている。次のうち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。","o":["金花糖","五色生菓子","氷室まんじゅう","辻占"],"a":4,"e":"","g":"食・行事"},{"n":34,"q":"金沢には、金沢市無形民俗文化財に指定された藩政時代の文化が今もたくさん残っている。大野湊神社では毎年5月15日のお祭りに能楽が演じられているが、この行事は何と呼ばれているか。","o":["悪魔払い","ジョンカラ節","寺中神事能","加賀万歳"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":35,"q":"金沢港は1954年（昭和29）に、金石港ともう一つの港が合併してできた。次のうち、もう一つの港はどれか。","o":["大野港","粟崎港","浅野川港","専光寺港"],"a":1,"e":"","g":"歴史"},{"n":36,"q":"金沢市は、国内のさまざまな都市と交流を行っており、2016年（平成28）現在、10都市と「都市協定」を結んでいる。その中で、江戸時代に加賀藩の下屋敷があった、金沢市とゆかりの深い都市は次のうちどれか。","o":["松本市（長野県）","板橋区（東京都）","高崎市（群馬県）","高山市（岐阜県）"],"a":2,"e":"","g":"市政・最近の話題"},{"n":37,"q":"1599年(慶長4)、徳川2代将軍秀忠の2女として生まれた珠姫は、3歳で金沢に嫁入りし、8人の子を育てた。珠姫は亡くなった後「天徳院」と呼ばれたが、その名のお寺を小立野につくり、珠姫の霊を祀った加賀藩主は誰か。","o":["加賀藩初代藩主前田利家","加賀藩2代藩主前田利長","加賀藩3代藩主前田利常","加賀藩4代藩主前田光高"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":38,"q":"1546年（天文15）、本願寺が加賀を治める本拠地として金沢御堂（尾山御坊）を建てた。金沢御堂（尾山御坊）があったといわれている場所は現在のどこにあたるか。","o":["金沢城公園付近","湯涌温泉付近","片町中央付近","金沢駅付近"],"a":1,"e":"","g":"歴史"},{"n":39,"q":"2014年（平成26）、金沢市は「めざすべき金沢の子ども像」を策定した。それを、市内の中学生が分かりやすく、覚えやすい言葉で表現した、子どもたちの考え方や行動の基本的な約束事は何か。","o":["男女共同参画都市宣言","金沢市民憲章","金沢子どもかがやき宣言","かなざわ子育て夢プラン"],"a":3,"e":"","g":"市政・最近の話題"},{"n":40,"q":"第1次世界大戦の後半（大正7年頃）、金沢市では財源を確保するため、新しい税を徴収することを考えた。全国にさきがけて導入された税で、当時のお金で2円以上飲食した場合にかかる、生活に余裕がある人のぜいたくに対してかけられた税は次のうちどれか。","o":["飲食税","贅沢税","消費税","遊興税"],"a":4,"e":"","g":"歴史"},{"n":41,"q":"1893年（明治26）、赤羽萬次郎が発行した新聞は、現在の新聞よりも小さく、総ふりがな付きで4ページほどのものだった。泉鏡花など各界の人も執筆にあたった、この新聞は次のうちどれか。","o":["開化新聞","北國新聞","読売新聞","朝日新聞"],"a":2,"e":"","g":"歴史"},{"n":42,"q":"金沢には、名前の由来となっているように、沢や湧き水が多くあり、このような清らかな水からできた、上質な和紙を使ってつくられる金沢の特産品がある。全国の総生産量の99％を占める、この特産品は次のうちどれか。","o":["友禅","和紙","漆器","金箔"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":43,"q":"1689年（元禄2）、松尾芭蕉は「奥の細道」の旅の途中、金沢に立ち寄った。その際、弟子の小杉一笑の死を悼んで詠んだ句はどれか。","o":["塚も動けわが泣く声は秋の風","むざんやな甲の下のきりぎりす","あかあかと日は難面も秋の風","山中や菊はたおらじ湯のにほひ"],"a":1,"e":"","g":"文学"},{"n":44,"q":"水が豊富なまち・金沢には55もの用水が流れているが、この55の用水を合わせるとどのくらいの長さになるか。","o":["約15km","約50km","約150km","約500km"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":45,"q":"加賀藩5代藩主の前田綱紀は、細工人の技術向上と工芸技術を保存し記録するために（　　）をつくった。（　　）には何が入るか。","o":["百工比照","尊経閣文庫","お救い小屋","加賀宝生"],"a":1,"e":"","g":"美術・工芸・芸能"},{"n":46,"q":"平安時代の初め、越前国から分離されできた能登国や加賀国では、使節を受け入れるなど、ある国と積極的な交流を行ってきた。ある国とは次のうちどれか。","o":["唐","契丹","蝦夷","渤海"],"a":4,"e":"","g":"歴史"},{"n":47,"q":"金沢市には「加賀野菜」のほかにも、優れた野菜が多くある。金沢市では、金沢の風土をいかして生産された野菜を「金沢（　　）」に認定して、多くの人に食べてもらえるように取り組んでいる。（　　）には何が入るか。","o":["うまれ","たべもの","じわもん","そだち"],"a":4,"e":"","g":"自然・産業"},{"n":48,"q":"金沢には、クリの巨大木柱根が日本最多数の350本以上も見つかり、国指定史跡として整備されている縄文時代の遺跡がある。次のうち、その遺跡はどれか。","o":["チカモリ遺跡","塚崎遺跡","西念・南新保遺跡","北塚遺跡"],"a":1,"e":"","g":"歴史"},{"n":49,"q":"1874年(明治7)、「金沢製糸場」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月用水から水を引き、大きな水車を使って機械を動かしていた。次のうち、「金沢製糸場」をつくった人物は誰か。","o":["稲垣義方","森下八左衛門","長谷川準也","津田米次郎"],"a":3,"e":"","g":"偉人・人物"},{"n":50,"q":"金沢には四季それぞれの材料を使った加賀料理や、伝統的な技術をいかした和菓子など、豊かな食文化がある。下のシンボルマークが使われている、金沢の食文化がより豊かなものになることを願ってつくられたスローガンは次のうちどれか。","o":["五感にごちそうかなざわ","グッドマナーかなざわ","いしかわ百万石物語","新しい金沢、はじまる。"],"a":1,"e":"","g":"食・行事"}]},{"id":"j12c","label":"第12回ジュニア（中学生版）2017","q":[{"n":1,"q":"金沢市は石川県で最も人口が多い市である。2017年（平成29）4月現在で、金沢市の人口はおよそ何人か。","o":["35万人","46万人","52万人","63万人"],"a":2,"e":"","g":"市政・最近の話題"},{"n":2,"q":"歴史遺産や伝統文化が残る金沢は観光都市であり多くの観光客が訪れる。外国語による観光案内や、兼六園・金沢城などを専門に案内する観光ボランティアを何というか。","o":["まいどさん","もてなしさん","あんやとさん","いいね金沢さん"],"a":1,"e":"","g":"市政・最近の話題"},{"n":3,"q":"「ふらっとバス」は、金沢市内の交通が不便な地域の住宅地と、交通が便利な所や商店街などを結んでいる。現在4つのルートがあるが、此花・菊川・材木とあと1つのルートは何か。","o":["寺町","長町","堤町","片町"],"a":2,"e":"","g":"市政・最近の話題"},{"n":4,"q":"鎌倉時代のはじめには、金沢の高尾町・泉野町付近から三馬・久安付近を支配し、のちに加賀国の守護となり、歌舞伎「勧進帳」では安宅の関で源義経と弁慶を通したと伝えられている一族はどれか。","o":["林氏","前田氏","久安氏","富樫氏"],"a":4,"e":"","g":"歴史"},{"n":5,"q":"俵屋宗達や五十嵐道甫など有名な画家や職人を金沢に招き、江戸や京都と肩を並べるほど美術工芸を盛んにした加賀藩主は誰か。","o":["前田利家","前田利長","前田利常","前田慶寧"],"a":3,"e":"","g":"偉人・人物"},{"n":6,"q":"第2次世界大戦が終わった直後の1946年（昭和21）に伝統文化を守り、発展させるための専門的な学校が金沢市によってつくられた。この学校の現在の名前は何か。","o":["金沢美術工芸大学","石川県立大学","金沢大学","北陸先端科学技術大学院大学"],"a":1,"e":"","g":"歴史"},{"n":7,"q":"兼六園は、加賀藩5代藩主前田綱紀の別荘の茶室や庭が始まりであるが、1度につくられたものではない。12代藩主斉広が兼六園内に曲水をつくったとき、水を引いた用水の名前は何か。","o":["長坂用水","大野庄用水","辰巳用水","金洗沢"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":8,"q":"地域振興や観光振興の観点から地域名表示を弾力化した「ご当地ナンバー」として2006年（平成18）から「金沢」も表示できるようになった。この「ご当地ナンバー」をつけるものは何か。","o":["新幹線","自動車","ふるさと納税の商品","Wi-Fiスポット"],"a":2,"e":"","g":"市政・最近の話題"},{"n":9,"q":"金沢市の北部には、石川県で最も大きな潟があったが、現在はその3分の2が干拓され、農地となっている。その潟とは、次のうちのどれか。","o":["河北潟","邑知潟","木場潟","柴山潟"],"a":1,"e":"","g":"自然・産業"},{"n":10,"q":"1656年（明暦2）と1670年（寛文10）の2度、加賀藩が領内の村々に出した書面で、村の収穫高とそれに見合う年貢の割当が書かれたものを何というか。","o":["村御印","二日読","夫銀","小物成"],"a":1,"e":"","g":"歴史"},{"n":11,"q":"歴史都市である金沢では、統廃合により一度消えた町名を復活させる取り組みをしている。主計町・下石引町・飛梅町など現在までに11の町名が復活しているが、復活した町名の組み合わせとして正しいのはどれか。","o":["二十人町・醒ヶ井町・象眼町","吹屋町・石屋小路・玄蕃町","又五郎町・鍛冶町・主馬町","柿木畠・六枚町・南町"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":12,"q":"市民がいつでも生涯学習の情報に触れられるように、金沢市が定期的に発行しているイベントや講座を紹介する冊子を何というか。","o":["いいね金沢","みまっ誌","かけはし","たいあっぷ"],"a":2,"e":"","g":"市政・最近の話題"},{"n":13,"q":"江戸時代の金沢では舟運がさかんで、川を利用して各地の産物が金沢城下や川沿いの村々へと運ばれた。それらのうち加賀藩の年貢米を金沢城下の御蔵に運ぶのに利用されていた川はどれか。","o":["森下川","犀川","浅野川","大野川"],"a":1,"e":"","g":"歴史"},{"n":14,"q":"金沢が生んだ文豪で、「幼年時代」「性に眼覚める頃」などの小説や「犀川」という詩などを発表した人物は誰か。","o":["徳田秋声","泉鏡花","夏目漱石","室生犀星"],"a":4,"e":"","g":"文学"},{"n":15,"q":"1858年（安政5）におこった「安政の泣き一揆」の首謀者として処刑された人たちの霊を慰めるために、東山の寿経寺につくられたのは何か。","o":["七泣き地蔵","卯辰地蔵","七稲地蔵","七米地蔵"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":16,"q":"金沢市は、2009年（平成21）6月に、国連のユネスコから、独自の文化を産業と結びつけ、新しい価値を生み出している「創造都市」として認定された。このとき、金沢市が「創造都市」として認定されたのはどの分野か。","o":["ガーデン（庭園）","ピクチャー（絵画）","クラフト（工芸）","ミュージック（音楽）"],"a":3,"e":"","g":"市政・最近の話題"},{"n":17,"q":"江戸時代、金沢町人の財産争いを防ぐために、町の人々が義務付けられていた相続の方法は次のうちのどれか。","o":["長子相続","遺言状による相続","十人組による相続","町年寄りによる相続"],"a":2,"e":"","g":"歴史"},{"n":18,"q":"金沢仏壇の製造には、御細工所（加賀藩の工芸製作工場）の木地師、塗師、蒔絵師、彫刻師、金具師が完全分業体制であたっていた。金沢仏壇の特色として正しいものは、次のうちのどれか。","o":["繊細で変色しやすい。","組み立てに釘がたくさん使われている。","加賀蒔絵や金箔が使われている。","加賀友禅がふんだんに使われている。"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":19,"q":"1915年（大正4）から1951年（昭和26）まで、金石の地で、くりひろげられた高校のスポーツ大会は、次のうちのどれか。","o":["野球","水泳","マラソン","角力"],"a":4,"e":"","g":"歴史"},{"n":20,"q":"金沢市立図書館は現在4館ある。研究者などにも利用される古文書などを集めて保存する近世史料館が付属している図書館はどれか。","o":["玉川こども図書館","玉川図書館","泉野図書館","金沢海みらい図書館"],"a":2,"e":"","g":"市政・最近の話題"},{"n":21,"q":"加賀藩では村々を数十か村集めた「組」が作られていた。この「組」を支配した、身分は百姓であるが、武士からの命令を村々に伝えたりするなどの仕事を行った役人を何というか。","o":["肝煎","百姓代","十村","組合頭"],"a":3,"e":"","g":"歴史"},{"n":22,"q":"2016年（平成28）3月末に金沢市の観光調査報告書が公表され、2015年（平成27）1年間の観光施設の入場者数が明らかになった。入場者数の上位は、第2位が金沢城、第3位が21世紀美術館、第4位が県立美術館であったが、第1位はどこか。","o":["兼六園","からくり記念館","県立歴史博物館","妙立寺（忍者寺）"],"a":1,"e":"","g":"市政・最近の話題"},{"n":23,"q":"兼六園の中にあり、加賀藩13代藩主前田斉泰が母の住まいとして建てた建物は何か。","o":["竹沢御殿","蠑螺山","成巽閣","時雨亭"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":24,"q":"加賀藩では、1792年（寛政4）に、現在の兼六園内に藩校を建てた。このうち、士農工商の身分を問わず、8歳以上の男子が入校でき、儒学を中心に漢字・算術・医学・天文学などを学ぶことができた藩校を何というか。","o":["経武館","弘道館","鳴滝塾","明倫堂"],"a":4,"e":"","g":"歴史"},{"n":25,"q":"明治時代はじめ、明治維新に取り残された士族たちによってつくられた政治結社で、金沢に初めてつくられた政治結社を何というか。","o":["立志社","愛国社","忠告社","自助社"],"a":3,"e":"","g":"歴史"},{"n":26,"q":"藩政時代の金沢につくられた「広見」は、現在、地域の祭りや盆踊り、フリーマーケットなど、地域の人々のふれあいの場として活用されている。「広見」のもともとの利用目的は何か。","o":["防犯","防火","除雪","水防"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":27,"q":"金沢では1963年（昭和38）に三八豪雪と呼ばれる記録的な豪雪となった。連日20cmを超える雪が2週間以上降り続き、人々は2階の窓から家に出入りした。この豪雪時の、金沢の最大積雪量は約何cmか。","o":["80cm","180cm","280cm","380cm"],"a":2,"e":"","g":"自然・産業"},{"n":28,"q":"馬車鉄道しかなかった金沢にはじめて電車が走ったのは、1914年（大正3）である。今はもう走っていないが、その路線と営業していた鉄道会社はどれか。","o":["鶴来～野々市（石川電鉄）","武蔵ヶ辻～香林坊（香林坊電鉄）","金沢～内灘（浅野川電鉄）","金石～長田（金石電鉄）"],"a":4,"e":"","g":"歴史"},{"n":29,"q":"新潟県から富山県、石川県、福井県を経て、滋賀県に至る高速道路を北陸自動車道という。現在、金沢市に北陸自動車道のIC（インターチェンジ）は何か所あるか。","o":["1か所","3か所","6か所","8か所"],"a":2,"e":"","g":"市政・最近の話題"},{"n":30,"q":"北塚遺跡は縄文時代中期の遺跡である。この遺跡から日本で初めて出土したものは何か。","o":["クリの木柱根","文様入り帯金具","和同開珎銀銭","石でつくられた指輪"],"a":4,"e":"","g":"歴史"},{"n":31,"q":"現在、金沢市は、世界の7都市と姉妹都市提携をし、多くの交流事業を行っている。これら7つの姉妹都市を紹介するコーナーを持つ、駅西新町にある公園を何というか。","o":["金沢国際交流公園","七都市公園","姉妹都市公園","駅西新町公園"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":32,"q":"1488年（長享2）、鳥越弘願寺・吉藤専光寺・木越光徳寺を指導者とした一向宗農民門徒の一揆軍が、高尾城を攻撃して守護の富樫政親を倒した。この一揆を何というか。","o":["嘉吉の乱","鳥越の一揆","長享の一揆","高尾の一揆"],"a":3,"e":"","g":"歴史"},{"n":34,"q":"金沢では現在も能が盛んである。加賀藩5代藩主前田綱紀が取り入れたことから金沢で盛んになった能の流派は何か。","o":["金春流","和泉流","観世流","宝生流"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":35,"q":"豊臣秀吉に追放されたキリシタン大名であり、加賀藩2代藩主前田利長によって金沢に迎えられ、城づくりにも優れていた人物は誰か。","o":["大槻朝元（伝蔵）","寺島蔵人","佐久間盛政","高山右近"],"a":4,"e":"","g":"偉人・人物"},{"n":36,"q":"1872年（明治5）金沢県から石川県に名称が変わったとき、県庁が一時、金沢から移された場所はどこか。","o":["小松","美川","津幡","七尾"],"a":2,"e":"","g":"歴史"},{"n":37,"q":"1930年（昭和5）、金沢の上水道の整備が始まり、翌1931年（昭和6）から給水が行われた。犀川を水源とする金沢で初めてつくられ、現在も使われている浄水場はどこか。","o":["犀川浄水場","末浄水場","内川浄水場","伏見川浄水場"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":38,"q":"金沢は藩政時代から今日まで、様々な分野で活躍する多くの人々を育んできた。烏山頭ダムを完成させるなど、台湾で活躍し、不毛の大地を豊かな平野に変えたのは次のうち誰か。","o":["八田與一","木村栄","高峰譲吉","鈴木大拙"],"a":1,"e":"","g":"偉人・人物"},{"n":39,"q":"加賀藩2代藩主前田利長、3代藩主利常が金沢城防備のためにつくらせた、東西に分かれ二重にめぐらされた堀を何というか。","o":["大手堀","惣構堀","百間堀","白鳥堀"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":40,"q":"2014年（平成26）、金沢市は「めざすべき金沢の子ども像」を策定した。それを、市内の中学生が分かりやすく、覚えやすい言葉で表現した、子供たちの考え方や行動の基本的な約束事は何か。","o":["男女共同参画都市宣言","金沢市民憲章","かなざわ子育て夢プラン","金沢子どもかがやき宣言"],"a":4,"e":"","g":"市政・最近の話題"},{"n":41,"q":"金沢では7月のはじめに氷室饅頭や竹輪を食べ無病息災を願う風習があるが、江戸時代に行われていた「氷室の朔日」とはどのような行事か。","o":["年の初めに加賀藩主にお祝いの踊りを献上した。","お正月に加賀鳶の伝統の梯子登りを将軍に披露した。","夏に加賀藩から江戸の将軍に氷を献上した。","冬に金沢の銘菓を将軍に献上した。"],"a":3,"e":"","g":"食・行事"},{"n":42,"q":"金沢市は、西から東へとだんだん標高が上がり、険しい地形となっている。犀川の水源にもなっている、金沢市で最も高い山はどれか。","o":["三子牛山","医王山","奈良岳","キゴ山"],"a":3,"e":"","g":"自然・産業"},{"n":43,"q":"前田家の梅鉢紋をシンボル化した「現代版梅鉢紋」に箸を添えることで、金沢の食文化のすべてを表現した下のシンボルマークのスローガンはどれか。","o":["五感にごちそうかなざわ","五感にしあわせかなざわ","五感によろこびかなざわ","五感にうれしいかなざわ"],"a":1,"e":"","g":"食・行事"},{"n":44,"q":"毎年春の大型連休中に、石川県立音楽堂を中心として開催されていた大規模な音楽イベントである「ラ・フォル・ジュルネ」は、今年から独自のプログラムに基づく音楽祭に一新された。新しい音楽祭の名前は開催時期の5月頃をイメージしているが、何という名前か。","o":["いしかわ・金沢風と緑の楽都音楽祭","いしかわミュージックアカデミー","百万石音楽祭～ミリオンロックフェスティバル～","プロムナード金沢音楽祭"],"a":1,"e":"","g":"市政・最近の話題"},{"n":45,"q":"江戸時代の初め、後藤太兵衛が寺町台地を開墾し水田を作るため、犀川の支流の内川から水を引き、1671年（寛文11）に完成させた用水は何か。","o":["辰巳用水","鞍月用水","大野庄用水","長坂用水"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":46,"q":"今年の百万石まつりでは、歴代加賀藩主がたしなんだ（　　）狩りが初めて披露された。また、近年金沢駅で問題となっていたハトのふん害は、（　　）のパトロールによりゼロになった。（　　）の勇壮な姿は金沢駅の雰囲気に合っていると市民や観光客から人気を博した。（　　）には何が入るか。","o":["ワシ","タカ","トビ","ハヤブサ"],"a":2,"e":"","g":"市政・最近の話題"},{"n":47,"q":"明治時代、国は今の大学にあたる高等中学校を5校つくった。そのうちの1校が金沢につくられ、のちの金沢大学になった。この学校がつくられた当時の学校名は何か。","o":["第一高等中学校","第二高等中学校","第三高等中学校","第四高等中学校"],"a":4,"e":"","g":"歴史"},{"n":48,"q":"金沢城の石垣は当時最高の技術を持っていた穴太衆が担当して積んだが、金沢城の石垣にする石を切り出したことで有名な山はどれか。","o":["白山","卯辰山","戸室山","野田山"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":49,"q":"加賀藩の武士でも、身分の低い武士は暮らしが楽ではなかったので、内職などをした。主に行っていた内職は次のうちどれか。","o":["金箔をつくった。","双六をつくった。","アクセサリーをつくった。","お盆用の切子灯籠をつくった。"],"a":4,"e":"","g":"歴史"},{"n":50,"q":"今年の4月、金沢市磯部町にオープンしたプールは、県内初の屋内50mプール、飛び込みプール、25ｍサブプールを備え、2020年東京オリンピックでは水泳のフランス代表チームが事前合宿を行うことが決まっている。この北陸最大規模の屋内プールは何という名前か。","o":["健民海浜プール","城北市民運動公園屋内総合プール","金沢プール","金箔プール"],"a":3,"e":"","g":"市政・最近の話題"}]},{"id":"j10c","label":"第10回ジュニア（中学生版）2015","q":[{"n":1,"q":"金沢市は石川県で最も人口が多い都市である。2015年（平成27）4月現在、金沢市の人口はおよそどれだけか。","o":["26万人","46万人","66万人","86万人"],"a":2,"e":"","g":"市政・最近の話題"},{"n":2,"q":"写真は、宮越（現在の金石）地区に建てられた、ある人物の記念館である。江戸時代に一代で巨万の富を築き、「海の百万石」と呼ばれた豪商は誰か。","o":["木谷藤右衛門","大野弁吉","黒川良安","銭屋五兵衛"],"a":4,"e":"","g":"偉人・人物"},{"n":3,"q":"金沢には、たくさんの方言がある。金沢の方言の「ねまる」の意味は、次のうちどれか。","o":["かたむく","すわる","ゆったりと","ありがとう"],"a":2,"e":"","g":"金沢ことば"},{"n":4,"q":"江戸時代、各藩は家臣の教育のために学校（藩校）を建てた。1792年（寛政4）、加賀藩11代藩主の前田治脩のとき、兼六園内に経武館とともに建てられたのは何か。","o":["兵学校","天徳院","松下村塾","明倫堂"],"a":4,"e":"","g":"歴史"},{"n":5,"q":"1963年（昭和38）のいわゆる三八豪雪の雪害の教訓から、エネルギーの安定供給のために造られた石油備蓄基地はどこにあるか。","o":["金沢駅","金沢港","金沢市役所","金沢市民芸術村"],"a":2,"e":"","g":"自然・産業"},{"n":6,"q":"加賀藩の人々が豊かに生活できるように卯辰山の開発に取り組み、「養生所」、「撫育所」、「神社」などを建てた加賀藩最後の藩主は誰か。","o":["徳川慶喜","前田利長","前田利常","前田慶寧"],"a":4,"e":"","g":"偉人・人物"},{"n":7,"q":"前田家の梅鉢紋をシンボル化した「現代版梅鉢紋」に箸を添えることで、金沢の食文化のすべてを表現した下のシンボルマークのスローガンはどれか。","o":["五感にさわやかかなざわ","五感にたのしいかなざわ","五感にごちそうかなざわ","五感にうれしいかなざわ"],"a":3,"e":"","g":"食・行事"},{"n":8,"q":"江戸時代の町人には、生活を楽しむいろいろな年中行事があった。1月2日には初売りがあり、7日には七草がゆ祝いがあった。6月（今の7月頃）にあった、夏の暑さに負けないように「いり米」や「麦饅頭」を食べた行事を何というか。","o":["氷室","端午の節句","寺中大野湊神社神事能","えびす講"],"a":1,"e":"","g":"食・行事"},{"n":9,"q":"2014年（平成26）、金沢市は「めざすべき金沢の子ども像」をつくった。それを、金沢市内の中学生がわかりやすく覚えやすい言葉で表現した宣言を何というか。","o":["金沢子ども人権宣言","金沢子ども共同宣言","金沢子どもかがやき宣言","金沢子ども独立宣言"],"a":3,"e":"","g":"市政・最近の話題"},{"n":10,"q":"金沢城を中心にして発展してきた金沢の町は、廃藩置県により一気にさびれてしまった。そこで、町の賑わいを取りもどし産業を盛んにするため、1874年（明治7）に行われたのはどれか。","o":["ガス灯の設置","自由民権運動","金沢馬車鉄道の営業","金沢博覧会"],"a":4,"e":"","g":"歴史"},{"n":11,"q":"金沢市は石川県の加賀地方の北部に位置し、いくつかの市や町と接しているが、金沢市と接していないのはどれか。","o":["野々市市","白山市","川北町","津幡町"],"a":3,"e":"","g":"自然・産業"},{"n":12,"q":"加賀藩の農村には、田畑を持っている高持百姓と、田畑を持たない小作や日雇いで生活する頭振がいた。こうした村々を数十か村ずつ集めた組の支配を任せられたのが（　　）と呼ばれる役人であった。（　　）には何が入るか。","o":["肝煎","十村","改作奉行","郡奉行"],"a":2,"e":"","g":"歴史"},{"n":13,"q":"金沢駅兼六園口（東口）は、雨や雪の多い金沢で「駅を降りた人に傘を差し出す、（　　）の心」を表現した（　　）ドームができたことで、雨や雪に左右されない明るい空間になった。（　　）には何が入るか。","o":["もてなし","金沢","思いやり","雪国"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":14,"q":"加賀藩3代藩主の前田利常は、1651年（慶安4）から1656年（明暦2）に、村々の田の良し悪しや広さを調べ、その村の米の取れ高から年貢の率を決め、藩へ納める年貢を決めた。この改革を何というか。","o":["倹約令","版籍奉還","村御印","改作仕法（改作法）"],"a":4,"e":"","g":"歴史"},{"n":15,"q":"2015年（平成27）3月に北陸新幹線が金沢まで開業し、金沢−東京間が約2時間30分で行き来できるようになった。この北陸新幹線の名称を何というか。","o":["せせらぎ","かがやき","しらさぎ","ささやき"],"a":2,"e":"","g":"市政・最近の話題"},{"n":16,"q":"室町時代には、戦や争いが絶え間なく起こった。このようなときに北陸に現れたのが本願寺（浄土真宗）の（　　）であった。（　　）には誰が入るか。","o":["蓮如","妙珍","運良","日乗"],"a":1,"e":"","g":"偉人・人物"},{"n":17,"q":"江戸時代、小立野台地の先端にある金沢城では水が行きわたらず、水不足になることがあった。そこで、金沢城に水を引くため、加賀藩3代藩主の前田利常が板屋兵四郎に造らせた用水はどれか。","o":["大野庄用水","長坂用水","鞍月用水","辰巳用水"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":18,"q":"金沢城跡は、現在「金沢城公園」として親しまれ、市民の憩いの場となっているが、明治以後は陸軍の拠点となり、その後1995年（平成7）まで（　　）として利用されていた。（　　）には何が入るか。","o":["小学校","中学校","高校","大学"],"a":4,"e":"","g":"歴史"},{"n":19,"q":"1652年（慶安5）から1657年（明暦3）に、加賀藩では、町を治めるために17か条からなる法令を出した。金沢の町に住む人々が日常生活において守らなくてはならないことがらが細かく定められているこの法令を何というか。","o":["参勤交代","町方二日読","耕稼春秋","常々町中火之用心"],"a":2,"e":"","g":"歴史"},{"n":20,"q":"金沢市では、土地の歴史や人々の営み、情景を反映した由緒ある旧町名を1999年（平成11）以降復活させている。その第1号となった町名はどれか。","o":["袋町","六枚町","南町","主計町"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":21,"q":"江戸時代、金沢の各地にあった市場を現在の武蔵ヶ辻に集め、近江町市場のもとができた。2009年（平成21）、近江町市場は再開発事業により生まれ変わり、新たにシンボルとなる建物が建てられた。その建物を何というか。","o":["近江町青果館","近江町いちば館","近江町鮮魚館","近江町アーケード館"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":22,"q":"江戸時代、金沢町人の財産争いを防ぐために、町の人々に義務づけられていた相続の方法は次のどれか。","o":["遺言状による相続","長子相続","十人組による相続","町年寄による相続"],"a":1,"e":"","g":"歴史"},{"n":23,"q":"金沢には、公共交通の不便な地域を中心に、住宅地と商店街などを結んで循環するバスがある。此花・菊川・材木・長町の4ルートがあるこのバスの名称を何というか。","o":["金沢周遊バス","金沢まちバス","金沢ふらっとバス","兼六園シャトルバス"],"a":3,"e":"","g":"市政・最近の話題"},{"n":24,"q":"明治政府は、廃藩置県後にも、県の範囲や、町や村をどのように治めるかなど、いろいろ試した。こうして、1889年（明治22）にできたのが金沢市である。その初代市長になったのは誰か。","o":["高峰譲吉","稲垣義方","津田吉之助","岡良一"],"a":2,"e":"","g":"偉人・人物"},{"n":25,"q":"今日、日本中で遺跡の発掘調査が行われ、縄文人が高度な技術をもっていたことが明らかになっている。金沢市にある、日本で初めてクリの巨大木柱根が350本以上も発見された縄文時代晩期の遺跡を何というか。","o":["北塚遺跡","チカモリ遺跡","梅田Ｂ遺跡","畝田遺跡"],"a":2,"e":"","g":"歴史"},{"n":26,"q":"河川の上流には、水道水を確保したり、洪水を防ぐためにダムが見られることが多いが、辰巳ダムがあるのはどの川か。","o":["犀川","浅野川","伏見川","森下川"],"a":1,"e":"","g":"自然・産業"},{"n":27,"q":"1925年（大正14）、平沢嘉太郎が浅野川電鉄と協力し、巨額の資本を投じて建設した一大レジャー施設を何というか。","o":["兼六園","宝塚遊園","玉泉院丸庭園","粟崎遊園"],"a":4,"e":"","g":"歴史"},{"n":28,"q":"1289年（正応2）に、曹洞宗永平寺の名僧徹通義介が、加賀国を治めていた富樫家尚に頼まれて、野々市（のちに長坂町へ移転）に開いた寺を何というか。","o":["妙成寺","宝乗寺","大乗寺","傳燈寺"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":29,"q":"金沢市には、現在4つの図書館がある。古文書などを集めて保存する近世史料館が付属している図書館はどれか。","o":["玉川図書館","泉野図書館","玉川こども図書館","金沢海みらい図書館"],"a":1,"e":"","g":"市政・最近の話題"},{"n":30,"q":"加賀藩で、お城に一番近い所に屋敷があり、「年寄」という藩の政治の最高の役職を務めた重臣たちを何というか。","o":["八家","平士","与力","御歩"],"a":1,"e":"","g":"歴史"},{"n":31,"q":"2015年（平成27）北陸新幹線が金沢まで開業し、たくさんの人たちが仕事や観光で金沢を訪れるようになった。観光都市金沢を支えるボランティアで、まちの観光案内をする人たちを何というか。","o":["おんぼらさん","いんぎらさん","まいどさん","りくつさん"],"a":3,"e":"","g":"市政・最近の話題"},{"n":32,"q":"金沢の山地と平野の境で見られる地形（丘陵地）を、北から順に正しく並べたのはどれか。","o":["小立野台地→寺町台地→卯辰山","小立野台地→卯辰山→寺町台地","卯辰山→寺町台地→小立野台地","卯辰山→小立野台地→寺町台地"],"a":4,"e":"","g":"自然・産業"},{"n":33,"q":"江戸時代の初め、後藤太兵衛が寺町台地の開墾をはじめて、犀川の支流の内川から水を引き、1671年（寛文11）に完成させた用水を何というか。","o":["辰巳用水","長坂用水","鞍月用水","手取川七ケ用水"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":34,"q":"金沢の農業は米作りが中心だが、市街地近郊では野菜や花、果物などの栽培が盛んに行われている。このうち、金沢の風土を生かして生産された「金沢そだち」の3品目ではないのはどれか。","o":["すいか","だいこん","なし","しいたけ"],"a":4,"e":"","g":"自然・産業"},{"n":35,"q":"1669年（寛文9）、加賀に起きた暴風雨による洪水のために、多くの窮民（貧乏で生活に困っている人々）が出た。彼らを助けるために、当時では全国的にも例のない「お救い小屋」を建設した加賀藩5代藩主は誰か。","o":["前田綱紀","前田利常","前田利長","前田利家"],"a":1,"e":"","g":"偉人・人物"},{"n":36,"q":"冬の加賀料理といえば「かぶら寿司」があげられる。金沢の正月に欠かせないかぶら寿司に使われている食材は何か。","o":["えび","ぶり","かに","たい"],"a":2,"e":"","g":"食・行事"},{"n":37,"q":"金沢城内に「御細工所」という役所があり、高い技術を持った職人を京都や江戸から招いて細工人の指導にあたらせた。細工人の技術向上と工芸技術を保存し記録するために全国から収集した2,000点以上の工芸品を整理・分類したものを何というか。","o":["組合御用箱","加賀象嵌","百工比照","加賀蒔絵"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":38,"q":"1858年（安政5）は、夏に冷たい雨が降り続き、秋に稲が実らなかった。そこで、米の値上がりに苦しむ人々約2,000人が、卯辰山から金沢城の殿様（13代藩主前田斉泰）に叫んで訴えたという一揆を何というか。","o":["徳政一揆","土一揆","泣き一揆","一向一揆"],"a":3,"e":"","g":"歴史"},{"n":39,"q":"金沢市は世界の7都市と姉妹都市提携をしている。このうち、中学生同士の交流を行い、お互いの友好を深めているロシアの姉妹都市はどれか。","o":["ポルト・アレグレ市","イルクーツク市","蘇州市","ナンシー市"],"a":2,"e":"","g":"市政・最近の話題"},{"n":40,"q":"1888年（明治21）、石川郡安原村（現在の上安原町）で、日本初の耕地整理事業（曲がりくねった畦で仕切られたさまざまな形の田を縦・横一定の長さに調整し、農道や水路を計画的に配置する）を成しとげたのは誰か。","o":["高多久兵衛","長谷川準也","森下八左衛門","赤羽萬次郎"],"a":1,"e":"","g":"偉人・人物"},{"n":41,"q":"2015年（平成27）11月に、北陸新幹線金沢開業にあわせて「金沢マラソン」というフルマラソンが初開催される。この大会のキャッチフレーズは何か。","o":["金沢をまるごと「食べる！」","金沢をまるごと「走る！」","金沢をまるごと「遊ぶ！」","金沢をまるごと「体験する！」"],"a":2,"e":"","g":"市政・最近の話題"},{"n":42,"q":"1900年（明治33）、（　　）が力織機というなめらかな絹織物を織る機械を発明し、絹織物が発達した。（　　）には誰が入るか。","o":["中橋徳五郎","室生犀星","寺島蔵人","津田米次郎"],"a":4,"e":"","g":"偉人・人物"},{"n":43,"q":"加賀藩では、収入の少ない下級武士のくらしは決して楽ではなく、内職をして生計を立てる者が多くいた。このような下級武士の日常生活について学ぶことができる、旧清水家屋敷を何というか。","o":["前田土佐守家資料館","金沢文芸館","金沢蓄音機館","足軽資料館"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":44,"q":"金沢では、1871年（明治4）上堤町の城森丈治が大阪で1台買ってきたのが最初と伝えられている。1869年（明治2）に、福岡藩士の和泉要助たちが荷車を改良して造った乗り物は何か。","o":["自動車","人力車","機関車","乳母車"],"a":2,"e":"","g":"歴史"},{"n":45,"q":"市民がいつでも生涯学習の情報に触れられるように金沢市が定期的に発行している、イベントや講座を紹介する冊子を何というか。","o":["たいあっぷ","かけはし","いいね金沢","みまっ誌"],"a":4,"e":"","g":"市政・最近の話題"},{"n":46,"q":"1878年（明治11）、旧加賀藩士の島田一良らが、当時の藩閥政治に対する不満から、東京麹町区紀尾井町の路上で、馬車で皇居へ向かう途中の政府高官を暗殺する事件を起こした。この時、暗殺された政府高官は誰か。","o":["木戸孝允","西郷隆盛","大久保利通","板垣退助"],"a":3,"e":"","g":"歴史"},{"n":47,"q":"金沢には、その地名の由来ともいわれる「芋ほり藤五郎の地名伝説」と時期的にも共通する興味深い遺跡がいくつかある。そのうち、日本で最も多い580枚の和同開珎が出土した「さこ山遺跡」と関連がある山はどれか。","o":["戸室山","卯辰山","奈良岳","三小牛山"],"a":4,"e":"","g":"歴史"},{"n":48,"q":"今から約40〜50年前、高度経済成長が起きる前の頃、金沢市内のいたるところで沢やわき水が見られた。このわき水のことを何というか。","o":["ごっくり","さらさら","ちょろちょろ","もっくり"],"a":4,"e":"","g":"金沢ことば"},{"n":49,"q":"茶道普及のために京都から職人を招いて作らせた金沢の代表的な焼き物がある。ろくろを使わず手びねりによって作られた、独特の味わいのある飴色が特色の焼き物を何というか。","o":["九谷焼","大樋焼","有田焼","珠洲焼"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":50,"q":"金沢市には、市民一人ひとりが地域の一員としての責任を自覚し、金沢の美しい自然と、かおり高い伝統文化を守り育てるために作られた「金沢市民憲章」という目標がある。その中に5つの条文があり「ひらこう」には「世界と未来に心の窓を」、「めざそう」には「いきいきと明るいくらしの創造を」という語が続く。では、「きずこう」にはどんな語が続くか。","o":["個性ゆたかなあすの金沢を","美しい心とふるさとの自然を","みんなの力でまちづくりの手を","地震に強い丈夫なまちを"],"a":1,"e":"","g":"市政・最近の話題"}]},{"id":"j9c","label":"第9回ジュニア（中学生版）2014","q":[{"n":1,"q":"金沢市は、2009年（平成21）に、ユネスコ創造都市ネットワークのクラフト（工芸）の分野で認定を受けた。手仕事の「手」と、よいものを見極める「目」を表現した下のシンボルマークを何というか。","o":["テトメデス","テシゴトン","クラフトス","テメイイネ"],"a":1,"e":"","g":"市政・最近の話題"},{"n":2,"q":"1584年（天正12）に起こった末森の戦いは、加賀藩初代藩主の前田利家と越中の（　　）との戦いである。（　　）には誰が入るか。","o":["織田信長","奥村永福","佐々成政","土井利勝"],"a":3,"e":"","g":"歴史"},{"n":3,"q":"金沢市は、東経136度、北緯36度の位置にある。ほぼ同経度にある都市は次のどれか。","o":["ヘルシンキ（フィンランド）","ハバロフスク（ロシア）","サンパウロ（ブラジル）","ロサンゼルス（アメリカ）"],"a":2,"e":"","g":"自然・産業"},{"n":4,"q":"1900年（明治33）に、日本初の羽二重（なめらかでつやのある薄い絹織物）を織る力織機を発明したのが（　　）である。1918年（大正7）には、その功績をたたえて（　　）の銅像が卯辰山に建てられた。（　　）には誰が入るか。","o":["中谷宇吉郎","高光一也","三浦彦太郎","津田米次郎"],"a":4,"e":"","g":"偉人・人物"},{"n":5,"q":"金沢市の市章は1891年（明治24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。","o":["桜","梅","松","桃"],"a":2,"e":"","g":"市政・最近の話題"},{"n":6,"q":"北陸新幹線の開業に向けて、金沢市では石川県や友好交流都市等と連携しながら金沢の魅力を発信している。北陸新幹線の東京―金沢間はいつ開業予定か。","o":["2015年（平成27）","2016年（平成28）","2017年（平成29）","2018年（平成30）"],"a":1,"e":"","g":"市政・最近の話題"},{"n":7,"q":"8〜10世紀頃、唐（中国）から独立した「渤海」という国があった。この国と日本との交流は盛んで、犀川河口が渤海の使者の受け入れ口だったといわれている。この交流があったことの証拠として畝田ナベタ遺跡から出土したものは何か。","o":["弥生土器","珠文鏡","文様入り帯金具","籃胎漆器"],"a":3,"e":"","g":"歴史"},{"n":8,"q":"加賀藩最後の藩主である前田慶寧が、加賀藩の人々が豊かに生活できるようにと「養生所（病院）」や「撫育所（福祉施設）」の設置、織物・製紙などの工場の建設を行って開発を進めたのはどこか。","o":["卯辰山","白山","戸室山","野田山"],"a":1,"e":"","g":"歴史"},{"n":9,"q":"金沢には、金沢市無形民俗文化財に指定された伝統行事が今もたくさん残っている。斧や刀、弓を持った山伏が各家をまわる金石町や大野町で行われている行事はどれか。","o":["はしご登り","加賀宝生","さかたおどり","悪魔払い"],"a":4,"e":"","g":"食・行事"},{"n":10,"q":"1945年（昭和20）以前から栽培され、現在も主に金沢で栽培されている野菜15品目は「加賀野菜」と呼ばれている。次のうち、加賀野菜ではないものはどれか。","o":["打木赤皮甘栗かぼちゃ","赤ずいき","賀茂なす","金時草"],"a":3,"e":"","g":"食・行事"},{"n":11,"q":"金沢にはたくさんの方言がある。その中で「行儀がよい子」をあらわす方言はどれか。","o":["かたい子","きかん子","てきない子","おとろし子"],"a":1,"e":"","g":"金沢ことば"},{"n":12,"q":"江戸時代は、お金として金、銀、銭が使用されていた。加賀藩では18世紀の中頃になると財政が大変苦しくなり、倹約策や年貢米の取り立てを厳しくしたが、それでも苦しかったので、藩内だけに通用する（　　）を発行してしのごうとした。（　　）に入るのはどれか。","o":["米札","金札","銭札","藩札（銀札）"],"a":4,"e":"","g":"歴史"},{"n":13,"q":"1947年（昭和22）に、第2回国民体育大会が石川県で開催された。その大会歌として「参加者全員で歌える歌を」ということからできあがった歌はどれか。","o":["ふるさと","若い力","うみ","ラジオ体操の歌"],"a":2,"e":"","g":"歴史"},{"n":14,"q":"1889年（明治22）に市制がしかれた金沢市は、その後、隣接する石川郡や河北郡の町村を編入・合併しつつ市域を拡大した。現在の面積は約468㎢であるが、これは市制施行時に比べておよそ何倍の広さか。","o":["2倍","10倍","40倍","100倍"],"a":3,"e":"","g":"市政・最近の話題"},{"n":15,"q":"金沢の旧町名の由来として正しくないものはどれか。","o":["木倉町…藩政初期に軍用の味噌蔵が建っていた。","袋町……この町筋の北国街道の両端が曲がって袋のようであった。","並木町…浅野川の護岸のために川沿いに植えられた松並木にちなんだ。","主計町…加賀藩士、富田主計の屋敷があった。"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":16,"q":"金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともとは、防火の目的でつくられたといわれているこの空間を何というか。","o":["大通り","路地","公園","広見"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":17,"q":"1872年（明治5）、現在の郵便ポストにあたる書状集箱を置いた郵便函場が金沢に設置された。このとき金沢に設置された郵便函場は全部で何カ所あったか。","o":["2カ所","12カ所","52カ所","82カ所"],"a":2,"e":"","g":"歴史"},{"n":18,"q":"我が国が西洋化を進めた明治時代、金沢にも新聞、写真、人力車、洋服等が登場し、人々は新しいものに興味を持ちはじめた。金沢で発行された新聞の第1号は次のどれか。","o":["開化新聞","北陸新聞","文化新聞","石川新聞"],"a":1,"e":"","g":"歴史"},{"n":19,"q":"明治時代になり、金沢にも近代工業が芽生えはじめた。1874年（明治7）に長町の川岸につくられた「金沢製糸場」は、当時、国がつくった富岡製糸場（群馬県）に次いで全国第2位の大きな工場だった。この「金沢製糸場」をつくった実業家は誰か。","o":["徳田秋声","森下八左衛門","長谷川準也","赤羽萬次郎"],"a":3,"e":"","g":"偉人・人物"},{"n":20,"q":"金沢は伝統工芸が盛んであるが、このうち金箔は全国第1位の生産量を誇っている。金沢の金箔は日本の総生産量のおよそ何％を占めているか。","o":["66％","77％","88％","99％"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":21,"q":"金沢の農業は米作りが中心だが、市街地近郊では野菜や花、果物などの栽培が盛んに行われている。このうち、金沢の風土を生かして生産された「金沢そだち」の3品目に含まれないものはどれか。","o":["だいこん","すいか","バナナ","なし"],"a":3,"e":"","g":"自然・産業"},{"n":22,"q":"1599年（慶長4）、加賀藩2代藩主の前田利長は、金沢城防備のため、キリシタン大名としても有名な（　　）に命じて東西に内惣構堀（内堀）を造らせた。（　　）には誰が入るか。","o":["高山右近","横山長知","篠原一孝","奥村永福"],"a":1,"e":"","g":"歴史"},{"n":23,"q":"1889年（明治22）の市制施行時、10万人に満たなかった金沢市の人口は、現在およそ何万人か。","o":["6万人","46万人","66万人","86万人"],"a":2,"e":"","g":"市政・最近の話題"},{"n":24,"q":"緑に囲まれた「本多の森」にある3棟の赤レンガづくりの建物は、かつて兵器の倉庫や金沢美術工芸大学として使われていたが、現在は何に使われているか。","o":["石川県立図書館","金沢市足軽資料館","金沢くらしの博物館","石川県立歴史博物館"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":25,"q":"2015年（平成27）11月15日に、金沢の魅力発信や市民の健康増進を目的として「金沢○○○○」という1万人規模のスポーツ大会が開催される。○にあてはまる4文字のスポーツは何か。","o":["サッカー","やきゅう","マラソン","すいえい"],"a":3,"e":"","g":"市政・最近の話題"},{"n":26,"q":"2008年（平成20）7月28日の大雨で55年ぶりに氾濫し、防災の大切さを再認識させた川はどれか。","o":["金腐川","浅野川","犀川","伏見川"],"a":2,"e":"","g":"自然・産業"},{"n":27,"q":"市民がいつでも生涯学習の情報に触れられるように、金沢市が定期的に発行している冊子を何というか。","o":["みまっ誌","かけはし","いいね金沢","たいあっぷ"],"a":1,"e":"","g":"市政・最近の話題"},{"n":28,"q":"金沢に初めて電灯がともったのは、1894年（明治27）である。そのときにアーク灯がつけられた場所は、兼六園で開かれた関西府県連合共進会場と、ある神社の門前であった。ある神社とはどこか。","o":["尾山神社","尾崎神社","石浦神社","平岡野神社"],"a":1,"e":"","g":"歴史"},{"n":29,"q":"金沢には様々なボランティア団体がある。そのうち「まいどさん」はどのようなボランティアを行う団体か。","o":["まちを元気にする挨拶ボランティア","まちをきれいにする清掃ボランティア","まちの案内をする観光ボランティア","金沢名物を販売する行商ボランティア"],"a":3,"e":"","g":"市政・最近の話題"},{"n":30,"q":"金沢の伝統工芸のひとつに、加賀藩5代藩主の前田綱紀が茶道を広めるために京都から職人を招いて作らせた焼き物がある。ろくろを使わず手びねりによって一つ一つ作ることや、独特の味わいのある飴色が特徴のこの焼き物を何というか。","o":["珠洲焼","信楽焼","九谷焼","大樋焼"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":31,"q":"金沢には、昔から伝わる年中行事が今も数多く残っている。そのうち7月1日に関係が深いものはどれか。","o":["消防の「出初式」","「氷室」の饅頭","墓参りの「切籠」","「七五三」の宮参り"],"a":2,"e":"","g":"食・行事"},{"n":32,"q":"2010年（平成22)に金沢の中心部に開館した「しいのき迎賓館」は、ギャラリーやレストランなどが設けられているが、以前はどのような建物だったか。","o":["裁判所","図書館","県庁","消防署"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":33,"q":"金沢の山地と平野の境で見られる地形（丘陵地）を、北から順に正しく並べたのはどれか。","o":["小立野台地→寺町台地→卯辰山","小立野台地→卯辰山→寺町台地","卯辰山→寺町台地→小立野台地","卯辰山→小立野台地→寺町台地"],"a":4,"e":"","g":"自然・産業"},{"n":34,"q":"金沢と協定を結んでいる国内交流都市のうち、江戸時代に参勤交代などに利用された加賀藩の下屋敷があったことから、今でも「加賀小中学校」「金沢小学校」など、金沢にゆかりの深い地名や学校名が残っているのはどこか。","o":["東京都板橋区","岐阜県高山市","愛知県豊田市","長野県松本市"],"a":1,"e":"","g":"市政・最近の話題"},{"n":35,"q":"1858年（安政5）、凶作による米の値上がりに苦しむ人々が、卯辰山から金沢城に向かい「ひもじいわいやー」「米くれまいやー」と泣き叫んだ。この「安政の泣き一揆」で処刑された7人の霊をなぐさめるため、東山の寿経寺につくられたのは何か。","o":["泣き地蔵","七稲地蔵","泣き観音","七稲観音"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":36,"q":"金沢市は、世界の7都市と姉妹都市提携をしている。次のうち、姉妹都市ではない都市はどれか。","o":["蘇州市","ナンシー市","ポルト・アレグレ市","サンフランシスコ市"],"a":4,"e":"","g":"市政・最近の話題"},{"n":37,"q":"1898年（明治31）に金沢まで通じた北陸線は、その後、旅客を運ぶ中心となった。現在、金沢にはＪＲ北陸本線の駅はいくつあるか。","o":["1つ","2つ","3つ","4つ"],"a":4,"e":"","g":"市政・最近の話題"},{"n":38,"q":"北陸地方は世界的な豪雪地帯である。金沢気象台が観測を始めてから最大の記録で、新雪総計343㎝、最大積雪181㎝を記録した北陸地方の大雪を何というか。","o":["昭和一八豪雪","昭和三八豪雪","昭和四八豪雪","昭和五八豪雪"],"a":2,"e":"","g":"自然・産業"},{"n":39,"q":"金沢の地域福祉活動の原点でもあり、生活相談や託児（小さな子供たちを預かること）などの援助を行い、地域の福祉・社会教育の拠点として、1934年（昭和9）から建てられた施設を何というか。","o":["善隣館","友好館","交流館","福祉館"],"a":1,"e":"","g":"歴史"},{"n":40,"q":"2015年（平成27）に東京−金沢間で開業する北陸新幹線は7つの都県を通過する。この7つの都県に含まれないのはどれか。","o":["新潟県","長野県","群馬県","静岡県"],"a":4,"e":"","g":"市政・最近の話題"},{"n":41,"q":"金沢には、明治時代にすぐれた文学作品を残した三文豪と呼ばれる人たちがいる。有名な文学者である尾崎紅葉の門下生となり、「黴」「あらくれ」「縮図」などの小説を発表したのは誰か。","o":["泉鏡花","徳田秋声","竹久夢二","室生犀星"],"a":2,"e":"","g":"文学"},{"n":42,"q":"加賀藩3代藩主の前田利常が、前田家ゆかりの寺院を集めた寺院群はどこか。","o":["寺町寺院群","卯辰山山麓寺院群","小立野寺院群","金沢寺院群"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":43,"q":"金沢から江戸まで、2,000人以上のお供を引き連れて1年おきに行われる加賀藩の参勤交代は、諸大名の中でも最大規模であった。そのコースは3つあったといわれているが、最も多く利用された中山道へつながる街道を何というか。","o":["東海道","北国上街道","北陸道","北国下街道"],"a":4,"e":"","g":"歴史"},{"n":44,"q":"金沢市は、2009年（平成21）に国から「歴史都市」として認定された。そのため、歴史都市のまちなみや風景を守り、後世に伝えていくために様々な努力をしている。次のうち、歴史都市金沢に関係した法律・条例にあてはまらないものはどれか。","o":["森づくり条例","文化財保護法","歴史まちづくり法","こまちなみ保存条例"],"a":1,"e":"","g":"市政・最近の話題"},{"n":45,"q":"現在、金沢城跡は金沢城公園として親しまれ市民の憩いの場となっているが、以前この場所には何があったか。","o":["図書館","大学","市役所","美術館"],"a":2,"e":"","g":"歴史"},{"n":46,"q":"2011年（平成23）に金沢市出身の哲学者の記念館が建てられた。この哲学者は、仏教の考え方を英語の本や講演を通して、アメリカをはじめとする世界中の人たちに広めた。その哲学者は誰か。","o":["高峰譲吉","鈴木大拙","八田與一","木村栄"],"a":2,"e":"","g":"偉人・人物"},{"n":47,"q":"金沢の地形を眺めると、東部の山地から西部の海岸に向かって川が流れていることがわかる。金沢を流れる川で最も長い川はどれか。","o":["森下川","木曳川","犀川","高橋川"],"a":3,"e":"","g":"自然・産業"},{"n":48,"q":"金沢近郊の御供田村に住んでいた、もと十村役の土屋又三郎が1707年（宝永4）に完成させた、月ごとの農作業や農具の形などをまとめた書物を何というか。","o":["百工比照","庶物類纂","一東視窮録","耕稼春秋"],"a":4,"e":"","g":"歴史"},{"n":49,"q":"2009年(平成21）に、近江町市場が再開発事業により生まれ変わった。新たにシンボルとなった建物を何というか。","o":["近江町青果館","近江町鮮魚館","近江町いちば館","近江町アーケード"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":50,"q":"加賀には、室町時代から加賀絹を梅の樹皮の煎汁に浸して染める無地染めがあり、「加賀染め」といわれていた。そこから発展し、「ぼかし」や「虫食い」などの技法を用いるようになった伝統工芸は何か。","o":["加賀友禅","加賀繍","二俣和紙","加賀蒔絵"],"a":1,"e":"","g":"美術・工芸・芸能"}]},{"id":"j8c","label":"第8回ジュニア（中学生版）2013","q":[{"n":1,"q":"8〜10世紀頃、唐（中国）から独立した「渤海」という国があった。この国と日本との交流は盛んで、犀川河口が渤海の使者の受け入れ口だったといわれている。この交流があったことの証拠として畝田ナベタ遺跡から出土したものは何か。","o":["須恵器","珠文鏡","籃胎漆器","文様入り帯金具"],"a":4,"e":"","g":"歴史"},{"n":2,"q":"金沢市は、2009年（平成21）に、ユネスコ創造都市ネットワークのクラフト（工芸）の分野で認定を受けた。手仕事の「手」とよいものを見極める「目」を表現したこのシンボルマークを何というか。","o":["ミミトメデス","キンパックン","テトメデス","ケンロック"],"a":3,"e":"","g":"市政・最近の話題"},{"n":3,"q":"金沢市では、下の写真の場所で縄文時代以前の旧石器時代に人間が活動していたことが確認されている。この旧石器時代の石器が出土した場所はどこか。","o":["金沢城跡","兼六園","中央公園","金沢駅"],"a":1,"e":"","g":"歴史"},{"n":4,"q":"金沢には、その地名の由来ともいわれる「芋ほり藤五郎の伝説」と時期的にも共通する興味深い遺跡がいくつかある。そのうち、日本で最も多い580枚の和同開珎が出土している遺跡はどれか。","o":["岩宿遺跡","吉野ヶ里遺跡","三小牛さこ山遺跡","登呂遺跡"],"a":3,"e":"","g":"歴史"},{"n":5,"q":"1289年（正応2）に、曹洞宗永平寺の名僧である徹通義介が、加賀の国を治めていた富樫家尚に頼まれて開いた寺はどれか。","o":["大乗寺","総持寺","本願寺","東大寺"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":6,"q":"1898年（明治31）に金沢まで通じた北陸線は、その後旅客を運ぶ中心となった。現在、金沢にはＪＲ北陸本線の駅はいくつあるか。","o":["1つ","2つ","3つ","4つ"],"a":4,"e":"","g":"市政・最近の話題"},{"n":7,"q":"「本多の森」にある3棟の赤レンガづくりの建物は、かつて兵器の倉庫や金沢美術工芸大学として使われていたが、現在は何に使われているか。","o":["石川県立歴史博物館","石川県立図書館","金沢くらしの博物館","金沢市足軽資料館"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":8,"q":"1488年（長享2）に、農民や僧たちが中心になって一向一揆を起こし守護富樫政親をたおしたことから、加賀の国は「（　　）の持ちたる国」と言われた。（　　）にはどの言葉が入るか。","o":["職人","百姓","武士","町人"],"a":2,"e":"","g":"歴史"},{"n":9,"q":"江戸時代には多くの科学者が金沢で活躍した。その中で、「優れたからくり師」、「加賀の平賀源内」と称され、からくりや工芸品、エレキテル、写真術などを残したのは誰か。","o":["飯盛里安","大野弁吉","土屋又三郎","渋川春海"],"a":2,"e":"","g":"偉人・人物"},{"n":10,"q":"金沢仏壇の特色には、変色しないことと釘がほとんど使われていないことがあげられる。この金沢仏壇の製造と関係のないものはどれか。","o":["加賀象嵌","加賀蒔絵","有田焼","金沢箔"],"a":3,"e":"","g":"美術・工芸・芸能"},{"n":11,"q":"加賀藩5代藩主の前田綱紀が、細工人の技術向上と工芸技術の保存・記録のために、全国からよりすぐって収集した2,000点以上の工芸品を整理・分類してつくったものは何か。","o":["庶物類纂","新撰数学","耕稼春秋","百工比照"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":12,"q":"1599年（慶長4）に、加賀藩2代藩主の前田利長が金沢城防備のため高山右近に命じて東西に造らせた堀はどれか。","o":["内惣構堀","大手堀","蓮池堀","百間堀"],"a":1,"e":"","g":"歴史"},{"n":13,"q":"1873年（明治6）に、名古屋からやってきた軍隊が金沢におかれた。その軍隊は何と呼ばれていたか。","o":["第4連隊","第5連隊","第6連隊","第7連隊"],"a":4,"e":"","g":"歴史"},{"n":14,"q":"金沢が生んだ三文豪のひとりで、「照葉狂言」、「滝の白糸」、「高野聖」などの作品を発表したのは誰か。","o":["芥川龍之介","泉鏡花","竹久夢二","尾崎紅葉"],"a":2,"e":"","g":"文学"},{"n":15,"q":"次の方言のうち、金沢の方言ではないものはどれか。","o":["おっかめる","きんかんなまなま","もみじこ","りくつな"],"a":1,"e":"","g":"金沢ことば"},{"n":16,"q":"江戸時代、各藩は家臣の教育のために学校（藩校）を建てた。加賀藩11代藩主の前田治脩がつくらせた、士農工商の身分を問わず8歳以上の男子が入校できた藩校はどれか。","o":["慶應義塾","寺子屋","松下村塾","明倫堂"],"a":4,"e":"","g":"歴史"},{"n":17,"q":"金沢の今町に生まれ、台湾に当時アジア最大といわれた烏山頭ダムや16,000キロメートルに及ぶ水路を完成させ、不毛の大地を豊かな平野に変えた金沢の偉人は誰か。","o":["三宅雪嶺","中西悟堂","八田與一","木村栄"],"a":3,"e":"","g":"偉人・人物"},{"n":18,"q":"金沢の農業は米作りが中心だが、市街地近郊では野菜や花などの栽培が盛んに行われている。このうち、古くから栽培されている加賀野菜は現在何種類あるか。","o":["4","15","22","30"],"a":2,"e":"","g":"食・行事"},{"n":19,"q":"1858年（安政5）に、凶作による米の値上がりに苦しむ人々約2,000人が、卯辰山から金沢城に向かって「ひもじいわいやー」、「米くれまいやー」と泣き叫んだ。この「安政の泣き一揆」で処刑された7人を祀った七稲地蔵があるのはどこか。","o":["法隆寺","寿経寺","那谷寺","瑞龍寺"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":20,"q":"金沢は昔から能楽が盛んで「空から謡が降ってくる」といわれるまちだが、現在も金沢で盛んな能楽の流派はどれか。","o":["宝生流","金春流","金剛流","観世流"],"a":1,"e":"","g":"美術・工芸・芸能"},{"n":21,"q":"1697年（元禄10）頃の金沢は、江戸、大坂、京都に次ぐ大都市だったといわれており、町の賑わいが「金沢城下図屏風」に描かれている。「金沢城下図屏風」に描かれているのはどこか。","o":["兼六園付近","南町付近","犀川大橋付近","金沢駅付近"],"a":3,"e":"","g":"歴史"},{"n":22,"q":"1871年（明治4）の廃藩置県により、金沢の町は一気にさびれてしまった。そこで、町の賑わいを取り戻し産業を盛んにするため、1874年（明治7）に「金沢博覧会」を開催した富豪の商人はだれか。","o":["永井柳太郎","中谷宇吉郎","前田慶寧","木谷藤十郎"],"a":4,"e":"","g":"偉人・人物"},{"n":23,"q":"新潟、富山、石川、福井、滋賀を結ぶ北陸自動車道は、1972年（昭和47）から順次開通した。金沢で1番初めにできたＩＣ（インターチェンジ）はどれか。","o":["金沢森本ＩＣ","野々市ＩＣ","金沢西ＩＣ","白山ＩＣ"],"a":3,"e":"","g":"市政・最近の話題"},{"n":24,"q":"1632年（寛永9）、板屋兵四郎に命じて辰巳用水をつくらせたり、俵屋宗達や五十嵐道甫など有名な画家や職人を金沢に招き美術工芸を奨励した加賀藩主は誰か。","o":["前田利家","前田利長","前田利常","前田光高"],"a":3,"e":"","g":"偉人・人物"},{"n":25,"q":"加賀には、室町時代から加賀絹を梅の樹皮の煎汁に浸して染める無地染めがあり、「加賀染め」といわれていた。そこから発展し、「ぼかし」や「虫食い」などの技法を用いるようになった伝統工芸は何か。","o":["九谷焼","加賀繍","二俣和紙","加賀友禅"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":26,"q":"現在、金沢城跡は金沢城公園として親しまれ市民の憩いの場となっているが、以前この場所には何があったか。","o":["金沢能楽美術館","金沢大学","金沢市民芸術村","金沢市役所"],"a":2,"e":"","g":"歴史"},{"n":27,"q":"2012年（平成24）に金沢市でスタートした、人や環境にやさしい公共レンタサイクルシステム「まちのり」を説明したもので正しくないものはどれか。","o":["1日200円で、1回30分以内なら何回でも自転車を借りることができる。","自転車は、借りた場所と違うポートに返却できる。","自転車をみんなでシェア（共同利用）するものである。","1度借りたら3日間返さなくてもよい。"],"a":4,"e":"","g":"市政・最近の話題"},{"n":28,"q":"金沢には様々なボランティア団体がある。そのうち、「まいどさん」はどのようなボランティアを行う団体か。","o":["まちの案内をする観光ボランティア","まちを元気にする挨拶ボランティア","まちをきれいにする清掃ボランティア","金沢名物を販売する行商ボランティア"],"a":1,"e":"","g":"市政・最近の話題"},{"n":29,"q":"金沢の山地と平野の境で見られる地形（丘陵地）を北から順に正しく並べたのはどれか。","o":["小立野台地→寺町台地→卯辰山","卯辰山→小立野台地→寺町台地","卯辰山→寺町台地→小立野台地","小立野台地→卯辰山→寺町台地"],"a":2,"e":"","g":"自然・産業"},{"n":30,"q":"2010年（平成22）に金沢の中心部に開館した「しいのき迎賓館」は、ギャラリー、セレクトショップ、レストランなどが設けられているが、以前はどのような建物だったか。","o":["病院","図書館","県庁","学校"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":31,"q":"金沢には、昔から伝わる年中行事が今も数多く残っている。新年の正月に関係が深いものはどれか。","o":["消防の「出初式」","「氷室」の饅頭","墓参りの「切籠」","「七五三」の宮参り"],"a":1,"e":"","g":"食・行事"},{"n":32,"q":"金沢と協定を結んでいる国内交流都市で、江戸時代に加賀藩の下屋敷があり、今でも「加賀小中学校」、「金沢小学校」など、金沢にゆかりの深い地名が残っているのはどこか。","o":["愛知県豊田市","岐阜県高山市","長野県松本市","東京都板橋区"],"a":4,"e":"","g":"市政・最近の話題"},{"n":33,"q":"金沢の伝統工芸のひとつに、加賀藩5代藩主の前田綱紀が茶道を広めるために京都から職人を招いて作らせた焼き物がある。独特の味わいのある飴色が特色のこの焼き物は何か。","o":["珠洲焼","大樋焼","備前焼","伊万里焼"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":34,"q":"金沢市の姉妹都市は全部で7都市ある。次のうち、ベルギーの姉妹都市はどれか。","o":["ゲント市","ナンシー市","バッファロー市","イルクーツク市"],"a":1,"e":"","g":"市政・最近の話題"},{"n":35,"q":"金沢市は石川県で最も人口が多い。2013年（平成25）4月現在、金沢市の人口はおよそどれだけか。","o":["26万人","46万人","66万人","86万人"],"a":2,"e":"","g":"市政・最近の話題"},{"n":36,"q":"2008年（平成20）7月28日の大雨で、55年ぶりに氾濫し防災の大切さを再認識させた川はどれか。","o":["森下川","伏見川","浅野川","千曲川"],"a":3,"e":"","g":"自然・産業"},{"n":37,"q":"金沢気象台が観測を始めてから最大の記録で、新雪総計343センチメートル、最大積雪181センチメートルとなった北陸地方の大雪を何というか。","o":["昭和一二豪雪","昭和二六豪雪","昭和三八豪雪","昭和五四豪雪"],"a":3,"e":"","g":"自然・産業"},{"n":38,"q":"地域の住民が主体となって運営し、子供向けから高齢者向けまでの様々な教室を開くなど、地域の生涯学習の中心となっている組織は何か。","o":["公民館","善隣館","児童館","図書館"],"a":1,"e":"","g":"市政・最近の話題"},{"n":39,"q":"2015年（平成27）11月15日に、金沢の魅力発信や市民の健康増進を目的として、「金沢○○○○」という1万人規模のスポーツ大会が開催される。○にあてはまる4文字のスポーツは何か。","o":["サッカー","やきゅう","すいえい","マラソン"],"a":4,"e":"","g":"市政・最近の話題"},{"n":40,"q":"金沢は伝統工芸が盛んであるが、日本の総生産量の99％を占め、全国第1位の生産量を誇っているものは何か。","o":["ガラス細工","金箔","陶器","漆器"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":41,"q":"加賀藩最後の藩主で、藩の人々のために卯辰山に「養生所」と呼ばれる病院を建てたり、犀川を埋め立てた土地を町民に与えたのは誰か。","o":["前田利家","前田利長","前田利常","前田慶寧"],"a":4,"e":"","g":"偉人・人物"},{"n":42,"q":"2011年（平成23）に金沢市出身の哲学者の記念館が建てられた。この哲学者は、仏教の考え方を英語の本や講演を通して、アメリカをはじめとする世界中の人たちに広めた。その哲学者は誰か。","o":["鈴木大拙","藤岡作太郎","蓮如","高山右近"],"a":1,"e":"","g":"偉人・人物"},{"n":43,"q":"加賀藩初代藩主の前田利家とその正室芳春院、その他の歴代藩主や多くの金沢市民の墓があるのはどこか。","o":["キゴ山","野田山","白山","卯辰山"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":44,"q":"一向一揆が立てこもっていた金沢御堂を1580年（天正8）に攻め落とした後、城として再整備し、金沢城の初代城主になったのは誰か。","o":["前田利常","徳川家康","佐久間盛政","前田利長"],"a":3,"e":"","g":"歴史"},{"n":45,"q":"金沢から江戸まで、2,000人以上のお供を引き連れて1年おきに行われる加賀藩の参勤交代は、諸大名の中でも最大規模であった。そのコースは3つあったといわれているが、北国下街道を通る約480キロメートルのコースにはどれだけの期間を要したか。","o":["3日","13日","1ヶ月","1年"],"a":2,"e":"","g":"歴史"},{"n":46,"q":"1888年（明治21）に、現在の上安原町において日本で最初の耕地整理を行い農業発展の基礎をつくったのは誰か。","o":["高多久兵衛","森下八左衛門","勝海舟","大久保利通"],"a":1,"e":"","g":"偉人・人物"},{"n":47,"q":"金沢市には文化施設が数多くあるが、この中で金沢市にはない施設はどれか。","o":["ふるさと偉人館","石川ルーツ交流館","からくり記念館","安江金箔工芸館"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":48,"q":"金沢には、金沢市無形民俗文化財に指定された伝統行事が今もたくさん残っている。斧や刀、弓を持った山伏が各家をまわる、金石町や大野町で行われている行事はどれか。","o":["加賀獅子舞","はしご登り","さかたおどり","悪魔払い"],"a":4,"e":"","g":"食・行事"},{"n":49,"q":"2015年（平成27）に北陸新幹線が金沢まで開業し、金沢から東京まで乗り換えなしで行けるようになる。北陸新幹線を使った場合、金沢から東京までどれだけの時間で行けるか。","o":["約1時間","約2時間30分","約4時間30分","約6時間"],"a":2,"e":"","g":"市政・最近の話題"},{"n":50,"q":"「天然痘」という感染症にかからないための種痘（天然痘の予防接種）を、加賀藩で最初に行った科学者は誰か。","o":["黒川良安","銭屋五兵衛","西郷隆盛","関口開"],"a":1,"e":"","g":"偉人・人物"}]},{"id":"j13c","label":"第13回ジュニア（中学生版）2018","q":[{"n":1,"q":"現在の金沢は江戸時代には加賀藩の城下町であったが、それ以前は加賀国の一部であった。7世紀から9世紀にかけて加賀国ができていく様子を表したア～ウの地図を年代順に正しく並びかえたものは次のうちどれか。アイウ","o":["ア→イ→ウ","イ→ウ→ア","ウ→イ→ア","ア→ウ→イ"],"a":3,"e":"","g":"歴史"},{"n":2,"q":"金沢には多くの方言があり、「ごぼる」は雪に足がはまるという意味だが、「じゃまない」の意味は次のうちどれか。","o":["ありがとう","疲れた","大丈夫","ゆったりと"],"a":3,"e":"","g":"金沢ことば"},{"n":3,"q":"金沢の風土を活かして生産された「金沢そだち」にトマトときゅうりが2016年（平成28）新たに認証された。他に「金沢そだち」に認証されている作物として、大根・すいか（小玉すいか含む）が挙げられるが、夏から秋が出荷時期の作物でもう1つ認証されているのは何か。","o":["なし","りんご","いちご","みかん"],"a":1,"e":"","g":"自然・産業"},{"n":4,"q":"金沢城内の整備に熱心に取り組み、なまこ壁や鉛瓦の美しい装飾で有名な石川門や三十間長屋を作らせた加賀藩3代藩主は誰か。","o":["前田利家","前田利長","前田利常","前田綱紀"],"a":3,"e":"","g":"歴史"},{"n":5,"q":"金沢市の姉妹都市は全部で7都市あるが、今年のFIFAワールドカップにおいて、日本が決勝トーナメント初戦で対戦したベルギーにある姉妹都市はどこか。","o":["ゲント市","バッファロー市","イルクーツク市","ナンシー市"],"a":1,"e":"","g":"市政・最近の話題"},{"n":6,"q":"加賀藩では金沢城に一番近い所に本多・横山・長・奥村・前田家などの屋敷があり、これらの家は「年寄」という藩の政治の最高の役職を務めたが、この重臣たちを何というか。","o":["与力","平士","八家","御歩"],"a":3,"e":"","g":"歴史"},{"n":7,"q":"金沢は、加賀藩のころから学問や芸術が盛んで、明治以降も文化面で優れた人物を輩出してきた。「金沢の三文豪」は近年再注目されているが、その3人とは誰か。","o":["室生犀星・西田幾多郎・鈴木大拙","室生犀星・泉鏡花・徳田秋声","泉鏡花・徳田秋声・西田幾多郎","泉鏡花・室生犀星・鈴木大拙"],"a":2,"e":"","g":"文学"},{"n":8,"q":"馬車鉄道しかなかった金沢に、市内電車を走らせるまでには多くの問題があった。資金の問題や、藩政期からあまり変わっていない狭い道路、周辺住民の反対などが主な問題であったが、それらの問題を解決し、市内電車が初めて走ったのは、どの時代か。","o":["江戸時代中頃","江戸時代末期","大正時代","昭和時代"],"a":3,"e":"","g":"歴史"},{"n":9,"q":"18世紀に入ると、加賀藩の財政は苦しくなり、藩主は足軽の大槻朝元を用いて、財政の立て直しに取り組んだ。このことがきっかけで次々と騒動が起こったが、この騒動を何と呼ぶか。","o":["隠田摘発","銀札発行","打ち壊し騒動","加賀騒動"],"a":4,"e":"","g":"歴史"},{"n":10,"q":"金沢は昔から海産物が豊富で漁業もさかんな町である。漁獲量も多い金沢港に設けられた海産物の直売を行っている場所を何というか。","o":["あんやと漁場","市場館","新鮮市場","いきいき魚市"],"a":4,"e":"","g":"自然・産業"},{"n":11,"q":"豊臣秀吉にキリシタンとして追放され、領地を没収されたが、加賀藩初代藩主前田利家に迎えられ、金沢で熱心な布教を行い、多くの信者を得たのは誰か。","o":["高山右近","有馬晴信","大友義鎮","大村純忠"],"a":1,"e":"","g":"偉人・人物"},{"n":12,"q":"明治時代に、国が現在の大学にあたる高等中学校を全国に5校つくった。金沢の広坂につくられたそのうちの1校は金沢大学のもとになったが、この学校の校名を何というか。","o":["第一高等中学校","第二高等中学校","第三高等中学校","第四高等中学校"],"a":4,"e":"","g":"歴史"},{"n":13,"q":"金沢市では、市民が生涯にわたって心豊かに成長し続けることをサポートしているが、生涯学習の情報に市民がいつでも触れられるように、イベントや講座を紹介する冊子を何というか。","o":["やるまっ誌","しまっ誌","まなびまっ誌","みまっ誌"],"a":4,"e":"","g":"市政・最近の話題"},{"n":14,"q":"金沢には、金沢市無形民俗文化財に指定された伝統行事が今も数多く残っている。斧や刀、弓を持った山伏が各家をまわる金石町や大野町で行われている行事は次のうちどれか。","o":["加賀獅子","悪魔払い","加賀万歳","さかたおどり"],"a":2,"e":"","g":"食・行事"},{"n":15,"q":"16世紀、織田信長から能登一国、20万石余りを与えられた加賀藩初代藩主前田利家は、初めは畠山氏が築いた七尾城を拠点としたが、その後利家が新たに築いた城は次のうちどれか。","o":["金沢城","高尾城","小丸山城","三小牛山城"],"a":3,"e":"","g":"歴史"},{"n":16,"q":"金沢は水がきれいな町としても有名であるが、金沢の川が清流である証として多く捕れ、現在でも佃煮や天ぷらとして食されている魚は何か。","o":["ごり","ふな","いわな","やまめ"],"a":1,"e":"","g":"自然・産業"},{"n":17,"q":"金沢を訪れる観光客も増えている中で、金沢駅兼六園口と金沢市内中心部を結ぶ、わかりやすく便利な新しいバスシステムを導入したが、このバスシステムを何というか。","o":["金沢ぐるっとシャトル","まちなかシャトル","まわりまっしシャトル","ノンステップシャトル"],"a":2,"e":"","g":"市政・最近の話題"},{"n":18,"q":"1888年（明治21）、石川郡安原村（現在の上安原町）の地主だった高多久兵衛が、私財をなげうって、ある事業を成し遂げた。その結果、農作業の効率が上がったが、その事業は次のうちどれか。","o":["市営融雪・除雪事業","耕地整理事業","リサイクル事業","市営電気事業"],"a":2,"e":"","g":"偉人・人物"},{"n":19,"q":"金沢では現在も能が盛んである。加賀藩5代藩主前田綱紀が取り入れたことから金沢で盛んになった能の流派は次のうちどれか。","o":["宝生流","観世流","金春流","和泉流"],"a":1,"e":"","g":"美術・工芸・芸能"},{"n":20,"q":"1858年（安政5）に、凶作による米の値上がりに苦しむ2000人ほどの人々が卯辰山から金沢城にいる加賀藩13代藩主前田斉泰に向かって、「ひもじいわいやー」「米くれまいやー」と叫んで救済を訴えた一揆を何というか。","o":["加賀の一向一揆","徳政一揆","七稲地蔵一揆","泣き一揆"],"a":4,"e":"","g":"歴史"},{"n":21,"q":"金沢市民芸術村は、市民が自主的に企画したコンサートや芸術の練習の場として開放されているが、もともとは何の施設があったか。","o":["紡績工場","陸上競技場","バスターミナル","小学校"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":22,"q":"大正から昭和にかけて金沢の市街地は「モダン都市」の色合いが濃くなり、香林坊ではカフェ文化が盛んになった。当時のサラリーマンたちを引きつけたカフェとは主にどのような飲み物を出した店か。","o":["ジュース","日本茶","ビール","炭酸飲料"],"a":3,"e":"","g":"歴史"},{"n":23,"q":"近年、日本各地で縄文時代の遺跡の発掘調査が行われ、縄文人が高度な技術をもっていたことが明らかになっている。金沢市にある、日本で初めてクリの巨大木柱根が350本以上も発見され、全国的に注目をあびた縄文時代晩期の遺跡を何というか。","o":["北塚遺跡","梅田Ｂ遺跡","チカモリ遺跡","畝田遺跡"],"a":3,"e":"","g":"歴史"},{"n":24,"q":"金沢は1889年（明治22）に市制が敷かれ金沢市となり、次々とまわりの町村を合併して、現在では市制当初の40倍もの大きな市域となった。現在、市域に入っている町村は次のうちどれか。","o":["白峰村","犀川村","津幡町","鶴来町"],"a":2,"e":"","g":"市政・最近の話題"},{"n":25,"q":"江戸時代に加賀国の宮腰で生まれ、廻船業によって日本有数の豪商となった人物は全国に34か所の支店・出張所をもっていた。この人物は誰か。","o":["黒川良安","大野弁吉","木谷藤右衛門","銭屋五兵衛"],"a":4,"e":"","g":"偉人・人物"},{"n":26,"q":"1488年（長享2）、鳥越弘願寺・吉藤専光寺・木越光徳寺を指導者とした一向宗農民門徒が、高尾城を攻撃して守護を倒した。これを「長享の一揆」というが、この一揆で倒された守護は誰か。","o":["富樫泰高","富樫幸千代","六角高頼","富樫政親"],"a":4,"e":"","g":"歴史"},{"n":27,"q":"金沢市は、石川県のほぼ中央に位置しているが、その金沢市にある2つの台地の組み合わせとして正しいものは次のうちどれか。","o":["寺町・医王山","寺町・小立野","小立野・卯辰","小立野・医王山"],"a":2,"e":"","g":"自然・産業"},{"n":28,"q":"次の讃歌は、金沢ふるさと偉人館で、毎年11月3日に献花祭を行い、参加者全員で歌っているものである。この讃歌は、誰の業績を讃えたものか。","o":["高峰譲吉","八田與一","木村栄","津田米次郎"],"a":1,"e":"","g":"偉人・人物"},{"n":29,"q":"今年で明治維新から150年経つ。1869年（明治2）に加賀藩は版籍奉還によって金沢藩になった。その後、1871年（明治4）の廃藩置県で金沢県となり、何度か県境が変わる中で、美川に県庁が移された時から石川県となったが、なぜ石川県と呼ばれるようになったか。","o":["初代県知事の名前が石川氏だったから","県庁のある美川が石川郡に所在したから","有名な石の産地やきれいな川が豊富にあるから","金沢城前の石川門が有名だったから"],"a":2,"e":"","g":"歴史"},{"n":30,"q":"金沢の農業は米作りが中心であるが、市街地近郊では、野菜・花・果物などいろいろな種類が生産されている。そのうち、昔から金沢で生産され、金沢市が認定している「加賀野菜」は何品目あるか。","o":["11品目","13品目","15品目","17品目"],"a":3,"e":"","g":"自然・産業"},{"n":31,"q":"1979年（昭和54）6月13日に、市政90周年を記念し、「金沢市民憲章」が制定されたが、これが記された石碑があるのはどこか。","o":["金沢城五十間長屋","金沢21世紀美術館前","卯辰山望湖台","金沢駅鼓門"],"a":3,"e":"","g":"市政・最近の話題"},{"n":32,"q":"金沢には藩政時代の文化が多く残っているが、文化文政のころ「加賀万歳」を定着させた人物は誰か。","o":["森下八左衛門","大石藤五郎","津田吉之助","中橋徳五郎"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":33,"q":"平安時代の中頃、律令制度は崩れ始めた。このころ、拝師郷（野々市市上林・中林・下林一帯）を本拠地とし、加賀の地で勢力があった氏族は次のうちどれか。","o":["津幡氏","藤原氏","富樫氏","林氏"],"a":4,"e":"","g":"歴史"},{"n":34,"q":"金沢城跡は現在、金沢城公園としてイベントや観光客でにぎわっているが、以前は何の施設があったか。","o":["大学","県庁","駐車場","市役所"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":35,"q":"金沢港には、非常時でもエネルギーを安定して供給するために、多くの石油備蓄基地があるが、これは過去の何を教訓として造られたのか。","o":["能登半島地震","浅野川の氾濫","湾岸戦争","三八豪雪"],"a":4,"e":"","g":"自然・産業"},{"n":36,"q":"金沢市内には藩政時代に設けられた「広見」が今でもいくつか残っているが、どのような理由で設けられたのか。","o":["細い道では馬車同士がすれ違うことができないため","地域の寄合を開くため","盆踊りをするため","火災の時の火除けのため"],"a":4,"e":"","g":"寺社・建造物・まち"},{"n":37,"q":"1584年（天正12）に、織田信長の次男信雄を擁する徳川家康と結んだ佐々成政が、羽柴秀吉と結んだ前田利家の治める城（現在の宝達志水町）を攻めたことから始まった戦いを何というか。","o":["森下の戦い","倶利伽羅の戦い","末森城の戦い","賤ヶ岳の戦い"],"a":3,"e":"","g":"歴史"},{"n":38,"q":"1898年（明治31）に開業した金沢駅は今年で120周年を迎える。金沢駅兼六園口には、金沢を訪れた人たちを迎えるためにガラスで造られたもてなしドームがあるが、これは何の形をイメージして造られたものか。","o":["石川県","傘","新幹線","ことじ灯籠"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":39,"q":"金沢市の地形は、西から東へとだんだん標高が上がり、険しい地形となっている。犀川の水源にもなっている、金沢市で最も高い山は次のうちどれか。","o":["奈良岳","卯辰山","キゴ山","白山"],"a":1,"e":"","g":"自然・産業"},{"n":40,"q":"金沢市では、市民の気軽な移動手段として「ふらっとバス」を導入しているが、現在いくつのルートがあるか。","o":["2ルート","4ルート","6ルート","8ルート"],"a":2,"e":"","g":"市政・最近の話題"},{"n":41,"q":"お盆にお墓参りをする時、他ではあまり見られない風習が金沢にはあるが、それはどんな風習か。","o":["饅頭を食べる","願い事を書く","赤飯を炊く","切籠をつるす"],"a":4,"e":"","g":"食・行事"},{"n":42,"q":"金沢は「助け合いの心で、支え合い、お互いに善き隣人をつくっていく」という考え方が根付くまちで、金沢の地域福祉活動は、高齢者福祉を中心に地域と密着した活動をしており、全国から注目を集めている。安藤謙治や荒崎良道・浦上太吉郎といった熱意あふれる方面委員(今の民生委員)の活動の核として、1934年（昭和9）から1960年（昭和35）にかけて市内19か所に誕生したものは何か。","o":["善隣館","福祉館","公民館","教育館"],"a":1,"e":"","g":"歴史"},{"n":43,"q":"金沢は伝統工芸が盛んである。そのうち金箔は全国第1位の生産量を誇っている。金沢の金箔は日本の総生産量の約何％を占めているか。","o":["約66％","約77％","約88％","約99％"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":44,"q":"2015年（平成27）、北陸新幹線が金沢まで開業し、金沢−東京間が乗り換えなしで行き来できるようになった。この北陸新幹線の「かがやき」は金沢−東京間を約何時間何分で結んでいるか。","o":["約1時間30分","約2時間30分","約3時間30分","約4時間30分"],"a":2,"e":"","g":"市政・最近の話題"},{"n":45,"q":"大樋焼は、加賀藩5代藩主前田綱紀が、茶道普及のために裏千家の始祖と楽焼の陶工を京都から招いたことから始まった。次のうち大樋焼の工程の特徴は次のうちどれか。","o":["五彩の彩色をする。","金・銀をほどこし400度で焼いて完成する。","ろくろや型を使って整える。","一つ一つ手びねりでつくる。"],"a":4,"e":"","g":"美術・工芸・芸能"},{"n":46,"q":"旧町名に愛着をよせ、懐かしむ声も市民から多く出てきたため、平成11年から平成21年までの間に11もの旧町名が復活しており、その動きは北陸新幹線の開通によってさらに加速化している。2018年（平成30）内にもある地区で「（　　）通町」「（　　）下本町」「（　　）味噌屋町」の3つの町名が復活する予定だが、（　　）に共通する地名は次のうちどれか。","o":["石引","森本","金石","東山"],"a":3,"e":"","g":"寺社・建造物・まち"},{"n":47,"q":"明治時代、小学校に通う子供が増えてくると、さらに深く学ぶ学校をつくってほしいという声が市民からもおこってきた。現在「金沢くらしの博物館」として使用されている建物は2017年（平成29）11月に国重要文化財に指定されたが、当時何の建物だったか。","o":["金沢第二中学校","第一高等学校","女子師範学校","金沢市高等女学校"],"a":1,"e":"","g":"寺社・建造物・まち"},{"n":48,"q":"「第2の市民芸術村」として2018年（平成30）5月に金沢市俵町にオープンした創作活動の拠点「俵スタジオ」のロゴマークは「俵」の文字を7つのパーツに分け、「鳥」「山」「川」「葉」の自然環境を表すものの他に、2つのものをイメージして考案されている。その2つの組み合わせで正しいものは次のうちどれか。","o":["「笑顔」「音楽」","「創造」「笑顔」","「音楽」「創造」","「美術」「音楽」"],"a":1,"e":"","g":"市政・最近の話題"},{"n":49,"q":"2018年（平成30）、金沢市本町に、金沢城西外惣構の「升形」が復元された。加賀藩3代藩主前田利常がこの升形を造らせた目的は何か。","o":["火事が起きたときに、上に立って町民に知らせるため","外敵の侵入を防ぎ、城を守るため","他の大名に、前田家の力の強さを示すため","近くに前田家の城があることを知らせるため"],"a":2,"e":"","g":"寺社・建造物・まち"},{"n":50,"q":"Z項を発見し、地球上の緯度観測をより正確に行えるようにした木村栄は金沢出身である。2018年（平成30）の4月から「銀河の里キゴ山天文学習棟」のプラネタリウムが新しくなり、500万個もの星を楽しむことができるようになった。新しい投影機の愛称は、その形をイメージしているが、何という愛称か。","o":["ほしたまごん","ほしひかり","満天星","天歩"],"a":1,"e":"","g":"偉人・人物"}]},{"id":"j7c","label":"第7回ジュニア（中学生版）2012","q":[{"n":1,"q":"天文15年（1546年）、加賀の一向宗（浄土真宗）の中心となった「尾山御坊（金沢御堂）」は、現在のどの場所に建てられたか。","o":["金沢駅付近","久保市神社付近","卯辰山","金沢城公園付近"],"a":4,"e":"","g":"歴史"},{"n":2,"q":"金沢の伝統工芸の一つで、五代藩主前田綱紀が茶道を広めるために京都から職人を招いて作らせた焼き物があり、この焼き物を作っている人は昨年、文化勲章を受章した。飴色が特徴のこの金沢の焼き物は何か。","o":["九谷焼","大樋焼","信楽焼","珠洲焼"],"a":2,"e":"","g":"美術・工芸・芸能"},{"n":3,"q":"加賀藩主である前田家はある人物の子孫であると伝えられている。前田家の家紋「剣梅鉢」と関係している、ある人物とはだれか。","o":["菅原道真","高山右近","藤原道長","源義家"],"a":1,"e":"","g":"歴史"},{"n":4,"q":"平成23年（2011年）に金沢出身の哲学者の記念館が建てられた。この哲学者は、仏教の考え方を本や講演を通してアメリカをはじめ世界中の人たちに広めた。その哲学者はだれか。","o":["木村栄","西田幾多郎","鈴木大拙","藤岡作太郎"],"a":3,"e":"","g":"偉人・人物"},{"n":5,"q":"加賀藩の身分の低い武士のくらしについて正しく述べている文章はどれか。","o":["土地を俸禄（給料）として与えられる千石以上の知行取りであった","俸禄（給料）のみでは生活できず、家族とともに内職をして生計を立てた","俸禄（給料）のみで十分生活していくことができた","1万石以上の領地が与えられ、豊かなくらしをしていた"],"a":2,"e":"","g":"歴史"},{"n":6,"q":"宝永4年（1707年）に完成した「耕稼春秋」は、北陸地方における農業の書物として有名である。この書物を完成させた金沢出身の人物はだれか。","o":["土屋又三郎","新井白石","板屋兵四郎","寺島蔵人"],"a":1,"e":"","g":"偉人・人物"},{"n":7,"q":"下の選択肢は、泉鏡花、徳田秋声、室生犀星、夏目漱石の、いずれかの作者の作品を3つずつ挙げたものである。次のうち、室生犀星の作品はどれか。","o":["「三四郎」「虞美人草」「草枕」","「義血侠血」「滝の白糸」「高野聖」","「抒情小曲集」「性に眼覚める頃」「幼年時代」","「黴」「あらくれ」「縮図」"],"a":3,"e":"","g":"文学"},{"n":8,"q":"17世紀に起きた洪水により、加賀藩では多くの窮民（貧乏で生活に困っている人々）がでた。そこで、当時全国的に例のない「お救い小屋」を設置した加賀藩主はだれか。","o":["初代藩主前田利家","二代藩主前田利長","三代藩主前田利常","五代藩主前田綱紀"],"a":4,"e":"","g":"歴史"},{"n":9,"q":"五代藩主前田綱紀の時代を中心に、三代藩主利常の時代から集められた書物は、質・量ともにすぐれたものである。これらの書物を何というか。","o":["尊経閣文庫","呉竹文庫","金沢文庫","足利文庫"],"a":1,"e":"","g":"歴史"},{"n":10,"q":"金沢市では新しい文化をつくるまちづくりを進めている。5月に行われた「ラ・フォル・ジュルネ金沢（熱狂の日）」の今年のテーマは「サクル・リュス（　　）の祭典）」だった。（　　）に入る国の名前は何か。","o":["アメリカ","オーストリア","フランス","ロシア"],"a":4,"e":"","g":"市政・最近の話題"},{"n":11,"q":"十四代藩主前田慶寧が行ったこととして正しく述べている文章はどれか。","o":["卯辰山の開発に取り組み、病院である「養生所」、仕事場を提供する「撫育所」などを建てた","加賀藩の財政が苦しくなったため、新しい考え方で財政改革を行う大槻朝元を、足軽という低い身分から、高い身分の武士へと取り立て、重臣たちから反感をかった","明倫堂と経武館を現在の兼六園内に建てた","漢学で知られる木下順庵や本草学の第一人者である稲生若水を金沢に住まわせて学問を奨励した"],"a":1,"e":"","g":"歴史
