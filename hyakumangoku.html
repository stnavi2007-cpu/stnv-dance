に育まれたすべての生命が光かがやくまちをめざして「金沢版□戦略」を定めた。□に入る言葉はどれか。",["持続社会","環境基本","森の都建設","生物多様性"],3,"「金沢版生物多様性戦略」の基本目標として「自然や生きものを大切にした環境づくり」「生物多様性を未来に継承（けいしょう）していくためのひとづくり」をかかげている。","市政・最近の話題","S",11],["2020 年（令和 2）12 月、「伝統建築工匠（こうしょう）の技」が国連教育科学文化機関［UNESCO（ユネスコ）］の無形文化遺産に登録されることが決定した。そのなかには、金沢の伝統工芸もふくまれているがどれか。",["加賀友禅（かがゆうぜん）","金沢仏壇（かなざわぶつだん）","縁付金箔（えんつけきんぱく）","金沢和傘（かなざわわがさ）"],2,"縁付(えんつけ)は、柿渋(かきしぶ)などを染みこませた和紙とうすく延ばした金を交互（こうご）にはさみ、くり返し打ち延ばす製法で、完成した金箔(きんぱく)をうすい和紙にのせたとき、紙が箔（はく）を縁（ふち）取るように見えることから「縁付(えんつけ)」と呼ばれている。","美術・工芸・芸能","S",11],["金沢市では、「金沢市地域□計画」に基づき、近隣（きんりん）の人々と心を通わせ、助け合えるまちの実現のため、人々が集う地域サロンの開催（かいさい）や世代間交流などを行ってきた。□に入るものはどれか。",["健康","介護（かいご）","保護","福祉（ふくし）"],3,"近年では、各地域で高齢（こうれい）者の見守りや声かけ、除雪などのボランティアの協力が行われている。","市政・最近の話題","S",11],["江戸（えど）時代後半に、京都から金沢に移り住んで染め物の技法を伝え「加賀友禅（かがゆうぜん）」を作り出したのは誰（だれ）か。",["五十嵐道甫（いがらしどうほ）","清水九兵衛（しみずくへい）","宮崎友禅斎（みやざきゆうぜんさい）","後藤程乗（ごとうていじょう）"],2,"宮崎友禅斎は、34 歳（さい）頃（ごろ）から京都で新しい模様染めを発表し、友禅染で知られるようになった。","偉人・人物","X",11],["1974 年（昭和 49）、金沢市議会で「緑の都市宣言」が議決された。「･･･（略）人類の生存と繁栄（はんえい）のために、失われゆく緑を回復し、保全し、発展させ、かけがえのない自然を守り続けたいと願う。この願いをこめて私たちすべての市民は、うるわしい自然を今に伝えほこり高き\"□の都（みやこ）金沢\"を永遠の緑のまちにすることを宣言する。」という内容であったが、□に入るのは何か。",["水","草","森","花"],2,"緑化推進市民運動の母体として「緑を育て金沢を美しくする会」が中心となり、「緑あふれる金沢」写真コンテストや花いっぱい運動などが行われている。","市政・最近の話題","S",11],["金沢の町は能や狂言（きょうげん）などの芸能が盛んな町といわれている。「安宅（あたか）」という謡曲（ようきょく）の中で、弁慶（べんけい）が舞（まい）をまった時の歌の文句が付いた町名があるがどれか。",["鳴和（なるわ）","富樫（とがし）","卯辰（うたつ）","安江（やすえ）"],0,"弁慶が舞を舞ったとされる場所は、金沢北郊（ほっこう）の「鹿島（かしま）神社」といわれ、境内には「鳴和の滝（たき）」という小さな滝があり、弁慶の足跡（あしあと）といわれる大きな穴も残っている。","寺社・建造物・まち","S",11],["加賀藩（はん）14 代藩主前田慶寧（まえだよしやす）は、加賀藩の人々が豊かに生活できるように、「養生所（ようじょうしょ）」、「撫育所（ぶいくしょ）」、「神社」などを建てたが、どこの山を開発して建てたか。",["卯辰山（うたつやま）","医王山（いおうぜん）","戸室山（とむろやま）","キゴ山"],0,"加賀藩 14 代藩主前田慶寧は、福沢諭吉（ふくざわゆきち）の「西洋事情」を読み、ヨーロッパでは貧しい人々を救う制度や病院施設（しせつ）が整っていることを知り、加賀藩でも建設を進めた。","歴史","X",11],["1925 年（大正 14）、平沢嘉太郎（ひらさわかたろう）が浅野川電鉄と協力し、巨額（きょがく）の資本を投じて建設した一大レジャー施設（しせつ）を何というか。",["玉泉院丸庭園（ぎょくせんいんまるていえん）","宝塚遊園（たからづかゆうえん）","粟崎遊園（あわがさきゆうえん）","兼六園（けんろくえん）"],2,"粟崎遊園は劇場・料亭（りょうてい）・レストラン・動物園・大浴場・野球場などを備えた施設で、宝塚をまねた「粟崎少女歌劇（かげき）」も組織された。","寺社・建造物・まち","X",11],["金沢は古くから城下町として栄え、人々は伝統的な生活文化を営んできた。そのため、まちを歩いていると「歴史を感じさせるちょっとしたいいまちなみ」が見られる場所も多い。この「歴史を感じさせるちょっとしたいいまちなみ」守るために、金沢市では 1994 年（平成6）に条例を制定した。何という条例か。",["駐車（ちゅうしゃ）場条例","みちしるべ条例","金沢住宅地条例","こまちなみ保存条例"],3,"「こまちなみ保存条例」とは、歴史的な建物が残る小さなまちなみを「こまちなみ」と呼び、その景観や雰囲気（ふんいき）を大切にしていくための条例である。","市政・最近の話題","X",11],["加賀藩（はん）で貨幣（かへい）ができたのは加賀藩初代藩主前田利家（まえだとしいえ）の頃（ころ）で豊臣秀吉（とよとみひでよし）にならって多くの金・銀貨をつくらせたのがはじまりとされているが、貨幣に対して紙幣を発行した加賀藩 10 代藩主は誰（だれ）か。",["前田光高（まえだみつたか）","前田重教（まえだしげみち）","前田利次（まえだとしつぐ）","前田宗辰（まえだむねとき）"],1,"1755 年（宝暦（ほうれき）5）に加賀藩の中だけで通用する紙のお金「藩札（銀札）」を発行した。しかし、人々が紙のお金を信用しなかったために経済は混乱し、物価はどんどん値上がりした。","歴史","S",11],["今から 300 年前に、加賀藩（はん）は金沢の町中に分かれていた市場を1カ所に集め「金沢の台所」として近江町（おうみちょう）市場が開設された。その場所は次のどこか。",["片町（かたまち）","香林坊（こうりんぼう）","武蔵ヶ辻（むさしがつじ）","橋場町（はしばちょう）"],2,"近江町市場は 1721 年（享保 6）に市場の原型ができたと伝えられている。その後、2009 年（平成 21）再開発事業により生まれ変わり、「近江町いちば館」が開業し、2020 年（令和2）には「近江町ふれあい館」も新たに開業した。2021年（令和3）、近江町市場では 300 周年イベントが行われている。","寺社・建造物・まち","S",11],["2020 年（令和 2）10 月、日本海側初の国立美術館として、国立工芸館が開館した。この国立工芸館の名誉（めいよ）館長に就任したのは誰（だれ）か。",["三浦知良（みうらかずよし）","中田英寿（なかたひでとし）","本田圭佑（ほんだけいすけ）","中山雅史（なかやままさし）"],1,"元サッカー日本代表の中田英寿氏は、現役引退後、日本全国をめぐり、数多くの工芸作家や工房（こうぼう）などを訪問して交流を深めるなど、日本の伝統文化や工芸の発展に精力的に取り組んできた。","市政・最近の話題","S",11],["第二次世界大戦中、工場などに働きに出て、空襲（くうしゅう）で犠牲（ぎせい）になった少女たちをとむらうため、卯辰山（うたつやま）の山頂付近に建立されたのは何か。",["殉難（じゅんなん）おとめの像","天保義民（てんぽうぎみん）の碑（ひ）","七稲地蔵（なないねじぞう）","百工比照（ひゃくこうひしょう）"],0,"金沢から愛知県の豊川（とよかわ）にある海軍の工場に出向き、働いた少女の霊（れい）をとむらうために建てられた。この工場は空襲を受け、460 人にのぼる少女が犠牲となった。","歴史","S",11],["金沢市では、高齢（こうれい）者のために「長寿（ちょうじゅ）安心プラン」を定めているが、すべての人が平等に普通（ふつう）の生活がおくれるまちをめざし、1998 年（平成 10）に策定したプランを何というか。",["バリアフリープラン金沢","ユニバーサルデザインプラン金沢","ノーマライゼーションプラン金沢","ポジティブアクションプラン金沢"],2,"「ノーマライゼーション」とは、人権そのものであり、例えば、障がいのある人たちなど社会的支援（しえん）を必要としている人々をいわゆるノーマルな人にすることを目的としているのではなく、その障害を共に受容することであり、彼（かれ）らにノーマルな生活条件を提供することというものである。「ノーマライゼーションプラン金沢」は、社会環境（かんきょう）の変化に合わせて、改訂（かいてい）を重ね、2021 年（令和3）にも改訂された。","市政・最近の話題","S",11],["江戸（えど）時代、金沢城では水が行きわたらず、水不足になることがあった。そこで金沢城に水を引くため、加賀藩（はん）3代藩主の前田利常（まえだとしつね）が□に造らせた辰巳用水（たつみようすい）が現存している。□には誰が入るか。",["奥村永富（おくむらながとみ）","板屋兵四郎（いたやへいしろう）","大野弁吉（おおのべんきち）","稲生若水（いのうじゃくすい）"],1,"辰巳用水は、兼六園から金沢城内に水を引くため、逆サイフォンという原理を利用した。金沢の町には辰巳用水をはじめ鞍月（くらつき）用水、長坂用水などの55 本の用水が流れ、用水の長さを全部合わせると約 150 ㎞になるといわれている。用水は、農業灌漑（かんがい）、消火や融雪（ゆうせつ）のほかに城下町の景観を引き立てる働きをしており、金沢市民のくらしと深い関係がある。","偉人・人物","X",11],["1289 年（正応（しょうおう）2）、曹洞宗永平寺（そうとうしゅうえいへいじ）の名僧（めいそう）である徹通義介（てっつうぎかい）が、加賀国を治めていた富樫家尚（とがしいえなお）にたのまれて開いた寺はどれか。",["東大寺（とうだいじ）","総持寺（そうじじ）","薬師寺（やくしじ）","大乘寺（だいじょうじ）"],3,"大乘寺は、現在の野々市市に創建した。","寺社・建造物・まち","S",11],["平安時代の終わり頃（ごろ）から鎌倉時代の初めにかけて新しい仏教の流れが広まった。中でも阿弥陀如来（あみだにょらい）を信仰（しんこう）する宗派の勢いは北陸地方で強いものがあり、加賀地方では、時の守護職ともたたかい「一向一揆（いっこういっき）」ともいわれた。その主導的働きをしたのはどの宗派か。",["浄土宗（じょうどしゅう）","浄土真宗（じょうどしんしゅう）","曹洞宗（そうとうしゅう）","法華宗（ほっけしゅう）"],1,"「加賀一向一揆」は、1488 年（長享（ちょうきょう）2）、加賀国で勃発（ぼっぱつ）した一向一揆中最大のもの。20 万の一向宗（浄土真宗）徒が守護の富樫政親（とがしまさちか）をほろぼし、以後 100 年近く同国を統治した。","歴史","S",11],["交通網（もう）の整備を通して地域の発展と活性化が進められているが、金沢外環状（かんじょう）道路（山側環状）と接続し 2004 年（平成 16）につくられた北陸自動車道の IC（インターチェンジ）を何というか。",["金沢西 IC","金沢東 IC","金沢森本 IC","金沢港 IC"],2,"2012 年（平成 24）4月には白山 IC が新設され、外環状道路（海側環状）にも接続された。","市政・最近の話題","S",11],["1870 年（明治3）、金沢藩（はん）では6か所の小学所（しょうがくしょ）を開いて、7・8歳（さい）から 14・15 歳の子どもに漢字・習字・算術などを教えた。1871 年（明治4）にはさらに5か所の小学所を開いたが、その時の生徒数は何人をこえていたか。",["2000 人","3000 人","4000 人","5000 人"],0,"小学所は、1872 年（明治5）には「小学校」とされ、石川県内に 945 校をつくる計画であった。しかし、国民の多くが反対し、就学率（しゅうがくりつ）は高くなかった。","歴史","S",11],["金沢では、婚姻（こんいん）などのお祝いの時、蒸籠（せいろ）に入れた五色生菓子（ごしきなまがし）をふるまう。この五色とは何を表したものか。",["色の五彩（九谷（くたに）五彩）：赤・黄・緑・紺青・紫","自然の状況（じょうきょう）：日・月・山・海・里","味の五味：甘・酸・鹽（しお・塩の旧字）・苦・辛（しん）","陰陽（いんよう）五行：木・火・土・金・水"],1,"五色生菓子は、1601 年（慶長（けいちょう）6）、2代将軍徳川秀忠（とくがわひでただ）の娘（むすめ）である珠姫（たまひめ）（のちの天徳院（てんとくいん））が加賀藩（はん）3代藩主前田利常（まえだとしつね）に輿（こし）入れしたときに献上（けんじょう）したとされている。","食・行事","X",11],["江戸（えど）時代、金沢の町を治めるために、「町方二日読（まちかたふつかよみ）」と呼ばれる法令を出した。この法令のところどころに見られる言葉は次のどれか。",["泥棒の用心（どろぼうのようじん）","雷の用心（かみなりのようじん）","雪の用心（ゆきのようじん）","火の用心（ひのようじん）"],3,"加賀藩（はん）は「町方二日読」を出すことで、町人は町人らしく身分をわきまえて行動することを求めた。町人の日常生活において守らなくてはいけないことが書かれていた。","歴史","S",11],["金沢で SDGs（持続可能な開発目標）を効果的に進めるにあたり、「金沢の風土、歴史、文化をふまえること」、「経済、社会、環境（かんきょう）の3つの側面を包括的（ほうかつてき）にとらえること」という視点から5つの方向性を導きだした。この取り組みの目標とする年はどれか。",["2030 年","2040 年","2050 年","2060 年"],0,"SDGs とは、2015 年（平成 27）9 月、国連サミットで採択（さいたく）された 2030年までの国際目標で、持続可能な世界を実現するための 17 のゴール（目標）と169 のターゲット（具体目標）から構成されている。","市政・最近の話題","S",11],["金沢駅兼六園口（東口）は、雨や雪の多い金沢で「駅を降りた人に傘を差し出す、（　　）の心」を表現した（　　）ドームができたことで、雨や雪に左右されない明るい空間になった。（　　）に入る言葉はどれか。",["もてなし","金沢","思いやり","雪国"],0,"","寺社・建造物・まち","S",0],["かつて金沢では花嫁が嫁入りのときに（　　）を持参し、花嫁の家の仏間の入り口にかける風習があった。（　　）に入る言葉はどれか。",["花嫁掛け軸","花嫁のれん","花嫁しめ縄","花嫁すだれ"],1,"","食・行事","X",0],["1947年（昭和22）に、第2回国民体育大会が石川県で開催された。その大会歌として「参加者全員で歌える歌を」ということからできあがり、小学校連合体育大会で演じられている歌はどれか。",["ふるさと","若い力","うみ","ラジオ体操の歌"],1,"","食・行事","X",0],["金沢は、加賀藩のころから学問や芸術が盛んで、明治以降も文化面で優れた人物を輩出してきた。「金沢の三文豪」は近年再注目されているが、その3人とは誰か。",["室生犀星・西田幾多郎・鈴木大拙","室生犀星・泉鏡花・徳田秋聲","泉鏡花・徳田秋聲・西田幾多郎","泉鏡花・室生犀星・鈴木大拙"],1,"","文学","X",0],["金沢の気候は日本海側気候に属している。この気候の特徴として正しいものはどれか。",["年間を通じて天気が安定しており、雨がほとんど降らない","季節風の影響で夏は雨が多いが、冬は逆に晴れることが多い","季節風の影響で冬は特に雨や雪が多く降る","1年を通して気温が高く、雨は多いが雪は見られない"],2,"","自然・産業","S",0],["加賀藩の身分の低い武士のくらしについて正しく述べている文章はどれか。",["土地を俸禄(給料)として与えられる千石以上の知行取りであった","俸禄(給料)のみでは生活できず、家族とともに内職をして生計を立てた","俸禄(給料)のみで十分生活していくことができた","1万石以上の領地が与えられ、豊かなくらしをしていた"],1,"","歴史","S",0],["金沢には、金沢市無形民俗文化財に指定された伝統行事が今も数多く残っている。斧や刀、弓を持った山伏が各家をまわる金石町や大野町で行われている行事はどれか。",["加賀獅子","悪魔払い","加賀万歳","さかたおどり"],1,"","食・行事","X",0],["金沢市は石川県の加賀地方の北部に位置し、いくつかの市や町と接しているが、金沢市と接していないのはどれか。",["野々市市","白山市","能美市","津幡町"],2,"","自然・産業","S",0],["金沢の地域福祉活動の原点でもあり、生活相談や授産・託児の援助など地域の福祉・社会教育の拠点として1934年（昭和9）から建てられた施設はどれか。",["友好館","善隣館","交流館","福祉館"],1,"","歴史","X",0],["金沢の農業は米作りが中心であるが、市街地近郊では、野菜・花・果物などいろいろな種類が生産されている。そのうち、1945年（昭和20）以前から金沢で生産され、金沢市が認定している「加賀野菜」は何品目あるか。",["11品目","13品目","15品目","17品目"],2,"","自然・産業","S",0],["金沢市は、東経136度、北緯36度の位置にあるが、ほぼ同じ緯度にある世界の都市はどれか。",["シドニー（オーストラリア）","ミラノ（イタリア）","サンフランシスコ（アメリカ）","ロンドン（イギリス）"],2,"","自然・産業","S",0],["金沢の年中行事を説明した文章として、正しくないものはどれか。",["1月初旬に出初式が行われるが、これは江戸時代の「加賀鳶」の伝統を受け継いでいるものである","氷室の朔日（7月1日）に氷室饅頭や竹輪を食べると一年間病気にかからないといわれている","お盆にお墓参りをするときには、「切籠」をつるす","1月15日の左義長では、笹や竹に短冊をつるす"],3,"","食・行事","S",0],["金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともとは、防火の目的でつくられたといわれているこの空間を何というか。",["大通り","路地","公園","広見"],3,"","寺社・建造物・まち","X",0],["徳川家康は、加賀藩2代藩主前田利長が家康を討つ準備をしているという噂を聞き、加賀征伐の準備を始めた。その時、「母を思うがあまり、家をつぶすことがあってはならぬ。前田家のために母を捨てよ。」と利長に伝え、自ら人質として江戸へと旅立ったのは誰か。",["芳春院","濃姫","北政所","豪姫"],0,"","偉人・人物","X",0],["2014年（平成26）、金沢市は「めざすべき金沢の子ども像」を策定した。それを、市内の中学生が分かりやすく、覚えやすい言葉で表現した、子供たちの考え方や行動の基本的な約束事を何というか。",["男女共同参画都市宣言","金沢市民憲章","かなざわ子育て夢プラン","金沢子どもかがやき宣言"],3,"","市政・最近の話題","X",0],["加賀には、室町時代から加賀絹を梅の樹皮の煎汁に浸して染める無地染めがあり、「加賀染め」といわれていた。そこから発展し、「ぼかし」や「虫食い」などの技法を用いるようになった伝統工芸は何か。",["加賀友禅","加賀繍","二俣和紙","加賀蒔絵"],0,"","美術・工芸・芸能","S",0],["金沢市は、西から東へとだんだん標高が上がり、険しい地形となっている。犀川の水源にもなっている、金沢市で最も高い山はどれか。",["三子牛山","医王山","奈良岳","キゴ山"],2,"","自然・産業","X",0],["二俣地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作っており、それらは加賀藩主やその一族が公式儀礼や日常生活で利用していた。その伝統工芸品はどれか。",["ろうそく","和紙","友禅","漆器"],1,"","美術・工芸・芸能","S",0],["参勤交代は、大名が1年おきに領地と江戸に住み、その妻子を人質として江戸の屋敷におくことを命じたものである。江戸に向かう加賀藩の大名行列は諸大名の中でも最大の規模であった。そのコースは3つあったといわれているが、北国下街道を通る約480キロメートルのコースにはどれだけの期間を要したか。",["3日","13日","1ヶ月","1年"],1,"","歴史","S",0],["1858年（安政5）に、凶作による米の値上がりに苦しむ2,000人ほどの人々が卯辰山から金沢城にいる加賀藩13代藩主前田斉泰に向かって、「ひもじいわいやー」「米くれまいやー」と叫んで救済を訴えた一揆を何というか。",["加賀の一向一揆","徳政一揆","馬借一揆","泣き一揆"],3,"","歴史","S",0],["2008年（平成20）、観測史上例のない大雨によって川の水があふれ、道路や土地が水に浸かり、広い範囲で被害が発生した。このとき、55年ぶりに氾濫した川はどれか。",["伏見川","犀川","金腐川","浅野川"],3,"","自然・産業","X",0],["金沢の今町に生まれ、台湾に当時アジア最大といわれた烏山頭ダムや16,000キロメートルに及ぶ水路を完成させ、不毛の大地を豊かな平野に変えた金沢の偉人は誰か。",["三宅雪嶺","中西悟堂","八田與一","木村栄"],2,"","偉人・人物","X",0],["金沢の地形を眺めると、東部の山地から西部の海岸に向かって川が流れていることがわかる。金沢を流れる川で最も長い川はどれか。",["森下川","木曳川","犀川","高橋川"],2,"","自然・産業","X",0],["1631年（寛永8）の大火災の後、本丸に変わって政治の中心になった藩主の住まいで、内外装の材料や寸法、技法などを記した仕様書が2020年（令和2）に玉川図書館近世史料館で見つかり、復元が検討されている金沢城の建物はどれか。",["天守閣","一の丸御殿","二の丸御殿","大手門"],2,"","寺社・建造物・まち","S",0],["江戸時代、小立野台地の先端にある金沢城では水が行きわたらず、水不足になることがあった。そこで、金沢城に水を引くため、加賀藩3代藩主前田利常が板屋兵四郎に造らせた用水はどれか。",["大野庄用水","長坂用水","鞍月用水","辰巳用水"],3,"","歴史","X",0],["1669年（寛文9）、加賀に起きた暴風雨による洪水のために、多くの窮民（貧乏で生活に困っている人々）が出た。彼らを助けるために、当時では全国的にも例のない「お救い小屋」を建設した加賀藩5代藩主は誰か。",["前田綱紀","前田吉徳","前田利長","前田斉広"],0,"","歴史","X",0],["金沢市の市章は1891年（明治24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。",["桜","梅","松","桃"],1,"","市政・最近の話題","X",0],["1878年（明治11）、当時の藩閥政治（薩摩・長州・土佐・肥前の4藩が実権を握る政治）に不満を持った旧加賀藩士の島田一良らが、東京麹町区紀尾井町の路上で、馬車で皇居へ向かう途中の政府高官を暗殺する事件を起こした。この時、暗殺された政府高官は誰か。",["木戸孝允","西郷隆盛","大久保利通","板垣退助"],2,"","歴史","S",0],["春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子があり、生活の中に彩りと美を添えている。次のうち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。",["金花糖","五色生菓子","氷室まんじゅう","辻占"],3,"","食・行事","S",0],["2019年（平成31）3月に、金沢でＳＤＧs“Sustainable Development Goals(持続可能な開発目標)”を効果的に進めるにあたり、「金沢の風土、歴史、文化を踏まえること」、「経済、社会、環境の3つの側面を包括的に捉えること」という視点から5つの方向性を導きだした。このＳＤＧｓは持続可能な世界を実現するため、世界が抱える課題に対する（　　）のゴール（目標）とそれらを達成するための169のターゲット（具体目標）から構成されている。（　　）に入る数字はどれか。",["1","3","17","108"],2,"","市政・最近の話題","S",0],["金沢仏壇の製造には、御細工所（加賀藩の工芸製作工場）の木地師、塗師、蒔絵師、彫刻師、金具師が完全分業体制であたっていた。金沢仏壇の特色として正しいものはどれか。",["繊細で変色しやすい","組み立てに釘がたくさん使われている","加賀蒔絵や金箔が使われている","加賀友禅がふんだんに使われている"],2,"","美術・工芸・芸能","X",0],["1874年(明治7)、「金沢製糸場」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月用水から水を引き、大きな水車を使って機械を動かしていた。この「金沢製糸場」をつくった人物は誰か。",["稲垣義方","森下八左衛門","長谷川準也","津田米次郎"],2,"","偉人・人物","X",0],["鎌倉時代のはじめには、金沢の高尾町・泉野町付近から三馬・久安付近を支配し、のちに加賀国の守護となり、歌舞伎「勧進帳」では安宅の関で源義経と弁慶を通したと伝えられている一族はどれか。",["林氏","前田氏","久安氏","富樫氏"],3,"","歴史","X",0],["馬車鉄道しかなかった金沢にはじめて電車が走ったのは、1914年（大正3）である。今はもう走っていないが、その路線と営業していた鉄道会社はどれか。",["鶴来～野々市（石川電鉄）","武蔵ヶ辻～香林坊（香林坊電鉄）","金沢～内灘（浅野川電鉄）","金石～長田（金石電鉄）"],3,"","歴史","X",0],["加賀藩2代藩主前田利長や3代藩主前田利常は金沢城を守るために、二重に堀を造らせ、堀の内側には土を高く盛り上げた土居を築かせた。これらは何と呼ばれているか。",["腰曲輪","馬出","惣構","逆茂木"],2,"","歴史","X",0],["金沢市では、東部にある医王山や南部にある平栗などの森林で、ニホンカモシカやギフチョウのようなめずらしい動物を見ることができる。金沢市の面積のうち、森林が占める割合は約何割か。",["約1割","約3割","約6割","約9割"],2,"","自然・産業","S",0],["金沢市では、自動車による渋滞をなくすために、歩行者や自転車、バスなどの（　　）交通を優先するまちづくりを進めてきた。具体的には、バス停留所に屋根やベンチを設置することでバスを待ちやすい環境を整えたり、「ふらっとバス」や（　　）シェアサイクル「まちのり」を導入することで移動手段の利便性を向上させたりしている。（　　）に入る言葉はどれか。",["鉄道","公共","水上","特殊"],1,"","市政・最近の話題","S",0],["加賀藩2代藩主前田利長や3代藩主前田利常は金沢城を守るために、二重に堀を造らせ、堀の内側には土を高く盛り上げた土居を築かせた。これらは何と呼ばれているか。",["用水","土塀","惣構","堤防"],2,"","歴史","X",9],["二俣地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作っており、それらは加賀藩主やその一族が公式儀礼や日常生活で利用していた。その伝統工芸品はどれか。",["ろうそく","和紙","友禅","漆器"],1,"","美術・工芸・芸能","S",9],["室町時代、富樫政親と富樫幸千代の兄弟間で加賀国の守護職をめぐって権力争いが行われたが、その際に富樫政親が館の背後にそびえる山に築いた城はどれか。",["高尾城","七尾城","金沢城","小丸山城"],0,"","歴史","X",9],["金沢市では文化的景観を守るために、ひとつひとつの建物や用水を保全するだけでなく、条例で地区を決め、その地区全体のまちなみや風景を守ってきた。また、伝統芸能、工芸技術の保存や後継者を育てることにも力を入れており、これらの取り組みが発展して金沢市は国から2009年（平成21）に（　　）に認定された。（　　）に当てはまる言葉はどれか。",["文化都市","伝統都市","工芸都市","歴史都市"],3,"","市政・最近の話題","X",9],["近年の発掘調査の結果、縄文時代の人々は高度な技術をもち、おしゃれで感性豊かであったことが明らかになっている。日本ではじめての石の指輪が出土した金沢の遺跡はどこか。",["畝田遺跡","北塚遺跡","七ツ塚遺跡","チカモリ遺跡"],1,"","歴史","X",9],["金沢市の水道は水質が良いことで全国的に有名であり、「金沢の水」として販売されているが、その水源はどれか。",["金沢城の地下水","河北潟の水","伏見川上流の水","犀川上流の水"],3,"","市政・最近の話題","S",9],["2010年（平成22）に金沢の中心部に開館した「しいのき迎賓館」は、ギャラリー、セレクトショップ、レストランなどが設けられているが、以前はどのような建物であったか。",["美術館","県庁","金沢大学","市立図書館"],1,"","寺社・建造物・まち","X",9],["1587年（天正15）、バテレン追放令で大名の地位を失った（　　）は、加賀藩2代藩主前田利長の許しを得て、金沢で宣教活動を行っていた。その後、徳川家康のキリスト教禁止令により国外追放されても（　　）は決してキリスト教を捨てることはしなかった。そのことがフランシスコ・ローマ法王に認められ、2016年（平成28）にカトリックの「福者」に認定されたことを受け、2018年（平成30）には金沢市長がローマ法王に謁見している。（　　）に当てはまる武将は誰か。",["高山右近","浅井長政","直江兼続","明智光秀"],0,"","偉人・人物","X",9],["金沢には、今に伝わる年中行事が多く残っているが、6月にある無病息災を願う行事はどれか。",["人形供養","針供養","しょうぶ湯","地蔵盆"],2,"","食・行事","S",9],["尾山御坊のあった小立野台地は、金沢の名前の由来である芋掘藤五郎伝説からも分かるように昔は砂金がたくさんとれた。小立野台地で砂金を発見したのはどのような人々か。",["本願寺僧とともに近江から移ってきた商人たち","有松・泉で活躍した金物職人たち","金屋とよばれる鉄や金を求め歩く流浪の人々","当時最高の石垣造りの技術を持っていた近江国出身の穴太衆"],2,"","歴史","S",9],["金沢市は、社会教育の面で、年齢を問わずすべての市民が生涯にわたって学習できるような機会を設けているが、中でも高齢者のために様々な講座を実施しているものを何というか。",["忠信大学校","高砂大学校","社会大学校","長寿大学校"],1,"","市政・最近の話題","S",9],["1854年（安政元）、幕府が開国したことに影響を受け、加賀藩でも洋式兵学校が開校した。西洋砲術・洋楽・航海学・測量学・英仏の語学などの科目がおかれたこの教育機関を何というか。",["壮猶館","明倫堂","経武館","善隣館"],0,"","歴史","S",9],["金沢市には、歴史ある旧町名や昔の地名が多く残っているが、旧町名や昔の地名が忘れ去られることがないように、その由来を刻んだ標柱を何というか。",["金沢まちしるべ","旧町名しるべ","歴史由来しるべ","歴史のまちしるべ"],3,"","寺社・建造物・まち","S",9],["平安時代の初め823年（弘仁14）、加賀国が誕生した。それはどこの国から分かれて誕生したのか。",["越前国","能登国","越中国","越後国"],0,"","歴史","X",9],["金沢の市街地近郊では米や野菜、果物などいろいろな種類の作物が生産されている。金沢の風土を生かして生産された「金沢そだち」と呼ばれている作物の組み合わせとして正しいものはどれか。",["さつまいも・にんじん・しいたけ","だいこん・さつまいも・いちご","だいこん・すいか・なし","すいか・じゃがいも・かぶら"],2,"","自然・産業","S",9],["金沢では古くから、たくさんの絹織物を生産してきた。父の吉之助が考えた水車で動く機械に感動し、自分も絹動力織機の発明に取り組んで完成させたのは誰か。",["長谷川準也","津田米次郎","森下八左衛門","高多久兵衛"],1,"","偉人・人物","X",9],["金沢市は、石川県のほぼ中央に位置しており、いろいろな地形があるが、犀川の南側に広がっている台地を何というか。",["寺町台地","犀川台地","卯辰台地","浅野川台地"],0,"","自然・産業","X",9],["金沢には、明治時代にすぐれた文学作品を残した三文豪と呼ばれる人たちがいる。有名な尾崎紅葉の門下生となり、「義血侠血」「照葉狂言」「高野聖」などの名作を残したのは誰か。",["徳田秋声","室生犀星","泉鏡花","竹久夢二"],2,"","文学","X",9],["金沢には、古いまちなみが残っている地区があるが、これらの地区で美しいまちなみを守るため行っていることはどれか。",["道路上の電柱をなくす","木を植える","きれいな建物に建て替える","道路の幅を広くする"],0,"","寺社・建造物・まち","S",9],["金沢にはたくさんの方言がある。そのうち、「てきない」とはどのような意味か。",["敵がだれもいないこと","散らかった様子","苦しい","かわいらしい"],2,"","金沢ことば","S",9],["金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともと、防火のためにつくられたといわれているこの空間を何というか。",["防火地","広見","大路","大広場"],1,"","寺社・建造物・まち","X",9],["大正デモクラシーとは、大正期を中心に盛んになった民主主義をもとめた動きのことである。1917年（大正6）の衆議院議員総選挙における石川県選挙区に憲政会から立候補し、財産や税金の額によって政治に参加することを制限するのはいけないことだと熱心に訴え続けた人物は誰か。",["中橋徳五郎","平沢嘉太郎","永井柳太郎","山森隆"],2,"","偉人・人物","S",9],["加賀藩3代藩主前田利常は、城下のあちらこちらに散らばっていた一向宗以外の寺院を犀川口や浅野川口、小立野台に集めた。忍者寺として有名な妙立寺や国の天然記念物の大桜がある松月寺などがある寺院群はどれか。",["犀川寺院群","小立野寺院群","卯辰山山麓寺院群","寺町寺院群"],3,"","寺社・建造物・まち","S",9],["「氷室の朔日」は、加賀藩から江戸の将軍に氷を献上したことにちなんだ行事である。この7月1日に無病息災を祈って食べる饅頭を何というか。",["朔日饅頭","氷室饅頭","献上饅頭","加賀饅頭"],1,"","食・行事","X",9],["2019年（令和元）7月、金沢に建築博物館である「谷口吉郎・吉生記念金沢建築館」が誕生し、金沢にゆかりのある世界的な建築士の谷口吉郎・吉生親子に関する資料が展示されている。二人が設計した建物は数多く残されているが、唯一親子が共同で設計した建物が金沢にはあり、煉瓦造の棟とコルテン鋼の外壁の棟が融合した姿は人々を魅了している。その建物はどれか。",["鈴木大拙館","玉川図書館","伝統産業工芸館","金沢文芸館"],1,"","寺社・建造物・まち","S",9],["江戸時代の北陸地方における農業の書物「耕稼春秋」には農家の月ごとにする仕事や作るべき作物、肥料や農具のことなどが書かれているが、この書物を書いたのは誰か。",["高山右近","前田綱紀","土屋又三郎","板屋兵四郎"],2,"","偉人・人物","S",9],["加賀藩3代藩主前田利常は美術工芸に目を向け、全国の名工を金沢に招いた。金・銀・鉄などの地金に他の金属をはめ込み、刀や馬具、置物や髪飾りなどに施す細工を何というか。",["加賀友禅","加賀繍","加賀五彩","加賀象嵌"],3,"","美術・工芸・芸能","X",9],["金沢市では歴史のある旧町名を復活させる取り組みが各地で行われており、2019年（令和元）5月1日にも東山地区の（　　）が旧町名を復活させた。町名の由来は前田家が安産祈願のため参拝していた観音院が卯辰山から移されたとき、観音院から浅野川大橋までの道を広げたことによるものであるが、（　　）に入る町名はどれか。",["高道町","観音町","材木町","子来町"],1,"","寺社・建造物・まち","S",9],["金沢には藩政時代の文化が多く残っているが、文化文政（1804～1829年）のころ大石藤五郎が定着させた年の初めのお祝いに踊る踊りは何か。",["寺中神事能","加賀宝生","上野町餅つき踊","加賀万歳"],3,"","美術・工芸・芸能","X",9],["2019年（令和元）5月に、「荒波を越えた男たちの夢が紡いだ異空間～北前船寄港地・船主集落～」として北前船ゆかりの金沢市が「日本遺産」に追加登録された。北前船船主として一代で約300万両にのぼる富を築いた宮腰の豪商は誰か。",["木谷（木屋）藤右衛門","高多久兵衛","銭屋五兵衛","土屋九兵衛"],2,"","偉人・人物","X",9],["金沢市の姉妹都市は全部で7都市あるが、中国にある姉妹都市はどこか。",["蘇州市","上海市","北京市","大連市"],0,"","市政・最近の話題","S",9],["加賀藩5代藩主前田綱紀は有名な学者を日本中から金沢に招いたり、貴重な書物を国中から集めたりしていたため、江戸時代を代表する学者に「加賀は天下の書府」とほめたたえられた。この学者とは誰か。",["新井白石","木下順庵","稲生若水","室鳩巣"],0,"","歴史","X",9],["2012年（平成24）に金沢市でスタートした、人や環境にやさしい公共レンタサイクルシステム「まちのり」を説明したものはどれか。",["1度借りたら3日間返さなくてもよい。","支払いは現金のみであり、クレジットカードでの支払いはできない。","自転車は、借りた場所（ポート）と違うポートにも返却できる。","利用できるのは、観光客限定である。"],2,"","市政・最近の話題","S",9],["金沢市は昔から地下水にめぐまれ、井戸がたくさんつくられていたが、大正時代の大干ばつをきっかけに上水道の整備が進められた。金沢市につくられた最初の浄水場はどれか。",["内川浄水場","末浄水場","犀川浄水場","浅野川浄水場"],1,"","歴史","S",9],["金沢市は、森林が面積の約6割を占めているが、森林の整備を進めたり、森林と親しむ機会をつくったりすることを定めている条例を何というか。",["かなざわ森林条例","かなざわ遊林条例","金沢環境森林条例","金沢市森づくり条例"],3,"","市政・最近の話題","S",9],["金沢市は、「スポーツで人とまちを元気にする」ことに積極的に取り組むことで、さらなる活力と魅力のあるまちづくりを進めている。その一環として年齢・性別等にとらわれない「ｅスポーツ」の普及にも力を入れており、技術や創作力を持った人材の育成やｅスポーツを通した人々の交流の活性化等を目標としている。このｅスポーツとはどのような競技か。",["課題に対し、誰がよりよい解決策を提案できるか競い合う競技","日本伝統の昔遊びによる対戦競技","アクロバティックで危険な動きを競い合う競技","電子機器（コンピューター等）を使った対戦競技"],3,"","市政・最近の話題","S",9],["金沢は能楽がさかんな町であり、武家のみでなく、庶民にも広く親しまれたことから「金沢に行くと空から謡が降ってくる」と例えられる程であった。次のうち加賀藩5代藩主前田綱紀が取り入れたことにより、金沢で能楽が栄えるきっかけとなった流派はどれか。",["金春流","観世流","宝生流","金剛流"],2,"","美術・工芸・芸能","X",9],["1898年（明治31）、石川県で初めて営業を開始した「馬車鉄道」（線路の上の乗り物を馬が引っ張る鉄道）は、どことどこを結んでいたか。",["上金石～長田","鞍月～粟崎","三馬～松任","野町～額"],0,"","歴史","X",9],["17世紀に起きた洪水により、加賀藩では多くの窮民（貧乏で生活に困っている人々）がでた。そこで、当時全国的に例のない「お救い小屋」を設置した加賀藩主は誰か。",["初代藩主前田利家","2代藩主前田利長","3代藩主前田利常","5代藩主前田綱紀"],3,"","歴史","S",9],["金沢は雪国としても知られているが、雪の重みで木の枝が折れないように樹木に施されるものは何か。",["こもかけ","雪囲い","雪吊り","枝守り"],2,"","自然・産業","X",9],["加賀藩3代藩主前田利常は、1651年（慶安4）から1656年（明暦2）に、村々の田の良し悪しや広さを調べ、その村の米の取れ高から年貢の率を決め、藩へ納める年貢を決めた。この改革を何というか。",["太閤検地","版籍奉還","村御印","改作仕法（改作法）"],3,"","歴史","S",9],["金沢は水がきれいなまちとしても有名であるが、金沢の川が清流である証として多く捕れた魚はどれか。",["ごり","めだか","いわな","うぐい"],0,"","自然・産業","X",9],["江戸時代末期の天保時代に、上田作之丞は中級武士の出身ながら学問に優れ、私塾「拠遊館」を開いた。この拠遊館には藩のことを真剣に考えようとする優れた中級武士や下級武士が大勢集まり議論したが、彼らは会合の時にそろってある衣服を身に付けていたことから何と呼ばれるようになったか。",["長羽織党","黒羽織党","単衣羽織党","赤羽織党"],1,"","歴史","S",9],["江戸時代、参勤交代により大名は1年おきに領地と江戸を行き来しており、加賀藩の大名行列は、江戸まで徒歩での大移動であった。コースは3つあったが、主にどのコースが選ばれたか。",["越前福井道","北国上街道","北国下街道","東海道"],2,"","歴史","S",9],["近江町市場では2009年（平成21）の再開発事業により生まれ変わった。新たに観光のシンボルとなった建物を何というか。",["近江町いちば館","近江町青果館","近江町鮮魚館","近江町アーケード"],0,"","寺社・建造物・まち","X",9],["金沢は冬に雪が多く降る気候である。雪の重みで枝が折れないよう、冬の間、樹木に施されるものは何か。",["雪化粧","間垣","雪吊り","こも掛け"],2,"","自然・産業","X",3],["加賀藩初代藩主の前田利家は、15才の時に、小姓（殿様の身の回りの世話をする武士）として織田信長に仕えた。若い頃の利家は、喧嘩早く、「（　　）の又左」といわれ、人々におそれられた。（　　）には何が入るか。",["刀","斧","槍","弓"],2,"","偉人・人物","X",3],["大樋焼は、加賀藩5代藩主の前田綱紀が、茶道普及のために裏千家の始祖（最初に始めた人）と楽焼の陶工を京都から招いたことから始まった。次のうち、大樋焼の工程の特徴はどれか。",["ろくろや型を使って整える。","一つ一つ手びねりでつくる。","五彩の彩色をする。","金・銀をほどこし400度で焼いて完成する。"],1,"","美術・工芸・芸能","S",3],["金沢には多くの方言があるが、金沢の方言「たいそい」の意味はどれか。",["疲れた","ありがとう","おそろしい","ゆったりと"],0,"","金沢ことば","S",3],["加賀には、室町時代から加賀絹を梅の樹皮の煎汁（煮出した汁）に浸して染める無地染めがあり、「加賀染め」といわれていた。その後、「ぼかし」や「虫喰い」などの技法を用いて発展した、表現に味わいがある伝統工芸は何か。",["加賀象嵌","二俣和紙","加賀友禅","金沢仏壇"],2,"","美術・工芸・芸能","S",3],["百万石まつりは、金沢市のもとをつくった前田利家の功績をたたえて開かれている。百万石まつりが毎年6月に開かれるのは、利家が6月にあることを行ったといわれているからであるが、それは何か。",["加賀藩初代藩主になった","織田信長の家来になった","辰巳用水をつくらせた","金沢入城をはたした"],3,"","食・行事","S",3],["加賀藩5代藩主の前田綱紀の時代である1697年（元禄10）には、金沢の町は発展をとげ、江戸・大坂・京都に次ぐほどの大都市になった。当時の町の人口は約何人だったか。",["約6,900人","約69,000人","約690,000人","約6,900,000人"],1,"","歴史","S",3],["1838年（天保9）、凶作に苦しむ農民を救うため、村役人たちが年貢米をまけてほしいと藩に願い出る事件がおきたが、村役人たちはとらえられ、家族ともども越中五箇山へ流刑となった。そのおよそ60年後、事件の真相を知った（　　）はこれらの人を天保義民といってたたえた。（　　）には誰が入るか。",["寺島蔵人","銭屋五兵衛","土屋又三郎","勝海舟"],3,"","歴史","S",3],["明治時代、国は今の大学にあたる高等中学校を5校つくった。そのうちの1校が金沢につくられ、のちの金沢大学になった。この学校がつくられた当時の学校名は何か。",["第一高等中学校","第二高等中学校","第三高等中学校","第四高等中学校"],3,"","歴史","X",3],["金沢市では、すべての市民が生涯にわたって、いつでも学習ができるように、いろいろな機会を設けている。このような生涯学習情報に、市民がいつでも触れられるようにするため、金沢市が定期的に発行している、イベントや講座を紹介する冊子は何か。",["いいね金沢","Ｙｏｕｓ（ユース）","みまっ誌","かけはし"],2,"","市政・最近の話題","X",3],["第2次世界大戦中、工場などに働きに出て、空襲で犠牲になった少女たちをとむらうため、卯辰山の山頂付近に建立されたのは何か。",["笠舞の地蔵","非人清光の碑","天保義民の碑","殉難おとめの像"],3,"","歴史","S",3],["金沢市では、歴史ある旧町名や昔の地名が忘れ去られることのないように、旧町名や坂道、用水などの由来を刻んだ標柱「歴史のまちしるべ」を建てた。1999年（平成11）、最初に復活した、加賀藩士の屋敷があったという由来のある町名は何か。",["主計町","袋町","飛梅町","木倉町"],0,"","寺社・建造物・まち","X",3],["ある年、金沢のまちに連日20㎝を越える雪が降り続き、最大積雪181㎝の大雪となった。建物があいついで倒れ、車が動かなくなるなど、市民生活に大混乱を与えたこの大雪を何というか。",["20豪雪","38豪雪","55豪雪","81豪雪"],1,"","歴史","S",3],["金沢市には、石川ミリオンスターズ、ツエーゲン金沢、金沢武士団の3つのプロスポーツチームがあるが、この3つのプロスポーツチームにあてはまらないスポーツはどれか。",["バレーボール","野球","サッカー","バスケットボール"],0,"","市政・最近の話題","S",3],["金沢にはさまざまな伝統産業が息づいており、加賀友禅の友禅流しや、上質な和紙作りには清らかな水がどうしても必要である。金沢の川が清流である証拠として、昔から、ある小魚がたくさんとれ、金沢の特産品「○○の佃煮」としても有名である。○○にあてはまる2文字の小魚は何か。",["あゆ","ぼら","ごり","ふな"],2,"","自然・産業","X",3],["明治時代に入ると、江戸時代の武士たちは士族となったが、俸禄（武士の給与）がなくなるなど、生活が苦しくなった。そこで、士族救済のために移住がすすめられるようになったが、79家族がその地に渡り、前田村を作った都道府県はどれか。",["東京都","北海道","大阪府","沖縄県"],1,"","歴史","S",3],["加賀藩3代藩主の前田利常は、火事が広がらないように（　　）と呼ばれる火除地をつくった。（　　）には何が入るか。",["高台","広場","検地","広見"],3,"","寺社・建造物・まち","X",3],["1471年（文明3）、蓮如は親鸞の教えを伝えるために、北陸を旅することを決意した。金沢市内にある蓮如にゆかりのある寺はどれか。",["妙成寺","二俣本泉寺","傳燈寺","大乗寺"],1,"","寺社・建造物・まち","S",3],["金沢市では、東部にある医王山や南部にある平栗などの森林で、ニホンカモシカやギフチョウのようなめずらしい動物を見ることができる。金沢市の面積のうち、森林が占める割合は約何割か。",["約1割","約3割","約6割","約9割"],2,"","自然・産業","S",3],["金沢は、藩政時代から今日まで、さまざまな分野で活躍する多くの人々を育んできた。その中で、緯度の変化を計算するⅩＹの公式にＺ項を発見し、地球上の緯度観測をより正確に行えるようにした人物は誰か。",["高峰譲吉","鈴木大拙","木村栄","八田與一"],2,"","偉人・人物","X",3],["金沢には多くの川が流れている。これらの川では、舟によって各地の産物が金沢城下に運ばれ、人々の通行手段としても利用されたが、加賀藩の年貢米を運ぶのに利用された川はどれか。",["小矢部川","森下川","手取川","木曳川"],1,"","歴史","S",3],["「加賀の平賀源内」とも称された大野弁吉は、1801年（享和元）京都に生まれた。弁吉は幼少のころから非凡な才能をあらわし、長崎に出てオランダ人に西洋医学や理化学、天文学を学んだ。次のうち、弁吉に関係の深い事柄はどれか。",["天然痘","測量技術","新撰数学","からくり師"],3,"","偉人・人物","S",3],["金沢が生んだ三文豪として、泉鏡花、室生犀星、徳田秋声がいる。次のうち、泉鏡花の作品ではないものはどれか。",["あらくれ","高野聖","義血侠血","照葉狂言"],0,"","文学","S",3],["金沢市で1番高い山は標高1,644ｍで、犀川の水源にもなっている。この山の名前は何か。",["医王山","白山","キゴ山","奈良岳"],3,"","自然・産業","X",3],["江戸時代の金沢では、町の格づけがされていた。伝馬役(藩主の荷物や人を運ぶために運搬用の馬や費用を負担する)や町夫(道路・橋・堤防などの工事に人足を提供する)を負担する町で、比較的生活に余裕のある町人が住んでいた町を何というか。",["相対請地","七ヶ所","本町","地子町"],2,"","歴史","S",3],["金沢市内の南部に豊かな自然に恵まれた山がある。その山には加賀藩初代藩主の前田利家とその正室の芳春院など前田家一族の墓や、金沢を代表する多くの著名人の墓があるが、その山を何というか。",["卯辰山","野田山","戸室山","医王山"],1,"","寺社・建造物・まち","X",3],["2008年（平成20）、観測史上例のない大雨によって川の水があふれ、道路や土地が水に浸かり、広い範囲で被害が出た。このとき、55年ぶりに氾濫した川はどれか。",["浅野川","金腐川","犀川","内川"],0,"","自然・産業","X",3],["加賀藩で貨幣ができたのは加賀藩初代藩主の前田利家の頃である。豊臣秀吉にならって多くの金・銀貨をつくらせたのがはじまりだとされているが、次のうち、貨幣のもとになる金銀が産出した山はどれか。",["白山","大門山","キゴ山","宝達山"],3,"","歴史","S",3],["春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子があり、生活の中に彩りと美を添えている。次のうち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。",["金花糖","五色生菓子","氷室まんじゅう","辻占"],3,"","食・行事","S",3],["金沢には、金沢市無形民俗文化財に指定された藩政時代の文化が今もたくさん残っている。大野湊神社では毎年5月15日のお祭りに能楽が演じられているが、この行事は何と呼ばれているか。",["悪魔払い","ジョンカラ節","寺中神事能","加賀万歳"],2,"","美術・工芸・芸能","S",3],["金沢港は1954年（昭和29）に、金石港ともう一つの港が合併してできた。次のうち、もう一つの港はどれか。",["大野港","粟崎港","浅野川港","専光寺港"],0,"","歴史","S",3],["1599年(慶長4)、徳川2代将軍秀忠の2女として生まれた珠姫は、3歳で金沢に嫁入りし、8人の子を育てた。珠姫は亡くなった後「天徳院」と呼ばれたが、その名のお寺を小立野につくり、珠姫の霊を祀った加賀藩主は誰か。",["加賀藩初代藩主前田利家","加賀藩2代藩主前田利長","加賀藩3代藩主前田利常","加賀藩4代藩主前田光高"],2,"","寺社・建造物・まち","X",3],["2014年（平成26）、金沢市は「めざすべき金沢の子ども像」を策定した。それを、市内の中学生が分かりやすく、覚えやすい言葉で表現した、子どもたちの考え方や行動の基本的な約束事は何か。",["男女共同参画都市宣言","金沢市民憲章","金沢子どもかがやき宣言","かなざわ子育て夢プラン"],2,"","市政・最近の話題","X",3],["第1次世界大戦の後半（大正7年頃）、金沢市では財源を確保するため、新しい税を徴収することを考えた。全国にさきがけて導入された税で、当時のお金で2円以上飲食した場合にかかる、生活に余裕がある人のぜいたくに対してかけられた税は次のうちどれか。",["飲食税","贅沢税","消費税","遊興税"],3,"","歴史","S",3],["金沢には、名前の由来となっているように、沢や湧き水が多くあり、このような清らかな水からできた、上質な和紙を使ってつくられる金沢の特産品がある。全国の総生産量の99％を占める、この特産品は次のうちどれか。",["友禅","和紙","漆器","金箔"],3,"","美術・工芸・芸能","X",3],["1689年（元禄2）、松尾芭蕉は「奥の細道」の旅の途中、金沢に立ち寄った。その際、弟子の小杉一笑の死を悼んで詠んだ句はどれか。",["塚も動けわが泣く声は秋の風","むざんやな甲の下のきりぎりす","あかあかと日は難面も秋の風","山中や菊はたおらじ湯のにほひ"],0,"","文学","S",3],["水が豊富なまち・金沢には55もの用水が流れているが、この55の用水を合わせるとどのくらいの長さになるか。",["約15km","約50km","約150km","約500km"],2,"","寺社・建造物・まち","S",3],["加賀藩5代藩主の前田綱紀は、細工人の技術向上と工芸技術を保存し記録するために（　　）をつくった。（　　）には何が入るか。",["百工比照","尊経閣文庫","お救い小屋","加賀宝生"],0,"","美術・工芸・芸能","X",3],["平安時代の初め、越前国から分離されできた能登国や加賀国では、使節を受け入れるなど、ある国と積極的な交流を行ってきた。ある国とは次のうちどれか。",["唐","契丹","蝦夷","渤海"],3,"","歴史","S",3],["金沢市には「加賀野菜」のほかにも、優れた野菜が多くある。金沢市では、金沢の風土をいかして生産された野菜を「金沢（　　）」に認定して、多くの人に食べてもらえるように取り組んでいる。（　　）には何が入るか。",["うまれ","たべもの","じわもん","そだち"],3,"","自然・産業","S",3],["金沢には、クリの巨大木柱根が日本最多数の350本以上も見つかり、国指定史跡として整備されている縄文時代の遺跡がある。次のうち、その遺跡はどれか。",["チカモリ遺跡","塚崎遺跡","西念・南新保遺跡","北塚遺跡"],0,"","歴史","X",3],["1874年(明治7)、「金沢製糸場」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月用水から水を引き、大きな水車を使って機械を動かしていた。次のうち、「金沢製糸場」をつくった人物は誰か。",["稲垣義方","森下八左衛門","長谷川準也","津田米次郎"],2,"","偉人・人物","X",3],["金沢には四季それぞれの材料を使った加賀料理や、伝統的な技術をいかした和菓子など、豊かな食文化がある。下のシンボルマークが使われている、金沢の食文化がより豊かなものになることを願ってつくられたスローガンは次のうちどれか。",["五感にごちそうかなざわ","グッドマナーかなざわ","いしかわ百万石物語","新しい金沢、はじまる。"],0,"","食・行事","S",3],["歴史遺産や伝統文化が残る金沢は観光都市であり多くの観光客が訪れる。外国語による観光案内や、兼六園・金沢城などを専門に案内する観光ボランティアを何というか。",["まいどさん","もてなしさん","あんやとさん","いいね金沢さん"],0,"","市政・最近の話題","X",5],["鎌倉時代のはじめには、金沢の高尾町・泉野町付近から三馬・久安付近を支配し、のちに加賀国の守護となり、歌舞伎「勧進帳」では安宅の関で源義経と弁慶を通したと伝えられている一族はどれか。",["林氏","前田氏","久安氏","富樫氏"],3,"","歴史","X",5],["俵屋宗達や五十嵐道甫など有名な画家や職人を金沢に招き、江戸や京都と肩を並べるほど美術工芸を盛んにした加賀藩主は誰か。",["前田利家","前田利長","前田利常","前田慶寧"],2,"","偉人・人物","X",5],["兼六園は、加賀藩5代藩主前田綱紀の別荘の茶室や庭が始まりであるが、1度につくられたものではない。12代藩主斉広が兼六園内に曲水をつくったとき、水を引いた用水の名前は何か。",["長坂用水","大野庄用水","辰巳用水","金洗沢"],2,"","寺社・建造物・まち","X",5],["地域振興や観光振興の観点から地域名表示を弾力化した「ご当地ナンバー」として2006年（平成18）から「金沢」も表示できるようになった。この「ご当地ナンバー」をつけるものは何か。",["新幹線","自動車","ふるさと納税の商品","Wi-Fiスポット"],1,"","市政・最近の話題","X",5],["1656年（明暦2）と1670年（寛文10）の2度、加賀藩が領内の村々に出した書面で、村の収穫高とそれに見合う年貢の割当が書かれたものを何というか。",["村御印","二日読","夫銀","小物成"],0,"","歴史","S",5],["市民がいつでも生涯学習の情報に触れられるように、金沢市が定期的に発行しているイベントや講座を紹介する冊子を何というか。",["いいね金沢","みまっ誌","かけはし","たいあっぷ"],1,"","市政・最近の話題","X",5],["江戸時代の金沢では舟運がさかんで、川を利用して各地の産物が金沢城下や川沿いの村々へと運ばれた。それらのうち加賀藩の年貢米を金沢城下の御蔵に運ぶのに利用されていた川はどれか。",["森下川","犀川","浅野川","大野川"],0,"","歴史","S",5],["金沢が生んだ文豪で、「幼年時代」「性に眼覚める頃」などの小説や「犀川」という詩などを発表した人物は誰か。",["徳田秋声","泉鏡花","夏目漱石","室生犀星"],3,"","文学","X",5],["1858年（安政5）におこった「安政の泣き一揆」の首謀者として処刑された人たちの霊を慰めるために、東山の寿経寺につくられたのは何か。",["七泣き地蔵","卯辰地蔵","七稲地蔵","七米地蔵"],2,"","寺社・建造物・まち","X",5],["金沢市は、2009年（平成21）6月に、国連のユネスコから、独自の文化を産業と結びつけ、新しい価値を生み出している「創造都市」として認定された。このとき、金沢市が「創造都市」として認定されたのはどの分野か。",["ガーデン（庭園）","ピクチャー（絵画）","クラフト（工芸）","ミュージック（音楽）"],2,"","市政・最近の話題","X",5],["江戸時代、金沢町人の財産争いを防ぐために、町の人々が義務付けられていた相続の方法は次のうちのどれか。",["長子相続","遺言状による相続","十人組による相続","町年寄りによる相続"],1,"","歴史","S",5],["金沢仏壇の製造には、御細工所（加賀藩の工芸製作工場）の木地師、塗師、蒔絵師、彫刻師、金具師が完全分業体制であたっていた。金沢仏壇の特色として正しいものは、次のうちのどれか。",["繊細で変色しやすい。","組み立てに釘がたくさん使われている。","加賀蒔絵や金箔が使われている。","加賀友禅がふんだんに使われている。"],2,"","美術・工芸・芸能","X",5],["1915年（大正4）から1951年（昭和26）まで、金石の地で、くりひろげられた高校のスポーツ大会は、次のうちのどれか。",["野球","水泳","マラソン","角力"],3,"","歴史","S",5],["加賀藩では村々を数十か村集めた「組」が作られていた。この「組」を支配した、身分は百姓であるが、武士からの命令を村々に伝えたりするなどの仕事を行った役人を何というか。",["肝煎","百姓代","十村","組合頭"],2,"","歴史","S",5],["兼六園の中にあり、加賀藩13代藩主前田斉泰が母の住まいとして建てた建物は何か。",["竹沢御殿","蠑螺山","成巽閣","時雨亭"],2,"","寺社・建造物・まち","X",5],["明治時代はじめ、明治維新に取り残された士族たちによってつくられた政治結社で、金沢に初めてつくられた政治結社を何というか。",["立志社","愛国社","忠告社","自助社"],2,"","歴史","S",5],["金沢では1963年（昭和38）に三八豪雪と呼ばれる記録的な豪雪となった。連日20cmを超える雪が2週間以上降り続き、人々は2階の窓から家に出入りした。この豪雪時の、金沢の最大積雪量は約何cmか。",["80cm","180cm","280cm","380cm"],1,"","自然・産業","S",5],["馬車鉄道しかなかった金沢にはじめて電車が走ったのは、1914年（大正3）である。今はもう走っていないが、その路線と営業していた鉄道会社はどれか。",["鶴来～野々市（石川電鉄）","武蔵ヶ辻～香林坊（香林坊電鉄）","金沢～内灘（浅野川電鉄）","金石～長田（金石電鉄）"],3,"","歴史","X",5],["北塚遺跡は縄文時代中期の遺跡である。この遺跡から日本で初めて出土したものは何か。",["クリの木柱根","文様入り帯金具","和同開珎銀銭","石でつくられた指輪"],3,"","歴史","S",5],["1488年（長享2）、鳥越弘願寺・吉藤専光寺・木越光徳寺を指導者とした一向宗農民門徒の一揆軍が、高尾城を攻撃して守護の富樫政親を倒した。この一揆を何というか。",["嘉吉の乱","鳥越の一揆","長享の一揆","高尾の一揆"],2,"","歴史","S",5],["豊臣秀吉に追放されたキリシタン大名であり、加賀藩2代藩主前田利長によって金沢に迎えられ、城づくりにも優れていた人物は誰か。",["大槻朝元（伝蔵）","寺島蔵人","佐久間盛政","高山右近"],3,"","偉人・人物","X",5],["1872年（明治5）金沢県から石川県に名称が変わったとき、県庁が一時、金沢から移された場所はどこか。",["小松","美川","津幡","七尾"],1,"","歴史","S",5],["金沢は藩政時代から今日まで、様々な分野で活躍する多くの人々を育んできた。烏山頭ダムを完成させるなど、台湾で活躍し、不毛の大地を豊かな平野に変えたのは次のうち誰か。",["八田與一","木村栄","高峰譲吉","鈴木大拙"],0,"","偉人・人物","X",5],["加賀藩2代藩主前田利長、3代藩主利常が金沢城防備のためにつくらせた、東西に分かれ二重にめぐらされた堀を何というか。",["大手堀","惣構堀","百間堀","白鳥堀"],1,"","寺社・建造物・まち","X",5],[" ,"金沢子どもかがやき宣言","金沢子ども独立宣言"],2,"","市政・最近の話題","X",1],["金沢城を中心にして発展してきた金沢の町は、廃藩置県により一気にさびれてしまった。そこで、町の賑わいを取りもどし産業を盛んにするため、1874年（明治7）に行われたのはどれか。",["ガス灯の設置","自由民権運動","金沢馬車鉄道の営業","金沢博覧会"],3,"","歴史","S",1],["金沢市は石川県の加賀地方の北部に位置し、いくつかの市や町と接しているが、金沢市と接していないのはどれか。",["野々市市","白山市","川北町","津幡町"],2,"","自然・産業","S",1],["加賀藩の農村には、田畑を持っている高持百姓と、田畑を持たない小作や日雇いで生活する頭振がいた。こうした村々を数十か村ずつ集めた組の支配を任せられたのが（　　）と呼ばれる役人であった。（　　）には何が入るか。",["肝煎","十村","改作奉行","郡奉行"],1,"","歴史","S",1],["金沢駅兼六園口（東口）は、雨や雪の多い金沢で「駅を降りた人に傘を差し出す、（　　）の心」を表現した（　　）ドームができたことで、雨や雪に左右されない明るい空間になった。（　　）には何が入るか。",["もてなし","金沢","思いやり","雪国"],0,"","寺社・建造物・まち","S",1],["加賀藩3代藩主の前田利常は、1651年（慶安4）から1656年（明暦2）に、村々の田の良し悪しや広さを調べ、その村の米の取れ高から年貢の率を決め、藩へ納める年貢を決めた。この改革を何というか。",["倹約令","版籍奉還","村御印","改作仕法（改作法）"],3,"","歴史","S",1],["2015年（平成27）3月に北陸新幹線が金沢まで開業し、金沢−東京間が約2時間30分で行き来できるようになった。この北陸新幹線の名称を何というか。",["せせらぎ","かがやき","しらさぎ","ささやき"],1,"","市政・最近の話題","S",1],["室町時代には、戦や争いが絶え間なく起こった。このようなときに北陸に現れたのが本願寺（浄土真宗）の（　　）であった。（　　）には誰が入るか。",["蓮如","妙珍","運良","日乗"],0,"","偉人・人物","X",1],["江戸時代、小立野台地の先端にある金沢城では水が行きわたらず、水不足になることがあった。そこで、金沢城に水を引くため、加賀藩3代藩主の前田利常が板屋兵四郎に造らせた用水はどれか。",["大野庄用水","長坂用水","鞍月用水","辰巳用水"],3,"","寺社・建造物・まち","X",1],["1652年（慶安5）から1657年（明暦3）に、加賀藩では、町を治めるために17か条からなる法令を出した。金沢の町に住む人々が日常生活において守らなくてはならないことがらが細かく定められているこの法令を何というか。",["参勤交代","町方二日読","耕稼春秋","常々町中火之用心"],1,"","歴史","S",1],["金沢市では、土地の歴史や人々の営み、情景を反映した由緒ある旧町名を1999年（平成11）以降復活させている。その第1号となった町名はどれか。",["袋町","六枚町","南町","主計町"],3,"","寺社・建造物・まち","X",1],["江戸時代、金沢町人の財産争いを防ぐために、町の人々に義務づけられていた相続の方法は次のどれか。",["遺言状による相続","長子相続","十人組による相続","町年寄による相続"],0,"","歴史","S",1],["金沢には、公共交通の不便な地域を中心に、住宅地と商店街などを結んで循環するバスがある。此花・菊川・材木・長町の4ルートがあるこのバスの名称を何というか。",["金沢周遊バス","金沢まちバス","金沢ふらっとバス","兼六園シャトルバス"],2,"","市政・最近の話題","X",1],["明治政府は、廃藩置県後にも、県の範囲や、町や村をどのように治めるかなど、いろいろ試した。こうして、1889年（明治22）にできたのが金沢市である。その初代市長になったのは誰か。",["高峰譲吉","稲垣義方","津田吉之助","岡良一"],1,"","偉人・人物","S",1],["今日、日本中で遺跡の発掘調査が行われ、縄文人が高度な技術をもっていたことが明らかになっている。金沢市にある、日本で初めてクリの巨大木柱根が350本以上も発見された縄文時代晩期の遺跡を何というか。",["北塚遺跡","チカモリ遺跡","梅田Ｂ遺跡","畝田遺跡"],1,"","歴史","X",1],["河川の上流には、水道水を確保したり、洪水を 2）に、福岡藩士の和泉要助たちが荷車を改良して造った乗り物は何か。",["自動車","人力車","機関車","乳母車"],1,"","歴史","S",1],["市民がいつでも生涯学習の情報に触れられるように金沢市が定期的に発行している、イベントや講座を紹介する冊子を何というか。",["たいあっぷ","かけはし","いいね金沢","みまっ誌"],3,"","市政・最近の話題","X",1],["1878年（明治11）、旧加賀藩士の島田一良らが、当時の藩閥政治に対する不満から、東京麹町区紀尾井町の路上で、馬車で皇居へ向かう途中の政府高官を暗殺する事件を起こした。この時、暗殺された政府高官は誰か。",["木戸孝允","西郷隆盛","大久保利通","板垣退助"],2,"","歴史","S",1],["金沢には、その地名の由来ともいわれる「芋ほり藤五郎の地名伝説」と時期的にも共通する興味深い遺跡がいくつかある。そのうち、日本で最も多い580枚の和同開珎が出土した「さこ山遺跡」と関連がある山はどれか。",["戸室山","卯辰山","奈良岳","三小牛山"],3,"","歴史","S",1],["今から約40〜50年前、高度経済成長が起きる前の頃、金沢市内のいたるところで沢やわき水が見られた。このわき水のことを何というか。",["ごっくり","さらさら","ちょろちょろ","もっくり"],3,"","金沢ことば","S",1],["茶道普及のために京都から職人を招いて作らせた金沢の代表的な焼き物がある。ろくろを使わず手びねりによって作られた、独特の味わいのある飴色が特色の焼き物を何というか。",["九谷焼","大樋焼","有田焼","珠洲焼"],1,"","美術・工芸・芸能","X",1],["金沢市には、市民一人ひとりが地域の一員としての責任を自覚し、金沢の美しい自然と、かおり高い伝統文化を守り育てるために作られた「金沢市民憲章」という目標がある。その中に5つの条文があり「ひらこう」には「世界と未来に心の窓を」、「めざそう」には「いきいきと明るいくらしの創造を」という語が続く。では、「きずこう」にはどんな語が続くか。",["個性ゆたかなあすの金沢を","美しい心とふるさとの自然を","みんなの力でまちづくりの手を","地震に強い丈夫なまちを"],0,"","市政・最近の話題","S",1],["金沢市は、2009年（平成21）に、ユネスコ創造都市ネットワークのクラフト（工芸）の分野で認定を受けた。手仕事の「手」と、よいものを見極める「目」を表現した下のシンボルマークを何というか。",["テトメデス","テシゴトン","クラフトス","テメイイネ"],0,"","市政・最近の話題","X",29],["1584年（天正12）に起こった末森の戦いは、加賀藩初代藩主の前田利家と越中の（　　）との戦いである。（　　）には誰が入るか。",["織田信長","奥村永福","佐々成政","土井利勝"],2,"","歴史","S",29],["金沢市は、東経136度、北緯36度の位置にある。ほぼ同経度にある都市は次のどれか。",["ヘルシンキ（フィンランド）","ハバロフスク（ロシア）","サンパウロ（ブラジル）","ロサンゼルス（アメリカ）"],1,"","自然・産業","S",29],["1900年（明治33）に、日本初の羽二重（なめらかでつやのある薄い絹織物）を織る力織機を発明したのが（　　）である。1918年（大正7）には、その功績をたたえて（　　）の銅像が卯辰山に建てられた。（　　）には誰が入るか。",["中谷宇吉郎","高光一也","三浦彦太郎","津田米次郎"],3,"","偉人・人物","X",29],["金沢市の市章は1891年（明治24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。",["桜","梅","松","桃"],1,"","市政・最近の話題","X",29],["8〜10世紀頃、唐（中国）から独立した「渤海」という国があった。この国と日本との交流は盛んで、犀川河口が渤海の使者の受け入れ口だったといわれている。この交流があったことの証拠として畝田ナベタ遺跡から出土したものは何か。",["弥生土器","珠文鏡","文様入り帯金具","籃胎漆器"],2,"","歴史","S",29],["加賀藩最後の藩主である前田慶寧が、加賀藩の人々が豊かに生活できるようにと「養生所（病院）」や「撫育所（福祉施設）」の設置、織物・製紙などの工場の建設を行って開発を進めたのはどこか。",["卯辰山","白山","戸室山","野田山"],0,"","歴史","X 分"],1,"","市政・最近の話題","S",7],["大樋焼は、加賀藩5代藩主前田綱紀が、茶道普及のために裏千家の始祖と楽焼の陶工を京都から招いたことから始まった。次のうち大樋焼の工程の特徴は次のうちどれか。",["五彩の彩色をする。","金・銀をほどこし400度で焼いて完成する。","ろくろや型を使って整える。","一つ一つ手びねりでつくる。"],3,"","美術・工芸・芸能","S",7],["「第2の市民芸術村」として2018年（平成30）5月に金沢市俵町にオープンした創作活動の拠点「俵スタジオ」のロゴマークは「俵」の文字を7つのパーツに分け、「鳥」「山」「川」「葉」の自然環境を表すものの他に、2つのものをイメージして考案されている。その2つの組み合わせで正しいものは次のうちどれか。",["「笑顔」「音楽」","「創造」「笑顔」","「音楽」「創造」","「美術」「音楽」"],0,"","市政・最近の話題","S",7],["2018年（平成30）、金沢市本町に、金沢城西外惣構の「升形」が復元された。加賀藩3代藩主前田利常がこの升形を造らせた目的は何か。",["火事が起きたときに、上に立って町民に知らせるため","外敵の侵入を防ぎ、城を守るため","他の大名に、前田家の力の強さを示すため","近くに前田家の城があることを知らせるため"],1,"","寺社・建造物・まち","S",7],["Z項を発見し、地球上の緯度観測をより正確に行えるようにした木村栄は金沢出身である。2018年（平成30）の4月から「銀河の里キゴ山天文学習棟」のプラネタリウムが新しくなり、500万個もの星を楽しむことができるようになった。新しい投影機の愛称は、その形をイメージしているが、何という愛称か。",["ほしたまごん","ほしひかり","満天星","天歩"],0,"","偉人・人物","S",7],["加賀藩主である前田家はある人物の子孫であると伝えられている。前田家の家紋「剣梅鉢」と関係している、ある人物とはだれか。",["菅原道真","高山右近","藤原道長","源義家"],0,"","歴史","S",25],["平成23年（2011年）に金沢出身の哲学者の記念館が建てられた。この哲学者は、仏教の考え方を本や講演を通してアメリカをはじめ世界中の人たちに広めた。その哲学者はだれか。",["木村栄","西田幾多郎","鈴木大拙","藤岡作太郎"],2,"","偉人・人物","X",25],["加賀藩の身分の低い武士のくらしについて正しく述べている文章はどれか。",["土地を俸禄（給料）として与えられる千石以上の知行取りであった","俸禄（給料）のみでは生活できず、家族とともに内職をして生計を立てた","俸禄（給料）のみで十分生活していくことができた","1万石以上の領地が与えられ、豊かなくらしをしていた"],1,"","歴史","S",25],["宝永4年（1707年）に完成した「耕稼春秋」は、北陸地方における農業の書物として有名である。この書物を完成させた金沢出身の人物はだれか。",["土屋又三郎","新井白石","板屋兵四郎","寺島蔵人"],0,"","偉人・人物","S",25],["下の選択肢は、泉鏡花、徳田秋声、室生犀星、夏目漱石の、いずれかの作者の作品を3つずつ挙げたものである。次のうち、室生犀星の作品はどれか。",["「三四郎」「虞美人草」「草枕」","「義血侠血」「滝の白糸」「高野聖」","「抒情小曲集」「性に眼覚める頃」「幼年時代」","「黴」「あらくれ」「縮図」"],2,"","文学","S",25],["17世紀に起きた洪水により、加賀藩では多くの窮民（貧乏で生活に困っている人々）がでた。そこで、当時全国的に例のない「お救い小屋」を設置した加賀藩主はだれか。",["初代藩主前田利家","二代藩主前田利長","三代藩主前田利常","五代藩主前田綱紀"],3,"","歴史","X",25],["五代藩主前田綱紀の時代を中心に、三代藩主利常の時代から集められた書物は、質・量ともにすぐれたものである。これらの書物を何というか。",["尊経閣文庫","呉竹文庫","金沢文庫","足利文庫"],0,"","歴史","S",25],["金沢21世紀美術館は、主にどのような美術品を展示しているか。",["伝統工芸（陶芸、漆芸、友禅など）","西洋の伝統美術作品（印象派の油絵や彫刻など）","日本の伝統美術作品（日本画など）","現代美術の作品（前衛的な絵画や彫刻、ポップアートなど）"],3,"","美術・工芸・芸能","S",25],["金沢の旧町名の由来として正しくないものはどれか。",["小将町・・・藩主を護衛する小姓頭や小姓組の 、浅野川口、小立野台に集めました。また、各村にあった一向宗の有力な寺院は金沢城下に散在させました。宝円寺など、前田家ゆかりの寺院が多くある寺院群はどれでしょうか。",["小立野寺院群","卯辰山山麓寺院群","寺町寺院群","法華宗寺院群"],0,"","寺社・建造物・まち","X",6],["金沢には方言が今も数多く残っています。その中で、行儀がよい子を表す方言は、次のうちどれでしょうか。",["きかん子","じゃまない子","かたい子","むたむたな子"],2,"","金沢ことば","S",6],["特別な建物の跡と思われる巨大なクリの木柱根が350本以上も発見された遺跡はどこでしょうか。",["チカモリ遺跡","畝田遺跡","北塚遺跡","寺中遺跡"],0,"","歴史","X",6],["今から約40年～50年前には、金沢のいろいろなところで、水がわき出ていました。金沢ではこのような場所を水がわき出す様子から、何と呼ぶでしょうか。",["もっくり","とっくり","そっくり","ざっくり"],0,"","金沢ことば","S",6],["金沢の方言には「こんにちは・こんばんは」を表す「まいどさん」などのあいさつ言葉があります。親しい人への「ありがとう」を表す金沢の方言は、次のうちどれでしょうか。",["じゃまない","あんやと","いんぎらぁっと","りくつな"],1,"","金沢ことば","S",6],["江戸時代には街道が整えられ、物が運ばれたり、人が通ったりしました。金沢城下の上口と呼ばれる泉新町から、犀川大橋－片町－香林坊－南町－堤町－尾張町－橋場町－浅野川大橋、下口と呼ばれる大樋町を通るルートは何と呼ばれていたでしょうか。",["北陸自動車道","石川街道","北国街道","二俣街道"],2,"","歴史","S",6],["金沢には、昔から伝わる年中行事が今も数多く残っています。金沢市内の消防団員が新年に出揃い、裸放水とはしご登りをする行事の名前は何でしょうか。",["出初式","左義長","地蔵盆","歳の市"],0,"","食・行事","X",6],["加賀藩5代藩主前田綱紀は、学問好きで、多くの書物を集めたので、新井白石から「加賀は天下の（　　）」と言われ、うらやましがられました。（　　）には何が入るでしょうか。",["台所","政所","大学","書府"],3,"","歴史","X",6],["金沢には藩政時代の文化が今もたくさん残っています。金石町や大野町では（　　）と呼ばれる珍しい行事が行われています。山伏が正月と祭りの時期に行っていたのが起源といわれています。この（　　）は市無形民俗文化財に指定されています。（　　）には何が入るでしょうか。",["獅子舞","餅つき踊り","悪魔払い","さかたおどり"],2,"","食・行事","X",6],["室町時代は、戦いや争いが絶え間なく起こりました。人々は心の平安を求めて宗教にすがりました。このような時代に、北陸で浄土真宗を広めたのは誰でしょうか。",["蓮如","妙珍","運良","日乗"],0,"","歴史","X",6],["加賀藩によって、金沢に招かれた京都の名工青木木米が、卯辰山のふもとの春日山で窯を開き再興した金沢の代表的な焼き物は何でしょうか。",["珠洲焼","九谷焼","信楽焼","清水焼"],1,"","美術・工芸・芸能","X",6],["渤海は飛鳥時代末期に唐から独立した国です。渤海は唐に対抗するために、奈良時代から平安時代にかけて、日本との交流を進めたといわれています。遺跡から航海の無事を祈った鏡や、文様入り帯金具が発見された場所はどこでしょうか。",["犀川の河口","浅野川の河口","森下川の河口","伏見川の河口"],0,"","歴史","X",6],["機械動力式の織機のことを力織機といいます。1900年（明治33）に、日本初のうすい絹織物を織る力織機を発明したのは、次のうち誰でしょうか。",["森下八左衛門","三浦彦太郎","大野弁吉","津田米次郎"],3,"","偉人・人物","X",6],["珠姫は江戸幕府2代将軍徳川秀忠の次女で、徳川・前田両家を結ぶため、わずか3歳の時、加賀藩3代藩主前田利常の妻として金沢にやってきました。しかし、24歳という若さで亡くなりました。利常はその死を悲しみ、お寺をつくりました。このお寺には珠姫が作ったとされる紙ひな人形が置いてありますが、何というお寺でしょうか。",["伏見寺","宝円寺","松月寺","天徳院"],3,"","寺社・建造物・まち","X",6],["江戸時代のはじめ、後藤太兵衛が中心となり、寺町台地一帯をうるおす用水をつくりました。この用水によって泉野村や泉野出村、泉野新村の水田から、たくさんの米が取れるようになったといわれています。野田山の周辺をぐるっと回るようにつくられたこの用水を何というでしょうか。",["大野庄用水","鞍月用水","辰巳用水","長坂用水"],3,"","寺社・建造物・まち","X",6],["1592年（文禄元）、豊臣秀吉の命を受けて九州に出向いていた前田利家が、留守の利長に命じて、金沢城の本格的な城づくりが始まりました。その時に、金沢城の石垣にする石を切り出したことで有名な山はどれでしょうか。",["白山","卯辰山","戸室山","野田山"],2,"","歴史","X",6],["金沢には、昔から伝わる風習が今も数多く残っています。その中で、お盆のお墓参りをするときに、持っていくものは、次のうちどれでしょうか。",["提灯","ランプ","雪洞","切籠"],3,"","食・行事","S",6],["この大会は、国民に希望をあたえることと、体育を純粋なスポーツにすることを目標に計画され、第2回大会が「初の地方大会」として1947年（昭和22）に石川県で開催されました。この大会を何というでしょうか。",["金沢交歓球技大会","全国高等学校総合体育大会","全日本学生選手権大会","国民体育大会"],3,"","歴史","X",4],["1671年（寛文11）、後藤太兵衛が寺町台地に田んぼを作るための用水を完成させました。犀川の支流の内川から水を引き、野田山の周りをぐるっと回るようにつくられた、この用水を何というでしょうか。",["鞍月用水","長坂用水","旭用水","大野庄用水"],1,"","寺社・建造物・まち","X",4],["1925年(大正14)、平沢嘉太郎と浅野川電鉄が協力して、日本海を望む砂丘地に大きなレジャー施設をつくりました。劇場、料亭、レストラン、動物園、大浴場、野球場などをそなえた、この施設を何というでしょうか。",["卯辰山公園","日本海遊園","兼六園","粟崎遊園"],3,"","歴史","X",4],["明治時代になると、身分制がなくなり、自分の力で生活を切り開いていくことが大切であると考えられるようになりました。そこで金沢藩では、1870年（明治3）に（　　）を開き、漢字・習字・算術などを教えました。（　　）には何が入るでしょうか。",["小学所","善隣館","御細工所","金沢医学館"],0,"","歴史","S",4],["紀元前300年から紀元後300年までの約600年間は弥生時代と呼ばれ、大陸や朝鮮半島から新しい技術が伝わりました。金沢市で竪穴式住居跡や、弥生時代の土器・木製品が大量に出土したことで注目された遺跡はどこでしょうか。",["おまる塚古墳","西念・南新保遺跡","若松本泉寺跡","畝田ナベタ遺跡"],1,"","歴史","S",4],["加賀藩3代藩主の前田利常の妻は、徳川2代将軍秀忠の娘である珠姫です。珠姫がつくったとされる紙ひな人形がある、珠姫ゆかりのお寺はどれでしょうか。",["芳春院","伏見寺","大乗寺","天徳院"],3,"","寺社・建造物・まち","X",4],["金沢が生んだ三文豪として、室生犀星・徳田秋声・泉鏡花がいますが、「抒情小曲集」や「幼年時代」、「性に眼覚める頃」などの作品を発表した作家は誰でしょうか。",["徳田秋声","室生犀星","泉鏡花","尾崎紅葉"],1,"","文学","X",4],["江戸時代では、金沢城まで水が行きわたらず、水不足になることがありました。1632年（寛永9）、金沢城に水を引くために、町人の板屋兵四郎がつくりあげた用水は次のうちどれでしょうか。",["小橋用水","泉用水","辰巳用水","旭用水"],2,"","寺社・建造物・まち","X",4],["金沢市には、2004年（平成16）、市民が現代美術に触れるとともに、いろいろな芸術活動が行える場所として開館した美術館があります。小学4年生が作品を鑑賞する「ミュージアム・クルーズ」も行っている、この美術館を何というでしょうか。",["石川県立美術館","金沢21世紀美術館","金沢市立中村記念美術館","金沢能楽美術館"],1,"","寺社・建造物・まち","X",4],["1707年（宝永4）、土屋又三郎が、1年間の農家の仕事について、月ごとにやるべき農作業を示した本を完成させました。北陸地方の農業の書物として特に有名な、この本を何というでしょうか。",["寺嶋随筆","老の道種","耕稼春秋","庶物類纂"],2,"","歴史","S",4],["金沢にはさまざまなボランティア団体があります。そのうち、1994年（平成6）に設立され、金沢の方言で「こんにちは」を意味する名前の観光ボランティアガイドのことを何というでしょうか。",["おかげさん","ごきげんさん","まいどさん","ひゃくまんさん"],2,"","市政・最近の話題","S",8],["江戸時代の有名な学者新井白石は「加賀は天下の書府」とほめたたえました。理由は、加賀藩5代藩主前田綱紀が、貴重な書物を国中から集めたことによりますが、もう一つの理由は何でしょうか。",["日本で初めての公共図書館ができたから","日本一大きな書店があったから","本を大量生産していたから","有名な学者を日本中から金沢に招いたから"],3,"","歴史","S",8],["高尾城を築いた富樫政親は加賀一国の守護となりました。しかし、その政治に反対した農民や僧たちが中心となって政親を倒した後、加賀国は何と呼ばれたでしょうか。",["百姓の持ちたる国","武士の持ちたる国","地頭の持ちたる国","一向宗の持ちたる国"],0,"","歴史","X",8],["尾山御坊のまわりにつくられた町には、西町、堤町、後町、南町などがあります。これらの町は金沢の始まりとなりました。このような町を何というでしょうか。",["金沢城下町","金沢本町","金沢寺内町","金沢地子町"],2,"","歴史","S",8],["1874年（明治7）長町の川岸に、当時としては群馬県の富岡製糸場についで全国第2位の大きさの「金沢製糸場」がつくられました。この製糸場は金沢の近代工業が発展していくさきがけとなりましたが、「金沢製糸場」をつくり、金沢市の第2代市長にもなった人物は誰でしょうか。",["津田米次郎","長谷川準也","森下八左衛門","中橋徳五郎"],1,"","偉人・人物","X",8],["縄文人は、高度な技術をもち、おしゃれで感性豊かな自然人でした。金沢市にある縄文時代中期の遺跡で、日本で初めての石の指輪や、ヒスイのペンダントが出土したのはどこでしょうか。",["吉野ヶ里遺跡","北塚遺跡","御経塚遺跡","三内丸山遺跡"],1,"","歴史","X",8],["金沢市と富山県との境に位置し、スポーツセンター、自然公園、スキー場などがある山は次のうちどれでしょうか。",["奈良岳","大門山","国見山","医王山"],3,"","自然・産業","X",8],["金沢には様々な伝統産業がありますが、中でも「加賀友禅」は、宮崎友禅斎によって作られた日本を代表する友禅染めです。加賀友禅は草花模様を主体にした絵画的な図柄が多く、加賀友禅で用いられる特徴的な技法として「ぼかし」がありますが、病葉の美を表した技法を何というでしょうか。",["青花","地染め","虫食い","友禅流し"],2,"","美術・工芸・芸能","S",8],["加賀藩初代藩主前田利家の時代には、金沢城の中心は本丸にありましたが、1631年（寛永8）の大火災の後は再建されませんでした。その本丸に代わって政治の中心となった御殿はどこにあったでしょうか。",["玉泉院丸","二の丸","三の丸","新丸"],1,"","歴史","S",8],["室町時代には、争いが絶え間なく起こりました。この時代に北陸にやって来た蓮如によって、加賀の農民たちに広まった仏教の宗派は次のうちどれでしょうか。",["浄土真宗","日蓮宗","曹洞宗","臨済宗"],0,"","歴史","S",8],["加賀藩初代藩主前田利家が亡くなると、徳川家康は何かと無理を押しつけてきました。天下を取るために前田家の力をおそれていたからです。そこで、前田家には争いの意思がないことを信用してもらうために、富山城に隠居することで前田家を守った藩主は誰でしょうか。",["前田利長","前田利常","前田綱紀","前田斉広"],0,"","歴史","X",8],["大正時代の終わり頃、金沢の海岸近くに大きなレジャー施設がつくられました。当時の人々が娯楽の場として楽しんだこの施設は何でしょうか。",["金石公園","西部緑地公園","粟崎遊園","日本海遊園"],2,"","歴史","X",8],["武士が活躍した鎌倉時代には、「倶利伽羅の合戦」に代表されるように石川や富山でも源平の戦いがありました。このとき、加賀国の林・富樫・倉光・疋田という武士たちが味方について戦った人物は誰でしょうか。",["平維盛","源頼朝","源義経","源（木曽）義仲"],3,"","歴史","S",8],["金沢市の地形は、東部には医王の山々があり、西部の海岸に向かって丘陵地から平野へと変化し、次第になだらかになっています。市の中心部は、犀川と浅野川が南東方向から北西方向にほぼ並行して流れており、この2つの河川の間は細長く台地がのびています。この犀川と浅野川の間の台地を何というでしょうか。",["小立野台地","寺町台地","長坂台地","卯辰台地"],0,"","自然・産業","X",8],["加賀藩初代藩主前田利家の妻まつ（芳春院）は賢女と言われており、ある戦いの際には「城が落ちたら生きて帰るな」と利家たちを叱咤激励したとされていますが、この戦いを何というでしょうか。",["末森城の戦い","関ヶ原の戦い","豊臣秀吉との戦い","織田信長との戦い"],0,"","歴史","S",8],["金沢には、その名前の由来となっているように、「沢」や「わき水」が多くあり、豊かで清らかな水を生かした様々な伝統産業があります。金沢の伝統産業の中で全国の総生産量の99％を占めているものがありますが、それは何でしょうか。",["絹織物","象嵌","水引き","金箔"],3,"","美術・工芸・芸能","X",8],["江戸時代に北前船の立ち寄る港町として栄えた金石は、旧町名の復活を進めています。宮腰出身の豪商の生涯や北前船の歴史を知ることのできる金石地区にある資料館は次のうちどれでしょうか。",["木谷藤右衛門記念館","北前船の里資料館","老舗記念館","銭屋五兵衛記念館"],3,"","寺社・建造物・まち","X",8],["「第2の市民芸術村」として2018年（平成30）5月に金沢市俵町にオープンした創作活動の拠点「俵スタジオ」は、それまであった建物を改築してできた施設です。改築される前は何の建物だったでしょうか。",["工場","美術館","小学校","公民館"],2,"","市政・最近の話題","S",8],["金沢には加賀友禅や加賀蒔絵など、たくさんの伝統工芸があります。加賀藩初代藩主前田利家が金沢城入場後に、加賀藩御料紙（藩主や一族が使う紙）の指定産地になってから飛躍的に発展をとげた和紙を何というでしょうか。",["越前和紙","二俣和紙","能登和紙","金沢和紙"],1,"","美術・工芸・芸能","X",10],["加賀藩3代藩主前田利常の妻は、徳川2代将軍秀忠の娘である珠姫です。珠姫がつくったとされる「紙ひな人形」が所蔵されている、珠姫ゆかりのお寺はどこでしょうか。",["雨宝院","大乗寺","妙立寺","天徳院"],3,"","寺社・建造物・まち","X",10],["高尾城を築いた富樫政親は加賀一国の守護となりました。しかし、その政治に反対した農民や僧たちが中心となって守護富樫政親を倒したことにより、この後、加賀国は何と呼ばれたでしょうか。",["百姓の持ちたる国","僧侶の持ちたる国","町人の持ちたる国","一向宗の国"],0,"","歴史","X",10],["1963年（昭和38）、北陸地方を中心に全国規模で降った大雪は「昭和三八豪雪」と呼ばれ、金沢市民の生活にも大きな被害を与えました。豪雪に名称がつけられたのは気象庁が始まって以来初めてのことであり、金沢気象台では観測史上最大の積雪量を記録しました。この時の金沢での最大積雪は何㎝だったでしょうか。",["91㎝","121㎝","181㎝","251㎝"],2,"","自然・産業","S",10],["1858年（安政5）、凶作により米の値段が上がったことから、生活に苦しむ約2000人の人々が卯辰山から金沢城に向かって「ひもじいわいやー」「米くれまいやー」と叫び苦しさを訴えました。この訴えは何と呼ばれているでしょうか。",["土一揆","世直し一揆","泣き一揆","一向一揆"],2,"","歴史","S",10],["2019年（平成31）4月、雨や雪などの天候に左右されず、年間を通して様々な運動ができる「屋内交流広場」が「金沢プール」の横に建てられました。この施設の愛称はどれでしょうか。",["アンブレーラかなざわ","ウテンケッコー","かなざわっこ広場","あめるんパーク"],3,"","市政・最近の話題","S",10],["金沢市は、緑に恵まれた「森の都」と呼ぶにふさわしいまちですが、近年は人々と森や自然のふれあいが少なくなり、森林が荒れてきてます。そこで市民みんなで森を守り育てる活動をする目的で市が2003年(平成15)につくった条例は何でしょうか。",["金沢市伝統環境保存条例","金沢市自然環境保全条例","金沢市まちづくり条例","金沢市森づくり条例"],3,"","市政・最近の話題","S",10],["金沢市は本州のほぼ中央部にあって、日本海に面しています。金沢市からの直線距離は、大阪市まで約250㎞、札幌市まで約800㎞です。では、首都の東京までは約何㎞でしょうか。",["200㎞","300㎞","450㎞","600㎞"],1,"","自然・産業","S",10],["江戸時代、 function gain(n,why){const g=addKoku(n,why);return `+${f1(g)}石`}

function irrToday(){const r=dayRec();if(r.irr!==undefined)return r.irr;const R=rng(hash(S.name+S.kouka+today()+"irr"));

  let x=R()*W.reduce((a,b)=>a+b,0),pick=IRR[0];for(let i=0;i<IRR.length;i++){x-=W[i];if(x<=0){pick=IRR[i];break}}
  r.irr={id:pick.id,done:false,res:""};save();return r.irr}

function irrQuiz(){const pool=QB.filter(q=>q.lv==="S");const q=pool[Math.floor(rng(hash(today()+S.name+"iq"))()*pool.length)],ord=shuffle([0,1,2,3]);abar.className="abar";

/* ---------- 地図（3Dの斜め俯瞰） ---------- */
// 実際の位置（緯度経度）→ km → 中心部を広げる（密集した旧市街を見やすく）→ 斜め俯瞰
const MAPXY=(()=>{const la0=KDATA.reduce((a,x)=>a+x.lat,0)/KDATA.length,lo0=KDATA.reduce((a,x)=>a+x.lon,0)/KDATA.length,c=Math.cos(la0*Math.PI/180);
  const P=KDATA.map(x=>{const dx=(x.lon-lo0)*111.32*c,dy=(la0-x.lat)*110.57;return {n:x.n,dx,dy,r:Math.hypot(dx,dy)}});const rmax=Math.max(...P.map(p=>p.r));const o={};
  P.forEach(p=>{const k=p.r?Math.pow(p.r/rmax,.55)*5.4/p.r:0;o[p.n]=[5+p.dx*k,5+p.dy*k]});return o})();
const PJ=(x,y)=>[(x-y)*15.5+180,(x+y)*7.75+70];
const pts=a=>a.map(p=>PJ(...p).join(",")).join(" ");
function isoMap(sel){const rk=ranking(),mx=Math.max(1,...rk.map(x=>x.koku));
  let s=`<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4a6e"/><stop offset="1" stop-color="#173a58"/></linearGradient></defs>`;
  s+=`<polygon points="${pts([[-1,-1],[11,-1],[11,11],[-1,11]])}" fill="#2c3a22"/>`;
  // 日本海側（いちばん海側の校下より外を海に＝飾り。海岸線は正確ではありません）
  const W=Object.values(MAPXY);const coast=[];for(let y=-1;y<=11;y+=1){const near=W.filter(p=>Math.abs(p[1]-y)<1.6);coast.push([Math.min(...(near.length?near:W).map(p=>p[0]))-.7,y])}
  s+=`<polygon points="${pts([[-1,-1],...coast,[-1,11]])}" fill="url(#sea)"/>`;
  s+=`<text x="${PJ(-.6,1.5)[0]}" y="${PJ(-.6,1.5)[1]}" font-size="9" fill="#8fb9d8" font-family="sans-serif" transform="rotate(27 ${PJ(-.6,1.5).join(" ")})">日本海</text>`;
  [[10.4,2],[10.6,4.5],[10.2,7],[10.6,9.5],[9.2,10.6]].forEach(([x,y])=>{const[a,b]=PJ(x,y);s+=`<path d="M${a-9} ${b} L${a} ${b-14} L${a+9} ${b}Z" fill="#3a4a2e"/><path d="M${a-3} ${b-9} L${a} ${b-14} L${a+3} ${b-9}Z" fill="#e8ecef" opacity=".7"/>`});
  const L=KOUKA.map(k=>({k,p:MAPXY[k],r:rk.find(x=>x.k===k)})).sort((a,b)=>(a.p[0]+a.p[1])-(b.p[0]+b.p[1]));
  const tile=(x,y,h,c,k,me)=>{const d=.24,t=[[x-d,y-d],[x+d,y-d],[x+d,y+d],[x-d,y+d]].map(p=>PJ(...p));const up=t.map(([a,b])=>[a,b-h]);
    return `<g onclick="mapTap('${k}')" style="cursor:pointer"><polygon points="${[t[3],t[2],up[2],up[3]].map(p=>p.join(",")).join(" ")}" fill="${c}" style="filter:brightness(.7)"/><polygon points="${[t[1],t[2],up[2],up[1]].map(p=>p.join(",")).join(" ")}" fill="${c}" style="filter:brightness(.5)"/><polygon points="${up.map(p=>p.join(",")).join(" ")}" fill="${c}" stroke="${me?"#ffd76a":"#00000055"}" stroke-width="${me?2:.5}"/></g>`};
  let mine=null;
  L.forEach(o=>{const h=2+o.r.koku/mx*40,me=o.k===sel;s+=tile(o.p[0],o.p[1],h,o.r.m?color(o.k):"#5a5446",o.k,me);if(me)mine={...o,h}});
  if(mine){const[a,b]=PJ(...mine.p),top=b-mine.h;const lab=`${mine.k} ${fmt(mine.r.koku)}石`,w=lab.length*8.4+14;
    s+=`<line x1="${a}" y1="${top}" x2="${a}" y2="${Math.max(30,top-24)}" stroke="#ffd76a" stroke-width="1.5"/><g transform="translate(${Math.min(352-w,Math.max(8,a-w/2))} ${Math.max(8,top-44)})"><rect width="${w}" height="20" rx="10" fill="#1b1711" stroke="#ffd76a"/><text x="${w/2}" y="14" font-size="11.5" font-weight="900" text-anchor="middle" fill="#f3dc9a" font-family="sans-serif">${lab}</text></g><circle cx="${a}" cy="${top}" r="3.5" fill="#ffd76a"/>`}
  return s+`</svg>`}
function mapView(){abar.className="abar";hd();const k=S.mapSel||S.kouka;
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">🗾 金沢の陣地図</h2><button onclick="S.mapSel='';home()">もどる</button></div>
  <div class="mapw big">${isoMap(k)}</div><div id="mapInfo"></div>
  <div class="notice" style="margin-top:8px">柱の高さ＝校下の石高、色つき＝参加者がいる校下。柱をタップすると詳しく見られます。<br>※ 柱の位置は各校下の小学校（学校がない校下は公民館）の実際の位置です（国土地理院のデータ）。密集した中心部は見やすいよう少し広げて描いています。海岸線は飾りです。</div></div><button class="backb" onclick="S.mapSel='';home()">← ホームへもどる</button>`;mapInfo(k)}

let J;
function jibu(){abar.className="abar";app.innerHTML=`<div class="card"><div class="gimg">${ART.nabe}</div><h2>🍲 治部煮をつくれ</h2><div class="mute">12の具材から、治部煮に入れる<b>6つ</b>を選んで鍋へ。にせ具材は減点。制限時間60秒。</div><div class="notice" style="margin-top:8px">ヒント：鴨肉に粉をまぶして、だしで煮る。仕上げにわさび。</div><button class="pri" style="margin-top:12px" onclick="jibuStart()">スタート</button><button style="width:100%;margin-top:8px" onclick="home()">やめる</button></div>`}
function jibuStart(){J={t:60,sel:[],done:false,items:shuffle([...JIBU_OK.map(n=>({n,ok:true})),...JIBU_NG.map(n=>({n,ok:false}))])};
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">🍲 治部煮</h2><div class="timer" id="tm">60</div></div>
  <div class="potw">${ART.nabe}<div class="pot" id="pot"></div></div>
  <div class="grid">${J.items.map((it,k)=>`<button class="ing" id="ing${k}" onclick="jibuPick(${k})">${ART.ing[it.n]}<span>${it.n}</span></button>`).join("")}</div>
  <button class="pri" style="margin-top:12px" id="jibuGo" onclick="jibuFinish()" disabled>できあがり！（6つ選ぶと押せます）</button></div>`;
  J.timer=setInterval(()=>{J.t--;const tm=$("#tm");if(!tm)return clearInterval(J.timer);tm.textContent=J.t;if(J.t<=10)tm.classList.add("hot");if(J.t<=0)jibuFinish()},1000)}
function jibuPick(k){if(J.done)return;const el=$("#ing"+k),i=J.sel.indexOf(k);if(i>=0){J.sel.splice(i,1);el.classList.remove("sel")}else{if(J.sel.length>=6)return toast("鍋は6つまで");J.sel.push(k);el.classList.add("sel")}
  $("#pot").innerHTML=J.sel.map(k=>`<span>${ART.ing[J.items[k].n]}</span>`).join("");$("#jibuGo").disabled=J.sel.length!==6}
function jibuFinish(){if(J.done)return;J.done=true;clearInterval(J.timer);let good=0,bad=0;
  J.items.forEach((it,k)=>{const el=$("#ing"+k),p=J.sel.includes(k);if(p&&it.ok){good++;el.classList.add("good")}if(p&&!it.ok){bad++;el.classList.add("bad")}if(!p&&it.ok)el.classList.add("miss")});
  const perfect=good===6&&bad===0;const got=addKoku(Math.max(0,good-bad+(perfect?3+Math.floor(J.t/10):0)),"治部煮","game");dayRec().jibu=got;save();
  abar.className="abar on";abar.innerHTML=`<div class="res">${perfect?"🎉 完璧な治部煮！":`正しい具材 ${good}/6 ・ にせ具材 ${bad}`}</div><div class="mute" style="margin-bottom:8px">治部煮＝鴨肉（または鶏肉）に小麦粉をまぶし、だしで煮て、すだれ麩・しいたけ・せりを合わせ、わさびを添える。</div><button class="pri" onclick="home()">+${f1(got)}石 ・ ホームへ</button>`}

/* ---------- 加賀野菜 仕分け ---------- */
let K;
const deck=()=>shuffle([...KAGA.map(v=>({v,ok:true})),...NOTKAGA.map(v=>({v,ok:false}))]);
function kaga(){abar.className="abar";app.innerHTML=`<div class="card"><div class="gimg row" style="justify-content:center">${veg("thick","#f4f0e6")}${veg("kabocha","#d8582a")}${veg("nasu","#3a1f4a","#6a2a7a")}</div><h2>🥬 加賀野菜 仕分け</h2><div class="mute">出てきた野菜が<b>加賀野菜15品目</b>なら<b>右</b>へ、ちがえば<b>左</b>へスワイプ（ボタンでもOK）。45秒で何枚さばける？</div><button class="pri" style="margin-top:12px" onclick="kagaStart()">スタート</button><button style="width:100%;margin-top:8px" onclick="home()">やめる</button></div>`}
function kagaStart(){K={t:45,ok:0,ng:0,done:false,deck:deck()};
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">🥬 仕分け</h2><div class="timer" id="tm">45</div></div>
  <div class="stage" id="stage"><div class="lane l">← ちがう</div><div class="lane r">加賀野菜 →</div><div class="flash" id="flash"></div><div class="veg" id="veg"></div></div>
  <div class="row"><button style="flex:1" onclick="kagaJudge(false)">← ちがう</button><button class="gold" style="flex:1" onclick="kagaJudge(true)">加賀野菜 →</button></div>
  <div class="mute center" style="margin-top:6px">正解 <b id="kok">0</b> ・ ミス <b id="kng">0</b></div></div>`;
  kagaNext();swipe($("#veg"));
  K.timer=setInterval(()=>{K.t--;const tm=$("#tm");if(!tm)return clearInterval(K.timer);tm.textContent=K.t;if(K.t<=10)tm.classList.add("hot");if(K.t<=0)kagaFinish()},1000)}
function kagaNext(){if(K.done||!$("#veg"))return;if(!K.deck.length)K.deck=deck();K.cur=K.deck.pop();const v=$("#veg");const [n,ty,c1,c2]=K.cur.v;v.innerHTML=`<div class="vimg">${veg(ty,c1,c2)}</div>${n}`;v.style.transition="none";v.style.transform="translateX(-50%)"}
function kagaJudge(right){if(K.done)return;const ok=right===K.cur.ok,f=$("#flash");f.className="flash "+(ok?"ok":"ng");setTimeout(()=>f.className="flash",300);
  ok?K.ok++:K.ng++;$("#kok").textContent=K.ok;$("#kng").textContent=K.ng;if(!ok)toast(`${K.cur.v[0]} は ${K.cur.ok?"加賀野菜です":"加賀野菜ではありません"}`);
  const v=$("#veg");v.style.transition="transform .18s";v.style.transform=`translateX(${right?"120%":"-320%"})`;setTimeout(kagaNext,180)}
function swipe(el){let sx=0,dx=0;el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;dx=0},{passive:true});
  el.addEventListener("touchmove",e=>{dx=e.touches[0].clientX-sx;el.style.transition="none";el.style.transform=`translateX(calc(-50% + ${dx}px)) rotate(${dx/15}deg)`},{passive:true});
  el.addEventListener("touchend",()=>{if(Math.abs(dx)>70)kagaJudge(dx>0);else{el.style.transition="transform .15s";el.style.transform="translateX(-50%)"}})}
function kagaFinish(){if(K.done)return;K.done=true;clearInterval(K.timer);const got=addKoku(Math.min(PT.kagaMax,Math.max(0,Math.round(K.ok*.8-K.ng*.5))),"加賀野菜","game");dayRec().kaga=got;save();
  abar.className="abar on";abar.innerHTML=`<div class="res">正解 ${K.ok} ・ ミス ${K.ng}</div><div class="mute" style="margin-bottom:8px">加賀野菜15品目：${KAGA.map(v=>v[0]).join("・")}</div><button class="pri" onclick="home()">+${f1(got)}石 ・ ホームへ</button>`}

/* ---------- 共有画像（人物の絵入り） ---------- */
function svgImg(svg){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)})}
async function share(){const r=dayRec().quiz;if(!r)return;const c=$("#cv"),x=c.getContext("2d");
  x.fillStyle="#0f0d0a";x.fillRect(0,0,1080,1080);x.fillStyle=color(S.kouka);x.fillRect(0,0,1080,230);
  const av=await svgImg(avatar(S.g,S.a,rankLv(S.total||0),undefined,S.invites>=5));if(av)x.drawImage(av,60,270,300,350);
  x.fillStyle="#fff";x.font="900 110px sans-serif";x.textAlign="center";x.fillText(S.kouka+"校下",540,160);
  x.textAlign="left";x.fillStyle="#f3dc9a";x.font="900 60px sans-serif";x.fillText("今日の十問",400,340);
  x.fillStyle="#f3ede0";x.font="900 190px sans-serif";x.fillText(`${r.n}/10`,400,540);
  x.font="56px sans-serif";x.fillText(r.ox,400,630);
  x.textAlign="center";x.fillStyle="#d8b45a";x.font="700 54px sans-serif";x.fillText(`+${fmt(r.koku)}石　${S.name}（${title(S.total||0)}）`,540,790);
  x.fillStyle="#a79c86";x.font="38px sans-serif";x.fillText("みんなで百万石　#百万石バトル",540,900);x.fillText(today().replace(/-/g,"."),540,960);
  const url=c.toDataURL("image/png");$("#shareBox").innerHTML=`<img class="share" src="${url}"><div class="mute center">長押しで保存 → インスタのストーリーへ</div>`;
  c.toBlob(b=>{if(!b)return;const f=new File([b],"hyakumangoku.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text:"#百万石バトル"}).catch(()=>{})})}

/* ---------- 運営テスト用（?admin=1） ---------- */

 <button onclick="S.kura+=100000;S.koku+=100000;S.total=(S.total||0)+100000;save();home();toast('+10万石')">石高 +10万</button>
 <button onclick="S.dayShift=(S.dayShift||0)-1;save();home()">1日もどす</button>
 <button onclick="inviteArrived()">援軍が1人来た</button>
 <button onclick="S.dayShift=(S.dayShift||0)+1;save();home()">1日すすめる</button>
 <button onclick="if(confirm('全部消して最初から？'))localStorage.removeItem(KEY),location.reload()">リセット</button></div></div>`}

document.addEventListener("gesturestart",e=>e.preventDefault());
home();

</script>
