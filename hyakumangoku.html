function kzAdv(a,d){const m=kzMod(a.c.el,d.c.el);return m>1?`<span class="adv up">相性有利</span>`:m<1?`<span class="adv dn">相性不利</span>`:`<span class="adv">相性ふつう</span>`}
function kzPop(who,txt,cls){const el=$("#kb_"+who);if(!el)return;const p=document.createElement("div");p.className="kbPop "+(cls||"");p.textContent=txt;el.appendChild(p);el.classList.remove("shake");void el.offsetWidth;if(txt[0]==="-")el.classList.add("shake");setTimeout(()=>p.remove(),900)}
function kzCut(side,n){const box=document.querySelector(".kb");if(!box)return;const c=document.createElement("div");c.className="kzCut "+kzWho(side);c.style.setProperty("--sc",KZ_SK[n].c);c.innerHTML=`<b>${n}</b>`;box.appendChild(c);setTimeout(()=>c.remove(),700)}
function kzPlay(done){// たまった出来事を順に見せる
  const b=KB,ev=b.ev.splice(0);let t=0;const step=(fn,ms)=>{setTimeout(fn,t);t+=ms};
  ev.forEach(e=>{if(e.k==="sk")step(()=>{kzCut(e.side,e.n);kzLog(`${kzNm(e.side,KZM[e.id].n)}の必殺「${e.n}」！`)},650);
   else if(e.k==="dmg")step(()=>{kzBattle();if(KZM[e.id]===kzCur(b,e.side).c)kzPop(kzWho(e.side),`-${e.v}`,e.crit?"crit":e.mod>1?"up":e.mod<1?"dn":"");if(!e.back&&!e.fire)kzLog(`${kzNm(e.side,KZM[e.id].n)}に${e.v}${e.crit?"（会心）":""}${e.mod>1?" 相性有利！":e.mod<1?" いまひとつ…":""}`)},420);
   else if(e.k==="heal")step(()=>{kzBattle();kzPop(kzWho(e.side),`+${e.v}`,"heal")},300);
   else if(e.k==="log")step(()=>kzLog(e.t),300);
   else if(e.k==="ko")step(()=>{kzBattle();kzLog(`${kzNm(e.side,KZM[e.id].n)}は倒れた！`)},450);
   else if(e.k==="in")step(()=>{kzBattle();kzLog(`${kzNm(e.side,KZM[e.id].n)}が前に出た`)},350)});
  setTimeout(()=>{if(KB===b)done()},t+50)}
function kzDo(kind,arg){const b=KB;if(!b||b.busy||b.turn!==0||b.over||b.pick>=0)return;if(kind==="sk"&&!kzCanSk(kzCur(b,0)))return;b.busy=true;kzDoAct(b,kind,arg);kzPlay(kzAfter)}
function kzAfter(){const b=KB;if(!b)return;b.busy=false;kzBattle();if(b.over)return kzEnd(b.win===0);

function kzCpuGo(){const b=KB;b.busy=true;kzBattle();setTimeout(()=>{if(KB!==b||b.over)return;const[a,x]=kzAI(b,1);kzDoAct(b,a,x);kzPlay(kzAfter)},650)}

function kzSwitchAsk(i){const b=KB;if(!b||b.busy||b.turn!==0||b.over)return;if(i!=null&&b.s[0].f[i].hp>0)return kzDo("sw",i);
  const alive=b.s[0].f.map((f,k)=>({f,k})).filter(x=>x.k!==b.s[0].a&&x.f.hp>0);if(!alive.length)return;
  infoPop({title:"交代する札",body:`<div class="kzGrid">${alive.map(x=>`<div onclick="$('#ipop').remove();document.body.classList.remove('ipon');kzDo('sw',${x.k})">${kzCard(x.f.id,{size:"mid",star:x.f.star})}<div class="kbHp"><i style="width:${x.f.hp/x.f.max*100}%"></i></div><div class="mute center">${kzAdvTxt(x.f,kzCur(b,1))}・気${x.f.ki}</div></div>`).join("")}</div>`})}
function kzAdvTxt(a,d){const m=kzMod(a.c.el,d.c.el);return m>1?"相性有利":m<1?"相性不利":"ふつう"}
function kzEnd(win){const b=KB;const z=kzSt(),s=KZ_DOJO[b.stage],me=b.s[0];let rew=[];
  if(win){if(b.stage===z.clear){z.clear++;z.tix+=s.tix;rew.push(`初勝利！ 札券${s.tix}枚`)}
    const ids=[...me.f.map(f=>f.id),...(me.x?[me.x]:[])],ups=[];ids.forEach(id=>{const o=z.own[id];if(!o)return;const was=kzStarW(o.w||0);o.w=(o.w||0)+1;if(kzStarW(o.w)>was)ups.push(KZM[id].n)});

  const i=left[Math.floor(Math.random()*left.length)];seen.push(i);if(!MG_DRY)try{localStorage.setItem("hgHaya",JSON.stringify(seen))}catch(e){}return QB[i]}

  $("#mnW").innerHTML=`<div class="hyQ" id="hyQ" data-noruby></div><div class="hyBarO"><i id="hyBar"></i></div><button class="gold hyBuzz" id="hyBz" onclick="mnHayaBuzz()">わかった！</button><div id="hyO"></div>`;
  const mm=m;const iv=setInterval(()=>{if(MG!==mm||mm.ended||mm.buzz||mm.q!==q){clearInterval(iv);return}mm.k++;const e=$("#hyQ");if(!e){clearInterval(iv);return}e.textContent=txt.slice(0,mm.k);$("#hyBar").style.width=(100-mm.k/txt.length*100)+"%";
    if(mm.k>=txt.length){clearInterval(iv);setTimeout(()=>{if(MG===mm&&!mm.buzz&&mm.q===q)mnHayaBuzz()},1200)}},m.sp);m.timers.push(iv)}
function mnHayaBuzz(){const m=MG;if(!m||m.ended||m.buzz)return;m.buzz=1;const q=m.q;m.bonus=Math.round((1-Math.min(1,m.k/q.q.length))*10)/10;
  const bz=$("#hyBz");if(bz)bz.remove();const ord=shuffle(q.o.map((_,i)=>i));
  $("#hyO").innerHTML=`<div class="mute center" style="margin:4px 0">${m.bonus>0?`早押しボーナス +${f1(m.bonus)}（当たれば）`:"問題文は全部出たぞ"}</div><div class="mnGrid two">${ord.map(i=>`<button class="mnOpt" data-i="${i}" onclick="mnHayaAns(this,${i})">${q.o[i]}</button>`).join("")}</div>`}
function mnHayaAns(b,i){const m=MG;if(!m||m.ended||m.lock)return;m.lock=1;const q=m.q,ok=i===q.a,pt=ok?1+m.bonus:0;if(ok){m.ok++;m.sc+=pt}
  document.querySelectorAll("#hyO .mnOpt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add("ok")});if(!ok)b.classList.add("ng");
  $("#mnOk").textContent=m.ok;$("#hySc").textContent=f1(m.sc);const e=$("#hyQ");if(e)e.outerHTML=`<div class="hyQ">${q.q}</div>`;
  $("#hyO").insertAdjacentHTML("beforeend",`<div class="hyMemo"><div class="hyRes ${ok?"ok":"ng"}">${ok?`正解！ +${f1(pt)}点`:`ざんねん　正解は「${q.o[q.a]}」`}</div><b>${IC("makimono")} 覚えとかんなん</b><div>${q.e}</div></div><button class="pri" style="width:100%;margin-top:8px" onclick="mnHayaNext()">${m.n>=m.N?"結果を見る":"次の問題へ"}</button>`)}

/* --- 金沢ことばの配り方：前回の続きから順に配る（全部出るまで同じことばは出ない）・意味がかぶる組は同じ回に出さない --- */
function kzDeal5(){let d=[];try{d=JSON.parse(localStorage.getItem("hgKz")||"[]").filter(i=>i<KZ_KOTOBA.length)}catch(e){}
  const out=[],grp=new Set();let guard=0;
  while(out.length<5&&guard++<300){if(!d.length)d=shuffle(KZ_KOTOBA.map((_,i)=>i).filter(i=>!out.includes(i)));const i=d.shift();if(out.includes(i))continue;const g=KZ_KOTOBA[i][2];if(g&&grp.has(g)){d.push(i);continue}out.push(i);if(g)grp.add(g)}
  if(!MG_DRY)try{localStorage.setItem("hgKz",JSON.stringify(d))}catch(e){}return out.map(i=>KZ_KOTOBA[i])}

function mnFin(sc,goal){const m=MG;if(!m||m.ended)return;m.ended=1;mgEnd(Math.max(0,sc)/goal)}

/* 起動 */
home();
