先端にある金沢城では水が行きわたらず、水不足になることがあった。そこで、金沢城に水を引くため、加賀藩3代藩主前田利常が板屋兵四郎に造らせた用水はどれか。",["大野庄用水","長坂用水","鞍月用水","辰巳用水"],3,"","歴史","X",0],["1669年（寛文9）、加賀に起きた暴風雨による洪水のために、多くの窮民（貧乏で生活に困っている人々）が出た。彼らを助けるために、当時では全国的にも例のない「お救い小屋」を建設した加賀藩5代藩主は誰か。",["前田綱紀","前田吉徳","前田利長","前田斉広"],0,"","歴史","X",0],["金沢市の市章は1891年（明治24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。",["桜","梅","松","桃"],1,"","市政・最近の話題","X",0],["1878年（明治11）、当時の藩閥政治（薩摩・長州・土佐・肥前の4藩が実権を握る政治）に不満を持った旧加賀藩士の島田一良らが、東京麹町区紀尾井町の路上で、馬車で皇居へ向かう途中の政府高官を暗殺する事件を起こした。この時、暗殺された政府高官は誰か。",["木戸孝允","西郷隆盛","大久保利通","板垣退助"],2,"","歴史","S",0],["春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子があり、生活の中に彩りと美を添えている。次のうち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。",["金花糖","五色生菓子","氷室まんじゅう","辻占"],3,"","食・行事","S",0],["2019年（平成31）3月に、金沢でＳＤＧs“Sustainable Development Goals(持続可能な開発目標)”を効果的に進めるにあたり、「金沢の風土、歴史、文化を踏まえること」、「経済、社会、環境の3つの側面を包括的に捉えること」という視点から5つの方向性を導きだした。このＳＤＧｓは持続可能な世界を実現するため、世界が抱える課題に対する（　　）のゴール（目標）とそれらを達成するための169のターゲット（具体目標）から構成されている。（　　）に入る数字はどれか。",["1","3","17","108"],2,"","市政・最近の話題","S",0],["金沢仏壇の製造には、御細工所（加賀藩の工芸製作工場）の木地師、塗師、蒔絵師、彫刻師、金具師が完全分業体制であたっていた。金沢仏壇の特色として正しいものはどれか。",["繊細で変色しやすい","組み立てに釘がたくさん使われている","加賀蒔絵や金箔が使われている","加賀友禅がふんだんに使われている"],2,"","美術・工芸・芸能","X",0],["1874年(明治7)、「金沢製糸場」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月用水から水を引き、大きな水車を使って機械を動かしていた。この「金沢製糸場」をつくった人物は誰か。",["稲垣義方","森下八左衛門","長谷川準也","津田米次郎"],2,"","偉人・人物","X",0],["鎌倉時代のはじめには、金沢の高尾町・泉野町付近から三馬・久安付近を支配し、のちに加賀国の守護となり、歌舞伎「勧進帳」では安宅の関で源義経と弁慶を通したと伝えられている一族はどれか。",["林氏","前田氏","久安氏","富樫氏"],3,"","歴史","X",0],["馬車鉄道しかなかった金沢にはじめて電車が走ったのは、1914年（大正3）である。今はもう走っていないが、その路線と営業していた鉄道会社はどれか。",["鶴来～野々市（石川電鉄）","武蔵ヶ辻～香林坊（香林坊電鉄）","金沢～内灘（浅野川電鉄）","金石～長田（金石電鉄）"],3,"","歴史","X",0],["加賀藩2代藩主前田利長や3代藩主前田利常は金沢城を守るために、二重に堀を造らせ、堀の内側には土を高く盛り上げた土居を築かせた。これらは何と呼ばれているか。",["腰曲輪","馬出","惣構","逆茂木"],2,"","歴史","X",0],["金沢市では、東部にある医王山や南部にある平栗などの森林で、ニホンカモシカやギフチョウのようなめずらしい動物を見ることができる。金沢市の面積のうち、森林が占める割合は約何割か。",["約1割","約3割","約6割","約9割"],2,"","自然・産業","S",0],["金沢市では、自動車による渋滞をなくすために、歩行者や自転車、バスなどの（　　）交通を優先するまちづくりを進めてきた。具体的には、バス停留所に屋根やベンチを設置することでバスを待ちやすい環境を整えたり、「ふらっとバス」や（　　）シェアサイクル「まちのり」を導入することで移動手段の利便性を向上させたりしている。（　　）に入る言葉はどれか。",["鉄道","公共","水上","特殊"],1,"","市政・最近の話題","S",0],["加賀藩2代藩主前田利長や3代藩主前田利常は金沢城を守るために、二重に堀を造らせ、堀の内側には土を高く盛り上げた土居を築かせた。これらは何と呼ばれているか。",["用水","土塀","惣構","堤防"],2,"","歴史","X",9],["二俣地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作っており、それらは加賀藩主やその一族が公式儀礼や日常生活で利用していた。その伝統工芸品はどれか。",["ろうそく","和紙","友禅","漆器"],1,"","美術・工芸・芸能","S",9],["室町時代、富樫政親と富樫幸千代の兄弟間で加賀国の守護職をめぐって権力争いが行われたが、その際に富樫政親が館の背後にそびえる山に築いた城はどれか。",["高尾城","七尾城","金沢城","小丸山城"],0,"","歴史","X",9],["金沢市では文化的景観を守るために、ひとつひとつの建物や用水を保全するだけでなく、条例で地区を決め、その地区全体のまちなみや風景を守ってきた。また、伝統芸能、工芸技術の保存や後継者を育てることにも力を入れており、これらの取り組みが発展して金沢市は国から2009年（平成21）に（　　）に認定された。（　　）に当てはまる言葉はどれか。",["文化都市","伝統都市","工芸都市","歴史都市"],3,"","市政・最近の話題","X",9],["近年の発掘調査の結果、縄文時代の人々は高度な技術をもち、おしゃれで感性豊かであったことが明らかになっている。日本ではじめての<span class='fg fx'>石<span class='frt'>いし</span></span>の指輪が出土した金沢の遺跡はどこか。",["畝田遺跡","北塚遺跡","七ツ塚遺跡","チカモリ遺跡"],1,"","歴史","X",9],["金沢市の水道は水質が良いことで全国的に有名であり、「金沢の水」として販売されているが、その水源はどれか。",["金沢城の地下水","河北潟の水","伏見川上流の水","犀川上流の水"],3,"","市政・最近の話題","S",9],["2010年（平成22）に金沢の中心部に開館した「しいのき迎賓館」は、ギャラリー、セレクトショップ、レストランなどが設けられているが、以前はどのような建物であったか。",["美術館","県庁","金沢大学","市立図書館"],1,"","寺社・建造物・まち","X",9],["1587年（天正15）、バテレン追放令で大名の地位を失った（　　）は、加賀藩2代藩主前田利長の許しを得て、金沢で宣教活動を行っていた。その後、徳川家康のキリスト教禁止令により国外追放されても（　　）は決してキリスト教を捨てることはしなかった。そのことがフランシスコ・ローマ法王に認められ、2016年（平成28）にカトリックの「福者」に認定されたことを受け、2018年（平成30）には金沢市長がローマ法王に謁見している。（　　）に当てはまる武将は誰か。",["高山右近","浅井長政","直江兼続","明智光秀"],0,"","偉人・人物","X",9],["金沢には、今に伝わる年中行事が多く残っているが、6月にある無病息災を願う行事はどれか。",["人形供養","針供養","しょうぶ湯","地蔵盆"],2,"","食・行事","S",9],["尾山御坊のあった小立野台地は、金沢の名前の由来である芋掘藤五郎伝説からも分かるように昔は砂金がたくさんとれた。小立野台地で砂金を発見したのはどのような人々か。",["本願寺僧とともに近江から移ってきた商人たち","有松・泉で活躍した金物職人たち","金屋とよばれる鉄や金を求め歩く流浪の人々","当時最高の石垣造りの技術を持っていた近江国出身の穴太衆"],2,"","歴史","S",9],["金沢市は、社会教育の面で、年齢を問わずすべての市民が生涯にわたって学習できるような機会を設けているが、中でも高齢者のために様々な講座を実施しているものを何というか。",["忠信大学校","高砂大学校","社会大学校","長寿大学校"],1,"","市政・最近の話題","S",9],["1854年（安政元）、幕府が開国したことに影響を受け、加賀藩でも洋式兵学校が開校した。西洋砲術・洋楽・航海学・測量学・英仏の語学などの科目がおかれたこの教育機関を何というか。",["壮猶館","明倫堂","経武館","善隣館"],0,"","歴史","S",9],["金沢市には、歴史ある旧町名や昔の地名が多く残っているが、旧町名や昔の地名が忘れ去られることがないように、その由来を刻んだ標柱を何というか。",["金沢まちしるべ","旧町名しるべ","歴史由来しるべ","歴史のまちしるべ"],3,"","寺社・建造物・まち","S",9],["平安時代の初め823年（弘仁14）、加賀国が誕生した。それはどこの国から分かれて誕生したのか。",["越前国","能登国","越中国","越後国"],0,"","歴史","X",9],["金沢の市街地近郊では米や野菜、果物などいろいろな種類の作物が生産されている。金沢の風土を生かして生産された「金沢そだち」と呼ばれている作物の組み合わせとして正しいものはどれか。",["さつまいも・にんじん・しいたけ","だいこん・さつまいも・いちご","だいこん・すいか・なし","すいか・じゃがいも・かぶら"],2,"","自然・産業","S",9],["金沢では古くから、たくさんの絹織物を生産してきた。父の吉之助が考えた水車で動く機械に感動し、自分も絹動力織機の発明に取り組んで完成させたのは誰か。",["長谷川準也","津田米次郎","森下八左衛門","高多久兵衛"],1,"","偉人・人物","X",9],["金沢市は、石川県のほぼ中央に位置しており、いろいろな地形があるが、犀川の南側に広がっている台地を何というか。",["寺町台地","犀川台地","卯辰台地","浅野川台地"],0,"","自然・産業","X",9],["金沢には、明治時代にすぐれた文学作品を残した三文豪と呼ばれる人たちがいる。有名な尾崎紅葉の門下生となり、「義血侠血」「照葉狂言」「高野聖」などの名作を残したのは誰か。",["徳田秋声","室生犀星","泉鏡花","竹久夢二"],2,"","文学","X",9],["金沢には、古いまちなみが残っている地区があるが、これらの地区で美しいまちなみを守るため行っていることはどれか。",["道路上の電柱をなくす","木を植える","きれいな建物に建て替える","道路の幅を広くする"],0,"","寺社・建造物・まち","S",9],["金沢にはたくさんの方言がある。そのうち、「てきない」とはどのような意味か。",["敵がだれもいないこと","散らかった様子","苦しい","かわいらしい"],2,"","金沢ことば","S",9],["金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともと、防火のためにつくられたといわれているこの空間を何というか。",["防火地","広見","大路","大広場"],1,"","寺社・建造物・まち","X",9],["大正デモクラシーとは、大正期を中心に盛んになった民主主義をもとめた動きのことである。1917年（大正6）の衆議院議員総選挙における石川県選挙区に憲政会から立候補し、財産や税金の額によって政治に参加することを制限するのはいけないことだと熱心に訴え続けた人物は誰か。",["中橋徳五郎","平沢嘉太郎","永井柳太郎","山森隆"],2,"","偉人・人物","S",9],["加賀藩3代藩主前田利常は、城下のあちらこちらに散らばっていた一向宗以外の寺院を犀川口や浅野川口、小立野台に集めた。忍者寺として有名な妙立寺や国の天然記念物の大桜がある松月寺などがある寺院群はどれか。",["犀川寺院群","小立野寺院群","卯辰山山麓寺院群","寺町寺院群"],3,"","寺社・建造物・まち","S",9],["「氷室の朔日」は、加賀藩から江戸の将軍に氷を献上したことにちなんだ行事である。この7月1日に無病息災を祈って食べる饅頭を何というか。",["朔日饅頭","氷室饅頭","献上饅頭","加賀饅頭"],1,"","食・行事","X",9],["2019年（令和元）7月、金沢に建築博物館である「谷口吉郎・吉生記念金沢建築館」が誕生し、金沢にゆかりのある世界的な建築士の谷口吉郎・吉生親子に関する資料が展示されている。二人が設計した建物は数多く残されているが、唯一親子が共同で設計した建物が金沢にはあり、煉瓦造の棟とコルテン鋼の外壁の棟が融合した姿は人々を魅了している。その建物はどれか。",["鈴木大拙館","玉川図書館","伝統産業工芸館","金沢文芸館"],1,"","寺社・建造物・まち","S",9],["江戸時代の北陸地方における農業の書物「耕稼春秋」には農家の月ごとにする仕事や作るべき作物、肥料や農具のことなどが書かれているが、この書物を書いたのは誰か。",["高山右近","前田綱紀","土屋又三郎","板屋兵四郎"],2,"","偉人・人物","S",9],["加賀藩3代藩主前田利常は美術工芸に目を向け、全国の名工を金沢に招いた。金・銀・鉄などの地金に他の金属をはめ込み、刀や馬具、置物や髪飾りなどに施す細工を何というか。",["加賀友禅","加賀繍","加賀五彩","加賀象嵌"],3,"","美術・工芸・芸能","X",9],["金沢市では歴史のある旧町名を復活させる取り組みが各地で行われており、2019年（令和元）5月1日にも東山地区の（　　）が旧町名を復活させた。町名の由来は前田家が安産祈願のため参拝していた観音院が卯辰山から移されたとき、観音院から浅野川大橋までの道を広げたことによるものであるが、（　　）に入る町名はどれか。",["高道町","観音町","材木町","子来町"],1,"","寺社・建造物・まち","S",9],["金沢には藩政時代の文化が多く残っているが、文化文政（1804～1829年）のころ大石藤五郎が定着させた年の初めのお祝いに踊る踊りは何か。",["寺中神事能","加賀宝生","上野町餅つき踊","加賀万歳"],3,"","美術・工芸・芸能","X",9],["2019年（令和元）5月に、「荒波を越えた男たちの夢が紡いだ異空間～北前船寄港地・船主集落～」として北前船ゆかりの金沢市が「日本遺産」に追加登録された。北前船船主として一代で約300万両にのぼる富を築いた宮腰の豪商は誰か。",["木谷（木屋）藤右衛門","高多久兵衛","銭屋五兵衛","土屋九兵衛"],2,"","偉人・人物","X",9],["金沢市の姉妹都市は全部で7都市あるが、中国にある姉妹都市はどこか。",["蘇州市","上海市","北京市","大連市"],0,"","市政・最近の話題","S",9],["加賀藩5代藩主前田綱紀は有名な学者を日本中から金沢に招いたり、貴重な書物を国中から集めたりしていたため、江戸時代を代表する学者に「加賀は天下の書府」とほめたたえられた。この学者とは誰か。",["新井白石","木下順庵","稲生若水","室鳩巣"],0,"","歴史","X",9],["2012年（平成24）に金沢市でスタートした、人や環境にやさしい公共レンタサイクルシステム「まちのり」を説明したものはどれか。",["1度借りたら3日間返さなくてもよい。","支払いは現金のみであり、クレジットカードでの支払いはできない。","自転車は、借りた場所（ポート）と違うポートにも返却できる。","利用できるのは、観光客限定である。"],2,"","市政・最近の話題","S",9],["金沢市は昔から地下水にめぐまれ、井戸がたくさんつくられていたが、大正時代の大干ばつをきっかけに上水道の整備が進められた。金沢市につくられた最初の浄水場はどれか。",["内川浄水場","末浄水場","犀川浄水場","浅野川浄水場"],1,"","歴史","S",9],["金沢市は、森林が面積の約6割を占めているが、森林の整備を進めたり、森林と親しむ機会をつくったりすることを定めている条例を何というか。",["かなざわ森林条例","かなざわ遊林条例","金沢環境森林条例","金沢市森づくり条例"],3,"","市政・最近の話題","S",9],["金沢市は、「スポーツで人とまちを元気にする」ことに積極的に取り組むことで、さらなる活力と魅力のあるまちづくりを進めている。その一環として年齢・性別等にとらわれない「ｅスポーツ」の普及にも力を入れており、技術や創作力を持った人材の育成やｅスポーツを通した人々の交流の活性化等を目標としている。このｅスポーツとはどのような競技か。",["課題に対し、誰がよりよい解決策を提案できるか競い合う競技","日本伝統の昔遊びによる対戦競技","アクロバティックで危険な動きを競い合う競技","電子機器（コンピューター等）を使った対戦競技"],3,"","市政・最近の話題","S",9],["金沢は能楽がさかんな町であり、武家のみでなく、庶民にも広く親しまれたことから「金沢に行くと空から謡が降ってくる」と例えられる程であった。次のうち加賀藩5代藩主前田綱紀が取り入れたことにより、金沢で能楽が栄えるきっかけとなった流派はどれか。",["金春流","観世流","宝生流","金剛流"],2,"","美術・工芸・芸能","X",9],["1898年（明治31）、石川県で初めて営業を開始した「馬車鉄道」（線路の上の乗り物を馬が引っ張る鉄道）は、どことどこを結んでいたか。",["上金石～長田","鞍月～粟崎","三馬～松任","野町～額"],0,"","歴史","X",9],["17世紀に起きた洪水により、加賀藩では多くの窮民（貧乏で生活に困っている人々）がでた。そこで、当時全国的に例のない「お救い小屋」を設置した加賀藩主は誰か。",["初代藩主前田利家","2代藩主前田利長","3代藩主前田利常","5代藩主前田綱紀"],3,"","歴史","S",9],["金沢は雪国としても知られているが、雪の重みで木の枝が折れないように樹木に施されるものは何か。",["こもかけ","雪囲い","雪吊り","枝守り"],2,"","自然・産業","X",9],["加賀藩3代藩主前田利常は、1651年（慶安4）から1656年（明暦2）に、村々の田の良し悪しや広さを調べ、その村の米の取れ高から年貢の率を決め、藩へ納める年貢を決めた。この改革を何というか。",["太閤検地","版籍奉還","村御印","改作仕法（改作法）"],3,"","歴史","S",9],["金沢は水がきれいなまちとしても有名であるが、金沢の川が清流である証として多く捕れた魚はどれか。",["ごり","めだか","いわな","うぐい"],0,"","自然・産業","X",9],["江戸時代末期の天保時代に、上田作之丞は中級武士の出身ながら学問に優れ、私塾「拠遊館」を開いた。この拠遊館には藩のことを真剣に考えようとする優れた中級武士や下級武士が大勢集まり議論したが、彼らは会合の時にそろってある衣服を身に付けていたことから何と呼ばれるようになったか。",["長羽織党","黒羽織党","単衣羽織党","赤羽織党"],1,"","歴史","S",9],["江戸時代、参勤交代により大名は1年おきに領地と江戸を行き来しており、加賀藩の大名行列は、江戸まで徒歩での大移動であった。コースは3つあったが、主にどのコースが選ばれたか。",["越前福井道","北国上街道","北国下街道","東海道"],2,"","歴史","S",9],["近江町市場では2009年（平成21）の再開発事業により生まれ変わった。新たに観光のシンボルとなった建物を何というか。",["近江町いちば館","近江町青果館","近江町鮮魚館","近江町アーケード"],0,"","寺社・建造物・まち","X",9],["金沢は冬に雪が多く降る気候である。雪の重みで枝が折れないよう、冬の間、樹木に施されるものは何か。",["雪化粧","間垣","雪吊り","こも掛け"],2,"","自然・産業","X",3],["加賀藩初代藩主の前田利家は、15才の時に、小姓（殿様の身の回りの世話をする武士）として織田信長に仕えた。若い頃の利家は、喧嘩早く、「（　　）の又左」といわれ、人々におそれられた。（　　）には何が入るか。",["刀","斧","槍","弓"],2,"","偉人・人物","X",3],["大樋焼は、加賀藩5代藩主の前田綱紀が、茶道普及のために裏千家の始祖（最初に始めた人）と楽焼の陶工を京都から招いたことから始まった。次のうち、大樋焼の工程の特徴はどれか。",["ろくろや型を使って整える。","一つ一つ手びねりでつくる。","五彩の彩色をする。","金・銀をほどこし400度で焼いて完成する。"],1,"","美術・工芸・芸能","S",3],["金沢には多くの方言があるが、金沢の方言「たいそい」の意味はどれか。",["疲れた","ありがとう","おそろしい","ゆったりと"],0,"","金沢ことば","S",3],["加賀には、室町時代から加賀絹を梅の樹皮の煎汁（煮出した汁）に浸して染める無地染めがあり、「加賀染め」といわれていた。その後、「ぼかし」や「虫喰い」などの技法を用いて発展した、表現に味わいがある伝統工芸は何か。",["加賀象嵌","二俣和紙","加賀友禅","金沢仏壇"],2,"","美術・工芸・芸能","S",3],["百万石まつりは、金沢市のもとをつくった前田利家の功績をたたえて開かれている。百万石まつりが毎年6月に開かれるのは、利家が6月にあることを行ったといわれているからであるが、それは何か。",["加賀藩初代藩主になった","織田信長の家来になった","辰巳用水をつくらせた","金沢入城をはたした"],3,"","食・行事","S",3],["加賀藩5代藩主の前田綱紀の時代である1697年（元禄10）には、金沢の町は発展をとげ、江戸・大坂・京都に次ぐほどの大都市になった。当時の町の人口は約何人だったか。",["約6,900人","約69,000人","約690,000人","約6,900,000人"],1,"","歴史","S",3],["1838年（天保9）、凶作に苦しむ農民を救うため、村役人たちが年貢米をまけてほしいと藩に願い出る事件がおきたが、村役人たちはとらえられ、家族ともども越中五箇山へ流刑となった。そのおよそ60年後、事件の真相を知った（　　）はこれらの人を天保義民といってたたえた。（　　）には誰が入るか。",["寺島蔵人","銭屋五兵衛","土屋又三郎","勝海舟"],3,"","歴史","S",3],["明治時代、国は今の大学にあたる高等中学校を5校つくった。そのうちの1校が金沢につくられ、のちの金沢大学になった。この学校がつくられた当時の学校名は何か。",["第一高等中学校","第二高等中学校","第三高等中学校","第四高等中学校"],3,"","歴史","X",3],["金沢市では、すべての市民が生涯にわたって、いつでも学習ができるように、いろいろな機会を設けている。このような生涯学習情報に、市民がいつでも触れられるようにするため、金沢市が定期的に発行している、イベントや講座を紹介する冊子は何か。",["いいね金沢","Ｙｏｕｓ（ユース）","みまっ誌","かけはし"],2,"","市政・最近の話題","X",3],["第2次世界大戦中、工場などに働きに出て、空襲で犠牲になった少女たちをとむらうため、卯辰山の山頂付近に建立されたのは何か。",["笠舞の地蔵","非人清光の碑","天保義民の碑","殉難おとめの像"],3,"","歴史","S",3],["金沢市では、歴史ある旧町名や昔の地名が忘れ去られることのないように、旧町名や坂道、用水などの由来を刻んだ標柱「歴史のまちしるべ」を建てた。1999年（平成11）、最初に復活した、加賀藩士の屋敷があったという由来のある町名は何か。",["主計町","袋町","飛梅町","木倉町"],0,"","寺社・建造物・まち","X",3],["ある年、金沢のまちに連日20㎝を越える雪が降り続き、最大積雪181㎝の大雪となった。建物があいついで倒れ、車が動かなくなるなど、市民生活に大混乱を与えたこの大雪を何というか。",["20豪雪","38豪雪","55豪雪","81豪雪"],1,"","歴史","S",3],["金沢市には、石川ミリオンスターズ、ツエーゲン金沢、金沢武士団の3つのプロスポーツチームがあるが、この3つのプロスポーツチームにあてはまらないスポーツはどれか。",["バレーボール","野球","サッカー","バスケットボール"],0,"","市政・最近の話題","S",3],["金沢にはさまざまな伝統産業が息づいており、加賀友禅の友禅流しや、上質な和紙作りには清らかな水がどうしても必要である。金沢の川が清流である証拠として、昔から、ある小魚がたくさんとれ、金沢の特産品「○○の佃煮」としても有名である。○○にあてはまる2文字の小魚は何か。",["あゆ","ぼら","ごり","ふな"],2,"","自然・産業","X",3],["明治時代に入ると、江戸時代の武士たちは士族となったが、俸禄（武士の給与）がなくなるなど、生活が苦しくなった。そこで、士族救済のために移住がすすめられるようになったが、79家族がその地に渡り、前田村を作った都道府県はどれか。",["東京都","北海道","大阪府","沖縄県"],1,"","歴史","S",3],["加賀藩3代藩主の前田利常は、火事が広がらないように（　　）と呼ばれる火除地をつくった。（　　）には何が入るか。",["高台","広場","検地","広見"],3,"","寺社・建造物・まち","X",3],["1471年（文明3）、蓮如は親鸞の教えを伝えるために、北陸を旅することを決意した。金沢市内にある蓮如にゆかりのある寺はどれか。",["妙成寺","二俣本泉寺","傳燈寺","大乗寺"],1,"","寺社・建造物・まち","S",3],["金沢市では、東部にある医王山や南部にある平栗などの森林で、ニホンカモシカやギフチョウのようなめずらしい動物を見ることができる。金沢市の面積のうち、森林が占める割合は約何割か。",["約1割","約3割","約6割","約9割"],2,"","自然・産業","S",3],["金沢は、藩政時代から今日まで、さまざまな分野で活躍する多くの人々を育んできた。その中で、緯度の変化を計算するⅩＹの公式にＺ項を発見し、地球上の緯度観測をより正確に行えるようにした人物は誰か。",["高峰譲吉","鈴木大拙","木村栄","八田與一"],2,"","偉人・人物","X",3],["金沢には多くの川が流れている。これらの川では、舟によって各地の産物が金沢城下に運ばれ、人々の通行手段としても利用されたが、加賀藩の年貢米を運ぶのに利用された川はどれか。",["小矢部川","森下川","手取川","木曳川"],1,"","歴史","S",3],["「加賀の平賀源内」とも称された大野弁吉は、1801年（享和元）京都に生まれた。弁吉は幼少のころから非凡な才能をあらわし、長崎に出てオランダ人に西洋医学や理化学、天文学を学んだ。次のうち、弁吉に関係の深い事柄はどれか。",["天然痘","測量技術","新撰数学","からくり師"],3,"","偉人・人物","S",3],["金沢が生んだ三文豪として、泉鏡花、室生犀星、徳田秋声がいる。次のうち、泉鏡花の作品ではないものはどれか。",["あらくれ","高野聖","義血侠血","照葉狂言"],0,"","文学","S",3],["金沢市で1番高い山は標高1,644ｍで、犀川の水源にもなっている。この山の名前は何か。",["医王山","白山","キゴ山","奈良岳"],3,"","自然・産業","X",3],["江戸時代の金沢では、町の格づけがされていた。伝馬役(藩主の荷物や人を運ぶために運搬用の馬や費用を負担する)や町夫(道路・橋・堤防などの工事に人足を提供する)を負担する町で、比較的生活に余裕のある町人が住んでいた町を何というか。",["相対請地","七ヶ所","本町","地子町"],2,"","歴史","S",3],["金沢市内の南部に豊かな自然に恵まれた山がある。その山には加賀藩初代藩主の前田利家とその正室の芳春院など前田家一族の墓や、金沢を代表する多くの著名人の墓があるが、その山を何というか。",["卯辰山","野田山","戸室山","医王山"],1,"","寺社・建造物・まち","X",3],["2008年（平成20）、観測史上例のない大雨によって川の水があふれ、道路や土地が水に浸かり、広い範囲で被害が出た。このとき、55年ぶりに氾濫した川はどれか。",["浅野川","金腐川","犀川","内川"],0,"","自然・産業","X",3],["加賀藩で貨幣ができたのは加賀藩初代藩主の前田利家の頃である。豊臣秀吉にならって多くの金・銀貨をつくらせたのがはじまりだとされているが、次のうち、貨幣のもとになる金銀が産出した山はどれか。",["白山","大門山","キゴ山","宝達山"],3,"","歴史","S",3],["春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子があり、生活の中に彩りと美を添えている。次のうち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。",["金花糖","五色生菓子","氷室まんじゅう","辻占"],3,"","食・行事","S",3],["金沢には、金沢市無形民俗文化財に指定された藩政時代の文化が今もたくさん残っている。大野湊神社では毎年5月15日のお祭りに能楽が演じられているが、この行事は何と呼ばれているか。",["悪魔払い","ジョンカラ節","寺中神事能","加賀万歳"],2,"","美術・工芸・芸能","S",3],["金沢港は1954年（昭和29）に、金石港ともう一つの港が合併してできた。次のうち、もう一つの港はどれか。",["大野港","粟崎港","浅野川港","専光寺港"],0,"","歴史","S",3],["1599年(慶長4)、徳川2代将軍秀忠の2女として生まれた珠姫は、3歳で金沢に嫁入りし、8人の子を育てた。珠姫は亡くなった後「天徳院」と呼ばれたが、その名のお寺を小立野につくり、珠姫の霊を祀った加賀藩主は誰か。",["加賀藩初代藩主前田利家","加賀藩2代藩主前田利長","加賀藩3代藩主前田利常","加賀藩4代藩主前田光高"],2,"","寺社・建造物・まち","X",3],["2014年（平成26）、金沢市は「めざすべき金沢の子ども像」を策定した。それを、市内の中学生が分かりやすく、覚えやすい言葉で表現した、子どもたちの考え方や行動の基本的な約束事は何か。",["男女共同参画都市宣言","金沢市民憲章","金沢子どもかがやき宣言","かなざわ子育て夢プラン"],2,"","市政・最近の話題","X",3],["第1次世界大戦の後半（大正7年頃）、金沢市では財源を確保するため、新しい税を徴収することを考えた。全国にさきがけて導入された税で、当時のお金で2円以上飲食した場合にかかる、生活に余裕がある人のぜいたくに対してかけられた税は次のうちどれか。",["飲食税","贅沢税","消費税","遊興税"],3,"","歴史","S",3],["金沢には、名前の由来となっているように、沢や湧き水が多くあり、このような清らかな水からできた、上質な和紙を使ってつくられる金沢の特産品がある。全国の総生産量の99％を占める、この特産品は次のうちどれか。", ["友禅", "和紙", "漆器", "金箔"], 3, "（※出題当時の数字。県外で唯一の職人が引退し、今は全国の100パーセントといわれる）", "美術・工芸・芸能", "X", 3],["1689年（元禄2）、松尾芭蕉は「奥の細道」の旅の途中、金沢に立ち寄った。その際、弟子の小杉一笑の死を悼んで詠んだ句はどれか。",["塚も動けわが泣く声は秋の風","むざんやな甲の下のきりぎりす","あかあかと日は難面も秋の風","山中や菊はたおらじ湯のにほひ"],0,"","文学","S",3],["水が豊富なまち・金沢には55もの用水が流れているが、この55の用水を合わせるとどのくらいの長さになるか。",["約15km","約50km","約150km","約500km"],2,"","寺社・建造物・まち","S",3],["加賀藩5代藩主の前田綱紀は、細工人の技術向上と工芸技術を保存し記録するために（　　）をつくった。（　　）には何が入るか。",["百工比照","尊経閣文庫","お救い小屋","加賀宝生"],0,"","美術・工芸・芸能","X",3],["平安時代の初め、越前国から分離されできた能登国や加賀国では、使節を受け入れるなど、ある国と積極的な交流を行ってきた。ある国とは次のうちどれか。",["唐","契丹","蝦夷","渤海"],3,"","歴史","S",3],["金沢市には「加賀野菜」のほかにも、優れた野菜が多くある。金沢市では、金沢の風土をいかして生産された野菜を「金沢（　　）」に認定して、多くの人に食べてもらえるように取り組んでいる。（　　）には何が入るか。",["うまれ","たべもの","じわもん","そだち"],3,"","自然・産業","S",3],["金沢には、クリの巨大木柱根が日本最多数の350本以上も見つかり、国指定史跡として整備されている縄文時代の遺跡がある。次のうち、その遺跡はどれか。",["チカモリ遺跡","塚崎遺跡","西念・南新保遺跡","北塚遺跡"],0,"","歴史","X",3],["1874年(明治7)、「金沢製糸場」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月用水から水を引き、大きな水車を使って機械を動かしていた。次のうち、「金沢製糸場」をつくった人物は誰か。",["稲垣義方","森下八左衛門","長谷川準也","津田米次郎"],2,"","偉人・人物","X",3],["金沢には四季それぞれの材料を使った加賀料理や、伝統的な技術をいかした和菓子など、豊かな食文化がある。下のシンボルマークが使われている、金沢の食文化がより豊かなものになることを願ってつくられたスローガンは次のうちどれか。",["五感にごちそうかなざわ","グッドマナーかなざわ","いしかわ百万石物語","新しい金沢、はじまる。"],0,"","食・行事","S",3],["歴史遺産や伝統文化が残る金沢は観光都市であり多くの観光客が訪れる。外国語による観光案内や、兼六園・金沢城などを専門に案内する観光ボランティアを何というか。",["まいどさん","もてなしさん","あんやとさん","いいね金沢さん"],0,"","市政・最近の話題","X",5],["鎌倉時代のはじめには、金沢の高尾町・泉野町付近から三馬・久安付近を支配し、のちに加賀国の守護となり、歌舞伎「勧進帳」では安宅の関で源義経と弁慶を通したと伝えられている一族はどれか。",["林氏","前田氏","久安氏","富樫氏"],3,"","歴史","X",5],["俵屋宗達や五十嵐道甫など有名な画家や職人を金沢に招き、江戸や京都と肩を並べるほど美術工芸を盛んにした加賀藩主は誰か。",["前田利家","前田利長","前田利常","前田慶寧"],2,"","偉人・人物","X",5],["兼六園は、加賀藩5代藩主前田綱紀の別荘の茶室や庭が始まりであるが、1度につくられたものではない。12代藩主斉広が兼六園内に曲水をつくったとき、水を引いた用水の名前は何か。",["長坂用水","大野庄用水","辰巳用水","金洗沢"],2,"","寺社・建造物・まち","X",5],["地域振興や観光振興の観点から地域名表示を弾力化した「ご当地ナンバー」として2006年（平成18）から「金沢」も表示できるようになった。この「ご当地ナンバー」をつけるものは何か。",["新幹線","自動車","ふるさと納税の商品","Wi-Fiスポット"],1,"","市政・最近の話題","X",5],["1656年（明暦2）と1670年（寛文10）の2度、加賀藩が領内の村々に出した書面で、村の収穫高とそれに見合う年貢の割当が書かれたものを何というか。",["村御印","二日読","夫銀","小物成"],0,"","歴史","S",5],["市民がいつでも生涯学習の情報に触れられるように、金沢市が定期的に発行しているイベントや講座を紹介する冊子を何というか。",["いいね金沢","みまっ誌","かけはし","たいあっぷ"],1,"","市政・最近の話題","X",5],["江戸時代の金沢では舟運がさかんで、川を利用して各地の産物が金沢城下や川沿いの村々へと運ばれた。それらのうち加賀藩の年貢米を金沢城下の御蔵に運ぶのに利用されていた川はどれか。",["森下川","犀川","浅野川","大野川"],0,"","歴史","S",5],["金沢が生んだ文豪で、「幼年時代」「性に眼覚める頃」などの小説や「犀川」という詩などを発表した人物は誰か。",["徳田秋声","泉鏡花","夏目漱石","室生犀星"],3,"","文学","X",5],["1858年（安政5）におこった「安政の泣き一揆」の首謀者として処刑された人たちの霊を慰めるために、東山の寿経寺につくられたのは何か。",["七泣き地蔵","卯辰地蔵","七稲地蔵","七米地蔵"],2,"","寺社・建造物・まち","X",5],["金沢市は、2009年（平成21）6月に、国連のユネスコから、独自の文化を産業と結びつけ、新しい価値を生み出している「創造都市」として認定された。このとき、金沢市が「創造都市」として認定されたのはどの分野か。",["ガーデン（庭園）","ピクチャー（絵画）","クラフト（工芸）","ミュージック（音楽）"],2,"","市政・最近の話題","X",5],["江戸時代、金沢町人の財産争いを防ぐために、町の人々が義務付けられていた相続の方法は次のうちのどれか。",["長子相続","遺言状による相続","十人組による相続","町年寄りによる相続"],1,"","歴史","S",5],["金沢仏壇の製造には、御細工所（加賀藩の工芸製作工場）の木地師、塗師、蒔絵師、彫刻師、金具師が完全分業体制であたっていた。金沢仏壇の特色として正しいものは、次のうちのどれか。",["繊細で変色しやすい。","組み立てに釘がたくさん使われている。","加賀蒔絵や金箔が使われている。","加賀友禅がふんだんに使われている。"],2,"","美術・工芸・芸能","X",5],["1915年（大正4）から1951年（昭和26）まで、金石の地で、くりひろげられた高校のスポーツ大会は、次のうちのどれか。",["野球","水泳","マラソン","角力"],3,"","歴史","S",5],["加賀藩では村々を数十か村集めた「組」が作られていた。この「組」を支配した、身分は百姓であるが、武士からの命令を村々に伝えたりするなどの仕事を行った役人を何というか。",["肝煎","百姓代","十村","組合頭"],2,"","歴史","S",5],["兼六園の中にあり、加賀藩13代藩主前田斉泰が母の住まいとして建てた建物は何か。",["竹沢御殿","蠑螺山","成巽閣","時雨亭"],2,"","寺社・建造物・まち","X",5],["明治時代はじめ、明治維新に取り残された士族たちによってつくられた政治結社で、金沢に初めてつくられた政治結社を何というか。",["立志社","愛国社","忠告社","自助社"],2,"","歴史","S",5],["金沢では1963年（昭和38）に三八豪雪と呼ばれる記録的な豪雪となった。連日20cmを超える雪が2週間以上降り続き、人々は2階の窓から家に出入りした。この豪雪時の、金沢の最大積雪量は約何cmか。",["80cm","180cm","280cm","380cm"],1,"","自然・産業","S",5],["馬車鉄道しかなかった金沢にはじめて電車が走ったのは、1914年（大正3）である。今はもう走っていないが、その路線と営業していた鉄道会社はどれか。",["鶴来～野々市（石川電鉄）","武蔵ヶ辻～香林坊（香林坊電鉄）","金沢～内灘（浅野川電鉄）","金石～長田（金石電鉄）"],3,"","歴史","X",5],["北塚遺跡は縄文時代中期の遺跡である。この遺跡から日本で初めて出土したものは何か。",["クリの木柱根","文様入り帯金具","和同開珎銀銭","<span class='fg fx'>石<span class='frt'>いし</span></span>でつくられた指輪"],3,"","歴史","S",5],["1488年（長享2）、鳥越弘願寺・吉藤専光寺・木越光徳寺を指導者とした一向宗農民門徒の一揆軍が、高尾城を攻撃して守護の富樫政親を倒した。この一揆を何というか。",["嘉吉の乱","鳥越の一揆","長享の一揆","高尾の一揆"],2,"","歴史","S",5],["豊臣秀吉に追放されたキリシタン大名であり、加賀 誰が入るか。",["中谷宇吉郎","高光一也","三浦彦太郎","津田米次郎"],3,"","偉人・人物","X",29],["金沢市の市章は1891年（明治24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。",["桜","梅","松","桃"],1,"","市政・最近の話題","X",29],["8〜10世紀頃、唐（中国）から独立した「渤海」という国があった。この国と日本との交流は盛んで、犀川河口が渤海の使者の受け入れ口だったといわれている。この交流があったことの証拠として畝田ナベタ遺跡から出土したものは何か。",["弥生土器","珠文鏡","文様入り帯金具","籃胎漆器"],2,"","歴史","S",29],["加賀藩最後の藩主である前田慶寧が、加賀藩の人々が豊かに生活できるようにと「養生所（病院）」や「撫育所（福祉施設）」の設置、織物・製紙などの工場の建設を行って開発を進めたのはどこか。",["卯辰山","白山","戸室山","野田山"],0,"","歴史","X",29],["金沢には、金沢市無形民俗文化財に指定された伝統行事が今もたくさん残っている。斧や刀、弓を持った山伏が各家をまわる金石町や大野町で行われている行事はどれか。",["はしご登り","加賀宝生","さかたおどり","悪魔払い"],3,"","食・行事","X",29],["金沢にはたくさんの方言がある。その中で「行儀がよい子」をあらわす方言はどれか。",["かたい子","きかん子","てきない子","おとろし子"],0,"","金沢ことば","S",29],["江戸時代は、お金として金、銀、銭が使用されていた。加賀藩では18世紀の中頃になると財政が大変苦しくなり、倹約策や年貢米の取り立てを厳しくしたが、それでも苦しかったので、藩内だけに通用する（　　）を発行してしのごうとした。（　　）に入るのはどれか。",["米札","金札","銭札","藩札（銀札）"],3,"","歴史","S",29],["1947年（昭和22）に、第2回国民体育大会が石川県で開催された。その大会歌として「参加者全員で歌える歌を」ということからできあがった歌はどれか。",["ふるさと","若い力","うみ","ラジオ体操の歌"],1,"","歴史","X",29],["金沢の旧町名の由来として正しくないものはどれか。",["木倉町…藩政初期に軍用の味噌蔵が建っていた。","袋町……この町筋の北国街道の両端が曲がって袋のようであった。","並木町…浅野川の護岸のために川沿いに植えられた松並木にちなんだ。","主計町…加賀藩士、富田主計の屋敷があった。"],0,"","寺社・建造物・まち","S",29],["金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともとは、防火の目的でつくられたといわれているこの空間を何というか。",["大通り","路地","公園","広見"],3,"","寺社・建造物・まち","X",29],["明治時代になり、金沢にも近代工業が芽生えはじめた。1874年（明治7）に長町の川岸につくられた「金沢製糸場」は、当時、国がつくった富岡製糸場（群馬県）に次いで全国第2位の大きな工場だった。この「金沢製糸場」をつくった実業家は誰か。",["徳田秋声","森下八左衛門","長谷川準也","赤羽萬次郎"],2,"","偉人・人物","X",29],["金沢は伝統工芸が盛んであるが、このうち金箔は全国第1位の生産量を誇っている。金沢の金箔は日本の総生産量のおよそ何％を占めているか。", ["66％", "77％", "88％", "99％"], 3, "（※出題当時の数字。県外で唯一の職人が引退し、今は全国の100パーセントといわれる）", "美術・工芸・芸能", "S", 29],["金沢の農業は米作りが中心だが、市街地近郊では野菜や花、果物などの栽培が盛んに行われている。このうち、金沢の風土を生かして生産された「金沢そだち」の3品目に含まれないものはどれか。",["だいこん","すいか","バナナ","なし"],2,"","自然・産業","S",29],["1599年（慶長4）、加賀藩2代藩主の前田利長は、金沢城防備のため、キリシタン大名としても有名な（　　）に命じて東西に内惣構堀（内堀）を造らせた。（　　）には誰が入るか。",["高山右近","横山長知","篠原一孝","奥村永福"],0,"","歴史","X",29],["2015年（平成27）11月15日に、金沢の魅力発信や市民の健康増進を目的として「金沢○○○○」という1万人規模のスポーツ大会が開催される。○にあてはまる4文字のスポーツは何か。",["サッカー","やきゅう","マラソン","すいえい"],2,"","市政・最近の話題","S",29],["2008年（平成20）7月28日の大雨で55年ぶりに氾濫し、防災の大切さを再認識させた川はどれか。",["金腐川","浅野川","犀川","伏見川"],1,"","自然・産業","X",29],["市民がいつでも生涯学習の情報に触れられるように、金沢市が定期的に発行している冊子を何というか。",["みまっ誌","かけはし","いいね金沢","たいあっぷ"],0,"","市政・最近の話題","X",29],["金沢に初めて電灯がともったのは、1894年（明治27）である。そのときにアーク灯がつけられた場所は、兼六園で開かれた関西府県連合共進会場と、ある神社の門前であった。ある神社とはどこか。",["尾山神社","尾崎神社","石浦神社","平岡野神社"],0,"","歴史","X",29],["金沢には様々なボランティア団体がある。そのうち「まいどさん」はどのようなボランティアを行う団体か。",["まちを元気にする挨拶ボランティア","まちをきれいにする清掃ボランティア","まちの案内をする観光ボランティア","金沢名物を販売する行商ボランティア"],2,"","市政・最近の話題","S",29],["金沢の伝統工芸のひとつに、加賀藩5代藩主の前田綱紀が茶道を広めるために京都から職人を招いて作らせた焼き物がある。ろくろを使わず手びねりによって一つ一つ作ることや、独特の味わいのある飴色が特徴のこの焼き物を何というか。",["珠洲焼","信楽焼","九谷焼","大樋焼"],3,"","美術・工芸・芸能","X",29],["金沢には、昔から伝わる年中行事が今も数多く残っている。そのうち7月1日に関係が深いものはどれか。",["消防の「出初式」","「氷室」の饅頭","墓参りの「切籠」","「七五三」の宮参り"],1,"","食・行事","X",29],["2010年（平成22)に金沢の中心部に開館した「しいのき迎賓館」は、ギャラリーやレストランなどが設けられているが、以前はどのような建物だったか。",["裁判所","図書館","県庁","消防署"],2,"","寺社・建造物・まち","X",29],["金沢の山地と平野の境で見られる地形（丘陵地）を、北から順に正しく並べたのはどれか。",["小立野台地→寺町台地→卯辰山","小立野台地→卯辰山→寺町台地","卯辰山→寺町台地→小立野台地","卯辰山→小立野台地→寺町台地"],3,"","自然・産業","X",29],["金沢と協定を結んでいる国内交流都市のうち、江戸時代に参勤交代などに利用された加賀藩の下屋敷があったことから、今でも「加賀小中学校」「金沢小学校」など、金沢にゆかりの深い地名や学校名が残っているのはどこか。",["東京都板橋区","岐阜県高山市","愛知県豊田市","長野県松本市"],0,"","市政・最近の話題","X",29],["1858年（安政5）、凶作による米の値上がりに苦しむ人々が、卯辰山から金沢城に向かい「ひもじいわいやー」「米くれまいやー」と泣き叫んだ。この「安政の泣き一揆」で処刑された7人の霊をなぐさめるため、東山の寿経寺につくられたのは何か。",["泣き地蔵","七稲地蔵","泣き観音","七稲観音"],1,"","寺社・建造物・まち","S",29],["金沢市は、世界の7都市と姉妹都市提携をしている。次のうち、姉妹都市ではない都市はどれか。",["蘇州市","ナンシー市","ポルト・アレグレ市","サンフランシスコ市"],3,"","市政・最近の話題","S",29],["北陸地方は世界的な豪雪地帯である。金沢気象台が観測を始めてから最大の記録で、新雪総計343㎝、最大積雪181㎝を記録した北陸地方の大雪を何というか。",["昭和一八豪雪","昭和三八豪雪","昭和四八豪雪","昭和五八豪雪"],1,"","自然・産業","X",29],["金沢の地域福祉活動の原点でもあり、生活相談や託児（小さな子供たちを預かること）などの援助を行い、地域の福祉・社会教育の拠点として、1934年（昭和9）から建てられた施設を何というか。",["善隣館","友好館","交流館","福祉館"],0,"","歴史","X",29],["金沢には、明治時代にすぐれた文学作品を残した三文豪と呼ばれる人たちがいる。有名な文学者である尾崎紅葉の門下生となり、「黴」「あらくれ」「縮図」などの小説を発表したのは誰か。",["泉鏡花","徳田秋声","竹久夢二","室生犀星"],1,"","文学"," 話題","S",30],["金沢が誇る清流や、緑豊かな自然、歴史あるまちなみを守りつつ、未来の子供たちに美しく健全なまち金沢を残そうと、1998年（平成10）に金沢市議会で議決されたのは次のどれでしょうか。",["用水保全条例","緑の都市宣言","こまちなみ保存条例","環境都市宣言"],3,"","市政・最近の話題","S",30],["金沢市では、工芸に限らず、創造的なものづくりを国の内外に発信しています。手仕事の「手」とよいものを見極める「目」を表現した下のシンボルマークを何というでしょうか。",["テトメデス","テシゴトン","クラフトス","テメイイネ"],0,"","市政・最近の話題","X",30],["金沢ではお祭りの楽しみのひとつに（　　）があります。お祭りが近づくとお囃子や棒振りの練習が始まり、若者から子供たちへと技が伝えられていきます。（　　）に入る言葉は何でしょうか。",["はしご登り","餅つき踊り","獅子舞","加賀宝生"],2,"","美術・工芸・芸能","S",30],["1887年（明治20）、国は金沢に（　　）高等中学校を開校しました。のちに（　　）高等学校となり、日本を支える多くの人々を育てました。（　　）に入る言葉はどれでしょうか。",["第一","第二","第三","第四"],3,"","歴史","X",30],["金沢では、市内のいたるところで沢やわき水が見られるほど昔から水が豊かで、この沢やわき水のことを（　　）と呼んでいます。（　　）に入る言葉は何でしょうか。",["ぶつぶつ","わっくわっく","どんどこ","もっくり"],3,"","金沢ことば","S",30],["金沢では、火災発生の知らせで市民（消防団の団員）が消防車に乗り込み、火災現場へ行って消火にあたっています。金沢はこうした（　　）（消防団）が多いまちといわれています。（　　）に入る言葉は何でしょうか。",["消防応援","勇敢消防","義勇消防","ボランティア消防"],2,"","市政・最近の話題","S",30],["金沢では、明治時代にすぐれた業績を残し、世界に誇ることのできる有名な人々を輩出しています。1894年（明治27）に、強い消化効力のある胃腸薬「タカジアスターゼ」を発明し、世界の薬学・医学の発展に大きく貢献した人は誰でしょうか。",["杉田玄白","高峰譲吉","野口英世","北里柴三郎"],1,"","偉人・人物","X",30],["加賀藩3代藩主の前田利常は、金沢のあちこちにあった寺を卯辰山のふもとや、寺町・小立野に集め金沢城下を整備しました。城に水を引くため、利常が板屋兵四郎に命じてつくらせた用水を何というでしょうか。",["大野庄用水","長坂用水","鞍月用水","辰巳用水"],3,"","歴史","X",30],["2004年（平成16）に金沢森本インターチェンジができ、さらに2012年（平成24）には白山インターチェンジが新設された新潟、富山、石川、福井、滋賀を結ぶ高速道路を何というでしょうか。",["北陸自動車道","のと里山海道","東名高速道路","名神高速道路"],0,"","自然・産業","X",30],["金沢が生んだ三文豪の一人で、「うつくしき川は流れたりそのほとりに我は住みぬ」ではじまる詩『犀川』などがおさめられた詩集『抒情小曲集』の作者は誰でしょうか。",["徳田秋声","竹久夢二","室生犀星","泉鏡花"],2,"","文学","X",30],["江戸時代、茶の湯がさかんになった加賀藩では色々な和菓子が考え出され、藩主への献上菓子として多く作られてきました。加賀藩2代藩主の前田利長の頃に作られた、結婚などのお祝い事のときに配られる和菓子を何というでしょうか。",["辻占","福梅","五色生菓子","金菓糖"],2,"","食・行事","S",30],["1584年（天正12）に起きた、越中（富山県）の佐々成政と、加賀藩初代藩主の前田利家との戦いを何というでしょうか。",["倶利伽羅の合戦","志雄山の合戦","宮腰（金石）の合戦","末森の戦い"],3,"","歴史","S",2],["金沢には、昔から金沢で栽培されている「加賀野菜」や、金沢の風土を生かして生産された「金沢そだち」など、多くの農産物があります。次のうち、「金沢そだち」の3品目にあてはまらないものはどれでしょうか。",["すいか","だいこん","なし","しいたけ"],3,"","自然・産業","S",2],["加賀藩初代藩主の前田利家は、勇猛なだけでなく、戦の最中も軍用金や兵糧米の蓄えの計算をきめ細やかに行うなど、経済的な面でも優れた武将であったといわれています。利家が計算を行うため サイクルを何というでしょうか。",["ベビのり","まちのり","のりのり","かるのり"],1,"","市政・最近の話題","S",2],["江戸時代の初め、土地を開き水田を作るためには用水が必要でした。その頃に後藤太兵衛が中心となって完成させた、野田山の周辺をぐるっと回るように造られた用水を何というでしょうか。",["辰巳用水","長坂用水","七ヶ用水","鞍月用水"],1,"","寺社・建造物・まち","X",2],["金沢には4つの市立図書館があります。そのうち、2011年（平成23）に開館した最も新しい図書館はどれでしょうか。",["玉川図書館","泉野図書館","玉川こども図書館","金沢海みらい図書館"],3,"","市政・最近の話題","S",2],["江戸時代の加賀藩中級武士の屋敷の様子をよく伝え、金沢市の史跡文化財に指定されている家の住人であった（　　）は、藩から重要な職を任されていましたが、最後は藩から能登島に流されて生涯を終えました。（　　）には誰が入るでしょうか。",["道君","大野弁吉","寺島蔵人","木曽義仲"],2,"","偉人・人物","S",2],["金沢には昔から伝わる年中行事が今も数多く残っていますが、江戸時代に、加賀藩から江戸の将軍に冬の間に保存しておいた氷を献上したことにちなんだ行事を何というでしょうか。",["出初式","氷室","左義長","ひな祭り"],1,"","食・行事","X",2],["金沢市では、毎年6月に今の金沢市のもとをつくった（　　）の功績をたたえて「百万石まつり」が開かれています。（　　）には誰が入るでしょうか。",["織田信長","徳川家康","柴田勝家","前田利家"],3,"","歴史","X",6],["火災の知らせで消防団員の市民が消防車に乗り込み、火災現場へ行って消火にあたっています。金沢はこうした（　　）が多いまちといわれています。（　　）には何が入るでしょうか。",["消防応援","火災消防","義勇消防","ボランティア消防"],2,"","市政・最近の話題","S",6],["線路上の乗り物を馬が引っ張るのを馬車鉄道といいます。1898年（明治31）石川県初の馬車鉄道が営業されたのは次のうちどの区間でしょうか。",["松任町～三馬村","野町～小立野","上金石～長田","兼六園下～寺町"],2,"","歴史","X",6],["加賀藩3代藩主前田利常は、城下のあちらこちらに散らばっていた寺院を犀川口、浅野川口、小立野台に集めました。また、各村にあった一向宗の有力な寺院は金沢城下に散在させました。宝円寺など、前田家ゆかりの寺院が多くある寺院群はどれでしょうか。",["小立野寺院群","卯辰山山麓寺院群","寺町寺院群","法華宗寺院群"],0,"","寺社・建造物・まち","X",6],["金沢には方言が今も数多く残っています。その中で、行儀がよい子を表す方言は、次のうちどれでしょうか。",["きかん子","じゃまない子","かたい子","むたむたな子"],2,"","金沢ことば","S",6],["特別な建物の跡と思われる巨大なクリの木柱根が350本以上も発見された遺跡はどこでしょうか。",["チカモリ遺跡","畝田遺跡","北塚遺跡","寺中遺跡"],0,"","歴史","X",6],["今から約40年～50年前には、金沢のいろいろなところで、水がわき出ていました。金沢ではこのような場所を水がわき出す様子から、何と呼ぶでしょうか。",["もっくり","とっくり","そっくり","ざっくり"],0,"","金沢ことば","S",6],["金沢の方言には「こんにちは・こんばんは」を表す「まいどさん」などのあいさつ言葉があります。親しい人への「ありがとう」を表す金沢の方言は、次のうちどれでしょうか。",["じゃまない","あんやと","いんぎらぁっと","りくつな"],1,"","金沢ことば","S",6],["江戸時代には街道が整えられ、物が運ばれたり、人が通ったりしました。金沢城下の上口と呼ばれる泉新町から、犀川大橋－片町－香林坊－南町－堤町－尾張町－橋場町－浅野川大橋、下口と呼ばれる大樋町を通るルートは何と呼ばれていたでしょうか。",["北陸自動車道","石川街道","北国街道","二俣街道"],2,"","歴史","S",6],["金沢には、昔から伝わる年中行事が今も数多く残っています。金沢市内の消防団員が新年に出揃い、裸放水とはしご登りをする行事の名前は何でしょうか。",["出初式","左義長","地蔵盆","歳の市"],0,"","食・行事","X",6],["加賀藩5代藩主前田綱紀は、学問好きで、多くの書物を集めたので、新井白石から「加賀は天下の（　　）」と言われ、うらやましがられました。（　　）には何が入るでしょうか。",["台所","政所","大学","書府"],3,"","歴史","X",6],["金沢には藩政時代の文化が今もたくさん残っています。金石町や大野町では（　　）と呼ばれる珍しい行事が行われています。山伏が正月と祭りの時期に行っていたのが起源といわれています。この（　　）は市無形民俗文化財に指定されています。（　　）には何が入るでしょうか。",["獅子舞","餅つき踊り","悪魔払い","さかたおどり"],2,"","食・行事","X",6],["室町時代は、戦いや争いが絶え間なく起こりました。人々は心の平安を求めて宗教にすがりました。このような時代に、北陸で浄土真宗を広めたのは誰でしょうか。",["蓮如","妙珍","運良","日乗"],0,"","歴史","X",6],["加賀藩によって、金沢に招かれた京都の名工青木木米が、卯辰山のふもとの春日山で窯を開き再興した金沢の代表的な焼き物は何でしょうか。",["珠洲焼","九谷焼","信楽焼","清水焼"],1,"","美術・工芸・芸能","X",6],["渤海は飛鳥時代末期に唐から独立した国です。渤海は唐に対抗するために、奈良時代から平安時代にかけて、日本との交流を進めたといわれています。遺跡から航海の無事を祈った鏡や、文様入り帯金具が発見された場所はどこでしょうか。",["犀川の河口","浅野川の河口","森下川の河口","伏見川の河口"],0,"","歴史","X",6],["機械動力式の織機のことを力織機といいます。1900年（明治33）に、日本初のうすい絹織物を織る力織機を発明したのは、次のうち誰でしょうか。",["森下八左衛門","三浦彦太郎","大野弁吉","津田米次郎"],3,"","偉人・人物","X",6],["珠姫は江戸幕府2代将軍徳川秀忠の次女で、徳川・前田両家を結ぶため、わずか3歳の時、加賀藩3代藩主前田利常の妻として金沢にやってきました。しかし、24歳という若さで亡くなりました。利常はその死を悲しみ、お寺をつくりました。このお寺には珠姫が作ったとされる紙ひな人形が置いてありますが、何というお寺でしょうか。",["伏見寺","宝円寺","松月寺","天徳院"],3,"","寺社・建造物・まち","X",6],["江戸時代のはじめ、後藤太兵衛が中心となり、寺町台地一帯をうるおす用水をつくりました。この用水によって泉野村や泉野出村、泉野新村の水田から、たくさんの米が取れるようになったといわれています。野田山の周辺をぐるっと回るようにつくられたこの用水を何というでしょうか。",["大野庄用水","鞍月用水","辰巳用水","長坂用水"],3,"","寺社・建造物・まち","X",6],["1592年（文禄元）、豊臣秀吉の命を受けて九州に出向いていた前田利家が、留守の利長に命じて、金沢城の本格的な城づくりが始まりました。その時に、金沢城の石垣にする<span class='fg fx'>石<span class='frt'>いし</span></span>を切り出したことで有名な山はどれでしょうか。",["白山","卯辰山","戸室山","野田山"],2,"","歴史","X",6],["金沢には、昔から伝わる風習が今も数多く残っています。その中で、お盆のお墓参りをするときに、持っていくものは、次のうちどれでしょうか。",["提灯","ランプ","雪洞","切籠"],3,"","食・行事","S",6],["この大会は、国民に希望をあたえることと、体育を純粋なスポーツにすることを目標に計画され、第2回大会が「初の地方大会」として1947年（昭和22）に石川県で開催されました。この大会を何というでしょうか。",["金沢交歓球技大会","全国高等学校総合体育大会","全日本学生選手権大会","国民体育大会"],3,"","歴史","X",4],["1671年（寛文11）、後藤太兵衛が寺町台地に田んぼを作るための用水を完成させました。犀川の支流の内川から水を引き、野田山の周りをぐるっと回るようにつくられた、この用水を何というでしょうか。",["鞍月用水","長坂用水","旭用水","大野庄用水"],1,"","寺社・建造物・まち","X",4],["1925年(大正14)、平沢嘉太郎と浅野川電鉄が協力して、日本海を望む砂丘地に大きなレジャー施設をつくりました。劇場、料亭、レストラン、動物園、大浴場、野球場などをそなえた、この施設を何というでしょうか。",["卯辰山公園","日本海遊園","兼六園","粟崎遊園"],3,"","歴史","X",4],["明治時代になると、身分制がなくなり、自分の力で生活を切り開いていくことが大切であると考えられるようになりました。そこで金沢藩では、1870年（明治3）に（　　）を開き、漢字・習字・算術などを教えました。（　　）には何が入るでしょうか。",["小学所","善隣館","御細工所","金沢医学館"],0,"","歴史","S",4],["紀元前300年から紀元後300年までの約600年間は弥生時代と呼ばれ、大陸や朝鮮半島から新しい技術が伝わりました。金沢市で竪穴式住居跡や、弥生時代の土器・木製品が大量に出土したことで注目された遺跡はどこでしょうか。",["おまる塚古墳","西念・南新保遺跡","若松本泉寺跡","畝田ナベタ遺跡"],1,"","歴史","S",4],["加賀藩3代藩主の前田利常の妻は、徳川2代将軍秀忠の娘である珠姫です。珠姫がつくったとされる紙ひな人形がある、珠姫ゆかりのお寺はどれでしょうか。",["芳春院","伏見寺","大乗寺","天徳院"],3,"","寺社・建造物・まち","X",4],["金沢が生んだ三文豪として、室生犀星・徳田秋声・泉鏡花がいますが、「抒情小曲集」や「幼年時代」、「性に眼覚める頃」などの作品を発表した作家は誰でしょうか。",["徳田秋声","室生犀星","泉鏡花","尾崎紅葉"],1,"","文学","X",4],["江戸時代では、金沢城まで水が行きわたらず、水不足になることがありました。1632年（寛永9）、金沢城に水を引くために、町人の板屋兵四郎がつくりあげた用水は次のうちどれでしょうか。",["小橋用水","泉用水","辰巳用水","旭用水"],2,"","寺社・建造物・まち","X",4],["金沢市には、2004年（平成16）、市民が現代美術に触れるとともに、いろいろな芸術活動が行える場所として開館した美術館があります。小学4年生が作品を鑑賞する「ミュージアム・クルーズ」も行っている、この美術館を何というでしょうか。",["石川県立美術館","金沢21世紀美術館","金沢市立中村記念美術館","金沢能楽美術館"],1,"","寺社・建造物・まち","X",4],["1707年（宝永4）、土屋又三郎が、1年間の農家の仕事について、月ごとにやるべき農作業を示した本を完成させました。北陸地方の農業の書物として特に有名な、この本を何というでしょうか。",["寺嶋随筆","老の道種","耕稼春秋","庶物類纂"],2,"","歴史","S",4],["金沢にはさまざまなボランティア団体があります。そのうち、1994年（平成6）に設立され、金沢の方言で「こんにちは」を意味する名前の観光ボランティアガイドのことを何というでしょうか。",["おかげさん","ごきげんさん","まいどさん","ひゃくまんさん"],2,"","市政・最近の話題","S",8],["江戸時代の有名な学者新井白石は「加賀は天下の書府」とほめたたえました。理由は、加賀藩5代藩主前田綱紀が、貴重な書物を国中から集めたことによりますが、もう一つの理由は何でしょうか。",["日本で初めての公共図書館ができたから","日本一大きな書店があったから","本を大量生産していたから","有名な学者を日本中から金沢に招いたから"],3,"","歴史","S",8],["高尾城を築いた富樫政親は加賀一国の守護となりました。しかし、その政治に反対した農民や僧たちが中心となって政親を倒した後、加賀国は何と呼ばれたでしょうか。",["百姓の持ちたる国","武士の持ちたる国","地頭の持ちたる国","一向宗の持ちたる国"],0,"","歴史","X",8],["尾山御坊のまわりにつくられた町には、西町、堤町、後町、南町などがあります。これらの町は金沢の始まりとなりました。このような町を何というでしょうか。",["金沢城下町","金沢本町","金沢寺内町","金沢地子町"],2,"","歴史","S",8],["1874年（明治7）長町の川岸に、当時としては群馬県の富岡製糸場についで全国第2位の大きさの「金沢製糸場」がつくられました。この製糸場は金沢の近代工業が発展していくさきがけとなりましたが、「金沢製糸場」をつくり、金沢市の第2代市長にもなった人物は誰でしょうか。",["津田米次郎","長谷川準也","森下八左衛門","中橋徳五郎"],1,"","偉人・人物","X",8],["縄文人は、高度な技術をもち、おしゃれで感性豊かな自然人でした。金沢市にある縄文時代中期の遺跡で、日本で初めての<span class='fg fx'>石<span class='frt'>いし</span></span>の指輪や、ヒスイのペンダントが出土したのはどこでしょうか。",["吉野ヶ里遺跡","北塚遺跡","御経塚遺跡","三内丸山遺跡"],1,"","歴史","X",8],["金沢市と富山県との境に位置し、スポーツセンター、自然公園、スキー場などがある山は次のうちどれでしょうか。",["奈良岳","大門山","国見山","医王山"],3,"","自然・産業","X",8],["金沢には様々な伝統産業がありますが、中でも「加賀友禅」は、宮崎友禅斎によって作られた日本を代表する友禅染めです。加賀友禅は草花模様を主体にした絵画的な図柄が多く、加賀友禅で用いられる特徴的な技法として「ぼかし」がありますが、病葉の美を表した技法を何というでしょうか。",["青花","地染め","虫食い","友禅流し"],2,"","美術・工芸・芸能","S",8],["加賀藩初代藩主前田利家の時代には、金沢城の中心は本丸にありましたが、1631年（寛永8）の大火災の後は再建されませんでした。その本丸に代わって政治の中心となった御殿はどこにあったでしょうか。",["玉泉院丸","二の丸","三の丸","新丸"],1,"","歴史","S",8],["室町時代には、争いが絶え間なく起こりました。この時代に北陸にやって来た蓮如によって、加賀の農民たちに広まった仏教の宗派は次のうちどれでしょうか。",["浄土真宗","日蓮宗","曹洞宗","臨済宗"],0,"","歴史","S",8],["加賀藩初代藩主前田利家が亡くなると、徳川家康は何かと無理を押しつけてきました。天下を取るために前田家の力をおそれていたからです。そこで、前田家には争いの意思がないことを信用してもらうために、富山城に隠居することで前田家を守った藩主は誰でしょうか。",["前田利長","前田利常","前田綱紀","前田斉広"],0,"","歴史","X",8],["大正時代の終わり頃、金沢の海岸近くに大きなレジャー施設がつくられました。当時の人々が娯楽の場として楽しんだこの施設は何でしょうか。",["金石公園","西部緑地公園","粟崎遊園","日本海遊園"],2,"","歴史","X",8],["武士が活躍した鎌倉時代には、「倶利伽羅の合戦」に代表されるように石川や富山でも源平の戦いがありました。このとき、加賀国の林・富樫・倉光・疋田という武士たちが味方について戦った人物は誰でしょうか。",["平維盛","源頼朝","源義経","源（木曽）義仲"],3,"","歴史","S",8],["金沢市の地形は、東部には医王の山々があり、西部の海岸に向かって丘陵地から平野へと変化し、次第になだらかになっています。市の中心部は、犀川と浅野川が南東方向から北西方向にほぼ並行して流れており、この2つの河川の間は細長く台地がのびています。この犀川と浅野川の間の台地を何というでしょうか。",["小立野台地","寺町台地","長坂台地","卯辰台地"],0,"","自然・産業","X",8],["加賀藩初代藩主前田利家の妻まつ（芳春院）は賢女と言われており、ある戦いの際には「城が落ちたら生きて帰るな」と利家たちを叱咤激励したとされていますが、この戦いを何というでしょうか。",["末森城の戦い","関ヶ原の戦い","豊臣秀吉との戦い","織田信長との戦い"],0,"","歴史","S",8],["金沢には、その名前の由来となっているように、「沢」や「わき水」が多くあり、豊かで清らかな水を生かした様々な伝統産業があります。金沢の伝統産業の中で全国の総生産量の99％を占めているものがありますが、それは何でしょうか。", ["絹織物", "象嵌", "水引き", "金箔"], 3, "（※出題当時の数字。県外で唯一の職人が引退し、今は全国の100パーセントといわれる）", "美術・工芸・芸能", "X", 8],["江戸時代に北前船の立ち寄る港町として栄えた金石は、旧町名の復活を進めています。宮腰出身の豪商の生涯や北前船の歴史を知ることのできる金石地区にある資料館は次のうちどれでしょうか。",["木谷藤右衛門記念館","北前船の里資料館","老舗記念館","銭屋五兵衛記念館"],3,"","寺社・建造物・まち","X",8],["「第2の市民芸術村」として2018年（平成30）5月に金沢市俵町にオープンした創作活動の拠点「俵スタジオ」は、それまであった建物を改築してできた施設です。改築される前は何の建物だったでしょうか。",["工場","美術館","小学校","公民館"],2,"","市政・最近の話題","S",8],["金沢には加賀友禅や加賀蒔絵など、たくさんの伝統工芸があります。加賀藩初代藩主前田利家が金沢城入場後に、加賀藩御料紙（藩主や一族が使う紙）の指定産地になってから飛躍的に発展をとげた和紙を何というでしょうか。",["越前和紙","二俣和紙","能登和紙","金沢和紙"],1,"","美術・工芸・芸能","X",10],["加賀藩3代藩主前田利常の妻は、徳川2代将軍秀忠の娘である珠姫です。珠姫がつくったとされる「紙ひな人形」が所蔵されている、珠姫ゆかりのお寺はどこでしょうか。",["雨宝院","大乗寺","妙立寺","天徳院"],3,"","寺社・建造物・まち","X",10],["高尾城を築いた富樫政親は加賀一国の守護となりました。しかし、その政治に反対した農民や僧たちが中心となって守護富樫政親を倒したことにより、この後、加賀国は何と呼ばれたでしょうか。",["百姓の持ちたる国","僧侶の持ちたる国","町人の持ちたる国","一向宗の国"],0,"","歴史","X",10],["1963年（昭和38）、北陸地方を中心に全国規模で降った大雪は「昭和三八豪雪」と呼ばれ、金沢市民の生活にも大きな被害を与えました。豪雪に名称がつけられたのは気象庁が始まって以来初めてのことであり、金沢気象台では観測史上最大の積雪量を記録しました。この時の金沢での最大積雪は何㎝だったでしょうか。",["91㎝","121㎝","181㎝","251㎝"],2,"","自然・産業","S",10],["1858年（安政5）、凶作により米の値段が上がったことから、生活に苦しむ約2000人の人々が卯辰山から金沢城に向かって「ひもじいわいやー」「米くれまいやー」と叫び苦しさを訴えました。この訴えは何と呼ばれているでしょうか。",["土一揆","世直し一揆","泣き一揆","一向一揆"],2,"","歴史","S",10],["2019年（平成31）4月、雨や雪などの天候に左右されず、年間を通して様々な運動ができる「屋内交流広場」が「金沢プール」の横に建てられました。この施設の愛称はどれでしょうか。",["アンブレーラかなざわ","ウテンケッコー","かなざわっこ広場","あめるんパーク"],3,"","市政・最近の話題","S",10],["金沢市は、緑に恵まれた「森の都」と呼ぶにふさわしいまちですが、近年は人々と森や自然のふれあいが少なくなり、森林が荒れてきてます。そこで市民みんなで森を守り育てる活動をする目的で市が2003年(平成15)につくった条例は何でしょうか。",["金沢市伝統環境保存条例","金沢市自然環境保全条例","金沢市まちづくり条例","金沢市森づくり条例"],3,"","市政・最近の話題","S",10],["金沢市は本州のほぼ中央部にあって、日本海に面しています。金沢市からの直線距離は、大阪市まで約250㎞、札幌市まで約800㎞です。では、首都の東京までは約何㎞でしょうか。",["200㎞","300㎞","450㎞","600㎞"],1,"","自然・産業","S",10],["江戸時代、金沢町の町人のほとんどは（　　）に住んでおり、藩主の土地を使わせてもらっていることから地子銀を納めなくてはなりませんでした。（　　）に入る区分はどれでしょうか。",["本町","七ヶ所","地子町","寺社門前地"],2,"","歴史","S",10],["加賀藩初代藩主前田利家が亡くなると、前田家に対し徳川家康は何かと無理を押しつけてきました。天下を取るために前田家の力をおそれていたからです。そこで、前田家には争いの意思がないことを信用してもらうために、富山城に隠居することで前田家を守ったのは誰でしょう。",["前田利長","前田慶寧","前田綱紀","珠姫"],0,"","歴史","X",10],["2008年（平成20）の大雨は浅野川を氾濫させ、流域では大きな被害がありました。このような局地的な豪雨に対して、金沢市の同報防災無線の音声では住民に届かない所があることがわかったため、市がその対策として孤立するおそれがある山間地の各町会長宅に備えた災害情報伝達システムは何でしょうか。",["雨水情報システム","電光情報表示システム","自主防災組織無線システム","衛星電話システム"],1,"","市政・最近の話題","S",10],["金沢の寺町や泉野がある寺町台地は水を得にくい土地でした。この土地で水田を作るために山中にトンネルを掘ったり、藪を切り開いたりして完成させた用水はどれでしょうか。",["長坂用水","泉用水","大野庄用水","辰巳用水"],0,"","寺社・建造物・まち","X",10],["金沢には様々な伝統産業がありますが、中でも「加賀友禅」は、宮崎友禅斎によって作られた日本を代表する友禅染めです。加賀友禅は草花模様を主体にした絵画的な図柄が多く、加賀友禅で用いられる特徴的な技法として病葉の美を表した「   const bs=catBonus("bousai"),W=IRR.map(e=>{let w=e.w;for(const k in e.b)w+=e.b[k]*owned(k);if(!e.good)w*=(1-bs);return w});
  let x=R()*W.reduce((a,b)=>a+b,0),pick=IRR[0];for(let i=0;i<IRR.length;i++){x-=W[i];if(x<=0){pick=IRR[i];break}}
  r.irr={id:pick.id,done:false,res:""};save();return r.irr}

function ageRank(){const T=totals(),W=AGEG.map(g=>(3+hash(g.id+SEASON_ID)%9)*(.7+(hash(g.id)%60)/100)),WM=AGEG.map(g=>3+hash(g.id+SEASON_ID)%9),sw=W.reduce((a,b)=>a+b,0),sm=WM.reduce((a,b)=>a+b,0);
  // サーバー接続までの仮の内訳：全体の合計（人数・石高）を年代に按分し、合計が必ず一致するようにする
  const R=AGEG.map((g,i)=>({g,m:Math.floor(T.m*WM[i]/sm),koku:Math.floor(T.koku*W[i]/sw)}));const fix=(k,tot)=>{let d=tot-R.reduce((s,x)=>s+x[k],0);R.slice().sort((a,b)=>b[k]-a[k]).forEach(x=>{if(d>0){x[k]++;d--}})};fix("m",T.m);fix("koku",Math.round(T.koku));
  const mine=R.find(x=>x.g.id===ageG(S.age||30).id);R.sort((a,b)=>b.koku-a.koku);
  return R.map((x,i)=>`<div class="rank ${x===mine?"me":""}"><div class="bz">${BANZUKE(i)}</div><div class="name">${x.g.n}<small>（${x.g.y}）${x.g.min}〜${x.g.max<200?x.g.max:""}歳・${x.m}人</small></div><div class="pt">${fmt(x.koku)}石</div></div>`).join("")}

/* ---------- 地図（3Dの斜め俯瞰） ---------- */
// 実際の位置（緯度経度）→ km → 中心部を少し広げる（密集した旧市街を見やすく）→ 斜め俯瞰。市の境界は実データ、校下の範囲は拠点からの推定
const MAPPROJ=(()=>{const la0=KDATA.reduce((a,x)=>a+x.lat,0)/KDATA.length,lo0=KDATA.reduce((a,x)=>a+x.lon,0)/KDATA.length,c=Math.cos(la0*Math.PI/180);
  const km=(lo,la)=>[(lo-lo0)*111.32*c,(la0-la)*110.57];const rmax=Math.max(...KDATA.map(x=>Math.hypot(...km(x.lon,x.lat))));
  const warp=(lo,la)=>{const[dx,dy]=km(lo,la),r=Math.hypot(dx,dy);const k=r?Math.pow(r/rmax,.6)/r:0;return[dx*k,dy*k]};
  const iso=([u,v])=>[u-v,(u+v)/2];const all=CITY.flat().map(([lo,la])=>iso(warp(lo,la)));
  const x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  const sc=Math.min(344/(x1-x0),222/(y1-y0));return(lo,la)=>{const[a,b]=iso(warp(lo,la));return[8+(a-x0)*sc+(344-(x1-x0)*sc)/2,18+(b-y0)*sc]}})();
const MP=(lo,la)=>MAPPROJ(lo,la).map(v=>Math.round(v*10)/10);
const poly=r=>r.map(([lo,la])=>MP(lo,la).join(",")).join(" ");
function isoMap(sel,labels){const rk=ranking(),mx=Math.max(1,...rk.map(x=>x.koku));
  let s=`<svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4a6e"/><stop offset="1" stop-color="#173a58"/></linearGradient></defs><rect width="360" height="260" fill="url(#sea)"/>`;
  s+=`<text x="40" y="40" font-size="10" fill="#8fb9d8" font-family="sans-serif" opacity=".8">日本海</text>`;
  // 市の土台（厚みで立体に）
  CITY.forEach(r=>{s+=`<polygon points="${r.map(([lo,la])=>{const[x,y]=MP(lo,la);return x+","+(y+5)}).join(" ")}" fill="#141a10"/><polygon points="${poly(r)}" fill="#2e3b24" stroke="#5a6a44" stroke-width=".8"/>`});
  // 校下の範囲
  KDATA.forEach(x=>{const r=rk.find(y=>y.k===x.n),me=x.n===sel,a=KAREA[x.n];if(!a)return;
    const share=r.koku/mx,fill=r.m?`hsl(40 ${45+share*25}% ${20+share*38}%)`:"#2e3428";
    RINGS(a).forEach(rg=>{s+=`<polygon points="${poly(rg)}" fill="${fill}" stroke="#0b0e08" stroke-width=".35" stroke-linejoin="round" onclick="mapTap('${x.n}')" style="cursor:pointer"/>`})});
  // 自分の校下のふち
  if(KAREA[sel])RINGS(KAREA[sel]).forEach(rg=>{s+=`<polygon points="${poly(rg)}" fill="none" stroke="#ffd76a" stroke-width="${labels?Math.max(.6,1.6/MZ):1.6}" stroke-linejoin="round" pointer-events="none"/>`})
  // 拠点（学校・公民館）の点と名前
  KDATA.forEach(x=>{const[a,b]=MP(x.lon,x.lat);s+=`<circle cx="${a}" cy="${b}" r="${labels?Math.max(.4,1/MZ):.8}" fill="#fff" opacity=".8" pointer-events="none"/>`;
    if(labels){const r=rk.find(y=>y.k===x.n);s+=`<text x="${a}" y="${b-1.4}" font-size="${Math.max(2.4,4.2/Math.sqrt(MZ))}" text-anchor="middle" fill="#fff" stroke="#000" stroke-width=".45" paint-order="stroke" font-family="sans-serif" font-weight="700" onclick="mapTap('${x.n}')">${x.n}</text>`;
      if(MZ>=2.5)s+=`<text x="${a}" y="${b+3}" font-size="${Math.max(1.8,3/Math.sqrt(MZ))}" text-anchor="middle" fill="#f3dc9a" stroke="#000" stroke-width=".35" paint-order="stroke" font-family="sans-serif" pointer-events="none">${fmt(r.koku)}石</text>`}});
  const me=KDATA.find(x=>x.n===sel);
  if(me){const r=rk.find(y=>y.k===sel),f=labels?Math.max(.3,1/MZ):1,[a,b]=MP(me.lon,me.lat);const lab=`${sel} ${fmt(r.koku)}石`,w=(lab.length*8.4+14)*f,hh=20*f,gap=22*f;
    s+=`<line x1="${a}" y1="${b}" x2="${a}" y2="${b-gap}" stroke="#ffd76a" stroke-width="${1.4*f}"/><g transform="translate(${Math.min(358-w,Math.max(2,a-w/2))} ${Math.max(2,b-gap-hh)}) scale(${f})"><rect width="${w/f}" height="20" rx="10" fill="#1b1711" stroke="#ffd76a"/><text x="${w/f/2}" y="14" font-size="11.5" font-weight="900" text-anchor="middle" fill="#f3dc9a" font-family="sans-serif">${lab}</text></g><circle cx="${a}" cy="${b}" r="${3*f}" fill="#ffd76a"/>`}
  return s+`</svg>`}
let MZ=1;
// 校下の範囲は1つのかたまり、または複数のかたまり（飛び地）
const RINGS=a=>Array.isArray(a[0][0])?a:[a];

function mapZoom(d){const z=$("#mapz"),k0=S.mapSel||S.kouka,cx=(z.scrollLeft+z.clientWidth/2)/z.scrollWidth,cy=(z.scrollTop+z.clientHeight/2)/z.scrollHeight;
  MZ=Math.min(4,Math.max(1,MZ+d*.75));$("#mapin").style.width=MZ*100+"%";$("#mapin").innerHTML=isoMap(k0,true);$("#mzv").textContent=Math.round(MZ*100)+"%";
  z.scrollLeft=cx*z.scrollWidth-z.clientWidth/2;z.scrollTop=cy*z.scrollHeight-z.clientHeight/2}
function mapCenter(k){const z=$("#mapz");if(!z||MZ<=1)return;const x=KDATA.find(y=>y.n===k);if(!x)return;const[a,b]=MP(x.lon,x.lat);z.scrollLeft=a/360*z.scrollWidth-z.clientWidth/2;z.scrollTop=b/260*z.scrollHeight-z.clientHeight/2}
function pinch(el){let d0=0,z0=1;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  el.addEventListener("touchstart",e=>{if(e.touches.length===2){d0=dist(e.touches);z0=MZ}},{passive:true});
  el.addEventListener("touchmove",e=>{if(e.touches.length!==2||!d0)return;e.preventDefault();const r=el.getBoundingClientRect(),mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    const fx=(el.scrollLeft+mx)/el.scrollWidth,fy=(el.scrollTop+my)/el.scrollHeight;MZ=Math.min(4,Math.max(1,z0*dist(e.touches)/d0));$("#mapin").style.width=MZ*100+"%";$("#mzv").textContent=Math.round(MZ*100)+"%";
    el.scrollLeft=fx*el.scrollWidth-mx;el.scrollTop=fy*el.scrollHeight-my},{passive:false});
  el.addEventListener("touchend",()=>{if(d0){$("#mapin").innerHTML=isoMap(S.mapSel||S.kouka,true)}d0=0},{passive:true})}
function mapTap(k){S.mapSel=k;if(MZ<2)MZ=2.5;mapView()}

let J;
function jibu(){abar.className="abar";app.innerHTML=`<div class="card"><div class="gimg"><img src="hyakumangoku_img/thumb_wan.webp" alt="空の治部椀"></div><h2>${IC("jibuni")} 治部煮をつくれ</h2><div class="mute">12の具材から、治部煮に入れる<b>6つ</b>を選んで鍋へ。にせ具材は減点。制限時間${60+(waza("kyoyo",1)?10:0)}秒。</div><div class="notice" style="margin-top:8px">ヒント：鴨肉に粉をまぶして、だしで煮る。仕上げにわさび。</div><button class="pri" style="margin-top:12px" onclick="jibuStart()">スタート</button><button style="width:100%;margin-top:8px" onclick="home()">やめる</button></div>`}

const deck=()=>shuffle([...KAGA.map(v=>({v,ok:true})),...NOTKAGA.map(v=>({v,ok:false}))]);
function kaga(){abar.className="abar";app.innerHTML=`<div class="card"><div class="gimg"><img src="hyakumangoku_img/thumb_yasai.webp" alt="加賀野菜"></div><h2>${IC("yasai_kago")} 加賀野菜 仕分け</h2><div class="mute">出てきた野菜が<b>加賀野菜15品目</b>なら<b>右</b>へ、ちがえば<b>左</b>へスワイプ（ボタンでもOK）。${45+(waza("kyoyo",1)?10:0)}秒で何枚さばける？</div><button class="pri" style="margin-top:12px" onclick="kagaStart()">スタート</button><button style="width:100%;margin-top:8px" onclick="home()">やめる</button></div>`}
function kagaStart(){const T=45+(waza("kyoyo",1)?10:0);K={t:T,ok:0,ng:0,done:false,deck:deck()};
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${IC("yasai_kago")} 仕分け</h2><div class="timer" id="tm">${T}</div></div>

  <div class="row"><button style="flex:1" onclick="kagaJudge(false)">${YA("l")} ちがう</button><button class="gold" style="flex:1" onclick="kagaJudge(true)">加賀野菜 ${YA()}</button></div>
  <div class="mute center" style="margin-top:6px">正解 <b id="kok">0</b> ・ ミス <b id="kng">0</b></div></div>`;

function kagaNext(){if(K.done||!$("#veg"))return;if(!K.deck.length)K.deck=deck();K.cur=K.deck.pop();const v=$("#veg");const [n,ty,c1,c2]=K.cur.v;v.innerHTML=`<div class="vimg">${vegImg(n)||veg(ty,c1,c2)}</div>${n}`;v.style.transition="none";v.style.transform="translateX(-50%)"}
function kagaJudge(right){if(K.done)return;const ok=right===K.cur.ok,f=$("#flash");f.className="flash "+(ok?"ok":"ng");setTimeout(()=>f.className="flash",300);

const FUSHIN_PB=[0,5,7,9,12],FUSHIN_TRIES=4,TYPDAY={quiz:.7,nyukon:.6,game:.6,all:.6};
function stepGain(b){const d=bdef(b.id),lv=b.lv||1;if(!d||lv>=d.lim)return 0;
  if(d.c==="bousai")return .8; // 守りの建物：大雪の被害をへらす分を1日0.8石とみなす
  const f=()=>d.c==="midori"?harvest():catBonus(d.c),a=f();b.lv=lv+1;const z=f();b.lv=lv;
  if(d.c==="midori")return Math.max(0,z-a);
  const base=CATS[d.c].base,day=base==="invite"?inviteReward(S.invites+1)*.1:DAYMAX[base]*(TYPDAY[base]||.6);
  return Math.max(0,(z-a)*day)}
const fushinCost=b=>Math.max(1,Math.round(stepGain(b)*FUSHIN_PB[Math.min(4,b.lv||1)]/FUSHIN_TRIES*disc()*(S.invites>=10?.5:1)*(waza("sanyo",1)?.85:1)*10)/10);

  const c=fushinCost(b);abar.className="abar";
  app.innerHTML=`<div class="card center"><div class="bimg">${pic(b.id)}</div><h2>${IC("fushin")} ${d.n}の普請</h2><div>${stars(b.lv||1,1)}</div><div class="mute">いま ${DAN[b.lv||1]}</div>

  <div class="mute">修練：${m.g}・普請代 ${f1(c)}石・きょうの普請 ${fushinLeftTxt()}</div><div class="mute" style="font-size:12px">次の段で ふつうの日に +${f1(stepGain(b))}石/日（維持費は増えない）</div>
  <button class="pri" style="margin-top:10px" ${S.kura<c||fushinLeft()<=0?"disabled":""} onclick="fushinGo(${i})">${fushinLeft()<=0?"きょうはもう休め（あすまた）":S.kura<c?"蔵の石が足りぬ":"普請をはじめる"}</button>

function yrDraw(){const m=MG,x=m.x,W=m.W,H=m.H;const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#26324a");gr.addColorStop(1,"#3a2a1c");x.fillStyle=gr;x.fillRect(0,0,W,H);

const HANSHU=[null,["利家","としいえ"],["利長","としなが"],["利常","としつね"],["光高","みつたか"],["綱紀","つなのり"],["吉徳","よしのり"],["宗辰","むねとき"],["重煕","しげひろ"],["重靖","しげのぶ"],["重教","しげみち"],["治脩","はるなが"],["斉広","なりなが"],["斉泰","なりやす"]];

const DDK=[
 {id:"heishiro",n:"板屋兵四郎",d:"出陣のたび 兵力+25",w:"辰巳用水をつくった町人"},
 {id:"senso",n:"仙叟宗室",d:"一門・両家・城下町で 倍率+4",w:"利常が茶道を学ぶため招いた茶人"},

function mgDaimyo(){const lv=MG.lv;Object.assign(MG,{stage:0,base:[0,220,260,300,340,380][lv],kas:[],sel:[],picking:false,best:null});
  app.innerHTML=`<div class="card">${mgHead(IC("mondaifuda")+" 大名ドロー",180)}<div class="mute">札の数字は<b>加賀藩の歴代藩主</b>（利家が初代）。手札から<b>5枚まで</b>選んで<b>出陣</b>すると、役に応じた<b>兵力×倍率</b>で攻める。いらない札は<b>捨て札</b>で入れかえ。<br>3つの陣（第一陣・第二陣・本陣）を落とせば勝ち。陣を落とすたびに<b>家臣</b>を1人召しかかえ、強くなる。<br><b>役</b>：一門（同じ代2枚）・両家・三本槍・歴代（代が5つ続く）・同紋（同じ紋5枚）・城下町・四天王・百万石</div>

function ddStage(){const m=MG;m.deck=shuffle(PKS.flatMap((s,si)=>[...Array(13)].map((_,i)=>({r:i+1,s:si,id:si*13+i}))));m.hand=[];m.sel=[];m.score=0;

function ddEval(cs){if(!cs.length)return null;const cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);const grp=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);const v=grp.map(g=>g[1]);
  const five=cs.length===5,fl=five&&cs.every(c=>c.s===cs[0].s),rs=cs.map(c=>c.r).sort((a,b)=>a-b),st=five&&v.length===5&&rs[4]-rs[0]===4;
  let k=0,sc=[];const of=(n)=>cs.filter(c=>c.r===+n);
  if(st&&fl){k=8;sc=cs}else if(v[0]===4){k=7;sc=of(grp[0][0])}else if(v[0]===3&&v[1]===2){k=6;sc=cs}else if(fl){k=5;sc=cs}else if(st){k=4;sc=cs}
  else if(v[0]===3){k=3;sc=of(grp[0][0])}else if(v[0]===2&&v[1]===2){k=2;sc=[...of(grp[0][0]),...of(grp[1][0])]}else if(v[0]===2){k=1;sc=of(grp[0][0])}else{k=0;sc=[cs.reduce((a,b)=>b.r>a.r?b:a)]}
  const y=DDY[k];let chips=y[1]+sc.reduce((s,c)=>s+c.r,0),mult=y[2];const why=[];

function ddDraw(){const m=MG,w=$("#ddW");if(!w)return;const sel=m.hand.filter(c=>m.sel.includes(c.id)),ev=ddEval(sel),pg=Math.min(1,m.score/m.target);

function mgKinmyaku(){const lv=MG.lv,n=[0,6,7,8,8,9][lv],k=[0,5,7,10,12,15][lv];Object.assign(MG,{n,k,gold:null,open:new Set(),flag:new Set(),lost:0,mode:"dig"});

function kmNb(c){const n=MG.n,x=c%n,y=Math.floor(c/n),r=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<n&&b<n)r.push(b*n+a)}return r}
function kmNum(c){return kmNb(c).filter(d=>MG.gold.has(d)).length}
function kmSeed(c){const n=MG.n,ban=new Set([c,...kmNb(c)]),cand=[...Array(n*n).keys()].filter(i=>!ban.has(i));MG.gold=new Set(shuffle(cand).slice(0,MG.k))}
function kmOpen(c){const st=[c];while(st.length){const p=st.pop();if(MG.open.has(p)||MG.flag.has(p))continue;MG.open.add(p);if(kmNum(p)===0)kmNb(p).forEach(d=>{if(!MG.open.has(d)&&!MG.gold.has(d))st.push(d)})}}
function kmTap(c){const m=MG;if(!m||m.ended||m.open.has(c))return;

  if(m.gold.has(c)){m.lost++;m.open.add(c);$("#kmL").textContent=m.lost;toast("砂金を泥ごと流してしもうた！");kmDraw();if(m.lost>=3){const mm=m;return setTimeout(()=>MG===mm&&kmEnd(false),700)}return}
  kmOpen(c);kmDraw();const safe=m.n*m.n-m.k;if([...m.open].filter(p=>!m.gold.has(p)).length>=safe){const mm=m;setTimeout(()=>MG===mm&&kmEnd(true),500)}}
function kmDraw(){const m=MG,n=m.n,C=["","#5ab0ff","#7fd06a","#ff8a7a","#c9a2ff","#ffb05a","#5ad0c8","#f6f0e0","#f6f0e0"];
  $("#kmG").innerHTML=[...Array(n*n).keys()].map(c=>{if(m.open.has(c)){if(m.gold&&m.gold.has(c))return `<button class="kmC lost">×</button>`;const v=kmNum(c);return `<button class="kmC op" style="color:${C[v]}">${v||""}</button>`}
    return `<button class="kmC${m.flag.has(c)?" fl":""}" onclick="kmTap(${c})">${m.flag.has(c)?"金":""}</button>`}).join("")}

  const r=ok?1-m.lost*.2:dug/safe*.6-m.lost*.05;toast(ok?"金脈を掘りあてた！":`掘れたのは ${dug}/${safe} マス`);mgEnd(r)}

const NDK={ana:"落とし穴！ 跳べ",hari:"隠し梁！ 伏せよ",dan:"隠し階段！ 跳べ",teki:"曲者！ 踏むか手裏剣",karasu:"からす！ 伏せるか手裏剣"};

function mgNinjadera(){const lv=MG.lv,W=320,H=210;Object.assign(MG,{W,H,gy:168,px:62,y:0,vy:0,duck:0,life:3,inv:0,star:0,ammo:3,dist:0,goal:[0,5600,6400,7200,8000,8800][lv],

  app.innerHTML=`<div class="card">${mgHead(IC("noroshi")+" からくり忍者寺",90)}<div class="mute">妙立寺は外から見ると2階建て、中は4階建て7層。落とし穴や隠し階段のからくりがあると伝わる。<br><b>跳ぶ</b>：穴・階段・曲者をこえる（曲者は上から踏めば倒せる）<br><b>伏せる</b>：梁やからすをくぐる<br><b>手裏剣</b>：曲者・からすを倒す（数に限りあり）<br>道中の<b>手裏剣・無敵の札・おむすび</b>を拾え。奥で待つ<b>からくり番人</b>を倒せば突破じゃ。</div>
  <div class="yrBar"><span>命 <b id="ndL">3</b>　手裏剣 <b id="ndA">3</b></span><span id="ndPw">奥まで <b id="ndP">0</b>%</span></div>
  <canvas id="ndC" class="mgCv" style="aspect-ratio:${W}/${H}"></canvas>
  <div class="row ndRow"><button class="ndB" id="ndJ">跳ぶ</button><button class="ndB" id="ndS">手裏剣</button><button class="ndB" id="ndD">伏せる</button></div></div>`;
  MG.x=mgCanvas("ndC",W,H);mgBtn("ndJ",ndJump);mgBtn("ndD",ndDuck);mgBtn("ndS",ndShoot);
  const c=$("#ndC");let sx=null,sy=null;c.addEventListener("touchstart",e=>{e.preventDefault();sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:false});
  c.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(sy!==null&&dy>25&&dy>Math.abs(dx))ndDuck();else if(sx!==null&&dx>25)ndShoot();else ndJump();sx=sy=null});c.addEventListener("mousedown",ndJump);
  const m=MG;let last=performance.now();const loop=t=>{if(MG!==m||m.ended)return;const dt=Math.min(40,t-last);last=t;ndStep(dt);if(MG!==m||m.ended)return;ndDraw();m.raf=requestAnimationFrame(loop)};m.raf=requestAnimationFrame(loop);
  mgTimer(90,()=>ndEnd(false))}
function ndJump(){const m=MG;if(!m||m.ended||m.y<0||m.fall)return;m.vy=-.6;m.duck=0}
function ndDuck(){const m=MG;if(!m||m.ended||m.y<0||m.fall)return;m.duck=650}
function ndShoot(){const m=MG;if(!m||m.ended||m.fall||m.ammo<=0||m.cool>0){if(m&&m.ammo<=0){m.msg="手裏剣がない！";m.msgT=600}return}m.ammo--;m.cool=220;
  const top=m.duck>0&&m.y===0;m.shots.push({x:m.px+18,y:m.gy+m.y-(top?9:26),a:0})}
function ndReach(){return .571*MG.sp*1000}
function ndSpawn(){const m=MG,lv=MG.lv;const pool=["ana","ana","hari","dan"];if(lv>=1)pool.push("teki");if(lv>=2)pool.push("karasu","teki");if(lv>=4)pool.push("karasu");
  let t=Math.random()<.16?"item":pool[Math.floor(Math.random()*pool.length)];let w=26,o={t,x:m.W+10,hit:0};
  if(t==="ana"){const big=Math.random()<.3;w=big?Math.min(ndReach()-34,48+lv*16):28+Math.random()*24}
  else if(t==="hari")w=34;else if(t==="dan")w=26;else if(t==="teki"){w=18;o.vx=.04+lv*.012;o.ph=0}
  else if(t==="karasu"){w=22;o.vx=.07+lv*.015;o.yy=m.gy-46;o.ph=Math.random()*6}
  else{const ks=["shu","shu","fuda","musubi"];o.k=ks[Math.floor(Math.random()*ks.length)];if(o.k==="musubi"&&m.life>=3)o.k="shu";o.air=Math.random()<.5;w=16}
  o.w=w;m.obs.push(o);m.nextO=150+Math.random()*160+m.sp*700+w}
function ndBox(o){const g=MG.gy;if(o.t==="teki")return [o.x,g-34,o.w,34];if(o.t==="karasu")return [o.x,o.yy-8,o.w,14];if(o.t==="item")return [o.x,o.air?g-74:g-22,o.w,16];return null}
function ndHitBox(){const m=MG,d=m.duck>0&&m.y===0;return d?[m.px,m.gy-16,22,16]:[m.px+2,m.gy+m.y-42,16,42]}
const ndOv=(a,b)=>a[0]<b[0]+b[2]&&a[0]+a[2]>b[0]&&a[1]<b[1]+b[3]&&a[1]+a[3]>b[1];
function ndStep(dt){const m=MG;if(m.duck>0)m.duck-=dt;if(m.inv>0)m.inv-=dt;if(m.star>0)m.star-=dt;if(m.msgT>0)m.msgT-=dt;if(m.cool>0)m.cool-=dt;
  m.fx.forEach(f=>f.t-=dt);m.fx=m.fx.filter(f=>f.t>0);
  const v=m.boss?0:(m.sp+=dt*.0000025,m.sp*dt);m.dist+=v;m.scroll+=v;
  if(!m.boss){m.nextO-=v;if(m.nextO<=0&&m.dist<m.goal-250)ndSpawn()}
  m.obs.forEach(o=>{o.x-=v;if(o.t==="teki"){o.x-=o.vx*dt;o.ph+=dt*.012}if(o.t==="karasu"){o.x-=o.vx*dt;o.ph+=dt*.006;o.yy=m.gy-44+Math.sin(o.ph)*8}});m.obs=m.obs.filter(o=>o.x+o.w>-30&&!o.dead);
  m.shots.forEach(s=>{s.x+=.5*dt;s.a+=dt*.03});m.eshots.forEach(s=>{s.x-=s.v*dt;s.a+=dt*.02});
  // 手裏剣の当たり
  m.shots.forEach(s=>{const sb=[s.x-5,s.y-5,10,10];m.obs.forEach(o=>{if(o.dead||(o.t!=="teki"&&o.t!=="karasu"))return;if(ndOv(sb,ndBox(o))){o.dead=1;s.done=1;m.kills++;m.fx.push({x:o.x+o.w/2,y:ndBox(o)[1],t:500,s:"討ち取った！"})}});
    if(m.boss&&!s.done&&ndOv(sb,[m.boss.x,m.gy-70,46,70])){s.done=1;m.boss.hp--;m.boss.flash=200;m.fx.push({x:m.boss.x+23,y:m.gy-76,t:450,s:"命中！"});if(m.boss.hp<=0){const mm=m;m.boss.dead=1;setTimeout(()=>MG===mm&&ndEnd(true),700)}}});
  m.shots=m.shots.filter(s=>!s.done&&s.x<m.W+10);m.eshots=m.eshots.filter(s=>!s.done&&s.x>-10);
  if(m.fall){m.fall-=dt;m.y+=dt*.25;if(m.fall<=0){m.fall=0;m.y=0;m.vy=0;m.obs=m.obs.filter(o=>!(o.t==="ana"&&o.x<m.px+40));m.inv=1200}return ndHud()}
  const wasAir=m.y<0;if(m.y<0||m.vy<0){m.vy+=.0021*dt;m.y+=m.vy*dt;if(m.y>=0){m.y=0;m.vy=0}}
  const overPit=m.obs.some(o=>o.t==="ana"&&m.px+6>o.x&&m.px+14<o.x+o.w);
  if(m.y===0&&overPit&&!m.boss){if(m.star>0){/*無敵中は穴の上を駆けぬける*/}else{ndHit("落とし穴に落ちた！");m.fall=600;return}}

    if(o.t==="item"){if(ndOv(pb,ndBox(o))){o.dead=1;if(o.k==="shu")m.ammo+=3;if(o.k==="fuda")m.star=5000;if(o.k==="musubi")m.life=Math.min(3,m.life+1);m.msg=NDI[o.k][0];m.msgT=900}return}
    if(o.t==="teki"){const b=ndBox(o);if(!ndOv(pb,b))return;if(m.vy>0&&m.gy+m.y-8<b[1]+6){o.dead=1;m.kills++;m.vy=-.42;m.fx.push({x:o.x+9,y:b[1],t:500,s:"ふみつけ！"});return}
      if(m.star>0){o.dead=1;m.kills++;return}if(m.inv<=0){o.hit=1;ndHit("曲者にやられた！")}return}
    if(o.t==="karasu"){if(!ndOv(pb,ndBox(o)))return;if(m.star>0){o.dead=1;return}if(m.inv<=0){o.hit=1;ndHit("からすにつつかれた！")}return}
    if(o.x>m.px+18||o.x+o.w<m.px)return;
    if(o.t==="hari"&&m.duck<=0&&m.star<=0&&m.inv<=0){o.hit=1;ndHit("梁に頭をぶつけた！")}
    if(o.t==="dan"&&m.y>-28&&m.star<=0&&m.inv<=0){o.hit=1;ndHit("階段につまずいた！")}});
  m.obs.forEach(o=>{if(!o.warn&&o.x<m.W-20&&NDK[o.t]){o.warn=1;if(!m.seen[o.t]){m.seen[o.t]=1;m.msg=NDK[o.t];m.msgT=1100}}});
  // 番人

  if(m.boss&&!m.boss.dead){const B=m.boss;B.ph+=dt;B.cd-=dt;if(B.flash>0)B.flash-=dt;m.regen+=dt;if(m.regen>2600){m.regen=0;if(m.ammo<5)m.ammo++}
    if(B.cd<=0){const lo=Math.random()<.5;m.eshots.push({x:B.x,y:lo?m.gy-9:m.gy-34,v:.2+MG.lv*.03,a:0,lo});B.cd=Math.max(650,1500-MG.lv*150)*(.75+Math.random()*.5)}
    m.eshots.forEach(s=>{if(ndOv(pb,[s.x-6,s.y-6,12,12])){s.done=1;if(m.star<=0&&m.inv<=0)ndHit(s.lo?"足を払われた！":"頭に当たった！")}})}
  ndHud()}
function ndHit(s){const m=MG;m.life--;m.inv=1300;m.msg=s;m.msgT=1000;if(m.life<=0){const mm=m;setTimeout(()=>MG===mm&&ndEnd(false),400)}}
function ndHud(){const m=MG,l=$("#ndL"),p=$("#ndP"),a=$("#ndA");if(l)l.textContent=Math.max(0,m.life);if(a)a.textContent=m.ammo;if(p)p.textContent=m.boss?"■".repeat(Math.max(0,m.boss.hp)):Math.min(100,Math.floor(m.dist/m.goal*100))}
function ndStar(x,cx,cy,r,a){x.save();x.translate(cx,cy);x.rotate(a);x.fillStyle="#c9d4e0";x.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.35:r,an=i*Math.PI/4;x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}x.fill();x.restore()}
function ndDraw(){const m=MG,x=m.x,W=m.W,H=m.H,gy=m.gy;x.fillStyle=m.boss?"#1f1410":"#2a1f14";x.fillRect(0,0,W,H);

  x.fillStyle="#4a3420";x.fillRect(0,0,W,22);x.fillStyle="#7a5a36";x.fillRect(0,gy,W,H-gy);x.strokeStyle="#5a4028";x.lineWidth=1;const po=m.scroll%40;for(let i=-1;i<10;i++){x.beginPath();x.moveTo(i*40-po,gy);x.lineTo(i*40-po,H);x.stroke()}

function mgGyoretsu(){const lv=MG.lv,G=[0,12,12,13,13,14][lv],W=320;Object.assign(MG,{G,W,cs:W/G,tick:[0,240,215,190,170,150][lv],goal:[0,10,12,14,16,18][lv],

  const n=lv>=3?(lv-2)*3:0;for(let i=0;i<n;i++){const r=[2+Math.floor(Math.random()*(G-4)),1+Math.floor(Math.random()*(G-2))];if(r[1]!==Math.floor(G/2))MG.rocks.push(r)}
  gyFood();

  <div class="yrBar"><span>お供 <b id="gyN">0</b>人</span><span>めざせ ${MG.goal}人</span></div>
  <canvas id="gyC" class="mgCv" style="aspect-ratio:1/1"></canvas>
  <div class="gyPad"><button id="gyU">↑</button><button id="gyL">←</button><button id="gyR">→</button><button id="gyD">↓</button></div></div>`;
  MG.x=mgCanvas("gyC",W,W);[["gyU",[0,-1]],["gyD",[0,1]],["gyL",[-1,0]],["gyR",[1,0]]].forEach(([id,d])=>mgBtn(id,()=>gyTurn(d)));
  const c=$("#gyC");let s=null;c.addEventListener("touchstart",e=>{e.preventDefault();s=[e.touches[0].clientX,e.touches[0].clientY]},{passive:false});
  c.addEventListener("touchmove",e=>{if(!s)return;e.preventDefault();const t=e.touches[0],dx=t.clientX-s[0],dy=t.clientY-s[1];if(Math.abs(dx)+Math.abs(dy)<22)return;gyTurn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);s=[t.clientX,t.clientY]},{passive:false});
  const m=MG;let last=performance.now();const loop=t=>{if(MG!==m||m.ended)return;m.acc+=Math.min(60,t-last);last=t;while(m.acc>=m.tick&&!m.ended){m.acc-=m.tick;gyStep()}if(MG!==m||m.ended)return;gyDraw();m.raf=requestAnimationFrame(loop)};m.raf=requestAnimationFrame(loop);

function gyTurn(d){const m=MG;if(!m||m.ended)return;if(d[0]===-m.dir[0]&&d[1]===-m.dir[1])return;m.nd=d}
function gyFree(){const m=MG;for(let k=0;k<200;k++){const p=[Math.floor(Math.random()*m.G),Math.floor(Math.random()*m.G)];if(!m.body.some(b=>b[0]===p[0]&&b[1]===p[1])&&!m.rocks.some(r=>r[0]===p[0]&&r[1]===p[1])&&!(m.food&&m.food[0]===p[0]&&m.food[1]===p[1]))return p}return [0,0]}

function gyStep(){const m=MG;m.dir=m.nd;const h=m.body[0],nh=[h[0]+m.dir[0],h[1]+m.dir[1]];
  if(nh[0]<0||nh[1]<0||nh[0]>=m.G||nh[1]>=m.G||m.rocks.some(r=>r[0]===nh[0]&&r[1]===nh[1])||m.body.slice(0,-1).some(b=>b[0]===nh[0]&&b[1]===nh[1])){toast("行列が止まってしもうた！");return gyEnd(true)}
  m.body.unshift(nh);let grow=0;
  if(nh[0]===m.food[0]&&nh[1]===m.food[1]){m.got++;grow=1;gyFood();if(!m.gold&&Math.random()<.25)m.gold={p:gyFree(),t:Date.now()}}
  if(m.gold&&nh[0]===m.gold.p[0]&&nh[1]===m.gold.p[1]){m.got+=3;grow=3;m.gold=null;toast("千両箱！ お供が3人ふえた")}
  if(m.gold&&Date.now()-m.gold.t>5000)m.gold=null;

function geoDraw(hl,ans){const b=MG.b,lv=MG.lv,P=rg=>rg.map(([lo,la])=>geoXY(b,lo,la).map(v=>v.toFixed(1)).join(",")).join(" "),q=MG.qs[MG.r]||{};
  const showB=lv<=4,lab=lv<=2;let s=`<svg viewBox="0 0 ${b.W} ${b.H}" class="geoS" id="geoS" onclick="geoTap(event)"><rect width="${b.W}" height="${b.H}" fill="#18261a"/>`;
  Object.entries(KAREA).forEach(([n,a])=>RINGS(a).forEach(rg=>{s+=`<polygon points="${P(rg)}" fill="${n===hl?"#d8b04a":"#3a5a2a"}" stroke="${showB?"#1b2a1a":"#3a5a2a"}" stroke-width="${showB?.5:0}"/>`}));
  if(lab)KDATA.forEach(x=>{if(q.t==="k"&&x.n===q.n&&!ans)return;const[X,Y]=geoXY(b,x.lon,x.lat);s+=`<text x="${X.toFixed(1)}" y="${Y.toFixed(1)}" font-size="3.2" fill="#cfe0b0" text-anchor="middle">${x.n}</text>`});
  // 目安の線（段が上がると減る）
  GEOLINE.forEach(L=>{if(lv>L.lv)return;const pts=L.p.map(([lo,la])=>geoXY(b,lo,la).map(v=>v.toFixed(1)).join(",")).join(" ");s+=`<polyline points="${pts}" fill="none" stroke="${L.c}" stroke-width="${L.w}" ${L.dash?`stroke-dasharray="${L.dash}"`:""} stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
    const k=Math.floor(L.p.length/2),[X,Y]=geoXY(b,L.p[k][0],L.p[k][1]);s+=`<text x="${(X+2).toFixed(1)}" y="${(Y-1.5).toFixed(1)}" font-size="3.4" font-weight="700" fill="${L.c}" stroke="#000" stroke-width=".3" paint-order="stroke">${L.n}</text>`});
  // 名所の目印（たずねられている名所は隠す）
  MEISHO.forEach(m=>{if(q.t==="m"&&q.n===m[0]&&!ans)return;if(lv>=4&&!(ans&&q.n===m[0])&&MEISHO.indexOf(m)%2)return;const[X,Y]=geoXY(b,m[1],m[2]);const hit=ans&&q.n===m[0];
    s+=`<rect x="${(X-1.6).toFixed(1)}" y="${(Y-1.6).toFixed(1)}" width="3.2" height="3.2" transform="rotate(45 ${X.toFixed(1)} ${Y.toFixed(1)})" fill="${hit?"#ff6a5c":"#f3dc9a"}" stroke="#000" stroke-width=".3"/><text x="${(X+2.4).toFixed(1)}" y="${(Y+1.2).toFixed(1)}" font-size="${hit?4.2:3.4}" font-weight="700" fill="${hit?"#ff6a5c":"#f3dc9a"}" stroke="#000" stroke-width=".25" paint-order="stroke">${m[0]}</text>`});
  s+=`<g id="geoMk"></g></svg>`;$("#geoIn").innerHTML=s}
function geoZoom(d,center){const z=$("#geoZ");if(!z)return;const cx=center?null:(z.scrollLeft+z.clientWidth/2)/z.scrollWidth,cy=center?null:(z.scrollTop+z.clientHeight/2)/z.scrollHeight;
  MG.z=Math.min(6,Math.max(1,MG.z+d*.75));$("#geoIn").style.width=MG.z*100+"%";$("#gzv").textContent=Math.round(MG.z*100)+"%";
  if(center){const b=MG.b,[X,Y]=geoXY(b,136.6545,36.5655);z.scrollLeft=X/b.W*z.scrollWidth-z.clientWidth/2;z.scrollTop=Y/b.H*z.scrollHeight-z.clientHeight/2}else{z.scrollLeft=cx*z.scrollWidth-z.clientWidth/2;z.scrollTop=cy*z.scrollHeight-z.clientHeight/2}}
function geoPinch(el){let d0=0,z0=1;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);

    const fx=(el.scrollLeft+mx)/el.scrollWidth,fy=(el.scrollTop+my)/el.scrollHeight;MG.z=Math.min(6,Math.max(1,z0*dist(e.touches)/d0));$("#geoIn").style.width=MG.z*100+"%";$("#gzv").textContent=Math.round(MG.z*100)+"%";el.scrollLeft=fx*el.scrollWidth-mx;el.scrollTop=fy*el.scrollHeight-my},{passive:false});
  el.addEventListener("touchend",()=>{d0=0},{passive:true})}
function geoAsk(){MG.lock=false;const q=MG.qs[MG.r];$("#geoQ").innerHTML=`第${MG.r+1}問：「<b>${q.t==="k"?q.n+"校下":q.n}</b>は、どこにあるかの？」`}
function geoTap(ev){if(!MG||MG.lock)return;const sv=$("#geoS"),r=sv.getBoundingClientRect(),b=MG.b,x=(ev.clientX-r.left)/r.width*b.W,y=(ev.clientY-r.top)/r.height*b.H;
  const lo=b.x0+x/b.W*(b.x1-b.x0),la=b.y1-y/b.H*(b.y1-b.y0),q=MG.qs[MG.r];MG.lock=true;const km=(a,c)=>Math.hypot((a-lo)*111*b.c,(c-la)*111);let pt,d,msg;
  if(q.t==="k"){const rings=RINGS(KAREA[q.n]),inside=rings.some(rg=>geoIn([lo,la],rg));d=inside?0:Math.min(...rings.flat().map(([a,c])=>km(a,c)));const tol=Math.max(1,2.6-MG.lv*.3);pt=inside?1:Math.max(0,1-d/tol);
    msg=inside?`${IC("maru")} 見事、そこが<b>${q.n}校下</b>じゃ！`:`${q.n}校下は金色の所。あと <b>${d.toFixed(1)}km</b> じゃった。`;geoDraw(q.n,1)}
  else{d=km(q.m[1],q.m[2]);const ok=Math.max(.15,.4-MG.lv*.05),tol=Math.max(.8,2-MG.lv*.25);pt=d<=ok?1:Math.max(0,1-(d-ok)/tol);
    msg=`${d<=ok?IC("maru")+" 見事！ ":""}<b>${q.n}</b>はここ（赤い印）。${d<=ok?"":`あと <b>${d.toFixed(1)}km</b>。`}<br><small>${q.m[3]}</small>`;geoDraw(null,1)}
  MG.sc+=pt;$("#geoN").textContent=MG.sc.toFixed(1);$("#geoMk").innerHTML=`<circle cx="${x}" cy="${y}" r="2.6" fill="#4fa3e0" stroke="#fff" stroke-width=".8"/>`;$("#geoQ").innerHTML=msg;
  MG.r++;const m=MG;if(MG.r>=MG.R)return setTimeout(()=>MG===m&&mgEnd(MG.sc/MG.R),2200);setTimeout(()=>{if(MG!==m)return;geoDraw();geoAsk()},2400)}

/* --- 小学校：算術（太閤立志伝Vの算術にならう。数の札を□に入れて式を正しくする） --- */
const SN_PAT=[null,[["+"]],[["+","-"],["-","+"]],[["×","-"],["+","×"],["×","+"]],[["÷","-"],["÷","+"],["×","-"],["-","÷"]],[["×","-","+"],["÷","+","-"],["+","×","-"],["×","÷","+"]]];
const snVal=(d,o)=>{try{const v=Function("return "+d.map((x,i)=>x+(o[i]?({"+":"+","-":"-","×":"*","÷":"/"})[o[i]]:"")).join(""))();return v}catch(e){return NaN}};
// 漢数字（0〜99）。寺子屋らしく、二の段からは答えを漢数字で示す
const kanNum=n=>{const K="〇一二三四五六七八九";if(n<10)return K[n];const t=Math.floor(n/10),o=n%10;return (t>1?K[t]:"")+"十"+(o?K[o]:"")};
function mgSan(){MG.ok=0;MG.goal=5;
  app.innerHTML=`<div class="card">${mgHead(IC("soroban")+" 算術",50)}<div class="mute">下の数の札を□に入れて、式を正しくせよ（同じ札は1度だけ）。かけ算・わり算が先じゃ。${MG.lv>=2?"答えは漢数字で示す。":""}</div><div class="snEq" id="snEq"></div><div class="snG" id="snG"></div><button style="width:100%" onclick="snBack()">1つもどす</button><div class="mute center" style="margin-top:6px">解いた数 <b id="snN">0</b> / ${MG.goal}</div></div>`;
  snNew();mgTimer(50,()=>mgEnd(MG.ok/MG.goal))}
function snNew(){const pats=SN_PAT[MG.lv];let o,d,v,t=0;
  do{o=pats[Math.floor(Math.random()*pats.length)];d=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,o.length+1);v=snVal(d,o);t++}while((!Number.isInteger(v)||v<1||v>19)&&t<3000);
  MG.o=o;MG.ans=v;MG.in=[];snDraw()}
function snDraw(){const n=MG.o.length+1;let h="";for(let i=0;i<n;i++){h+=`<span class="snBox ${MG.in[i]?"on":""}">${MG.in[i]||""}</span>`;if(i<n-1)h+=`<span class="snOp">${MG.o[i]}</span>`}
  $("#snEq").innerHTML=h+`<span class="snOp">＝</span><span class="snAns">${MG.lv>=2?kanNum(MG.ans):MG.ans}</span>`;
  $("#snG").innerHTML=[7,8,9,4,5,6,1,2,3].map(k=>`<button class="snK" ${MG.in.includes(k)?"disabled":""} onclick="snTap(${k})">${k}</button>`).join("")}
function snTap(k){if(!MG||MG.in.includes(k))return;MG.in.push(k);snDraw();if(MG.in.length<MG.o.length+1)return;
  if(Math.abs(snVal(MG.in,MG.o)-MG.ans)<1e-9){MG.ok++;$("#snN").textContent=MG.ok;toast("よし！");if(MG.ok>=MG.goal)return mgEnd(1);{const m=MG;setTimeout(()=>MG===m&&snNew(),250)}}
  else{$("#snEq").classList.add("ng");{const m=MG;setTimeout(()=>{if(MG!==m)return;$("#snEq").classList.remove("ng");MG.in=[];snDraw()},450)}}}

/* --- 辰巳用水：新田ひらき（太閤立志伝IVの新田開発にならう。一筆書きで田を開く） --- */
function mgShinden(){const lv=MG.lv,n=[0,6,6,7,7,8][lv],k=[0,4,5,7,8,10][lv];MG.n=n;const edge=[...Array(n*n).keys()].filter(c=>c<n||c>=n*(n-1)||c%n===0||c%n===n-1);const S0=edge[Math.floor(Math.random()*edge.length)];MG.s0=S0;MG.back=2;
  let best=null;for(let tr=0;tr<30;tr++){const rock=new Set(shuffle([...Array(n*n).keys()].filter(c=>c!==S0)).slice(0,k));
    const walk=[S0],seen=new Set([S0]);const nb=c=>{const r=Math.floor(c/n),q=c%n;return [[r-1,q],[r+1,q],[r,q-1],[r,q+1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n).map(([a,b])=>a*n+b).filter(x=>!rock.has(x)&&!seen.has(x))};
    while(true){const opts=nb(walk[walk.length-1]);if(!opts.length)break;const deg=opts.map(o=>nb(o).length);const m=Math.min(...deg);const pick=shuffle(opts.filter((o,i)=>deg[i]===m))[0];walk.push(pick);seen.add(pick)}
    if(!best||walk.length>best.walk.length)best={walk,seen};if(walk.length===n*n-k)break}
  MG.free=new Set(best.walk);MG.path=[S0];
  app.innerHTML=`<div class="card">${mgHead(IC("ineho")+" 新田ひらき",45)}<div class="mute">辰巳用水の水で新田をひらけ。となりのマスをタップして進み、<b>一筆書き</b>でできるだけ多く耕せ。水口（<b>水</b>）から始まり、同じマスは通れぬ・岩はよけよ。行きづまったら<b>2回まで引き返せる</b>。</div><div class="sdG" id="sdG" style="grid-template-columns:repeat(${n},1fr)"></div><div class="row"><button style="flex:1" id="sdBk" onclick="sdBack()">引き返す（あと2）</button><button style="flex:1" onclick="sdReset()">はじめから</button><button class="gold" style="flex:1" onclick="sdEnd()">終える</button></div><div class="mute center" style="margin-top:6px">耕した <b id="sdN">1</b> / ${MG.free.size}</div></div>`;
  sdDraw();mgTimer(45,sdEnd)}
function sdNext(){const n=MG.n,c=MG.path[MG.path.length-1],r=Math.floor(c/n),q=c%n;return [[r-1,q],[r+1,q],[r,q-1],[r,q+1]].filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n).map(([a,b])=>a*n+b).filter(x=>MG.free.has(x)&&!MG.path.includes(x))}
function sdDraw(){const n=MG.n,cur=MG.path[MG.path.length-1],nx=sdNext();
  $("#sdG").innerHTML=[...Array(n*n).keys()].map(k=>{const cls=!MG.free.has(k)?"rock":k===cur?"cur":MG.path.includes(k)?"done":nx.includes(k)?"can":"";return `<button class="sdC ${cls}" onclick="sdTap(${k})">${!MG.free.has(k)?IC("ishigaki","22px"):k===cur?IC("ineho","22px"):k===MG.s0?'<b class="sdW">水</b>':""}</button>`}).join("");{const bk=$("#sdBk");if(bk){bk.textContent=`引き返す（あと${MG.back}）`;bk.disabled=!MG.back||MG.path.length<2}}
  $("#sdN").textContent=MG.path.length;if(!nx.length&&!(MG.back&&MG.path.length>1)){const m=MG;setTimeout(()=>MG===m&&sdEnd(),350)}}

/* --- ひがし茶屋街：茶器の目利き（太閤立志伝の茶道にならう。見せた茶碗の順をおぼえて並べる） --- */

function mgChaki(){const lv=MG.lv;MG.L=[0,3,3,4,4,5][lv];MG.K=Math.min(7,MG.L+[0,1,2,2,3,2][lv]);MG.R=4;MG.r=0;MG.hit=0;
  app.innerHTML=`<div class="card">${mgHead(IC("ougi")+" 茶器の目利き",70)}<div class="mute">${MG.lv>=3?"棚に出た<b>茶碗の名</b>と順番をおぼえよ。消えたら、名のない茶碗の中から、見た目で見分けて同じ順に選べ":"棚に出た茶碗の<b>順番</b>をおぼえよ。消えたら、下の茶碗を同じ順に選べ"}（${MG.R}席）。</div><div class="mute center" id="ckM"></div><div class="ckShelf" id="ckS"></div><div class="ckRow" id="ckR"></div><div class="mute center">見きわめた <b id="ckN">0</b> / ${MG.R*MG.L}</div></div>`;

function ckRound(){if(!MG)return;const pool=shuffle([...CHAKI.keys()]).slice(0,MG.K);MG.seq=shuffle(pool).slice(0,MG.L);MG.row=shuffle(pool);MG.ci=0;MG.lock=true;

  if(MG.seq[MG.ci]===i){sl[MG.ci].classList.remove("q");sl[MG.ci].innerHTML=`${chawan(i,48)}<small>${CHAKI[i][0]}</small>`;MG.ci++;MG.hit++;$("#ckN").textContent=MG.hit}

  if(MG.ci>=MG.L){MG.lock=true;MG.r++;{const m=MG;if(MG.r>=MG.R)return setTimeout(()=>MG===m&&mgEnd(MG.hit/(MG.R*MG.L)),600);setTimeout(()=>MG===m&&ckRound(),900)}}}

/* --- 兼六園：庭石はこび（太閤立志伝IVの石運搬を下じきに、天秤の左右を釣り合わせる形に変えたもの） --- */
function mgIshihakobi(){const lv=MG.lv;MG.T=Math.round((1800+Math.random()*1400)/50)*50;MG.nomi=3;MG.mode=0;MG.side="L";MG.tol=1-.1*(lv-1);

  MG.st=shuffle([...[...Array(4)].map(()=>mk(600,900,3)),...[...Array(4)].map(()=>mk(250,450,2)),...[...Array(4)].map(()=>mk(60,160,1))]);
  app.innerHTML=`<div class="card">${mgHead(IC("ishigaki")+" 庭石はこび",50)}<div class="mute">庭石を天秤の<b>左右の皿</b>に分けてのせ、<b>ぴたりと釣り合わせよ</b>。ただし両方あわせて <b>${fmt(MG.T)}貫</b> 以上。石の目方は、のせるまで分からぬ。「のみ」で石を少し削れる。</div>
  <div class="ihTop"><div>左 <b id="ihL">0</b> 貫</div><div class="mute" id="ihSum"></div><div>右 <b id="ihR">0</b> 貫</div></div>
  <div class="ihBal"><div class="ihBeam" id="ihBeam"><div class="ihPan2" id="ihPL"></div><div class="ihPan2" id="ihPR"></div></div><div class="ihPost"></div></div>
  <div class="row" style="margin:6px 0"><span class="mute" style="align-self:center">のせる皿：</span><button class="ihSd" id="sdL" onclick="ihSide('L')">左</button><button class="ihSd" id="sdR" onclick="ihSide('R')">右</button></div>
  <div class="ihYard" id="ihY"></div>

  ihDraw();mgTimer(50,ihEnd)}
const ihStone=(s,pan)=>`<svg viewBox="0 0 100 80" width="${(pan?[0,16,22,30]:[0,30,42,56])[s.sz]}"><path d="M8 60 Q4 30 30 18 Q52 6 74 16 Q96 28 92 56 Q88 74 50 76 Q14 76 8 60Z" fill="#8c8a86"/><path d="M20 40 Q30 24 50 20 Q66 18 76 26" stroke="#c9c7c2" stroke-width="5" fill="none" opacity=".7"/><path d="M14 62 Q40 72 86 58" stroke="#5c5a56" stroke-width="5" fill="none"/></svg>`;
function ihDraw(){const L=MG.st.filter(s=>s.on==="L").reduce((a,s)=>a+s.w,0),R=MG.st.filter(s=>s.on==="R").reduce((a,s)=>a+s.w,0);MG.L=L;MG.R=R;
  $("#ihL").textContent=fmt(L);$("#ihR").textContent=fmt(R);const sum=L+R;$("#ihSum").innerHTML=`合計 ${fmt(sum)}${sum>=MG.T?" ✓":` / ${fmt(MG.T)}`}`;
  const ang=Math.max(-6,Math.min(6,(L-R)/Math.max(600,MG.T/2)*6));$("#ihBeam").style.transform=`rotate(${-ang}deg)`;
  const pan=sd=>MG.st.map((s,k)=>s.on===sd?`<button class="ihB on ${MG.mode?"nomi":""}" onclick="ihTap(${k})">${ihStone(s,1)}</button>`:"").join("");
  $("#ihPL").innerHTML=pan("L");$("#ihPR").innerHTML=pan("R");

  let last=-4000;const ev=src.map((x,k)=>{if(x.yr!=null)last=x.yr;return {x,y:x.yr!=null?x.yr:last,k}});
  const used=new Set(),items=[];
  ev.forEach(o=>{const qs=(o.x.q||[]).filter(i=>QB[i]&&!QB[i].dup&&!used.has(i));qs.forEach(i=>used.add(i));
    items.push({y:o.y,k:o.k,j:0,sq:Object.assign({},o.x,{q:qs.slice(0,1),src:o.x})});
    qs.slice(1).forEach((i,j)=>items.push({y:o.y,k:o.k,j:j+1,sq:{e:o.x.e,y:o.x.y,t:o.x.t+"の問い",d:o.x.d,q:[i],yr:o.y}}))});
  QB.forEach((q,i)=>{if(used.has(i)||!q||q.dup||!["歴史","偉人・人物"].includes(q.g))return;const txt=sgStrip(q.q+" "+q.e);let y=null,lab="";
    const m=txt.match(/(\d{3,4})年/g);if(m)for(const t of m){const v=parseInt(t);if(v>=500&&v<=2025){y=v;lab=v+"年";break}}
    if(y==null){const kw=SG_KW.find(k=>k[0].test(txt));if(kw){y=kw[1];lab=kw[2]}}if(y==null)return;
    let best=ev[0];ev.forEach(o=>{if(o.y<=y&&o.y>=best.y)best=o});used.add(i);
    items.push({y,k:best.k,j:100+i,sq:{e:best.x.e,y:lab,t:q.g==="偉人・人物"?"人物の問い":"歴史の問い",d:`${lab}の金沢。この時代の問題に挑もう。`,q:[i],yr:y}})});
  items.sort((p,q)=>p.y-q.y||p.k-q.k||p.j-q.j);

function kzEnOf(id,ids){const r=[];for(const [a,b,t,w] of KZ_EN){if(a!==id&&b!==id)continue;const o=a===id?b:a;if(ids.includes(o))r.push({t,w,with:[o]})}

function kzSt(){if(!S.kz)S.kz={own:{},tix:0,deck:[],x:"",clear:0,free:"",starter:false,quiz:{}};const z=S.kz;
  for(const k in z.own){if(!KZM[k]){delete z.own[k];continue}const o=z.own[k];if(o.w==null)o.w=Math.max(0,(o.n||1)-1)}

function kzStarW(w){let s=1;for(let i=2;i<=5;i++)if(w>=KZ_STAR[i])s=i;return s}

function kzStats(id,star,gold){const c=KZM[id],g=1+KZ_GROW*((star||1)-1),m=g*(gold?1.05:1);return {hp:Math.round(c.hp*m),atk:Math.round(c.atk*m),spd:Math.round(c.spd*g)}}

function kzSide(ids,x,starOf,goldOf,noen){const all=[...ids,...(x?[x]:[])],su=x?KZM[x]:null,sv=su?kzSuV(su):0,k=su?su.su:"";
  const S={f:[],a:0,x,k,sv,guts:k==="guts"?sv/100:0,gutsUsed:false,cure:k==="cure"?sv:0,def:k==="def"?sv/100:0,regen:k==="regen"?sv/100:0,relay:k==="relay"?sv:0,adv:k==="adv"?sv:1.3,dis:k==="disadv"?sv:.75,exp:k==="exp"?sv:0,gold:k==="gold"?sv:0};
  ids.forEach(id=>{const c=KZM[id],st=starOf(id),s=kzStats(id,st,goldOf(id)),en=noen?[]:kzEnOf(id,all).slice(0,2);
    let hp=s.hp*(1+(k==="hp"?sv/100:0)),atk=s.atk*(1+(k==="atk"?sv/100:0)),spd=s.spd+(k==="spd"?sv:0),ki=st+(k==="kiup"?sv:0),crit=spd/200+(k==="crit"?sv/100:0),skp=1+(k==="skp"?sv/100:0);
    en.forEach(e=>{if(e.t==="家族")hp*=1.1;if(e.t==="師弟")atk*=1.1;if(e.t==="主従")ki++;if(e.t==="仲間")spd+=3;if(e.t==="宿敵")crit+=.05;if(e.t==="組"){hp*=1.08;atk*=1.08}});
    hp=Math.round(hp);S.f.push({id,c,star:st,max:hp,hp,atk:Math.round(atk),spd,ki:Math.min(5,ki),crit:Math.min(.5,crit+(spd-s.spd)/200),skp,en,buf:0,bufv:0,sh:0,shv:0,po:0,pov:0,stun:0,seal:0,dn:0,dnv:0,cnt:0})});
  S.spd=S.f.reduce((a,f)=>a+f.spd,0)+(su?su.spd:0);return S}
function kzNewB(A,Bd,rnd){rnd=rnd||Math.random;const s0=kzSide(A.d,A.x,A.star,A.gold,A.noen),s1=kzSide(Bd.d,Bd.x,Bd.star,Bd.gold,Bd.noen);
  if(s1.k==="kidown")s0.f.forEach(f=>f.ki=Math.max(0,f.ki-s1.sv));if(s0.k==="kidown")s1.f.forEach(f=>f.ki=Math.max(0,f.ki-s0.sv));
  const first=s0.spd>s1.spd?0:s1.spd>s0.spd?1:(rnd()<.5?0:1),g=[s0,s1][1-first].f[0];if(KZ_GOTE){g.sh=1;g.shv=KZ_GOTE}return {s:[s0,s1],turn:first,first,over:false,win:-1,pick:-1,rnd,ev:[],n:0}}
const kzCur=(B,i)=>B.s[i].f[B.s[i].a];
function kzMod(a,d){return KZ_BEAT[a]===d?1.3:KZ_BEAT[d]===a?.75:1}
function kzE(B,e){B.ev.push(e)}
function kzHurt(B,di,t,d){const D=B.s[di];if(t.hp-d<=0&&D.guts&&!D.gutsUsed&&t===kzCur(B,di)&&B.rnd()<D.guts){D.gutsUsed=true;d=t.hp-1;kzE(B,{k:"log",t:`${t.c.n}は体力1でふみとどまった！`})}t.hp=Math.max(0,t.hp-d);return d}
function kzHit(B,ai,di,t,m,o={}){const A=B.s[ai],D=B.s[di],a=kzCur(B,ai),r=B.rnd;let mod=kzMod(a.c.el,t.c.el);mod=mod>1?A.adv:mod<1?(o.noBad?1:A.dis):1;
  const ev=Math.min(KZ_EVMAX,Math.max(0,(t.spd-a.spd)*KZ_EV));if(!o.crit&&r()<ev){kzE(B,{k:"dmg",side:di,id:t.id,v:0,miss:1});kzE(B,{k:"log",t:`${t.c.n}は身軽にかわした！`});return {d:0,crit:false,mod}}
  const crit=o.crit||r()<a.crit,cm=o.crit?o.cm:1.5;
  let d=a.atk*m*mod*(1+(a.buf>0?a.bufv:0))*(1-(a.dn>0?a.dnv:0))*(.9+r()*.2)*(crit?cm:1)*(1-D.def);
  if(t.sh>0){d*=1-t.shv;t.sh--}let back=0;if(t.cnt>0){back=Math.round(d*t.cnt);d*=1-t.cnt;t.cnt=0}
  d=Math.max(back&&d<1?0:1,Math.round(d));d=kzHurt(B,di,t,d);kzE(B,{k:"dmg",side:di,id:t.id,v:d,crit,mod});
  if(back>0){a.hp=Math.max(0,a.hp-back);kzE(B,{k:"dmg",side:ai,id:a.id,v:back,back:1});kzE(B,{k:"log",t:`迎撃！ ${back}をはね返された`})}return {d,crit,mod}}
function kzCure(B,di){const D=B.s[di];if(D.cure>0){D.cure--;kzE(B,{k:"log",t:"補佐の力でふせいだ！"});return true}return false}
function kzSkill(B,ai,di){const A=B.s[ai],D=B.s[di],a=kzCur(B,ai),t=kzCur(B,di),c=a.c,v=KZ_SK[c.sk].v[c.tr],p=a.skp;kzE(B,{k:"sk",side:ai,n:c.sk,id:a.id});
  switch(c.sk){
   case"強襲":kzHit(B,ai,di,t,v*p);break;
   case"連撃":kzHit(B,ai,di,t,v*p);if(t.hp>0)kzHit(B,ai,di,t,v*p);break;
   case"治療":{const h=Math.round(a.max*v*p);a.hp=Math.min(a.max,a.hp+h);kzE(B,{k:"heal",side:ai,id:a.id,v:h});break}
   case"鼓舞":kzHit(B,ai,di,t,p);A.f.forEach(f=>{if(f.hp>0){f.buf=3;f.bufv=v*p}});kzE(B,{k:"log",t:"味方3枚の攻撃が上がった！"});break;

   case"火計":kzHit(B,ai,di,t,1*p);if(t.hp>0&&!kzCure(B,di)){t.po=3;t.pov=v*p;kzE(B,{k:"log",t:"火の手が上がった"})}break;

function kzCanSk(f){return f.c.sk&&f.ki>=5&&!f.seal}
function kzBest(B,i){const S=B.s[i],o=kzCur(B,1-i);let best=-1,sc=-1e9;S.f.forEach((f,k)=>{if(f.hp<=0)return;const m=o&&o.hp>0?kzMod(f.c.el,o.c.el)-kzMod(o.c.el,f.c.el):0;const s=m*100+f.hp/f.max*30+f.atk;if(s>sc){sc=s;best=k}});return best}
function kzKOcheck(B,me){// 倒れた札の処理。return true=決着

  if(a.po>0){const d=Math.max(1,Math.round(a.max*a.pov));kzHurt(B,i,a,d);a.po--;kzE(B,{k:"dmg",side:i,id:a.id,v:d,fire:1});kzE(B,{k:"log",t:`${a.c.n}は火計で${d}削られた`});if(a.hp<=0){if(kzKOcheck(B,1-i))return}}}

let KB=null;
function kzFight(i){const z=kzSt(),s=KZ_DOJO[i];
  KB=kzNewB({d:z.deck,x:z.x,star:id=>kzStar(id),gold:id=>!!z.own[id].gold},{d:s.d,x:s.x,star:()=>s.s,gold:()=>false});KB.human=true;KB.stage=i;KB.log=[];KB.busy=false;
  kzLog(`${s.n}との勝負！ 速さ ${KB.s[0].spd} 対 ${KB.s[1].spd}、${KB.first===0?"こちらが先手":"相手が先手"}`);kzStart(KB);kzPlay(()=>{kzBattle();if(KB.turn===1)kzCpuGo()})}
function kzLog(s){KB.log.push(s);const l=$("#kbLog");if(l)l.innerHTML=KB.log.slice(-2).join("<br>")}
const kzWho=i=>i===0?"me":"cp",kzNm=(i,n)=>(i===0?"":"相手の")+n;
function kzBattle(){abar.className="abar";const b=KB,me=b.s[0],cp=b.s[1];
  const kiD=f=>`<span class="kbKi">${"●".repeat(f.ki)}${"○".repeat(5-f.ki)}</span>`;
  const side=(S,who)=>{const a=S.f[S.a];return `<div class="kbSide ${who}"><div class="kbBench">${S.f.map((f,i)=>i===S.a?"":`<div class="kbB${f.hp<=0?" ko":""}" ${who==="me"&&f.hp>0?`onclick="kzSwitchAsk(${i})"`:""}>${kzCard(f.id,{size:"mini",star:f.star})}<div class="kbHp"><i style="width:${f.hp/f.max*100}%"></i></div><div class="kbKiS">気${f.ki}</div></div>`).join("")}${S.x?`<div class="kbB sup">${kzCard(S.x,{size:"mini",star:1})}<div class="kbSupT">補佐</div></div>`:""}</div>
   <div class="kbAct" id="kb_${who}">${kzCard(a.id,{size:"mid",star:a.star})}<div class="kbHpW"><div class="kbHp big"><i id="kbhp_${who}" style="width:${a.hp/a.max*100}%"></i></div><span id="kbhpt_${who}">${a.hp}/${a.max}</span></div>
   <div class="kbKiW">${KRB("気","き")}${kiD(a)}</div>
   <div class="kbSt">${a.buf?`<i class="up">攻↑${a.buf}</i>`:""}${a.dn?`<i class="dn">攻↓${a.dn}</i>`:""}${a.sh?`<i class="sh">守${a.sh}</i>`:""}${a.cnt?`<i class="sh">迎撃</i>`:""}${a.po?`<i class="po">火${a.po}</i>`:""}${a.stun?`<i class="st">足止め</i>`:""}${a.seal?`<i class="st">封${a.seal}</i>`:""}${a.en.map(e=>`<i class="en">${e.t==="組"?e.g:e.t}</i>`).join("")}</div></div></div>`};
  const a=kzCur(b,0),can=b.turn===0&&!b.busy&&!b.over&&b.pick<0;
  app.innerHTML=`<div class="card kb"><div class="kbHead"><b>${KZ_DOJO[b.stage].n}</b><span>速さ ${me.spd}：${cp.spd}</span></div>
   ${side(cp,"cp")}<div class="kbVs">${kzAdv(a,kzCur(b,1))}</div>${side(me,"me")}
   <div class="kbLog" id="kbLog">${b.log.slice(-2).join("<br>")}</div>
   <div class="kbCmd"><button class="pri" ${can?"":"disabled"} onclick="kzDo('atk')">攻撃</button>
    <button class="gold" ${can&&kzCanSk(a)?"":"disabled"} onclick="kzDo('sk')">${a.c.sk?`必殺「${a.c.sk}」<small>${a.seal?"封じられ中":"気5"}</small>`:"必殺技なし"}</button>
