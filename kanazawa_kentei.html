<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金沢検定 道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF8F2;--ink:#1B2A4A;--ink-soft:#4B5670;--line:#DAD5C7;--ai:#1F3A6B;--kusa:#3E6B3A;--enji:#A3323B;--odo:#B8922E;--murasaki:#5B4A7A;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:17px;line-height:1.75}
h1,h2,.serif{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 60px}
header{border-bottom:3px solid var(--ai);padding:6px 0 14px;margin-bottom:22px}
header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em}
header p{margin:4px 0 0;font-size:13px;color:var(--ink-soft)}
.gosai{display:flex;height:6px;margin-top:12px}.gosai span{flex:1}
.gosai .c1{background:var(--ai)}.gosai .c2{background:var(--kusa)}.gosai .c3{background:var(--murasaki)}.gosai .c4{background:var(--odo)}.gosai .c5{background:var(--enji)}
h2{font-size:20px;margin:0 0 6px}
.hint{font-size:14px;color:var(--ink-soft);margin:0 0 18px}
.btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--ai);padding:14px 16px;margin:0 0 12px;font:inherit;color:var(--ink);cursor:pointer;border-radius:4px}
.btn strong{display:block;font-size:18px}.btn small{color:var(--ink-soft);font-size:13px}
.btn:hover,.btn:focus-visible{border-color:var(--ai);outline:none}
.btn.kusa{border-left-color:var(--kusa)}.btn.enji{border-left-color:var(--enji)}.btn.odo{border-left-color:var(--odo)}.btn.murasaki{border-left-color:var(--murasaki)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stat{font-size:14px;color:var(--ink-soft);margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-soft);margin-bottom:6px}
.bar{height:8px;background:var(--line);margin-bottom:22px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ai)}.bar b{position:absolute;top:0;bottom:0;background:var(--enji);opacity:.85}
.src{font-size:12px;color:var(--ink-soft);margin:0 0 8px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border:1px solid var(--line);border-radius:10px;margin-right:6px;color:var(--ink-soft)}
.q{font-size:18px;font-weight:500;margin:0 0 18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);padding:12px 14px;margin:0 0 10px;font:inherit;color:var(--ink);cursor:pointer;border-radius:4px;line-height:1.6}
.opt .k{display:inline-block;width:1.6em;color:var(--ink-soft);font-family:"Shippori Mincho",serif;font-weight:700}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--ai);outline:none}
.opt:disabled{cursor:default}.opt.sel{border-color:var(--ai);border-width:2px;background:#EEF1F7}
.opt.right{border-color:var(--kusa);background:#EEF4EC;border-width:2px}.opt.wrong{border-color:var(--enji);background:#F8ECEC;border-width:2px}
.verdict{margin:16px 0 8px;font-size:20px;font-weight:700}.verdict.ok{color:var(--kusa)}.verdict.ng{color:var(--enji)}
.exp{background:var(--card);border-top:3px solid var(--odo);padding:12px 14px;font-size:15px;margin:0 0 16px}
.exp .lab{font-size:12px;color:var(--odo);font-weight:700;margin-bottom:4px}
.next{display:block;width:100%;background:var(--ai);color:#fff;border:0;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;border-radius:4px;margin-bottom:12px}
.next:focus-visible{outline:3px solid var(--odo)}.next.ghost{background:transparent;color:var(--ai);border:1.5px solid var(--ai)}
.big{font-family:"Shippori Mincho",serif;font-size:56px;font-weight:700;line-height:1.1;margin:8px 0 2px}
.big small{font-size:20px;font-weight:500;color:var(--ink-soft);margin-left:6px}
.pass{font-size:18px;font-weight:700;margin:6px 0 20px}.pass.ok{color:var(--kusa)}.pass.ng{color:var(--enji)}
ul.miss{list-style:none;padding:0;margin:0 0 20px;font-size:14px}
ul.miss li{padding:10px 0;border-bottom:1px solid var(--line)}ul.miss li span{color:var(--ink-soft);font-size:12px;display:block}
ul.miss li .e{font-size:13px;margin-top:4px;color:var(--ink)}
.loopnote{background:#F8ECEC;border-left:4px solid var(--enji);padding:10px 12px;font-size:14px;margin-bottom:16px}
.g{margin:0 0 10px}.g .n{display:flex;justify-content:space-between;font-size:14px}.g .t{height:10px;background:var(--line);position:relative}.g .t i{position:absolute;left:0;top:0;bottom:0;background:var(--kusa)}.g .t i.low{background:var(--enji)}.g .t i.mid{background:var(--odo)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 20px}
.kv div{background:var(--card);border:1.5px solid var(--line);padding:10px 12px;border-radius:4px}
.kv div b{display:block;font-family:"Shippori Mincho",serif;font-size:26px;line-height:1.2}.kv div small{font-size:12px;color:var(--ink-soft)}
table.h{width:100%;border-collapse:collapse;font-size:13px}table.h td{padding:6px 4px;border-bottom:1px solid var(--line)}
.foot{font-size:12px;color:var(--ink-soft);margin-top:40px;border-top:1px solid var(--line);padding-top:10px}
.timer{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>金沢検定 道場</h1>
  <p>初級合格ライン80点を、公式過去問の土台から固める</p>
  <div class="gosai"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span><span class="c5"></span></div>
</header>
<main id="app"></main>
<p class="foot">出典：ジュニアかなざわ検定 第1〜4回（小中共通版）・第5〜20回・＠ほーむ（中学生版）・第5〜14回（小学生版）問題／解答と解説PDF（金沢市公開・第1〜14回と＠ほーむ〔中学生版〕および小学生版は問題用紙のみで公式解説なし）。個人学習用。写真・図版は含めていない。</p>
</div>
<script>
const ROUNDS=[{"id":"j20c","label":"第20回ジュニア（中学生版）2026","q":[{"n":1,"q":"金沢は雪国で積雪量も多い。そのため、雪の重みで枝がおれないように樹木にほどこされるものは何か。","o":["こもかけ","こもまき","雪つり","わらまき"],"a":3,"e":"雪は独特の美しい景観や恵（めぐみ）をあたえている。樹木にほどこされた「雪つり」にうっすらと雪化粧（ゆきげしょう）された兼六園（けんろくえん）の風情は、観光客の目をひきつけている。","g":"自然・産業"},{"n":2,"q":"金沢は、藩政（はんせい）時代から今日までさまざまな分野で活躍（かつやく）する人々を育んできた。天文学者でＺ項（ぜっとこう）を発見した人物はだれか。","o":["木村栄（きむらひさし）","鈴木大拙（すずきだいせつ）","磯田謙雄（いそだのりお）","野口遵（のぐちしたがう）"],"a":1,"e":"Ｚ項の発見により、地球上の緯度（いど）観測をより正確に行えるようになった。","g":"偉人・人物"},{"n":3,"q":"金沢市は、伝統工芸がさかんな地域であり、特に金箔（きんぱく）の生産で知られている。金沢市の金箔の生産量は日本の総生産量の何パーセントといわれているか。","o":["30パーセント","50パーセント","70パーセント","100パーセント"],"a":4,"e":"金沢市の金箔の生産量は長らく全国の99パーセントをしめていたが、県外で唯一（ゆいいつ）生産していた職人が引退し、今では全国の金箔の100パーセントが金沢で生産されているといわれている。","g":"美術・工芸・芸能"},{"n":4,"q":"2006年（平成18）から始まった地域の除雪作業を支援（しえん）する制度で、地域からの要請（ようせい）に応じて行う雪かきボランティアに登録されているのは主にどんな人か。","o":["公務員","主婦・主夫","学生","シニア"],"a":3,"e":"雪かきボランティアは学生のほか企業（きぎょう）や市民活動団体等によって行われ、雪かきをきっかけに若い世代と地域との交流が深まっている。","g":"市政・最近の話題"},{"n":5,"q":"明治時代に生まれた金沢出身の土木技師で、当時日本統治下にあった台湾（たいわん）でアジア最大のダムを建設した人物はだれか。","o":["八田輿一（はったよいち）","高峰譲吉（たかみねじょうきち）","津田米次郎（つだよねじろう）","三宅雪嶺（みやけせつれい）"],"a":1,"e":"金沢市出身の八田輿一は、日本統治下の台湾に渡り烏山頭（うさんとう）ダムを完成させた。これにより嘉南（かなん）平野は台湾有数の農業地となっている。","g":"偉人・人物"},{"n":6,"q":"金沢駅は2011年（平成23）、アメリカの旅行雑誌にて「世界で最も美しい駅」の１つに国内で唯一（ゆいいつ）選ばれた。金沢駅のシンボルはどれか。","o":["もてなしドームと鼓門（つづみもん）","徽軫灯籠（ことじとうろう）","石川門（いしかわもん）","鼠多門（ねずみたもん）"],"a":1,"e":"金沢は雨や雪が多いため「駅を降りた人に傘（かさ）を差し出すおもてなしの心」をコンセプトにもてなしドームが誕生した。金沢でさかんな伝統芸能の能楽で使われる鼓をイメージした鼓門もフォトスポットとして人気である。徽軫灯籠は兼六園にあり、石川門は金沢城跡の東に位置し、鼠多門は玉泉院丸に位置している。","g":"寺社・建造物・まち"},{"n":7,"q":"加賀藩（かがはん）の代々の藩主は能楽や茶の湯を積極的に取り入れた。３代藩主前田利常（まえだとしつね）が茶道を学ぶため招いた茶人はだれか。","o":["宗旦（そうたん）","千利休（せんのりきゅう）","仙叟宗室（せんそうそうしつ）","本阿弥光悦（ほんあみこうえつ）"],"a":3,"e":"仙叟宗室は裏千家（うらせんけ）の初代家元となった茶人である。裏千家は千家茶道の伝統を大切に守り伝えるとともに、今日における茶の湯文化のあるべき姿を考え、時代にそくした茶の湯を実践（じっせん）している。","g":"歴史"},{"n":8,"q":"国連のユネスコは、創造都市〔独自の文化を産業と結び付け、新しい価値を創造してまちを元気にしている都市〕のネットワークづくりを提唱している。金沢市は2009年（平成21）にこの創造都市に認定されたが、認定された分野はどれか。","o":["クラフト","デザイン","メディア","食文化"],"a":1,"e":"金沢の伝統工芸〔クラフト〕は、藩政時代から今日に至るまで守り続けられてきた。","g":"市政・最近の話題"},{"n":9,"q":"藩政期（はんせいき）から続く芸術文化に関心を持つ金沢のまちの気風と市民の強い熱意によって戦後すぐに設立され、2023年（令和５）10月に移転新築し、今年創立80周年をむかえるこの施設（しせつ）はどれか。","o":["金沢21世紀美術館","金沢美術工芸大学","国立工芸館","こどもアート工房みたに"],"a":2,"e":"戦後に伝統と美を大切にする金沢市民の期待に答え、1946年（昭和21）に金沢美術工芸専門学校として開学した。その後、金沢美術工芸短期大学を経て金沢美術工芸大学となった。","g":"美術・工芸・芸能"},{"n":10,"q":"明治になり、金沢にも軍隊がおかれることとなった。1904年（明治37）には日露（にちろ）戦争が起こり、金沢の第九師団も戦地で戦い、翌年にはロシア兵の捕虜（ほりょ）が金沢にも送られてきた。その時に亡くなったロシア兵の墓があるのはどこか。","o":["内川墓地公園","野田山墓地","奥卯辰山（おくうたつやま）墓地公園","末広墓地"],"a":2,"e":"1896年（明治29）頃、金沢には１万人以上の兵士やその家族が住むこととなった。","g":"歴史"},{"n":11,"q":"金沢市内での近年の発掘（はっくつ）調査により、縄文時代の人々のイメージがぬりかえられている。縄文時代中期の遺跡（いせき）で、日本で初めて発見された石の指輪やヒスイのペンダントが発見された遺跡はどこか。","o":["北塚（きたづか）遺跡","チカモリ遺跡","西念（さいねん）・南新保遺跡","七ツ塚遺跡"],"a":1,"e":"北塚遺跡は2004年（平成16）に金沢市指定文化財に指定された。調査によって縄文人は高度な技術をもち、感性豊かな自然人であったことが明らかになっている。","g":"歴史"},{"n":12,"q":"金沢の市街地近郊（きんこう）では野菜・花・果物などいろいろな種類が生産されている。昔から金沢で栽培（さいばい）されている「加賀野菜」は何品目あるか。","o":["５品目","７品目","10品目","15品目"],"a":4,"e":"加賀野菜に認定されているのは、金時草・加賀太きゅうり・たけのこ・打木赤皮甘栗（うつぎあかがわあまぐり）かぼちゃ・ヘタ紫なす・加賀つるまめ・赤ずいき・加賀れんこん・さつまいも・金沢一本太ねぎ・源助だいこん・金沢春菊（しゅんぎく）・二塚からしな・金沢せり・くわいの15品目である。","g":"食・行事"},{"n":13,"q":"大和朝廷（やまとちょうてい）が勢力をのばしていた頃、金沢地方を治めていたといわれる豪族（ごうぞく）で、娘を天智天皇（てんじてんのう）の宮人（みやびと）として仕えさせたのはだれか。","o":["加賀君（かがのきみ）","道君（みちのきみ）","金沢君（かなざわのきみ）","河北君（かほくのきみ）"],"a":2,"e":"道君の娘はやがて皇子を産み、その皇子の子どもは後に光仁（こうにん）天皇となったため、天皇と親戚（しんせき）関係ができた道君は、８世紀にかけて勢力を伸ばしていった。","g":"歴史"},{"n":14,"q":"明治時代には、金沢から世界にほこることのできるすぐれた業績を残した人々を輩出（はいしゅつ）している。強い消化効力のある胃腸薬「タカジアスターゼ」を発明し、血圧を上げたりする治療薬（ちりょうやく）「アドレナリン」を発見したのはだれか。","o":["高多久兵衛（たかだきゅうべえ）","鈴木大拙（すずきだいせつ）","横山隆興（よこやまたかおき）","高峰譲吉（たかみねじょうきち）"],"a":4,"e":"高峰譲吉の功績を顕彰（けんしょう）し、あわせて科学教育の振興（しんこう）を図ることを目的として1952年（昭和27）に高峰譲吉博士顕彰会により高峰賞が制定された。「理科」「数学」に興味・関心が高く、優秀であり、科学に関する研究の実績を有する市内の中学３年生に毎年、高峰賞を授与（じゅよ）している。","g":"偉人・人物"},{"n":15,"q":"幕府は諸大名支配のため、大名の妻子を人質として江戸（えど）の屋敷（やしき）におき、大名は１年おきに領地と江戸に住む参勤交代制度を作った。前田家が金沢城から江戸へ行くために、主に利用した街道はどの道か。","o":["東海道","北国下街道","甲州街道","日光街道"],"a":2,"e":"「参勤」は大名が金沢から江戸に行くこと、「交代」は江戸から金沢へ帰ることをいう。参勤交代で前田家は、主に北国下街道を経由して中山道に入るコースを利用した。","g":"歴史"},{"n":16,"q":"金沢城跡（じょうせき）は2008年（平成20）、国指定史跡（しせき）となり、復元整備事業として、今までに菱櫓（ひしやぐら）、橋爪門（はしづめもん）、橋爪門続櫓（つづきやぐら）、五十間長屋（ごじっけんながや）が完成している。2020年（令和２）には金沢城西側の門と橋が約140年ぶりに復元されたが、その門の名前は何か。","o":["橋爪門二の門","河北門（かほくもん）","鼠多門（ねずみたもん）","石川門"],"a":3,"e":"現在は石垣（いしがき）の計画的な保全対策が行われている。","g":"寺社・建造物・まち"},{"n":17,"q":"鎌倉（かまくら）時代、加賀地方で勢力を拡大し、藤原利仁（ふじはらのとしひと）の子孫といわれた一族で、『安宅（あたか）』や歌舞伎（かぶき）の『勧進帳（かんじんちょう）』で後世に知られたのは何氏か。","o":["林氏","山科（やましな）氏","伏見（ふしみ）氏","富樫（とがし）氏"],"a":4,"e":"1335年（建武２）、17代目の富樫高家（とがしたかいえ）は足利尊氏（あしかがたかうじ）方につき、戦いで手柄（てがら）をたて、尊氏から加賀国の守護に任命された。","g":"歴史"},{"n":18,"q":"金沢は歴史を大切にするまちづくりを行っており、市内には昔の書や絵画、工芸品を展示している美術館や博物館がたくさんある。近年は大正から昭和初期の建物もその価値が評価されて、大事に保存されるようになってきた。金沢文芸館もその１つで、昭和初期の建物だが、建てられた当時は何の建物だったか。","o":["郵便局","警察署","消防署","銀行"],"a":4,"e":"昭和初期の建物である金沢文芸館は、元々は銀行だった建物を金沢市が改修し、文芸館に生まれ変わった。竣工した1929年（昭和４）から、この建物は地域のランドマークとして市民に親しまれている。","g":"寺社・建造物・まち"},{"n":19,"q":"まがりくねったさまざまな形の田を縦・横一定の長さに調整し、農道や水路を計画的に配置する事業を耕地整理という。この耕地整理を1888年（明治21）に日本で最初に成しとげた石川郡安原村〔現在の金沢市上安原町〕の地主はだれか。","o":["長谷川準也（はせがわじゅんや）","和泉要助（いずみようすけ）","高多久兵衛（たかだきゅうべえ）","稲垣義方（いながきよしかた）"],"a":3,"e":"彼の耕地整理の成功を視察するために、各地からたくさんの人々が訪れた。","g":"偉人・人物"},{"n":20,"q":"2025年（令和７）７月、中高生を中心とする青少年の新しい居場所として「かなざわユースセンター」が開設された。家でも学校でもないこの第３の居場所では、青少年が「くつろぐ」「遊ぶ」「勉強する」「おしゃべりをする」「なやみを相談する」など、自分らしく安心して過ごせる空間となっている。青少年が思い思いに過ごせるこの場所の拠点（きょてん）となっている施設（しせつ）はどこか。","o":["長土塀（ながどへ）青少年交流センター","玉川こども図書館","金沢未来のまち創造館","金沢市民芸術村"],"a":1,"e":"かなざわユースセンターではユースワーカーと呼ばれるスタッフが常駐（じょうちゅう）しており、スタッフや利用者が企画したイベントも毎月行っている。","g":"市政・最近の話題"},{"n":21,"q":"鎌倉時代から室町時代にかけて、新しい仏教が広がっていった。そのころ、加賀の地で曹洞宗（そうとうしゅう）を広めたのはだれか。","o":["親鸞（しんらん）","蓮如（れんにょ）","徹通義介（てっつうぎかい）","運良（うんりょう）"],"a":3,"e":"曹洞宗永平寺の名僧（めいそう）、徹通義介は加賀国を治めていた富樫家尚（とがしいえひさ）にたのまれて、大乘寺（だいじょうじ）の初代住持（じゅうじ）になった。大乘寺には優れたお坊（ぼう）さんが多く集まった。","g":"歴史"},{"n":22,"q":"金沢市では、スポーツを盛んにすることで、まちの活力を高めようとしている。2018年（平成30）の金沢市スポーツ文化推進条例の制定により、市民と選手がふれあう機会を増やす取り組みにも積極的である。金沢市のホームタウンチーム「ツエーゲン金沢」のスポーツ種目はどれか。","o":["野球","サッカー","バレーボール","バスケットボール"],"a":2,"e":"ツエーゲンとはドイツ語で「チームとサポーターが共に進んでいく」という意味と金沢弁で「強いんだっ！（つぇーげん！）」の意味をもっている。","g":"市政・最近の話題"},{"n":23,"q":"新潟県から富山県、石川県、福井県を経て、滋賀県に至る総延長487キロメートルの高速道路が北陸自動車道である。この長い高速道路のうち、一番最初の1972年（昭和47）10月18日に開通したのは石川県内のどこからどこまでか。","o":["名立谷浜（なだちたにはま）インターチェンジから朝日インターチェンジまで","金沢西インターチェンジから小松インターチェンジまで","小松インターチェンジから福井北インターチェンジまで","金沢西インターチェンジから富山インターチェンジまで"],"a":2,"e":"北陸自動車道は東では長岡ジャンクションで関越自動車道と、西では米原ジャンクションで名神高速道路と、中間では小矢部砺波（となみ）ジャンクションで東海北陸自動車道と接続しており、交通網の整備を通して地域の発展と活性化が進められている。","g":"寺社・建造物・まち"},{"n":24,"q":"加賀藩第11代藩主前田治脩（まえだはるなが）の時代に兼六園内に建てられた藩校で、身分を問わず８歳以上の男子が入学でき、儒学（じゅがく）を中心に漢学・算術・医学・天文学などが教えられていたのはどこか。","o":["経武館（けいぶかん）","明倫堂（めいりんどう）","壮猶館（そうゆうかん）","竹沢御殿（たけざわごてん）"],"a":2,"e":"明倫堂は加賀藩の藩校であり身分を問わず入学できた。経武館は武芸の鍛錬（たんれん）を目的に設置されており、壮猶館は1854年の開国後に洋式兵学校として開校した経緯（けいい）がある。竹沢御殿は兼六園につくられた前田家の隠居所（いんきょじょ）である。","g":"歴史"},{"n":25,"q":"明治時代、金沢に３人の文豪（ぶんごう）が生まれた。その中で、下新町に生まれ『滝（たき）の白糸』や『義血侠血（ぎけつきょうけつ）』を書いたのはだれか。","o":["徳田秋声（とくだしゅうせい）","森鷗外（もりおうがい）","泉鏡花（いずみきょうか）","夏目漱石（なつめそうせき）"],"a":3,"e":"泉鏡花は1873年（明治６）に下新町に生まれ、父は象嵌（ぞうがん）細工職人、母の兄は能楽師という工芸・芸能が身近な環境（かんきょう）で育った。","g":"文学"},{"n":26,"q":"江戸時代になり、町が整備されると米市場や魚市場なども現れ、商業が盛んになり貨幣（かへい）がつくられるようになった。貨幣ができたのは前田利家の時代だが、原料となる金銀が産出された山はどこか。","o":["宝達山（ほうだつさん）","卯辰山（うたつやま）","白山","鞍掛山（くらかけやま）"],"a":1,"e":"天正年間（1573～92）、豊臣秀吉にならって多くの金・銀貨をつくらせたのが始まりである。次の前田利長・利常の時代にも、一分銀（いちぶぎん）や大豆板銀（まめいたぎん）などいろいろな金・銀貨がつくられた。","g":"歴史"},{"n":27,"q":"金沢市ではすべての人が平等に普通の生活を送れるまちを目指し、「ノーマライゼーションプラン金沢」が定められている。金沢市で実際に運行しているバスで、だれもが気軽に買い物や散策に出られるようバスの入口から出口まで低くて段差のない床になっているバスを何というか。","o":["まちバス","城下町金沢周遊バス","循環（じゅんかん）バス","金沢ふらっとバス"],"a":4,"e":"ふらっとバスは、ふらっと乗れる気楽さと段差のないフラットなバスにちなんで名付けられた。乗り降りスロープや車いすの固定装置も備えている。","g":"市政・最近の話題"},{"n":28,"q":"加賀藩藩主前田綱紀（まえだつなのり）は学問が好きで、日本中から有名な学者を招いたり、貴重（きちょう）な書物を集めたりした。江戸時代を代表する学者として有名な新井白石はこのような加賀藩のことを、何とほめたたえたか。","o":["加賀は天下の大学","加賀は天下の図書館","加賀は天下の博士","加賀は天下の書府"],"a":4,"e":"前田綱紀は当時、漢学〔当時の中国の学問〕では日本一といわれていた木下順庵（きのしたじゅんあん）や、本草学〔薬草の学問〕の第一人者として知られていた稲生若水（いのうじゃくすい）などを金沢に住まわせて学問を奨励（しょうれい）した。","g":"歴史"},{"n":29,"q":"2025年（令和７）10月、金沢市は新たにある市と友好都市協定を締結（ていけつ）した。この市には、かつて前田利家の五男・利孝（としたか）が築いた七日市藩があり、金沢製糸場をつくる際にはこの市にあった当時全国最大規模の製糸場に金沢市から技術者が派遣され、建築や製糸の技術が継承（けいしょう）された。歴史的・文化的に深いつながりがあるこの市はどこか。","o":["藤岡市","高崎市","富岡市","前橋市"],"a":3,"e":"金沢市と富岡市はこれまでも観光交流などを行ってきたが、友好都市協定を締結することで、互いの文化や地域性を尊重しつつ、さらに絆を深め、末永い友好関係を築くとともに、市民間及び都市間の交流を推進し、両市の活性化を図っていくこととしている。","g":"市政・最近の話題"},{"n":30,"q":"歴史的な集落やまちなみの中で、価値が非常に高いと判断した「重要伝統的建造物群保存地区」として国が選定した金沢市内の地域はどこか。","o":["「東山ひがし」「主計（かずえ）町」「卯辰山山麓（うたつやまさんろく）」「寺町台」","「夕日寺」「神谷内」「富樫」「長坂台」","「長町」「材木町」「味噌蔵（みそぐら）町」「犀桜（さいおう）地区」","「田上」「医王山」「朝霧台（あさぎりだい）」「湯涌（ゆわく）」"],"a":1,"e":"国は令和６年８月現在、全国で43道府県106市町村129地区を重要伝統的建造物群保存地区に選定している。石川県からは８地区が選定されており、長野県と並び全国トップであるが、その半数が金沢市の地区である。","g":"寺社・建造物・まち"},{"n":31,"q":"金沢市の町名には、藩政時代の町の性格を表したものが数多くある。加賀藩の老臣（ろうしん）・前田対馬守（つしまのかみ）家の下屋敷（しもやしき）があったところで、同家の家紋（かもん）にちなんでつけられた町名はどれか。","o":["主計（かずえ）町","金石（かないわ）町","六枚町","飛梅（とびうめ）町"],"a":4,"e":"飛梅町は藩の老臣・前田氏の家紋「角の内梅輪」にちなんだ町名である。","g":"寺社・建造物・まち"},{"n":32,"q":"金沢城を中心にして発展してきた金沢の町は、1871年（明治４）の廃藩置県（はいはんちけん）により衰退（すいたい）してしまったため、町のにぎわいを取りもどすために1874年（明治７）に「金沢博覧会」が開催された。その時の会場はどこか。","o":["寺島蔵人邸（てらしまくらんどてい）と旧中村邸","長町武家屋敷（ながまちぶけやしき）と天徳院","尾山神社と西別院","成巽閣（せいそんかく）と東別院"],"a":4,"e":"会場には銅器や漆器など6,200点あまりが展示され、入場者は30日間で７万人に達した。","g":"歴史"},{"n":33,"q":"金沢市の北西部の砂地には、すいかやさつまいもなどの野菜が多く作られている。すいかの苗は環境の変化や病気に弱くて育ちにくいが、ある野菜の苗に接ぎ木をすると病気に強い苗を育てることができる。その野菜は何か。","o":["ナス","かぼちゃ","トマト","ピーマン"],"a":2,"e":"かぼちゃ台は寒さに強く、砂地に適している。","g":"食・行事"},{"n":34,"q":"江戸時代以降、加賀藩では独自の金・銀貨が作られていたが、江戸幕府が全国共通の貨幣（かへい）を使うようすすめていたことをうけ、藩内で貨幣を造ることをやめている。この時の加賀藩第５代藩主はだれか。","o":["前田重教（まえだしげみち）","前田利長（まえだとしなが）","前田斉広（まえだなりなが）","前田綱紀（まえだつなのり）"],"a":4,"e":"加賀藩での貨幣を造ることをやめる判断をしたのは第５代藩主の前田綱紀である。それまでに加賀藩で造られた金・銀貨は約50種類におよんでいる。","g":"歴史"},{"n":35,"q":"戦争が終わり、石川県では1949年（昭和24）、現在の金沢城公園に４年制の新制大学が開学した。「お城の中の大学」として全国に有名になった大学はどこか。","o":["金沢美術工芸大学","金沢大学","金沢学院大学","北陸大学"],"a":2,"e":"開校当時は金沢城内にあった旧陸軍の木造兵舎を校舎として使用した。金沢大学は平成初期から中期にかけて、現在の角間キャンパスに移転した。","g":"歴史"},{"n":36,"q":"金沢市には古くから残る建物がたくさんあり、多くの人から親しまれ大事に守られてる。その中で、最上階に４色のギヤマン〔色ガラス〕がはめこまれた神門が国の重要文化財に指定されている、前田利家と正室お松の方をまつった建物は何か。","o":["金沢城","卯辰八幡宮（うたつはちまんぐう）","尾山神社","天徳院"],"a":3,"e":"尾山神社の神門は全国的にも珍しい和漢洋の３つの建築様式が用いられており、屋根の上についている避雷針（ひらいしん）は現存する日本最古のものといわれている。","g":"寺社・建造物・まち"},{"n":37,"q":"明治時代の後半以降は、県が中学校〔今の高等学校にあたる〕や女子の教育を行う高等女学校をつくった。当時の私立金沢女学校は現在の北陸学院高等学校になっているが、石川尋常（じんじょう）中学校は石川県立金沢第一中学校となった後、現在のどの高等学校になっているか。","o":["金沢商業高等学校","金沢桜丘高等学校","金沢二水高等学校","金沢泉丘高等学校"],"a":4,"e":"明治時代、小学校に通う子どもが増えてくると、さらに深く学ぶ学校をつくってほしいという声が市民からもおこった。石川県立尋常中学校ができたのは1887年（明治20）である。その後、県立金沢第一中学校となり、後に県立金沢泉丘高等学校となった。","g":"歴史"},{"n":38,"q":"金沢には、年中行事が今も数多く残っている。金沢の年中行事のうち、加賀藩から江戸の将軍に氷を献上（けんじょう）したことにちなんだ行事で「氷室の朔日（ついたち）」といわれ、氷室まんじゅうを食べる風習が残るのは何月のことか。","o":["１月","３月","７月","10月"],"a":3,"e":"冬の間に保存しておいた氷を将軍に献上したことにちなんだ行事である。現在では７月１日に氷室まんじゅうを食べると病気にかからないという風習がある。","g":"食・行事"},{"n":39,"q":"金沢に初めて電灯が灯ったのは、1894年（明治27）に兼六園で開かれた関西府県連合共進会場と、尾山神社の門前にアーク灯がつけられたときである。一般家庭に電灯が灯ったのはいつか。","o":["1900年（明治33）","1905年（明治38）","1910年（明治43）","1915年（大正４）"],"a":1,"e":"当時の市民は電気をぜいたく品と考えていたので、利用者はなかなか増えなかった。","g":"歴史"},{"n":40,"q":"明治時代の金沢三文豪の１人で「あにいもうと」「杏（あんず）っ子」など、金沢の風物と少年時代の喜び・悲しみをえがいた人物はだれか。","o":["室生犀星（むろおさいせい）","尾崎紅葉（おざきこうよう）","徳田秋声（とくだしゅうせい）","永井荷風（ながいかふう）"],"a":1,"e":"「あにいもうと」「杏っ子」の作者は室生犀星であり、室生犀星と泉鏡花、徳田秋声の３人が金沢三文豪である。","g":"文学"},{"n":41,"q":"西洋化を進めた明治時代には、金沢にも新聞・写真・洋服などが登場し、人々は新しいものに興味を持ち始めた。新聞の第１号は1871年（明治４）の吉本次郎兵衛（よしもとじろべえ）が発行した「開化新聞」だが、1893年（明治26）に「北國（ほっこく）新聞」を発行したのはだれか。","o":["西田幾多郎（にしだきたろう）","泉鏡花（いずみきょうか）","赤羽萬次郎（あかばねまんじろう）","藤岡作太郎（ふじおかさくたろう）"],"a":3,"e":"赤羽萬次郎が発行した「北國新聞」では、泉鏡花や石橋忍月（いしばしにんげつ）など各界の人が執筆にあたった。","g":"偉人・人物"},{"n":42,"q":"藩政時代に「加賀の平賀源内」といわれた人物で、長崎でオランダ人に西洋医学や理化学、天文学を学び、『一東視窮録（いっとうしきゅうろく）』にエレキテル・写真術・無尽灯（むじんとう）などの最新技術の知識をまとめた人物はだれか。","o":["銭屋五兵衛（ぜにやごへえ）","木屋藤右衛門（きやとうえもん）","大野弁吉（おおのべんきち）","黒川良安（くろかわまさやす）"],"a":3,"e":"「加賀の平賀源内」といわれたのは大野弁吉である。豪商（ごうしょう）の銭屋五兵衛の援助（えんじょ）をうけてたくさんのからくりや工芸品を残している。","g":"偉人・人物"},{"n":43,"q":"2025年（令和７）12月、「加賀料理」が国の「登録無形文化財」に選ばれた。日本国内において、和食分野では京料理に続く登録であり、その繊細（せんさい）な技術と独自の美学は今、改めて世界中から熱い視線を浴びているが、加賀料理はどれか。","o":["治部煮（じぶに）","ほうとう","しもつかれ","きりたんぽ"],"a":1,"e":"加賀百万石の栄華（えいが）をほこる前田家の庇護（ひご）のもと、美術工芸の職人の招致（しょうち）・育成や茶道の保護など、さまざまな文化振興（しんこう）策の影響を受け、加賀の美意識と融合（ゆうごう）した独自の食文化が形づくられた。ほうとうは山梨県、しもつかれは栃木県、きりたんぽは秋田県の郷土料理である。","g":"食・行事"},{"n":44,"q":"江戸時代の金沢の農村では、村の年貢米（ねんぐまい）を集めるため武士や農民による村の統治が行われていた。このうち農民から選ばれた村役人はどれか。","o":["算用場奉行（さんようばぶぎょう）","郡奉行（こおりぶぎょう）","組合頭（くみあいがしら）","改作奉行（かいさくぶぎょう）"],"a":3,"e":"組合頭は、同じ村役人である肝煎（きもいり）を助ける役職であった。","g":"歴史"},{"n":45,"q":"2008年（平成20）７月28日に55年ぶりに浅野川が氾濫（はんらん）し、浅野川水害がおこった。このとき多くのボランティアの方が協力してくれたことを大切にし、後世に伝えていくためにつくられた日を何というか。","o":["金沢「友情」の日","金沢「絆（きずな）」の日","金沢「助け合い」の日","金沢「共助」の日"],"a":2,"e":"７月28日を中心に、すべての市立小中学校で、児童会・生徒会が中心となり保護者・地域の人とも連携（れんけい）しながら、人とのつながりを大切にした活動を行っている。","g":"市政・最近の話題"},{"n":46,"q":"金沢市の浄水場（じょうすいじょう）では、徹底（てってい）した水質管理が行われている。他にも参考として水が安全かどうかを調べるために「監視魚（かんしぎょ）」と呼ばれる魚がいるが、何という魚か。","o":["メダカ","フナ","金魚","熱帯魚"],"a":3,"e":"金沢市内には末浄水場と犀川（さいがわ）浄水場の２か所がある。","g":"市政・最近の話題"},{"n":47,"q":"金沢の芋掘藤五郎（いもほりとうごろう）の伝説は、奈良時代の「炭焼き長者」伝説が元になってつくられたといわれている。藤五郎伝説と同時期の遺跡である三小牛（みつこうじ）さこ山遺跡からは、奈良時代当時の貨幣が国内最多の580枚出土している。この貨幣は何か。","o":["富本銭（ふほんせん）","和同開珎（わどうかいちん）","永楽通宝（えいらくつうほう）","慶長小判（けいちょうこばん）"],"a":2,"e":"金沢市三小牛町の山中に三小牛さこ山遺跡と隣接（りんせつ）して位置する三小牛ハバ遺跡からは、奈良時代の仏像が出土している。","g":"歴史"},{"n":48,"q":"金沢では、藩政時代から続く文化が今もたくさん残っている。前田利家が越前の府中〔現在の福井県越前市〕を治めていた頃、領民が年の初めのお祝いにおどっていたおどりが、金沢でも行われるようになり、その後、能楽師の大石藤五郎が定着させた伝統文化は何か。","o":["ジョンガラ節","加賀獅子（かがじし）","山王悪魔払（さんのうあくまばらい）","加賀万歳（かがまんざい）"],"a":4,"e":"加賀万歳のはじまりは前田利家の時代であり、19世紀の初めに能楽師の大石藤五郎が定着させた。そのため、能楽の影響（えいきょう）を受けており、舞（まい）や語りがユーモアのある中にも品格がある。","g":"美術・工芸・芸能"},{"n":49,"q":"金沢市の現在の面積は約469平方キロメートルであり、市制がしかれた時の40倍以上になっている。金沢に市制がしかれたのは何年か。","o":["1868年（明治元）","1889年（明治22）","1912年（大正元）","1925年（大正14）"],"a":2,"e":"1889年に市制がしかれ、1925年頃から隣接の石川郡や河北郡の町村を編入・合併しつつ市域を拡大した。","g":"市政・最近の話題"},{"n":50,"q":"2027年（令和９）５月６日から約11か月間、リニューアルのため休館となる施設で、21世紀という大きな歴史の転換点にあたり、「新しい文化の創造」と「新たなまちの賑（にぎ）わいの創出」を目的に開設された金沢市の代表的な文化施設はどれか。","o":["石川県立音楽堂","金沢21世紀美術館","泉鏡花記念館","金沢城"],"a":2,"e":"金沢21世紀美術館の休館中、旧日本銀行金沢支店跡地（あとち）を活用し、作品を展示するとともに、休館中も多くの人に金沢を訪れてもらえるよう「金沢まちなか芸術祭」を開催する予定である。","g":"市政・最近の話題"}]},{"id":"j19c","label":"第19回ジュニア（中学生版）2025","q":[{"n":1,"q":"金沢が生んだ三文豪（さんぶんごう）のうち、「幼年（ようねん）時代」「性に眼覚（めざ）める頃（ころ）」などの小説や「犀川（さいがわ）」という詩などを発表した人物はだれか。","o":["徳田秋声（とくだしゅうせい）","泉鏡花（いずみきょうか）","夏目漱石（なつめそうせき）","室生犀星（むろおさいせい）"],"a":4,"e":"室生犀星は仕事場の上司から俳句を教えてもらったことがきっかけで、文学書をよく読むようになった。さらに、新聞に投稿（とうこう）した詩が雑誌に掲載（けいさい）されたことで、文学に対する熱意が高まった。","g":"文学"},{"n":2,"q":"八田與一（はったよいち）は当時アジア最大といわれた烏山頭（うさんとう）ダムや長大な水路を完成させるなど、不毛の大地を豊かな平野に変えたことで知られている。八田與一が活躍（かつやく）した場所はどこか。","o":["朝鮮半島（ちょうせんはんとう）","中国","台湾（たいわん）","タイ"],"a":3,"e":"金沢市出身の八田與一は台湾にわたり、烏山頭ダムを完成させた。その業績はアニメ映画「パッテンライ」でも紹介されている。","g":"偉人・人物"},{"n":3,"q":"金沢では、山地と平野の間にあるなだらかな地形である丘陵地がいくつか見られる。次のうち、それらを北から順に正しく並べたものはどれか。","o":["小立野台地→卯辰山→寺町台地","小立野台地→寺町台地→卯辰山","卯辰山→寺町台地→小立野台地","卯辰山→小立野台地→寺町台地"],"a":4,"e":"犀川の南側には寺町台地が広がっており、浅野川の北側には、なだらかな卯辰山があり、2つの河川（かせん）の間には細長く小立野台地が延びている。小立野台地や寺町台地、卯辰山の海側には犀川や浅野川などの河川が運んだ土砂が堆積（たいせき）してできた平野が広がっている。","g":"自然・産業"},{"n":4,"q":"1488 年（長享2）、加賀国では農民や僧（そう）たちが中心になって一向一揆（いっこういっき）を起こし、高尾城(たこうじょう)を攻撃（こうげき）して守護を滅ぼした。この当時の守護はだれか。","o":["州崎慶覚（すざききょうかく）","赤松満祐（あかまつみつすけ）","富樫政親（とがしまさちか）","足利義教（あしかがよしのり）"],"a":3,"e":"一向一揆の後、守護は力を失い、一向宗の坊主・土豪（どごう）などが加賀国を治めるようになった。守護富樫政親の滅んだ加賀国は「百姓（ひゃくしょう）の持ちたる国」といわれるようになった。","g":"歴史"},{"n":5,"q":"金沢の市場の歴史は古く、1580 年（天正8）に現在の武蔵ヶ辻あたりで朝市が始まり、1721 年（享保6）には、市内各地にあった市場が近江町（おうみちょう）に集められた。1966 年（昭和 41）に、金石街道（かないわかいどう）沿いの西念町（さいねんまち）に、近代的な設備をもつ金沢市中央卸売市場（かなざわしちゅうおうおろしうりしじょう）が作られた。一方、近江町市場は、2009 年（平成 21）再開発により生まれ変わった。この時、新たに開業した施設は何か。","o":["近江町いちば館","クロスゲート金沢","金沢フォーラス","かなざわはこまち"],"a":1,"e":"近江町市場は、再開発によって「近江町いちば館」が開業し、生鮮食品の販売だけでなく、飲食店や観光案内所、市民ギャラリーなども併設された。観光と地域のくらしがともに支えられている施設である。","g":"市政・最近の話題"},{"n":6,"q":"1858 年（安政5）、凶作（きょうさく）で米の値上がりに苦しむ人々が藩（はん）の米を出してくれるよう、卯辰山（うたつやま）から金沢城の殿様（とのさま）にさけんで救済をうったえた。このような、当時禁止されていた直訴（じきそ）によって処刑された人たちために作られたものは何か。","o":["七稲地蔵（なないねじぞう）","天保義民の碑（てんぽうぎみんのひ）","寺島蔵人（てらしまくらんど）の墓","金沢仏壇（かなざわぶつだん）"],"a":1,"e":"このさけび声は殿様の耳にも届き、翌日（よくじつ）殿様は藩の米蔵(こめぐら)からお救い米を放出するように命じた。この一揆（いっき）を「泣き一揆」という。","g":"歴史"},{"n":7,"q":"金沢市の市街地近郊では、米や野菜、果物などさまざまな作物が生産されている。その中で、金沢の風土を活かして生産された「金沢そだち」と呼ばれている作物の組み合わせとして正しいものはどれか。","o":["さつまいも・にんじん・しいたけ","だいこん・すいか・なし","だいこん・さつまいも・いちご","すいか・じゃがいも・かぶら"],"a":2,"e":"「金沢そだち」は、金沢市の風土を活かして生産された優れた農産物を認証する制度である。現在、だいこん、すいか、なし、トマト、きゅうりの5品目が認証されており、地元の農業振興（のうぎょうしんこう）と消費拡大を図っている。","g":"市政・最近の話題"},{"n":8,"q":"宮崎友禅斎（みやざきゆうぜんさい）は、京都から金沢に移り住み、金沢に友禅染（ゆうぜんぞめ）を伝え「加賀友禅（かがゆうぜん）」を作り出した。仕上がりまでの工程のうち、生地についている糊（のり）や余分な染料を洗い流す工程を何というか。","o":["無地染め（むじぞめ）","虫食い","友禅流し","平象嵌（ひらぞうがん）"],"a":3,"e":"仕上がりまで 14 の工程があり、生地についている糊や余分な染料を洗い流す工程は、「友禅流し」といって今でも浅野川などで見られる金沢の冬の風物詩（ふうぶつし）である。","g":"美術・工芸・芸能"},{"n":9,"q":"金沢市民芸術村は、市民が自主的に企画したコンサートや芸術の練習の場として開放されている。この施設が整備される前、もともとこの場所にあった施設は何か。","o":["紡績工場","陸上競技場","小学校","バスターミナル"],"a":1,"e":"金沢市民芸術村は、かつて大和紡績（だいわぼうせき）金沢工場として操業していた紡績工場の跡地を活用して整備された文化施設である。赤レンガ造りの建物を再利用し、市民が演劇や音楽、美術などの芸術活動を行える場として開放されている。","g":"市政・最近の話題"},{"n":10,"q":"江戸時代、加賀藩の下級武士の生活は苦しく、家計を支えるために仕事の合間をぬって、家族とともに内職に励んでいた。下級武士の内職でつくられていたものはどれか。","o":["そろばん","げた","ひな人形","ちゃぶ台"],"a":3,"e":"他にも、生活用品として、お盆用の切子灯籠（きりことうろう）、正月に飾る灯籠（とうろう）や玩具、果物などもつくられた。","g":"偉人・人物"},{"n":11,"q":"金沢では、四季折々の和菓子が生活に彩りと美を添えている。その中で、お正月に欠かせない、外の皮をむくと中におみくじが入っている金沢独特の和菓子はどれか。","o":["金花糖（きんかとう）","五色生菓子（ごしきなまがし）","氷室饅頭（ひむろまんじゅう）","辻（つじ）うら"],"a":4,"e":"金沢のお正月に食べられる縁起菓子である。砂糖と餅粉（もちこ）を混ぜて花のような形に包み、中には小さなおみくじが入っている。正月の時期にのみ出回り、金沢近郊で親しまれている。","g":"食・行事"},{"n":12,"q":"江戸幕府2代将軍徳川秀忠（とくがわひでただ）の二女として生まれ、徳川、前田両家を結ぶため加賀藩3代藩主前田利常（まえだとしつね）のもとに嫁（とつ）いだ姫はだれか。","o":["珠姫（たまひめ）","千姫（せんひめ）","溶姫（ようひめ）","亀鶴姫（かめつるひめ）"],"a":1,"e":"珠姫は、利常との間に8人の子を生んだあと、体の調子が悪くなり 24 歳の若さで亡くなった。亡くなった珠姫は「天徳院」（てんとくいん）と呼ばれ、利常はその名のお寺を小立野につくった。","g":"偉人・人物"},{"n":13,"q":"1900 年（明治 33）津田米次郎（つだよねじろう）が発明し、日本初の羽二重［なめらかでつやのあるうすい絹織物］を織る機械として、第5回内国勧業大博覧会（ないこくかんぎょうだいはくらんかい）に出品され、多大な賞賛（しょうさん）を博したこの機械とは何か。","o":["くり糸機","力織機（りきしょっき）","足踏み式ミシン","活版印刷機（かっぱんいんさつき）"],"a":2,"e":"1918 年（大正7）には津田米次郎の功績（こうせき）がたたえられ、米次郎の銅像が卯辰山（うたつやま）に建てられた。現在の津田駒工業（つだこまこうぎょう）は米次郎の義理の甥（おい）、駒次郎（こまじろう）がつくったものである。","g":"美術・工芸・芸能"},{"n":14,"q":"2015 年（平成 27）に北陸新幹線が金沢まで開通し、仕事や観光で金沢を訪れる人が増えた。観光地として人気のある金沢では、まちの観光案内をしているボランティアがいる。このボランティアは、次のうちどれか。","o":["いんぎらさん","おんぼらさん","りくつさん","まいどさん"],"a":4,"e":"「まいどさん」とは、金沢を訪れた観光客に対して、名所や道案内などを行うボランティアである。親しみやすい名称で、観光都市・金沢の魅力を伝える役割を担っている。","g":"市政・最近の話題"},{"n":15,"q":"718 年（養老2）に立国した能登国（のとのくに）は大きな港があり、早くから大陸との交流を行っていた。日本海の対岸（たいがん）に位置し、能登国と交流していた国とはどこか。","o":["渤海（ぼっかい）","新羅（しらぎ）","契丹（きったん）","唐（とう）"],"a":1,"e":"渤海は唐から独立した国で唐に対抗するため日本との交流を進めたといわれている。金沢市の戸水遺跡（とみずいせき）・畝田遺跡（うねだいせき）などから渤海交流のあとがうかがえる。","g":"歴史"},{"n":16,"q":"金沢には多くの川が流れており、かつては舟によって物資や人が運ばれていた。なかでも加賀藩の年貢米を運ぶために利用された川はどれか。","o":["大野川（おおのがわ）","木曳川（きびきがわ）","森下川（もりもとがわ）","手取川（てどりがわ）"],"a":3,"e":"森下川は、金沢市の北部を流れる小さな川で、かつては舟運に利用され、年貢米などの物資の輸送に重要な役割を果たしていた。","g":"寺社・建造物・まち"},{"n":17,"q":"近年の発掘調査（はっくつちょうさ）の結果、縄文人が高度な建築技術と深い精神世界を持っていたことが証明されている。日本で初めてクリの巨大木柱根（きょだいもくちゅうこん）350 本以上が発見された金沢の遺跡（いせき）はどこか。","o":["畝田遺跡（うねだいせき）","北塚遺跡（きたづかいせき）","七ツ塚遺跡（ななつづかいせき）","チカモリ遺跡"],"a":4,"e":"チカモリ遺跡は全国的にも注目をあび、国指定史跡となっている。毎年、夏休みに「チカモリ縄文まつり」という古代体験まつりが開かれている。","g":"歴史"},{"n":18,"q":"兼六園（けんろくえん）は江戸時代の代表的な大名庭園であり、6つの優れた点を兼ね備えている庭という意味で名づけられたといわれている。この名がつけられたのはどの藩主の時代か。","o":["5代藩主前田綱紀（まえだつなのり）","11 代藩主前田治脩（まえだはるなが）","12 代藩主前田斉広（まえだなりなが）","13 代藩主前田斉泰（まえだなりやす）"],"a":3,"e":"兼六園は一度につくられたのではなく、5代藩主前田綱紀の別荘の茶室や庭が始まりとなり、1759 年（宝暦9）の大火で焼失した後、1774 年（安永3）11 代藩主前田治脩が4つの亭（ちん）や滝を作って庭を復旧させ、12 代藩主前田斉広が竹沢御殿（たけざわごてん）を建てた。","g":"寺社・建造物・まち"},{"n":19,"q":"金沢市は、古くから海産物が豊富で漁業も盛んな町である。漁獲量が多い金沢港に設けられた、地元で水揚げされた新鮮な海産物を直売している施設は何か。","o":["近江町市場（おうみちょういちば）","金沢中央卸売市場（かなざわちゅうおうおろしうりしじょう）","金沢港クルーズターミナル","金沢港いきいき魚市（うおいち）"],"a":4,"e":"金沢港いきいき魚市は、金沢港に隣接する鮮魚市場である。地元で水揚げされた新鮮な魚介類が並び、漁師や仲卸業者が直接販売している。観光客だけでなく、地元の人々にも親しまれており、鮮度と価格の良さが魅力である。","g":"市政・最近の話題"},{"n":20,"q":"馬車鉄道しかなかった金沢に電車が走ったのは 1914 年（大正3）のことである。市内電車で初めて開通した路線はどれか。","o":["兼六園下～小立野","武蔵ヶ辻～香林坊","金石（かないわ）～長田","広小路～寺町"],"a":3,"e":"1914 年（大正3）に金石電鉄、1915 年（大正4）に石川電鉄［現在の北陸鉄道石川線］、1919 年（大正8）には金沢停車場～兼六園下間にも電車が開通し、この新しい電車を見ようとする人々が街にあふれた。","g":"歴史"},{"n":21,"q":"金沢には、金沢市無形民俗文化財（かなざわしむけいみんぞくぶんかざい）に指定された伝統行事が今もたくさん残っている。斧（おの）や刀、弓を持った山伏（やまぶし）が各家をまわる悪魔払い（あくまばらい）が行われているのはどこか。","o":["小立野","東長江町（ひがしながえまち）","八田町","大野・金石（かないわ）"],"a":4,"e":"各家の悪魔払いをする時には、家の中に入らんばかりの勢いで悪魔を払うまねをするので、子どもたちが泣きさけんで家の奥（おく）に、にげこむ様子が見られる。","g":"美術・工芸・芸能"},{"n":22,"q":"加賀藩5代藩主前田綱紀（まえだつなのり）は、学問を好み、国中の貴重な書物を集めることに力を注ぎ、綱紀自身も勉強したので学者としてもよく知られるようになった。「加賀は天下の書府」とほめたたえた江戸時代の有名な学者はだれか。","o":["木下順庵（きのしたじゅんあん）","新井白石（あらいはくせき）","井上若水（いのうえじゃくすい）","本居宣長（もとおりのりなが）"],"a":2,"e":"前田綱紀の時代を中心に利常の時代から集められた書物は、質・量ともにずば抜けたものとなり、尊経閣（そんけいかく）文庫と呼ばれ、今に残されている。","g":"偉人・人物"},{"n":23,"q":"金沢は、藩政時代から今日まで、様々な分野で活躍する人々を育んできた。タカジアスターゼの発明とアドレナリンの発見をした人はだれか。","o":["木村栄（きむらひさし）","高峰譲吉（たかみねじょうきち）","八田與一（はったよいち）","磯田謙雄（いそだのりお）"],"a":2,"e":"タカジアスターゼは、強い消化効力のある胃腸薬（いちょうやく）である。この薬は、微生物（びせいぶつ）を利用した薬づくりの手本となった。","g":"偉人・人物"},{"n":24,"q":"日本海から下関をまわり、瀬戸内海を通って大坂［今の大阪］に行く船を、瀬戸内の人々は「北前船」（きたまえぶね）と呼んだ。この北前船の船主は、大坂や瀬戸内からの荷物を、日本海沿いに蝦夷地（えぞち）［今の北海道］まで運び、莫大（ばくだい）な利益を上げた。この当時一代で約3百万両にのぼる富を築いたとされる宮越（みやのこし）［今の金石（かないわ）］の豪商はだれか。","o":["木谷藤右衛門（きやとうえもん）","大野弁吉（おおのべんきち）","黒川良安（くろかわまさやす）","銭屋五兵衛（ぜにやごへえ）"],"a":4,"e":"この北前船の文化をストーリーとして、文化庁が認定した日本遺産「荒波を超えた男たちの夢が紡いだ（つむいだ）異空間～北前船寄港地・船主集落（ふなぬししゅうらく）～」に 2019 年（令和元）、金沢市が追加認定された。","g":"偉人・人物"},{"n":25,"q":"金沢の気候は、梅雨や台風の時期、そして冬に多くの雨や雪が降るのが特徴である。特に冬の降水量が多いこのような気候を何というか。","o":["地中海性気候","亜熱帯気候","日本海側気候","高山気候"],"a":3,"e":"日本海側の気候は、冬に雪や雨が多く降るのが特徴である。金沢もこの気候に属しており、梅雨や台風の季節にも降水量が多い。こうした気候のため、雪に備えたくらしの工夫が地域に根付いている。","g":"自然・産業"},{"n":26,"q":"兼六園に接し、緑に囲まれた「本多の森」に3棟（とう）の赤レンガづくりの建物がある。この建物は、戦争中は兵器の倉庫として使われ、平和な時代を迎えた 1946 年（昭和 21）からは、金沢美術工芸専門学校［のちの金沢美術工芸大学］の校舎として利用されていた。現在、この建物は何に使われているか。","o":["金沢大学","石川県立歴史博物館","金沢能楽美術館","鈴木大拙館（すずきだいせつかん）"],"a":2,"e":"石川県立歴史博物館は、石川の古代から近代までの歴史と文化を紹介する博物館で、1990 年（平成2）に重要文化財に指定されている。","g":"寺社・建造物・まち"},{"n":27,"q":"明治時代のなかば頃には、教室の中での学習だけでなく、さまざまな行事が学校で行われるようになった。ある学校では「撃剣野仕合（げっけんのじあい）」「西洋鬼（せいようおに）」「武者修業（むしゃしゅぎょう）」とよばれる活動が行われた。この行事とは何か。","o":["運動会","文化祭","遠足","卒業式"],"a":1,"e":"このような種目名がつけられたのは、明治時代におこった日清戦争・日露戦争が大きく影響しており、「武者修業」は一瞬で武装を整え、ゴールを目指して走って行く競技のことを指す。","g":"歴史"},{"n":28,"q":"1669 年（寛文9）、加賀では夏から秋にかけ暴風雨（ぼうふうう）のため洪水になった。5万8千石の田が大きな被害を受け、貧乏で生活に困る人がたくさん出た。5代藩主前田綱紀（まえだつなのり）が、困っている人を収容するために造った施設を何というか。","o":["養生所（ようじょうしょ）","明倫堂（めいりんどう）","経武館（けいぶかん）","お救（すく）い小屋"],"a":4,"e":"お救い小屋は、施設や作業場を設け、乞食（こじき）や浮浪者（ふろうしゃ）、病気で日常生活ができない人たちを収容（しゅうよう）した。そして、食料をはじめ夏や冬の衣類を与えて、自立できるように援助した。当時、全国的にも例のないものであった。","g":"歴史"},{"n":29,"q":"高齢化や交通の不便さといった地域の課題を受けて、金沢市ではせまい道でも走れる小型バスを導入し、地域のくらしを支える交通手段を整えている。此花（このはな）・菊川（きくがわ）・材木（ざいもく）・長町（ながまち）の4ルートがあるこのバスはどれか。","o":["金沢循環（じゅんかん）バス","ふらっとバス","金沢まちバス","兼六園シャトルバス"],"a":2,"e":"「ふらっとバス」は、金沢のせまい道にも入り込める小型バスで、通常の路線バスが通らない地域を巡回している。市民の日常的な移動を支える交通手段として、利用価値が高く、多くの人に親しまれている。","g":"市政・最近の話題"},{"n":30,"q":"2014 年（平成 26）、金沢市は「めざすべき金沢の子ども像」をつくり、大切にしたい子どもの姿を示した。これについて、金沢市内の中学生が自分たちにもわかりやすく覚えやすい言葉で表した宣言はどれか。","o":["金沢子どもまんなか宣言","金沢子ども人権宣言","金沢子ども応援宣言","金沢子どもかがやき宣言"],"a":4,"e":"「金沢子どもかがやき宣言」は、「めざすべき金沢の子ども像」をもとに、中学生が考えた宣言である。子どもが自らの生き方や思いを前向きに表現できるよう、覚えやすく親しみやすい言葉でまとめられている。","g":"市政・最近の話題"},{"n":31,"q":"金沢市の東部にある医王山（いおうぜん）や南部の平栗（ひらぐり）では、ニホンカモシカやギフチョウといった、めずらしい動物が見られる。これらの動物がすんでいるのは、自然が多く残されているためである。では、金沢市の面積のうち、森林が占めるおよその割合はどれか。","o":["約1割","約3割","約6割","約9割"],"a":3,"e":"金沢は市民にとっても動植物にとっても過ごしやすい場所がいたるところに残された自然豊かなまちである。","g":"自然・産業"},{"n":32,"q":"1925 年（大正 14）、平沢嘉太郎は浅野川電鉄との協力で、巨額の資本を投じ劇場、料亭（りょうてい）、レストラン、動物園、大浴場、野球場などを備えた一大レジャー施設を建設した。この施設が作られたのはどこか。","o":["粟崎（あわがさき）","香林坊","金石（かないわ）","小立野"],"a":1,"e":"この施設は「粟崎遊園」（あわがさきゆうえん）と呼ばれ、川上一郎を座長とする専属の劇団「粟崎大衆座」（あわがさきたいしゅうざ）や宝塚（たからづか）をまねた「粟崎少女歌劇（あわがさきしょうじょかげき）」も組織され、人々の娯楽の場となった。","g":"寺社・建造物・まち"},{"n":33,"q":"金沢市は、伝統工芸が盛んな地域であり、特に金箔の生産で知られている。金沢市の金箔の生産量は、全国で何位か。","o":["1位","2位","3位","4位"],"a":1,"e":"金沢市は、日本の金箔生産量の約 99％を占める全国第1位の産地である。湿度の高い気候や加賀藩時代からの技術の継承が、金箔製造に適している。金沢の金箔は、工芸品や建築装飾、食品など多くの分野で使用されている。","g":"美術・工芸・芸能"},{"n":34,"q":"金沢の地名は、芋掘藤五郎が金城霊沢で砂金を洗ったことから、その名がついたと伝えられている。その芋堀藤五郎の嫁に来た大和の長者の娘の名前は次のどれか。","o":["明子（あきこ）","和子（わこ）","正子（まさこ）","令子（れいこ）"],"a":2,"e":"芋掘藤五郎の伝説は、奈良時代前期頃に採鉱者（さいこうしゃ）や鋳物師（いもじ）などによって伝えられていった「炭焼き長者」の伝説がもとになって作られたといわれている。","g":"歴史"},{"n":35,"q":"金沢では、藩政時代からの文化が今もたくさん残っている。能楽師の大石藤五郎が定着させた、能楽の影響をうけた、ユーモアのある祝いの舞や語りをする伝統文化を何というか。","o":["加賀獅子","山王悪魔払い","加賀万歳","ジョンカラ節"],"a":3,"e":"加賀万歳や八田町のさかたおどりは金沢市無形民俗文化財（かなざわしむけいみんぞくぶんかざい）に指定されている。","g":"美術・工芸・芸能"},{"n":36,"q":"金沢市は世界の7都市と姉妹都市提携を結び、多くの交流事業を行っている。これら7つの姉妹都市を紹介するコーナーを持つ、駅西新町にある公園は何か。","o":["金沢国際交流公園","四十万きずな広場","額谷ふれあい公園","姉妹都市公園"],"a":4,"e":"姉妹都市公園は、金沢市と姉妹都市提携を結ぶ7都市の文化や風景を再現したゾーンを持つ公園である。各都市の特徴を感じながら、国際交流の大切さや多様な文化について学ぶことができる。","g":"市政・最近の話題"},{"n":37,"q":"1546 年（天文 15）に成立した金沢御堂（かなざわみどう）は、1580 年（天正8）に猛攻（もうこう）にあって落とされた。金沢御堂を攻め、そのまま居城（きょじょう）としたのはだれか。","o":["柴田勝家（しばたかついえ）","前田利家（まえだとしいえ）","佐久間盛政（さくまもりまさ）","佐々成政（さっさなりまさ）"],"a":3,"e":"佐久間盛政の次に入城した前田利家がある日、広間の上を見たところ、棟木（むなぎ）に結いつけてある阿弥陀仏（あみだぶつ）を見つけた。盛政の猛攻にあった金沢御堂の坊官（ぼうかん）がとりあえず本尊（ほんぞん）を天井裏に結いつけた後、戦いに走っていったといわれている。","g":"歴史"},{"n":38,"q":"華やかな絵付けが特徴の九谷焼（くたにやき）は、金沢を代表する伝統工芸の一つである。その色彩には「九谷五彩（くたにごさい）」と呼ばれる5つの色が使われており、作品に独特の美しさと深みを与えている。この九谷五彩の組み合わせとして正しいものはどれか。","o":["赤・黄・緑・茶・紺青（こんじょう）","赤・黄・緑・黒・紺青","赤・黄・緑・紫・紺青","赤・黄・緑・橙（だいだい）・紺青"],"a":3,"e":"九谷焼の上絵付けに使われる「九谷五彩」は、赤・黄・緑・紫・紺青の5色である。これらの色は、焼成後に鮮やかな発色を見せ、器に独特の美しさを与えている。この色彩は、九谷焼の特徴である華やかで重厚な絵付けを生み出している。","g":"美術・工芸・芸能"},{"n":39,"q":"東京オリンピック開催前の開館をめざして、日本海側初の国立美術館として金沢に移転してきたのは次のうちどれか。","o":["国立工芸館","国立新美術館","金沢 21 世紀美術館","京都国立近代美術館"],"a":1,"e":"国立工芸館［当時の東京国立近代美術館工芸館］は、2020 年（令和2）に東京から金沢へ移転し、日本海側で初めての国立美術館として開館した。陶芸・染織（せんしょく）・漆工（しっこう）など日本の工芸作品を展示している。","g":"市政・最近の話題"},{"n":40,"q":"金沢の北部には、弥生時代（紀元前 300 年～紀元後 300 年）に玉造のムラ［玉をつくる産地］があり、鉄製の農具や工具が発見されている。それは次のどの遺跡か。","o":["富樫遺跡","塚崎遺跡","小立野遺跡","森本・東金沢遺跡"],"a":2,"e":"弥生人や古墳時代の人々は、碧玉（へきぎょく）［宝石の一種］製の管玉（くだたま）をネックレスとして使っていた。これは、おしゃれのためというよりも呪術的（じゅじゅつてき）な意味が込められていたと考えられている。","g":"歴史"},{"n":41,"q":"金沢市では、スポーツを盛んにすることで、まちの活力を高めようとしている。2018 年（平成 30）金沢市スポーツ文化推進条例により、スポーツを行うことに加え、ホームタウンチームと市民が交流できるような活動の支援を積極的に進めている。金沢市のホームタウンチーム金沢武士団（かなざわさむらいず）のスポーツの種目はどれか。","o":["野球","サッカー","バレーボール","バスケットボール"],"a":4,"e":"金沢武士団という名称は一般公募（いっぱんこうぼ）で多数あったキーワード「金沢」「武士」「サムライ」から名付けられた。","g":"市政・最近の話題"},{"n":42,"q":"城下町の金沢と他の町や地域を結ぶ街道には、北国街道とそれに連なる脇街道があった。北国街道でも泉新町、犀川大橋を通って福井方面に行く道は何と呼ばれたか。","o":["北口","上口（かみくち）","下口（しもくち）","南口"],"a":2,"e":"金沢城下（かなざわじょうか）の北国街道は上口と呼ばれる泉新町から、犀川大橋-片町-香林坊-南町-堤町（つつみちょう）-尾張町（おわりちょう）-橋場町-浅野川大橋を通り、下口と呼ばれる大樋町を過ぎていく。","g":"寺社・建造物・まち"},{"n":43,"q":"古墳時代は、4～7世紀頃、豪族が権力の大きさを古墳の大きさや形で表そうとした時代である。金沢市で作られた一番大きな古墳はどれか。","o":["北塚町おまる塚古墳（きたづかまちおまるづかこふん）","南塚町びわ塚古墳（みなみづかまちびわづかこふん）","長坂二子塚古墳（ながさかふたごづかこふん）","才田町おちん山古墳（さいだまちおちんやまこふん）"],"a":3,"e":"長坂二子塚古墳は一番大きな古墳であったが、区画整理により消滅した。","g":"歴史"},{"n":44,"q":"1689 年（元禄2）、松尾芭蕉（まつおばしょう）は「奥の細道（おくのほそみち）」の旅の途中、金沢に立ちよった。そのときに、芭蕉は金沢のある俳人（はいじん）の菩提寺（ぼだいじ）に参ったが、その俳人だれか。","o":["小杉一笑（こすぎいっしょう）","秋の坊（あきのぼう）","亀田小春（かめだしょうしゅん）","立花北枝（たちばなほくし）"],"a":1,"e":"松尾芭蕉は、小杉一笑の死を悼（いた）んで、「塚（つか）も動けわが泣く声は秋の風」という句をよんだ。","g":"文学"},{"n":45,"q":"金沢市内には何本かの川が流れ荷物の流通に使われた。宮腰（みやのこし）［今の金石（かないわ）］から主に木材を運ぶために使われたのは何川か。","o":["桂川（かつらがわ）","木曳川（きびきがわ）","木津川（きづがわ）","木曽川（きそがわ）"],"a":2,"e":"木曳川では名前のとおり木材が運ばれ、終点は木倉町であった。","g":"寺社・建造物・まち"},{"n":46,"q":"加賀藩では、代々の藩主たちが、武士のたしなみとして積極的に能楽を取り入れた。加賀藩5代藩主前田綱紀（まえだつなのり）が江戸幕府5代将軍徳川綱吉（とくがわつなよし）の影響を受けて、能楽を愛好（あいこう）し、加賀のついた名前で栄えた。それはどの流派か。","o":["金春（こんぱる）","喜多（きた）","宝生（ほうしょう）","観世（かんぜ）"],"a":3,"e":"加賀宝生といわれ、金沢では能は庶民の楽しみの一つとしても広まった。","g":"美術・工芸・芸能"},{"n":47,"q":"加賀藩3代藩主前田利常（まえだとしつね）は、藩の安定した税［米の年貢］を手に入れるために新しい農政を考えた。次のどれか。","o":["農政新法","農業新政","改作仕法","改農新法"],"a":3,"e":"改作仕法により、藩士（はんし）たちは農民から勝手に税を取ることができなくなった。また、藩は新田開発に力を入れるようになり、加賀藩の基本農業制度となった。","g":"歴史"},{"n":48,"q":"加賀藩 14 代藩主前田慶寧（まえだよしやす）は加賀藩の人々が豊かに生活できるようにと卯辰山の開発に取り組み、様々な施設を作った。オランダ医学者の黒川良安（くろかわまさやす）が中心となった診察所、製薬局、調剤所などが備えられた施設はどれか。","o":["養生所（ようじょうしょ）","撫育所（ぶいくしょ）","卯辰神社","所作所（しょさしょ）"],"a":1,"e":"養生所に治療（ちりょう）に来る人たちの中でも極（きわ）めて貧（まず）しい人たちは、その衣食代や薬代は無料とされた。","g":"歴史"},{"n":49,"q":"加賀藩3代藩主前田利常（まえだとしつね）が、京都から五十嵐道甫（いがらしどうほ）、江戸から清水九兵衛（しみずくへい）などの名人をまねいて、技術（ぎじゅつ）を伝えたのが始まりといわれている、漆塗り（うるしぬり）の上に金や銀で絵模様（えもよう）をえがいたものを何と呼ぶか。","o":["加賀蒔絵（かがまきえ）","加賀友禅（かがゆうぜん）","加賀象嵌（かがぞうがん）","加賀繍（かがぬい）"],"a":1,"e":"加賀蒔絵は江戸蒔絵のはなやかさとはちがい、京都の伝統と加賀の武士の文化をミックスさせた、とても格調高いものになった。","g":"美術・工芸・芸能"},{"n":50,"q":"金沢市は、2023 年（令和5）に国連環境計画の「都市生態系再生モデル都市」として認定されるなど、生物多様性のために様々な計画を進めてきた。市内の子どもや大人が協力し、毎年、ある昆虫の調査を行い、生息地図をつくっているが、その昆虫は何か。","o":["はち","カブトムシ","ミミズ","ホタル"],"a":4,"e":"金沢市ではホタルの生息調査をもとに「ホタルマップ」を作成しており、観察をとおして、身近な自然の大切さや豊かさを学習することができる。","g":"市政・最近の話題"}]},{"id":"j18c","label":"第18回ジュニア（中学生版）2024","q":[{"n":1,"q":"金沢では、弥生時代（紀元前 300 年～紀元後 300 年）の広大な集落遺跡が発見されている。それはどの遺跡か。","o":["富樫（とがし）遺跡","西念・南新保遺跡","小立野遺跡","森本・東金沢遺跡"],"a":2,"e":"「西念・南新保遺跡」は遺構（いこう）や道具が良好な状態で発掘されている。中でも精巧（せいこう）な細工のある木製高坏（たかつき）などが全国的にも注目された。","g":"歴史"},{"n":2,"q":"金沢市内には、南東から北西に向かって犀川（さいがわ）と浅野川（あさのがわ）の2つの川が流れており、犀川の南側には寺町台地が広がり、浅野川の北側には卯辰山（うたつやま）がある。これら2つの川の間の突端に位置し、金沢城が建てられた台地の名前はどれか。","o":["富樫（とがし）台地","長坂丘陵（きゅうりょう）","戸室（とむろ）山地","小立野（こだつの）台地"],"a":4,"e":"金沢の地形は、西部の海岸に向かって丘陵地（きゅうりょうち）から平野へと変化し、次第になだらかになっている。","g":"寺社・建造物・まち"},{"n":3,"q":"金沢は、加賀藩（はん）のころから学問や芸術が盛んで、明治以降も文化面で優れた人物を輩出（はいしゅつ）してきた。なかでも「金沢の三文豪（さんぶんごう）」とされている3人とは誰（だれ）か。","o":["室生犀星（むろおさいせい）・泉鏡花（いずみきょうか）・鈴木大拙（すずきだいせつ）","室生犀星・西田幾多郎（にしだきたろう）・徳田秋声（とくだしゅうせい）","泉鏡花・徳田秋声・室生犀星","泉鏡花・西田幾多郎・鈴木大拙"],"a":3,"e":"それぞれの代表作として、徳田秋声は「黴（かび）」「あらくれ」、泉鏡花は「義血侠血（ぎけつきょうけつ）」「高野聖（こうやひじり）」、室生犀星は「抒情小曲集（じょじょうしょうきょくしゅう」「幼年時代」などがある。","g":"文学"},{"n":4,"q":"大和朝廷の頃、金沢平野に大陸からの使節に大和の天皇だと偽（いつわ）り、貢（みつ）ぎ物を横領（おうりょう）した豪族がいた。それは誰か。","o":["加賀君（かがのきみ）","金沢君（かなざわのきみ）","道君（みちのきみ）","近江君（おうみのきみ）"],"a":3,"e":"『日本書紀（にほんしょき）』に記述があり、この事件のあとに、道君はきびしく問いつめられ、完全に大和朝廷に従ったと見られる。","g":"歴史"},{"n":6,"q":"金沢城跡（じょうあと）の発掘（はっくつ）調査で見つかった土から発見された出土品により、金沢で縄文時代以前に人間が活動していたことが確認された。この旧石器時代（きゅうせっきじだい）の出土品として見つかったものは何か。","o":["銅剣（どうけん）","銅鏡（どうきょう）","土器","石器"],"a":4,"e":"発掘調査（はっくつちょうさ）で出た土を金沢城の整地に用いていたが、その中に使用した跡（あと）のある石器がふくまれていた。小立野台地（こだつのだいち）は当時の人々が、狩りをしたところであったと考えられている。","g":"寺社・建造物・まち"},{"n":7,"q":"富樫氏守護時代の終り頃、加賀の土豪（どごう）や浄土真宗の坊主が中心になり、富樫氏に代わり加賀国を治めるようになった時代があった。このようすに、他国の人たちは加賀国のことを何と呼んだか。","o":["坊主の持ちたる国","百姓の持ちたる国","土豪（どごう）の持ちたる国","一揆（いっき）の持ちたる国"],"a":2,"e":"他国では守護大名、戦国大名などの武士による政治であったのとくらべて、あまりにもちがっており、百姓の持ちたる国のようになったと評判になった。","g":"歴史"},{"n":8,"q":"加賀藩（はん）初代藩主前田利家（まえだとしいえ）が越前（えちぜん）を治めていた頃（ころ）、領民がお祝いにおどっていたおどりが金沢に移り、能楽の影響（えいきょう）を受け、舞（まい）や語りに品格（ひんかく）があるものとして定着し、金沢市民の伝統芸能活動となったものはどれか。","o":["加賀万歳（かがまんざい）","奴（やっこ）行列","寺中神事能（じちゅうしんじのう）","ジョンカラ節"],"a":1,"e":"「加賀万歳」は、能楽師（のうがくし）の大石藤五郎（おおいしとうごろう）が定着させたため、能楽の影響（えいきょう）を受け、舞（まい）や語りはユーモアある中にも品格があり、金沢市無形民俗（みんぞく）文化財に指定されている。","g":"美術・工芸・芸能"},{"n":9,"q":"1584 年（天正 12）に起こった末森（すえもり）の戦いは、加賀藩（はん）初代藩主前田利家（まえだとしいえ）と越中（えっちゅう）の誰との戦いであったか。","o":["徳川家康（とくがわいえやす）","豊臣秀吉（とよとみひでよし）","柴田勝家（しばたかついえ）","佐々成政（さっさなりまさ）"],"a":4,"e":"この末森の戦いは、豊臣秀吉の天下統一を進めるうえで大きな役割を果たした。利家にとっても加賀、能登、越中を治めるきっかけになった。","g":"歴史"},{"n":10,"q":"14 世紀に入ると、仕事に専門の職人達が生まれ、その商品を取引するため市（いち）が開かれました。現在の金沢市に含まれる場所として、当時の石川郡三日市の他にどこがあったか。","o":["五日市","六日市","七日市","八日市"],"a":4,"e":"石川郡三日市、八日市など沢山の市ができ、金沢寺内町（じないちょう）とともに経済の中心となった。","g":"歴史"},{"n":11,"q":"金沢には芋掘藤五郎（いもほりとうごろう）の伝説が残っている。この伝説で藤五郎が芋を洗ったとされている場所で、兼六園にある泉を何というか。","o":["金城霊沢（きんじょうれいたく）","霞ケ池（かすみがいけ）","瓢池（ひさごいけ）","蓮池（はすいけ）"],"a":1,"e":"金城霊沢は金洗沢（かなあらいのさわ）とも呼ばれ、「金沢」の地名はここから伝わったと言われている。また藤五郎があらった芋は、自然薯（じねんじょ）という山芋と言われている。","g":"寺社・建造物・まち"},{"n":12,"q":"1869 年（明治2）の版籍奉還（はんせきほうかん）によって加賀藩（はん）は金沢藩に、1871 年(明治4)の廃藩置県（はいはんちけん）によって金沢県と変わった。こうした中、県庁が金沢からある町へと移され、県名が石川県へと変わった。ある町とはどれか。","o":["内灘（うちなだ）","美川（みかわ）","松任（まっとう）","珠洲（すず）"],"a":2,"e":"石川郡の美川に移された時、県名が石川県に変わった。その後、県庁は再び金沢に戻ったが県名は金沢県には戻らなかった。","g":"歴史"},{"n":13,"q":"金沢でのＳＤＧs 推進に向けた具体的な取り組みとして、ＳＤＧs ミーティングを通じて、ＳＤＧsカフェの開催や市内イベントへの出展、ホームページを活用して多くのアイデアが集められた。これらのアイデアを総称して何というか。","o":["金沢ミライシナリオ","金沢アイデア","金沢ターゲット","金沢ＳＤＧs"],"a":1,"e":"持続可能な開発目標（ＳＤＧs）を達成するために、金沢で始まったプロジェクトを「IMAGINEKANAZAWA 2030」という。市民、地域、ＮＰＯ、企業、行政などさまざまな主体が集まり、今金沢が抱えている問題を一緒に考え、解決に向けて対話を重ねていく場を提供し、多様な主体がつながることで大きな力を生み出すことを促進（そくしん）している。","g":"市政・最近の話題"},{"n":14,"q":"城下町の金沢と他の町や地域を結ぶ街道には、北国街道とそれに連なる脇街道があった。北国街道の中でも大樋（おおひ）町を通って富山方面に行く道は何と呼ばれたか。","o":["北口","上口（かみくち）","下口（しもくち）","南口"],"a":3,"e":"金沢城下（じょうか）の北国街道は上口と呼ばれる泉新町から、犀川大橋－片町－香林坊－南町－堤（つつみ）町－尾張（おわり）町－橋場町－浅野川大橋を通り、下口と呼ばれる大樋町を過ぎていく。","g":"寺社・建造物・まち"},{"n":15,"q":"金沢の地域福祉（ふくし）活動の原点でもあり、生活相談や授産（じゅさん）・託児（たくじ）の援助など、地域の福祉・社会教育の拠点（きょてん）として 1934 年（昭和9）から建てられた施設はどれか。","o":["友好館","交流館","福祉館","善隣館（ぜんりんかん）"],"a":4,"e":"現在も高齢者福祉（こうれいしゃふくし）を中心に地域と密着（みっちゃく）した活動を続けています。","g":"市政・最近の話題"},{"n":16,"q":"金沢には、歴史ある旧町名や昔の地名が多く残っている。これらの旧町名や昔の地名が忘れ去られないように、その由来を刻んだ標柱（ひょうちゅう）は何と呼ばれているか。","o":["金沢まちしるべ","旧町名しるべ","歴史由来しるべ","歴史のまちしるべ"],"a":4,"e":"旧町名には、武士の住んでいた主馬町（しゅめまち）や玄蕃町（げんばまち）、職人の住んでいた鍛冶町（かじまち）や桶町（おけちょう）など、藩政（はんせい）時代の町の性格を表したものが数多くあった。","g":"寺社・建造物・まち"},{"n":17,"q":"金沢では清らかな水を利用して上質な和紙が生産されている。この和紙を使った、全国第 1 位の生産量をほこる金沢の特産品は何か。","o":["金沢漆器（しっき）","金箔（きんぱく）","加賀毛針（かがけばり）","九谷焼"],"a":2,"e":"金箔を作るためには、特別なじょうぶさをもった上質の和紙が必要で、清らかな水が豊富な金沢は、その和紙をつくる上でも良い条件がそろっていたとされる。","g":"美術・工芸・芸能"},{"n":18,"q":"金沢市内には何本かの川が流れ、荷物の流通に使われた。宮腰（みやのこし）［今の金石］から木曳川（きびきがわ）を使って運ばれたものは何か。","o":["米","木材","味噌","塩"],"a":2,"e":"木曳川では名前のとおり、木材が運ばれ、終点は木倉町であった。","g":"寺社・建造物・まち"},{"n":19,"q":"交通網（もう）の整備により地域の発展と活性化が進められている。金沢外環状（かんじょう）道路（山側幹線）と接続し、2004 年（平成 16）に開通した北陸自動車道のＩＣ（インターチェンジ）の名前を何というか。","o":["金沢森本ＩＣ","金沢西ＩＣ","金沢東ＩＣ","金沢港ＩＣ"],"a":1,"e":"2012 年（平成 24）4月には白山ＩＣが新設され、外環状道路（海側幹線）にも接続された。","g":"市政・最近の話題"},{"n":20,"q":"北陸新幹線は、2015 年（平成 27）に東京駅から金沢駅までの区間（くかん）で開業した。2024 年（令和6）の春には福井県のどこまで延伸（えんしん）開業したか。","o":["敦賀（つるが）駅","芦原（あわら）温泉駅","福井駅","越前たけふ駅"],"a":1,"e":"金沢と東京は江戸時代の参勤交代では約 13 日間、北陸新幹線開業前は約4時間かかっていたところ、約2時間 28 分で行き来できるようになった。","g":"市政・最近の話題"},{"n":21,"q":"藩政（はんせい）末期、金沢大野に「加賀の平賀源内（ひらがげんない）」といわれた大野弁吉（おおのべんきち）がいた。弁吉はたくさんのからくりや工芸品を残し、「優れたからくり師」といわれていた。弁吉の才能や仕事に援助（えんじょ）した豪商（ごうしょう）は誰か。","o":["高田久兵衛（たかだきゅうべえ）","木谷藤右衛門（きやとうえもん）","横山隆興（よこやまたかおき）","銭屋五兵衛（ぜにやごへえ）"],"a":4,"e":"大野弁吉は高い水準の科学知識を身につけた技術者でもあり、著書の「一東視窮録（いっとうしきゅうろく）」には、エレキテル・写真術・無尽灯（むじんとう）など、当時としては最新の知識がまとめられている。","g":"偉人・人物"},{"n":22,"q":"金沢の代表的な焼き物に九谷焼（くたにやき）と大樋焼（おおひやき）がある。九谷焼は大聖寺藩（だいしょうじはん）の御用窯（ごようがま）として江沼郡九谷村（えぬまぐんくたにむら）で初めて焼かれたことから、その名前が付けられた。この九谷焼の特色である上絵付け（うわえつけ）の五彩（ごさい）の組み合わせとして正しいものはどれか。","o":["赤・黄・緑・茶・紺青（こんじょう）","赤・黄・緑・黒・紺青","赤・黄・緑・紫・紺青","赤・黄・緑・橙（だいだい）・紺青"],"a":3,"e":"九谷庄三（くたにしょうざ）は五彩、花鳥山水（かちょうさんすい）を描いた彩色（さいしき）、金襴手（きんらんで）の技法を確立した。","g":"美術・工芸・芸能"},{"n":23,"q":"金沢にはたくさんの方言があるが、その中でも雪で「道がこおったようす」をあらわす方言はどれか。","o":["かんかんなまなま","きんかんなまなま","きんきんなまなま","こんこんなまなま"],"a":2,"e":"冬に雪道などが固まってつるつるになった状態を指す方言である。","g":"金沢ことば"},{"n":24,"q":"明治維新の時、石川県の県域（県が管理する地域）がたびたび変わった。1876 年（明治9）大石川県と呼ばれた時の県域は、現在の状況で表すとどの組み合わせになるか。","o":["石川県・富山県・新潟県","石川県・福井県・滋賀県","石川県・富山県・福井県","石川県・富山県・岐阜県"],"a":3,"e":"大石川県と呼ばれた時の県域は、1876 年（明治9）から 1881 年（明治 14）まで続いた。","g":"歴史"},{"n":25,"q":"室町時代、戦いや争いが絶え間なく起こり、人々が苦しく不安な生活を送っていた。そのなかで農民は作物がたくさんとれるよう工夫し、取れ高が増えてくると「どのように生きるか」「死んだ後はどうなるのか」を考えるようになった。このような時代に「南無阿弥陀仏（なむあみだぶつ）」をとなえることで極楽浄土（ごくらくじょうど）に往生（おうじょう）できると北陸にて布教を行った人物は誰か。","o":["親鸞（しんらん）","蓮如（れんにょ）","法然（ほうねん）","日蓮（にちれん）"],"a":2,"e":"本願寺（ほんがんじ）の蓮如は親鸞（しんらん）の教えをわかりやすく人々に伝え、誰からも親しまれた。金沢市内には、蓮如町（れんにょまち）、二俣本泉寺（ふたまたほんせんじ）、寿福寺（じゅふくじ）など蓮如にゆかりのある町やお寺がいくつも残っている。","g":"歴史"},{"n":26,"q":"水が豊富な金沢は、「用水のまち」としても知られている。市内には何本の用水が流れているか。","o":["30 本","45 本","55 本","70 本"],"a":3,"e":"金沢の用水の長さを全部合わせると約 150 キロメートルになる。","g":"寺社・建造物・まち"},{"n":27,"q":"第2次世界大戦中は、武器などの金属が不足したため、金属供出（きょうしゅつ）で寺の鐘や子供の三輪車までも供出させられたといわれる。そのため、本来は金属で作られるものを陶器や木、布で作ることがあった。特に陶器で作られたもので有名なものは何か。","o":["本立て","筆箱","バケツ","湯たんぽ"],"a":4,"e":"こども金沢市史には布製のバケツや陶器製の湯たんぽの写真が掲載されている。","g":"歴史"},{"n":28,"q":"金沢市は、スポーツを通じて人と街を元気にすることをめざしている。ただスポーツを行うだけでなく、「観る、応援（おうえん）する、語り合う」ことが日常生活にとけこみ、金沢の風土として受けつがれていくことを目的として、2018 年（平成 30）に金沢市が制定した条例は何か。","o":["金沢市体育施設（しせつ）条例","金沢市スポーツ文化推進（すいしん）条例","金沢市スポーツ広場条例","金沢市スポーツ基本（きほん）条例"],"a":2,"e":"条例は大きく5つの考え方と5つの項目から成り立っている。金沢市民が理解してともに同じ方向に進むために、スポーツ文化によって過去と未来を交差させるという目的がある。","g":"市政・最近の話題"},{"n":29,"q":"二俣（ふたまた）地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作り、それらは加賀藩主（はんしゅ）やその一族が公式儀礼（こうしきぎれい）や日常生活で利用していた。その伝統工芸品はどれか。","o":["ろうそく","和紙","友禅（ゆうぜん）","漆器（しっき）"],"a":2,"e":"和紙の里としての二俣は、利家が金沢城入城後の 1592 年（文禄1）、加賀藩御料紙（かがはんごりょうし）の指定産地（していさんち）になってから飛躍的に発展をとげた。","g":"美術・工芸・芸能"},{"n":30,"q":"金沢で開かれた第2回国民体育大会の開会式で披露され、一時期姿を消していましたが、1991 年（平成3）の第 46 回国体石川大会で演技され、翌年から小学校連合体育大会で表現運動として演じられている歌と体操はどれか。","o":["若い力","金沢市民の歌","石川県民の歌","国体の歌"],"a":1,"e":"現在も運動会や体育祭の時に演じられている。","g":"市政・最近の話題"},{"n":31,"q":"金沢気象台が観測（かんそく）を始めてから最大の積雪記録で、新雪総計 343 ㎝、最大積雪 181 ㎝を記録した北陸地方の大雪を何というか。","o":["昭和一八豪雪","昭和三八豪雪","昭和四八豪雪","昭和五八豪雪"],"a":2,"e":"1月 11 日から連日 20cm を超える雪が1月 27 日まで降り続いた。除雪作業は2月に入っても続き、市民生活がもとの状態に戻ったのは3月に入ってからだった。","g":"自然・産業"},{"n":32,"q":"金沢駅兼六園口（東口）にある観光の玄関口となっている建物は、（あ）ドーム、（い）門と呼ばれている。これらの正しい組み合わせはどれか。","o":["（あ）－もてなし（い）－太鼓（たいこ）","（あ）－かんげい（い）－太鼓","（あ）－もてなし（い）－鼓（つづみ）","（あ）－かんげい"],"a":3,"e":"（い）－鼓洗練された現代的な都市としての姿は観光都市金沢の魅力（みりょく）の1つとなっており、2013年（平成 25）には「世界で最もすばらしい駅」ベスト 10 に選出された。","g":"寺社・建造物・まち"},{"n":33,"q":"加賀藩（はん）3 代藩主前田利常（まえだとしつね）は世の中が戦（いくさ）のない時代に移りつつあることを感じとり、いち早く藩内の産業の振興（しんこう）と文化の発展につくした。前田利常が行った政策はどれか。","o":["お救い小屋（おすくいごや）の設置","辰巳用水（たつみようすい）の設置","明倫堂（めいりんどう）の設置","浄水場（じょうすいじょう）の設置"],"a":2,"e":"当時は小立野（こだつの）台地の先端（せんたん）にある金沢城まで水がゆきわたらず、防火用水（ぼうかようすい）が不足していた。そこで利常は小松の町人板屋兵四郎（いたやへいしろう）に命じて辰巳用水をつくらせた。","g":"寺社・建造物・まち"},{"n":34,"q":"加賀藩（はん）5代藩主前田綱紀（まえだつなのり）は、学問を好み、国内の貴重な書物を収集することに力を注いだ。収集できない書物は写本（しゃほん）を作成して集め、大切に保存した。このようにして集められた文庫を何というか。","o":["前田文庫","金沢文庫","加賀文庫","尊経閣（そんけいかく）文庫"],"a":4,"e":"江戸時代を代表する学者として有名な新井白石（あらいはくせき）は、「加賀は天下の書府（しょふ）」であるとほめたたえた。","g":"歴史"},{"n":35,"q":"1689 年（元禄 2）、松尾芭蕉（まつおばしょう）は「奥の細道」（おくのほそみち）の旅の途中、金沢に立ち寄った。その際、芭蕉に会うのを楽しみにしながら前年に亡くなった小杉一笑（こすぎいっしょう）の死をいたみ、詠んだ句はどれか。","o":["あかあかと日は難面（つれなく）も秋の風","山中や菊（きく）はたおらじ湯のにほひ","むざんやな甲（かぶと）の下のきりぎりす","塚も動けわが泣く声は秋の風"],"a":4,"e":"芭蕉は 10 日間金沢に滞在し、多くの俳人たちに俳句を教えたり、俳句について話し合ったりし、訪れた先で数々の句を詠んだ。","g":"文学"},{"n":36,"q":"藩政（はんせい）時代、北海道から日本海を経て下関・瀬戸内海を通り大坂［今の大阪］へ向かう船は、危険をともないながらも莫大（ばくだい）な利益をあげた。この船を瀬戸内の人々は何と呼んだか。","o":["北海廻船（かいせん）","瀬戸内廻船","北前船（きたまえぶね）","西回り廻船"],"a":3,"e":"大坂と北海道を結ぶ廻船を加賀藩（はん）でも利用した。江戸時代、日本海から下関をまわり大坂に行く船は北前船と呼ばれ、危険をともないながら莫大な利益をあげた。これにより巨万（きょまん）の富を築いた木谷藤右衛門（きやとうえもん）や銭屋五兵衛（ぜにやごへえ）などの豪商（ごうしょう）も生まれた。","g":"歴史"},{"n":37,"q":"1925 年（大正 14）に金沢西部の砂丘（さきゅう）地帯に建てられ、北陸の宝塚といわれた一大レジャー施設（しせつ）はどれか。","o":["金沢サニーランド","粟崎遊園（あわがさきゆうえん）","卯辰山（うたつやま）ヘルスセンター","あめるんパーク"],"a":2,"e":"粟崎遊園は、平沢嘉太郎（ひらさわかたろう）が、浅野川電鉄と協力して建設した。ここは、劇場・料亭（りょうてい）・レストラン・動物園・大浴場・野球場などを備えた施設だった。","g":"寺社・建造物・まち"},{"n":38,"q":"加賀藩（はん）では、金沢城内において、藩が使用する武具や工芸調度品の製作および修理を行う役所が存在した。この役所の名前はどれか。","o":["藩工芸所（はんこうげいしょ）","藩工作所（はんこうさくしょ）","御工作所（おんこうさくしょ）","御細工所（おさいくしょ）"],"a":4,"e":"藩政初期には城内に設けられた。幕府や朝廷（ちょうてい）等へのおくり物を作る役所として仕事をした。多いときには 76 人もの細工人が働き、高い技術を持った京都や江戸の職人を招いて、細工人の指導にあたらせた。","g":"美術・工芸・芸能"},{"n":39,"q":"春、夏、秋、冬、という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子（わがし）があり、生活の中にいろどりと美をそえている。そのうち、7 月 1 日に加賀藩（はん）から江戸の将軍に冬の間に保存しておいた氷を献上した行事にちなみ、食べられるようになった和菓子はどれか。","o":["金花糖（きんかとう）","五色生菓子（ごしきなまがし）","氷室饅頭（ひむろまんじゅう）","辻（つじ）うら"],"a":3,"e":"この日に氷室饅頭やちくわを食べると 1 年間病気にかからないと言われている。","g":"食・行事"},{"n":40,"q":"江戸時代、各藩（はん）では家臣の教育のために、藩校（学校）を建てた。加賀藩 11 代藩主前田治脩（まえだはるなが）のときに兼六園内に建てられ、儒学を中心とし、漢字・算術・医学・天文学など広い分野を教えた藩校はどれか。","o":["明倫堂（めいりんどう）","経武館（けいぶかん）","壮猶館（そうゆうかん）","寺子屋（てらこや）"],"a":1,"e":"明倫堂は、士農工商（しのうこうしょう）の身分を問わず8歳以上の男子が入校できた。経武館（けいぶかん）は武芸の鍛錬（ぶげいのたんれん）を目的として剣術・弓術（けんじゅつ・きゅうじゅつ）などの様々な武芸が教えられた。","g":"寺社・建造物・まち"},{"n":41,"q":"1954 年（昭和 29）に金沢市中心部を流れる犀川（さいがわ）河口の金石港と、河北潟から流れる大野川河口の大野港が合併（がっぺい）して誕生した港の名称はどれか。","o":["河北港","昭和港","金沢港","粟崎港"],"a":3,"e":"幕末（ばくまつ）に、犀川河口の宮腰（みやのこし）が金石と改称された。現在も「金石街道」と呼ばれる金沢市の中心部へ一直線にのびる道は、金沢城と港の間を船荷がスムーズに運搬（うんぱん）できるように作られた。日本海側のメインポートとして大型船が入港できるように整備され、2020 年（令和2）に金沢港クルーズターミナルが開業した。","g":"市政・最近の話題"},{"n":42,"q":"明治政府（めいじせいふ）は廃藩置県（はいはんちけん）後、全国に 31 の市をつくり、石川県でただ一つ金沢市ができた。当時は一定以上の税金を納める人が市議会議員（しぎかいぎいん）を選び、その議員が市長にしたい人を選び、最後は政府の許可を得て決定するものだった。このような選挙の結果、初代金沢市長に選ばれたのは誰か。","o":["稲垣義方（いながきよしかた）","長谷川準也（はせがわじゅんや）","島田一良（しまだいちろう）","中橋徳五郎（なかはしとくごろう）"],"a":1,"e":"市長候補には稲垣義方と長谷川準也の二人が上がり、選挙戦は乱闘さわぎになるほど激しいものだった。二代目の市長には第1回の選挙で敗れた長谷川が選ばれた。","g":"偉人・人物"},{"n":43,"q":"交通の利便性を高め、商業を発展させるために、江戸時代に金沢城から約5km にわたって広い直線道路が建設された。この道路は、城下から現在のどの地点に向かってのびていたか。","o":["森本","松任","湯涌","金石"],"a":4,"e":"現在の「金石街道」と呼ばれる金沢市の中心部へ一直線にのびる道は、金沢城と港の間を船荷がスムーズに運搬（うんぱん）できるようにつくられた道である。","g":"寺社・建造物・まち"},{"n":44,"q":"金沢市のシンボルである市章は 1891 年（明治 24）の市議会で決められた。この形は、前田の殿様が東京へ行ってしまい、金沢の町が非常にさびれてしまったため、前田家に再び金沢にもどってもらい、人々の心に活気を取り戻そうとつくられたといわれている。市章に使われた形は何の花からできているか。","o":["桜","百合（ゆり）","梅","菊"],"a":3,"e":"梅の形は前田家の梅鉢（うめばち）の紋章（もんしょう）からとったもので、下水道のふたや消防のまといなどにも使われている。","g":"市政・最近の話題"},{"n":45,"q":"加賀藩（はん）5代藩主前田綱紀（まえだつなのり）は、茶道を普及（ふきゅう）させるために京都から千仙叟宗室（せんのせんそうそうしつ）を招いた。仙叟が始祖（しそ）［はじめた人］とされる茶道の流派はどれか。","o":["表千家（せんけ）流","裏千家流","武者小路（むしゃのこうじ）流","宗和（そうわ）流"],"a":2,"e":"宗室は裏千家を名のり、表は宗左を、武者小路は宗守を名のる。宗和は金森宗和から始まる。","g":"美術・工芸・芸能"},{"n":46,"q":"金沢市は、1962 年（昭和 37）にアメリカ合衆国バッファロー市と姉妹都市提携（ていけい）を結んだ。その後、姉妹都市は増えていったが、2002 年（平成 14）4月に姉妹都市となったのはどこか。","o":["大韓民国・全州（ジョンジュ）市","ロシア・イルクーツク市","ベルギー・ゲント市","フランス・ナンシー市"],"a":1,"e":"姉妹都市交流は、双方の市民同士が、友情と信頼をもとに文化・スポーツ・経済などの広い文化で交流し合い、お互いの理解と友好関係を発展させることを目的としている。全州市とは高校生同士の交流などを行い、お互いの友好を深めている。","g":"市政・最近の話題"},{"n":47,"q":"現在の石引町は、城づくりの石を引いたことでつけられた名前である。金沢城の石垣にも使われている石で、城から8km ほど東にある山から切り出された石を何というか。","o":["安原石（やすはらいし）","大谷石（おおやいし）","御影石（みかげいし）","戸室石（とむろいし）"],"a":4,"e":"城づくりの中心になったのは、城づくりにかけては天下にその人ありと知られていた「高山右近」でした。石垣づくりは、当時最高の技術を持っていた近江の国の穴太村（あのうむら）出身の石工集団（いしくしゅうだん）である穴太衆（あのうしゅう）が担当しました。","g":"寺社・建造物・まち"},{"n":48,"q":"戦後の混乱のさなか 1946 年（昭和 21）に兵器の倉庫として使われていた赤レンガづくりの建物を使って開学した学校が元であり、2023 年（令和5)にキャンパス移転が行われた大学はどれか。","o":["金沢美術工芸大学","金沢大学","石川県立大学","石川県立看護大学"],"a":1,"e":"金沢美術工芸大学は伝統と美を大切にする金沢市民の期待に応えて金沢美術工芸専門学校として開設されたのが始まりである。赤レンガの建物は今、県立歴史博物館として使われている。","g":"美術・工芸・芸能"},{"n":49,"q":"1924 年（大正 13）に作られ、金沢市の新たな産業や生活文化をつくってきた橋が 2024 年(令和6)で 100 周年をむかえる。日本の伝統色（でんとうしょく）である青色を基調（きちょう）とし、2000年（平成 12）には国の登録有形文化財（とうろくゆうけいぶんかざい）にも登録された橋が架かっている川は何というか。","o":["犀川（さいがわ）","浅野川（あさのがわ）","森下川（もりもとがわ）","大野川（おおのがわ）"],"a":1,"e":"金沢は、犀川と浅野川という二つの川にはさまれ、緑に恵まれた、「森の都」と呼ぶにふさわしいまちである。","g":"寺社・建造物・まち"},{"n":50,"q":"宮崎友禅斎（みやざきゆうぜんさい）は、京都から金沢に移り住み、金沢に友禅染を伝え「加賀友禅（かがゆうぜん）」を作り出した。「加賀友禅」の特徴（とくちょう）的な技法はどれか。","o":["色染め","虫染め","虫食い","色ぬき"],"a":3,"e":"「ぼかし」と「虫食い」の表現に味わいがあるとされている。仕上がりまで 14 の工程があり、生地についている糊（のり）や余分な染料を洗い流す工程は、「友禅流し」といって今でも浅野川などで見られる金沢の冬の風物詩である。","g":"美術・工芸・芸能"}]},{"id":"j17c","label":"第17回ジュニア（中学生版）2023","q":[{"n":1,"q":"観光の玄関口である金沢駅東口の建物は( あ )ドーム、( い )門と呼ばれている。正しい組み合わせはどれか。","o":["（あ）－もてなし（い）－太鼓（たいこ）","（あ）－もてなし（い）－鼓（つづみ）","（あ）－かんげい（い）－太鼓","（あ）－かんげい（い）－鼓"],"a":2,"e":"洗練された現代的な都市としての姿は観光都市金沢の魅力（みりょく）の1つとなっており、2013 年（平成 25）には「世界で最もすばらしい駅」ベスト 10に選出された。","g":"寺社・建造物・まち"},{"n":2,"q":"金沢を上空から見ると、南東の山地と北西の日本海がある。標高 1644ｍある南東の山地で一番高い山はどれか。","o":["奥医王山（おくいおうぜん）","卯辰山（うたつやま）","奈良岳（ならだけ）","大門山（だいもんざん）"],"a":3,"e":"金沢の地形図を見ればわかるが、犀川（さいがわ）の水源でもある。奈良岳からの「二又川（ふたまたがわ）」と大門山からの「倉谷川（くらたにがわ）」は、犀川ダムに集まり、その後、金沢で一番長い「犀川」という一本の川になって、日常生活に使われる水道水や、田畑をうるおす農業用水などに利用されている。","g":"自然・産業"},{"n":3,"q":"江戸（えど）時代末期、加賀藩（かがはん）最後の藩主前田慶寧（まえだよしやす）は、人々の生活を豊かにするために、金沢東部の卯辰山（うたつやま）を開発して福祉施設（ふくししせつ）の「撫育所（ぶいくしょ）」、工芸の工場などを作り、賑(にぎ)わいを作り出した。そこに作った病院施設を何というか。","o":["卯辰山病院","養生所（ようじょうしょ）","金沢病院","医王山病院"],"a":2,"e":"「撫育所」は養生所の付属施設で、身寄りも仕事もない人たちが住み、中の作業所で仕事をしていた。『卯辰山開拓録（うたつやまかいたくろく）』が刊行され、当時の様子が分かる。","g":"歴史"},{"n":4,"q":"加賀藩（かがはん）の参勤交代（さんきんこうたい）は、金沢から江戸（えど）まで 12 泊 13 日をかけ、2000 人以上のお供（とも）をひきつれ、諸大名（しょだいみょう）の中でも最大の規模であった。大名行列の費用総額（ひようそうがく）は当時のお金で銀 320 貫（かん）であるが、これは現在の金額に換算（かんさん）するとおよそいくらになるか。","o":["5千万円～6千万円","5億円～6億円","50 億円～60 億円","500 億円～600 億円"],"a":2,"e":"参勤交代は大名が1年おきに領地と江戸に住み、その妻子（さいし）を人質（ひとじち）として江戸の屋敷（やしき）におくことを命じたものである。その移動の際の大名行列では昼食代をふくめた宿泊費（しゅくはくひ）だけで約2億円、その他、馬の宿泊代、荷物を運ぶ人足（にんそく）の駄賃（だちん）、川越賃（かわごえちん）、弓や鉄砲（てっぽう）の修理代などの出費があった。","g":"歴史"},{"n":5,"q":"世界地図で金沢の位置を見ると、ほぼ北緯（ほくい）36 度にある。北緯 36 度を東にたどるとアメリカ合衆国のサンフランシスコの南側、西にたどるとギリシアのアテネの南側を通る。金沢を南にたどるとオーストラリアのアデレードの西側付近を通る。金沢は、東経何度に位置しているか。","o":["106 度","116 度","126 度","136 度"],"a":4,"e":"東経 136 度を北にたどるとロシア連邦（れんぽう）のハバロフスクの東側に達する。","g":"自然・産業"},{"n":6,"q":"北陸新幹線は、2015 年(平成 27)に、東京駅から金沢駅までの間で開業した。2024 年（令和6）の春には福井県のどこまで開通するか。","o":["芦原（あわら）温泉駅","福井駅","敦賀（つるが）駅","越前たけふ駅"],"a":3,"e":"金沢と東京は江戸時代の参勤交代では約 13 日間、北陸新幹線開業前は約4時間かかっていたところ、約2時間 30 分で行き来できるようになった。","g":"市政・最近の話題"},{"n":7,"q":"兼六園（けんろくえん）は江戸（えど）時代の代表的な大名庭園（だいみょうていえん）であり、6つの優れた点を兼ね備えている庭という意味で名づけられたといわれている。県立伝統産業工芸館には当時の老中により揮毫（きごう：毛筆で字を書くこと）された「兼六園」の額（がく）が残っているが、誰（だれ）が書いたものか。","o":["田沼意次（たぬまおきつぐ）","松平定信（まつだいらさだのぶ）","水野忠邦（みずのただくに）","阿部正弘（あべまさひろ）"],"a":2,"e":"兼六園は加賀藩（かがはん）12 代藩主前田斉広（まえだなりなが）の時代に名づけられたといわれている。松平定信は江戸幕府8代将軍徳川吉宗の孫であり、白河藩（しらかわはん）の藩主である。また、幕府老中として寛政（かんせい）の改革を行ったことで知れている。","g":"寺社・建造物・まち"},{"n":8,"q":"藩政（はんせい）時代、北海道から日本海を通って下関・瀬戸内海（せとないかい）を経て大坂に行く船は、危険をともないながら莫大（ばくだい）な利益をあげた。この船を瀬戸内の人々は何と呼んだか。","o":["北海廻船（かいせん）","瀬戸内廻船","西回り廻船","北前船（きたまえぶね）"],"a":4,"e":"大坂と北海道を結ぶ廻船を加賀藩（かがはん）でも利用した。江戸（えど）時代、日本海から下関をまわり大坂に行く船は北前船と呼ばれ、危険をともないながら莫大な利益をあげた。これにより巨万（きょまん）の富を築いた木谷や銭屋などの豪商（ごうしょう）も生まれた。","g":"歴史"},{"n":9,"q":"藩政（はんせい）末期、金沢大野に「加賀の平賀源内（ひらがげんない）」といわれた大野弁吉（おおのべんきち）がいた。弁吉はたくさんのからくりや工芸品を残し、「優れたからくり師」といわれていた。弁吉の才能や仕事に援助（えんじょ）をした豪商（ごうしょう）は誰（だれ）か。","o":["銭屋五兵衛（ぜにやごへえ）","木谷藤右衛門（きやとうえもん）","横山隆興（よこやまたかおき）","高多久兵衛（たかだきゅうべえ）"],"a":1,"e":"弁吉は高い水準の科学知識を身につけた技術者でもあり、著書の「一東視窮録（いっとうしきゅうろく）」には、エレキテル・写真術・無尽灯（むじんとう）など、当時としては最新の知識がまとめられている。","g":"偉人・人物"},{"n":10,"q":"「氷室の朔日（ついたち）」は、江戸時代に加賀藩（かがはん）から江戸の将軍に冬の間に保存しておいた氷を献上（けんじょう）したことにちなんだ行事である。この日に食べると一年間病気にかからないといわれている食べ物はどれか。","o":["五色生菓子（ごしきなまがし）","葛饅頭（くずまんじゅう）","氷室饅頭（ひむろまんじゅう）","（つじ）うら"],"a":3,"e":"現在でも、氷室の朔日（ついたち）（旧：6月1日）に氷室饅頭が売り出される。","g":"食・行事"},{"n":11,"q":"日本中が飢饉（ききん）と財政難に苦しんだ天保（てんぽう）時代、加賀藩（かがはん）の政治の実権をにぎった奥村栄実（おくむらてるざね）から「前門の虎、後門の狼（ぜんもんのとら、こうもんのおおかみ）」ときらわれ、おそれられた武士のうち、1人は上田作之丞（うえださくのじょう）である。もう1人はその影響（えいきょう）力の大きさから最後は能登島へ流刑（るけい）となった人物であり、その邸宅跡（ていたくあと）は現在も大手町に残されている。この人物は誰（だれ）か。","o":["大槻朝元（おおつきとももと）","寺島蔵人（てらしまくらんど）","長連弘（ちょうつらひろ）","名古屋彦左衛門（なごやひこざえもん）"],"a":2,"e":"寺島蔵人は藩の財政を建て直すために藩専売（はんせんばい）の拡大、農民への減税（げんぜい）、新田開発などの藩政改革を強硬（きょうこう）に主張した。その言動が身分の高い武士のいかりをかい、三度も免職（めんしょく）になりながらもその度に考え方や実行力がかわれて、藩の重要な職に復帰（ふっき）した。","g":"偉人・人物"},{"n":12,"q":"1689 年（元禄（げんろく）2）、俳人で有名な松尾芭蕉（まつおばしょう）が金沢の俳人に会うために金沢を訪れた。しかし、残念ながら彼（かれ）は前年に亡くなっていたので、芭蕉は「塚（つか）も動けわが泣く声は秋の風」の句をよんで彼の死を悲しんだ。この金沢の俳人は誰（だれ）か。","o":["立花北枝（たちばなほくし）","宮竹屋小春（みやたけやしょうしゅん）","小杉一笑（こすぎいっしょう）","河合曾良（かわいそら）"],"a":3,"e":"一笑の菩提寺（ぼだいじ）野町願念寺に句碑（くひ）がある。小杉一笑は 1653年(承応2)に金沢に生まれ、加賀（かが）を代表する俳人で茶屋の経営（けいえい）も行っていた。","g":"文学"},{"n":13,"q":"1925 年（大正 14)に金沢の西の方の砂丘（さきゅう）地に建てられた北陸の宝塚（たからづか）といわれた一大レジャー施設（しせつ）はどれか。","o":["粟崎遊園（あわがさきゆうえん）","金沢サニーランド","卯辰山（うたつやま）ヘルスセンター","あめるんパーク"],"a":1,"e":"粟崎遊園は、平沢嘉太郎（ひらさわかたろう）が、浅野川電鉄と協力し建設した。ここは、劇場・料亭（りょうてい）・レストラン・動物園・大浴場・野球場などを備えた施設だった。","g":"寺社・建造物・まち"},{"n":15,"q":"加賀藩（かがはん）3代藩主前田利常（まえだとしつね）は、家来の侍（さむらい）が直接農民から年貢（ねんぐ）を集める体制から、藩が直接集め、家来に給付する体制に改めた。藩の農政の安定につながったこの方法を何というか。","o":["改作法","農政法","改農法","農作法"],"a":1,"e":"政治は一加賀、二土佐といわれるほど盤石（ばんじゃく）の体制を築いた。","g":"歴史"},{"n":16,"q":"金沢では様々な伝統芸能が受け継がれている。加賀藩（はん）5代藩主前田綱紀（まえだつなのり）が取り入れたことから金沢で盛んになった「加賀宝生」として発展した芸術は何か。","o":["歌舞伎（かぶき）","獅子舞（ししまい）","文楽（ぶんらく）","能楽（のうがく）"],"a":4,"e":"加賀藩では代々の藩主たちが積極的に能楽や茶の湯を取り入れたが、特に前田綱紀は学問が好きで、有名な学者や貴重なものを国中から集めた。","g":"美術・工芸・芸能"},{"n":17,"q":"1878 年（明治 11）、藩閥政府（はんばつせいふ）に不満をもつ島田一良（いちろう）ら三光寺派（さんこうじは）の6人が、馬車で皇居（こうきょ）へ向かう途中（とちゅう）の政府高官を暗殺した紀尾井町事件（きおいちょうじけん）が発生した。このとき暗殺された政府高官は誰（だれ）か。","o":["大久保利通（おおくぼとしみち）","木戸孝允（きどたかよし）","大隈重信（おおくましげのぶ）","岩倉具視（いわくらともみ）"],"a":1,"e":"薩摩藩（さつまはん）出身の大久保利通は当時の藩閥政府の中心的人物だった。西郷隆盛らの考え方に影響（えいきょう）をうけた三光寺派は、1877 年（明治 10）の西南戦争に呼応（こおう）して金沢で挙兵（きょへい）しようと計画した。しかし計画は実現せず、島田一良らは最後の手段として政府高官の暗殺にふみきった。","g":"偉人・人物"},{"n":18,"q":"金沢は、緑にめぐまれ「森の都」と呼ぶにふさわしい町だ。金沢の面積のうち、森林がしめる面積は約何割か。","o":["3割","4割","5割","6割"],"a":4,"e":"金沢市は 2003 年（平成 15）4月に「金沢市森づくり条例」を制定し、地域と一体となった森づくりを進めている。金沢市域の6割をしめる森林は、国土の保全や地球温暖化の防止などに役立っており、市民生活に欠くことのできない貴重な財産である。","g":"自然・産業"},{"n":19,"q":"平安時代、加賀国や能登国では早くから大陸の国との交流があった。このことは 2001 年（平成 13）に金沢市の畝田ナベタ遺跡（うねだなべたいせき）から文様（もんよう）入り帯金具（おびかなぐ）が出土したことから証明されている。この大陸の国とはどこか。","o":["契丹（きったん）","唐（とう）","隋（ずい）","渤海（ぼっかい）"],"a":4,"e":"渤海（8世紀～10 世紀）は唐から独立した国であり、唐に対抗するために日本との交流をすすめたといわれている。能登の福良（ふくら）は日本からの出発地、金沢の犀川河口（さいがわかこう）が受け入れの地になっていたのではないかと考えられている。","g":"歴史"},{"n":20,"q":"金沢の清らかな水を利用して上質な和紙がすかれている。この和紙を使った日本の総生産量のほとんどをしめ、全国第 1 位の生産量をほこる金沢の特産品は何か。","o":["金沢漆器（しっき）","加賀毛針（かがけばり）","金箔（きんぱく）","九谷焼"],"a":3,"e":"金箔を作るためには、特別なじょうぶさをもった上質の和紙が必要で、清らかな水が豊富な金沢は、その和紙をつくる上でも良い条件がそろっていたとされている。","g":"美術・工芸・芸能"},{"n":21,"q":"加賀藩（かがはん）では、金沢城内に藩で使用する武具や工芸調度品を製作・修理する役所があった。その役所の名前はどれか。","o":["御細工所（おさいくしょ）","藩工芸所（はんこうげいしょ）","藩工作所（はんこうさくしょ）","御工作所（おんこうさくしょ）"],"a":1,"e":"藩政初期には城内に設けられた。幕府や朝廷（ちょうてい）等へのおくり物を作る役所として仕事をした。多いときには76人もの細工人が働き、高い技術を持った京都や江戸の職人を招いて、細工人の指導にあたらせた。","g":"美術・工芸・芸能"},{"n":22,"q":"加賀藩（かがはん）3代藩主前田利常（まえだとしつね）は世の中が戦（いくさ）のない時代にうつりつつあることを感じとり、いち早く藩内の産業の振興（しんこう）と文化の発展につくした。前田利常が行った政策はどれか。","o":["お救い小屋（おすくいごや）の建設","明倫堂（めいりんどう）の建設","浄水場（じょうすいじょう）の建設","辰巳用水（たつみようすい）の建設"],"a":4,"e":"当時は小立野（こだつの）台地の先端（せんたん）にある金沢城まで水がゆきわたらず、防火用水が不足していた。そこで利常は小松の町人板屋平四郎（いたやへいしろう）に命じて、辰巳（たつみ）用水をつくらせた。","g":"寺社・建造物・まち"},{"n":23,"q":"戦後、金沢城内にあった旧陸軍の木造兵舎を利用して、ある施設（しせつ）がつくられた。その施設は何か。","o":["金沢市役所","金沢大学","金沢歴史博物館","金沢美術館"],"a":2,"e":"金沢大学は、「お城の中の大学」として全国に有名になり、昭和 30 年代後半にかけ、学生もどんどん全国から集まっていた。昭和の終わりに角間地区への総合移転が進められ、2005 年（平成 17）に現在の金沢大学角間キャンパスが完成し、金沢城跡は「金沢城公園」として市民のいこいの場となっている。","g":"寺社・建造物・まち"},{"n":24,"q":"金沢には、「市民の台所」近江町（おうみちょう）市場がある。2009 年（平成21）再開発事業で生まれ変わり開業した施設（しせつ）はどれか。","o":["近江町いちば館","近江会館","むさし会館","武蔵が辻（むさしがつじ）市場"],"a":1,"e":"近江町市場は店員のかけ声がいせいよく響き渡り、安くて新鮮な魚や野菜などを直接買うことができる市場として市民だけでなく観光客にも多く利用されている。","g":"市政・最近の話題"},{"n":25,"q":"江戸時代、現在は金沢市になっている旧御供田村（ごくでんむら）の十村役（とむらやく）の土屋又三郎（つちやまたさぶろう）が1年間の農家の仕事について、月ごとにやるべき農作業や、作るべき作物や肥料のこと、農具の形などを本にまとめ著した。この北陸地方における農業書として特に有名な本はどれか。","o":["『農業全書』","『耕稼春秋』","『農業手引き』","『北陸農事』"],"a":2,"e":"十村役は、1604 年（慶長9）に初めて設けられ、改作法の前後あたりに制度化された。身分は百姓だったが、郡（こおり）奉行や改作奉行の命令を組内の肝煎（きもいり）に伝えたり、組内の警察や裁判に関する仕事を行った。また年貢米を集めるなど、重要な仕事を任された。","g":"歴史"},{"n":26,"q":"江戸（えど）時代の金沢ではまちづくりの一つとして、火事が広がらないように、火除地（ひよけち）をつくった。他の都市などにはあまり見られないこの場所を何というか。","o":["公園","寄り場","広見（ひろみ）","小路"],"a":3,"e":"今も残っている広見は、地域の祭りや盆（ぼん）おどり、フリーマーケットなど、地域の人々のふれあいの場として活躍（かつやく）している。","g":"寺社・建造物・まち"},{"n":27,"q":"加賀藩（はん）5代藩主前田綱紀（まえだつなのり）は有名な学者を日本中から金沢にまねいたり、貴重な書物を国中から集めたりしていたため、当時を代表する学者に「加賀は天下の書府（しょふ）」とほめたたえられた。この学者は誰（だれ）か。","o":["木下順庵（きのしたじゅんあん）","新井白石（あらいはくせき）","林羅山（はやしらざん）","稲生若水（いのうじゃくすい）"],"a":2,"e":"新井白石は江戸（えど）幕府6代将軍徳川家宣（いえのぶ）につかえた朱子学者（しゅしがくしゃ）である。正徳（しょうとく）の治（ち）とよばれる文治政治を行った。","g":"偉人・人物"},{"n":28,"q":"金沢市の中心部のせまい道を走る「ふらっとバス」が 1999 年（平成 11）3月から運行している。この「ふらっとバス」の特徴（とくちょう）はどれか。","o":["車いすを使用している人もスロープを使って乗り降りできる","大人も子どもも1回 100 円で乗れる","現在、2ルート走っている","ルートの 1 つに卯辰山（うたつやま）ルートがある"],"a":1,"e":"現在、此花ルート、菊川ルート、材木ルート、長町ルートの4ルート運行している。誰（だれ）もが気軽に「ふらっと」買い物や散策に出かけられるように、バスの入り口から出口まで低くて段差のない「フラット」な床になっている。また、乗り降りスロープや車椅子の固定装置も備えている。","g":"市政・最近の話題"},{"n":29,"q":"1838 年（天保9）、凶作（きょうさく）に苦しむ農民を救うため、村役人たちが年貢米（ねんぐまい）をまけてほしいと藩（はん）に願い出る事件が起きたが、村役人たちはとらえられ、家族ともども越中五箇山（えっちゅうごかやま）へ流刑（るけい）となった。1897 年（明治 30）、事件の真相（しんそう）を知り、犠牲（ぎせい）になった人々を天保義民（てんぽうぎみん）といってたたえたのは誰（だれ）か。","o":["板垣退助（いたがきたいすけ）","勝海舟（かつかいしゅう）","徳川慶喜（とくがわよしのぶ）","坂本龍馬（さかもとりょうま）"],"a":2,"e":"勝海舟は江戸時代の幕臣（ばくしん）であり、咸臨丸（かんりんまる）艦長（かんちょう）として初の太平洋横断に成功し、戊辰戦争（ぼしんせんそう）では西郷隆盛（さいごうたかもり）との会談によって江戸城の明けわたしを実現した。幕府滅亡後（ばくふめつぼうご）は明治政府の要職（ようしょく）を歴任（れきにん）した。","g":"偉人・人物"},{"n":30,"q":"1954 年（昭和 29）に金沢の中心を流れる犀川（さいがわ）河口の金石港と河北潟から流れる大野川河口の大野港が合併（がっぺい）して出来た港はどれか。","o":["河北港","昭和港","粟崎港","金沢港"],"a":4,"e":"藩末（ばくまつ）に、犀川河口の宮腰（みやのこし）が金石と改称された。現在も「金石街道」と呼ばれる金沢市の中心部へ一直線に延びる道は、金沢城と港の間を船荷がスムーズに運搬（うんぱん）できるように作られた。日本海側のメインポートとして大型船が入港できるように整備がされ、2020 年（令和2）に金沢港クルーズターミナルが開業した。","g":"市政・最近の話題"},{"n":31,"q":"加賀藩（はん）初代藩主前田利家（まえだとしいえ）は、武勇に優れた槍（やり）の名手であっただけでなく、計算も得意であったといわれている。戦（いくさ）の兵糧米（ひょうろうまい）の計算にも使った、利家がいつも持ち歩いていたものとは何か。","o":["そろばん","一升（いっしょう）ます","おはじき","はかり"],"a":1,"e":"利家が朝鮮（ちょうせん）出兵の際、九州・名護屋（なごや：佐賀県）の陣中（じんちゅう）で使ったといわれる高徳公算盤（こうとくこうそろばん）は、現在日本に残っているそろばんで最も古いものである。利家はそろばんをいつも具足（ぐそく）びつ（鎧（よろい）などを入れる入れ物）にいれておいて、兵糧などの計算に使ったといわれている。","g":"偉人・人物"},{"n":32,"q":"2021 年（令和3）金沢市において、IoT や AI など最先端（さいせんたん）分野をはじめ、金沢市がほこる工芸やものづくり、食やアートなどさまざまな文化、未来を担うこどもたちのワークショップが一つ屋根の下に集っている拠点（きょてん）がつくられた。旧野町小学校を活用して整備されたこの施設（しせつ）はどれか。","o":["金沢未来のまち創造館","谷口吉郎・吉生記念","金沢職人大学校","ＩＴビジネスプラザ武蔵"],"a":1,"e":"金沢建築館近年金沢市では学校の規模適正化を実施（じっし）し、いくつかの小学校の統廃合（とうはいごう）が行われている。旧野町小学校は「金沢未来のまち創造館」という官民連携（れんけい）型の価値創造拠点施設となった。旧俵小学校は、金沢の伝統文化と新たな文化の創造を担う、人づくりを目的にした芸術活動の練習、創作拠点の「俵スタジオ」として活用されている。","g":"市政・最近の話題"},{"n":33,"q":"室町時代、人々は苦しく不安な生活を送っていたが、作物の取れ高が増えてくると「どのように生きるか」「死んだ後はどうなるのか」を考えるようになった。このような時代に北陸において「南無阿弥陀仏（なむあみだぶつ）」をとなえることで極楽浄土（ごくらくじょうど）に往生（おうじょう）できると布教した人物は誰（だれ）か。","o":["親鸞（しんらん）","存如（ぞんにょ）","蓮如（れんにょ）","如乗（にょじょう）"],"a":3,"e":"本願寺（浄土真宗（じょうどしんしゅう））の蓮如は親鸞の教えを分かりやすく人々に伝え、誰からも親しまれた。金沢市内には蓮如町、二俣本泉寺（ふたまたほんせんじ）、寿福寺（じゅふくじ）、善性寺（ぜんしょうじ）など、蓮如にゆかりのある町やお寺がいくつも残っている。","g":"歴史"},{"n":34,"q":"宮崎友禅斎（みやざきゆうぜんさい）は、京都から金沢に移り住み、金沢に友禅染を伝え「加賀友禅（かがゆうぜん）」を作り出した。「加賀友禅」の特徴（とくちょう）的な技法はどれか。","o":["色染め","虫染め","虫食い","色ぬき"],"a":3,"e":"「ぼかし」と「虫食い」の表現に味わいがあるとされている。仕上がりまで 14の工程があり、生地についている糊や余分な染料を洗い流す工程は、「友禅流し」といって今でも浅野川などで見られる金沢の冬の風物詩だ。","g":"美術・工芸・芸能"},{"n":35,"q":"明治政府は、廃藩置県（はいはんちけん）後にも、県の範囲（はんい）や町や村をどのように治めるかなどの試行錯誤（しこうさくご）を重ね、1889 年（明治 22）、全国に 31 の市をつくり、石川県では金沢市がつくられた。金沢市の初代市長は誰（だれ）か。","o":["稲垣義方（いながきよしかた）","永井柳太郎（ながいりゅうたろう）","岡良一（おかりょういち）","中橋徳五郎（なかはしとくごろう）"],"a":1,"e":"稲垣義方は藩政（はんせい）時代には藩の海軍を率い、戊辰戦争（ぼしんせんそう）にも参加し、のちに金沢区長となった。市長候補（しちょうこうほ）には稲垣義方と長谷川準也の2人があがり、激しい選挙戦を行ったが、選挙の結果稲垣義方が選ばれた。なお、長谷川準也が2代目の市長となっている。","g":"偉人・人物"},{"n":36,"q":"金沢市では、金沢城北市民運動公園（磯部町）において金沢市民サッカー場（金沢スタジアム）の再整備を進めている。ドイツ語にちなむ言葉で、金沢の方言にも通じる言葉をチーム名にした金沢をホームタウンとしたサッカーのプロスポーツチームはどれか。","o":["PFU ブルーキャッツ","石川ミリオンスターズ","ツエーゲン金沢","金沢武士団（サムライズ）"],"a":3,"e":"金沢市では 2018 年（平成 30）「金沢市スポーツ文化推進条例」を制定し、スポーツを行うことに加え、観ること、支えること、応援すること、語り合うことが日常生活に溶け込み、金沢の風土として受け継がれていくことをめざしている。","g":"市政・最近の話題"},{"n":37,"q":"1900 年（明治 33）、日本初の羽二重（はぶたえ：なめらかでつやのあるうすい絹織物）を織る力織機（りきしょっき）が発明された。この力織機を発明した人物はだれか。","o":["津田駒次郎（つだこまじろう）","長谷川準也（はせがわじゅんや）","大野弁吉（おおのべんきち）","津田米次郎（つだよねじろう）"],"a":4,"e":"津田米次郎が完成させた力織機は 1902 年（明治 35）の第5回内国勧業大博覧会（ないこくかんぎょうだいはくらんかい）に出品され、多大な賞賛（しょうさん）をはくした。1918 年（大正7）にはその功績（こうせき）がたたえられ、米次郎の銅像が卯辰山（うたつやま）に建てられた。","g":"偉人・人物"},{"n":38,"q":"交通の便をよくして商業を発展させるため、江戸（えど）時代に金沢城から約5ｋｍにもおよぶ幅（はば）の広い直線道路が建設された。この道路は、城下から現在のどの地点に向かって延びていたか。","o":["金石","森本","松任","湯涌"],"a":1,"e":"現在は「金石街道」と呼ばれる金沢市の中心部へ一直線に延びる道は、金沢城と港の間を船荷がスムーズに運搬（うんぱん）できるようにつくられた道である。","g":"寺社・建造物・まち"},{"n":39,"q":"第二次世界大戦中、石川県から愛知県豊川（とよかわ）にある海軍の工場に多くの少女が女子挺身隊（じょしていしんたい）として働きに出向いた。その工場が空襲（くうしゅう）を受け、犠牲（ぎせい）になった少女たちの霊（れい）をとむらうため、卯辰山（うたつやま）の山頂付近に建てられたのは何か。","o":["自由と正義の像","平和記念像","七稲地蔵（なないねじぞう）","殉難（じゅんなん）おとめの像"],"a":4,"e":"豊川の工場の空襲で犠牲となった石川県の女子挺身隊は52人である。殉難おとめの像の歌碑（かひ）には「これやこの少女ら生きてあればいまは人の妻子の母なるを・・・」とある。","g":"歴史"},{"n":40,"q":"水の豊富な金沢は、市内には 55 本の用水が流れており、「用水のまち」としても有名である。金沢市の用水を守るための条例はどれか。","o":["用水保全条例","緑の都市宣言","こまちなみ保存条例","金沢市森づくり条例"],"a":1,"e":"金沢市内に流れる55の用水全てを合わせると約 150km になるといわれている。用水は農業灌漑（かんがい）、消火や融雪（ゆうせつ）のほか、城下町としての金沢の景観を引き立てるなど金沢市民の暮らしに欠かせない存在となっている。","g":"市政・最近の話題"},{"n":41,"q":"北陸地方は世界的な豪雪地帯（ごうせつちたい）である。金沢では、気象庁が始まって以来の大雪が降ったことがあり、「三八豪雪」と言われている。それは何年のことか。","o":["1938 年","昭和 38 年","明治 38 年","1838 年"],"a":2,"e":"「三八豪雪」は昭和 38 年 1 月に発生した。豪雪に名称をつけたのは、気象庁始まって以来のことだった。","g":"自然・産業"},{"n":42,"q":"加賀藩（かがはん）では、5代藩主（はんしゅ）前田綱紀（まえだつなのり）は、茶道を広めるため京都から千仙叟宗室（せんのせんそうそうしつ）を招いた。仙叟が始祖（しそ・はじめた人）といわれている茶道の流派はどれか。","o":["裏千家流","表千家流","武者小路流","宗和流"],"a":1,"e":"宗室は裏千家を名のり、表は宗左を、武者小路は宗守を名のる。宗和は金森宗和から始まる。","g":"美術・工芸・芸能"},{"n":43,"q":"金沢の地域福祉（ふくし）活動の原点でもあり、生活相談や授産・託児（たくじ）の援助（えんじょ）など地域の福祉・社会教育の拠点（きょてん）として 1934 年（昭和 9）から建てられた施設（しせつ）はどれか。","o":["友好館","善隣館（ぜんりんかん）","交流館","福祉館"],"a":2,"e":"善隣館は、市内 19 カ所誕生し、全国にも例を見ないシステムとして発展した。現在は金沢独自の地域福祉拠点として、高齢者（こうれいしゃ）福祉を中心に地域と密着した活動を続けている。","g":"市政・最近の話題"},{"n":44,"q":"1488 年（長享（ちょうきょう）2）、一向宗農民門徒（いっこうしゅうのうみんもんと）の一揆（いっき）軍が、高尾城（たこうじょう）を攻撃（こうげき）して守護の富樫政親（とがしまさちか）をたおした。この一揆を何というか。","o":["高尾の一揆","天文法華（てんもんほっけ）の乱","長享の一揆","鳥越一揆"],"a":3,"e":"一向宗農民門徒の一揆軍は、鳥越弘願寺、吉藤専光寺、木越光徳寺（きごしこうとくじ）を指導者とし、洲崎慶覚を大将とした。長享の一揆で守護富樫正親がほろんだ加賀国は「百姓の持ちたる国」と言われるようになり、1世紀にわたる坊主（ぼうず）、土豪（どごう）、農民たちによる加賀共和国（かがきょうわこく）が成立した。","g":"歴史"},{"n":46,"q":"明治になると金沢にも近代工業が起こった。長町に、群馬県富岡の工場をまねてつくられた国内で2番目の規模の工場の名前はどれか。","o":["金沢工場","金沢製綿所","金沢製糸場","金沢糸工場"],"a":3,"e":"長谷川準也（はせがわじゅんや）が発案し、津田吉之助（つだきちのすけ）が設計作成した。会社は不景気で成功しなかったが、金沢の近代工業が発展していくさきがけとなった。","g":"歴史"},{"n":47,"q":"金沢城跡（じょうあと）の発掘（はっくつ）調査で見つかった土から発見された出土品により、金沢で縄文時代以前に人間が活動していたことが確認された。この旧石器時代の出土品として見つかったものは何か。","o":["土器","石器","銅剣（どうけん）","鏡（かがみ）"],"a":2,"e":"発掘調査ででた土を金沢城の整地に用いていたが、その中に使用した跡（あと）のある石器がふくまれていた。小立野台地は当時の人々が、狩りをしたところであったと考えられている。","g":"寺社・建造物・まち"},{"n":48,"q":"金沢でのＳＤＧｓの推進に向けた具体的な行動について、ＳＤＧｓミーティングを通して、ＳＤＧｓカフェや市内のイベントへの出展、ホームページを通してたくさんのアイデアを集めた。このアイデアを総称して何というか。","o":["金沢アイデア","金沢ターゲット","金沢ＳＤＧｓ","金沢ミライシナリオ"],"a":4,"e":"持続可能な開発目標（ＳＤＧｓ）を達成するために、金沢で始まったプロジェクトを「IMAGINE KANAZAWA 2030」という。市民、地域、ＮＰＯ、企業、行政など様々な主体が集まり、今金沢が抱えている問題を一緒に考え、解決に向けて対話を重ねていく場を提供し、多様な主体がつながることで大きな力を生み出すことを促進（そくしん）している。","g":"市政・最近の話題"},{"n":49,"q":"金沢市には、歴史ある旧町名や昔の地名が多く残っているが、旧町名や昔の地名が忘れ去られることがないように、その由来を刻んだ標柱を何というか。","o":["金沢まちしるべ","旧町名しるべ","歴史由来しるべ","歴史のまちしるべ"],"a":4,"e":"旧町名には、武士の住んでいた主馬町（しゅめまち）や玄蕃町（げんばまち）、職人の住んでいた鍛冶町（かじまち）や桶町（おけちょう）など、藩政時代の町の性格を表したものが数多くあった。","g":"寺社・建造物・まち"},{"n":50,"q":"5代藩主（はんしゅ）前田綱紀（まえだつなのり）は、学問を好み、国中の貴重な書物を集めることに力を注ぎ、集めることのできないものは、そのまま写して集めた。このようにして集められ、大切に保存された文庫を何というか。","o":["前田文庫","金沢文庫","尊経閣（そんけいかく）文庫","加賀文庫"],"a":3,"e":"尊経閣文庫として名高く、写したものでは「東寺百合文書（とうじひゃくごうもんじょ）」が名高い。","g":"歴史"}]},{"id":"j16c","label":"第16回ジュニア（中学生版）2022","q":[{"n":1,"q":"金沢を上空から見ると、犀川（さいがわ）と浅野川（あさのがわ）の間に小立野（こだつの）台地がある。小立野台地の先端（せんたん）に（　　）城跡（じょうあと）があり、金沢の中心となっている。（　　）の中に入るのはどれか。","o":["小立野","卯辰","高尾","金沢"],"a":4,"e":"藩政（はんせい）時代、前田氏の居城であった。明治以降、軍隊、大学が利用していた。現在は金沢城公園となっている。","g":"寺社・建造物・まち"},{"n":2,"q":"金沢にはたくさんの方言がある。その中で「道がこおったようす」をあらわす方言はどれか。","o":["かんかんなまなま","きんきんなまなま","きんかんなまなま","こんこんぬまぬま"],"a":3,"e":"金柑（きんかん）の皮は新鮮（しんせん）であればあるほど表面がつるつるしていることに由来している。","g":"金沢ことば"},{"n":3,"q":"金沢が生んだ文豪（ぶんごう）、「幼年（ようねん）時代」「性に眼覚める頃（ころ）」などの小説や「犀川（さいがわ）」という詩などを発表した人物は誰（だれ）か。","o":["徳田 秋声（とくだ しゅうせい）","泉 鏡花（いずみ きょうか）","夏目 漱石（なつめ そうせき）","室生 犀星（むろお さいせい）"],"a":4,"e":"室生犀星は仕事場の上司から俳句を教えてもらったことがきかっけで、文学書をよく読むようになった。さらに、新聞に投稿（とうこう）した詩が雑誌に掲載（けいさい）されたことで、文学に対する熱意が高まった。","g":"文学"},{"n":4,"q":"加賀藩（はん）2代藩主前田利長（まえだとしなが）や3代藩主前田利常（まえだとしつね）は金沢城を守るために、内堀（うちぼり）、外堀（そとぼり）を造らせ、堀の内側には土を高く盛り上げた土居（どい）を築かせた。これらは何と呼ばれているか。","o":["腰曲輪（こしぐるわ）","馬出（うまだし）","惣構（そうがまえ）","逆茂木（さかもぎ）"],"a":3,"e":"内堀は内惣構、外堀は外惣構と呼ばれ、惣構肝煎（そうがまえきもいり）や惣構橋番などの町役人によって管理された。堀の中へゴミを捨てたり、土居をこわしたりすることなども、取りしまりの対象となった。","g":"寺社・建造物・まち"},{"n":5,"q":"上田作之丞（うえださくのじょう）の私塾拠遊館（きょゆうかん）で実学（じつがく）を学んだ中下級武士たちは、長連弘（ちょうつらひろ）により多数登用され、加賀藩の財政の立て直しにつとめた。こうした武士たちは人々から何と呼ばれていたか。","o":["黒羽織党（くろばおりとう）","赤母衣衆（あかほろしゅう）","三光寺派（さんこうじは）","八家（はっか）"],"a":1,"e":"拠遊館では学んだ学問をもとに実際の政治や経済について議論が行われ、藩のことを真剣（しんけん）に考える優れた中下級武士が大勢集まった。彼らは会合の時にそろって黒羽織を着たため、人々から黒羽織党と呼ばれるようになった。","g":"歴史"},{"n":6,"q":"水の豊富な金沢は、「用水のまち」としても有名である。市内には何本の用水が流れているか。","o":["30本","45本","55本","70本"],"a":3,"e":"55本の用水の総延長は150キロになる。農業灌漑（かんがい）、消火や融雪（ゆうせつ）などのほかに城下町の景観をひき立てている。","g":"寺社・建造物・まち"},{"n":7,"q":"八田與一（はったよいち）は当時アジア最大といわれた烏山頭（うさんとう）ダムや長大な水路を完成させるなど、不毛の大地を豊かな平野に変えたことで知られている。八田與一が活躍（かつやく）した場所はどこか。","o":["朝鮮（ちょうせん）","中国","台湾（たいわん）","タイ"],"a":3,"e":"金沢市出身の八田與一は台湾にわたり、烏山頭ダムを完成させた。その業績はアニメ映画「パッテンライ」で紹介されている。","g":"偉人・人物"},{"n":8,"q":"金沢の気候は、梅雨（つゆ）の季節や台風の頃（ころ）、そして特に冬は降水量が多くなる。このような気候を何というか。","o":["北日本型気候","日本海側気候","西日本側気候","北日本海気候"],"a":2,"e":"日本海岸式気候ともいわれる。","g":"自然・産業"},{"n":9,"q":"金沢市内の南部に豊かな自然にめぐまれた山がある。その山には加賀藩（かがはん）初代藩主（はんしゅ）前田利家（まえだとしいえ）とその正室(せいしつ・妻のこと)芳春院（ほうしゅんいん）、その他の歴代藩主や前田家一族の墓や、 金沢を代表する多くの著名人の墓があるが、その山を何というか。","o":["野田山（のだやま）","大乗寺山（だいじょうじやま）","卯辰山（うたつやま）","三子牛山（みつこうじやま）"],"a":1,"e":"墓地としては、天正年間に利家の兄の利久（としひさ）をほうむったのが始まりで、利家も遺言で墓を作った。","g":"寺社・建造物・まち"},{"n":10,"q":"金沢の町は、町奉行（まちぶぎょう）が支配していた。武士には武士の役人がいた。町人には町年寄（まちどしより）・散算用聞（ちりさんようきき）・町肝煎（まちきもいり）など町人の役人が仕事をしていた場所はどれか。","o":["町役場","公役所","町会所","公会堂"],"a":3,"e":"町会所は町人の生活すべてにかかわっていた。場所は下松原町。","g":"歴史"},{"n":11,"q":"加賀藩（はん）では、収入の少ない下級武士のくらしは決して楽ではなく、内職をして生計を立てる者が多くいた。このような下級武士の日常生活について学ぶことができる、長町にある旧清水家屋敷（やしき）を何というか。","o":["前田土佐守家資料館（まえだとさのかみけしりょうかん）","金沢文芸館（かなざわぶんげいかん）","金沢蓄音機館（かなざわちくおんきかん）","足軽資料館（あしがるしりょうかん）"],"a":4,"e":"屋敷の敷地は 50 坪（つぼ）ほどで、裏手の庭は観賞（かんしょう）用というよりも、野菜作りや果樹など自給自足のための場所になっていた。","g":"寺社・建造物・まち"},{"n":12,"q":"1488 年（長享（ちょうきょう）2）、農民や僧（そう）たちが中心になって一向一揆（いっこういっき）をおこし、高尾(たこう)城を攻撃（こうげき）して守護富樫政親（とがしまさちか）を倒した。これ以降、加賀の国は何とよばれるようになったか。","o":["坊主（ぼうず）の持ちたる国","職人の持ちたる国","商人の持ちたる国","百姓（ひゃくしょう）の持ちたる国"],"a":4,"e":"一向一揆の後、守護は力を失い、一向宗の坊主・土豪（どごう）などが加賀国を治めるようになった。やがて、門徒（もんと）や一揆の中で仲間割れがおこると、本願寺が直接加賀を治めるようになった。","g":"歴史"},{"n":13,"q":"金沢には、金沢をホームタウンとしたスポーツチームに「Honey Bee（ハニー・ビー）」という団体がある。スポーツ種目名はどれか。","o":["ハンドボール","バレーボール","バトミントン","バスケットボール"],"a":1,"e":"Honey Bee は北國銀行のハンドボールチームで、数々の大会で日本 1 位となっている。チーム名の由来は「働き蜂（ばち）のように小さいのによく動く」ことからついた。","g":"市政・最近の話題"},{"n":14,"q":"金沢出身で、仏教を説明する本を出版したり講演したりして、仏教を外国に伝えた哲学者（てつがくしゃ）は誰（だれ）か。","o":["木村 栄（きむら ひさし）","高峰 譲吉（たかみね じょうきち）","鈴木 大拙（すずき だいせつ）","野口 遵（のぐち したがう）"],"a":3,"e":"2011 年(平成 23)その考えや足跡（そくせき）を国内外に発信し、理解を深め思索探求(しさくたんきゅう)の場として建物が建設された。記念館ではなく、「鈴木大拙館」としている。","g":"偉人・人物"},{"n":15,"q":"加賀藩（はん）では、3 代藩主前田利常が、それまでの家来が管理していた農政を改め、藩が直接農村を管理する方法をとった。藩の農政の安定につながったの方法はどれか。","o":["改作法","農政法","改農法","農改法"],"a":1,"e":"改作法は加賀藩の形を大きく変えた。武士は金沢に集住し、十村制（とむらせい）を採ることにより、農民による農民管理を完成した。他藩は真似できなかった。","g":"歴史"},{"n":16,"q":"金沢市の市章は 1891 年（明治 24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。","o":["桜","梅","松","桃"],"a":2,"e":"梅の形は前田家の梅鉢（うめばち）の紋章（もんしょう）からとったもので、消防のまといや下水道のふたにもアレンジされたものが使用されている。","g":"市政・最近の話題"},{"n":17,"q":"金沢市は、スポーツで人と街を元気にすることを目指しているが、スポーツを行うだけでなく、「観る、応援（おうえん）する、語り合う」ことが日常生活にとけこみ、金沢の風土として受けつがれていくように、2018 年（平成 30）に金沢市が制定した条例は何か。","o":["金沢市体育施設（しせつ）条例","金沢市スポーツ広場条例","金沢市スポーツ基本（きほん）条例","金沢市スポーツ文化推進（すいしん）条例"],"a":4,"e":"2015 年（平成 27）にはシティフルマラソンである「金沢マラソン」が開催（かいさい）されるようになり、金沢の魅力発信（みりょくはっしん）や経済（けいざい）の活性化（かっせいか）、市民の健康増進（けんこうぞうしん）を目的としている。","g":"市政・最近の話題"},{"n":18,"q":"北陸地方における最初の鉄道開業は、1882 年（明治 15）滋賀県の長浜（ながはま）市と福井県の敦賀（つるが）市の間である。金沢まで開業したのは何年か。","o":["1892 年（明治 25）","1895 年（明治 28）","1898 年（明治 31）","1900 年（明治 33）"],"a":3,"e":"小松から金沢まで開通したのが、1898 年（明治 31）4月1日であった。","g":"歴史"},{"n":19,"q":"江戸時代の北陸地方における農業の書物「耕稼春秋」（こうかしゅんじゅう）には農家の月ごとにする仕事や作るべき作物、肥料や農具のことなどが書かれているが、この書物を書いたのは誰（だれ）か。","o":["宮崎 安貞（みやざき やすさだ）","土屋 又三郎（つちや またさぶろう）","後藤 太兵衛（ごとう たへえ）","枝 権兵衛（えだ ごんべえ）"],"a":2,"e":"1は『農業全書』の著者、3は長坂用水の開削（かいさく）に関係、4は七ケ用水の開削に関係する。土屋又三郎は、現在は金沢市になっている旧御供田（ごくでん）村の十村役（とむらやく）であった。","g":"偉人・人物"},{"n":20,"q":"江戸時代、日本海から下関をまわり大坂に行く船は北前船（きたまえぶね）と呼ばれ、危険をともないながら莫大（ばくだい）な利益をあげた。これにより一代で巨万（きょまん）の富を築き、「海の百万石」としょうされた宮腰（みやのこし）の豪商（ごうしょう）は誰（だれ）か。","o":["茶屋 四郎次郎（ちゃや しろうじろう）","大野 弁吉（おおの べんきち）","銭屋 五兵衛（ぜにや ごへえ）","紀伊國屋 文左衛門（きのくにや ぶんざえもん）"],"a":3,"e":"宮腰は現在（げんざい）の金石である。銭屋五兵衛は全国に 34 か所の支店や出張所をもち、外国との密貿易も行っていたとされている。2019 年（令和元）に文化庁認定の日本遺産「荒波（あらなみ）をこえた男たちの夢がつむいだ異空間～北前船寄港地（きこうち）・船主集落（せんしゅしゅうらく）～」に金沢市が追加認定されている。","g":"偉人・人物"},{"n":21,"q":"金沢は伝統工芸が盛んである。そのうち金箔（きんぱく）は全国にその名がとどろいている。金沢の金箔の生産は全国で何位か。","o":["1位","2位","3位","4位"],"a":1,"e":"金箔をつくるには上質の和紙が必要で、清らかな水が豊富な金沢は、その和紙をつくる上でも良い条件がそろっていたとされている。","g":"美術・工芸・芸能"},{"n":22,"q":"1874 年（明治 7）、「金沢製糸場（せいしじょう）」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月（くらつき）用水から水を引き、大きな水車を使って機械を動かしていた。この「金沢製糸場」をつくった人物は誰（だれ）か。","o":["稲垣 義方（いながき よしかた）","森下 八左衛門（もりした はちざえもん）","長谷川 準也（はせがわ じゅんや）","津田 米次郎（つだ よねじろう）"],"a":3,"e":"長谷川準也はこのほかに撚糸（ねんし）会社や銅器（どうき）会社などをおこし、金沢の近代工業が発展していくさきがけとなった。また、第2代の金沢市長となった。","g":"偉人・人物"},{"n":23,"q":"1858 年（安政 5）、凶作（きょうさく）で米の値上がりに苦しむ人々が藩（はん）の米を出してくれるよう、卯辰山（うたつやま）から金沢城の殿様（とのさま）にさけんで救済をうったえた。この一揆（いっき）を何というか。","o":["世直し一揆（よなおしいっき）","徳政一揆（とくせいいっき）","百姓一揆","泣き一揆"],"a":4,"e":"泣き一揆の結果、藩からお救い米が出されたが、当時は直訴（じきそ）が禁止されていたため、主だった7人はとらえられ処刑（しょけい）された。亡くなった7人のために「七稲地蔵（なないねじぞう）」がつくられ、今も寿経寺（じゅきょうじ）にまつられている。","g":"歴史"},{"n":24,"q":"金沢には、今に伝わる年中行事が多く残っているが、6月（旧5月）にある無病息災（むびょうそくさい）を願う行事はどれか。","o":["人形供養（にんぎょうくよう）","針供養","しょうぶ湯","地蔵盆（じぞうぼん）"],"a":3,"e":"菖蒲（しょうぶ）は古くからさわやかな香りが邪気（じゃき）をはらい心身を清めるとして、軒（のき）に飾ったり、枕（まくら）の下にしいてねたりと、無病息災を願うために使われた。","g":"食・行事"},{"n":25,"q":"3代藩（はん）主前田利常（まえだとしつね）の時、板屋兵四郎（いたやへいしろう）に命じて辰巳（たつみ）用水を造らせた。その用水の取り入れ口は、犀川（さいがわ）上流のどこの村に作ったか。","o":["銚子（ちょうし）村","末村","上辰巳（かみたつみ）村","駒帰（こまがえり）村"],"a":3,"e":"犀川上流上辰巳村の東岩付近に取り入れ口を造り、岩をくりぬいてトンネルを掘り、用水を通した。","g":"寺社・建造物・まち"},{"n":26,"q":"豊臣秀吉（とよとみひでよし）にキリシタンとして追放され、領地を没収（ぼっしゅう）されたが、加賀藩（はん）初代藩主前田利家（まえだとしいえ）にむかえられ、金沢で熱心な布教を行い、多くの信者を得たのは誰（だれ）か。","o":["高山 右近（たかやま うこん）","有馬 晴信（ありま はるのぶ）","大友 義鎮（おおとも よししげ）","大村 純忠（おおむら すみただ）"],"a":1,"e":"金沢には何百人ものキリシタンがいて、南蛮（なんばん）寺が建てられ、ナタル（クリスマス）も行われていた。高山右近は城づくりにもすぐれ、金沢城のお堀（ほり）や利長が住んだ高岡城を造るときなどに活躍（かつやく）した。","g":"偉人・人物"},{"n":27,"q":"金沢の地域福祉（ふくし）活動の原点であり、現在でもいろいろな生活相談や授産・託児（たくじ）などの援助（えんじょ）、さらには図書館や教育的活動などの地域の福祉・社会教育の拠点（きょてん）となった、1934 年（昭和 9）から 1960 年（昭和 35）にかけて市内 19 か所に誕生したものは何か。","o":["公民館","善隣（ぜんりん）館","友宜（ゆうぎ）館","福祉館"],"a":2,"e":"現在も11館が活動を続けている。","g":"市政・最近の話題"},{"n":28,"q":"江戸時代末期、卯辰山（うたつやま）の開発が進み、「養生所（ようじょうしょ）」、「撫育所（ぶいくしょ）」、「神社」などが建てられた。また、織物・製糸・製陶（せいとう）・工芸などの工場も建てられ、ふもとは多くの人たちでにぎわった。こうした事業を行った加賀藩（はん）14 代藩主は誰（だれ）か。","o":["前田 慶寧（まえだ よしやす）","前田 重教（まえだ しげみち）","前田 吉徳（まえだ よしのり）","前田 斉泰（まえだ なりやす）"],"a":1,"e":"前田慶寧は福沢諭吉（ふくざわゆきち）の『西洋事情（せいようじじょう）』を読んで、ヨーロッパでは貧しい人々を救う制度や施設（しせつ）が整っていることを知り、加賀藩の人々が豊かに生活できるようにさまざまな事業を行った。このことから、他の藩から政治のお手本であると言われた。","g":"偉人・人物"},{"n":29,"q":"「緑」は都市の機能を高める効果がある。1974 年（昭和 49）、金沢市議会が議決した宣言はどれか。","o":["「緑の都市宣言」","「環境都市宣言」","「うるおい都市宣言」","「森林都市宣言」"],"a":1,"e":"「緑の都市宣言」の冒頭（ぼうとう）で、「緑は、すべての生命の根源であり、自然の健やかな脈拍（みゃくはく）そのものである」とのべている。","g":"市政・最近の話題"},{"n":30,"q":"春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子（わがし）があり、生活の中にいろどりと美をそえている。うち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。","o":["金花糖（きんかとう）","五色生菓子（ごしきなまがし）","氷室（ひむろ）まんじゅう","辻（つじ）うら"],"a":4,"e":"中に入っているおみくじは食べられないので気をつけよう。","g":"食・行事"},{"n":31,"q":"加賀藩（はん）5代藩主の前田綱紀（まえだつなのり）は、細工人（さいくにん）の技術向上と工芸技術を保存し記録するために、全国から二千点以上の工芸品を収集し、整理・分類した。日本工芸における各種標本の集大成とされるこの標本集を何というか。","o":["尊経閣文庫（そんけいかくぶんこ）","百工比照（ひゃくこうひしょう）","耕稼春秋（こうかしゅんじゅう）","百科全書（ひゃっかぜんしょ）"],"a":2,"e":"百工比照は江戸時代中頃（なかごろ）までの最高レベルの工芸品と一流の職人の技を伝える貴重なものである。原料・材料や製作過程を学ぶこともでき、御細工所（おさいくしょ）の職人たちは、全国の技術にならって技をみがき伝統を築きあげた。","g":"美術・工芸・芸能"},{"n":32,"q":"金沢港は 1954 年（昭和 29）に、大野港ともう一つの港が合併（がっぺい）してできた。もう一つの港はどれか。","o":["河北（かほく）港","昭和（しょうわ）港","粟崎（あわがさき）港","金石（かないわ）港"],"a":4,"e":"江戸（えど）時代、金石は宮腰（みやのこし）と呼ばれ、北前船が立ち寄る港町として大いに栄えた。","g":"市政・最近の話題"},{"n":33,"q":"金沢の地名は芋堀藤五郎（いもほりとうごろう）が砂金を洗った金洗沢（かなあらいのさわ）から起こったと伝えられている。一説には、この芋堀藤五郎ではないかともいわれ、名君として知られた加賀介（かがのすけ）（介は長官の次の位の人）は誰（だれ）か。","o":["富樫 忠頼（とがし ただより）","前田 利家（まえだ としいえ）","藤原 利仁（ふじわらの としひと）","源 義仲（みなもとの よしなか）"],"a":1,"e":"富樫氏は代々、加賀介として富樫郷（とがしごう）を支配していた。忠頼は4代目にあたり、12 代目の泰家（やすいえ）は能の『安宅（あたか）』や歌舞伎（かぶき）の『勧進帳（かんじんちょう）』で知られる。富樫氏は 1221 年（承久（じょうきゅう）3）の承久の乱以降に勢力を拡大し、17 代目の高家（たかいえ）以降、守護として加賀国を治めた。","g":"偉人・人物"},{"n":34,"q":"金沢市では、歴史ある旧町名や坂道などの由来をきざんだ標柱(ひょうちゅう)を市内 224 か所に建てた。その標柱を何というか。","o":["まちの歴史","歴史のしるべ","まちのしるべ","歴史のまちしるべ"],"a":4,"e":"1979 年(昭和 54)から 2019 年(令和元)までに 224 か所建てた。復活した旧町名の場合、旧の字がうめられいる。","g":"寺社・建造物・まち"},{"n":35,"q":"金沢には、金沢市無形民俗（みんぞく）文化財に指定された伝統行事が今もたくさん残っている。斧（おの）や刀、弓を持った山伏（やまぶし）が各家をまわる金石町や大野町で行われている行事はどれか。","o":["はしご登り","加賀万歳（かがまんざい）","さかたおどり","悪魔払い（あくまばらい）"],"a":4,"e":"各家の悪魔払いをする時には、家の中に入らんばかりの勢いで悪魔を払うまねをするので、子供たちは泣きさけんで家の奥（おく）ににげこむ様子が見られる。","g":"美術・工芸・芸能"},{"n":36,"q":"1869 年（明治 2）に加賀藩（はん）は版籍奉還（はんせきほうかん）によって金沢藩になった。その後、1871 年（明治 4）の廃藩置県（はいはんちけん）で金沢県となり、何度か県境が変わる中で、美川（みかわ）に県庁が移された時から石川県となったが、なぜ石川県と呼ばれるようになったか。","o":["初代県知事の名前が石川氏だったから","県庁のある美川が石川郡に所在したから","有名な石の産地やきれいな川が豊富にあるから","金沢城前の石川門が有名だったから"],"a":2,"e":"明治の新政府に敵対していた藩や、新政府に従うかどうか態度をはっきりと示さなかった藩に対して山や川の名前、郡の名前を県名にあてる方針をとっていたため、加賀藩から金沢県となったあと、さらに県名を変える動きがあった。","g":"歴史"},{"n":37,"q":"珠姫（たまひめ）は幕府 2 代将軍徳川秀忠（とくがわひでただ）の二女で、徳川、前田両家を結ぶため加賀藩3代藩主前田利常（まえだとしつね）にとついだが、24 歳の若さで亡くなった。珠姫の霊（れい）をまつるために利常がつくった寺を何というか。","o":["大乗寺（だいじょうじ）","天徳院（てんとくいん）","伏見寺（ふしみでら）","金沢御堂（かなざわみどう）"],"a":2,"e":"天徳院には珠姫の位牌（いはい）があり、珠姫ゆかりの品々や江戸時代の仏像が残されている。また、珠姫の一生を演じるからくり人形による芝居（しばい）が見られることでも知られている。","g":"寺社・建造物・まち"},{"n":38,"q":"明治時代の初期、国会開設をめざす自由民権運動が全国に広がると、金沢でも明治維新（いしん）に取り残された士族たちによって政治結社（せいじけっしゃ）がつくられた。最初につくられた政治結社を何というか。","o":["忠告社（ちゅうこくしゃ）","立志社（りっししゃ）","自助社（じじょしゃ）","愛国社（あいこくしゃ）"],"a":1,"e":"忠告社は 1875 年（明治8）に杉村寛正（すぎむらひろまさ）、陸義猶（くがよしなお）、長谷川準也（はせがわじゅんや）らを中心に、中下級士族たちによって設立された政治結社である。一時は社員 1200 人をこえたが、しだいに失業士族の生活を救うための活動が中心となっていった。","g":"歴史"},{"n":39,"q":"金沢市は、公共交通の補完(ほかん)を考えて、市民の気軽な移動手段としてバスを導入した。此花（このはな）・菊川（きくがわ）・材木（ざいもく）・長町（ながまち）の4ルートがあるバスはどれか。","o":["金沢循環（じゅんかん）バス","金沢まちバス","ふらっとバス","兼六園シャトルバス"],"a":3,"e":"金沢のせまい道路の中でも、路線バスの回らない地域を回っており、市民の足として利用価値が高い。","g":"市政・最近の話題"},{"n":40,"q":"平安時代はじめの 823 年（弘仁 14）、加賀国が誕生した。それはどの国から分かれて誕生したのか。","o":["越中国（えっちゅうのくに）","越前国（えちぜんのくに）","越後国（えちごのくに）","能登国（のとのくに）"],"a":2,"e":"越前国から江沼郡（えぬまぐん）・加賀郡（かがぐん）をさいて加賀国が誕生した。半年後に江沼郡の北半分を分けて能美郡（のみぐん）、加賀郡の南半分を分けて石川郡がたてられた。","g":"歴史"},{"n":41,"q":"金沢では現在も能が盛んである。加賀藩（はん）5代藩主前田綱紀（まえだつなのり）が取り入れたことから金沢で盛んになった能の流派は何か。","o":["金春流（こんぱるりゅう）","和泉流（いずみりゅう）","観世流（かんぜりゅう）","宝生流（ほうしょうりゅう）"],"a":4,"e":"加賀藩では代々の藩主たちが積極的に能楽や茶の湯を取り入れたが、特に前田綱紀は学問が好きで、有名な学者や貴重なものを国中から集めた。","g":"美術・工芸・芸能"},{"n":43,"q":"金沢には、昔から伝わる年中行事が今も数多く残っている。新年の正月に関係が深いものはどれか。","o":["消防の「出初式」（でぞめしき）","「氷室」の饅頭（まんじゅう）","墓参りの「切籠（きりこ）」","「七五三」の宮参り"],"a":1,"e":"この出初式では、市内の消防団員が新年に出そろい、裸（はだか）放水とはしご登りを披露（ひろう）する。","g":"食・行事"},{"n":44,"q":"藩政（はんせい）時代、金沢の町人の住む地域は、その役割や負担によって（　　）、地子町（じしまち）、寺社門前地（じしゃもんぜんち）などに格付けされ分かれていた。（　　）には、道路や橋の管理や修理の仕事をになっており、比較的（ひかくてき）生活に余裕（よゆう）のある町人が住んでいた。（　　）の中に入るのはどれか。","o":["中町","上町","片町","本町"],"a":4,"e":"金沢の多くは地子町で、藩主の土地を使わせてもらっていることから、土地の借り賃である地子銀（じしぎん）を納めなければならなかった。寺社門前地は、寺や神社の境内にできた町で、寺社奉行（じしゃぶぎょう）の支配となっていた。","g":"歴史"},{"n":45,"q":"近年の発掘（はっくつ）調査の結果、縄文人は高度な技術をもち、おしゃれで感性豊かな自然人であったことが明らかになっている。日本ではじめての石の指輪が出土した金沢の遺跡（いせき）はどこか。","o":["畝田（うねだ）遺跡","北塚（きたづか）遺跡","七ツ塚（ななつづか）遺跡","チカモリ遺跡"],"a":2,"e":"北塚遺跡は縄文時代中期の遺跡で、石の指輪のほか、ヒスイでできたペンダントなども出土している。","g":"歴史"},{"n":46,"q":"茶道普及（ふきゅう）のために京都から職人を招いて作らせた金沢の代表的な焼き物がある。ろくろを使わず手びねりによって作られた、独特の味わいのある飴色（あめいろ）が特色の焼き物を何というか。","o":["九谷焼（くたにやき）","大樋焼（おおひやき）","有田焼（ありたやき）","珠洲焼（すずやき）"],"a":2,"e":"京都から招かれた楽焼（らくやき）の陶工（とうこう）である長左衛門は、大樋村（現在の金沢市大樋町）に楽焼に適した土を見つけ、茶道のための茶碗（ちゃわん）をつくった。","g":"美術・工芸・芸能"},{"n":47,"q":"加賀藩（はん）では、村方(農村)の村々に対して、村の収穫（しゅうかく）高とそれに見合う年貢（ねんぐ）などの割当(わりあて)を書いた書面をわたした。それには藩主の黒印がおされており、（　　）と呼ばれ、村の役人たちが大切に保管していた。（　　）の中に入るのはどれか。","o":["村書付","村年貢（ねんぐ）書","村大切書","村御印（ごいん）"],"a":4,"e":"村御印には藩主の黒印があるので、村一番の大切なものとして保管されていた。","g":"歴史"},{"n":48,"q":"1689 年（元禄2）、松尾芭蕉（まつおばしょう）は「奥の細道」の旅の途中（とちゅう）、金沢に立ちった。その際、小杉一笑（こすぎいっしょう）の死をいたんでよんだ句はどれか。","o":["塚も動け わが泣く声は 秋の風","むざんやな 甲（かぶと）の下の きりぎりす","あかあかと 日は難面（つれなく）も 秋の風","山中や 菊（きく）はたおらじ 湯のにほひ"],"a":1,"e":"金沢では芭蕉から俳句の教えを受けようと名のある俳人たちが彼の来るのを待っていた。","g":"文学"},{"n":49,"q":"金沢市民芸術村は、市民が自主的に企画（きかく）したコンサートや芸術の練習の場として開放されているが、もともとは何の施設（しせつ）があったか。","o":["食品工場","紡績（ぼうせき）工場","バス整備場","中学校"],"a":2,"e":"リノベーションされた建物は、通産省（現：経済産業省）のグッドデザイン大賞最優秀（ゆうしゅう）賞、金沢都市美文化賞などの数々の受賞歴がある。","g":"市政・最近の話題"},{"n":50,"q":"江戸（えど）時代、金沢の町を治めるために、加賀藩（はん）は町人は町人らしく身分をわきまえて行動することを求めた。火の用心やキリシタン禁制など町人が日常生活において守らなければならないことがらが書かれた法令はどれか。","o":["町取締書","町方二日読","町人心得書","町読聞かせ書"],"a":2,"e":"町方二日読は町人の生活すべてにかかわっていた。毎月二日に町役が読み聞かせたという。村方にも二日読みがあった。","g":"歴史"}]},{"id":"j15c","label":"第15回ジュニア（中学生版）2021","q":[{"n":1,"q":"金沢には芋掘藤五郎（いもほりとうごろう）の伝説が残っている。この伝説で藤五郎が芋を洗ったとされている場所で、兼六園にある泉を何というか。","o":["蓮池（はすいけ）","霞が池（かすみがいけ）","瓢池（ひさごいけ）","金城霊沢（きんじょうれいたく）"],"a":4,"e":"金城霊沢は金洗沢（かなあらいのさわ）とも呼ばれ、「金沢」の地名はここから伝わったと言われている。また、藤五郎があらった芋は、自然薯（じねんじょ）という山芋と言われている。","g":"寺社・建造物・まち"},{"n":2,"q":"金沢には様々なボランティア団体がある。そのうち「まいどさん」はどのようなボランティアを行う団体か。","o":["まちをきれいにする清掃（せいそう）ボランティア","まちの案内をする観光ボランティア","まちを元気にする挨拶（あいさつ）ボランティア","金沢名物を販売（はんばい）する行商ボランティア"],"a":2,"e":"観光ボランティアは、まいどさんの他にも、外国語による観光案内や、兼六園や金沢城を専門に案内するガイドがいる。","g":"市政・最近の話題"},{"n":3,"q":"金沢には「兼六園（けんろくえん）」がある。兼六とは同時に成り立つことの困難な六つの優れた特徴（とくちょう）をもつことである。その六つとは「〔一〕宏大（こうだい）を務るは〔二〕幽邃（ゆうすい）少なし 〔三〕人力勝るは〔四〕蒼古（そうこ）少なし 〔五〕□多きは〔六〕□難し」で、これを兼（か）ね備えているといわれている。〔五〕□と〔六〕□の組合せで正しいものはどれか。","o":["〔五〕海辺と〔六〕山並","〔五〕築山と〔六〕池泉","〔五〕低地と〔六〕高台","〔五〕水泉と〔六〕眺望（ちょうぼう）"],"a":4,"e":"加賀藩（はん）12 代藩主前田斉広（まえだなりなが）の時代に「兼六園」という名がつけられた。1874 年（明治7）に兼六園は一般開放され、金沢市民のいこいの場となった。","g":"寺社・建造物・まち"},{"n":4,"q":"金沢の町中を南東方向から北西方向に犀川（さいがわ）と浅野川（あさのがわ）の2つの川が流れている。犀川の南には寺町台地が、浅野川の北には卯辰山（うたつやま）山地がある。2つの川の間の先端部（せんたんぶ）を金沢城址（じょうし）とする台地の名前はどれか。","o":["富樫（とがし）台地","小立野（こだつの）台地","長坂丘陵（きゅうりょう）","戸室（とむろ）山地"],"a":2,"e":"金沢市の地形は、西部の海岸に向かって丘陵地（きゅうりょうち）から平野へと変化し、次第になだらかになっている。","g":"寺社・建造物・まち"},{"n":5,"q":"1689 年（元禄（げんろく）2）、ある有名な俳人が金沢の俳人たちを訪ねて来た。しかし、残念ながら金沢の俳人の小杉一笑（こすぎいっしょう）は前の年に亡くなっていたので「塚（つか）も動け わが泣く声は 秋の風」の句をよんで彼の死を悲しんだ。この句をよんだ有名な俳人は誰（だれ）か。","o":["秋の坊（ぼう）","立花北枝（たちばなほくし）","松尾芭蕉（まつおばしょう）","与謝蕪村（よさぶそん）"],"a":3,"e":"芭蕉の句碑（くひ）は、兼六園や犀川（さいがわ）大橋左岸、金石の本龍寺（ほんりゅうじ）など金沢市内にも多く見られる。","g":"文学"},{"n":6,"q":"これまでのまちづくりの基本を受けつぎながら、金沢の資産を活用して、国内外から人・モノ・情報の集積を図り、その交流を通じて新たな価値を創造し、持続的に発展を続けるまちを実現するために、金沢市が都市づくりの指針として2013 年（平成 25）に作成したものは次のうちどれか。","o":["世界の「交流拠点（きょてん）都市金沢」をめざして","世界の「持続可能な都市金沢」をめざして","世界の「文化的都市金沢」をめざして","世界の「歴史的都市金沢」をめざして"],"a":1,"e":"これを実現するために、5つの「重点戦略計画」を定めている。（「技術力に裏打ちされた新たな産業の創出」、「まちの品格を高める学術文化の醸成（じょうせい）」、「観光を軸（じく）とした交流の活発化」、「新幹線時代に対応した交通基盤（きばん）の整備」、あらゆる世代に対応した新たなコミュニティの形成」）","g":"市政・最近の話題"},{"n":7,"q":"江戸（えど）時代、年中行事として旧暦（きゅうれき）の6月1日に加賀藩（はん）から徳川将軍へ献上（けんじょう）された物にちなんで、金沢の町中で食べられるものはどれか。","o":["温泉饅頭（まんじゅう）","氷室（ひむろ）饅頭","大福饅頭","味噌（みそ）饅頭"],"a":2,"e":"加賀藩から徳川将軍へ冬の間に保存しておいた氷を献上したが、夏の氷は貴重品で、庶民（しょみん）が食することは大変だった。そのため、氷の代わりに麦で作った「氷室饅頭」を食べて無病息災を願う習慣だけが現在でも残っている。","g":"食・行事"},{"n":8,"q":"金沢の町は日本海側気候の影響（えいきょう）で、雨の多い町といわれる。まちなかでよく「□忘れても傘（かさ）忘れるな」といわれることがある。□の中に入る言葉はどれか。","o":["鞄（かばん）","長靴（ながぐつ）","弁当（べんとう）","帽子（ぼうし）"],"a":3,"e":"この言葉は、年間を通して雨の日が多いということだけではなく、1 日のうちに晴れ、雨、曇り、ときには雷と天気が変わりやすいことも意味している。","g":"金沢ことば"},{"n":9,"q":"加賀藩（はん）初代藩主前田利家（まえだとしいえ）が越前（えちぜん）を治めていた頃（ころ）、領民がお祝いにおどっていたおどりが金沢に移り、能楽の影響（えいきょう）を受け舞（まい）や語りに品格があるものとして定着し、金沢市民の伝統芸能活動となったのが□である。□に入るものは次のどれか。","o":["寺中神事能","奴（やっこ）行列","ジョンカラ節","加賀万歳（まんざい）"],"a":4,"e":"「加賀万歳」は、能楽師（のうがくし）の大石藤五郎（おおいしとうごろう）が定着させたため、能楽の影響（えいきょう）を受け、舞（まい）や語りはユーモアのある中にも品格（ひんかく）があり、金沢市無形民俗（みんぞく）文化財に指定されている。","g":"美術・工芸・芸能"},{"n":10,"q":"1878 年（明治 11）、東京麹町区紀尾井町（こうじまちくきおいちょう）の路上で、馬車で皇居へ向かう途中（とちゅう）の政府高官・大久保利通（おおくぼとしみち）が暗殺されるという事件が起きた。この事件を起こした中心となる旧加賀藩士（はんし）は誰（だれ）か。","o":["金岩虎吉（かないわと
