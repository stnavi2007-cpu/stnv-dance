<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>百万石バトル（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d0a;--panel:#1b1711;--line:#3a3020;--gold:#d8b45a;--gold2:#f3dc9a;--red:#b8352b;--ink:#f3ede0;--mute:#a79c86;--green:#3f9a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:90px;overscroll-behavior:none}
svg{display:block;width:100%;height:auto}
img.px{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
/* 歴史ゲームの窓：ドットの見出し×読みやすい本文 */
header h1,.card h2,.big,.bz,.lv,.timer,.pname,.koku,.sg,.chip{font-family:"DotGothic16","Hiragino Sans",sans-serif;font-weight:400;letter-spacing:.04em}
.card{border:2px solid #6a5530;border-radius:6px;box-shadow:inset 0 0 0 2px #120f0a,inset 0 0 0 3px #4a3c24}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#1b1711,#0f0d0a);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:19px;letter-spacing:.08em;color:var(--gold2)}
header h1 small{display:block;font-size:10px;color:var(--mute);letter-spacing:.2em}
.koku{font-weight:800;color:var(--gold);font-size:16px;text-align:right;line-height:1.2}
.koku small{display:block;color:var(--mute);font-weight:400;font-size:11px}
main{padding:12px;max-width:520px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px;color:var(--gold2)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:12px;padding:11px 13px;background:#2a2318;color:var(--ink);font-weight:700;cursor:pointer}
button.pri{background:linear-gradient(135deg,#b8352b,#7d1f18);color:#fff;width:100%;font-size:17px;padding:14px}
button.gold{background:linear-gradient(135deg,#d8b45a,#9c7a2a);color:#1b1711}
button:disabled{opacity:.4}
.mute{color:var(--mute);font-size:13px}
.big{font-size:26px;font-weight:900;color:var(--gold)}.big small{font-size:13px;color:var(--mute)}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0d0a;color:var(--ink);font-size:16px}
.tag{display:inline-block;background:#2a2318;border-radius:999px;padding:1px 9px;font-size:11px;color:var(--gold2);margin-left:6px;vertical-align:middle;font-weight:700}
.notice{font-size:12px;color:var(--mute);border-left:3px solid var(--line);padding-left:8px}
.center{text-align:center}
hr{border:0;border-top:1px solid #2a2318;margin:12px 0}
.prog{height:6px;background:#2a2318;border-radius:4px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#9c7a2a,#f3dc9a);width:0;transition:width .3s}
/* 登録 */
.avbig{width:150px;margin:0 auto 12px}
.seg{display:flex;gap:6px;margin-top:4px}.seg button{flex:1;padding:12px 4px}.seg button.on{background:linear-gradient(135deg,#d8b45a,#9c7a2a);color:#1b1711}
.seg.sm button{padding:8px 4px;font-size:13px}
.okbox{display:flex;align-items:center;gap:10px;background:#241d12;border-radius:12px;padding:10px;margin-top:12px}.okbox svg{width:48px;flex:none}
.klist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto;margin-top:6px}
.kitem{display:flex;align-items:center;gap:10px;text-align:left;background:#211b12;padding:8px 10px}
.kf{width:38px;flex:none}.kf.sm{width:26px;display:inline-block;vertical-align:middle}
.kn{flex:1;font-weight:800}.kn small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.km{font-weight:800;color:var(--gold2)}.first{color:#9fd48a;font-size:12px}
/* プロフィール */
.prof{display:flex;gap:12px;align-items:center}
.av{width:92px;flex:none}
.pname{font-size:19px;font-weight:900}.pk{font-weight:700;margin:2px 0;display:flex;align-items:center;gap:4px}
.sg{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#2a2318;color:var(--gold2)}.sg.up{background:#2c3a1e;color:#bfe6a0}.sg.dn{background:#2b3a4f;color:#cfe3ff}
.evb{margin-top:8px;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}.evb.ng{background:#2b3a4f;color:#cfe3ff}.evb.ok{background:#3a2a12;color:#ffd98a}
.rank{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #2a2318}.rank.me{background:#241d12;border-radius:10px;padding:8px 6px}
.bz{width:62px;font-size:12px;font-weight:900;color:var(--gold)}.rank .name{flex:1;font-weight:700}.rank .name small{display:block;color:var(--mute);font-size:11px;font-weight:400}.rank .pt{font-weight:800;color:var(--gold2);font-size:14px}
/* ミニゲーム */
.games{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.gm{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;background:#241d12}.gm small{color:var(--mute);font-weight:400}
.gi{width:100%;max-width:120px;height:62px;display:flex;align-items:center;justify-content:center}.gi svg{max-height:62px;width:auto}
.gimg{max-width:260px;margin:0 auto 6px}.gimg svg{max-height:90px;width:auto;margin:0 auto}
.potw{position:relative;margin:4px auto 8px;max-width:320px}.pot{position:absolute;left:14%;right:14%;top:6%;display:flex;justify-content:center;gap:2px}.pot span{width:15%}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ing{background:#241d12;border:1px solid var(--line);padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;font-size:13px}.ing svg{width:72%}
.ing.sel{outline:2px solid var(--gold);background:#3a2e18}.ing.good{background:#1f4a2c}.ing.bad{background:#4a1f1f}.ing.miss{outline:2px dashed #9fd48a}
.timer{font-size:22px;font-weight:900;color:var(--gold2)}.timer.hot{color:#ff6a5c}
.stage{position:relative;height:300px;background:#0f0d0a;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin:8px 0}
.veg{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:210px;background:#241d12;border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center;font-weight:800;font-size:17px;touch-action:none;user-select:none}
.vimg{width:130px;margin:0 auto}
.lane{position:absolute;top:8px;font-size:12px;color:var(--mute);font-weight:700}.lane.l{left:10px}.lane.r{right:10px}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}.flash.ok{background:rgba(63,154,90,.35);opacity:1;transition:opacity .4s}.flash.ng{background:rgba(184,53,43,.4);opacity:1;transition:opacity .4s}
/* クイズ */
.q{font-size:18px;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;background:#241d12;border:1px solid var(--line);font-weight:600;padding:14px}
.opt.ok{background:#1f4a2c;border-color:var(--green)}.opt.ng{background:#4a1f1f;border-color:var(--red)}
.ox{letter-spacing:.1em;font-size:20px}
.abar{position:fixed;left:0;right:0;bottom:0;background:#1b1711;border-top:1px solid var(--line);padding:10px 14px;z-index:9;display:none}.abar.on{display:block}.abar .res{font-weight:800;margin-bottom:6px}
/* 城下町 */
.town{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;background:linear-gradient(#1d2a16,#16130d);border-radius:12px;padding:8px}
.town.mini{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.town .lot{background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--ink);font-weight:700;line-height:1.25}
.town .lot span{text-align:center;padding:0 2px 4px}.town .lot.old svg{filter:grayscale(.85) brightness(.75)}
.cbs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cb{background:#241d12;border-radius:10px;padding:8px;font-size:12px;display:flex;flex-direction:column}.cb b{color:var(--gold2)}.cb span{color:var(--mute)}.cb em{font-style:normal;font-weight:900;font-size:15px}.cb em small{font-weight:400;color:var(--mute);font-size:11px}
.bl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2a2318}.bl.done{opacity:.5}.bt{width:68px;flex:none}.bl button{padding:9px 10px;font-size:14px;flex:none}
.bimg{width:180px;margin:0 auto}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px}.item{background:#211b12;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.55}.item.on{opacity:1;outline:1px solid var(--gold)}.item small{font-size:11px}.ii{width:70px}
/* はぐれ */
.hg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.hgbox{background:var(--panel);border:2px solid #ff6a5c;border-radius:16px;padding:14px;width:100%;max-width:480px;animation:shake .4s}
.hgm{width:96px;margin:0 auto;animation:bob 1s infinite alternate}.hgt{font-size:19px;font-weight:900;color:#ff9a8f;text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bob{to{transform:translateY(-6px)}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#d8b45a;color:#1b1711;font-weight:800;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:40;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;font-size:15px}.toast.on{opacity:1}
/* 内政・地図・カード */
.nmini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}.nm{display:flex;flex-direction:column;align-items:center;font-size:12px}.nm svg{border-radius:10px}.nm small{color:var(--gold2);font-weight:800}
.ncard .nimg{width:72px;flex:none}.lv{font-weight:900;color:var(--gold2);background:#2a2318;border-radius:8px;padding:1px 8px}
.mapw{margin:8px -6px;border-radius:12px;overflow:hidden;background:#141a10}.mapw.big{margin:8px -10px}
.bcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bcard{background:linear-gradient(#2a2318,#1b1711);border:1px solid #4a3c24;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.bcard.rare{border-color:#d8b45a;box-shadow:0 0 0 1px #d8b45a55 inset}.bcard.done{opacity:.45}
.bph{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 50% 35%,#3a3020,#16130d)}.bph img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;left:6px;top:6px;background:#000a;color:var(--gold2);font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px}.chip.r{left:auto;right:6px;background:#d8b45a;color:#1b1711}
.bbody{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;font-size:13px}.bbody b{font-size:15px}.bbody .eff{color:#9fd48a;font-weight:800;font-size:12px}.bbody button{margin-top:auto;padding:9px 6px;font-size:13px}
.ib{flex:1;padding:10px 2px;font-size:14px;white-space:nowrap}.gold.ib{flex:1.4}
.bcard.big{max-width:260px;margin:0 auto}
canvas{display:none}img.share{width:100%;border-radius:12px;margin-top:8px}
</style>
</head>
<body>
<header><h1>百万石バトル<small>HYAKUMANGOKU BATTLE ・ 試作</small></h1><div class="koku" id="hdKoku">0石<small>蔵の石</small></div></header>
<main id="app"></main>
<div class="abar" id="abar"></div>
<div class="toast" id="toast"></div>
<canvas id="cv" width="1080" height="1080"></canvas>
<script>
/* ===== 百万石バトル：オリジナル挿絵（すべて自作SVG） ===== */
const ART={};
const SK="#f2d2b4",SK2="#e3b892",INK="#2a1f14";

/* ---------- 人物（性別×年代×位） ---------- */
// rank: 0足軽 1組頭 2侍大将 3家老 4大名
const RANKCOL=["#7a6646","#38597a","#8a2f2a","#4e3d78","#b8902e"];
function avatar(g,a,rank=0,bg="#3a3020",gold=false){
  const kid=a==="kodomo",old=a==="nenpai",f=g==="f";
  const hy=kid?60:54, hr=kid?27:24;              // 顔の位置・大きさ
  const hair=old?"#cfcac2":"#1d1712";
  const kc=RANKCOL[rank]||RANKCOL[0];
  const under=f?(kid?"#d65a7a":"#a8324a"):"#e9e2d0";
  let s=`<svg viewBox="0 0 120 140" data-px="52" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="bgr${g}${a}${rank}" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#5a4a30"/><stop offset="1" stop-color="${bg}"/></radialGradient>
  <linearGradient id="kim${g}${a}${rank}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${kc}"/><stop offset="1" stop-color="#1a140d"/></linearGradient></defs>
  <rect width="120" height="140" rx="16" fill="#3e3222"/><circle cx="60" cy="58" r="44" fill="#4c3e2a"/>`;
  // 髪（後ろ）
  if(f&&!kid)s+=`<ellipse cx="60" cy="${hy-2}" rx="${hr+5}" ry="${hr+6}" fill="${hair}"/>`;
  if(f&&kid)s+=`<path d="M${60-hr-3} ${hy-4} Q60 ${hy-hr-14} ${60+hr+3} ${hy-4} L${60+hr+3} ${hy+12} L${60-hr-3} ${hy+12}Z" fill="${hair}"/>`;
  // 体（着物＋羽織）
  const sw=kid?38:46, top=kid?hy+hr-2:hy+hr-4;
  s+=`<path d="M${60-sw} 140 Q${60-sw} ${top+14} ${60-14} ${top} L${60+14} ${top} Q${60+sw} ${top+14} ${60+sw} 140Z" fill="url(#kim${g}${a}${rank})"/>`;
  s+=`<path d="M48 ${top} L60 ${top+26} L72 ${top}" fill="${under}"/><path d="M50 ${top} L60 ${top+22} L70 ${top}" fill="none" stroke="#f6f0e2" stroke-width="2.2"/>`;
  if(rank>=1)s+=`<path d="M${60-sw+6} 140 L${60-16} ${top+6}M${60+sw-6} 140 L${60+16} ${top+6}" stroke="#d9c58a" stroke-width="1.6" opacity=".7"/>`;
  if(rank>=3)s+=`<circle cx="${60-sw/2-2}" cy="${top+22}" r="5.5" fill="none" stroke="#f3dc9a" stroke-width="1.6"/><circle cx="${60+sw/2+2}" cy="${top+22}" r="5.5" fill="none" stroke="#f3dc9a" stroke-width="1.6"/>`;
  if(rank>=4)s+=`<path d="M${60-sw} 140 Q${60-sw} ${top+14} ${60-14} ${top}" fill="none" stroke="#f3dc9a" stroke-width="2.5"/><path d="M${60+sw} 140 Q${60+sw} ${top+14} ${60+14} ${top}" fill="none" stroke="#f3dc9a" stroke-width="2.5"/>`;
  // 首・顔
  s+=`<rect x="54" y="${hy+hr-10}" width="12" height="12" fill="${SK2}"/>`;
  s+=`<ellipse cx="60" cy="${hy}" rx="${hr}" ry="${hr+2}" fill="${SK}"/>`;
  s+=`<ellipse cx="${60-hr}" cy="${hy+2}" rx="4" ry="6" fill="${SK2}"/><ellipse cx="${60+hr}" cy="${hy+2}" rx="4" ry="6" fill="${SK2}"/>`;
  // 目・眉・口
  const ey=hy+(kid?2:0), ex=kid?10:9;
  s+=old?`<path d="M${60-ex-4} ${ey} q4 3 8 0M${60+ex-4} ${ey} q4 3 8 0" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`
        :`<ellipse cx="${60-ex}" cy="${ey}" rx="${kid?3.4:2.8}" ry="${kid?4:3.4}" fill="${INK}"/><ellipse cx="${60+ex}" cy="${ey}" rx="${kid?3.4:2.8}" ry="${kid?4:3.4}" fill="${INK}"/><circle cx="${60-ex+1}" cy="${ey-1.2}" r="1" fill="#fff"/><circle cx="${60+ex+1}" cy="${ey-1.2}" r="1" fill="#fff"/>`;
  s+=`<path d="M${60-ex-5} ${ey-8} q5 ${f?-2:-3} 10 0M${60+ex-5} ${ey-8} q5 ${f?-2:-3} 10 0" stroke="${old?"#bdb6aa":hair}" stroke-width="${f?1.6:2.6}" fill="none" stroke-linecap="round"/>`;
  s+=`<path d="M55 ${hy+12} q5 ${kid?5:3.5} 10 0" stroke="#8a3b2e" stroke-width="2" fill="${kid?"#c24d4d":"none"}" stroke-linecap="round"/>`;
  if(kid||f)s+=`<ellipse cx="${60-ex-5}" cy="${ey+8}" rx="4.5" ry="2.6" fill="#f0a0a0" opacity=".55"/><ellipse cx="${60+ex+5}" cy="${ey+8}" rx="4.5" ry="2.6" fill="#f0a0a0" opacity=".55"/>`;
  if(old)s+=`<path d="M${60-hr+6} ${hy-11} q6 -2 12 0M${60+hr-18} ${hy-11} q6 -2 12 0" stroke="#c9a888" stroke-width="1.2" fill="none"/><path d="M${60-ex-6} ${ey+6} q3 2 6 0M${60+ex} ${ey+6} q3 2 6 0" stroke="#c9a888" stroke-width="1.1" fill="none"/>`;
  // 髪（前）
  if(!f&&!kid){ // 髷（ちょんまげ）
    s+=`<path d="M${60-hr} ${hy-6} Q${60-hr} ${hy-hr-4} 60 ${hy-hr-3} Q${60+hr} ${hy-hr-4} ${60+hr} ${hy-6} Q${60+hr-4} ${hy-hr+6} 60 ${hy-hr+5} Q${60-hr+4} ${hy-hr+6} ${60-hr} ${hy-6}Z" fill="${hair}"/>`;
    s+=`<ellipse cx="60" cy="${hy-hr+2}" rx="${hr-8}" ry="7" fill="${SK}"/>`; // 月代
    s+=`<rect x="54" y="${hy-hr-10}" width="12" height="7" rx="3" fill="${hair}"/><rect x="57" y="${hy-hr-18}" width="6" height="12" rx="3" fill="${hair}" transform="rotate(-10 60 ${hy-hr-12})"/>`;
    if(old)s+=`<path d="M${60-12} ${hy+14} Q60 ${hy+34} ${60+12} ${hy+14} Q60 ${hy+22} ${60-12} ${hy+14}Z" fill="#e6e2da"/>`;
  }else if(!f&&kid){ // 子ども（前髪）
    s+=`<path d="M${60-hr-1} ${hy+2} Q${60-hr-2} ${hy-hr-8} 60 ${hy-hr-6} Q${60+hr+2} ${hy-hr-8} ${60+hr+1} ${hy+2} Q${60+hr-6} ${hy-12} ${60+6} ${hy-10} L60 ${hy-14} L${60-8} ${hy-10} Q${60-hr+6} ${hy-12} ${60-hr-1} ${hy+2}Z" fill="${hair}"/>`;
    s+=`<rect x="56" y="${hy-hr-12}" width="8" height="8" rx="4" fill="${hair}"/>`;
  }else if(f&&kid){ // おかっぱ
    s+=`<path d="M${60-hr-3} ${hy+4} Q${60-hr-4} ${hy-hr-8} 60 ${hy-hr-7} Q${60+hr+4} ${hy-hr-8} ${60+hr+3} ${hy+4} L${60+hr-2} ${hy-8} L${60-hr+2} ${hy-8}Z" fill="${hair}"/>`;
    s+=`<rect x="${60-hr+2}" y="${hy-14}" width="${2*hr-4}" height="7" fill="${hair}"/>`;
    s+=`<circle cx="${60+hr-4}" cy="${hy-hr+2}" r="4.5" fill="#e7577a"/><circle cx="${60+hr-4}" cy="${hy-hr+2}" r="1.6" fill="#ffd6e0"/>`;
  }else{ // 日本髪（島田）＋かんざし
    s+=`<path d="M${60-hr-2} ${hy+2} Q${60-hr-3} ${hy-hr-6} 60 ${hy-hr-5} Q${60+hr+3} ${hy-hr-6} ${60+hr+2} ${hy+2} Q${60+hr-3} ${hy-hr+4} 60 ${hy-hr+6} Q${60-hr+3} ${hy-hr+4} ${60-hr-2} ${hy+2}Z" fill="${hair}"/>`;
    s+=`<ellipse cx="60" cy="${hy-hr-10}" rx="15" ry="9" fill="${hair}"/><ellipse cx="60" cy="${hy-hr-10}" rx="7" ry="4" fill="${old?"#9a948c":"#3a2c22"}"/>`;
    s+=`<rect x="44" y="${hy-hr-7}" width="32" height="3" rx="1.5" fill="${old?"#8a7a5a":"#c9a14a"}"/>`;
    if(!old)s+=`<circle cx="77" cy="${hy-hr-6}" r="4" fill="#e7577a"/><path d="M77 ${hy-hr-2} l2 9" stroke="#c9a14a" stroke-width="1.4"/>`;
  }
  if(gold)s+=`<path d="M${60-sw} 140 Q${60-sw} ${top+14} ${60-14} ${top} L${60+14} ${top} Q${60+sw} ${top+14} ${60+sw} 140" fill="none" stroke="#ffd76a" stroke-width="4"/><rect x="2" y="2" width="116" height="136" rx="15" fill="none" stroke="#ffd76a" stroke-width="3"/>`;
  return s+`</svg>`;
}

/* ---------- 校下の旗 ---------- */

/* ---------- ドット化（イラストを低解像度に落として、歴史ゲームらしいドット絵に） ---------- */
const PXC=new Map();
function pxKey(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h+":"+t.length}
function pxRender(svg,res){return new Promise(ok=>{const vb=(svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/)||[0,100,100]);const w=res,h=Math.round(res*vb[2]/vb[1]);
  const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);
    try{const d=x.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){p[i+3]=p[i+3]>110?255:0;for(let j=0;j<3;j++)p[i+j]=Math.min(255,Math.round(p[i+j]/17)*17)}x.putImageData(d,0,0)}catch(e){}
    ok(c.toDataURL())};im.onerror=()=>ok(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)})}
function pixelate(root){(root||document).querySelectorAll("svg[data-px]").forEach(el=>{if(el.closest(".nopx"))return;const res=+el.getAttribute("data-px"),t=el.outerHTML,k=pxKey(t)+"@"+res;
  const put=u=>{if(!u||!el.isConnected)return;const img=document.createElement("img");img.className="px";img.src=u;img.alt="";el.replaceWith(img)};
  if(PXC.has(k)){const v=PXC.get(k);if(typeof v==="string")put(v);else v.then(put);return}
  const pr=pxRender(t,res).then(u=>{PXC.set(k,u);return u});PXC.set(k,pr);pr.then(put)})}
if(typeof MutationObserver!=="undefined")new MutationObserver(()=>pixelate()).observe(document.documentElement,{childList:true,subtree:true});

const built=()=>S.town.filter(Boolean);

const bdef=id=>BLD.find(b=>b.id===id);
const disc=()=>1-.05*myLv("kogyo");

function units(cat){return built().reduce((s,b)=>{const d=bdef(b.id);if(!d||d.c!==cat)return s;return s+(d.uniq?UW:(d.w||1))*(b.old?.5:1)},0)}
function catBonus(cat){const c=CATS[cat];return c.max?c.max*(1-Math.pow(DECAY,units(cat))):0}
function harvest(){let sum=0,i=0;built().filter(b=>bdef(b.id)?.hv).sort((a,b)=>bdef(b.id).hv-bdef(a.id).hv).forEach(b=>{sum+=bdef(b.id).hv*Math.pow(.85,i++)*(b.old?.5:1)});
  if(S.invites>=1)sum+=3;sum+=1.2*myLv("nogyo")+.5*myLv("chisui");return Math.round(sum*10)/10}
function upkeep(){return Math.round(built().reduce((s,b)=>s+(b.old||!bdef(b.id)?0:b.paid*UPKEEP),0)*100)/100}
function mult(kind){let m=1;const map={quiz:"manabi",nyukon:"bunka",game:"sangyo",invite:"kotsu"};if(map[kind])m+=catBonus(map[kind]);m+=({quiz:.06*myLv("gakumon"),nyukon:.12*myLv("kogei"),game:.06*myLv("shogyo")}[kind]||0);m+=catBonus("meisho");if(S.invites>=10)m+=.05;return m}
function seasonEvent(){if(!S.lock)return null;const r=ranking();const i=r.findIndex(x=>x.k===S.kouka);const bs=catBonus("bousai");
  if(i===0){const p=Math.round(20*(1-bs)*(1-.15*myLv("chisui")));return {cls:"ng",t:`❄️ 大雪：首位の校下は獲得 −${p}%`+(p<20?`（防災・治水で軽減中）`:""),mul:1-p/100}}

  if(i>=r.length-6)return {cls:"ok",t:"🐎 援軍到着：下位の校下は獲得 +30%",mul:1.3};
  return null}

// 毎朝の決算（収穫と維持費。払えなければ老朽化）
function dailyTick(){if(!S.lock)return;const t=today();if(!S.tick){S.tick=t;save();return}
  const days=Math.min(7,dBetween(S.tick,t));if(days<=0)return;
  let hv=0,up=0,aged=0;
  for(let d=0;d<days;d++){const h=harvest();if(h){hv+=addKoku(h,"")}
    let u=upkeep();
    while(u>S.kura){const cand=built().filter(b=>!b.old&&bdef(b.id)).sort((a,b)=>b.paid-a.paid)[0];if(!cand)break;cand.old=1;aged++;u=upkeep()}
    S.kura-=u;up+=u}
  S.tick=t;S.kura=Math.round(S.kura*100)/100;S.report={hv:Math.round(hv*10)/10,up:Math.round(up*10)/10,aged,days};save()}

function invest(id,v){v=Math.floor(v);if(v<=0||S.kura<v)return;const before=myLv(id);S.kura-=v;S.inv[id]=(S.inv[id]||0)+v;S.kouken+=v;save();

/* ---------- 地図（3Dの斜め俯瞰） ---------- */
const PJ=(x,y)=>[(x-y)*16+180,(x+y)*8+78];
const pts=a=>a.map(p=>PJ(...p).join(",")).join(" ");
function isoMap(sel){const rk=ranking(),mx=Math.max(1,...rk.map(x=>x.koku));
  let s=`<svg viewBox="0 0 360 270" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4a6e"/><stop offset="1" stop-color="#173a58"/></linearGradient></defs>`;
  s+=`<polygon points="${pts([[-2.6,-1],[-.6,-1],[-.6,11],[-2.6,11]])}" fill="url(#sea)"/>`;
  s+=`<text x="${PJ(-1.8,3)[0]}" y="${PJ(-1.8,3)[1]}" font-size="9" fill="#8fb9d8" font-family="sans-serif" transform="rotate(27 ${PJ(-1.8,3).join(" ")})">日本海</text>`;
  s+=`<polygon points="${pts([[-.6,-1],[11,-1],[11,11],[-.6,11]])}" fill="#2c3a22"/>`;
  s+=`<polygon points="${pts([[8.6,-1],[11,-1],[11,11],[8.6,11]])}" fill="#253220"/>`;
  [[9.6,1.5],[10.4,3],[9.4,5],[10.5,7],[9.6,10.5],[10.6,10]].forEach(([x,y])=>{const[a,b]=PJ(x,y);s+=`<path d="M${a-9} ${b} L${a} ${b-14} L${a+9} ${b}Z" fill="#3a4a2e"/><path d="M${a-3} ${b-9} L${a} ${b-14} L${a+3} ${b-9}Z" fill="#e8ecef" opacity=".7"/>`});
  const river=(p,n,lab)=>{s+=`<polyline points="${pts(p)}" fill="none" stroke="#4f8ac0" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`;const[a,b]=PJ(...lab);s+=`<text x="${a}" y="${b}" font-size="8" fill="#9cc8ec" font-family="sans-serif" font-weight="700">${n}</text>`};
  river([[10.8,10.4],[8.6,9.2],[7,8.2],[5.6,7.6],[4.5,6.6],[3.4,6.3],[2,5.6],[.6,5.2],[-.8,5.1]],"犀川",[7.8,9.6]);
  river([[10.8,2.2],[8.6,3.4],[7.2,4.1],[5.6,4.5],[4.5,3.6],[3,3.6],[1.4,2.8],[-.8,2.4]],"浅野川",[8.4,2.6]);
  const L=KOUKA.filter(k=>POS[k]).map(k=>({k,p:POS[k],r:rk.find(x=>x.k===k)})).sort((a,b)=>(a.p[0]+a.p[1])-(b.p[0]+b.p[1]));
  const tile=(x,y,h,c,k,me)=>{const d=.42,t=[[x-d,y-d],[x+d,y-d],[x+d,y+d],[x-d,y+d]].map(p=>PJ(...p));const up=t.map(([a,b])=>[a,b-h]);
    return `<g onclick="mapTap('${k}')" style="cursor:pointer"><polygon points="${[t[3],t[2],up[2],up[3]].map(p=>p.join(",")).join(" ")}" fill="${c}" style="filter:brightness(.7)"/><polygon points="${[t[1],t[2],up[2],up[1]].map(p=>p.join(",")).join(" ")}" fill="${c}" style="filter:brightness(.5)"/><polygon points="${up.map(p=>p.join(",")).join(" ")}" fill="${c}" stroke="${me?"#ffd76a":"#00000055"}" stroke-width="${me?2:.6}"/></g>`};
  let mine=null;
  L.forEach(o=>{const h=3+o.r.koku/mx*46,me=o.k===sel;s+=tile(o.p[0],o.p[1],h,o.r.m?color(o.k):"#5a5446",o.k,me);if(me)mine={...o,h}});
  if(mine){const[a,b]=PJ(...mine.p),top=b-mine.h;const lab=`${mine.k} ${fmt(mine.r.koku)}石`,w=lab.length*8.4+14;
    s+=`<line x1="${a}" y1="${top}" x2="${a}" y2="${top-26}" stroke="#ffd76a" stroke-width="1.5"/><g transform="translate(${Math.min(352-w,Math.max(8,a-w/2))} ${top-46})"><rect width="${w}" height="20" rx="10" fill="#1b1711" stroke="#ffd76a"/><text x="${w/2}" y="14" font-size="11.5" font-weight="900" text-anchor="middle" fill="#f3dc9a" font-family="sans-serif">${lab}</text></g><circle cx="${a}" cy="${top}" r="3.5" fill="#ffd76a"/>`}
  return s+`</svg>`}

function qShow(){abar.className="abar";const q=QUIZ[Q.order[Q.i]],ord=shuffle([0,1,2,3]);
  app.innerHTML=`<div class="card"><div class="prog"><i style="width:${Q.i*10}%"></i></div><div class="mute">第${Q.i+1}問 / 10</div><div class="q">${q.q}</div>${ord.map(j=>`<button class="opt" data-j="${j}" onclick="qAns(${j})">${q.o[j]}</button>`).join("")}</div>`}
function qAns(j){const q=QUIZ[Q.order[Q.i]],ok=j===q.a;document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const k=+b.dataset.j;if(k===q.a)b.classList.add("ok");else if(k===j)b.classList.add("ng")});
  Q.ox+=ok?"🟡":"⚫";if(ok)Q.n++;
  abar.className="abar on";abar.innerHTML=`<div class="res">${ok?"🟡 正解！":"⚫ 不正解"} <span class="mute">正解「${q.o[q.a]}」</span></div><div class="mute" style="margin-bottom:8px">${q.e}</div><button class="pri" onclick="qNext()">${Q.i<9?"次の問題へ":"結果を見る"}</button>`}
function qNext(){Q.i++;if(Q.i<10)return qShow();
  const got=addKoku(Q.n*PT.quiz+(Q.n===10?PT.quizAll:0),"今日の十問","quiz");dayRec().quiz={ox:Q.ox,n:Q.n,koku:got};
  S.streak=(S.last&&dBetween(S.last,today())===1)?S.streak+1:1;S.last=today();save();
  abar.className="abar";app.innerHTML=`<div class="card center"><div class="mute">今日の十問</div><div class="big">${Q.n}/10</div><div class="ox">${Q.ox}</div><div style="margin:8px 0;font-weight:800">+${f1(got)}石</div><div class="mute">連続 ${S.streak}日</div>
  <button class="gold" style="margin-top:10px;width:100%" onclick="share()">📸 結果を画像にして共有</button><div id="shareBox"></div><button style="margin-top:8px;width:100%" onclick="home()">ホームへ</button></div>`}

/* ---------- 一問入魂 ---------- */
function nyukon(){const q=NYUKON[hash(today())%NYUKON.length],ord=shuffle([0,1,2,3]);abar.className="abar";
  app.innerHTML=`<div class="card"><h2>🎯 一問入魂</h2><div class="mute">1回きり。よく考えて。</div><div class="q">${q.q}</div>${ord.map(j=>`<button class="opt" data-j="${j}" onclick="nyAns(${j})">${q.o[j]}</button>`).join("")}</div>`}
function nyAns(j){const q=NYUKON[hash(today())%NYUKON.length],ok=j===q.a;document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const k=+b.dataset.j;if(k===q.a)b.classList.add("ok");else if(k===j)b.classList.add("ng")});
  const got=ok?addKoku(PT.nyukon,"一問入魂","nyukon"):0;dayRec().ny={ok,koku:got};save();
  abar.className="abar on";abar.innerHTML=`<div class="res">${ok?"🎉 正解！ +"+f1(got)+"石":"⚫ 不正解"} <span class="mute">正解「${q.o[q.a]}」</span></div><div class="mute" style="margin-bottom:8px">${q.e}</div><button class="pri" onclick="home()">ホームへ</button>`}

/* ---------- はぐれ問題 ---------- */
let HG=null,HGP=false;
function maybeHagure(){const r=dayRec();if(r.hagure!=null||HG||HGP)return;const rate=S.invites>=3?.6:.35;if(Math.random()>rate){r.hagure=false;save();return}
  HGP=true;setTimeout(()=>{HGP=false;if(HG||dayRec().hagure!=null||abar.classList.contains("on"))return;showHagure()},1500)}
function showHagure(){if(HG)return;const q=HAGURE[Math.floor(Math.random()*HAGURE.length)],ord=shuffle([0,1,2,3]);HG={q,t:5000,start:Date.now()};
  const ov=document.createElement("div");ov.className="hg";ov.id="hg";
  ov.innerHTML=`<div class="hgbox"><div class="hgm">${ART.hagure}</div><div class="hgt">はぐれ雪坊が あらわれた！</div><div class="mute">5秒で逃げる・正解で5石</div><div class="prog" style="height:8px;margin:8px 0"><i id="hgbar" style="width:100%;background:#ff6a5c"></i></div><div class="q">${q.q}</div>${ord.map(j=>`<button class="opt" onclick="hgAns(${j})">${q.o[j]}</button>`).join("")}</div>`;
  document.body.appendChild(ov);
  HG.timer=setInterval(()=>{const left=HG.t-(Date.now()-HG.start),b=$("#hgbar");if(b)b.style.width=Math.max(0,left/HG.t*100)+"%";if(left<=0)hgEnd(null)},50)}
function hgAns(j){hgEnd(j===HG.q.a)}
function hgEnd(ok){clearInterval(HG.timer);$("#hg")?.remove();const r=dayRec();
  if(ok)r.hagure=addKoku(PT.hagure,"はぐれ雪坊をたおした");else{r.hagure=0;toast("はぐれ雪坊は 逃げ出した…")}save();HG=null;home()}

/* ---------- 治部煮をつくれ ---------- */
let J;
function jibu(){abar.className="abar";app.innerHTML=`<div class="card"><div class="gimg">${ART.nabe}</div><h2>🍲 治部煮をつくれ</h2><div class="mute">12の具材から、治部煮に入れる<b>6つ</b>を選んで鍋へ。にせ具材は減点。制限時間60秒。</div><div class="notice" style="margin-top:8px">ヒント：鴨肉に粉をまぶして、だしで煮る。仕上げにわさび。</div><button class="pri" style="margin-top:12px" onclick="jibuStart()">スタート</button><button style="width:100%;margin-top:8px" onclick="home()">やめる</button></div>`}
function jibuStart(){J={t:60,sel:[],done:false,items:shuffle([...JIBU_OK.map(n=>({n,ok:true})),...JIBU_NG.map(n=>({n,ok:false}))])};
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">🍲 治部煮</h2><div class="timer" id="tm">60</div></div>
  <div class="potw">${ART.nabe}<div class="pot" id="pot"></div></div>
  <div class="grid">${J.items.map((it,k)=>`<button class="ing" id="ing${k}" onclick="jibuPick(${k})">${ART.ing[it.n]}<span>${it.n}</span></button>`).join("")}</div>
  <button class="pri" style="margin-top:12px" id="jibuGo" onclick="jibuFinish()" disabled>できあがり！（6つ選ぶと押せます）</button></div>`;
  J.timer=setInterval(()=>{J.t--;const tm=$("#tm");if(!tm)return clearInterval(J.timer);tm.textContent=J.t;if(J.t<=10)tm.classList.add("hot");if(J.t<=0)jibuFinish()},1000)}
function jibuPick(k){if(J.done)return;const el=$("#ing"+k),i=J.sel.indexOf(k);if(i>=0){J.sel.splice(i,1);el.classList.remove("sel")}else{if(J.sel.length>=6)return toast("鍋は6つまで");J.sel.push(k);el.classList.add("sel")}
  $("#pot").innerHTML=J.sel.map(k=>`<span>${ART.ing[J.items[k].n]}</span>`).join("");$("#jibuGo").disabled=J.sel.length!==6}
function jibuFinish(){if(J.done)return;J.done=true;clearInterval(J.timer);let good=0,bad=0;
  J.items.forEach((it,k)=>{const el=$("#ing"+k),p=J.sel.includes(k);if(p&&it.ok){good++;el.classList.add("good")}if(p&&!it.ok){bad++;el.classList.add("bad")}if(!p&&it.ok)el.classList.add("miss")});
  const perfect=good===6&&bad===0;const got=addKoku(Math.max(0,good-bad+(perfect?3+Math.floor(J.t/10):0)),"治部煮","game");dayRec().jibu=got;save();
  abar.className="abar on";abar.innerHTML=`<div class="res">${perfect?"🎉 完璧な治部煮！":`正しい具材 ${good}/6 ・ にせ具材 ${bad}`}</div><div class="mute" style="margin-bottom:8px">治部煮＝鴨肉（または鶏肉）に小麦粉をまぶし、だしで煮て、すだれ麩・しいたけ・せりを合わせ、わさびを添える。</div><button class="pri" onclick="home()">+${f1(got)}石 ・ ホームへ</button>`}

/* ---------- 加賀野菜 仕分け ---------- */
let K;
const deck=()=>shuffle([...KAGA.map(v=>({v,ok:true})),...NOTKAGA.map(v=>({v,ok:false}))]);
function kaga(){abar.className="abar";app.innerHTML=`<div class="card"><div class="gimg row" style="justify-content:center">${veg("thick","#f4f0e6")}${veg("kabocha","#d8582a")}${veg("nasu","#3a1f4a","#6a2a7a")}</div><h2>🥬 加賀野菜 仕分け</h2><div class="mute">出てきた野菜が<b>加賀野菜15品目</b>なら<b>右</b>へ、ちがえば<b>左</b>へスワイプ（ボタンでもOK）。45秒で何枚さばける？</div><button class="pri" style="margin-top:12px" onclick="kagaStart()">スタート</button><button style="width:100%;margin-top:8px" onclick="home()">やめる</button></div>`}
function kagaStart(){K={t:45,ok:0,ng:0,done:false,deck:deck()};
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">🥬 仕分け</h2><div class="timer" id="tm">45</div></div>
  <div class="stage" id="stage"><div class="lane l">← ちがう</div><div class="lane r">加賀野菜 →</div><div class="flash" id="flash"></div><div class="veg" id="veg"></div></div>
  <div class="row"><button style="flex:1" onclick="kagaJudge(false)">← ちがう</button><button class="gold" style="flex:1" onclick="kagaJudge(true)">加賀野菜 →</button></div>
  <div class="mute center" style="margin-top:6px">正解 <b id="kok">0</b> ・ ミス <b id="kng">0</b></div></div>`;
  kagaNext();swipe($("#veg"));
  K.timer=setInterval(()=>{K.t--;const tm=$("#tm");if(!tm)return clearInterval(K.timer);tm.textContent=K.t;if(K.t<=10)tm.classList.add("hot");if(K.t<=0)kagaFinish()},1000)}
function kagaNext(){if(K.done||!$("#veg"))return;if(!K.deck.length)K.deck=deck();K.cur=K.deck.pop();const v=$("#veg");const [n,ty,c1,c2]=K.cur.v;v.innerHTML=`<div class="vimg">${veg(ty,c1,c2)}</div>${n}`;v.style.transition="none";v.style.transform="translateX(-50%)"}
function kagaJudge(right){if(K.done)return;const ok=right===K.cur.ok,f=$("#flash");f.className="flash "+(ok?"ok":"ng");setTimeout(()=>f.className="flash",300);
  ok?K.ok++:K.ng++;$("#kok").textContent=K.ok;$("#kng").textContent=K.ng;if(!ok)toast(`${K.cur.v[0]} は ${K.cur.ok?"加賀野菜です":"加賀野菜ではありません"}`);
  const v=$("#veg");v.style.transition="transform .18s";v.style.transform=`translateX(${right?"120%":"-320%"})`;setTimeout(kagaNext,180)}
function swipe(el){let sx=0,dx=0;el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;dx=0},{passive:true});
  el.addEventListener("touchmove",e=>{dx=e.touches[0].clientX-sx;el.style.transition="none";el.style.transform=`translateX(calc(-50% + ${dx}px)) rotate(${dx/15}deg)`},{passive:true});
  el.addEventListener("touchend",()=>{if(Math.abs(dx)>70)kagaJudge(dx>0);else{el.style.transition="transform .15s";el.style.transform="translateX(-50%)"}})}
function kagaFinish(){if(K.done)return;K.done=true;clearInterval(K.timer);const got=addKoku(Math.min(PT.kagaMax,Math.max(0,Math.round(K.ok*.8-K.ng*.5))),"加賀野菜","game");dayRec().kaga=got;save();
  abar.className="abar on";abar.innerHTML=`<div class="res">正解 ${K.ok} ・ ミス ${K.ng}</div><div class="mute" style="margin-bottom:8px">加賀野菜15品目：${KAGA.map(v=>v[0]).join("・")}</div><button class="pri" onclick="home()">+${f1(got)}石 ・ ホームへ</button>`}

/* ---------- 共有画像（人物の絵入り） ---------- */
function svgImg(svg){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)})}
async function share(){const r=dayRec().quiz;if(!r)return;const c=$("#cv"),x=c.getContext("2d");
  x.fillStyle="#0f0d0a";x.fillRect(0,0,1080,1080);x.fillStyle=color(S.kouka);x.fillRect(0,0,1080,230);
  const av=await svgImg(avatar(S.g,S.a,rankLv(S.total||0),undefined,S.invites>=5));if(av)x.drawImage(av,60,270,300,350);
  x.fillStyle="#fff";x.font="900 110px sans-serif";x.textAlign="center";x.fillText(S.kouka+"校下",540,160);
  x.textAlign="left";x.fillStyle="#f3dc9a";x.font="900 60px sans-serif";x.fillText("今日の十問",400,340);
  x.fillStyle="#f3ede0";x.font="900 190px sans-serif";x.fillText(`${r.n}/10`,400,540);
  x.font="56px sans-serif";x.fillText(r.ox,400,630);
  x.textAlign="center";x.fillStyle="#d8b45a";x.font="700 54px sans-serif";x.fillText(`+${fmt(r.koku)}石　${S.name}（${title(S.total||0)}）`,540,790);
  x.fillStyle="#a79c86";x.font="38px sans-serif";x.fillText("みんなで百万石　#百万石バトル",540,900);x.fillText(today().replace(/-/g,"."),540,960);
  const url=c.toDataURL("image/png");$("#shareBox").innerHTML=`<img class="share" src="${url}"><div class="mute center">長押しで保存 → インスタのストーリーへ</div>`;
  c.toBlob(b=>{if(!b)return;const f=new File([b],"hyakumangoku.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text:"#百万石バトル"}).catch(()=>{})})}

/* ---------- 運営テスト用（?admin=1） ---------- */
function adminPanel(){return `<div class="card"><h2>🛠 テスト用（?admin=1 のときだけ）</h2><div class="row">
 <button onclick="S.kura+=5000;S.koku+=5000;save();home()">蔵+5000石</button>
 <button onclick="inviteArrived()">援軍が1人来た</button>
 <button onclick="S.dayShift=(S.dayShift||0)+1;save();home()">1日すすめる</button>
 <button onclick="if(confirm('全部消して最初から？'))localStorage.removeItem(KEY),location.reload()">リセット</button></div></div>`}

document.addEventListener("gesturestart",e=>e.preventDefault());
home();

</script>
