<!DOCTYPE html>
<html lang="ja">
<head>

<title>百万石クエスト（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d0a;--panel:#1b1711;--line:#3a3020;--gold:#d8b45a;--gold2:#f3dc9a;--red:#b8352b;--ink:#f3ede0;--mute:#a79c86;--green:#3f9a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:90px;overscroll-behavior:none}
html,body{overflow-x:clip}/* ふりがなの読みの箱がはみ出しても、画面が横にずれないように */
svg{display:block;width:100%;height:auto}
img.paint{display:block;width:100%;height:auto}
.bph img.paint{object-fit:contain;padding:4px}
img.px{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
/* 歴史ゲームの窓：ドットの見出し×読みやすい本文 */
header h1,.card h2,.big,.bz,.lv,.timer,.pname,.koku,.sg,.chip{font-family:"DotGothic16","Hiragino Sans",sans-serif;font-weight:400;letter-spacing:.04em}
.card{border:2px solid #6a5530;border-radius:6px;box-shadow:inset 0 0 0 2px #120f0a,inset 0 0 0 3px #4a3c24}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#1b1711,#0f0d0a);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:19px;letter-spacing:.08em;color:var(--gold2)}
header h1 small{display:block;font-size:10px;color:var(--mute);letter-spacing:.2em;white-space:nowrap}
header{gap:8px}header h1{min-width:0;flex:1;overflow:hidden}header h1 small{overflow:hidden;text-overflow:ellipsis;letter-spacing:.12em}header .koku{flex-shrink:0;text-align:right;padding-right:12px}header .furiBtn{flex-shrink:0}
.tmW{display:flex;align-items:baseline;gap:2px}.tmU{font-size:12px;color:var(--mute)}
.koku{font-weight:800;color:var(--gold);font-size:16px;text-align:right;line-height:1.2;white-space:nowrap}
.koku small{display:block;color:var(--mute);font-weight:400;font-size:11px}
main{padding:12px;max-width:520px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

.row{display:flex;gap:8px;flex-wrap:wrap}

.mute{color:var(--mute);font-size:13px}
.big{font-size:26px;font-weight:900;color:var(--gold)}.big small{font-size:13px;color:var(--mute)}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0d0a;color:var(--ink);font-size:16px}
.tag{display:inline-block;background:#2a2318;border-radius:999px;padding:1px 9px;font-size:11px;color:var(--gold2);margin-left:6px;vertical-align:middle;font-weight:700}
.notice{font-size:12px;color:var(--mute);border-left:3px solid var(--line);padding-left:8px}
.center{text-align:center}
hr{border:0;border-top:1px solid #2a2318;margin:12px 0}
.prog{height:6px;background:#2a2318;border-radius:4px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#9c7a2a,#f3dc9a);width:0;transition:width .3s}

.seg{display:flex;gap:6px;margin-top:4px}.seg button{flex:1;padding:12px 4px}.seg button.on{background:linear-gradient(135deg,#d8b45a,#9c7a2a);color:#1b1711}

/* クイズ */
.q{font-size:18px;font-weight:700;margin:6px 0 12px}

/* 城下町 */
.town{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;background:linear-gradient(#1d2a16,#16130d);border-radius:12px;padding:8px}

.cbs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cb{background:#241d12;border-radius:10px;padding:8px;font-size:12px;display:flex;flex-direction:column}.cb b{color:var(--gold2)}.cb>span{color:var(--mute)}.cb em{font-style:normal;font-weight:900;font-size:15px}.cb em small{font-weight:400;color:var(--mute);font-size:11px}

.bimg{width:180px;margin:0 auto}
.items{display:grid;grid-template-columns:1fr 1fr;gap:6px}.item{background:#211b12;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.55}.item.on{opacity:1;outline:1px solid var(--gold)}.item small{font-size:11px}.ii{width:70px}.ii:has(.iipair){width:100%}.iipair{display:flex;gap:2px}.iipair>*{flex:1;min-width:0}
.lgr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}.lgi{width:22px;text-align:center;flex:none}.lgl{flex:1;min-width:0;line-height:1.35}.lgl small{display:block;font-size:11px;opacity:.7}.lgr b{font-size:17px;white-space:nowrap}.lgt{border-bottom:0;border-top:2px solid var(--line)}.lgt .lgl{font-weight:800}.lgt b{font-size:20px}

.hg{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.hgbox{background:var(--panel);border:2px solid #ff6a5c;border-radius:16px;padding:14px;width:100%;max-width:480px;animation:shake .4s}
.hgm{width:96px;margin:0 auto;animation:bob 1s infinite alternate}.hgt{font-size:19px;font-weight:900;color:#ff9a8f;text-align:center}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#d8b45a;color:#1b1711;font-weight:800;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:40;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;font-size:15px}.toast.on{opacity:1}
/* 内政・地図・カード */
.nmini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}.nm{display:flex;flex-direction:column;align-items:center;font-size:12px}.nm svg{border-radius:10px}.nm small{color:var(--gold2);font-weight:800}
.ncard .nimg{width:72px;flex:none}.lv{font-weight:900;color:var(--gold2);background:#2a2318;border-radius:8px;padding:1px 8px}
.mapw{margin:8px -6px;border-radius:12px;overflow:hidden;background:#141a10}.mapw.big{margin:8px -10px}

.bcard{background:linear-gradient(#2a2318,#1b1711);border:1px solid #4a3c24;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.bcard.rare{border-color:#d8b45a;box-shadow:0 0 0 1px #d8b45a55 inset}.bcard.done{opacity:.45}
.bph{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 50% 35%,#3a3020,#16130d)}.bph img{width:100%;height:100%;object-fit:cover;display:block}

.bbody{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;font-size:13px}.bbody b{font-size:15px}.bbody .eff{color:#9fd48a;font-weight:800;font-size:12px}.bbody button{margin-top:auto;padding:9px 6px;font-size:13px}
.ib{flex:1;padding:10px 2px;font-size:14px;white-space:nowrap}.gold.ib{flex:1.4}
.ageinfo{margin-top:6px;background:#241d12;border-radius:10px;padding:8px 10px;font-size:13px}.agen{font-family:"DotGothic16",sans-serif;font-size:20px;color:var(--gold2)}
.emaki{background:linear-gradient(#efe4c8,#e2d2a8);color:#2a1f14;border-color:#8a6a3a}.emaki .mute{color:#6a5a3a}.emaki.bad{background:linear-gradient(#ead8c8,#d8bca8)}
.emy{font-family:"DotGothic16",sans-serif;color:#8a2f2a;font-size:13px}.emt{font-family:"DotGothic16",sans-serif;font-size:21px;margin:2px 0 4px}.emd{font-size:14px;line-height:1.6}

.mzbar{display:flex;gap:6px;align-items:center;justify-content:center;margin:8px 0 4px}.mzbar button{padding:6px 14px}.mzbar>span{min-width:52px;text-align:center;font-weight:800;color:var(--gold2)}
.mapz{overflow:auto;border-radius:12px;background:#141a10;max-height:62vh;margin:0 -6px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}.mapin{min-width:100%}

.sanT,.sanS{text-align:center;font-size:20px;margin:6px 0}.sanT b{font-family:"DotGothic16",sans-serif;font-size:40px;color:var(--gold2)}.sanS.over{color:#ff6a5c}
.sanG{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}.sanb{font-size:22px;padding:14px 0;background:#241d12;border:1px solid var(--line)}.sanb.on{background:#5a4210;border-color:var(--gold)}

/* ---------- ドット化（イラストを低解像度に落として、歴史ゲームらしいドット絵に） ---------- */
const PXC=new Map();
function pxKey(t){let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))>>>0;return h+":"+t.length}
function pxRender(svg,res){return new Promise(ok=>{const vb=(svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/)||[0,100,100]);const w=res,h=Math.round(res*vb[2]/vb[1]);
  const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);
    try{const d=x.getImageData(0,0,w,h),p=d.data;
      for(let i=0;i<p.length;i+=4){p[i+3]=p[i+3]>110?255:0;for(let j=0;j<3;j++)p[i+j]=Math.min(255,Math.round(p[i+j]/12)*12)}
      // ドット絵の縁取り：不透明な画素のとなりの透明な画素を濃い茶で塗る
      const A=i=>p[i*4+3]>0,o=new Uint8Array(w*h);
      for(let y=0;y<h;y++)for(let x2=0;x2<w;x2++){const i=y*w+x2;if(A(i))continue;if((x2>0&&A(i-1))||(x2<w-1&&A(i+1))||(y>0&&A(i-w))||(y<h-1&&A(i+w)))o[i]=1}
      for(let i=0;i<w*h;i++)if(o[i]){p[i*4]=26;p[i*4+1]=18;p[i*4+2]=10;p[i*4+3]=255}
      x.putImageData(d,0,0)}catch(e){}
    ok(c.toDataURL())};im.onerror=()=>ok(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)})}
function pixelate(root){(root||document).querySelectorAll("svg[data-px]").forEach(el=>{if(el.closest(".nopx"))return;const res=+el.getAttribute("data-px"),t=el.outerHTML,k=pxKey(t)+"@"+res;
  const put=u=>{if(!u||!el.isConnected)return;const img=document.createElement("img");img.className="px";img.src=u;img.alt="";el.replaceWith(img)};
  if(PXC.has(k)){const v=PXC.get(k);if(typeof v==="string")put(v);else v.then(put);return}
  const pr=pxRender(t,res).then(u=>{PXC.set(k,u);return u});PXC.set(k,pr);pr.then(put)})}
if(typeof MutationObserver!=="undefined")new MutationObserver(()=>pixelate()).observe(document.documentElement,{childList:true,subtree:true});

const QBANK=[["金沢は雪国で積雪量も多い。そのため、雪の重みで枝がおれないように樹木にほどこされるものは何か。",["こもかけ","こもまき","雪つり","わらまき"],2,"雪は独特の美しい景観や恵（めぐみ）をあたえている。樹木にほどこされた「雪つり」にうっすらと雪化粧（ゆきげしょう）された兼六園（けんろくえん）の風情は、観光客の目をひきつけている。","自然・産業","X",17],["金沢は、藩政（はんせい）時代から今日までさまざまな分野で活躍（かつやく）する人々を育んできた。天文学者でＺ項（ぜっとこう）を発見した人物はだれか。",["木村栄（きむらひさし）","鈴木大拙（すずきだいせつ）","磯田謙雄（いそだのりお）","野口遵（のぐちしたがう）"],0,"Ｚ項の発見により、地球上の緯度（いど）観測をより正確に行えるようになった。","偉人・人物","X",17],["金沢市は、伝統工芸がさかんな地域であり、特に金箔（きんぱく）の生産で知られている。金沢市の金箔の生産量は日本の総生産量の何パーセントといわれているか。", ["30パーセント", "50パーセント", "70パーセント", "100パーセント"], 3, "金沢市の金箔の生産量は長らく全国の99パーセントをしめていたが、県外で唯一（ゆいいつ）生産していた職人が引退し、今では全国の金箔の100パーセントが金沢で生産されているといわれている。", "美術・工芸・芸能", "S", 17],["2006年（平成18）から始まった地域の除雪作業を支援（しえん）する制度で、地域からの要請（ようせい）に応じて行う雪かきボランティアに登録されているのは主にどんな人か。",["公務員","主婦・主夫","学生","シニア"],2,"雪かきボランティアは学生のほか企業（きぎょう）や市民活動団体等によって行われ、雪かきをきっかけに若い世代と地域との交流が深まっている。","市政・最近の話題","S",17],["明治時代に生まれた金沢出身の土木技師で、当時日本統治下にあった台湾（たいわん）でアジア最大のダムを建設した人物はだれか。",["八田與一（はったよいち）","高峰譲吉（たかみねじょうきち）","津田米次郎（つだよねじろう）","三宅雪嶺（みやけせつれい）"],0,"金沢市出身の八田與一は、日本統治下の台湾に渡り烏山頭（うさんとう）ダムを完成させた。","偉人・人物","X",17],["金沢駅は2011年（平成23）、アメリカの旅行雑誌にて「世界で最も美しい駅」の１つに国内で唯一（ゆいいつ）選ばれた。金沢駅のシンボルはどれか。",["もてなしドームと鼓門（つづみもん）","徽軫灯籠（ことじとうろう）","石川門（いしかわもん）","鼠多門（ねずみたもん）"],0,"金沢は雨や雪が多いため「駅を降りた人に傘（かさ）を差し出すおもてなしの心」をコンセプトにもてなしドームが誕生した。金沢でさかんな伝統芸能の能楽で使われる鼓をイメージした鼓門もフォトスポットとして人気である。徽軫灯籠は兼六園にあり、石川門は金沢城跡の東に位置し、鼠多門は玉泉院丸に位置している。","寺社・建造物・まち","S",17],["加賀藩（かがはん）の代々の藩主は能楽や茶の湯を積極的に取り入れた。３代藩主前田利常（まえだとしつね）が茶道を学ぶため招いた茶人はだれか。",["宗旦（そうたん）","千利休（せんのりきゅう）","仙叟宗室（せんそうそうしつ）","本阿弥光悦（ほんあみこうえつ）"],2,"仙叟宗室は裏千家（うらせんけ）の初代家元となった茶人である。","歴史","X",17],["国連のユネスコは、創造都市〔独自の文化を産業と結び付け、新しい価値を創造してまちを元気にしている都市〕のネットワークづくりを提唱している。金沢市は2009年（平成21）にこの創造都市に認定されたが、認定された分野はどれか。",["クラフト","デザイン","メディア","食文化"],0,"金沢の伝統工芸〔クラフト〕は、藩政時代から今日に至るまで守り続けられてきた。","市政・最近の話題","X",17],["明治になり、金沢にも軍隊がおかれることとなった。1904年（明治37）には日露（にちろ）戦争が起こり、金沢の第九師団も戦地で戦い、翌年にはロシア兵の捕虜（ほりょ）が金沢にも送られてきた。その時に亡くなったロシア兵の墓があるのはどこか。",["内川墓地公園","野田山墓地","奥卯辰山（おくうたつやま）墓地公園","末広墓地"],1,"1896年（明治29）頃、金沢には１万人以上の兵士やその家族が住むこととなった。","歴史","X",17],["金沢市内での近年の発掘（はっくつ）調査により、縄文時代の人々のイメージがぬりかえられている。縄文時代中期の遺跡（いせき）で、日本で初めて発見された<span class='fg fx'>石<span class='frt'>いし</span></span>の指輪やヒスイのペンダントが発見された遺跡はどこか。",["北塚（きたづか）遺跡","チカモリ遺跡","西念（さいねん）・南新保遺跡","七ツ塚遺跡"],0,"北塚遺跡は2004年（平成16）に金沢市指定文化財に指定された。","歴史","X",17],["金沢の市街地近郊（きんこう）では野菜・花・果物などいろいろな種類が生産されている。昔から金沢で栽培（さいばい）されている「加賀野菜」は何品目あるか。",["５品目","７品目","10品目","15品目"],3,"加賀野菜に認定されているのは、金時草・加賀太きゅうり・たけのこ・打木赤皮甘栗（うつぎあかがわあまぐり）かぼちゃ・ヘタ紫なす・加賀つるまめ・赤ずいき・加賀れんこん・さつまいも・金沢一本太ねぎ・源助だいこん・金沢春菊（しゅんぎく）・二塚からしな・金沢せり・くわいの15品目である。","食・行事","S",17],["大和朝廷（やまとちょうてい）が勢力をのばしていた頃、金沢地方を治めていたといわれる豪族（ごうぞく）で、娘を天智天皇（てんじてんのう）の宮人（みやびと）として仕えさせたのはだれか。",["加賀君（かがのきみ）","道君（みちのきみ）","金沢君（かなざわのきみ）","河北君（かほくのきみ）"],1,"道君の娘はやがて皇子を産み、その皇子の子どもは後に光仁（こうにん）天皇となったため、天皇と親戚（しんせき）関係ができた道君は、８世紀にかけて勢力を伸ばしていった。","歴史","S",17],["明治時代には、金沢から世界にほこることのできるすぐれた業績を残した人々を輩出（はいしゅつ）している。強い消化効力のある胃腸薬「タカジアスターゼ」を発明し、血圧を上げたりする治療薬（ちりょうやく）「アドレナリン」を発見したのはだれか。",["高多久兵衛（たかだきゅうべえ）","鈴木大拙（すずきだいせつ）","横山隆興（よこやまたかおき）","高峰譲吉（たかみねじょうきち）"],3,"高峰譲吉の功績を顕彰（けんしょう）し、あわせて科学教育の振興（しんこう）を図ることを目的として1952年（昭和27）に高峰譲吉博士顕彰会により高峰賞が制定された。","偉人・人物","X",17],["幕府は諸大名支配のため、大名の妻子を人質として江戸（えど）の屋敷（やしき）におき、大名は１年おきに領地と江戸に住む参勤交代制度を作った。前田家が金沢城から江戸へ行くために、主に利用した街道はどの道か。",["東海道","北国下街道","甲州街道","日光街道"],1,"「参勤」は大名が金沢から江戸に行くこと、「交代」は江戸から金沢へ帰ることをいう。参勤交代で前田家は、主に北国下街道を経由して中山道に入るコースを利用した。","歴史","S",17],["金沢城跡（じょうせき）は2008年（平成20）、国指定史跡（しせき）となり、復元整備事業として、今までに菱櫓（ひしやぐら）、橋爪門（はしづめもん）、橋爪門続櫓（つづきやぐら）、五十間長屋（ごじっけんながや）が完成している。2020年（令和２）には金沢城西側の門と橋が約140年ぶりに復元されたが、その門の名前は何か。",["橋爪門二の門","河北門（かほくもん）","鼠多門（ねずみたもん）","石川門"],2,"現在は石垣（いしがき）の計画的な保全対策が行われている。","寺社・建造物・まち","X",17],["鎌倉（かまくら）時代、加賀地方で勢力を拡大し、藤原利仁（ふじはらのとしひと）の子孫といわれた一族で、『安宅（あたか）』や歌舞伎（かぶき）の『勧進帳（かんじんちょう）』で後世に知られたのは何氏か。",["林氏","山科（やましな）氏","伏見（ふしみ）氏","富樫（とがし）氏"],3,"1335年（建武２）、17代目の富樫高家（とがしたかいえ）は足利尊氏（あしかがたかうじ）方につき、戦いで手柄（てがら）をたて、尊氏から加賀国の守護に任命された。","歴史","X",17],["金沢は歴史を大切にするまちづくりを行っており、市内には昔の書や絵画、工芸品を展示している美術館や博物館がたくさんある。近年は大正から昭和初期の建物もその価値が評価されて、大事に保存されるようになってきた。金沢文芸館もその１つで、昭和初期の建物だが、建てられた当時は何の建物だったか。",["郵便局","警察署","消防署","銀行"],3,"昭和初期の建物である金沢文芸館は、元々は銀行だった建物を金沢市が改修し、文芸館に生まれ変わった。","寺社・建造物・まち","S",17],["2025年（令和７）７月、中高生を中心とする青少年の新しい居場所として「かなざわユースセンター」が開設された。家でも学校でもないこの第３の居場所では、青少年が「くつろぐ」「遊ぶ」「勉強する」「おしゃべりをする」「なやみを相談する」など、自分らしく安心して過ごせる空間となっている。青少年が思い思いに過ごせるこの場所の拠点（きょてん）となっている施設（しせつ）はどこか。",["長土塀（ながどへ）青少年交流センター","玉川こども図書館","金沢未来のまち創造館","金沢市民芸術村"],0,"かなざわユースセンターではユースワーカーと呼ばれるスタッフが常駐（じょうちゅう）しており、スタッフや利用者が企画したイベントも毎月行っている。","市政・最近の話題","S",17],["鎌倉時代から室町時代にかけて、新しい仏教が広がっていった。そのころ、加賀の地で曹洞宗（そうとうしゅう）を広めたのはだれか。",["親鸞（しんらん）","蓮如（れんにょ）","徹通義介（てっつうぎかい）","運良（うんりょう）"],2,"曹洞宗永平寺の名僧（めいそう）、徹通義介は加賀国を治めていた富樫家尚（とがしいえひさ）にたのまれて、大乘寺（だいじょうじ）の初代住持（じゅうじ）になった。","歴史","S",17],["金沢市では、スポーツを盛んにすることで、まちの活力を高めようとしている。2018年（平成30）の金沢市スポーツ文化推進条例の制定により、市民と選手がふれあう機会を増やす取り組みにも積極的である。金沢市のホームタウンチーム「ツエーゲン金沢」のスポーツ種目はどれか。",["野球","サッカー","バレーボール","バスケットボール"],1,"ツエーゲンとはドイツ語で「チームとサポーターが共に進んでいく」という意味と金沢弁で「強いんだっ！（つぇーげん！）」の意味をもっている。","市政・最近の話題","S",17],["新潟県から富山県、石川県、福井県を経て、滋賀県に至る総延長487キロメートルの高速道路が北陸自動車道である。この長い高速道路のうち、一番最初の1972年（昭和47）10月18日に開通したのは石川県内のどこからどこまでか。",["名立谷浜（なだちたにはま）インターチェンジから朝日インターチェンジまで","金沢西インターチェンジから小松インターチェンジまで","小松インターチェンジから福井北インターチェンジまで","金沢西インターチェンジから富山インターチェンジまで"],1,"北陸自動車道は東では長岡ジャンクションで関越自動車道と、西では米原ジャンクションで名神高速道路と、中間では小矢部砺波（となみ）ジャンクションで東海北陸自動車道と接続しており、交通網の整備を通して地域の発展と活性化が進められている。","寺社・建造物・まち","S",17],["加賀藩第11代藩主前田治脩（まえだはるなが）の時代に兼六園内に建てられた藩校で、身分を問わず８歳以上の男子が入学でき、儒学（じゅがく）を中心に漢学・算術・医学・天文学などが教えられていたのはどこか。",["経武館（けいぶかん）","明倫堂（めいりんどう）","壮猶館（そうゆうかん）","竹沢御殿（たけざわごてん）"],1,"明倫堂は加賀藩の藩校であり身分を問わず入学できた。","歴史","X",17],["明治時代、金沢に３人の文豪（ぶんごう）が生まれた。その中で、下新町に生まれ『滝（たき）の白糸』や『義血侠血（ぎけつきょうけつ）』を書いたのはだれか。",["徳田秋声（とくだしゅうせい）","森鷗外（もりおうがい）","泉鏡花（いずみきょうか）","夏目漱石（なつめそうせき）"],2,"泉鏡花は1873年（明治６）に下新町に生まれ、父は象嵌（ぞうがん）細工職人、母の兄は能楽師という工芸・芸能が身近な環境（かんきょう）で育った。","文学","X",17],["江戸時代になり、町が整備されると米市場や魚市場なども現れ、商業が盛んになり貨幣（かへい）がつくられるようになった。貨幣ができたのは前田利家の時代だが、原料となる金銀が産出された山はどこか。",["宝達山（ほうだつさん）","卯辰山（うたつやま）","白山","鞍掛山（くらかけやま）"],0,"天正年間（1573～92）、豊臣秀吉にならって多くの金・銀貨をつくらせたのが始まりである。次の前田利長・利常の時代にも、一分銀（いちぶぎん）や大豆板銀（まめいたぎん）などいろいろな金・銀貨がつくられた。","歴史","S",17],["金沢市ではすべての人が平等に普通の生活を送れるまちを目指し、「ノーマライゼーションプラン金沢」が定められている。金沢市で実際に運行しているバスで、だれもが気軽に買い物や散策に出られるようバスの入口から出口まで低くて段差のない床になっているバスを何というか。",["まちバス","城下町金沢周遊バス","循環（じゅんかん）バス","金沢ふらっとバス"],3,"ふらっとバスは、ふらっと乗れる気楽さと段差のないフラットなバスにちなんで名付けられた。乗り降りスロープや車いすの固定装置も備えている。","市政・最近の話題","X",17],["加賀藩藩主前田綱紀（まえだつなのり）は学問が好きで、日本中から有名な学者を招いたり、貴重（きちょう）な書物を集めたりした。江戸時代を代表する学者として有名な新井白石はこのような加賀藩のことを、何とほめたたえたか。",["加賀は天下の大学","加賀は天下の図書館","加賀は天下の博士","加賀は天下の書府"],3,"前田綱紀は当時、漢学〔当時の中国の学問〕では日本一といわれていた木下順庵（きのしたじゅんあん）や、本草学〔薬草の学問〕の第一人者として知られていた稲生若水（いのうじゃくすい）などを金沢に住まわせて学問を奨励（しょうれい）した。","歴史","X",17],["2025年（令和７）10月、金沢市は新たにある市と友好都市協定を締結（ていけつ）した。この市には、かつて前田利家の五男・利孝（としたか）が築いた七日市藩があり、金沢製糸場をつくる際にはこの市にあった当時全国最大規模の製糸場に金沢市から技術者が派遣され、建築や製糸の技術が継承（けいしょう）された。歴史的・文化的に深いつながりがあるこの市はどこか。",["藤岡市","高崎市","富岡市","前橋市"],2,"金沢市と富岡市はこれまでも観光交流などを行ってきたが、友好都市協定を締結することで、互いの文化や地域性を尊重しつつ、さらに絆を深め、末永い友好関係を築くとともに、市民間及び都市間の交流を推進し、両市の活性化を図っていくこととしている。","市政・最近の話題","S",17],["歴史的な集落やまちなみの中で、価値が非常に高いと判断した「重要伝統的建造物群保存地区」として国が選定した金沢市内の地域はどこか。",["「東山ひがし」「主計（かずえ）町」「卯辰山山麓（うたつやまさんろく）」「寺町台」","「夕日寺」「神谷内」「富樫」「長坂台」","「長町」「材木町」「味噌蔵（みそぐら）町」「犀桜（さいおう）地区」","「田上」「医王山」「朝霧台（あさぎりだい）」「湯涌（ゆわく）」"],0,"国は令和６年８月現在、全国で43道府県106市町村129地区を重要伝統的建造物群保存地区に選定している。石川県からは８地区が選定されており、長野県と並び全国トップであるが、その半数が金沢市の地区である。","寺社・建造物・まち","S",17],["金沢市の町名には、藩政時代の町の性格を表したものが数多くある。加賀藩の老臣（ろうしん）・前田対馬守（つしまのかみ）家の下屋敷（しもやしき）があったところで、同家の家紋（かもん）にちなんでつけられた町名はどれか。",["主計（かずえ）町","金石（かないわ）町","六枚町","飛梅（とびうめ）町"],3,"飛梅町は藩の老臣・前田氏の家紋「角の内梅輪」にちなんだ町名である。","寺社・建造物・まち","S",17],["金沢城を中心にして発展してきた金沢の町は、1871年（明治４）の廃藩置県（はいはんちけん）により衰退（すいたい）してしまったため、町のにぎわいを取りもどすために1874年（明治７）に「金沢博覧会」が開催された。その時の会場はどこか。",["寺島蔵人邸（てらしまくらんどてい）と旧中村邸","長町武家屋敷（ながまちぶけやしき）と天徳院","尾山神社と西別院","成巽閣（せいそんかく）と東別院"],3,"会場には銅器や漆器など6,200点あまりが展示され、入場者は30日間で７万人に達した。","歴史","X",17],["金沢市の北西部の砂地には、すいかやさつまいもなどの野菜が多く作られている。すいかの苗は環境の変化や病気に弱くて育ちにくいが、ある野菜の苗に接ぎ木をすると病気に強い苗を育てることができる。その野菜は何か。",["ナス","かぼちゃ","トマト","ピーマン"],1,"かぼちゃ台は寒さに強く、砂地に適している。","食・行事","S",17],["江戸時代以降、加賀藩では独自の金・銀貨が作られていたが、江戸幕府が全国共通の貨幣（かへい）を使うようすすめていたことをうけ、藩内で貨幣を造ることをやめている。この時の加賀藩第５代藩主はだれか。",["前田重教（まえだしげみち）","前田利長（まえだとしなが）","前田斉広（まえだなりなが）","前田綱紀（まえだつなのり）"],3,"加賀藩での貨幣を造ることをやめる判断をしたのは第５代藩主の前田綱紀である。","歴史","X",17],["金沢市には古くから残る建物がたくさんあり、多くの人から親しまれ大事に守られてる。その中で、最上階に４色のギヤマン〔色ガラス〕がはめこまれた神門が国の重要文化財に指定されている、前田利家と正室お松の方をまつった建物は何か。",["金沢城","卯辰八幡宮（うたつはちまんぐう）","尾山神社","天徳院"],2,"尾山神社の神門は全国的にも珍しい和漢洋の３つの建築様式が用いられており、屋根の上についている避雷針（ひらいしん）は現存する日本最古のものといわれている。","寺社・建造物・まち","X",17],["金沢には、年中行事が今も数多く残っている。金沢の年中行事のうち、加賀藩から江戸の将軍に氷を献上（けんじょう）したことにちなんだ行事で「氷室の朔日（ついたち）」といわれ、氷室まんじゅうを食べる風習が残るのは何月のことか。",["１月","３月","７月","10月"],2,"冬の間に保存しておいた氷を将軍に献上したことにちなんだ行事である。現在では７月１日に氷室まんじゅうを食べると病気にかからないという風習がある。","食・行事","S",17],["金沢に初めて電灯が灯ったのは、1894年（明治27）に兼六園で開かれた関西府県連合共進会場と、尾山神社の門前にアーク灯がつけられたときである。一般家庭に電灯が灯ったのはいつか。",["1900年（明治33）","1905年（明治38）","1910年（明治43）","1915年（大正４）"],0,"当時の市民は電気をぜいたく品と考えていたので、利用者はなかなか増えなかった。","歴史","S",17],["明治時代の金沢三文豪の１人で「あにいもうと」「杏（あんず）っ子」など、金沢の風物と少年時代の喜び・悲しみをえがいた人物はだれか。",["室生犀星（むろおさいせい）","尾崎紅葉（おざきこうよう）","徳田秋声（とくだしゅうせい）","永井荷風（ながいかふう）"],0,"「あにいもうと」「杏っ子」の作者は室生犀星であり、室生犀星と泉鏡花、徳田秋声の３人が金沢三文豪である。","文学","S",17],["2025年（令和７）12月、「加賀料理」が国の「登録無形文化財」に選ばれた。日本国内において、和食分野では京料理に続く登録であり、その繊細（せんさい）な技術と独自の美学は今、改めて世界中から熱い視線を浴びているが、加賀料理はどれか。",["治部煮（じぶに）","ほうとう","しもつかれ","きりたんぽ"],0,"加賀百万石の栄華（えいが）をほこる前田家の庇護（ひご）のもと、美術工芸の職人の招致（しょうち）・育成や茶道の保護など、さまざまな文化振興（しんこう）策の影響を受け、加賀の美意識と融合（ゆうごう）した独自の食文化が形づくられた。ほうとうは山梨県、しもつかれは栃木県、きりたんぽは秋田県の郷土料理である。","食・行事","X",17],["江戸時代の金沢の農村では、村の年貢米（ねんぐまい）を集めるため武士や農民による村の統治が行われていた。このうち農民から選ばれた村役人はどれか。",["算用場奉行（さんようばぶぎょう）","郡奉行（こおりぶぎょう）","組合頭（くみあいがしら）","改作奉行（かいさくぶぎょう）"],2,"組合頭は、同じ村役人である肝煎（きもいり）を助ける役職であった。","歴史","S",17],["2008年（平成20）７月28日に55年ぶりに浅野川が氾濫（はんらん）し、浅野川水害がおこった。このとき多くのボランティアの方が協力してくれたことを大切にし、後世に伝えていくためにつくられた日を何というか。",["金沢「友情」の日","金沢「絆（きずな）」の日","金沢「助け合い」の日","金沢「共助」の日"],1,"７月28日を中心に、すべての市立小中学校で、児童会・生徒会が中心となり保護者・地域の人とも連携（れんけい）しながら、人とのつながりを大切にした活動を行っている。","市政・最近の話題","S",17],["金沢市の浄水場（じょうすいじょう）では、徹底（てってい）した水質管理が行われている。他にも参考として水が安全かどうかを調べるために「監視魚（かんしぎょ）」と呼ばれる魚がいるが、何という魚か。",["メダカ","フナ","金魚","熱帯魚"],2,"金沢市内には末浄水場と犀川（さいがわ）浄水場の２か所がある。","市政・最近の話題","S",17],["金沢の芋掘藤五郎（いもほりとうごろう）の伝説は、奈良時代の「炭焼き長者」伝説が元になってつくられたといわれている。藤五郎伝説と同時期の遺跡である三小牛（みつこうじ）さこ山遺跡からは、奈良時代当時の貨幣が国内最多の580枚出土している。この貨幣は何か。",["富本銭（ふほんせん）","和同開珎（わどうかいちん）","永楽通宝（えいらくつうほう）","慶長小判（けいちょうこばん）"],1,"金沢市三小牛町の山中に三小牛さこ山遺跡と隣接（りんせつ）して位置する三小牛ハバ遺跡からは、奈良時代の仏像が出土している。","歴史","S",17],["2027年（令和９）５月６日から約11か月間、リニューアルのため休館となる施設で、21世紀という大きな歴史の転換点にあたり、「新しい文化の創造」と「新たなまちの賑（にぎ）わいの創出」を目的に開設された金沢市の代表的な文化施設はどれか。",["石川県立音楽堂","金沢21世紀美術館","泉鏡花記念館","金沢城"],1,"金沢21世紀美術館の休館中、旧日本銀行金沢支店跡地（あとち）を活用し、作品を展示するとともに、休館中も多くの人に金沢を訪れてもらえるよう「金沢まちなか芸術祭」を開催する予定である。","市政・最近の話題","X",17],["金沢が生んだ三文豪（さんぶんごう）のうち、「幼年（ようねん）時代」「性に眼覚（めざ）める頃（ころ）」などの小説や「犀川（さいがわ）」という詩などを発表した人物はだれか。",["徳田秋声（とくだしゅうせい）","泉鏡花（いずみきょうか）","夏目漱石（なつめそうせき）","室生犀星（むろおさいせい）"],3,"室生犀星は仕事場の上司から俳句を教えてもらったことがきっかけで、文学書をよく読むようになった。","文学","X",15],["八田與一（はったよいち）は当時アジア最大といわれた烏山頭（うさんとう）ダムや長大な水路を完成させるなど、不毛の大地を豊かな平野に変えたことで知られている。八田與一が活躍（かつやく）した場所はどこか。",["朝鮮半島（ちょうせんはんとう）","中国","台湾（たいわん）","タイ"],2,"金沢市出身の八田與一は台湾にわたり、烏山頭ダムを完成させた。","偉人・人物","X",15],["金沢では、山地と平野の間にあるなだらかな地形である丘陵地がいくつか見られる。次のうち、それらを北から順に正しく並べたものはどれか。",["小立野台地→卯辰山→寺町台地","小立野台地→寺町台地→卯辰山","卯辰山→寺町台地→小立野台地","卯辰山→小立野台地→寺町台地"],3,"犀川の南側には寺町台地が広がっており、浅野川の北側には、なだらかな卯辰山があり、2つの河川（かせん）の間には細長く小立野台地が延びている。小立野台地や寺町台地、卯辰山の海側には犀川や浅野川などの河川が運んだ土砂が堆積（たいせき）してできた平野が広がっている。","自然・産業","X",15],["1488 年（長享2）、加賀国では農民や僧（そう）たちが中心になって一向一揆（いっこういっき）を起こし、高尾城(たこうじょう)を攻撃（こうげき）して守護を滅ぼした。この当時の守護はだれか。",["州崎慶覚（すざききょうかく）","赤松満祐（あかまつみつすけ）","富樫政親（とがしまさちか）","足利義教（あしかがよしのり）"],2,"一向一揆の後、守護は力を失い、一向宗の坊主・土豪（どごう）などが加賀国を治めるようになった。守護富樫政親の滅んだ加賀国は「百姓（ひゃくしょう）の持ちたる国」といわれるようになった。","歴史","X",15],["1858 年（安政5）、凶作（きょうさく）で米の値上がりに苦しむ人々が藩（はん）の米を出してくれるよう、卯辰山（うたつやま）から金沢城の殿様（とのさま）にさけんで救済をうったえた。このような、当時禁止されていた直訴（じきそ）によって処刑された人たちために作られたものは何か。",["七稲地蔵（なないねじぞう）","天保義民の碑（てんぽうぎみんのひ）","寺島蔵人（てらしまくらんど）の墓","金沢仏壇（かなざわぶつだん）"],0,"このさけび声は殿様の耳にも届き、翌日（よくじつ）殿様は藩の米蔵(こめぐら)からお救い米を放出するように命じた。この一揆（いっき）を「泣き一揆」という。","歴史","X",15],["金沢市の市街地近郊では、米や野菜、果物などさまざまな作物が生産されている。その中で、金沢の風土を活かして生産された「金沢そだち」と呼ばれている作物の組み合わせとして正しいものはどれか。",["さつまいも・にんじん・しいたけ","だいこん・すいか・なし","だいこん・さつまいも・いちご","すいか・じゃがいも・かぶら"],1,"「金沢そだち」は、金沢市の風土を活かして生産された優れた農産物を認証する制度である。現在、だいこん、すいか、なし、トマト、きゅうりの5品目が認証されており、地元の農業振興（のうぎょうしんこう）と消費拡大を図っている。","市政・最近の話題","S",15],["宮崎友禅斎（みやざきゆうぜんさい）は、京都から金沢に移り住み、金沢に友禅染（ゆうぜんぞめ）を伝え「加賀友禅（かがゆうぜん）」を作り出した。仕上がりまでの工程のうち、生地についている糊（のり）や余分な染料を洗い流す工程を何というか。",["無地染め（むじぞめ）","虫食い","友禅流し","平象嵌（ひらぞうがん）"],2,"仕上がりまで 14 の工程があり、生地についている糊や余分な染料を洗い流す工程は、「友禅流し」といって今でも浅野川などで見られる金沢の冬の風物詩（ふうぶつし）である。","美術・工芸・芸能","S",15],["金沢市民芸術村は、市民が自主的に企画したコンサートや芸術の練習の場として開放されている。この施設が整備される前、もともとこの場所にあった施設は何か。",["紡績工場","陸上競技場","小学校","バスターミナル"],0,"金沢市民芸術村は、かつて大和紡績（だいわぼうせき）金沢工場として操業していた紡績工場の跡地を活用して整備された文化施設である。","市政・最近の話題","S",15],["江戸時代、加賀藩の下級武士の生活は苦しく、家計を支えるために仕事の合間をぬって、家族とともに内職に励んでいた。下級武士の内職でつくられていたものはどれか。",["そろばん","げた","ひな人形","ちゃぶ台"],2,"他にも、生活用品として、お盆用の切子灯籠（きりことうろう）、正月に飾る灯籠（とうろう）や玩具、果物などもつくられた。","偉人・人物","S",15],["金沢では、四季折々の和菓子が生活に彩りと美を添えている。その中で、お正月に欠かせない、外の皮をむくと中におみくじが入っている金沢独特の和菓子はどれか。",["金花糖（きんかとう）","五色生菓子（ごしきなまがし）","氷室饅頭（ひむろまんじゅう）","辻（つじ）うら"],3,"金沢のお正月に食べられる縁起菓子である。砂糖と餅粉（もちこ）を混ぜて花のような形に包み、中には小さなおみくじが入っている。正月の時期にのみ出回り、金沢近郊で親しまれている。","食・行事","S",15],["江戸幕府2代将軍徳川秀忠（とくがわひでただ）の二女として生まれ、徳川、前田両家を結ぶため加賀藩3代藩主前田利常（まえだとしつね）のもとに嫁（とつ）いだ姫はだれか。",["珠姫（たまひめ）","千姫（せんひめ）","溶姫（ようひめ）","亀鶴姫（かめつるひめ）"],0,"珠姫は、利常との間に8人の子を生んだあと、体の調子が悪くなり 24 歳の若さで亡くなった。","偉人・人物","X",15],["1900 年（明治 33）津田米次郎（つだよねじろう）が発明し、日本初の羽二重［なめらかでつやのあるうすい絹織物］を織る機械として、第5回内国勧業大博覧会（ないこくかんぎょうだいはくらんかい）に出品され、多大な賞賛（しょうさん）を博したこの機械とは何か。",["くり糸機","力織機（りきしょっき）","足踏み式ミシン","活版印刷機（かっぱんいんさつき）"],1,"1918 年（大正7）には津田米次郎の功績（こうせき）がたたえられ、米次郎の銅像が卯辰山（うたつやま）に建てられた。現在の津田駒工業（つだこまこうぎょう）は米次郎の義理の甥（おい）、駒次郎（こまじろう）がつくったものである。","美術・工芸・芸能","S",15],["2015 年（平成 27）に北陸新幹線が金沢まで開通し、仕事や観光で金沢を訪れる人が増えた。観光地として人気のある金沢では、まちの観光案内をしているボランティアがいる。このボランティアは、次のうちどれか。",["いんぎらさん","おんぼらさん","りくつさん","まいどさん"],3,"「まいどさん」とは、金沢を訪れた観光客に対して、名所や道案内などを行うボランティアである。","市政・最近の話題","X",15],["718 年（養老2）に立国した能登国（のとのくに）は大きな港があり、早くから大陸との交流を行っていた。日本海の対岸（たいがん）に位置し、能登国と交流していた国とはどこか。",["渤海（ぼっかい）","新羅（しらぎ）","契丹（きったん）","唐（とう）"],0,"渤海は唐から独立した国で唐に対抗するため日本との交流を進めたといわれている。","歴史","S",15],["金沢には多くの川が流れており、かつては舟によって物資や人が運ばれていた。なかでも加賀藩の年貢米を運ぶために利用された川はどれか。",["大野川（おおのがわ）","木曳川（きびきがわ）","森下川（もりもとがわ）","手取川（てどりがわ）"],2,"森下川は、金沢市の北部を流れる小さな川で、かつては舟運に利用され、年貢米などの物資の輸送に重要な役割を果たしていた。","寺社・建造物・まち","S",15],["近年の発掘調査（はっくつちょうさ）の結果、縄文人が高度な建築技術と深い精神世界を持っていたことが証明されている。日本で初めてクリの巨大木柱根（きょだいもくちゅうこん）350 本以上が発見された金沢の遺跡（いせき）はどこか。",["畝田遺跡（うねだいせき）","北塚遺跡（きたづかいせき）","七ツ塚遺跡（ななつづかいせき）","チカモリ遺跡"],3,"チカモリ遺跡は全国的にも注目をあび、国指定史跡となっている。","歴史","X",15],["兼六園（けんろくえん）は江戸時代の代表的な大名庭園であり、6つの優れた点を兼ね備えている庭という意味で名づけられたといわれている。この名がつけられたのはどの藩主の時代か。",["5代藩主前田綱紀（まえだつなのり）","11 代藩主前田治脩（まえだはるなが）","12 代藩主前田斉広（まえだなりなが）","13 代藩主前田斉泰（まえだなりやす）"],2,"兼六園は一度につくられたのではなく、5代藩主前田綱紀の別荘の茶室や庭が始まりとなり、1759 年（宝暦9）の大火で焼失した後、1774 年（安永3）11 代藩主前田治脩が4つの亭（ちん）や滝を作って庭を復旧させ、12 代藩主前田斉広が竹沢御殿（たけざわごてん）を建てた。","寺社・建造物・まち","S",15],["金沢市は、古くから海産物が豊富で漁業も盛んな町である。漁獲量が多い金沢港に設けられた、地元で水揚げされた新鮮な海産物を直売している施設は何か。",["近江町市場（おうみちょういちば）","金沢中央卸売市場（かなざわちゅうおうおろしうりしじょう）","金沢港クルーズターミナル","金沢港いきいき魚市（うおいち）"],3,"金沢港いきいき魚市は、金沢港に隣接する鮮魚市場である。","市政・最近の話題","X",15],["馬車鉄道しかなかった金沢に電車が走ったのは 1914 年（大正3）のことである。市内電車で初めて開通した路線はどれか。",["兼六園下～小立野","武蔵ヶ辻～香林坊","金石（かないわ）～長田","広小路～寺町"],2,"1914 年（大正3）に金石電鉄、1915 年（大正4）に石川電鉄［現在の北陸鉄道石川線］、1919 年（大正8）には金沢停車場～兼六園下間にも電車が開通し、この新しい電車を見ようとする人々が街にあふれた。","歴史","X",15],["金沢には、金沢市無形民俗文化財（かなざわしむけいみんぞくぶんかざい）に指定された伝統行事が今もたくさん残っている。斧（おの）や刀、弓を持った山伏（やまぶし）が各家をまわる悪魔払い（あくまばらい）が行われているのはどこか。",["小立野","東長江町（ひがしながえまち）","八田町","大野・金石（かないわ）"],3,"各家の悪魔払いをする時には、家の中に入らんばかりの勢いで悪魔を払うまねをするので、子どもたちが泣きさけんで家の奥（おく）に、にげこむ様子が見られる。","美術・工芸・芸能","S",15],["加賀藩5代藩主前田綱紀（まえだつなのり）は、学問を好み、国中の貴重な書物を集めることに力を注ぎ、綱紀自身も勉強したので学者としてもよく知られるようになった。「加賀は天下の書府」とほめたたえた江戸時代の有名な学者はだれか。",["木下順庵（きのしたじゅんあん）","新井白石（あらいはくせき）","井上若水（いのうえじゃくすい）","本居宣長（もとおりのりなが）"],1,"前田綱紀の時代を中心に利常の時代から集められた書物は、質・量ともにずば抜けたものとなり、尊経閣（そんけいかく）文庫と呼ばれ、今に残されている。","偉人・人物","X",15],["金沢は、藩政時代から今日まで、様々な分野で活躍する人々を育んできた。タカジアスターゼの発明とアドレナリンの発見をした人はだれか。",["木村栄（きむらひさし）","高峰譲吉（たかみねじょうきち）","八田與一（はったよいち）","磯田謙雄（いそだのりお）"],1,"タカジアスターゼは、強い消化効力のある胃腸薬（いちょうやく）である。この薬は、微生物（びせいぶつ）を利用した薬づくりの手本となった。","偉人・人物","X",15],["日本海から下関をまわり、瀬戸内海を通って大坂［今の大阪］に行く船を、瀬戸内の人々は「北前船」（きたまえぶね）と呼んだ。この北前船の船主は、大坂や瀬戸内からの荷物を、日本海沿いに蝦夷地（えぞち）［今の北海道］まで運び、莫大（ばくだい）な利益を上げた。この当時一代で約3百万両にのぼる富を築いたとされる宮越（みやのこし）［今の金石（かないわ）］の豪商はだれか。",["木谷藤右衛門（きやとうえもん）","大野弁吉（おおのべんきち）","黒川良安（くろかわまさやす）","銭屋五兵衛（ぜにやごへえ）"],3,"この北前船の文化をストーリーとして、文化庁が認定した日本遺産「荒波を超えた男たちの夢が紡いだ（つむいだ）異空間～北前船寄港地・船主集落（ふなぬししゅうらく）～」に 2019 年（令和元）、金沢市が追加認定された。","偉人・人物","X",15],["金沢の気候は、梅雨や台風の時期、そして冬に多くの雨や雪が降るのが特徴である。特に冬の降水量が多いこのような気候を何というか。",["地中海性気候","亜熱帯気候","日本海側気候","高山気候"],2,"日本海側の気候は、冬に雪や雨が多く降るのが特徴である。金沢もこの気候に属しており、梅雨や台風の季節にも降水量が多い。こうした気候のため、雪に備えたくらしの工夫が地域に根付いている。","自然・産業","X",15],["明治時代のなかば頃には、教室の中での学習だけでなく、さまざまな行事が学校で行われるようになった。ある学校では「撃剣野仕合（げっけんのじあい）」「西洋鬼（せいようおに）」「武者修業（むしゃしゅぎょう）」とよばれる活動が行われた。この行事とは何か。",["運動会","文化祭","遠足","卒業式"],0,"このような種目名がつけられたのは、明治時代におこった日清戦争・日露戦争が大きく影響しており、「武者修業」は一瞬で武装を整え、ゴールを目指して走って行く競技のことを指す。","歴史","S",15],["1669 年（寛文9）、加賀では夏から秋にかけ暴風雨（ぼうふうう）のため洪水になった。5万8千石の田が大きな被害を受け、貧乏で生活に困る人がたくさん出た。5代藩主前田綱紀（まえだつなのり）が、困っている人を収容するために造った施設を何というか。",["養生所（ようじょうしょ）","明倫堂（めいりんどう）","経武館（けいぶかん）","お救（すく）い小屋"],3,"お救い小屋は、施設や作業場を設け、乞食（こじき）や浮浪者（ふろうしゃ）、病気で日常生活ができない人たちを収容（しゅうよう）した。","歴史","S",15],["高齢化や交通の不便さといった地域の課題を受けて、金沢市ではせまい道でも走れる小型バスを導入し、地域のくらしを支える交通手段を整えている。此花（このはな）・菊川（きくがわ）・材木（ざいもく）・長町（ながまち）の4ルートがあるこのバスはどれか。",["金沢循環（じゅんかん）バス","ふらっとバス","金沢まちバス","兼六園シャトルバス"],1,"「ふらっとバス」は、金沢のせまい道にも入り込める小型バスで、通常の路線バスが通らない地域を巡回している。","市政・最近の話題","X",15],["2014 年（平成 26）、金沢市は「めざすべき金沢の子ども像」をつくり、大切にしたい子どもの姿を示した。これについて、金沢市内の中学生が自分たちにもわかりやすく覚えやすい言葉で表した宣言はどれか。",["金沢子どもまんなか宣言","金沢子ども人権宣言","金沢子ども応援宣言","金沢子どもかがやき宣言"],3,"「金沢子どもかがやき宣言」は、「めざすべき金沢の子ども像」をもとに、中学生が考えた宣言である。","市政・最近の話題","X",15],["金沢市の東部にある医王山（いおうぜん）や南部の平栗（ひらぐり）では、ニホンカモシカやギフチョウといった、めずらしい動物が見られる。これらの動物がすんでいるのは、自然が多く残されているためである。では、金沢市の面積のうち、森林が占めるおよその割合はどれか。",["約1割","約3割","約6割","約9割"],2,"金沢は市民にとっても動植物にとっても過ごしやすい場所がいたるところに残された自然豊かなまちである。","自然・産業","S",15],["1925 年（大正 14）、平沢嘉太郎は浅野川電鉄との協力で、巨額の資本を投じ劇場、料亭（りょうてい）、レストラン、動物園、大浴場、野球場などを備えた一大レジャー施設を建設した。この施設が作られたのはどこか。",["粟崎（あわがさき）","香林坊","金石（かないわ）","小立野"],0,"この施設は「粟崎遊園」（あわがさきゆうえん）と呼ばれ、川上一郎を座長とする専属の劇団「粟崎大衆座」（あわがさきたいしゅうざ）や宝塚（たからづか）をまねた「粟崎少女歌劇（あわがさきしょうじょかげき）」も組織され、人々の娯楽の場となった。","寺社・建造物・まち","S",15],["金沢市は、伝統工芸が盛んな地域であり、特に金箔の生産で知られている。金沢市の金箔の生産量は、全国で何位か。", ["1位", "2位", "3位", "4位"], 0, "金沢市は、日本の金箔生産量の約 99％を占める全国第1位の産地である。（※出題当時の数字。県外で唯一の職人が引退し、今は全国の100パーセントといわれる）", "美術・工芸・芸能", "S", 15],["金沢の地名は、芋掘藤五郎が金城霊沢で砂金を洗ったことから、その名がついたと伝えられている。その芋堀藤五郎の嫁に来た大和の長者の娘の名前は次のどれか。",["明子（あきこ）","和子（わこ）","正子（まさこ）","令子（れいこ）"],1,"芋掘藤五郎の伝説は、奈良時代前期頃に採鉱者（さいこうしゃ）や鋳物師（いもじ）などによって伝えられていった「炭焼き長者」の伝説がもとになって作られたといわれている。","歴史","S",15],["金沢では、藩政時代からの文化が今もたくさん残っている。能楽師の大石藤五郎が定着させた、能楽の影響をうけた、ユーモアのある祝いの舞や語りをする伝統文化を何というか。",["加賀獅子","山王悪魔払い","加賀万歳","ジョンカラ節"],2,"加賀万歳や八田町のさかたおどりは金沢市無形民俗文化財（かなざわしむけいみんぞくぶんかざい）に指定されている。","美術・工芸・芸能","X",15],["金沢市は世界の7都市と姉妹都市提携を結び、多くの交流事業を行っている。これら7つの姉妹都市を紹介するコーナーを持つ、駅西新町にある公園は何か。",["金沢国際交流公園","四十万きずな広場","額谷ふれあい公園","姉妹都市公園"],3,"姉妹都市公園は、金沢市と姉妹都市提携を結ぶ7都市の文化や風景を再現したゾーンを持つ公園である。","市政・最近の話題","X",15],["1546 年（天文 15）に成立した金沢御堂（かなざわみどう）は、1580 年（天正8）に猛攻（もうこう）にあって落とされた。金沢御堂を攻め、そのまま居城（きょじょう）としたのはだれか。",["柴田勝家（しばたかついえ）","前田利家（まえだとしいえ）","佐久間盛政（さくまもりまさ）","佐々成政（さっさなりまさ）"],2,"佐久間盛政の次に入城した前田利家がある日、広間の上を見たところ、棟木（むなぎ）に結いつけてある阿弥陀仏（あみだぶつ）を見つけた。","歴史","X",15],["華やかな絵付けが特徴の九谷焼（くたにやき）は、金沢を代表する伝統工芸の一つである。その色彩には「九谷五彩（くたにごさい）」と呼ばれる5つの色が使われており、作品に独特の美しさと深みを与えている。この九谷五彩の組み合わせとして正しいものはどれか。",["赤・黄・緑・茶・紺青（こんじょう）","赤・黄・緑・黒・紺青","赤・黄・緑・紫・紺青","赤・黄・緑・橙（だいだい）・紺青"],2,"九谷焼の上絵付けに使われる「九谷五彩」は、赤・黄・緑・紫・紺青の5色である。","美術・工芸・芸能","S",15],["東京オリンピック開催前の開館をめざして、日本海側初の国立美術館として金沢に移転してきたのは次のうちどれか。",["国立工芸館","国立新美術館","金沢 21 世紀美術館","京都国立近代美術館"],0,"国立工芸館［当時の東京国立近代美術館工芸館］は、2020 年（令和2）に東京から金沢へ移転し、日本海側で初めての国立美術館として開館した。","市政・最近の話題","X",15],["金沢の北部には、弥生時代（紀元前 300 年～紀元後 300 年）に玉造のムラ［玉をつくる産地］があり、鉄製の農具や工具が発見されている。それは次のどの遺跡か。",["富樫遺跡","塚崎遺跡","小立野遺跡","森本・東金沢遺跡"],1,"弥生人や古墳時代の人々は、碧玉（へきぎょく）［宝石の一種］製の管玉（くだたま）をネックレスとして使っていた。これは、おしゃれのためというよりも呪術的（じゅじゅつてき）な意味が込められていたと考えられている。","歴史","S",15],["金沢市では、スポーツを盛んにすることで、まちの活力を高めようとしている。2018 年（平成 30）金沢市スポーツ文化推進条例により、スポーツを行うことに加え、ホームタウンチームと市民が交流できるような活動の支援を積極的に進めている。金沢市のホームタウンチーム金沢武士団（かなざわさむらいず）のスポーツの種目はどれか。",["野球","サッカー","バレーボール","バスケットボール"],3,"金沢武士団という名称は一般公募（いっぱんこうぼ）で多数あったキーワード「金沢」「武士」「サムライ」から名付けられた。","市政・最近の話題","S",15],["城下町の金沢と他の町や地域を結ぶ街道には、北国街道とそれに連なる脇街道があった。北国街道でも泉新町、犀川大橋を通って福井方面に行く道は何と呼ばれたか。",["北口","上口（かみくち）","下口（しもくち）","南口"],1,"金沢城下（かなざわじょうか）の北国街道は上口と呼ばれる泉新町から、犀川大橋-片町-香林坊-南町-堤町（つつみちょう）-尾張町（おわりちょう）-橋場町-浅野川大橋を通り、下口と呼ばれる大樋町を過ぎていく。","寺社・建造物・まち","S",15],["古墳時代は、4～7世紀頃、豪族が権力の大きさを古墳の大きさや形で表そうとした時代である。金沢市で作られた一番大きな古墳はどれか。",["北塚町おまる塚古墳（きたづかまちおまるづかこふん）","南塚町びわ塚古墳（みなみづかまちびわづかこふん）","長坂二子塚古墳（ながさかふたごづかこふん）","才田町おちん山古墳（さいだまちおちんやまこふん）"],2,"長坂二子塚古墳は一番大きな古墳であったが、区画整理により消滅した。","歴史","S",15],["1689 年（元禄2）、松尾芭蕉（まつおばしょう）は「奥の細道（おくのほそみち）」の旅の途中、金沢に立ちよった。そのときに、芭蕉は金沢のある俳人（はいじん）の菩提寺（ぼだいじ）に参ったが、その俳人だれか。",["小杉一笑（こすぎいっしょう）","秋の坊（あきのぼう）","亀田小春（かめだしょうしゅん）","立花北枝（たちばなほくし）"],0,"松尾芭蕉は、小杉一笑の死を悼（いた）んで、「塚（つか）も動けわが泣く声は秋の風」という句をよんだ。","文学","S",15],["金沢市内には何本かの川が流れ荷物の流通に使われた。宮腰（みやのこし）［今の金石（かないわ）］から主に木材を運ぶために使われたのは何川か。",["桂川（かつらがわ）","木曳川（きびきがわ）","木津川（きづがわ）","木曽川（きそがわ）"],1,"木曳川では名前のとおり木材が運ばれ、終点は木倉町であった。","寺社・建造物・まち","S",15],["加賀藩では、代々の藩主たちが、武士のたしなみとして積極的に能楽を取り入れた。加賀藩5代藩主前田綱紀（まえだつなのり）が江戸幕府5代将軍徳川綱吉（とくがわつなよし）の影響を受けて、能楽を愛好（あいこう）し、加賀のついた名前で栄えた。それはどの流派か。",["金春（こんぱる）","喜多（きた）","宝生（ほうしょう）","観世（かんぜ）"],2,"加賀宝生といわれ、金沢では能は庶民の楽しみの一つとしても広まった。","美術・工芸・芸能","S",15],["加賀藩3代藩主前田利常（まえだとしつね）は、藩の安定した税［米の年貢］を手に入れるために新しい農政を考えた。次のどれか。",["農政新法","農業新政","改作仕法","改農新法"],2,"改作仕法により、藩士（はんし）たちは農民から勝手に税を取ることができなくなった。","歴史","S",15],["加賀藩 14 代藩主前田慶寧（まえだよしやす）は加賀藩の人々が豊かに生活できるようにと卯辰山の開発に取り組み、様々な施設を作った。オランダ医学者の黒川良安（くろかわまさやす）が中心となった診察所、製薬局、調剤所などが備えられた施設はどれか。",["養生所（ようじょうしょ）","撫育所（ぶいくしょ）","卯辰神社","所作所（しょさしょ）"],0,"養生所に治療（ちりょう）に来る人たちの中でも極（きわ）めて貧（まず）しい人たちは、その衣食代や薬代は無料とされた。","歴史","X",15],["加賀藩3代藩主前田利常（まえだとしつね）が、京都から五十嵐道甫（いがらしどうほ）、江戸から清水九兵衛（しみずくへい）などの名人をまねいて、技術（ぎじゅつ）を伝えたのが始まりといわれている、漆塗り（うるしぬり）の上に金や銀で絵模様（えもよう）をえがいたものを何と呼ぶか。",["加賀蒔絵（かがまきえ）","加賀友禅（かがゆうぜん）","加賀象嵌（かがぞうがん）","加賀繍（かがぬい）"],0,"加賀蒔絵は江戸蒔絵のはなやかさとはちがい、京都の伝統と加賀の武士の文化をミックスさせた、とても格調高いものになった。","美術・工芸・芸能","X",15],["金沢では、弥生時代（紀元前 300 年～紀元後 300 年）の広大な集落遺跡が発見されている。それはどの遺跡か。",["富樫（とがし）遺跡","西念・南新保遺跡","小立野遺跡","森本・東金沢遺跡"],1,"「西念・南新保遺跡」は遺構（いこう）や道具が良好な状態で発掘されている。","歴史","S",14],["金沢市内には、南東から北西に向かって犀川（さいがわ）と浅野川（あさのがわ）の2つの川が流れており、犀川の南側には寺町台地が広がり、浅野川の北側には卯辰山（うたつやま）がある。これら2つの川の間の突端に位置し、金沢城が建てられた台地の名前はどれか。",["富樫（とがし）台地","長坂丘陵（きゅうりょう）","戸室（とむろ）山地","小立野（こだつの）台地"],3,"金沢の地形は、西部の海岸に向かって丘陵地（きゅうりょうち）から平野へと変化し、次第になだらかになっている。","寺社・建造物・まち","X",14],["金沢は、加賀藩（はん）のころから学問や芸術が盛んで、明治以降も文化面で優れた人物を輩出（はいしゅつ）してきた。なかでも「金沢の三文豪（さんぶんごう）」とされている3人とは誰（だれ）か。",["室生犀星（むろおさいせい）・泉鏡花（いずみきょうか）・鈴木大拙（すずきだいせつ）","室生犀星・西田幾多郎（にしだきたろう）・徳田秋声（とくだしゅうせい）","泉鏡花・徳田秋声・室生犀星","泉鏡花・西田幾多郎・鈴木大拙"],2,"それぞれの代表作として、徳田秋声は「黴（かび）」「あらくれ」、泉鏡花は「義血侠血（ぎけつきょうけつ）」「高野聖（こうやひじり）」、室生犀星は「抒情小曲集（じょじょうしょうきょくしゅう」「幼年時代」などがある。","文学","X",14],["大和朝廷の頃、金沢平野に大陸からの使節に大和の天皇だと偽（いつわ）り、貢（みつ）ぎ物を横領（おうりょう）した豪族がいた。それは誰か。",["加賀君（かがのきみ）","金沢君（かなざわのきみ）","道君（みちのきみ）","近江君（おうみのきみ）"],2,"『日本書紀（にほんしょき）』に記述があり、この事件のあとに、道君はきびしく問いつめられ、完全に大和朝廷に従ったと見られる。","歴史","S",14],["金沢城跡（じょうあと）の発掘（はっくつ）調査で見つかった土から発見された出土品により、金沢で縄文時代以前に人間が活動していたことが確認された。この旧石器時代（きゅうせっきじだい）の出土品として見つかったものは何か。",["銅剣（どうけん）","銅鏡（どうきょう）","土器","石器"],3,"発掘調査（はっくつちょうさ）で出た土を金沢城の整地に用いていたが、その中に使用した跡（あと）のある石器がふくまれていた。","寺社・建造物・まち","S",14],["富樫氏守護時代の終り頃、加賀の土豪（どごう）や浄土真宗の坊主が中心になり、富樫氏に代わり加賀国を治めるようになった時代があった。このようすに、他国の人たちは加賀国のことを何と呼んだか。",["坊主の持ちたる国","百姓の持ちたる国","土豪（どごう）の持ちたる国","一揆（いっき）の持ちたる国"],1,"他国では守護大名、戦国大名などの武士による政治であったのとくらべて、あまりにもちがっており、百姓の持ちたる国のようになったと評判になった。","歴史","X",14],["加賀藩（はん）初代藩主前田利家（まえだとしいえ）が越前（えちぜん）を治めていた頃（ころ）、領民がお祝いにおどっていたおどりが金沢に移り、能楽の影響（えいきょう）を受け、舞（まい）や語りに品格（ひんかく）があるものとして定着し、金沢市民の伝統芸能活動となったものはどれか。",["加賀万歳（かがまんざい）","奴（やっこ）行列","寺中神事能（じちゅうしんじのう）","ジョンカラ節"],0,"「加賀万歳」は、能楽師（のうがくし）の大石藤五郎（おおいしとうごろう）が定着させたため、能楽の影響（えいきょう）を受け、舞（まい）や語りはユーモアある中にも品格があり、金沢市無形民俗（みんぞく）文化財に指定されている。","美術・工芸・芸能","X",14],["1584 年（天正 12）に起こった末森（すえもり）の戦いは、加賀藩（はん）初代藩主前田利家（まえだとしいえ）と越中（えっちゅう）の誰との戦いであったか。",["徳川家康（とくがわいえやす）","豊臣秀吉（とよとみひでよし）","柴田勝家（しばたかついえ）","佐々成政（さっさなりまさ）"],3,"この末森の戦いは、豊臣秀吉の天下統一を進めるうえで大きな役割を果たした。利家にとっても加賀、能登、越中を治めるきっかけになった。","歴史","S",14],["金沢には芋掘藤五郎（いもほりとうごろう）の伝説が残っている。この伝説で藤五郎が芋を洗ったとされている場所で、兼六園にある泉を何というか。",["金城霊沢（きんじょうれいたく）","霞ケ池（かすみがいけ）","瓢池（ひさごいけ）","蓮池（はすいけ）"],0,"金城霊沢は金洗沢（かなあらいのさわ）とも呼ばれ、「金沢」の地名はここから伝わったと言われている。","寺社・建造物・まち","S",14],["1869 年（明治2）の版籍奉還（はんせきほうかん）によって加賀藩（はん）は金沢藩に、1871 年(明治4)の廃藩置県（はいはんちけん）によって金沢県と変わった。こうした中、県庁が金沢からある町へと移され、県名が石川県へと変わった。ある町とはどれか。",["内灘（うちなだ）","美川（みかわ）","松任（まっとう）","珠洲（すず）"],1,"石川郡の美川に移された時、県名が石川県に変わった。","歴史","S",14],["金沢でのＳＤＧs 推進に向けた具体的な取り組みとして、ＳＤＧs ミーティングを通じて、ＳＤＧsカフェの開催や市内イベントへの出展、ホームページを活用して多くのアイデアが集められた。これらのアイデアを総称して何というか。",["金沢ミライシナリオ","金沢アイデア","金沢ターゲット","金沢ＳＤＧs"],0,"持続可能な開発目標（ＳＤＧs）を達成するために、金沢で始まったプロジェクトを「IMAGINEKANAZAWA 2030」という。市民、地域、ＮＰＯ、企業、行政などさまざまな主体が集まり、今金沢が抱えている問題を一緒に考え、解決に向けて対話を重ねていく場を提供し、多様な主体がつながることで大きな力を生み出すことを促進（そくしん）している。","市政・最近の話題","S",14],["城下町の金沢と他の町や地域を結ぶ街道には、北国街道とそれに連なる脇街道があった。北国街道の中でも大樋（おおひ）町を通って富山方面に行く道は何と呼ばれたか。",["北口","上口（かみくち）","下口（しもくち）","南口"],2,"金沢城下（じょうか）の北国街道は上口と呼ばれる泉新町から、犀川大橋－片町－香林坊－南町－堤（つつみ）町－尾張（おわり）町－橋場町－浅野川大橋を通り、下口と呼ばれる大樋町を過ぎていく。","寺社・建造物・まち","S",14],["金沢の地域福祉（ふくし）活動の原点でもあり、生活相談や授産（じゅさん）・託児（たくじ）の援助など、地域の福祉・社会教育の拠点（きょてん）として 1934 年（昭和9）から建てられた施設はどれか。",["友好館","交流館","福祉館","善隣館（ぜんりんかん）"],3,"現在も高齢者福祉（こうれいしゃふくし）を中心に地域と密着（みっちゃく）した活動を続けています。","市政・最近の話題","X",14],["金沢には、歴史ある旧町名や昔の地名が多く残っている。これらの旧町名や昔の地名が忘れ去られないように、その由来を刻んだ標柱（ひょうちゅう）は何と呼ばれているか。",["金沢まちしるべ","旧町名しるべ","歴史由来しるべ","歴史のまちしるべ"],3,"旧町名には、武士の住んでいた主馬町（しゅめまち）や玄蕃町（げんばまち）、職人の住んでいた鍛冶町（かじまち）や桶町（おけちょう）など、藩政（はんせい）時代の町の性格を表したものが数多くあった。","寺社・建造物・まち","S",14],["金沢では清らかな水を利用して上質な和紙が生産されている。この和紙を使った、全国第 1 位の生産量をほこる金沢の特産品は何か。",["金沢漆器（しっき）","金箔（きんぱく）","加賀毛針（かがけばり）","九谷焼"],1,"金箔を作るためには、特別なじょうぶさをもった上質の和紙が必要で、清らかな水が豊富な金沢は、その和紙をつくる上でも良い条件がそろっていたとされる。","美術・工芸・芸能","X",14],["金沢市内には何本かの川が流れ、荷物の流通に使われた。宮腰（みやのこし）［今の金石］から木曳川（きびきがわ）を使って運ばれたものは何か。",["米","木材","味噌","塩"],1,"木曳川では名前のとおり、木材が運ばれ、終点は木倉町であった。","寺社・建造物・まち","S",14],["交通網（もう）の整備により地域の発展と活性化が進められている。金沢外環状（かんじょう）道路（山側幹線）と接続し、2004 年（平成 16）に開通した北陸自動車道のＩＣ（インターチェンジ）の名前を何というか。",["金沢森本ＩＣ","金沢西ＩＣ","金沢東ＩＣ","金沢港ＩＣ"],0,"2012 年（平成 24）4月には白山ＩＣが新設され、外環状道路（海側幹線）にも接続された。","市政・最近の話題","S",14],["北陸新幹線は、2015 年（平成 27）に東京駅から金沢駅までの区間（くかん）で開業した。2024 年（令和6）の春には福井県のどこまで延伸（えんしん）開業したか。",["敦賀（つるが）駅","芦原（あわら）温泉駅","福井駅","越前たけふ駅"],0,"金沢と東京は江戸時代の参勤交代では約 13 日間、北陸新幹線開業前は約4時間かかっていたところ、約2時間 28 分で行き来できるようになった。","市政・最近の話題","S",14],["藩政（はんせい）末期、金沢大野に「加賀の平賀源内（ひらがげんない）」といわれた大野弁吉（おおのべんきち）がいた。弁吉はたくさんのからくりや工芸品を残し、「優れたからくり師」といわれていた。弁吉の才能や仕事に援助（えんじょ）した豪商（ごうしょう）は誰か。",["高田久兵衛（たかだきゅうべえ）","木谷藤右衛門（きやとうえもん）","横山隆興（よこやまたかおき）","銭屋五兵衛（ぜにやごへえ）"],3,"大野弁吉は高い水準の科学知識を身につけた技術者でもあり、著書の「一東視窮録（いっとうしきゅうろく）」には、エレキテル・写真術・無尽灯（むじんとう）など、当時としては最新の知識がまとめられている。","偉人・人物","X",14],["金沢の代表的な焼き物に九谷焼（くたにやき）と大樋焼（おおひやき）がある。九谷焼は大聖寺藩（だいしょうじはん）の御用窯（ごようがま）として江沼郡九谷村（えぬまぐんくたにむら）で初めて焼かれたことから、その名前が付けられた。この九谷焼の特色である上絵付け（うわえつけ）の五彩（ごさい）の組み合わせとして正しいものはどれか。",["赤・黄・緑・茶・紺青（こんじょう）","赤・黄・緑・黒・紺青","赤・黄・緑・紫・紺青","赤・黄・緑・橙（だいだい）・紺青"],2,"九谷庄三（くたにしょうざ）は五彩、花鳥山水（かちょうさんすい）を描いた彩色（さいしき）、金襴手（きんらんで）の技法を確立した。","美術・工芸・芸能","S",14],["金沢にはたくさんの方言があるが、その中でも雪で「道がこおったようす」をあらわす方言はどれか。",["かんかんなまなま","きんかんなまなま","きんきんなまなま","こんこんなまなま"],1,"冬に雪道などが固まってつるつるになった状態を指す方言である。","金沢ことば","S",14],["室町時代、戦いや争いが絶え間なく起こり、人々が苦しく不安な生活を送っていた。そのなかで農民は作物がたくさんとれるよう工夫し、取れ高が増えてくると「どのように生きるか」「死んだ後はどうなるのか」を考えるようになった。このような時代に「南無阿弥陀仏（なむあみだぶつ）」をとなえることで極楽浄土（ごくらくじょうど）に往生（おうじょう）できると北陸にて布教を行った人物は誰か。",["親鸞（しんらん）","蓮如（れんにょ）","法然（ほうねん）","日蓮（にちれん）"],1,"本願寺（ほんがんじ）の蓮如は親鸞（しんらん）の教えをわかりやすく人々に伝え、誰からも親しまれた。","歴史","X",14],["水が豊富な金沢は、「用水のまち」としても知られている。市内には何本の用水が流れているか。",["30 本","45 本","55 本","70 本"],2,"金沢の用水の長さを全部合わせると約 150 キロメートルになる。","寺社・建造物・まち","S",14],["第2次世界大戦中は、武器などの金属が不足したため、金属供出（きょうしゅつ）で寺の鐘や子供の三輪車までも供出させられたといわれる。そのため、本来は金属で作られるものを陶器や木、布で作ることがあった。特に陶器で作られたもので有名なものは何か。",["本立て","筆箱","バケツ","湯たんぽ"],3,"こども金沢市史には布製のバケツや陶器製の湯たんぽの写真が掲載されている。","歴史","S",14],["金沢市は、スポーツを通じて人と街を元気にすることをめざしている。ただスポーツを行うだけでなく、「観る、応援（おうえん）する、語り合う」ことが日常生活にとけこみ、金沢の風土として受けつがれていくことを目的として、2018 年（平成 30）に金沢市が制定した条例は何か。",["金沢市体育施設（しせつ）条例","金沢市スポーツ文化推進（すいしん）条例","金沢市スポーツ広場条例","金沢市スポーツ基本（きほん）条例"],1,"条例は大きく5つの考え方と5つの項目から成り立っている。金沢市民が理解してともに同じ方向に進むために、スポーツ文化によって過去と未来を交差させるという目的がある。","市政・最近の話題","X",14],["二俣（ふたまた）地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作り、それらは加賀藩主（はんしゅ）やその一族が公式儀礼（こうしきぎれい）や日常生活で利用していた。その伝統工芸品はどれか。",["ろうそく","和紙","友禅（ゆうぜん）","漆器（しっき）"],1,"和紙の里としての二俣は、利家が金沢城入城後の 1592 年（文禄1）、加賀藩御料紙（かがはんごりょうし）の指定産地（していさんち）になってから飛躍的に発展をとげた。","美術・工芸・芸能","S",14],["金沢で開かれた第2回国民体育大会の開会式で披露され、一時期姿を消していましたが、1991 年（平成3）の第 46 回国体石川大会で演技され、翌年から小学校連合体育大会で表現運動として演じられている歌と体操はどれか。",["若い力","金沢市民の歌","石川県民の歌","国体の歌"],0,"現在も運動会や体育祭の時に演じられている。","市政・最近の話題","X",14],["金沢気象台が観測（かんそく）を始めてから最大の積雪記録で、新雪総計 343 ㎝、最大積雪 181 ㎝を記録した北陸地方の大雪を何というか。",["昭和一八豪雪","昭和三八豪雪","昭和四八豪雪","昭和五八豪雪"],1,"1月 11 日から連日 20cm を超える雪が1月 27 日まで降り続いた。除雪作業は2月に入っても続き、市民生活がもとの状態に戻ったのは3月に入ってからだった。","自然・産業","X",14],["金沢駅兼六園口（東口）にある観光の玄関口となっている建物は、（あ）ドーム、（い）門と呼ばれている。これらの正しい組み合わせはどれか。",["（あ）－もてなし（い）－太鼓（たいこ）","（あ）－かんげい（い）－太鼓","（あ）－もてなし（い）－鼓（つづみ）","（あ）－かんげい"],2,"（い）－鼓洗練された現代的な都市としての姿は観光都市金沢の魅力（みりょく）の1つとなっており、2013年（平成 25）には「世界で最もすばらしい駅」ベスト 10 に選出された。","寺社・建造物・まち","S",14],["加賀藩（はん）3 代藩主前田利常（まえだとしつね）は世の中が戦（いくさ）のない時代に移りつつあることを感じとり、いち早く藩内の産業の振興（しんこう）と文化の発展につくした。前田利常が行った政策はどれか。",["お救い小屋（おすくいごや）の設置","辰巳用水（たつみようすい）の設置","明倫堂（めいりんどう）の設置","浄水場（じょうすいじょう）の設置"],1,"当時は小立野（こだつの）台地の先端（せんたん）にある金沢城まで水がゆきわたらず、防火用水（ぼうかようすい）が不足していた。そこで利常は小松の町人板屋兵四郎（いたやへいしろう）に命じて辰巳用水をつくらせた。","寺社・建造物・まち","X",14],["加賀藩（はん）5代藩主前田綱紀（まえだつなのり）は、学問を好み、国内の貴重な書物を収集することに力を注いだ。収集できない書物は写本（しゃほん）を作成して集め、大切に保存した。このようにして集められた文庫を何というか。",["前田文庫","金沢文庫","加賀文庫","尊経閣（そんけいかく）文庫"],3,"江戸時代を代表する学者として有名な新井白石（あらいはくせき）は、「加賀は天下の書府（しょふ）」であるとほめたたえた。","歴史","S",14],["1689 年（元禄 2）、松尾芭蕉（まつおばしょう）は「奥の細道」（おくのほそみち）の旅の途中、金沢に立ち寄った。その際、芭蕉に会うのを楽しみにしながら前年に亡くなった小杉一笑（こすぎいっしょう）の死をいたみ、詠んだ句はどれか。",["あかあかと日は難面（つれなく）も秋の風","山中や菊（きく）はたおらじ湯のにほひ","むざんやな甲（かぶと）の下のきりぎりす","塚も動けわが泣く声は秋の風"],3,"芭蕉は 10 日間金沢に滞在し、多くの俳人たちに俳句を教えたり、俳句について話し合ったりし、訪れた先で数々の句を詠んだ。","文学","S",14],["藩政（はんせい）時代、北海道から日本海を経て下関・瀬戸内海を通り大坂［今の大阪］へ向かう船は、危険をともないながらも莫大（ばくだい）な利益をあげた。この船を瀬戸内の人々は何と呼んだか。",["北海廻船（かいせん）","瀬戸内廻船","北前船（きたまえぶね）","西回り廻船"],2,"大坂と北海道を結ぶ廻船を加賀藩（はん）でも利用した。江戸時代、日本海から下関をまわり大坂に行く船は北前船と呼ばれ、危険をともないながら莫大な利益をあげた。","歴史","X",14],["1925 年（大正 14）に金沢西部の砂丘（さきゅう）地帯に建てられ、北陸の宝塚といわれた一大レジャー施設（しせつ）はどれか。",["金沢サニーランド","粟崎遊園（あわがさきゆうえん）","卯辰山（うたつやま）ヘルスセンター","あめるんパーク"],1,"粟崎遊園は、平沢嘉太郎（ひらさわかたろう）が、浅野川電鉄と協力して建設した。","寺社・建造物・まち","X",14],["加賀藩（はん）では、金沢城内において、藩が使用する武具や工芸調度品の製作および修理を行う役所が存在した。この役所の名前はどれか。",["藩工芸所（はんこうげいしょ）","藩工作所（はんこうさくしょ）","御工作所（おんこうさくしょ）","御細工所（おさいくしょ）"],3,"藩政初期には城内に設けられた。幕府や朝廷（ちょうてい）等へのおくり物を作る役所として仕事をした。多いときには 76 人もの細工人が働き、高い技術を持った京都や江戸の職人を招いて、細工人の指導にあたらせた。","美術・工芸・芸能","S",14],["春、夏、秋、冬、という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子（わがし）があり、生活の中にいろどりと美をそえている。そのうち、7 月 1 日に加賀藩（はん）から江戸の将軍に冬の間に保存しておいた氷を献上した行事にちなみ、食べられるようになった和菓子はどれか。",["金花糖（きんかとう）","五色生菓子（ごしきなまがし）","氷室饅頭（ひむろまんじゅう）","辻（つじ）うら"],2,"この日に氷室饅頭やちくわを食べると 1 年間病気にかからないと言われている。","食・行事","X",14],["江戸時代、各藩（はん）では家臣の教育のために、藩校（学校）を建てた。加賀藩 11 代藩主前田治脩（まえだはるなが）のときに兼六園内に建てられ、儒学を中心とし、漢字・算術・医学・天文学など広い分野を教えた藩校はどれか。",["明倫堂（めいりんどう）","経武館（けいぶかん）","壮猶館（そうゆうかん）","寺子屋（てらこや）"],0,"明倫堂は、士農工商（しのうこうしょう）の身分を問わず8歳以上の男子が入校できた。","寺社・建造物・まち","X",14],["1954 年（昭和 29）に金沢市中心部を流れる犀川（さいがわ）河口の金石港と、河北潟から流れる大野川河口の大野港が合併（がっぺい）して誕生した港の名称はどれか。",["河北港","昭和港","金沢港","粟崎港"],2,"幕末（ばくまつ）に、犀川河口の宮腰（みやのこし）が金石と改称された。現在も「金石街道」と呼ばれる金沢市の中心部へ一直線にのびる道は、金沢城と港の間を船荷がスムーズに運搬（うんぱん）できるように作られた。日本海側のメインポートとして大型船が入港できるように整備され、2020 年（令和2）に金沢港クルーズターミナルが開業した。","市政・最近の話題","X",14],["明治政府（めいじせいふ）は廃藩置県（はいはんちけん）後、全国に 31 の市をつくり、石川県でただ一つ金沢市ができた。当時は一定以上の税金を納める人が市議会議員（しぎかいぎいん）を選び、その議員が市長にしたい人を選び、最後は政府の許可を得て決定するものだった。このような選挙の結果、初代金沢市長に選ばれたのは誰か。",["稲垣義方（いながきよしかた）","長谷川準也（はせがわじゅんや）","島田一良（しまだいちろう）","中橋徳五郎（なかはしとくごろう）"],0,"市長候補には稲垣義方と長谷川準也の二人が上がり、選挙戦は乱闘さわぎになるほど激しいものだった。","偉人・人物","S",14],["金沢市のシンボルである市章は 1891 年（明治 24）の市議会で決められた。この形は、前田の殿様が東京へ行ってしまい、金沢の町が非常にさびれてしまったため、前田家に再び金沢にもどってもらい、人々の心に活気を取り戻そうとつくられたといわれている。市章に使われた形は何の花からできているか。",["桜","百合（ゆり）","梅","菊"],2,"梅の形は前田家の梅鉢（うめばち）の紋章（もんしょう）からとったもので、下水道のふたや消防のまといなどにも使われている。","市政・最近の話題","X",14],["加賀藩（はん）5代藩主前田綱紀（まえだつなのり）は、茶道を普及（ふきゅう）させるために京都から千仙叟宗室（せんのせんそうそうしつ）を招いた。仙叟が始祖（しそ）［はじめた人］とされる茶道の流派はどれか。",["表千家（せんけ）流","裏千家流","武者小路（むしゃのこうじ）流","宗和（そうわ）流"],1,"宗室は裏千家を名のり、表は宗左を、武者小路は宗守を名のる。宗和は金森宗和から始まる。","美術・工芸・芸能","S",14],["金沢市は、1962 年（昭和 37）にアメリカ合衆国バッファロー市と姉妹都市提携（ていけい）を結んだ。その後、姉妹都市は増えていったが、2002 年（平成 14）4月に姉妹都市となったのはどこか。",["大韓民国・全州（ジョンジュ）市","ロシア・イルクーツク市","ベルギー・ゲント市","フランス・ナンシー市"],0,"姉妹都市交流は、双方の市民同士が、友情と信頼をもとに文化・スポーツ・経済などの広い文化で交流し合い、お互いの理解と友好関係を発展させることを目的としている。全州市とは高校生同士の交流などを行い、お互いの友好を深めている。","市政・最近の話題","S",14],["戦後の混乱のさなか 1946 年（昭和 21）に兵器の倉庫として使われていた赤レンガづくりの建物を使って開学した学校が元であり、2023 年（令和5)にキャンパス移転が行われた大学はどれか。",["金沢美術工芸大学","金沢大学","石川県立大学","石川県立看護大学"],0,"金沢美術工芸大学は伝統と美を大切にする金沢市民の期待に応えて金沢美術工芸専門学校として開設されたのが始まりである。","美術・工芸・芸能","X",14],["1924 年（大正 13）に作られ、金沢市の新たな産業や生活文化をつくってきた橋が 2024 年(令和6)で 100 周年をむかえる。日本の伝統色（でんとうしょく）である青色を基調（きちょう）とし、2000年（平成 12）には国の登録有形文化財（とうろくゆうけいぶんかざい）にも登録された橋が架かっている川は何というか。",["犀川（さいがわ）","浅野川（あさのがわ）","森下川（もりもとがわ）","大野川（おおのがわ）"],0,"金沢は、犀川と浅野川という二つの川にはさまれ、緑に恵まれた、「森の都」と呼ぶにふさわしいまちである。","寺社・建造物・まち","X",14],["宮崎友禅斎（みやざきゆうぜんさい）は、京都から金沢に移り住み、金沢に友禅染を伝え「加賀友禅（かがゆうぜん）」を作り出した。「加賀友禅」の特徴（とくちょう）的な技法はどれか。",["色染め","虫染め","虫食い","色ぬき"],2,"「ぼかし」と「虫食い」の表現に味わいがあるとされている。","美術・工芸・芸能","S",14],["観光の玄関口である金沢駅東口の建物は( あ )ドーム、( い )門と呼ばれている。正しい組み合わせはどれか。",["（あ）－もてなし（い）－太鼓（たいこ）","（あ）－もてなし（い）－鼓（つづみ）","（あ）－かんげい（い）－太鼓","（あ）－かんげい（い）－鼓"],1,"洗練された現代的な都市としての姿は観光都市金沢の魅力（みりょく）の1つとなっており、2013 年（平成 25）には「世界で最もすばらしい駅」ベスト 10に選出された。","寺社・建造物・まち","S",13],["金沢を上空から見ると、南東の山地と北西の日本海がある。標高 1644ｍある南東の山地で一番高い山はどれか。",["奥医王山（おくいおうぜん）","卯辰山（うたつやま）","奈良岳（ならだけ）","大門山（だいもんざん）"],2,"金沢の地形図を見ればわかるが、犀川（さいがわ）の水源でもある。奈良岳からの「二又川（ふたまたがわ）」と大門山からの「倉谷川（くらたにがわ）」は、犀川ダムに集まり、その後、金沢で一番長い「犀川」という一本の川になって、日常生活に使われる水道水や、田畑をうるおす農業用水などに利用されている。","自然・産業","X",13],["江戸（えど）時代末期、加賀藩（かがはん）最後の藩主前田慶寧（まえだよしやす）は、人々の生活を豊かにするために、金沢東部の卯辰山（うたつやま）を開発して福祉施設（ふくししせつ）の「撫育所（ぶいくしょ）」、工芸の工場などを作り、賑(にぎ)わいを作り出した。そこに作った病院施設を何というか。",["卯辰山病院","養生所（ようじょうしょ）","金沢病院","医王山病院"],1,"「撫育所」は養生所の付属施設で、身寄りも仕事もない人たちが住み、中の作業所で仕事をしていた。","歴史","X",13],["北陸新幹線は、2015 年(平成 27)に、東京駅から金沢駅までの間で開業した。2024 年（令和6）の春には福井県のどこまで開通するか。",["芦原（あわら）温泉駅","福井駅","敦賀（つるが）駅","越前たけふ駅"],2,"金沢と東京は江戸時代の参勤交代では約 13 日間、北陸新幹線開業前は約4時間かかっていたところ、約2時間 30 分で行き来できるようになった。","市政・最近の話題","S",13],["兼六園（けんろくえん）は江戸（えど）時代の代表的な大名庭園（だいみょうていえん）であり、6つの優れた点を兼ね備えている庭という意味で名づけられたといわれている。県立伝統産業工芸館には当時の老中により揮毫（きごう：毛筆で字を書くこと）された「兼六園」の額（がく）が残っているが、誰（だれ）が書いたものか。",["田沼意次（たぬまおきつぐ）","松平定信（まつだいらさだのぶ）","水野忠邦（みずのただくに）","阿部正弘（あべまさひろ）"],1,"兼六園は加賀藩（かがはん）12 代藩主前田斉広（まえだなりなが）の時代に名づけられたといわれている。松平定信は江戸幕府8代将軍徳川吉宗の孫であり、白河藩（しらかわはん）の藩主である。","寺社・建造物・まち","S",13],["藩政（はんせい）時代、北海道から日本海を通って下関・瀬戸内海（せとないかい）を経て大坂に行く船は、危険をともないながら莫大（ばくだい）な利益をあげた。この船を瀬戸内の人々は何と呼んだか。",["北海廻船（かいせん）","瀬戸内廻船","西回り廻船","北前船（きたまえぶね）"],3,"大坂と北海道を結ぶ廻船を加賀藩（かがはん）でも利用した。江戸（えど）時代、日本海から下関をまわり大坂に行く船は北前船と呼ばれ、危険をともないながら莫大な利益をあげた。","歴史","X",13],["藩政（はんせい）末期、金沢大野に「加賀の平賀源内（ひらがげんない）」といわれた大野弁吉（おおのべんきち）がいた。弁吉はたくさんのからくりや工芸品を残し、「優れたからくり師」といわれていた。弁吉の才能や仕事に援助（えんじょ）をした豪商（ごうしょう）は誰（だれ）か。",["銭屋五兵衛（ぜにやごへえ）","木谷藤右衛門（きやとうえもん）","横山隆興（よこやまたかおき）","高多久兵衛（たかだきゅうべえ）"],0,"弁吉は高い水準の科学知識を身につけた技術者でもあり、著書の「一東視窮録（いっとうしきゅうろく）」には、エレキテル・写真術・無尽灯（むじんとう）など、当時としては最新の知識がまとめられている。","偉人・人物","X",13],["「氷室の朔日（ついたち）」は、江戸時代に加賀藩（かがはん）から江戸の将軍に冬の間に保存しておいた氷を献上（けんじょう）したことにちなんだ行事である。この日に食べると一年間病気にかからないといわれている食べ物はどれか。",["五色生菓子（ごしきなまがし）","葛饅頭（くずまんじゅう）","氷室饅頭（ひむろまんじゅう）","（つじ）うら"],2,"現在でも、氷室の朔日（ついたち）（旧：6月1日）に氷室饅頭が売り出される。","食・行事","X",13],["1689 年（元禄（げんろく）2）、俳人で有名な松尾芭蕉（まつおばしょう）が金沢の俳人に会うために金沢を訪れた。しかし、残念ながら彼（かれ）は前年に亡くなっていたので、芭蕉は「塚（つか）も動けわが泣く声は秋の風」の句をよんで彼の死を悲しんだ。この金沢の俳人は誰（だれ）か。",["立花北枝（たちばなほくし）","宮竹屋小春（みやたけやしょうしゅん）","小杉一笑（こすぎいっしょう）","河合曾良（かわいそら）"],2,"一笑の菩提寺（ぼだいじ）野町願念寺に句碑（くひ）がある。小杉一笑は 1653年(承応2)に金沢に生まれ、加賀（かが）を代表する俳人で茶屋の経営（けいえい）も行っていた。","文学","S",13],["1925 年（大正 14)に金沢の西の方の砂丘（さきゅう）地に建てられた北陸の宝塚（たからづか）といわれた一大レジャー施設（しせつ）はどれか。",["粟崎遊園（あわがさきゆうえん）","金沢サニーランド","卯辰山（うたつやま）ヘルスセンター","あめるんパーク"],0,"粟崎遊園は、平沢嘉太郎（ひらさわかたろう）が、浅野川電鉄と協力し建設した。","寺社・建造物・まち","X",13],["加賀藩（かがはん）3代藩主前田利常（まえだとしつね）は、家来の侍（さむらい）が直接農民から年貢（ねんぐ）を集める体制から、藩が直接集め、家来に給付する体制に改めた。藩の農政の安定につながったこの方法を何というか。",["改作法","農政法","改農法","農作法"],0,"政治は一加賀、二土佐といわれるほど盤石（ばんじゃく）の体制を築いた。","歴史","S",13],["金沢では様々な伝統芸能が受け継がれている。加賀藩（はん）5代藩主前田綱紀（まえだつなのり）が取り入れたことから金沢で盛んになった「加賀宝生」として発展した芸術は何か。",["歌舞伎（かぶき）","獅子舞（ししまい）","文楽（ぶんらく）","能楽（のうがく）"],3,"加賀藩では代々の藩主たちが積極的に能楽や茶の湯を取り入れたが、特に前田綱紀は学問が好きで、有名な学者や貴重なものを国中から集めた。","美術・工芸・芸能","S",13],["1878 年（明治 11）、藩閥政府（はんばつせいふ）に不満をもつ島田一良（いちろう）ら三光寺派（さんこうじは）の6人が、馬車で皇居（こうきょ）へ向かう途中（とちゅう）の政府高官を暗殺した紀尾井町事件（きおいちょうじけん）が発生した。このとき暗殺された政府高官は誰（だれ）か。",["大久保利通（おおくぼとしみち）","木戸孝允（きどたかよし）","大隈重信（おおくましげのぶ）","岩倉具視（いわくらともみ）"],0,"薩摩藩（さつまはん）出身の大久保利通は当時の藩閥政府の中心的人物だった。","偉人・人物","S",13],["金沢は、緑にめぐまれ「森の都」と呼ぶにふさわしい町だ。金沢の面積のうち、森林がしめる面積は約何割か。",["3割","4割","5割","6割"],3,"金沢市は 2003 年（平成 15）4月に「金沢市森づくり条例」を制定し、地域と一体となった森づくりを進めている。金沢市域の6割をしめる森林は、国土の保全や地球温暖化の防止などに役立っており、市民生活に欠くことのできない貴重な財産である。","自然・産業","S",13],["平安時代、加賀国や能登国では早くから大陸の国との交流があった。このことは 2001 年（平成 13）に金沢市の畝田ナベタ遺跡（うねだなべたいせき）から文様（もんよう）入り帯金具（おびかなぐ）が出土したことから証明されている。この大陸の国とはどこか。",["契丹（きったん）","唐（とう）","隋（ずい）","渤海（ぼっかい）"],3,"渤海（8世紀～10 世紀）は唐から独立した国であり、唐に対抗するために日本との交流をすすめたといわれている。","歴史","S",13],["金沢の清らかな水を利用して上質な和紙がすかれている。この和紙を使った日本の総生産量のほとんどをしめ、全国第 1 位の生産量をほこる金沢の特産品は何か。",["金沢漆器（しっき）","加賀毛針（かがけばり）","金箔（きんぱく）","九谷焼"],2,"金箔を作るためには、特別なじょうぶさをもった上質の和紙が必要で、清らかな水が豊富な金沢は、その和紙をつくる上でも良い条件がそろっていたとされている。","美術・工芸・芸能","X",13],["加賀藩（かがはん）では、金沢城内に藩で使用する武具や工芸調度品を製作・修理する役所があった。その役所の名前はどれか。",["御細工所（おさいくしょ）","藩工芸所（はんこうげいしょ）","藩工作所（はんこうさくしょ）","御工作所（おんこうさくしょ）"],0,"藩政初期には城内に設けられた。幕府や朝廷（ちょうてい）等へのおくり物を作る役所として仕事をした。多いときには76人もの細工人が働き、高い技術を持った京都や江戸の職人を招いて、細工人の指導にあたらせた。","美術・工芸・芸能","S",13],["加賀藩（かがはん）3代藩主前田利常（まえだとしつね）は世の中が戦（いくさ）のない時代にうつりつつあることを感じとり、いち早く藩内の産業の振興（しんこう）と文化の発展につくした。前田利常が行った政策はどれか。",["お救い小屋（おすくいごや）の建設","明倫堂（めいりんどう）の建設","浄水場（じょうすいじょう）の建設","辰巳用水（たつみようすい）の建設"],3,"当時は小立野（こだつの）台地の先端（せんたん）にある金沢城まで水がゆきわたらず、防火用水が不足していた。そこで利常は小松の町人板屋平四郎（いたやへいしろう）に命じて、辰巳（たつみ）用水をつくらせた。","寺社・建造物・まち","X",13],["戦後、金沢城内にあった旧陸軍の木造兵舎を利用して、ある施設（しせつ）がつくられた。その施設は何か。",["金沢市役所","金沢大学","金沢歴史博物館","金沢美術館"],1,"金沢大学は、「お城の中の大学」として全国に有名になり、昭和 30 年代後半にかけ、学生もどんどん全国から集まっていた。","寺社・建造物・まち","X",13],["金沢には、「市民の台所」近江町（おうみちょう）市場がある。2009 年（平成21）再開発事業で生まれ変わり開業した施設（しせつ）はどれか。",["近江町いちば館","近江会館","むさし会館","武蔵が辻（むさしがつじ）市場"],0,"近江町市場は店員のかけ声がいせいよく響き渡り、安くて新鮮な魚や野菜などを直接買うことができる市場として市民だけでなく観光客にも多く利用されている。","市政・最近の話題","X",13],["江戸（えど）時代の金沢ではまちづくりの一つとして、火事が広がらないように、火除地（ひよけち）をつくった。他の都市などにはあまり見られないこの場所を何というか。",["公園","寄り場","広見（ひろみ）","小路"],2,"今も残っている広見は、地域の祭りや盆（ぼん）おどり、フリーマーケットなど、地域の人々のふれあいの場として活躍（かつやく）している。","寺社・建造物・まち","X",13],["加賀藩（はん）5代藩主前田綱紀（まえだつなのり）は有名な学者を日本中から金沢にまねいたり、貴重な書物を国中から集めたりしていたため、当時を代表する学者に「加賀は天下の書府（しょふ）」とほめたたえられた。この学者は誰（だれ）か。",["木下順庵（きのしたじゅんあん）","新井白石（あらいはくせき）","林羅山（はやしらざん）","稲生若水（いのうじゃくすい）"],1,"新井白石は江戸（えど）幕府6代将軍徳川家宣（いえのぶ）につかえた朱子学者（しゅしがくしゃ）である。","偉人・人物","X",13],["1838 年（天保9）、凶作（きょうさく）に苦しむ農民を救うため、村役人たちが年貢米（ねんぐまい）をまけてほしいと藩（はん）に願い出る事件が起きたが、村役人たちはとらえられ、家族ともども越中五箇山（えっちゅうごかやま）へ流刑（るけい）となった。1897 年（明治 30）、事件の真相（しんそう）を知り、犠牲（ぎせい）になった人々を天保義民（てんぽうぎみん）といってたたえたのは誰（だれ）か。",["板垣退助（いたがきたいすけ）","勝海舟（かつかいしゅう）","徳川慶喜（とくがわよしのぶ）","坂本龍馬（さかもとりょうま）"],1,"勝海舟は江戸時代の幕臣（ばくしん）であり、咸臨丸（かんりんまる）艦長（かんちょう）として初の太平洋横断に成功し、戊辰戦争（ぼしんせんそう）では西郷隆盛（さいごうたかもり）との会談によって江戸城の明けわたしを実現した。","偉人・人物","S",13],["1954 年（昭和 29）に金沢の中心を流れる犀川（さいがわ）河口の金石港と河北潟から流れる大野川河口の大野港が合併（がっぺい）して出来た港はどれか。",["河北港","昭和港","粟崎港","金沢港"],3,"藩末（ばくまつ）に、犀川河口の宮腰（みやのこし）が金石と改称された。現在も「金石街道」と呼ばれる金沢市の中心部へ一直線に延びる道は、金沢城と港の間を船荷がスムーズに運搬（うんぱん）できるように作られた。日本海側のメインポートとして大型船が入港できるように整備がされ、2020 年（令和2）に金沢港クルーズターミナルが開業した。","市政・最近の話題","X",13],["加賀藩（はん）初代藩主前田利家（まえだとしいえ）は、武勇に優れた槍（やり）の名手であっただけでなく、計算も得意であったといわれている。戦（いくさ）の兵糧米（ひょうろうまい）の計算にも使った、利家がいつも持ち歩いていたものとは何か。",["そろばん","一升（いっしょう）ます","おはじき","はかり"],0,"利家が朝鮮（ちょうせん）出兵の際、九州・名護屋（なごや：佐賀県）の陣中（じんちゅう）で使ったといわれる高徳公算盤（こうとくこうそろばん）は、現在日本に残っているそろばんで最も古いものである。","偉人・人物","S",13],["2021 年（令和3）金沢市において、IoT や AI など最先端（さいせんたん）分野をはじめ、金沢市がほこる工芸やものづくり、食やアートなどさまざまな文化、未来を担うこどもたちのワークショップが一つ屋根の下に集っている拠点（きょてん）がつくられた。旧野町小学校を活用して整備されたこの施設（しせつ）はどれか。",["金沢未来のまち創造館","谷口吉郎・吉生記念","金沢職人大学校","ＩＴビジネスプラザ武蔵"],0,"金沢建築館近年金沢市では学校の規模適正化を実施（じっし）し、いくつかの小学校の統廃合（とうはいごう）が行われている。旧野町小学校は「金沢未来のまち創造館」という官民連携（れんけい）型の価値創造拠点施設となった。","市政・最近の話題","S",13],["室町時代、人々は苦しく不安な生活を送っていたが、作物の取れ高が増えてくると「どのように生きるか」「死んだ後はどうなるのか」を考えるようになった。このような時代に北陸において「南無阿弥陀仏（なむあみだぶつ）」をとなえることで極楽浄土（ごくらくじょうど）に往生（おうじょう）できると布教した人物は誰（だれ）か。",["親鸞（しんらん）","存如（ぞんにょ）","蓮如（れんにょ）","如乗（にょじょう）"],2,"本願寺（浄土真宗（じょうどしんしゅう））の蓮如は親鸞の教えを分かりやすく人々に伝え、誰からも親しまれた。","歴史","X",13],["宮崎友禅斎（みやざきゆうぜんさい）は、京都から金沢に移り住み、金沢に友禅染を伝え「加賀友禅（かがゆうぜん）」を作り出した。「加賀友禅」の特徴（とくちょう）的な技法はどれか。",["色染め","虫染め","虫食い","色ぬき"],2,"「ぼかし」と「虫食い」の表現に味わいがあるとされている。","美術・工芸・芸能","S",13],["明治政府は、廃藩置県（はいはんちけん）後にも、県の範囲（はんい）や町や村をどのように治めるかなどの試行錯誤（しこうさくご）を重ね、1889 年（明治 22）、全国に 31 の市をつくり、石川県では金沢市がつくられた。金沢市の初代市長は誰（だれ）か。",["稲垣義方（いながきよしかた）","永井柳太郎（ながいりゅうたろう）","岡良一（おかりょういち）","中橋徳五郎（なかはしとくごろう）"],0,"稲垣義方は藩政（はんせい）時代には藩の海軍を率い、戊辰戦争（ぼしんせんそう）にも参加し、のちに金沢区長となった。","偉人・人物","S",13],["1900 年（明治 33）、日本初の羽二重（はぶたえ：なめらかでつやのあるうすい絹織物）を織る力織機（りきしょっき）が発明された。この力織機を発明した人物はだれか。",["津田駒次郎（つだこまじろう）","長谷川準也（はせがわじゅんや）","大野弁吉（おおのべんきち）","津田米次郎（つだよねじろう）"],3,"津田米次郎が完成させた力織機は 1902 年（明治 35）の第5回内国勧業大博覧会（ないこくかんぎょうだいはくらんかい）に出品され、多大な賞賛（しょうさん）をはくした。","偉人・人物","X",13],["第二次世界大戦中、石川県から愛知県豊川（とよかわ）にある海軍の工場に多くの少女が女子挺身隊（じょしていしんたい）として働きに出向いた。その工場が空襲（くうしゅう）を受け、犠牲（ぎせい）になった少女たちの霊（れい）をとむらうため、卯辰山（うたつやま）の山頂付近に建てられたのは何か。",["自由と正義の像","平和記念像","七稲地蔵（なないねじぞう）","殉難（じゅんなん）おとめの像"],3,"豊川の工場の空襲で犠牲となった石川県の女子挺身隊は52人である。殉難おとめの像の歌碑（かひ）には「これやこの少女ら生きてあればいまは人の妻子の母なるを・・・」とある。","歴史","S",13],["水の豊富な金沢は、市内には 55 本の用水が流れており、「用水のまち」としても有名である。金沢市の用水を守るための条例はどれか。",["用水保全条例","緑の都市宣言","こまちなみ保存条例","金沢市森づくり条例"],0,"金沢市内に流れる55の用水全てを合わせると約 150km になるといわれている。用水は農業灌漑（かんがい）、消火や融雪（ゆうせつ）のほか、城下町としての金沢の景観を引き立てるなど金沢市民の暮らしに欠かせない存在となっている。","市政・最近の話題","S",13],["北陸地方は世界的な豪雪地帯（ごうせつちたい）である。金沢では、気象庁が始まって以来の大雪が降ったことがあり、「三八豪雪」と言われている。それは何年のことか。",["1938 年","昭和 38 年","明治 38 年","1838 年"],1,"「三八豪雪」は昭和 38 年 1 月に発生した。","自然・産業","S",13],["加賀藩（かがはん）では、5代藩主（はんしゅ）前田綱紀（まえだつなのり）は、茶道を広めるため京都から千仙叟宗室（せんのせんそうそうしつ）を招いた。仙叟が始祖（しそ・はじめた人）といわれている茶道の流派はどれか。",["裏千家流","表千家流","武者小路流","宗和流"],0,"宗室は裏千家を名のり、表は宗左を、武者小路は宗守を名のる。宗和は金森宗和から始まる。","美術・工芸・芸能","S",13],["金沢の地域福祉（ふくし）活動の原点でもあり、生活相談や授産・託児（たくじ）の援助（えんじょ）など地域の福祉・社会教育の拠点（きょてん）として 1934 年（昭和 9）から建てられた施設（しせつ）はどれか。",["友好館","善隣館（ぜんりんかん）","交流館","福祉館"],1,"善隣館は、市内 19 カ所誕生し、全国にも例を見ないシステムとして発展した。","市政・最近の話題","X",13],["1488 年（長享（ちょうきょう）2）、一向宗農民門徒（いっこうしゅうのうみんもんと）の一揆（いっき）軍が、高尾城（たこうじょう）を攻撃（こうげき）して守護の富樫政親（とがしまさちか）をたおした。この一揆を何というか。",["高尾の一揆","天文法華（てんもんほっけ）の乱","長享の一揆","鳥越一揆"],2,"一向宗農民門徒の一揆軍は、鳥越弘願寺、吉藤専光寺、木越光徳寺（きごしこうとくじ）を指導者とし、洲崎慶覚を大将とした。長享の一揆で守護富樫正親がほろんだ加賀国は「百姓の持ちたる国」と言われるようになり、1世紀にわたる坊主（ぼうず）、土豪（どごう）、農民たちによる加賀共和国（かがきょうわこく）が成立した。","歴史","S",13],["明治になると金沢にも近代工業が起こった。長町に、群馬県富岡の工場をまねてつくられた国内で2番目の規模の工場の名前はどれか。",["金沢工場","金沢製綿所","金沢製糸場","金沢糸工場"],2,"長谷川準也（はせがわじゅんや）が発案し、津田吉之助（つだきちのすけ）が設計作成した。会社は不景気で成功しなかったが、金沢の近代工業が発展していくさきがけとなった。","歴史","X",13],["金沢城跡（じょうあと）の発掘（はっくつ）調査で見つかった土から発見された出土品により、金沢で縄文時代以前に人間が活動していたことが確認された。この旧石器時代の出土品として見つかったものは何か。",["土器","石器","銅剣（どうけん）","鏡（かがみ）"],1,"発掘調査ででた土を金沢城の整地に用いていたが、その中に使用した跡（あと）のある石器がふくまれていた。","寺社・建造物・まち","S",13],["金沢でのＳＤＧｓの推進に向けた具体的な行動について、ＳＤＧｓミーティングを通して、ＳＤＧｓカフェや市内のイベントへの出展、ホームページを通してたくさんのアイデアを集めた。このアイデアを総称して何というか。",["金沢アイデア","金沢ターゲット","金沢ＳＤＧｓ","金沢ミライシナリオ"],3,"持続可能な開発目標（ＳＤＧｓ）を達成するために、金沢で始まったプロジェクトを「IMAGINE KANAZAWA 2030」という。市民、地域、ＮＰＯ、企業、行政など様々な主体が集まり、今金沢が抱えている問題を一緒に考え、解決に向けて対話を重ねていく場を提供し、多様な主体がつながることで大きな力を生み出すことを促進（そくしん）している。","市政・最近の話題","S",13],["金沢市には、歴史ある旧町名や昔の地名が多く残っているが、旧町名や昔の地名が忘れ去られることがないように、その由来を刻んだ標柱を何というか。",["金沢まちしるべ","旧町名しるべ","歴史由来しるべ","歴史のまちしるべ"],3,"旧町名には、武士の住んでいた主馬町（しゅめまち）や玄蕃町（げんばまち）、職人の住んでいた鍛冶町（かじまち）や桶町（おけちょう）など、藩政時代の町の性格を表したものが数多くあった。","寺社・建造物・まち","S",13],["5代藩主（はんしゅ）前田綱紀（まえだつなのり）は、学問を好み、国中の貴重な書物を集めることに力を注ぎ、集めることのできないものは、そのまま写して集めた。このようにして集められ、大切に保存された文庫を何というか。",["前田文庫","金沢文庫","尊経閣（そんけいかく）文庫","加賀文庫"],2,"尊経閣文庫として名高く、写したものでは「東寺百合文書（とうじひゃくごうもんじょ）」が名高い。","歴史","S",13],["金沢を上空から見ると、犀川（さいがわ）と浅野川（あさのがわ）の間に小立野（こだつの）台地がある。小立野台地の先端（せんたん）に（　　）城跡（じょうあと）があり、金沢の中心となっている。（　　）の中に入るのはどれか。",["小立野","卯辰","高尾","金沢"],3,"藩政（はんせい）時代、前田氏の居城であった。明治以降、軍隊、大学が利用していた。現在は金沢城公園となっている。","寺社・建造物・まち","S",12],["金沢にはたくさんの方言がある。その中で「道がこおったようす」をあらわす方言はどれか。",["かんかんなまなま","きんきんなまなま","きんかんなまなま","こんこんぬまぬま"],2,"金柑（きんかん）の皮は新鮮（しんせん）であればあるほど表面がつるつるしていることに由来している。","金沢ことば","S",12],["金沢が生んだ文豪（ぶんごう）、「幼年（ようねん）時代」「性に眼覚める頃（ころ）」などの小説や「犀川（さいがわ）」という詩などを発表した人物は誰（だれ）か。",["徳田 秋声（とくだ しゅうせい）","泉 鏡花（いずみ きょうか）","夏目 漱石（なつめ そうせき）","室生 犀星（むろお さいせい）"],3,"室生犀星は仕事場の上司から俳句を教えてもらったことがきかっけで、文学書をよく読むようになった。","文学","X",12],["加賀藩（はん）2代藩主前田利長（まえだとしなが）や3代藩主前田利常（まえだとしつね）は金沢城を守るために、内堀（うちぼり）、外堀（そとぼり）を造らせ、堀の内側には土を高く盛り上げた土居（どい）を築かせた。これらは何と呼ばれているか。",["腰曲輪（こしぐるわ）","馬出（うまだし）","惣構（そうがまえ）","逆茂木（さかもぎ）"],2,"内堀は内惣構、外堀は外惣構と呼ばれ、惣構肝煎（そうがまえきもいり）や惣構橋番などの町役人によって管理された。","寺社・建造物・まち","X",12],["上田作之丞（うえださくのじょう）の私塾拠遊館（きょゆうかん）で実学（じつがく）を学んだ中下級武士たちは、長連弘（ちょうつらひろ）により多数登用され、加賀藩の財政の立て直しにつとめた。こうした武士たちは人々から何と呼ばれていたか。",["黒羽織党（くろばおりとう）","赤母衣衆（あかほろしゅう）","三光寺派（さんこうじは）","八家（はっか）"],0,"拠遊館では学んだ学問をもとに実際の政治や経済について議論が行われ、藩のことを真剣（しんけん）に考える優れた中下級武士が大勢集まった。彼らは会合の時にそろって黒羽織を着たため、人々から黒羽織党と呼ばれるようになった。","歴史","S",12],["水の豊富な金沢は、「用水のまち」としても有名である。市内には何本の用水が流れているか。",["30本","45本","55本","70本"],2,"55本の用水の総延長は150キロになる。","寺社・建造物・まち","S",12],["八田與一（はったよいち）は当時アジア最大といわれた烏山頭（うさんとう）ダムや長大な水路を完成させるなど、不毛の大地を豊かな平野に変えたことで知られている。八田與一が活躍（かつやく）した場所はどこか。",["朝鮮（ちょうせん）","中国","台湾（たいわん）","タイ"],2,"金沢市出身の八田與一は台湾にわたり、烏山頭ダムを完成させた。","偉人・人物","X",12],["金沢の気候は、梅雨（つゆ）の季節や台風の頃（ころ）、そして特に冬は降水量が多くなる。このような気候を何というか。",["北日本型気候","日本海側気候","西日本側気候","北日本海気候"],1,"日本海岸式気候ともいわれる。","自然・産業","X",12],["金沢市内の南部に豊かな自然にめぐまれた山がある。その山には加賀藩（かがはん）初代藩主（はんしゅ）前田利家（まえだとしいえ）とその正室(せいしつ・妻のこと)芳春院（ほうしゅんいん）、その他の歴代藩主や前田家一族の墓や、 金沢を代表する多くの著名人の墓があるが、その山を何というか。",["野田山（のだやま）","大乗寺山（だいじょうじやま）","卯辰山（うたつやま）","三子牛山（みつこうじやま）"],0,"墓地としては、天正年間に利家の兄の利久（としひさ）をほうむったのが始まりで、利家も遺言で墓を作った。","寺社・建造物・まち","X",12],["金沢の町は、町奉行（まちぶぎょう）が支配していた。武士には武士の役人がいた。町人には町年寄（まちどしより）・散算用聞（ちりさんようきき）・町肝煎（まちきもいり）など町人の役人が仕事をしていた場所はどれか。",["町役場","公役所","町会所","公会堂"],2,"町会所は町人の生活すべてにかかわっていた。","歴史","S",12],["加賀藩（はん）では、収入の少ない下級武士のくらしは決して楽ではなく、内職をして生計を立てる者が多くいた。このような下級武士の日常生活について学ぶことができる、長町にある旧清水家屋敷（やしき）を何というか。",["前田土佐守家資料館（まえだとさのかみけしりょうかん）","金沢文芸館（かなざわぶんげいかん）","金沢蓄音機館（かなざわちくおんきかん）","足軽資料館（あしがるしりょうかん）"],3,"屋敷の敷地は 50 坪（つぼ）ほどで、裏手の庭は観賞（かんしょう）用というよりも、野菜作りや果樹など自給自足のための場所になっていた。","寺社・建造物・まち","S",12],["1488 年（長享（ちょうきょう）2）、農民や僧（そう）たちが中心になって一向一揆（いっこういっき）をおこし、高尾(たこう)城を攻撃（こうげき）して守護富樫政親（とがしまさちか）を倒した。これ以降、加賀の国は何とよばれるようになったか。",["坊主（ぼうず）の持ちたる国","職人の持ちたる国","商人の持ちたる国","百姓（ひゃくしょう）の持ちたる国"],3,"一向一揆の後、守護は力を失い、一向宗の坊主・土豪（どごう）などが加賀国を治めるようになった。やがて、門徒（もんと）や一揆の中で仲間割れがおこると、本願寺が直接加賀を治めるようになった。","歴史","X",12],["金沢には、金沢をホームタウンとしたスポーツチームに「Honey Bee（ハニー・ビー）」という団体がある。スポーツ種目名はどれか。",["ハンドボール","バレーボール","バトミントン","バスケットボール"],0,"Honey Bee は北國銀行のハンドボールチームで、数々の大会で日本 1 位となっている。","市政・最近の話題","S",12],["金沢出身で、仏教を説明する本を出版したり講演したりして、仏教を外国に伝えた哲学者（てつがくしゃ）は誰（だれ）か。",["木村 栄（きむら ひさし）","高峰 譲吉（たかみね じょうきち）","鈴木 大拙（すずき だいせつ）","野口 遵（のぐち したがう）"],2,"2011 年(平成 23)その考えや足跡（そくせき）を国内外に発信し、理解を深め思索探求(しさくたんきゅう)の場として建物が建設された。記念館ではなく、「鈴木大拙館」としている。","偉人・人物","X",12],["加賀藩（はん）では、3 代藩主前田利常が、それまでの家来が管理していた農政を改め、藩が直接農村を管理する方法をとった。藩の農政の安定につながったの方法はどれか。",["改作法","農政法","改農法","農改法"],0,"改作法は加賀藩の形を大きく変えた。","歴史","S",12],["金沢市の市章は 1891 年（明治 24）に市議会で決められた。そのデザインは、ある花の形を線で描き、その中に金沢を意味する「金」の文字を書き入れたものである。ある花とは何の花か。",["桜","梅","松","桃"],1,"梅の形は前田家の梅鉢（うめばち）の紋章（もんしょう）からとったもので、消防のまといや下水道のふたにもアレンジされたものが使用されている。","市政・最近の話題","X",12],["金沢市は、スポーツで人と街を元気にすることを目指しているが、スポーツを行うだけでなく、「観る、応援（おうえん）する、語り合う」ことが日常生活にとけこみ、金沢の風土として受けつがれていくように、2018 年（平成 30）に金沢市が制定した条例は何か。",["金沢市体育施設（しせつ）条例","金沢市スポーツ広場条例","金沢市スポーツ基本（きほん）条例","金沢市スポーツ文化推進（すいしん）条例"],3,"2015 年（平成 27）にはシティフルマラソンである「金沢マラソン」が開催（かいさい）されるようになり、金沢の魅力発信（みりょくはっしん）や経済（けいざい）の活性化（かっせいか）、市民の健康増進（けんこうぞうしん）を目的としている。","市政・最近の話題","X",12],["北陸地方における最初の鉄道開業は、1882 年（明治 15）滋賀県の長浜（ながはま）市と福井県の敦賀（つるが）市の間である。金沢まで開業したのは何年か。",["1892 年（明治 25）","1895 年（明治 28）","1898 年（明治 31）","1900 年（明治 33）"],2,"小松から金沢まで開通したのが、1898 年（明治 31）4月1日であった。","歴史","S",12],["江戸時代の北陸地方における農業の書物「耕稼春秋」（こうかしゅんじゅう）には農家の月ごとにする仕事や作るべき作物、肥料や農具のことなどが書かれているが、この書物を書いたのは誰（だれ）か。",["宮崎 安貞（みやざき やすさだ）","土屋 又三郎（つちや またさぶろう）","後藤 太兵衛（ごとう たへえ）","枝 権兵衛（えだ ごんべえ）"],1,"1は『農業全書』の著者、3は長坂用水の開削（かいさく）に関係、4は七ケ用水の開削に関係する。土屋又三郎は、現在は金沢市になっている旧御供田（ごくでん）村の十村役（とむらやく）であった。","偉人・人物","S",12],["江戸時代、日本海から下関をまわり大坂に行く船は北前船（きたまえぶね）と呼ばれ、危険をともないながら莫大（ばくだい）な利益をあげた。これにより一代で巨万（きょまん）の富を築き、「海の百万石」としょうされた宮腰（みやのこし）の豪商（ごうしょう）は誰（だれ）か。",["茶屋 四郎次郎（ちゃや しろうじろう）","大野 弁吉（おおの べんきち）","銭屋 五兵衛（ぜにや ごへえ）","紀伊國屋 文左衛門（きのくにや ぶんざえもん）"],2,"宮腰は現在（げんざい）の金石である。銭屋五兵衛は全国に 34 か所の支店や出張所をもち、外国との密貿易も行っていたとされている。","偉人・人物","X",12],["金沢は伝統工芸が盛んである。そのうち金箔（きんぱく）は全国にその名がとどろいている。金沢の金箔の生産は全国で何位か。",["1位","2位","3位","4位"],0,"金箔をつくるには上質の和紙が必要で、清らかな水が豊富な金沢は、その和紙をつくる上でも良い条件がそろっていたとされている。","美術・工芸・芸能","S",12],["1874 年（明治 7）、「金沢製糸場（せいしじょう）」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月（くらつき）用水から水を引き、大きな水車を使って機械を動かしていた。この「金沢製糸場」をつくった人物は誰（だれ）か。",["稲垣 義方（いながき よしかた）","森下 八左衛門（もりした はちざえもん）","長谷川 準也（はせがわ じゅんや）","津田 米次郎（つだ よねじろう）"],2,"長谷川準也はこのほかに撚糸（ねんし）会社や銅器（どうき）会社などをおこし、金沢の近代工業が発展していくさきがけとなった。","偉人・人物","X",12],["1858 年（安政 5）、凶作（きょうさく）で米の値上がりに苦しむ人々が藩（はん）の米を出してくれるよう、卯辰山（うたつやま）から金沢城の殿様（とのさま）にさけんで救済をうったえた。この一揆（いっき）を何というか。",["世直し一揆（よなおしいっき）","徳政一揆（とくせいいっき）","百姓一揆","泣き一揆"],3,"泣き一揆の結果、藩からお救い米が出されたが、当時は直訴（じきそ）が禁止されていたため、主だった7人はとらえられ処刑（しょけい）された。","歴史","X",12],["金沢には、今に伝わる年中行事が多く残っているが、6月（旧5月）にある無病息災（むびょうそくさい）を願う行事はどれか。",["人形供養（にんぎょうくよう）","針供養","しょうぶ湯","地蔵盆（じぞうぼん）"],2,"菖蒲（しょうぶ）は古くからさわやかな香りが邪気（じゃき）をはらい心身を清めるとして、軒（のき）に飾ったり、枕（まくら）の下にしいてねたりと、無病息災を願うために使われた。","食・行事","S",12],["3代藩（はん）主前田利常（まえだとしつね）の時、板屋兵四郎（いたやへいしろう）に命じて辰巳（たつみ）用水を造らせた。その用水の取り入れ口は、犀川（さいがわ）上流のどこの村に作ったか。",["銚子（ちょうし）村","末村","上辰巳（かみたつみ）村","駒帰（こまがえり）村"],2,"犀川上流上辰巳村の東岩付近に取り入れ口を造り、岩をくりぬいてトンネルを掘り、用水を通した。","寺社・建造物・まち","S",12],["豊臣秀吉（とよとみひでよし）にキリシタンとして追放され、領地を没収（ぼっしゅう）されたが、加賀藩（はん）初代藩主前田利家（まえだとしいえ）にむかえられ、金沢で熱心な布教を行い、多くの信者を得たのは誰（だれ）か。",["高山 右近（たかやま うこん）","有馬 晴信（ありま はるのぶ）","大友 義鎮（おおとも よししげ）","大村 純忠（おおむら すみただ）"],0,"金沢には何百人ものキリシタンがいて、南蛮（なんばん）寺が建てられ、ナタル（クリスマス）も行われていた。高山右近は城づくりにもすぐれ、金沢城のお堀（ほり）や利長が住んだ高岡城を造るときなどに活躍（かつやく）した。","偉人・人物","X",12],["江戸時代末期、卯辰山（うたつやま）の開発が進み、「養生所（ようじょうしょ）」、「撫育所（ぶいくしょ）」、「神社」などが建てられた。また、織物・製糸・製陶（せいとう）・工芸などの工場も建てられ、ふもとは多くの人たちでにぎわった。こうした事業を行った加賀藩（はん）14 代藩主は誰（だれ）か。",["前田 慶寧（まえだ よしやす）","前田 重教（まえだ しげみち）","前田 吉徳（まえだ よしのり）","前田 斉泰（まえだ なりやす）"],0,"前田慶寧は福沢諭吉（ふくざわゆきち）の『西洋事情（せいようじじょう）』を読んで、ヨーロッパでは貧しい人々を救う制度や施設（しせつ）が整っていることを知り、加賀藩の人々が豊かに生活できるようにさまざまな事業を行った。","偉人・人物","X",12],["「緑」は都市の機能を高める効果がある。1974 年（昭和 49）、金沢市議会が議決した宣言はどれか。",["「緑の都市宣言」","「環境都市宣言」","「うるおい都市宣言」","「森林都市宣言」"],0,"「緑の都市宣言」の冒頭（ぼうとう）で、「緑は、すべての生命の根源であり、自然の健やかな脈拍（みゃくはく）そのものである」とのべている。","市政・最近の話題","S",12],["春、夏、秋、冬という季節の節目がはっきりしている金沢では、それぞれの季節に登場する和菓子（わがし）があり、生活の中にいろどりと美をそえている。うち、金沢のお正月に欠かせない、外の皮をむくと、中におみくじが入っている金沢独特の和菓子はどれか。",["金花糖（きんかとう）","五色生菓子（ごしきなまがし）","氷室（ひむろ）まんじゅう","辻（つじ）うら"],3,"中に入っているおみくじは食べられないので気をつけよう。","食・行事","S",12],["加賀藩（はん）5代藩主の前田綱紀（まえだつなのり）は、細工人（さいくにん）の技術向上と工芸技術を保存し記録するために、全国から二千点以上の工芸品を収集し、整理・分類した。日本工芸における各種標本の集大成とされるこの標本集を何というか。",["尊経閣文庫（そんけいかくぶんこ）","百工比照（ひゃくこうひしょう）","耕稼春秋（こうかしゅんじゅう）","百科全書（ひゃっかぜんしょ）"],1,"百工比照は江戸時代中頃（なかごろ）までの最高レベルの工芸品と一流の職人の技を伝える貴重なものである。","美術・工芸・芸能","X",12],["金沢港は 1954 年（昭和 29）に、大野港ともう一つの港が合併（がっぺい）してできた。もう一つの港はどれか。",["河北（かほく）港","昭和（しょうわ）港","粟崎（あわがさき）港","金石（かないわ）港"],3,"江戸（えど）時代、金石は宮腰（みやのこし）と呼ばれ、北前船が立ち寄る港町として大いに栄えた。","市政・最近の話題","S",12],["金沢の地名は芋堀藤五郎（いもほりとうごろう）が砂金を洗った金洗沢（かなあらいのさわ）から起こったと伝えられている。一説には、この芋堀藤五郎ではないかともいわれ、名君として知られた加賀介（かがのすけ）（介は長官の次の位の人）は誰（だれ）か。",["富樫 忠頼（とがし ただより）","前田 利家（まえだ としいえ）","藤原 利仁（ふじわらの としひと）","源 義仲（みなもとの よしなか）"],0,"富樫氏は代々、加賀介として富樫郷（とがしごう）を支配していた。忠頼は4代目にあたり、12 代目の泰家（やすいえ）は能の『安宅（あたか）』や歌舞伎（かぶき）の『勧進帳（かんじんちょう）』で知られる。富樫氏は 1221 年（承久（じょうきゅう）3）の承久の乱以降に勢力を拡大し、17 代目の高家（たかいえ）以降、守護として加賀国を治めた。","偉人・人物","S",12],["金沢市では、歴史ある旧町名や坂道などの由来をきざんだ標柱(ひょうちゅう)を市内 224 か所に建てた。その標柱を何というか。",["まちの歴史","歴史のしるべ","まちのしるべ","歴史のまちしるべ"],3,"1979 年(昭和 54)から 2019 年(令和元)までに 224 か所建てた。復活した旧町名の場合、旧の字がうめられいる。","寺社・建造物・まち","S",12],["金沢には、金沢市無形民俗（みんぞく）文化財に指定された伝統行事が今もたくさん残っている。斧（おの）や刀、弓を持った山伏（やまぶし）が各家をまわる金石町や大野町で行われている行事はどれか。",["はしご登り","加賀万歳（かがまんざい）","さかたおどり","悪魔払い（あくまばらい）"],3,"各家の悪魔払いをする時には、家の中に入らんばかりの勢いで悪魔を払うまねをするので、子供たちは泣きさけんで家の奥（おく）ににげこむ様子が見られる。","美術・工芸・芸能","X",12],["1869 年（明治 2）に加賀藩（はん）は版籍奉還（はんせきほうかん）によって金沢藩になった。その後、1871 年（明治 4）の廃藩置県（はいはんちけん）で金沢県となり、何度か県境が変わる中で、美川（みかわ）に県庁が移された時から石川県となったが、なぜ石川県と呼ばれるようになったか。",["初代県知事の名前が石川氏だったから","県庁のある美川が石川郡に所在したから","有名な<span class='fg fx'>石<span class='frt'>いし</span></span>の産地やきれいな川が豊富にあるから","金沢城前の石川門が有名だったから"],1,"明治の新政府に敵対していた藩や、新政府に従うかどうか態度をはっきりと示さなかった藩に対して山や川の名前、郡の名前を県名にあてる方針をとっていたため、加賀藩から金沢県となったあと、さらに県名を変える動きがあった。","歴史","S",12],["珠姫（たまひめ）は幕府 2 代将軍徳川秀忠（とくがわひでただ）の二女で、徳川、前田両家を結ぶため加賀藩3代藩主前田利常（まえだとしつね）にとついだが、24 歳の若さで亡くなった。珠姫の霊（れい）をまつるために利常がつくった寺を何というか。",["大乗寺（だいじょうじ）","天徳院（てんとくいん）","伏見寺（ふしみでら）","金沢御堂（かなざわみどう）"],1,"天徳院には珠姫の位牌（いはい）があり、珠姫ゆかりの品々や江戸時代の仏像が残されている。","寺社・建造物・まち","X",12],["明治時代の初期、国会開設をめざす自由民権運動が全国に広がると、金沢でも明治維新（いしん）に取り残された士族たちによって政治結社（せいじけっしゃ）がつくられた。最初につくられた政治結社を何というか。",["忠告社（ちゅうこくしゃ）","立志社（りっししゃ）","自助社（じじょしゃ）","愛国社（あいこくしゃ）"],0,"忠告社は 1875 年（明治8）に杉村寛正（すぎむらひろまさ）、陸義猶（くがよしなお）、長谷川準也（はせがわじゅんや）らを中心に、中下級士族たちによって設立された政治結社である。","歴史","S",12],["金沢市は、公共交通の補完(ほかん)を考えて、市民の気軽な移動手段としてバスを導入した。此花（このはな）・菊川（きくがわ）・材木（ざいもく）・長町（ながまち）の4ルートがあるバスはどれか。",["金沢循環（じゅんかん）バス","金沢まちバス","ふらっとバス","兼六園シャトルバス"],2,"金沢のせまい道路の中でも、路線バスの回らない地域を回っており、市民の足として利用価値が高い。","市政・最近の話題","X",12],["平安時代はじめの 823 年（弘仁 14）、加賀国が誕生した。それはどの国から分かれて誕生したのか。",["越中国（えっちゅうのくに）","越前国（えちぜんのくに）","越後国（えちごのくに）","能登国（のとのくに）"],1,"越前国から江沼郡（えぬまぐん）・加賀郡（かがぐん）をさいて加賀国が誕生した。","歴史","X",12],["金沢には、昔から伝わる年中行事が今も数多く残っている。新年の正月に関係が深いものはどれか。",["消防の「出初式」（でぞめしき）","「氷室」の饅頭（まんじゅう）","墓参りの「切籠（きりこ）」","「七五三」の宮参り"],0,"この出初式では、市内の消防団員が新年に出そろい、裸（はだか）放水とはしご登りを披露（ひろう）する。","食・行事","X",12],["藩政（はんせい）時代、金沢の町人の住む地域は、その役割や負担によって（　　）、地子町（じしまち）、寺社門前地（じしゃもんぜんち）などに格付けされ分かれていた。（　　）には、道路や橋の管理や修理の仕事をになっており、比較的（ひかくてき）生活に余裕（よゆう）のある町人が住んでいた。（　　）の中に入るのはどれか。",["中町","上町","片町","本町"],3,"金沢の多くは地子町で、藩主の土地を使わせてもらっていることから、土地の借り賃である地子銀（じしぎん）を納めなければならなかった。寺社門前地は、寺や神社の境内にできた町で、寺社奉行（じしゃぶぎょう）の支配となっていた。","歴史","S",12],["近年の発掘（はっくつ）調査の結果、縄文人は高度な技術をもち、おしゃれで感性豊かな自然人であったことが明らかになっている。日本ではじめての<span class='fg fx'>石<span class='frt'>いし</span></span>の指輪が出土した金沢の遺跡（いせき）はどこか。",["畝田（うねだ）遺跡","北塚（きたづか）遺跡","七ツ塚（ななつづか）遺跡","チカモリ遺跡"],1,"北塚遺跡は縄文時代中期の遺跡で、<span class='fg fx'>石<span class='frt'>いし</span></span>の指輪のほか、ヒスイでできたペンダントなども出土している。","歴史","X",12],["茶道普及（ふきゅう）のために京都から職人を招いて作らせた金沢の代表的な焼き物がある。ろくろを使わず手びねりによって作られた、独特の味わいのある飴色（あめいろ）が特色の焼き物を何というか。",["九谷焼（くたにやき）","大樋焼（おおひやき）","有田焼（ありたやき）","珠洲焼（すずやき）"],1,"京都から招かれた楽焼（らくやき）の陶工（とうこう）である長左衛門は、大樋村（現在の金沢市大樋町）に楽焼に適した土を見つけ、茶道のための茶碗（ちゃわん）をつくった。","美術・工芸・芸能","X",12],["加賀藩（はん）では、村方(農村)の村々に対して、村の収穫（しゅうかく）高とそれに見合う年貢（ねんぐ）などの割当(わりあて)を書いた書面をわたした。それには藩主の黒印がおされており、（　　）と呼ばれ、村の役人たちが大切に保管していた。（　　）の中に入るのはどれか。",["村書付","村年貢（ねんぐ）書","村大切書","村御印（ごいん）"],3,"村御印には藩主の黒印があるので、村一番の大切なものとして保管されていた。","歴史","S",12],["1689 年（元禄2）、松尾芭蕉（まつおばしょう）は「奥の細道」の旅の途中（とちゅう）、金沢に立ちった。その際、小杉一笑（こすぎいっしょう）の死をいたんでよんだ句はどれか。",["塚も動け わが泣く声は 秋の風","むざんやな 甲（かぶと）の下の きりぎりす","あかあかと 日は難面（つれなく）も 秋の風","山中や 菊（きく）はたおらじ 湯のにほひ"],0,"金沢では芭蕉から俳句の教えを受けようと名のある俳人たちが彼の来るのを待っていた。","文学","S",12],["金沢市民芸術村は、市民が自主的に企画（きかく）したコンサートや芸術の練習の場として開放されているが、もともとは何の施設（しせつ）があったか。",["食品工場","紡績（ぼうせき）工場","バス整備場","中学校"],1,"リノベーションされた建物は、通産省（現：経済産業省）のグッドデザイン大賞最優秀（ゆうしゅう）賞、金沢都市美文化賞などの数々の受賞歴がある。","市政・最近の話題","S",12],["江戸（えど）時代、金沢の町を治めるために、加賀藩（はん）は町人は町人らしく身分をわきまえて行動することを求めた。火の用心やキリシタン禁制など町人が日常生活において守らなければならないことがらが書かれた法令はどれか。",["町取締書","町方二日読","町人心得書","町読聞かせ書"],1,"町方二日読は町人の生活すべてにかかわっていた。","歴史","S",12],["金沢には芋掘藤五郎（いもほりとうごろう）の伝説が残っている。この伝説で藤五郎が芋を洗ったとされている場所で、兼六園にある泉を何というか。",["蓮池（はすいけ）","霞が池（かすみがいけ）","瓢池（ひさごいけ）","金城霊沢（きんじょうれいたく）"],3,"金城霊沢は金洗沢（かなあらいのさわ）とも呼ばれ、「金沢」の地名はここから伝わったと言われている。","寺社・建造物・まち","S",11],["金沢には様々なボランティア団体がある。そのうち「まいどさん」はどのようなボランティアを行う団体か。",["まちをきれいにする清掃（せいそう）ボランティア","まちの案内をする観光ボランティア","まちを元気にする挨拶（あいさつ）ボランティア","金沢名物を販売（はんばい）する行商ボランティア"],1,"観光ボランティアは、まいどさんの他にも、外国語による観光案内や、兼六園や金沢城を専門に案内するガイドがいる。","市政・最近の話題","S",11],["金沢には「兼六園（けんろくえん）」がある。兼六とは同時に成り立つことの困難な六つの優れた特徴（とくちょう）をもつことである。その六つとは「〔一〕宏大（こうだい）を務るは〔二〕幽邃（ゆうすい）少なし 〔三〕人力勝るは〔四〕蒼古（そうこ）少なし 〔五〕□多きは〔六〕□難し」で、これを兼（か）ね備えているといわれている。〔五〕□と〔六〕□の組合せで正しいものはどれか。",["〔五〕海辺と〔六〕山並","〔五〕築山と〔六〕池泉","〔五〕低地と〔六〕高台","〔五〕水泉と〔六〕眺望（ちょうぼう）"],3,"加賀藩（はん）12 代藩主前田斉広（まえだなりなが）の時代に「兼六園」という名がつけられた。1874 年（明治7）に兼六園は一般開放され、金沢市民のいこいの場となった。","寺社・建造物・まち","S",11],["金沢の町中を南東方向から北西方向に犀川（さいがわ）と浅野川（あさのがわ）の2つの川が流れている。犀川の南には寺町台地が、浅野川の北には卯辰山（うたつやま）山地がある。2つの川の間の先端部（せんたんぶ）を金沢城址（じょうし）とする台地の名前はどれか。",["富樫（とがし）台地","小立野（こだつの）台地","長坂丘陵（きゅうりょう）","戸室（とむろ）山地"],1,"金沢市の地形は、西部の海岸に向かって丘陵地（きゅうりょうち）から平野へと変化し、次第になだらかになっている。","寺社・建造物・まち","X",11],["1689 年（元禄（げんろく）2）、ある有名な俳人が金沢の俳人たちを訪ねて来た。しかし、残念ながら金沢の俳人の小杉一笑（こすぎいっしょう）は前の年に亡くなっていたので「塚（つか）も動け わが泣く声は 秋の風」の句をよんで彼の死を悲しんだ。この句をよんだ有名な俳人は誰（だれ）か。",["秋の坊（ぼう）","立花北枝（たちばなほくし）","松尾芭蕉（まつおばしょう）","与謝蕪村（よさぶそん）"],2,"芭蕉の句碑（くひ）は、兼六園や犀川（さいがわ）大橋左岸、金石の本龍寺（ほんりゅうじ）など金沢市内にも多く見られる。","文学","X",11],["これまでのまちづくりの基本を受けつぎながら、金沢の資産を活用して、国内外から人・モノ・情報の集積を図り、その交流を通じて新たな価値を創造し、持続的に発展を続けるまちを実現するために、金沢市が都市づくりの指針として2013 年（平成 25）に作成したものは次のうちどれか。",["世界の「交流拠点（きょてん）都市金沢」をめざして","世界の「持続可能な都市金沢」をめざして","世界の「文化的都市金沢」をめざして","世界の「歴史的都市金沢」をめざして"],0,"これを実現するために、5つの「重点戦略計画」を定めている。（「技術力に裏打ちされた新たな産業の創出」、「まちの品格を高める学術文化の醸成（じょうせい）」、「観光を軸（じく）とした交流の活発化」、「新幹線時代に対応した交通基盤（きばん）の整備」、あらゆる世代に対応した新たなコミュニティの形成」）","市政・最近の話題","S",11],["江戸（えど）時代、年中行事として旧暦（きゅうれき）の6月1日に加賀藩（はん）から徳川将軍へ献上（けんじょう）された物にちなんで、金沢の町中で食べられるものはどれか。",["温泉饅頭（まんじゅう）","氷室（ひむろ）饅頭","大福饅頭","味噌（みそ）饅頭"],1,"加賀藩から徳川将軍へ冬の間に保存しておいた氷を献上したが、夏の氷は貴重品で、庶民（しょみん）が食することは大変だった。そのため、氷の代わりに麦で作った「氷室饅頭」を食べて無病息災を願う習慣だけが現在でも残っている。","食・行事","X",11],["金沢の町は日本海側気候の影響（えいきょう）で、雨の多い町といわれる。まちなかでよく「□忘れても傘（かさ）忘れるな」といわれることがある。□の中に入る言葉はどれか。",["鞄（かばん）","長靴（ながぐつ）","弁当（べんとう）","帽子（ぼうし）"],2,"この言葉は、年間を通して雨の日が多いということだけではなく、1 日のうちに晴れ、雨、曇り、ときには雷と天気が変わりやすいことも意味している。","金沢ことば","S",11],["加賀藩（はん）初代藩主前田利家（まえだとしいえ）が越前（えちぜん）を治めていた頃（ころ）、領民がお祝いにおどっていたおどりが金沢に移り、能楽の影響（えいきょう）を受け舞（まい）や語りに品格があるものとして定着し、金沢市民の伝統芸能活動となったのが□である。□に入るものは次のどれか。",["寺中神事能","奴（やっこ）行列","ジョンカラ節","加賀万歳（まんざい）"],3,"「加賀万歳」は、能楽師（のうがくし）の大石藤五郎（おおいしとうごろう）が定着させたため、能楽の影響（えいきょう）を受け、舞（まい）や語りはユーモアのある中にも品格（ひんかく）があり、金沢市無形民俗（みんぞく）文化財に指定されている。","美術・工芸・芸能","X",11],["1878 年（明治 11）、東京麹町区紀尾井町（こうじまちくきおいちょう）の路上で、馬車で皇居へ向かう途中（とちゅう）の政府高官・大久保利通（おおくぼとしみち）が暗殺されるという事件が起きた。この事件を起こした中心となる旧加賀藩士（はんし）は誰（だれ）か。",["金岩虎吉（かないわとらきち）","杉田定一（すぎたていいち）","島田一良（しまだいちろう）","遠藤秀景（えんどうひでかげ）"],2,"島田一良は、泉寺町（いずみでらまち）の三光寺（さんこうじ）に集まり、「三光寺派」となり、政治を変えるためには言論ではなく、武力も必要だと考えた。","偉人・人物","S",11],["金沢港は 1954 年（昭和 29）に、大野港ともう一つの港が合併（がっぺい）してできた。もう一つの港はどれか。",["金石（かないわ）港","粟崎（あわがさき）港","浅野川（あさのがわ）港","専光寺（せんこうじ）港"],0,"江戸（えど）時代、金石は宮腰（みやのこし）と呼ばれ、北前船が立ち寄る港町としておおいに栄えた。","市政・最近の話題","S",11],["第二次世界大戦が終わってから2年後の、1947 年（昭和 22）、金沢である全国的な大会が開催（かいさい）された。この大会の開会式のセレモニーでは、市内の小学生による「若い力」が初めて披露（ひろう）されたが、この大会は何か。",["緑の国民大会","海の国民大会","国民体育大会","山の国民大会"],2,"国民に希望をあたえることと体育を純粋（じゅんすい）なスポーツにすることを目標に、第1回大会は京都府で開かれ、次の第2回大会が「初の地方大会」として石川県で開催された。","歴史","X",11],["大正時代から昭和初期にかけて金沢の市街地は「モダン都市」の色合いがこくなり、石造りやレンガ造りの建物が建てられた。金沢のモダンな文化の象徴（しょうちょう）となった香林坊（こうりんぼう）は当時、何と呼ばれたか。",["ＫＯＵＲＩＮ（コウリン）","ＢＯＵ（ボウ）","ＫＯＵＢＯＵ（コウボウ）","ＲＩＮＢＯＵ（リンボウ）"],3,"香林坊では、カフェ文化が花開き、最盛期（さいせいき）には80軒（けん）ともいわれる数のカフェが市内にオープンし、官庁やビジネス街のサラリーマンたちを引きつけた。","歴史","S",11],["金沢には、1873 年（明治6）に軍隊が創設され、2年後に□とよばれた部隊になった。1896 年（明治 29）には第九師団配下となり、日露（にちろ）戦争にも参加した。□に入る名前はどれか。",["第五連隊","第七連隊","第十連隊","第十五連隊"],1,"第九師団の時、金沢には1万人以上の兵士やその家族が住むこととなり、その数は当時の市の人口の 10 分の1にあたる。このことから、金沢は「軍都」と呼ばれていた。","歴史","S",11],["金沢には、優れた陶器（とうき）がある。青木木米（あおきもくべい）が再興した九谷焼と裏千家の千仙叟（せんのせんそう）が京都から一緒（いっしょ）に連れてきた陶器の焼物師である陶工（とうこう）の長左衛門（ちょうざえもん）が焼いた□がある。□に入るものはどれか。",["大樋焼（おおひやき）","春日焼（かすがやき）","京焼（きょうやき）","越前焼（えちぜんやき）"],0,"大樋焼は、ろくろを使わず手びねりによって 1 つ 1 つ手でつくられる。","美術・工芸・芸能","X",11],["1871 年（明治 4）、横山町（よこやまちょう）で生まれ、25 歳（さい）の時に東京へ出て、尾崎紅葉（おざきこうよう）の門下生になり、「あらくれ」「縮図（しゅくず）」などの作品を発表した、2021 年（令和 3）に生誕 150 年をむかえる金沢が生んだ三文豪（ぶんごう）の1人は誰（だれ）か。",["泉鏡花（いずみきょうか）","室生犀星（むろおさいせい）","竹久夢二（たけひさゆめじ）","徳田秋聲（とくだしゅうせい）"],3,"浅野川（あさのがわ）にかかる梅ノ橋（うめのはし）のたもとにある徳田秋聲（とくだしゅうせい）記念館は、黒瓦（くろがわら）屋根の採用、格子を取り入れた外観、土塀（どべい）など、周辺の環境（かんきょう）に調和し、金沢の街並みに似合う建物で、多くの遺品・直筆原稿（げんこう）・筆跡（ひっせき）・初版本などを収蔵している。","文学","S",11],["金沢には、金沢をホームタウンとしたスポーツ団体があるが、ドイツ語にちなむ言葉と金沢の方言にも通ずるサッカーのチーム名はどれか。",["金沢学院クラブ","ツエーゲン金沢","石川ミリオンスターズ","金沢武士団（サムライズ）"],1,"ドイツ語で「2」を意味する”Zwei（ツヴァイ）”と「進む」を意味する”Gehen（ゲーン）”から「チームとサポーターがともに進んでいく」という意味。また、金沢弁で「強いんだ！（つぇーげん！）」の意味も持つ。","市政・最近の話題","S",11],["金沢市では、未来を担う子どもの健やかな育ちと子育て家庭を支える施策（しさく）を積極的に展開し、市民一人ひとりが未来の金沢を創る子どもたちのために役割を持ち、子どもを安心して産み育てられる環境（かんきょう）づくりの推進のために 2020 年（令和2）に「かなざわ子育て夢プラン 2020」をつくった。このプランの基本理念「みんなで□支え合う　子育ての喜びを分かち合う　まち金沢」の□に入るのは何か。",["つながり","まとまり","くらし","創造し"],0,"子どもを持ちたい希望がかえられ、誰（だれ）もが子育ての喜びを共有できる社会を目指そうとつくられたプランである。","市政・最近の話題","S",11],["江戸（えど）時代中期に、天候の異常で加賀藩内（はんない）にたくさんの生活に困窮（こんきゅう）した住民が出た時、金沢の笠舞（かさまい）に「お救い小屋」を設けて、食糧（しょくりょう）や衣料をあたえただけでなく、自立して生活できるよう、職業訓練のようなことや新田を開いて移住させるなどの政策をとった。この政策の指導をしたのは加賀藩何代藩主の誰（だれ）か。",["2代藩主前田利長（まえだとしなが）","3代藩主前田利常（まえだとしつね）","5代藩主前田綱紀（まえだつなのり）","6代藩主前田吉徳（まえだよしのり）"],2,"「お救い小屋」は、幕末まで存続した。特に、1830 年（天保（てんぽう）元）からの数年間、加賀藩でも大変な飢饉（ききん）におそわれ、この時「お救い小屋」には 4000 人もの人々が収容された。","歴史","S",11],["金沢市では、スポーツを盛んにすることで、まちの活力を高めようとしている。2019 年（平成 31）には、雨の日が多い金沢でもいろいろな運動ができ、子どもの運動機能の発達をサポートする屋内交流広場がオープンしたが、この屋内交流広場の愛称（あいしょう）は何か。",["はれるんパーク","あめるんパーク","ふせぐんパーク","うるるんパーク"],1,"金沢プールに隣接（りんせつ）した交流広場で、「のびのび広場」や「親子アスレチックゾーン」などの総合施設（しせつ）である。","市政・最近の話題","S",11],["1584 年（天正 12）に起こった末森（すえもり）の戦いは、加賀藩（はん）初代藩主前田利家（まえだとしいえ）と越中（えっちゅう）の□との戦いである。□に入るのは誰（だれ）か。",["柴田勝家（しばたかついえ）","徳川家康（とくがわいえやす）","佐々成政（さっさなりまさ）","豊臣秀吉（とよとみひでよし）"],2,"この末森の戦いは、秀吉の天下統一を進めるうえで大きな役割を果たした。利家にとっても加賀、能登、越中を治めるきっかけになった。","歴史","S",11],["江戸（えど）時代、金沢の町の真ん中に位置する金沢城は、加賀藩主（はんしゅ）が住み、藩の仕事をする武士が勤めていた。明治になると軍隊が入った。第二次世界大戦後に軍隊にかわり、ある施設（しせつ）が整備されたがその施設はどれか。",["観光会館","レジャーランド","展望台","大学"],3,"1949 年(昭和 24)、新制大学として金沢大学が誕生し、法文・教育・理の3学部は金沢城内にキャンパスがあった。","歴史","S",11],["金沢市は、清流や緑豊かな自然、歴史あるまちなみを守りつつ、未来の子どもたちに美しく健全なまち金沢を残そうと、1998 年（平成 10）に「環境（かんきょう）都市宣言」を議決した。さらに、2016 年（平成 28）には、「文化を育み、心をうるおす豊かな自然を明日に」を基本理念として、水と緑に育まれたすべての生命が光かがやくまちをめざして「金沢版□戦略」を定めた。□に入る言葉はどれか。",["持続社会","環境基本","森の都建設","生物多様性"],3,"「金沢版生物多様性戦略」の基本目標として「自然や生きものを大切にした環境づくり」「生物多様性を未来に継承（けいしょう）していくためのひとづくり」をかかげている。","市政・最近の話題","S",11],["2020 年（令和 2）12 月、「伝統建築工匠（こうしょう）の技」が国連教育科学文化機関［UNESCO（ユネスコ）］の無形文化遺産に登録されることが決定した。そのなかには、金沢の伝統工芸もふくまれているがどれか。",["加賀友禅（かがゆうぜん）","金沢仏壇（かなざわぶつだん）","縁付金箔（えんつけきんぱく）","金沢和傘（かなざわわがさ）"],2,"縁付(えんつけ)は、柿渋(かきしぶ)などを染みこませた和紙とうすく延ばした金を交互（こうご）にはさみ、くり返し打ち延ばす製法で、完成した金箔(きんぱく)をうすい和紙にのせたとき、紙が箔（はく）を縁（ふち）取るように見えることから「縁付(えんつけ)」と呼ばれている。","美術・工芸・芸能","S",11],["金沢市では、「金沢市地域□計画」に基づき、近隣（きんりん）の人々と心を通わせ、助け合えるまちの実現のため、人々が集う地域サロンの開催（かいさい）や世代間交流などを行ってきた。□に入るものはどれか。",["健康","介護（かいご）","保護","福祉（ふくし）"],3,"近年では、各地域で高齢（こうれい）者の見守りや声かけ、除雪などのボランティアの協力が行われている。","市政・最近の話題","S",11],["江戸（えど）時代後半に、京都から金沢に移り住んで染め物の技法を伝え「加賀友禅（かがゆうぜん）」を作り出したのは誰（だれ）か。",["五十嵐道甫（いがらしどうほ）","清水九兵衛（しみずくへい）","宮崎友禅斎（みやざきゆうぜんさい）","後藤程乗（ごとうていじょう）"],2,"宮崎友禅斎は、34 歳（さい）頃（ごろ）から京都で新しい模様染めを発表し、友禅染で知られるようになった。","偉人・人物","X",11],["1974 年（昭和 49）、金沢市議会で「緑の都市宣言」が議決された。「･･･（略）人類の生存と繁栄（はんえい）のために、失われゆく緑を回復し、保全し、発展させ、かけがえのない自然を守り続けたいと願う。この願いをこめて私たちすべての市民は、うるわしい自然を今に伝えほこり高き\"□の都（みやこ）金沢\"を永遠の緑のまちにすることを宣言する。」という内容であったが、□に入るのは何か。",["水","草","森","花"],2,"緑化推進市民運動の母体として「緑を育て金沢を美しくする会」が中心となり、「緑あふれる金沢」写真コンテストや花いっぱい運動などが行われている。","市政・最近の話題","S",11],["金沢の町は能や狂言（きょうげん）などの芸能が盛んな町といわれている。「安宅（あたか）」という謡曲（ようきょく）の中で、弁慶（べんけい）が舞（まい）をまった時の歌の文句が付いた町名があるがどれか。",["鳴和（なるわ）","富樫（とがし）","卯辰（うたつ）","安江（やすえ）"],0,"弁慶が舞を舞ったとされる場所は、金沢北郊（ほっこう）の「鹿島（かしま）神社」といわれ、境内には「鳴和の滝（たき）」という小さな滝があり、弁慶の足跡（あしあと）といわれる大きな穴も残っている。","寺社・建造物・まち","S",11],["加賀藩（はん）14 代藩主前田慶寧（まえだよしやす）は、加賀藩の人々が豊かに生活できるように、「養生所（ようじょうしょ）」、「撫育所（ぶいくしょ）」、「神社」などを建てたが、どこの山を開発して建てたか。",["卯辰山（うたつやま）","医王山（いおうぜん）","戸室山（とむろやま）","キゴ山"],0,"加賀藩 14 代藩主前田慶寧は、福沢諭吉（ふくざわゆきち）の「西洋事情」を読み、ヨーロッパでは貧しい人々を救う制度や病院施設（しせつ）が整っていることを知り、加賀藩でも建設を進めた。","歴史","X",11],["1925 年（大正 14）、平沢嘉太郎（ひらさわかたろう）が浅野川電鉄と協力し、巨額（きょがく）の資本を投じて建設した一大レジャー施設（しせつ）を何というか。",["玉泉院丸庭園（ぎょくせんいんまるていえん）","宝塚遊園（たからづかゆうえん）","粟崎遊園（あわがさきゆうえん）","兼六園（けんろくえん）"],2,"粟崎遊園は劇場・料亭（りょうてい）・レストラン・動物園・大浴場・野球場などを備えた施設で、宝塚をまねた「粟崎少女歌劇（かげき）」も組織された。","寺社・建造物・まち","X",11],["金沢は古くから城下町として栄え、人々は伝統的な生活文化を営んできた。そのため、まちを歩いていると「歴史を感じさせるちょっとしたいいまちなみ」が見られる場所も多い。この「歴史を感じさせるちょっとしたいいまちなみ」守るために、金沢市では 1994 年（平成6）に条例を制定した。何という条例か。",["駐車（ちゅうしゃ）場条例","みちしるべ条例","金沢住宅地条例","こまちなみ保存条例"],3,"「こまちなみ保存条例」とは、歴史的な建物が残る小さなまちなみを「こまちなみ」と呼び、その景観や雰囲気（ふんいき）を大切にしていくための条例である。","市政・最近の話題","X",11],["加賀藩（はん）で貨幣（かへい）ができたのは加賀藩初代藩主前田利家（まえだとしいえ）の頃（ころ）で豊臣秀吉（とよとみひでよし）にならって多くの金・銀貨をつくらせたのがはじまりとされているが、貨幣に対して紙幣を発行した加賀藩 10 代藩主は誰（だれ）か。",["前田光高（まえだみつたか）","前田重教（まえだしげみち）","前田利次（まえだとしつぐ）","前田宗辰（まえだむねとき）"],1,"1755 年（宝暦（ほうれき）5）に加賀藩の中だけで通用する紙のお金「藩札（銀札）」を発行した。しかし、人々が紙のお金を信用しなかったために経済は混乱し、物価はどんどん値上がりした。","歴史","S",11],["今から 300 年前に、加賀藩（はん）は金沢の町中に分かれていた市場を1カ所に集め「金沢の台所」として近江町（おうみちょう）市場が開設された。その場所は次のどこか。",["片町（かたまち）","香林坊（こうりんぼう）","武蔵ヶ辻（むさしがつじ）","橋場町（はしばちょう）"],2,"近江町市場は 1721 年（享保 6）に市場の原型ができたと伝えられている。その後、2009 年（平成 21）再開発事業により生まれ変わり、「近江町いちば館」が開業し、2020 年（令和2）には「近江町ふれあい館」も新たに開業した。2021年（令和3）、近江町市場では 300 周年イベントが行われている。","寺社・建造物・まち","S",11],["2020 年（令和 2）10 月、日本海側初の国立美術館として、国立工芸館が開館した。この国立工芸館の名誉（めいよ）館長に就任したのは誰（だれ）か。",["三浦知良（みうらかずよし）","中田英寿（なかたひでとし）","本田圭佑（ほんだけいすけ）","中山雅史（なかやままさし）"],1,"元サッカー日本代表の中田英寿氏は、現役引退後、日本全国をめぐり、数多くの工芸作家や工房（こうぼう）などを訪問して交流を深めるなど、日本の伝統文化や工芸の発展に精力的に取り組んできた。","市政・最近の話題","S",11],["第二次世界大戦中、工場などに働きに出て、空襲（くうしゅう）で犠牲（ぎせい）になった少女たちをとむらうため、卯辰山（うたつやま）の山頂付近に建立されたのは何か。",["殉難（じゅんなん）おとめの像","天保義民（てんぽうぎみん）の碑（ひ）","七稲地蔵（なないねじぞう）","百工比照（ひゃくこうひしょう）"],0,"金沢から愛知県の豊川（とよかわ）にある海軍の工場に出向き、働いた少女の霊（れい）をとむらうために建てられた。この工場は空襲を受け、460 人にのぼる少女が犠牲となった。","歴史","S",11],["金沢市では、高齢（こうれい）者のために「長寿（ちょうじゅ）安心プラン」を定めているが、すべての人が平等に普通（ふつう）の生活がおくれるまちをめざし、1998 年（平成 10）に策定したプランを何というか。",["バリアフリープラン金沢","ユニバーサルデザインプラン金沢","ノーマライゼーションプラン金沢","ポジティブアクションプラン金沢"],2,"「ノーマライゼーション」とは、人権そのものであり、例えば、障がいのある人たちなど社会的支援（しえん）を必要としている人々をいわゆるノーマルな人にすることを目的としているのではなく、その障害を共に受容することであり、彼（かれ）らにノーマルな生活条件を提供することというものである。「ノーマライゼーションプラン金沢」は、社会環境（かんきょう）の変化に合わせて、改訂（かいてい）を重ね、2021 年（令和3）にも改訂された。","市政・最近の話題","S",11],["江戸（えど）時代、金沢城では水が行きわたらず、水不足になることがあった。そこで金沢城に水を引くため、加賀藩（はん）3代藩主の前田利常（まえだとしつね）が□に造らせた辰巳用水（たつみようすい）が現存している。□には誰が入るか。",["奥村永富（おくむらながとみ）","板屋兵四郎（いたやへいしろう）","大野弁吉（おおのべんきち）","稲生若水（いのうじゃくすい）"],1,"辰巳用水は、兼六園から金沢城内に水を引くため、逆サイフォンという原理を利用した。金沢の町には辰巳用水をはじめ鞍月（くらつき）用水、長坂用水などの55 本の用水が流れ、用水の長さを全部合わせると約 150 ㎞になるといわれている。用水は、農業灌漑（かんがい）、消火や融雪（ゆうせつ）のほかに城下町の景観を引き立てる働きをしており、金沢市民のくらしと深い関係がある。","偉人・人物","X",11],["1289 年（正応（しょうおう）2）、曹洞宗永平寺（そうとうしゅうえいへいじ）の名僧（めいそう）である徹通義介（てっつうぎかい）が、加賀国を治めていた富樫家尚（とがしいえなお）にたのまれて開いた寺はどれか。",["東大寺（とうだいじ）","総持寺（そうじじ）","薬師寺（やくしじ）","大乘寺（だいじょうじ）"],3,"大乘寺は、現在の野々市市に創建した。","寺社・建造物・まち","S",11],["平安時代の終わり頃（ごろ）から鎌倉時代の初めにかけて新しい仏教の流れが広まった。中でも阿弥陀如来（あみだにょらい）を信仰（しんこう）する宗派の勢いは北陸地方で強いものがあり、加賀地方では、時の守護職ともたたかい「一向一揆（いっこういっき）」ともいわれた。その主導的働きをしたのはどの宗派か。",["浄土宗（じょうどしゅう）","浄土真宗（じょうどしんしゅう）","曹洞宗（そうとうしゅう）","法華宗（ほっけしゅう）"],1,"「加賀一向一揆」は、1488 年（長享（ちょうきょう）2）、加賀国で勃発（ぼっぱつ）した一向一揆中最大のもの。20 万の一向宗（浄土真宗）徒が守護の富樫政親（とがしまさちか）をほろぼし、以後 100 年近く同国を統治した。","歴史","S",11],["交通網（もう）の整備を通して地域の発展と活性化が進められているが、金沢外環状（かんじょう）道路（山側環状）と接続し 2004 年（平成 16）につくられた北陸自動車道の IC（インターチェンジ）を何というか。",["金沢西 IC","金沢東 IC","金沢森本 IC","金沢港 IC"],2,"2012 年（平成 24）4月には白山 IC が新設され、外環状道路（海側環状）にも接続された。","市政・最近の話題","S",11],["1870 年（明治3）、金沢藩（はん）では6か所の小学所（しょうがくしょ）を開いて、7・8歳（さい）から 14・15 歳の子どもに漢字・習字・算術などを教えた。1871 年（明治4）にはさらに5か所の小学所を開いたが、その時の生徒数は何人をこえていたか。",["2000 人","3000 人","4000 人","5000 人"],0,"小学所は、1872 年（明治5）には「小学校」とされ、石川県内に 945 校をつくる計画であった。しかし、国民の多くが反対し、就学率（しゅうがくりつ）は高くなかった。","歴史","S",11],["金沢では、婚姻（こんいん）などのお祝いの時、蒸籠（せいろ）に入れた五色生菓子（ごしきなまがし）をふるまう。この五色とは何を表したものか。",["色の五彩（九谷（くたに）五彩）：赤・黄・緑・紺青・紫","自然の状況（じょうきょう）：日・月・山・海・里","味の五味：甘・酸・鹽（しお・塩の旧字）・苦・辛（しん）","陰陽（いんよう）五行：木・火・土・金・水"],1,"五色生菓子は、1601 年（慶長（けいちょう）6）、2代将軍徳川秀忠（とくがわひでただ）の娘（むすめ）である珠姫（たまひめ）（のちの天徳院（てんとくいん））が加賀藩（はん）3代藩主前田利常（まえだとしつね）に輿（こし）入れしたときに献上（けんじょう）したとされている。","食・行事","X",11],["江戸（えど）時代、金沢の町を治めるために、「町方二日読（まちかたふつかよみ）」と呼ばれる法令を出した。この法令のところどころに見られる言葉は次のどれか。",["泥棒の用心（どろぼうのようじん）","雷の用心（かみなりのようじん）","雪の用心（ゆきのようじん）","火の用心（ひのようじん）"],3,"加賀藩（はん）は「町方二日読」を出すことで、町人は町人らしく身分をわきまえて行動することを求めた。町人の日常生活において守らなくてはいけないことが書かれていた。","歴史","S",11],["金沢で SDGs（持続可能な開発目標）を効果的に進めるにあたり、「金沢の風土、歴史、文化をふまえること」、「経済、社会、環境（かんきょう）の3つの側面を包括的（ほうかつてき）にとらえること」という視点から5つの方向性を導きだした。この取り組みの目標とする年はどれか。",["2030 年","2040 年","2050 年","2060 年"],0,"SDGs とは、2015 年（平成 27）9 月、国連サミットで採択（さいたく）された 2030年までの国際目標で、持続可能な世界を実現するための 17 のゴール（目標）と169 のターゲット（具体目標）から構成されている。","市政・最近の話題","S",11],["金沢駅兼六園口（東口）は、雨や雪の多い金沢で「駅を降りた人に傘を差し出す、（　　）の心」を表現した（　　）ドームができたことで、雨や雪に左右されない明るい空間になった。（　　）に入る言葉はどれか。",["もてなし","金沢","思いやり","雪国"],0,"","寺社・建造物・まち","S",0],["かつて金沢では花嫁が嫁入りのときに（　　）を持参し、花嫁の家の仏間の入り口にかける風習があった。（　　）に入る言葉はどれか。",["花嫁掛け軸","花嫁のれん","花嫁しめ縄","花嫁すだれ"],1,"","食・行事","X",0],["1947年（昭和22）に、第2回国民体育大会が石川県で開催された。その大会歌として「参加者全員で歌える歌を」ということからできあがり、小学校連合体育大会で演じられている歌はどれか。",["ふるさと","若い力","うみ","ラジオ体操の歌"],1,"","食・行事","X",0],["金沢は、加賀藩のころから学問や芸術が盛んで、明治以降も文化面で優れた人物を輩出してきた。「金沢の三文豪」は近年再注目されているが、その3人とは誰か。",["室生犀星・西田幾多郎・鈴木大拙","室生犀星・泉鏡花・徳田秋聲","泉鏡花・徳田秋聲・西田幾多郎","泉鏡花・室生犀星・鈴木大拙"],1,"","文学","X",0],["金沢の気候は日本海側気候に属している。この気候の特徴として正しいものはどれか。",["年間を通じて天気が安定しており、雨がほとんど降らない","季節風の影響で夏は雨が多いが、冬は逆に晴れることが多い","季節風の影響で冬は特に雨や雪が多く降る","1年を通して気温が高く、雨は多いが雪は見られない"],2,"","自然・産業","S",0],["加賀藩の身分の低い武士のくらしについて正しく述べている文章はどれか。",["土地を俸禄(給料)として与えられる千石以上の知行取りであった","俸禄(給料)のみでは生活できず、家族とともに内職をして生計を立てた","俸禄(給料)のみで十分生活していくことができた","1万石以上の領地が与えられ、豊かなくらしをしていた"],1,"","歴史","S",0],["金沢には、金沢市無形民俗文化財に指定された伝統行事が今も数多く残っている。斧や刀、弓を持った山伏が各家をまわる金石町や大野町で行われている行事はどれか。",["加賀獅子","悪魔払い","加賀万歳","さかたおどり"],1,"","食・行事","X",0],["金沢市は石川県の加賀地方の北部に位置し、いくつかの市や町と接しているが、金沢市と接していないのはどれか。",["野々市市","白山市","能美市","津幡町"],2,"","自然・産業","S",0],["金沢の地域福祉活動の原点でもあり、生活相談や授産・託児の援助など地域の福祉・社会教育の拠点として1934年（昭和9）から建てられた施設はどれか。",["友好館","善隣館","交流館","福祉館"],1,"","歴史","X",0],["金沢の農業は米作りが中心であるが、市街地近郊では、野菜・花・果物などいろいろな種類が生産されている。そのうち、1945年（昭和20）以前から金沢で生産され、金沢市が認定している「加賀野菜」は何品目あるか。",["11品目","13品目","15品目","17品目"],2,"","自然・産業","S",0],["金沢市は、東経136度、北緯36度の位置にあるが、ほぼ同じ緯度にある世界の都市はどれか。",["シドニー（オーストラリア）","ミラノ（イタリア）","サンフランシスコ（アメリカ）","ロンドン（イギリス）"],2,"","自然・産業","S",0],["金沢の年中行事を説明した文章として、正しくないものはどれか。",["1月初旬に出初式が行われるが、これは江戸時代の「加賀鳶」の伝統を受け継いでいるものである","氷室の朔日（7月1日）に氷室饅頭や竹輪を食べると一年間病気にかからないといわれている","お盆にお墓参りをするときには、「切籠」をつるす","1月15日の左義長では、笹や竹に短冊をつるす"],3,"","食・行事","S",0],["金沢のまちでは、細く曲がりくねった小路をぬけると、広く開けた空間に出会うことがある。もともとは、防火の目的でつくられたといわれているこの空間を何というか。",["大通り","路地","公園","広見"],3,"","寺社・建造物・まち","X",0],["徳川家康は、加賀藩2代藩主前田利長が家康を討つ準備をしているという噂を聞き、加賀征伐の準備を始めた。その時、「母を思うがあまり、家をつぶすことがあってはならぬ。前田家のために母を捨てよ。」と利長に伝え、自ら人質として江戸へと旅立ったのは誰か。",["芳春院","濃姫","北政所","豪姫"],0,"","偉人・人物","X",0],["2014年（平成26）、金沢市は「めざすべき金沢の子ども像」を策定した。それを、市内の中学生が分かりやすく、覚えやすい言葉で表現した、子供たちの考え方や行動の基本的な約束事を何というか。",["男女共同参画都市宣言","金沢市民憲章","かなざわ子育て夢プラン","金沢子どもかがやき宣言"],3,"","市政・最近の話題","X",0],["加賀には、室町時代から加賀絹を梅の樹皮の煎汁に浸して染める無地染めがあり、「加賀染め」といわれていた。そこから発展し、「ぼかし」や「虫食い」などの技法を用いるようになった伝統工芸は何か。",["加賀友禅","加賀繍","二俣和紙","加賀蒔絵"],0,"","美術・工芸・芸能","S",0],["金沢市は、西から東へとだんだん標高が上がり、険しい地形となっている。犀川の水源にもなっている、金沢市で最も高い山はどれか。",["三子牛山","医王山","奈良岳","キゴ山"],2,"","自然・産業","X",0],["二俣地区では、こうぞ、みつまた、がんぴなどを原料に、流しずき法という技術で伝統工芸品を作っており、それらは加賀藩主やその一族が公式儀礼や日常生活で利用していた。その伝統工芸品はどれか。",["ろうそく","和紙","友禅","漆器"],1,"","美術・工芸・芸能","S",0],["参勤交代は、大名が1年おきに領地と江戸に住み、その妻子を人質として江戸の屋敷におくことを命じたものである。江戸に向かう加賀藩の大名行列は諸大名の中でも最大の規模であった。そのコースは3つあったといわれているが、北国下街道を通る約480キロメートルのコースにはどれだけの期間を要したか。",["3日","13日","1ヶ月","1年"],1,"","歴史","S",0],["1858年（安政5）に、凶作による米の値上がりに苦しむ2,000人ほどの人々が卯辰山から金沢城にいる加賀藩13代藩主前田斉泰に向かって、「ひもじいわいやー」「米くれまいやー」と叫んで救済を訴えた一揆を何というか。",["加賀の一向一揆","徳政一揆","馬借一揆","泣き一揆"],3,"","歴史","S",0],["2008年（平成20）、観測史上例のない大雨によって川の水があふれ、道路や土地が水に浸かり、広い範囲で被害が発生した。このとき、55年ぶりに氾濫した川はどれか。",["伏見川","犀川","金腐川","浅野川"],3,"","自然・産業","X",0],["金沢の今町に生まれ、台湾に当時アジア最大といわれた烏山頭ダムや16,000キロメートルに及ぶ水路を完成させ、不毛の大地を豊かな平野に変えた金沢の偉人は誰か。",["三宅雪嶺","中西悟堂","八田與一","木村栄"],2,"","偉人・人物","X",0],["金沢の地形を眺めると、東部の山地から西部の海岸に向かって川が流れていることがわかる。金沢を流れる川で最も長い川はどれか。",["森下川","木曳川","犀川","高橋川"],2,"","自然・産業","X",0],["1631年（寛永8）の大火災の後、本丸に変わって政治の中心になった藩主の住まいで、内外装の材料や寸法、技法などを記した仕様書が2020年（令和2）に玉川図書館近世史料館で見つかり、復元が検討されている金沢城の建物はどれか。",["天守閣","一の丸御殿","二の丸御殿","大手門"],2,"","寺社・建造物・まち","S",0],["江戸時代、小立野台地の
