<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金沢ランニングクエスト 道中ガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#fbf6ec;--card:#fff;--ink:#22344f;--ink2:#5a6b85;--line:#e6dcc8;--navy:#1f3a63;--gold:#c9a24b;--pink:#e91e7a;--green:#43a047;--blue:#1e88e5;--purple:#8e24aa;--orange:#fb8c00}
:root:not([data-theme="light"]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1e222b;--ink:#e8eaf0;--ink2:#9aa3b2;--line:#2c3240;--navy:#9db7e0}}
:root[data-theme="dark"]{--bg:#15181e;--card:#1e222b;--ink:#e8eaf0;--ink2:#9aa3b2;--line:#2c3240;--navy:#9db7e0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:900px;margin:0 auto;padding:14px}
h1{font-family:'Zen Maru Gothic',sans-serif;font-size:22px;font-weight:900;color:var(--navy)}
.sub{font-size:12px;color:var(--ink2);margin:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.lvbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.lvbtn{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap;font-family:'Zen Maru Gothic',sans-serif;font-weight:700}
.lvbtn.on{border-color:var(--gold);background:rgba(201,162,75,.15)}
.lvbtn.empty{opacity:.55}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.head h2{font-family:'Zen Maru Gothic',sans-serif;font-size:20px;font-weight:900}
.head h2 small{font-size:12px;color:var(--ink2);font-weight:500;margin-left:6px}
.meta{font-size:12px;color:var(--ink2)}
.gbtn{display:inline-block;background:var(--navy);color:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;font-family:'Zen Maru Gothic',sans-serif}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{display:none}.panel.on{display:block}
svg#map{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--ink2);background:var(--card)}
.chip.on{border-color:var(--gold);color:var(--ink);background:rgba(201,162,75,.15)}
.strip{position:relative;padding-left:26px}
.strip::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:3px;background:var(--line);border-radius:2px}
.step{position:relative;margin-bottom:14px}
.step::before{content:"";position:absolute;left:-23px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--gold)}
.step.start::before{background:var(--gold)}.step.goal::before{background:var(--green);border-color:var(--green)}
.step h3{font-size:14px;font-weight:700;font-family:'Zen Maru Gothic',sans-serif}
.step h3 .d{font-size:11px;color:var(--ink2);font-weight:500;margin-left:6px}
.spot{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.spot .nm{font-weight:700}
.spot .tg{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;margin-right:4px;color:#fff;vertical-align:1px}
.spot .rk{font-size:10.5px;color:var(--ink2);margin-left:4px}
.spot p{margin-top:3px;color:var(--ink)}
.spot .src{font-size:10.5px;color:var(--ink2);margin-top:2px}
.c-用水{border-left-color:var(--blue)}.c-建物{border-left-color:var(--orange)}.c-町{border-left-color:var(--green)}.c-歴史{border-left-color:var(--purple)}.c-交通{border-left-color:var(--pink)}.c-校下{border-left-color:var(--gold)}.c-数字{border-left-color:var(--navy)}
.t-用水{background:var(--blue)}.t-建物{background:var(--orange)}.t-町{background:var(--green)}.t-歴史{background:var(--purple)}.t-交通{background:var(--pink)}.t-校下{background:var(--gold)}.t-数字{background:var(--navy)}
.hide{display:none!important}
.gframe{width:100%;height:460px;border:0;border-radius:12px;background:#eee}
#lmap{width:100%;height:420px;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.note{font-size:11.5px;color:var(--ink2)}
.kq{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.kq summary{cursor:pointer;list-style:none}.kq summary::-webkit-details-marker{display:none}
.kopts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;color:var(--ink2);font-size:12px}
.kans{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-weight:700;color:var(--green)}
.kexp{font-weight:400;color:var(--ink);font-size:12.5px;margin-top:3px}
.legend{font-size:11px;color:var(--ink2);margin-top:6px}
.count{font-size:11px;color:var(--ink2)}
@media print{.lvbar,.tabs,.chips,.gbtn{display:none}.panel{display:block!important}.card{break-inside:avoid}}
</style>
</head>

   {n:'旧大隅町',y:'おおすみちょう',at:'中橋町2-27先',no:127,text:'加賀藩老臣・長大隅守の家臣が寛文期に能登から移り住んだところ。新（荒）屋敷・新家中と呼ばれた。古道木揚場の水路の対岸。'},

   {n:'旧日吉町',y:'ひよしまち',at:'広岡1-17-25',no:128,text:'宮腰往還から広岡山王社への山王道が通称日吉町と呼ばれ町名に。鉄道高架事業で高架下に消えた。'},
   {n:'旧広岡町',y:'ひろおかまち',at:'広岡1-17',no:132,text:'「ひろか」の地名は平安末期に見え、平岡野・弘岡と書き、藩政期には北広岡村。'},
   {n:'長町',y:'ながまち',at:'長町1-1-23先',no:72,text:'藩政時代はすべて藩士の邸地で、香林坊下から図書橋（ずしょばし）あたりまでの長い町筋。藩の老臣・長氏や山崎長門の氏名に由来する説も。'},
   {n:'旧富本町',y:'とみもとちょう',at:'長町2-7-3先',no:76,text:'文政6年に法船寺町から分立。町内に鍔屋小路も。由来は不詳。'},
   {n:'旧塩川町',y:'しおがわちょう',at:'中央通町7-28先',no:70,text:'加賀藩士・塩川安左衛門の屋敷があった。'}

  kyu:[
   {n:'大豆田新町',y:'まめだしんまち',now:'大和町',text:'持筒足軽（鉄砲を持つ足軽）の組屋敷地。もと大豆田村の地内。明治4年に町名に。芸術村の足元は足軽の組地やった。'},
   {n:'大豆田町',y:'まめだまち',now:'長土塀3丁目・大和町',text:'石川郡大豆田村の地で町立てされた。地子町（税を納める町人町）の一つ。'},
   {n:'元車町',y:'もとぐるままち',now:'長土塀2・3丁目',text:'藩政初期、大豆田用水に水車を設けて灯油を製造したところ。犀川油車・油車町とも呼ばれた。用水が工場やった時代。'},
   {n:'梅鉢清水',y:'うめばちしみず',now:'長土塀3丁目',text:'梅鉢草という海草が生い茂る清水があったことによる。もと大豆田村。明治4年からの町名。'},
   {n:'藺田町',y:'いだまち',now:'長土塀2・3丁目・元菊町',text:'「いいだまち」とも。藩政時代、この地が藺田（いぐさの田）だったことによる。地子町。'},
   {n:'高儀町・下高儀町',y:'こうぎまち',now:'長土塀2・3丁目',text:'もと寺地。藩政前期に藩用地として藩士の屋敷を置いたので「公儀町」と呼ばれ、文政6年（1823年）に公儀の文字をはばかってこの名に。'},
   {n:'竹田町',y:'たけだまち',now:'長土塀3丁目',text:'加賀藩士・禄高3,530石の竹田氏の下屋敷（家中町）があったところ。明治2年命名。'},
   {n:'谷町',y:'たにまち',now:'長土塀2丁目',text:'加賀藩士・神谷氏の邸地だったので神谷町と称し、1823年に分立。神谷町の略。'},
   {n:'七曲り',y:'ななまがり',now:'長土塀2丁目',text:'加賀八家・村井氏の家中と今枝氏の家中の屋敷地で、道路の屈曲が多かった。三社七曲がりとも。'},
   {n:'三社五十人町',y:'さんじゃごじゅうにんまち',now:'長土塀2丁目・芳斉1丁目・三社町',text:'足軽五十人組の組地の一つ。三社にあったので冠称。'},
   {n:'蔦町',y:'つたまち',now:'三社町・元菊町',text:'加賀藩士・禄高7,650石の青山氏の下屋敷（家中町）。家紋「丸の内蔦」にちなんで明治4年に命名。'},
   {n:'穴水町一〜五番丁',y:'あなみずまち',now:'長町3丁目・長土塀1丁目・芳斉1丁目',text:'加賀八家・長氏の上級家臣が住み「上家中町」と呼ばれた。長氏の祖先が能登の穴水城にいたことにちなみ明治に命名。長町の「長」はこの長氏説あり。'},
   {n:'木揚場',y:'きあげば',now:'元菊町',text:'宮腰往来が通っていた頃、宮腰から水上輸送した材木をここで陸揚げした。「三社揚場」ともいった。地子町。→ 古道木揚場（ふるみちきあげば）の由来。'},
   {n:'古道・古道一番丁・二番丁・古道鉄道宿舎',y:'ふるみち',now:'昭和町・元菊町・中橋町・長田1丁目・芳斉2丁目',text:'金沢城下から宮腰（金石）へ通じる古い道。元和2年（1616年）に新しく往還ができたので、新道に対して「古道」と呼んだ。大きな鉄道宿舎があった町も。'},
   {n:'大隅町',y:'おおすみちょう',now:'中橋町',text:'加賀八家・長大隅守の家臣が寛文期に能登から移り住んだところ。新（荒）屋敷・新家中と呼ばれ、明治2年に町名に。木揚場の対岸に標柱。'},
   {n:'醒ヶ井町',y:'さめがいちょう',now:'広岡2丁目',text:'藩政時代は北広岡村領の請地で、前田土佐守の下屋敷（家中町）があった。目の醒めるようなきれいな水の井戸があったことから明治3年に町名に。'},
   {n:'日吉町',y:'ひよしまち',now:'広岡1丁目・中橋町',text:'宮腰往還から広岡山王社（平岡野神社）への山王道が通称日吉町と呼ばれ町名に。鉄道高架事業で高架下に消えた町。'},
   {n:'広岡町',y:'ひろおかまち',now:'広岡1〜3丁目・西念1丁目・駅西本町1丁目',text:'ひろおかの地名は平安末期に見え、平岡野・弘岡と書き、藩政期には北広岡村。町地の拡大で広岡町に。'},
   {n:'長田弓ノ町',y:'ながたゆみのまち',now:'長田1丁目',text:'御持弓組（おもちゆみぐみ）足軽の組地（検定）。長田町小学校の創立時の住所「長田弓ノ町一番丁」。'}

  detours:[
   {cat:'用水',rank:'◎',name:'木曳橋（きびきばし）・古道木揚場（ふるみちきあげば・中橋町（なかばしまち））',dist:'校門から北東へ約300m',text:'江戸時代、宮腰（みやのこし・金石（かないわ）港）から船で木材などを運び、ここで陸揚げした場所＝「古道木揚場（ふるみちきあげば）」。スダジイの木が昔の名残。金沢市公式では「古道木揚場（中橋町（なかばしまち）地内）より下流からは木曳川（きびきがわ）」。舟に材木を載せて馬に曳かせて運んだから「木曳川」、木材の終点は木倉町（きぐらまち）の藩の材木蔵。大野（おおの）庄用水（御荷川（おにかわ／おにがわ））の物語の"現場"がここ。用水は尾山御坊（おやまごぼう）時代からあった伝承もあり、今もホタルを見かける。',src:'金沢市公式「大野庄用水」／金沢日和「用水めぐり」／全国風景ガイド／金沢検定'},
   {cat:'町',rank:'◎',name:'中橋町（なかばしまち）の由来と、中橋（なかばし・JRの下）',dist:'校門から北へ約200m',text:'町名は「宮腰往還（みやのこしおうかん）を横切る用水に架かる三つの橋の真ん中の橋に近かった」から。ここで大野（おおの）庄用水と鞍月用水（くらつきようすい）が合流し、木曳川（きびきがわ）と樋俣用水（ひまたようすい）に分かれて犀川（さいがわ）河口へ注ぐ。',src:'金沢検定（旧町名の由来）'},
   {cat:'交通',rank:'◎',name:'金石街道（かないわかいどう）＝旧宮腰往還（みやのこしおうかん）',dist:'校門の北を横切る',text:'城下と宮腰（みやのこし）湊（今の金石（かないわ））を結んだ街道。六枚町（ろくまいまち）の「升形（ますがた）」（西外惣構（にしそとそうがまえ）の出入口）から金石へ。升形は城下への敵の侵入を防ぐ高さ約5mの土盛りで、2018年に復元された。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'平岡野神社（ひらおかのじんじゃ・広岡（ひろおか）1丁目）',dist:'校門から北東へ約600m',text:'旧社格（きゅうしゃかく）は郷社（ごうしゃ）。「矢口大獅子」は加賀の平賀源内・大野弁吉（おおのべんきち）が制作したとされる。木曽義仲（きそよしなか）が付近に陣を張ったことでも知られる。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'豊田白山神社（とよたはくさんじんじゃ・三社町（さんじゃまち））＝三社（さんじゃ）の宮',dist:'ルートから東へ約200m',text:'「三社（さんじゃ）の宮」とも呼ばれ、拝殿（はいでん）や神門（しんもん）など約300年前の姿をよく残す。三社町（さんじゃまち）は洋学者・大屋愷敆（おおやよしあつ・1839年生、壮猶館（そうゆうかん）翻訳方）の出身地。',src:'金沢検定'},
   {cat:'町',rank:'◇',name:'旧町名の標柱（長田弓ノ町（ながたゆみのまち））',dist:'校門付近',text:'市は1979年から旧町名の由来を記した標柱を設置している。長田弓ノ町（ながたゆみのまち・御持弓組足軽の組地（くみち））の標柱が校門周辺にあれば寄る価値あり。※現地で確認。',src:'金沢検定（標柱設置の事実）／◇位置は要確認'},
   {cat:'用水',rank:'◎',name:'【少し遠い・約700m】長町（ながまち）武家屋敷の大野（おおの）庄用水',dist:'芸術村（げいじゅつむら）から東へ約700m',text:'土塀沿いを流れ、屋敷の庭の曲水（きょくすい）に。江戸時代は今の道路部分も全部用水で、土塀に木戸を作って舟からの届け物を受け取った。用水は城から少しずつ離れるよう蛇行して造られている。冬の「こも掛け（こもかけ）」は市が1986年から実施。犀川（さいがわ）に近い側から「一の橋」〜「八の橋」。丑の刻の「鬼川（おにかわ／おにがわ）の八つ橋巡り」。',src:'金沢検定／kanazawa-tourism.net'}
  ],
  kentei:[{"q": "片町2丁目の真言宗養智院は、長らく（　　）を守護すると伝わる地蔵を祀る。", "o": ["犀川", "犀川大橋", "鞍月用水", "大野庄用水"], "a": 3, "e": "大野庄用水は金沢で最も古い用水と言われ、灌漑・物資運搬・防火・防御・融雪などの多目的用水として金沢城築城に大きな役割を果たしたと伝えられ、伝承として尾山御坊時代からの存在もうかがえる。旧宮腰から材木などを運んだことから御荷川とも呼ばれた。現在は桜橋上流の右岸から取水するが、17世紀初頭は旧上傳馬町（現在の片町2丁目）に取水口があった。"}, {"q": "大野庄用水を天正年間(1573〜1592年)に開削した、前田利長の家臣は誰か。", "o": ["富永佐太郎", "板屋兵四郎", "後藤太兵衛", "小川治兵衛"], "a": 0, "e": "大野庄用水は前田利長の家臣・富永佐太郎が天正年間に開削した。取水口は犀川桜橋の上流右岸、延長約10.2キロ・幅約6メートル。金沢城を築く際に木材を運んだことから御荷川・鬼川とも呼ばれる。"}, {"q": "金沢城を築く際に木材を運んだことから「御荷川」「鬼川」とも呼ばれる用水はどれか。", "o": ["大野庄用水", "辰巳用水", "鞍月用水", "長坂用水"], "a": 0, "e": "大野庄用水は一説に金沢城築城の木材を城下まで運んだことから御荷川・鬼川とも呼ばれる。長町武家屋敷跡では土塀沿いを流れ、屋敷内庭園の曲水にも利用される。中橋町で鞍月用水と合流後、木曳川と樋俣用水に分流し犀川河口に注ぐ。"}, {"q": "長町周辺を流れる鬼川（御荷川）と呼ばれる大野庄用水で、丑の刻に防火と無病息災を願って行う習わしは何か。", "o": ["鬼川の八つ橋巡り", "七つ橋渡り", "四万六千日", "こも掛け"], "a": 0, "e": "「鬼川の八つ橋巡り」は丑の刻に防火と無病息災を願って大野庄用水に架かる八つの橋を渡る習わし。"}, {"q": "金沢市内には何本かの川が流れ荷物の流通に使われた。宮腰［今の金石］から主に木材を運ぶために使われたのは何川か。", "o": ["桂川", "木曳川", "木津川（きづがわ）", "木曽川（きそがわ）"], "a": 1, "e": "木曳川では名前のとおり木材が運ばれ、終点は木倉町であった。"}, {"q": "金沢市内には何本かの川が流れ、荷物の流通に使われた。宮腰［今の金石］から木曳川を使って運ばれたものは何か。", "o": ["米", "木材", "味噌", "塩"], "a": 1, "e": "木曳川では名前のとおり、木材が運ばれ、終点は木倉町であった。"}, {"q": "袋町の名は何に由来するか。", "o": ["道の両端が直角に折れ袋状に見えた", "袋を作る職人が住んだ", "米袋の倉庫", "袋小路だった"], "a": 0, "e": "袋町は道の両端が直角に折れ袋状に見えたことに由来。長町は長い町筋または長氏上屋敷の2説、中橋町は宮腰往還を横切る用水に架かる三つの橋の真ん中の橋に近かった、菊川町は犀川の雅名「菊水川」(芝居小屋の座元菊川松之助の説も)。"}, {"q": "金沢の内惣構は延長約2.9キロ、外惣構は延長約（　　）キロである。", "o": ["3.2", "4.2", "5.2", "6.2"], "a": 1, "e": "内惣構は延長約2.9キロ、外惣構は延長約4.2キロ。近年、内・外惣構ともに17世紀初めの同時期に造られたとの説もある。2018(平成30)年、西外惣構と旧宮腰往還が交わる地点に高さ約5メートルの土盛り建造物の「升形」が復元された。これは城下町に外からの敵の侵入を防ぐため設けられた。"}, {"q": "2018年（平成30）、金沢市本町に、金沢城西外惣構の「升形」が復元された。加賀藩3代藩主前田利常がこの升形を造らせた目的は何か。", "o": ["火事が起きたときに、上に立って町民に知らせるため", "外敵の侵入を防ぎ、城を守るため", "他の大名に、前田家の力の強さを示すため", "近くに前田家の城があることを知らせるため"], "a": 1, "e": ""}, {"q": "三代藩主前田利常は、輸送に力を入れるため、港のある宮腰（金石）から城下町までの直線道路宮腰往還（金石往還）を作りました。さて、およそ何キロメートルあったでしょうか。", "o": ["1キロメートル", "5キロメートル", "10キロメートル", "20キロメートル"], "a": 1, "e": ""}, {"q": "金石から金沢市の中心部へ一直線にのびる広い道路・金石街道（宮腰往還）は、港と中心部の間で荷物をスムーズに運べるようにつくられました。この道路はいつごろつくられましたか。", "o": ["江戸時代", "明治時代", "昭和年代", "平成時代"], "a": 0, "e": ""}, {"q": "尾崎神社は、幕府から東照大権現(徳川家康)の勧請を許された加賀藩4代藩主（　　）が1643(寛永20)年に金沢城北の丸に創建した東照宮である。", "o": ["前田光高", "前田利常", "前田綱紀", "前田利長"], "a": 0, "e": "尾崎神社はもともと4代光高が1643(寛永20)年に金沢城北の丸に創建した東照宮(御宮)で「北陸の日光」「金沢の江戸」とも呼ばれた。明治維新後に尾崎神社と改称し1878(明治11)年現在地の丸の内に移転。護摩堂は長田菅原神社に譲られ拝殿として今も受け継がれる。祭神は徳川家康・天照大神・3代利常。1950(昭和25)年本殿・拝殿・幣殿・中門・透塀などが国重要文化財。板絵彩色三十六歌仙額は県指定有形文化財。"}, {"q": "尾崎神社(旧東照宮)の護摩堂は、現在どこの神社の拝殿として受け継がれているか。", "o": ["長田菅原神社", "小橋菅原神社", "泉野菅原神社", "椿原天満宮"], "a": 0, "e": "尾崎神社が1878(明治11)年に丸の内に移された際、建物の全面移築は難しく、護摩堂は長田菅原神社に譲られ拝殿として今も受け継がれている。"}, {"q": "広岡1丁目の平岡野神社にある大獅子は誰が制作したとされるか。", "o": ["矢口大獅子・大野弁吉", "津田吉之助", "木曽義仲", "広田百豊"], "a": 0, "e": "平岡野神社(広岡1丁目)は旧社格が郷社。矢口大獅子は大野弁吉が制作したとされる。木曽義仲が付近に陣を張ったことでも知られる。"}, {"q": "「三社の宮」とも称され、拝殿や神門など約300年前の旧容をよく残す三社町の神社はどれか。", "o": ["豊田白山神社", "豊国神社", "長田菅原神社", "中村神社"], "a": 0, "e": "豊田白山神社(三社町)は「三社の宮」とも称され、拝殿や神門など約300年前の旧容をよく残している。"}, {"q": "藩校壮猶館の教授で砲台築造などに携わり、著書に『海軍要略』がある1815年生まれの蘭学者は誰か。", "o": ["鹿田文平", "大屋愷敆", "黒川良安", "高橋順太郎"], "a": 0, "e": "鹿田文平は1815（文化12）年金沢出身の蘭学者。大屋愷敆（1839年三社町出身・洋学者）は鹿田文平らに学び長崎へ留学、壮猶館で翻訳方を務め、金城霊沢横に顕彰碑がある。"}, {"q": "加賀藩の藩士のうち、与力や御歩は（　　）に限って拝領地を受けた。", "o": ["一代", "三代", "子孫まで", "藩主の代替わりまで"], "a": 0, "e": "藩士は禄高に応じて藩から家を建てる拝領地を受けていた。3000石以上の人持組には自分の家臣を住まわせる下屋敷地が与えられ、この町を家中町と呼んだ。与力や御歩は一代に限って拝領地を受けた。足軽や小者が住んだところを組地といい、組単位でまとめて支給され各人に分配される仕組みがとられた。金沢の町は金沢町奉行所が管理し、その下に町同心、町下代、町付足軽の武士階級の役人が配置された。"}, {"q": "加賀藩で足軽や小者が住んだ場所を（　　）といい、組単位でまとめて支給された。", "o": ["家中町", "組地", "拝領地", "地子町"], "a": 1, "e": "3000石以上の人持組の家臣を住まわせる町が家中町、足軽や小者が住んだところが組地。組地は組単位でまとめて支給され各人に分配される仕組みがとられた。金沢市長町の足軽資料館(旧清水家屋敷)では下級武士の暮らしを見ることができる。"}, {"q": "菊川2丁目から石引2丁目に上る二十人坂の名は、何に由来するか。", "o": ["鉄砲足軽の組地・二十人町があった", "二十人で作った", "二十曲がりある", "二十軒の家があった"], "a": 0, "e": "二十人坂(菊川2丁目〜石引2丁目)は鉄砲足軽の組地・二十人町があったことに由来する。大瀧坂(錦町)は辰巳用水から台地下の田畑を潤す流れが大きな滝のように流れ落ちていたことから。広坂(出羽町)は道の幅が広いことから命名。"}, {"q": "旧町名「地黄煎町」は何を売る店があったことに由来するか。", "o": ["あめ薬", "目薬", "油", "漆"], "a": 0, "e": "地黄煎町はあめ薬を売る店に由来。長田弓ノ町は御持弓組足軽の組地、御小人町は藩主のそばで身の回りの弁当などを運ぶ御小人、水車・元車は水車で油製造、与力町は与力組、早道町は藩の足軽飛脚、殿町は人持組など大身の武士が多く住んだ、御仲間町は馬を世話する仲間の組地、石屋小路は石工、御徒町は藩主を警護する徒、吹屋町は鋳物師や職人、傳馬町は66頭の伝馬、二十人町は鉄砲足軽20人(小立野二十人町・小立野足軽二十人町とも)、象眼町は象嵌師、鷹匠町は藩の鷹匠の邸地や鷹部屋。"}, {"q": "1924（大正13）年に（　　）が現在の鋼材を組み合わせた構造に架け替えられて100周年を記念する「百寿祭」が2024（令和6）年7月に行われ、歩行者天国、ステージイベントなどのほか、記念プレートの除幕もあった。", "o": ["浅野川大橋", "犀川大橋", "天神橋", "梅ノ橋"], "a": 1, "e": "犀川大橋は1924年に鉄橋となり現在に至る。百寿祭は2024年7月7日「川の日」に国道157号の片町―野町広小路交差点で開催。浅野川大橋は1922年架橋で、両橋とも2000年に国の登録有形文化財。"}, {"q": "犀川大橋は国登録有形文化財で、現在の橋は1924(大正13)年に架け替えられた長さ約62メートルの（　　）式である。", "o": ["鋼製曲弦ワーレントラス", "鉄筋コンクリートアーチ", "単弦アーチ", "石造アーチ"], "a": 0, "e": "犀川大橋は国登録有形文化財。現在の橋は1924(大正13)年架け替え、長さ約62メートルの鋼製曲弦ワーレントラス式。2009(平成21)年に青色から青緑系の色に塗り替えられた。浅野川大橋は鉄筋コンクリート製のアーチ橋。"}, {"q": "2009(平成21)年に青色から青緑系の色に塗り替えられた犀川の橋はどれか。", "o": ["犀川大橋", "桜橋", "雪見橋", "下菊橋"], "a": 0, "e": "犀川大橋は2009(平成21)年に青色から青緑系に塗り替えられた。1924(大正13)年架け替えの鋼製曲弦ワーレントラス橋で国登録有形文化財。"}, {"q": "浅野川大橋(国登録有形文化財)の現在の橋が建造されたのはいつか。", "o": ["1922(大正11)年", "1924(大正13)年", "1953(昭和28)年", "1955(昭和30)年"], "a": 0, "e": "浅野川大橋は国登録有形文化財。現在の橋は1922(大正11)年建造、長さ約55メートルの鉄筋コンクリート製アーチ橋。犀川大橋は1924(大正13)年架け替え。"}, {"q": "旧石川県庁本館(現しいのき迎賓館)の外壁に用いられた、クギで引っかいたような多数の縦線が施されたタイルは何か。", "o": ["スクラッチタイル", "テラコッタタイル", "モザイクタイル", "マジョリカタイル"], "a": 0, "e": "旧石川県庁本館(1924年完成)は外壁に茶色のスクラッチタイル(クギで引っかいたような縦線のあるタイル)が使われているのが特徴。浅野川・犀川大橋と同時期の誕生で、金沢の近代化が進んだ大正期のシンボル。"}, {"q": "犀川大橋から上流へ向かって1番目に架かる橋を桜橋とすると、4番目に架かる橋は（　　）である。", "o": ["新橋", "上菊橋", "下菊橋", "犀川雪見橋"], "a": 3, "e": "犀川大橋から山側環状までの上流側では、桜橋、下菊橋、上菊橋、犀川雪見橋、大桑橋の順に架かる。一方、犀川大橋の下流は鉄道・北陸自動車道を除いて河口まで新橋、御影大橋、新御影橋、大豆田大橋、若宮大橋、示野中橋、雪吊橋、示野橋、二ツ寺橋、赤土大橋、犀川橋、普正寺橋と続く。"}, {"q": "2024（令和6）年5月に亡くなった劇作家の唐十郎が書き下ろした戯曲「秘密の花園」は、泉鏡花の初期の傑作で、少年が神隠しに遭う小説「（　　）」が下地となっている。", "o": ["天守物語", "龍潭譚", "化鳥", "海神別荘"], "a": 1, "e": "唐は1978（昭和53）年、小説「海星、河童」で第6回泉鏡花文学賞を受けた。アングラ演劇の旗手の登場に、授賞式には市民があふれた。「秘密の花園」は2022年の同文学賞制定50周年事業として金沢市民芸術村の芝生に設けられた「紅テント」を会場にして上演された。"}, {"q": "1989(平成元)年に市制100周年記念として卯辰山に開設された「平成の御細工所」を目指す施設は（　　）である。", "o": ["金沢職人大学校", "金沢卯辰山工芸工房", "金沢市民芸術村", "金沢美術工芸大学"], "a": 1, "e": "金沢卯辰山工芸工房は「平成の御細工所」を目指し、陶芸・漆芸・染・金工・ガラスの五つの工房がある。もう一つの職人育成の場が1996(平成8)年設立の「金沢職人大学校」で、金沢市民芸術村の一角にあり本科と修復専攻科がある。本科は石工・瓦・大工・左官・造園・畳・建具・板金・表具の9科目で受講生は3年間研さんを積む。"}, {"q": "金沢市民芸術村は、市民が自主的に企画したコンサートや芸術の練習の場として開放されている。この施設が整備される前、もともとこの場所にあった施設は何か。", "o": ["紡績工場", "陸上競技場", "小学校", "バスターミナル"], "a": 0, "e": "金沢市民芸術村は、かつて大和紡績金沢工場として操業していた紡績工場の跡地を活用して整備された文化施設である。赤レンガ造りの建物を再利用し、市民が演劇や音楽、美術などの芸術活動を行える場として開放されている。"}, {"q": "金沢市民芸術村は、市民が自主的に企画したコンサートや芸術の練習の場として開放されているが、もともとは何の施設（しせつ）があったか。", "o": ["食品工場", "紡績（ぼうせき）工場", "バス整備場", "中学校"], "a": 1, "e": "リノベーションされた建物は、通産省（現：経済産業省）のグッドデザイン大賞最優秀（ゆうしゅう）賞、金沢都市美文化賞などの数々の受賞歴がある。"}],
  spots:[
   {at:0,cat:'建物',rank:'◎',name:'金沢市民芸術村（大和町（だいわまち）1-1）',text:'1994年に市が大和紡績（だいわぼうせき）金沢工場の跡地を取得、1996年（平成8年）開村。倉庫7棟と管理棟を改修、機械室とコロネードを新設、里山の家を移築。1997年グッド・デザイン大賞、1999年日本建築学会作品選奨、2001年パフォーミングスクエア新設、2006年JAFRAアワード総務大臣賞、2022年JIA25年賞。町名「大和町（だいわまち）」は大和紡績から。',src:'金沢市 リニューアル基本構想 答申（令和8年2月）／'+'金沢検定アプリ（北國新聞社『金沢検定 攻略の基礎知識』準拠）'},
   {at:0,cat:'数字',rank:'★',name:'稼働率ほぼ100%・24時間年中無休',text:'令和6年度、ミュージック工房・パフォーミングスクエアの稼働率はほぼ100%。市の資料で「市民利用が非常に多い優等生」。年間の市民芸術村（しみんげいじゅつむら）費2.37億円。運営は金沢芸術創造財団（かなざわげいじゅつそうぞうざいだん・21美など7施設で指定管理料10億4,650万円）。開村30年で老朽化し、令和7年7月〜8年2月にリニューアル基本構想を答申。',src:'金沢まるっと「金沢のハコモノ」「金沢のお金」／市観光パンフ'},
   {at:0,cat:'建物',rank:'◎',name:'一角に金沢職人大学校（かなざわしょくにんだいがっこう・1996年設立）',text:'芸術村（げいじゅつむら）の一角にある職人育成の場。本科と修復専攻科。石工（いしく）・瓦・左官（さかん）・造園・大工・畳・建具（たてぐ）・板金（ばんきん）・表具（ひょうぐ）。もう一つの職人育成の場が1989年に卯辰山（うたつやま）にできた「平成の御細工所（おさいくしょ）」金沢卯辰山工芸工房（陶芸・漆芸（しつげい）・染・金工・ガラス）。',src:K},
   {at:0,cat:'歴史',rank:'◎',name:'足の下は遺跡かもしれん',text:'芸術村（げいじゅつむら）の敷地は「周知の埋蔵文化財包蔵地（まいぞうぶんかざいほうぞうち）」。犀川（さいがわ）に面していて洪水時の家屋倒壊等氾濫想定区域。2022年、泉鏡花（いずみきょうか）文学賞50周年事業で、唐十郎（からじゅうろう）の戯曲「秘密の花園」がこの芝生の野外舞台で上演された。',src:'金沢市 リニューアル基本構想 答申／'+'金沢検定アプリ（北國新聞社『金沢検定 攻略の基礎知識』準拠）'},
   {at:0,cat:'校下',rank:'◎',name:'ここは長土塀（ながどへ／通称ながどへい）校下（長町（ながまち）・長土塀・大和町（だいわまち）・三社町（さんじゃまち））',text:'芸術村（げいじゅつむら）のある大和町（だいわまち）は長土塀（ながどへ／通称ながどへい）校下。長土塀小学校（ながどへ(い)しょうがっこう）は1986年に閉校（閉校記念誌「ながどへい」）。旧町名の「高儀町」は今の長土塀2・3丁目、「向増泉（むかいますいずみ）」は長土塀3丁目。長土塀の由来は「武士の屋敷の土塀が長く続いていた」（検定の旧町名問題）。長土塀3丁目と御影町（みかげまち）を結ぶ御影大橋（みかげおおはし・2005年完成）は、アーチが1本だけの「単弦アーチ型」。',src:'金沢市立図書館「金沢の校下の地誌」／'+'金沢検定アプリ（北國新聞社『金沢検定 攻略の基礎知識』準拠）'},
   {at:0,cat:'歴史',rank:'◎',name:'目の前の犀川（さいがわ）',text:'犀川（さいがわ）は「男川（おとこがわ）」、浅野川（あさのがわ）は「女川（おんながわ）」。犀川大橋（さいがわおおはし）から下流は新橋・御影大橋（みかげおおはし）・新御影橋（しんみかげばし）・大豆田大橋（まめだおおはし）・若宮大橋（わかみやおおはし）…と続く。犀川大橋の初代は1594年（文禄（ぶんろく）3年）利家（としいえ）が北国街道に架け、今の橋は1924年（大正13年）の鋼製曲弦ワーレントラス、長さ約62m、2000年に国登録有形文化財。2024年7月7日に「百寿祭」。',src:K+'／国交省金沢河川国道事務所／tabi-mag'},
   {at:5,cat:'用水',rank:'◎',name:'大野（おおの）庄用水（長土塀（ながどへ／通称ながどへい）を西へ流れる）',text:'金沢で最も古い用水。前田利長（まえだとしなが）の家臣・富永佐太郎（とみながさたろう）が天正（てんしょう）年間（1573〜92年）に開削。取水口は犀川（さいがわ）桜橋の上流右岸、延長約10.2km・幅約6m。金沢城（かなざわじょう）を築くとき木材を運んだことから「御荷川（おにかわ／おにがわ）」「鬼川（おにかわ／おにがわ）」。長町（ながまち）武家屋敷では土塀沿いを流れ、屋敷の庭の曲水（きょくすい）にも使われる。丑の刻に防火と無病息災を願って8つの橋を渡る「鬼川の八つ橋巡り」。長町→長土塀（ながどへ／通称ながどへい）→戸板（といた）・鞍月（くらつき）・大野（おおの）・金石（かないわ）の田へ。疎水百選（そすいひゃくせん）。',src:K+'／石川県「歴史的用水探訪 第一回」'},
   {at:5,cat:'町',rank:'◎',name:'三社町（さんじゃまち）',text:'長土塀（ながどへ／通称ながどへい）校下の町。豊田白山神社（とよたはくさんじんじゃ）は「三社（さんじゃ）の宮」とも呼ばれ、拝殿（はいでん）や神門（しんもん）など約300年前の姿をよく残す。洋学者・大屋愷敆（おおやよしあつ・1839年三社町生まれ、藩校（はんこう）壮猶館の翻訳方、金城霊沢（きんじょうれいたく）横に顕彰碑）の出身地。金沢市女性センター（かなざわしじょせいセンター・三社町（さんじゃまち）1-44）。『三社小史』（1965年）は町名整理で消えゆく旧町名を偲んで編まれた。',src:K+'／金沢市立図書館「金沢の校下の地誌」'},
   {at:6,cat:'交通',rank:'◎',name:'まめだ大通り',text:'犀川（さいがわ）の大豆田大橋（まめだおおはし）から北へ、金沢駅（かなざわえき）西口方面へ抜ける幹線。「大豆田（まめだ）」の読みは「まめだ」。大豆田大橋は犀川大橋（さいがわおおはし）から数えて下流4番目の橋。',src:K+'／金沢市 スタンプポイント資料'},
   {at:6,cat:'用水',rank:'◎',name:'この先の中橋町（なかばしまち）で、大野（おおの）庄用水と鞍月用水（くらつきようすい）が合流する',text:'長田町（ながたまち）小のすぐ北・中橋町（なかばしまち・JRの高架をくぐる「中橋（なかばし）」）で大野（おおの）庄用水と鞍月用水（くらつきようすい）が合流し、木曳川（きびきがわ）と樋俣用水（ひまたようすい）に分かれて犀川（さいがわ）河口へ注ぐ。金沢最古と2番目に古い用水が、ここで一つになる。',src:K},
   {at:6,cat:'交通',rank:'★',name:'長田一丁目バス停（ふらっとバスは走ってない）',text:'金沢駅（かなざわえき）西口から三馬（みんま）・大野（おおの）線が通る。ふらっとバスの4ルート（此花（このはな）・菊川（きくがわ）・材木・長町（ながまち））はここには来ていない——駅の東側の細い道のための発明やから。',src:K+'／金沢まるっと「金沢の足」'}

   {cat:'建物',rank:'◎',name:'長田町小学校（ながたまちしょうがっこう）の年表',text:'1931年（昭和6年）6月3日、金沢市長田町尋常小学校として創立。1932年9月5日に長田町（ながたまち）で開校式、1933年5月7日に新築校舎落成。当時の所在地は「長田弓ノ町（ながたゆみのまち）一番丁1番地」。1941年に国民学校、1947年に今の名前。1988年（昭和63年）10月13日に改築落成。1948年の学制改革では長田中学校（ながたちゅうがっこう）がこの小学校の中に置かれてスタートした。',src:'Wikipedia（金沢市立長田町小学校・長田中学校）／長田中学校公式「長田中学校の歴史」'},
   {cat:'町',rank:'◎',name:'旧町名「長田弓ノ町（ながたゆみのまち）」＝御持弓組足軽の組地（くみち）',text:'学校の旧住所に残る「長田弓ノ町（ながたゆみのまち）」は、藩主の弓を持つ「御持弓組」の足軽（あしがる）が住んだ組地（くみち）。加賀藩では足軽や小者が住んだ場所を「組地」といい、組単位でまとめて支給された。ほかの旧町名：与力町（よりきまち）＝与力組、早道町（はやみちまち）＝藩の足軽飛脚、二十人町（にじゅうにんまち）＝鉄砲足軽20人、御小人町（おこびとまち）・御仲間町（おちゅうげんまち）・御徒町（おかちまち）…。城下町の西の外れ、足軽と田んぼの町やった。',src:K},
   {cat:'歴史',rank:'◎',name:'校門の隣：長田菅原神社（ながたすがわらじんじゃ・長田1-5-3）',text:'菅原道真（すがわらのみちざね）を祀る金沢市内屈指の古社。社記では平安時代の長和（ちょうわ）元年（1012年）創立。延久（えんきゅう）元年（1069年）に一国一社の天満宮を造る勅命（ちょくめい）が出て加賀では長田に天神を建てた説も。天正（てんしょう）5年（1577年）上杉謙信の兵火（へいか）で社殿と旧記が焼失、文禄（ぶんろく）年間（1592〜96年）に復興。拝殿（はいでん）は、金沢城（かなざわじょう）北の丸にあった東照宮（とうしょうぐう・4代光高が1643年創建、「北陸の日光」。今の尾崎神社（おざきじんじゃ））の護摩堂（ごまどう）——1878年（明治11年）に尾崎神社が丸の内へ移る際、全面移築が難しく護摩堂だけ長田菅原神社（ながたすがわらじんじゃ）に譲られた。明治6年に長田天満宮から長田菅原神社に改称。拝殿は市の記念文化財。境内に臥牛（ねまりうし）。「金沢お宮さんめぐり」36社の一つ。',src:K+'／kanazawa-jisha.com／4travel'},

   {cat:'校下',rank:'★',name:'校下（こうか）は61、学校は52',text:'校下（こうか）はもともと小学校区。金沢では町会・公民館・児童館・消防分団が校下ごとに動く暮らしの単位。学校は統廃合で減ったが校下は残った。公民館61館＝中核市（ちゅうかくし）平均31館の2倍（金沢方式（かなざわほうしき））。',src:'金沢まるっと「校下ってなんや？」／市「金沢方式あり方検討懇話会」資料'}

   {n:'宗叔町二〜五番丁',y:'そうしゅくちょう',now:'玉川町・芳斉1・2丁目',text:'元禄のころ堀宗叔という医師が住んでいた。堀家は代々藩医。中央小の敷地はここ。'},
   {n:'三構',y:'みつがまえ',now:'芳斉1・2丁目',text:'もと高厳寺前といったが、これを光岩寺とも書き、光岩前を略して「みつがんまえ」と呼んだことから。'},
   {n:'白銀町',y:'しろがねちょう',now:'本町1・2丁目・玉川町・武蔵町',text:'藩政初期は安江村。町地が広がって安江木町となり、その一角に白銀細工師がいたため町名に。大島鎌吉の出身地。'},
   {n:'六枚町',y:'ろくまいまち',now:'芳斉2丁目・本町2丁目',text:'藩政前期からの町人町で、宅地税の地子銀が年間六枚だったことから。平成16年6月1日復活。'},
   {n:'弓ノ町',y:'ゆみのまち',now:'本町1・2丁目',text:'弓組の侍が住んでいたところ。後弓ノ町・升形弓ノ町とも呼ばれ、明治5年にこの名に。升形はここ。'},
   {n:'勝尾町',y:'かつおまち',now:'芳斉2丁目・昭和町',text:'加賀藩士・勝尾氏の屋敷があったことによる。'},
   {n:'島田町',y:'しまだまち',now:'本町2丁目・昭和町',text:'藩政初期〜元禄に島田勘兵衛の屋敷。邸地返上後「島田勘兵衛上地町」、享保の町絵図で島田町。'},
   {n:'玉井町',y:'たまのいまち',now:'本町2丁目・昭和町',text:'加賀藩士・禄高5,000石の玉井氏の屋敷と家中町。玉川町の「玉」はここ？（由来は未確認）'},
   {n:'田丸町',y:'たまるまち',now:'本町1・2丁目・昭和町',text:'藩政初期に田丸兵庫が住んだところ。兵庫は寛永期に大聖寺藩に仕えたので「田丸兵庫上ヶ地町」→略して田丸町。'},
   {n:'英町',y:'はなぶさちょう',now:'芳斉2丁目・本町2丁目',text:'もと安江木町の一部。町内に英田広済寺があったことから、1823年の町名改めで「英」の一字を用いた。'},
   {n:'柳町',y:'やなぎまち',now:'本町1丁目・昭和町',text:'伊予西条城主だった一柳監物の預所があり、その名にちなむ。柳の木があった説も。'},
   {n:'古道一番丁',y:'ふるみちいちばんちょう',now:'昭和町・芳斉2丁目',text:'城下から宮腰への古い道。1616年に新往還ができて「古道」と呼んだ。'},
   {n:'木ノ新保六番丁',y:'きのしんぼろくばんちょう',now:'本町2丁目',text:'石川郡石浦庄木の新保村。藩政初期に金沢城近くの西側からこの地に移り一帯を木ノ新保と総称。明治4年「白髭前」が六番丁に。'},
   {n:'鍛冶町・鍛冶片原町',y:'かじまち',now:'此花町・本町1丁目・彦三町1丁目・安江町・笠市町',text:'3代利常から刀鍛冶等で宅地を給わった者が集住し「安江鍛冶町」。町の東側は外惣構堀。→ 安江八幡宮の通称「鍛冶八幡さん（かじはちまんさん）」の由来。'},
   {n:'石屋小路',y:'いしやしょうじ',now:'武蔵町',text:'もと安江町横町。藩の御用を勤める石工たちが住んでいた。明治4年からの町名。'},
   {n:'五寶町',y:'ごぼうまち',now:'安江町・笠市町・瓢箪町',text:'西末寺（西別院）の門前。藩政時代は西末寺町・西御坊町とも。明治4年に改名。'},
   {n:'象眼町',y:'ぞうがねまち',now:'笠市町・安江町',text:'象嵌師が住んでいた地子町。「ずがねまち」「ぞうがんまち」とも。'},
   {n:'袋町',y:'ふくろまち',now:'安江町・尾張町2丁目',text:'藩政期の本町の一つで、この町筋が北国街道。道の両端が曲がって袋のようだったから。平成19年3月1日復活。'},
   {n:'荒町一〜三丁目',y:'あらまち',now:'本町1丁目・此花町・堀川町',text:'寛永年間は木ノ新保新町。荒町は新町の意。'}

  detours:[
   {cat:'歴史',rank:'◎',name:'玉川公園（たまがわこうえん）横の西外惣構（にしそとそうがまえ）跡（復元）',dist:'校門の隣',text:'鞍月用水（くらつきようすい）の流れを使った「西外惣構（にしそとそうがまえ）」の跡が、玉川公園（たまがわこうえん）横に復元整備されている（平成27〜29年度の市の事業）。惣構（そうがまえ）は1599年に利長（としなが）が高山右近（たかやまうこん）に、1610年に利常（としつね）が篠原一孝（しのはらかずたか）に命じて造らせた城下町の防御線。内惣構（うちそうがまえ）約2.9km、外惣構（そとそうがまえ）約4.2km。',src:'金沢市 歴史的環境形成総合支援事業資料／金沢検定'},
   {cat:'歴史',rank:'◎',name:'升形（ますがた・六枚町（ろくまいまち））',dist:'校門から北へ約300m',text:'西外惣構（にしそとそうがまえ）と旧宮腰往還（みやのこしおうかん）が交わる地点に、高さ約5mの土盛り建造物「升形（ますがた）」が2018年に復元された。城下町に外から敵が入るのを防ぐ仕掛け。六枚町（ろくまいまち）の名は「地税が銀6枚だった」ことに由来し、2004年に復活した旧町名。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'高巌寺（こうがんじ・芳斉（ほうさい）2丁目）',dist:'校門から西へ約300m',text:'臨済宗。加賀蕉門の支援者・生駒万子（いこままんし・家禄1,000石、金沢を発つ芭蕉（ばしょう）を松任（まっとう）まで追いかけて餞別を渡そうとした人）の墓。旧町名「三構（みつがまえ）」は「高巌寺（こうがんじ）前から光岩寺（こうがんじ）前」を略した「みつがんまえ」が変化したもの。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'玉川町（たまがわちょう）が生んだ実業家・野口遵（のぐちしたがう）',dist:'校門一帯',text:'1873年（明治6年）玉川町（たまがわちょう）生まれ。日本窒素肥料（にほんちっそひりょう・現・チッソ）を中核に「日窒コンツェルン（にっちつコンツェルン）」を築き、朝鮮半島に大規模な水力発電所（すいりょくはつでんしょ）を建設。旭化成（あさひかせい）の前身・日本ベンベルグ絹糸（にほんベンベルグけんし）も設立。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'白銀町（しろがねちょう）が生んだ金沢初の五輪メダリスト・大島鎌吉（おおしまけんきち）',dist:'校門から北東へ約200m',text:'旧白銀町（しろがねちょう）出身。1932年ロサンゼルス五輪の三段跳びで銅メダル、金沢出身者初の五輪メダリスト。1936年ベルリンで旗手、1964年東京では日本選手団長。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'安江八幡宮（やすえはちまんぐう・此花町（このはなまち））＝鍛冶八幡さん',dist:'校門から北へ約400m',text:'939年（天慶（てんぎょう）2年）創建とされ、郷土玩具「加賀八幡起上り（かがはちまんおきあがり）」発祥の地。安全の神様の水天宮（すいてんぐう）も。藩政期（はんせいき）の「金沢五社（かなざわごしゃ）」（宇多須（うたす）・神明宮（しんめいぐう）・小坂（こさか）・椿原天満宮（つばきはらてんまんぐう）・安江八幡宮（やすえはちまんぐう））の一つ。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'金沢製糸場（かなざわせいしじょう）跡（長町（ながまち）川岸・現長町1丁目）',dist:'校門から南東へ約400m',text:'1874年、長谷川準也（はせがわじゅんや・のちの2代目金沢市長）らが建てた県内初の近代的工場。富岡製糸場（とみおかせいしじょう）に次ぐ全国2番目の規模。鞍月用水（くらつきようすい）の水力で操糸機を回した。長町（ながまち）に建てたのは鞍月（くらつき）・大野（おおの）庄の2用水があったから。繰糸機を作った大工・津田吉之助（つだきちのすけ）の子が津田米次郎（つだよねじろう・国内初の動力式絹力織機）、その縁者が津田駒工業（つだこまこうぎょう）を創業。',src:'金沢検定'}
  ],
  kentei:[{"q": "後に金沢市長となる長谷川準也は1874（明治7）年、明治維新で職を失った士族のために鞍月用水の水流を利用した金沢（　　）を現在の長町中学校あたりに開設した。", "o": ["製粉会社", "陶器会社", "製糸場", "発電所"], "a": 2, "e": "金沢製糸場は長谷川準也（のちの2代目金沢市長）らの主導で長町川岸（現・長町1丁目）に建てられた。敷地約3000坪、煉瓦造りで動力に蒸気を使う県内初の近代的工場。操糸機の動力源に鞍月用水の水力も使い、当時は官営の富岡製糸場（群馬県）に次ぐ規模だったという。"}, {"q": "金沢の惣構のうち、旧金谷門(尾山神社横あたり)から近江町、主計町を経て浅野川に注ぐ延長約1.6キロのものは（　　）である。", "o": ["東内惣構", "西内惣構", "東外惣構", "西外惣構"], "a": 1, "e": "東内惣構(九人橋川)＝旧小尻谷町(東兼六町)から始まり旧味噌蔵町、橋場町(枯木橋)を巡り主計町で浅野川に注ぐ、延長約1.3キロ。西内惣構(母衣町川・辰巳用水の一部)＝旧金谷門から近江町、主計町を経て浅野川に注ぐ、延長約1.6キロ、2010年に主計町の緑水苑内に惣構が部分的に復元された。東外惣構(源太郎川の一部)＝八坂付近の霞ケ滝が起点、すぐに源太郎川に合流し材木町の西側を経て浅野川に注ぐ、延長約1.4キロ。西外惣構(鞍月用水及び辰巳用水の一部)＝中村記念美術館北側(本多家屋敷内崖下)から香林坊、長町を経て鞍月用水と共用され東別院裏で2方向に分かれ浅野川へ、四つのうち最長約2.8キロ。"}, {"q": "金沢城を築く際に木材を運んだことから「御荷川」「鬼川」とも呼ばれる用水はどれか。", "o": ["大野庄用水", "辰巳用水", "鞍月用水", "長坂用水"], "a": 0, "e": "大野庄用水は一説に金沢城築城の木材を城下まで運んだことから御荷川・鬼川とも呼ばれる。長町武家屋敷跡では土塀沿いを流れ、屋敷内庭園の曲水にも利用される。中橋町で鞍月用水と合流後、木曳川と樋俣用水に分流し犀川河口に注ぐ。"}, {"q": "城南2丁目の犀川上菊橋上流右岸を取水口とし、香林坊を通って西外惣構に利用された延長約14.6キロの用水はどれか。", "o": ["鞍月用水", "大野庄用水", "辰巳用水", "中村高畠用水"], "a": 0, "e": "鞍月用水は開削の起源が中世までさかのぼるといわれるが定かでない。取水口は城南2丁目の犀川上菊橋上流右岸。油車町・里見町などを経て西外惣構に利用され、香林坊を通り、一部は大野庄用水に合流する。延長約14.6キロ。明治〜大正期には長町近辺で金沢製糸場の機械を動かすなど工場の動力に使われた。"}, {"q": "明治から大正期にかけて、長町近辺で金沢製糸場の機械を動かすなど工場の動力として利用された用水はどれか。", "o": ["鞍月用水", "辰巳用水", "長坂用水", "旭用水"], "a": 0, "e": "鞍月用水は明治〜大正期に長町近辺で金沢製糸場の機械を動かすなど、工場の動力として利用された。"}, {"q": "1617（元和3）年、金沢における歌舞伎興行の最初と言われる女歌舞伎一座の興行はどこで行われたか。", "o": ["鞍月用水べり", "犀川河原", "浅野川河原", "卯辰山"], "a": 0, "e": "3代利常は母の寿福院を慰めるために音曲諸芸を勧め、1617年に鞍月用水べりの女歌舞伎一座が興行したのが金沢の歌舞伎興行の最初とされる。1631年の大火を機に興行を禁止し、1663年と1732年にも禁止令を出した。"}, {"q": "1874年(明治7)、「金沢製糸場」が長町の川岸につくられた。当時としては国がつくった富岡製糸場に次いで全国第2位の大きさの工場で、鞍月用水から水を引き、大きな水車を使って機械を動かしていた。この「金沢製糸場」をつくった人物は誰か。", "o": ["稲垣義方", "森下八左衛門", "長谷川準也", "津田米次郎"], "a": 2, "e": ""}, {"q": "金沢の内惣構は延長約2.9キロ、外惣構は延長約（　　）キロである。", "o": ["3.2", "4.2", "5.2", "6.2"], "a": 1, "e": "内惣構は延長約2.9キロ、外惣構は延長約4.2キロ。近年、内・外惣構ともに17世紀初めの同時期に造られたとの説もある。2018(平成30)年、西外惣構と旧宮腰往還が交わる地点に高さ約5メートルの土盛り建造物の「升形」が復元された。これは城下町に外からの敵の侵入を防ぐため設けられた。"}, {"q": "2018年（平成30）、金沢市本町に、金沢城西外惣構の「升形」が復元された。加賀藩3代藩主前田利常がこの升形を造らせた目的は何か。", "o": ["火事が起きたときに、上に立って町民に知らせるため", "外敵の侵入を防ぎ、城を守るため", "他の大名に、前田家の力の強さを示すため", "近くに前田家の城があることを知らせるため"], "a": 1, "e": ""}, {"q": "前田家が編纂した加賀藩史料のうち、15代当主前田利嗣のもとで1899(明治32)年に刊行されたものは『（　　）』である。", "o": ["加賀藩史稿", "加賀松雲公", "加賀藩史料", "太梁公日記"], "a": 0, "e": "版籍奉還の後、慶寧は加賀藩と前田家の歴史編纂に着手するよう指示した。1874年に慶寧が死去すると一時中断したが、15代当主前田利嗣のもとで再開され、旧加賀藩領内外の史料を収集、筆写し『加賀藩史稿』(1899年)、『加賀松雲公』(1909年)を刊行。以後、史料そのものを刊行する方針を採り、日置謙を中心に1929(昭和4)年以降順次『加賀藩史料』として刊行した。収集された史料の大部分は金沢市立玉川図書館近世史料館に「加越能文庫」として保存されている。"}, {"q": "前田家の史料編纂で収集された史料の大部分は、金沢市立玉川図書館近世史料館に「（　　）」として保存されている。", "o": ["尊経閣文庫", "加越能文庫", "前田文庫", "松雲文庫"], "a": 1, "e": "『加賀藩史料』の刊行(1929年以降、日置謙が中心)で収集された史料の大部分は玉川図書館近世史料館に「加越能文庫」として保存されている。一方、前田家伝来の典籍・古文書・美術工芸品は前田育徳会(尊経閣文庫)が保存・管理する。"}, {"q": "加賀八家の職務は「年寄中可相拗御用向大概覚書」に記されており、この史料が収められているのは（　　）である。", "o": ["尊経閣文庫", "加越能文庫", "金沢文庫", "前田育徳会"], "a": 1, "e": "八家は人持組の頭役として軍団を指揮する立場でもあり、この階層から常時4家が叙爵して安房守、土佐守などと国守号を称した。職務は多岐にわたり、「年寄中可相拗御用向大概覚書」(加越能文庫)によると江戸中期の具体的業務として対幕府、領国、家中の法度、藩士跡目、借銀証文、算用場、作事場、割場、会所にかかわることなどが記されている。"}, {"q": "市立玉川図書館に付属するレンガ造2階建ての近世史料館は、もともと何の建物だったか。", "o": ["煙草工場(旧専売公社C-1号工場)", "陸軍兵器庫", "製糸工場", "県庁本館"], "a": 0, "e": "近世史料館は旧専売公社C-1号工場という煙草工場で、1913(大正2)年に旧大蔵省臨時建築部が建設。1972(昭和47)年の工場移転後、回廊式の建物の一部を市が譲り受け図書館別館として保存活用。国登録有形文化財。"}, {"q": "1631年（寛永8）の大火災の後、本丸に変わって政治の中心になった藩主の住まいで、内外装の材料や寸法、技法などを記した仕様書が2020年（令和2）に玉川図書館近世史料館で見つかり、復元が検討されている金沢城の建物はどれか。", "o": ["天守閣", "一の丸御殿", "二の丸御殿", "大手門"], "a": 2, "e": ""}, {"q": "金沢市立図書館は現在4館ある。研究者などにも利用される古文書などを集めて保存する近世史料館が付属している図書館はどれか。", "o": ["玉川こども図書館", "玉川図書館", "泉野図書館", "金沢海みらい図書館"], "a": 1, "e": ""}, {"q": "金沢市には、現在4つの図書館がある。古文書などを集めて保存する近世史料館が付属している図書館はどれか。", "o": ["玉川図書館", "泉野図書館", "玉川こども図書館", "金沢海みらい図書館"], "a": 0, "e": ""}, {"q": "金沢市内には、さまざまな文化施設があります。その中で、玉川町にある金沢市立玉川図書館横の近世史料館の建物は、昔は何に使われていたものでしょうか。", "o": ["たばこの倉庫", "紡績（糸を作る）工場", "金沢大学附属小・中学校", "陸軍の兵器倉庫"], "a": 0, "e": ""}, {"q": "市の文化施設18カ所の2023（令和5）年度入館者数は計225万人余で、増加率トップは「（　　）の背景美術」を題材とした企画展が好評だった谷口吉郎・吉生記念金沢建築館の2万3418人（38.6%増）だった。", "o": ["映画", "ミュージカル", "テレビドラマ", "アニメ"], "a": 3, "e": "企画展「アニメ背景美術に描かれた都市」は2023年6月17日〜11月19日に開催され、アニメ6作品の手書き背景美術などを展示。開幕前日のフォーラムでは美術監督の草森秀一さんと木村真二さんが背景制作を語った。"}, {"q": "2019（令和元）年に開館した谷口吉郎・吉生記念金沢建築館の2階には、1974（昭和49）年に谷口吉郎氏の設計により建てられた東京の迎賓館赤坂離宮の和風別館（　　）の広間と茶室が原寸大で再現されている。", "o": ["東光庵", "松韻亭", "清恵庵", "游心亭"], "a": 3, "e": "迎賓館本館の東側に建つ和風別館「游心亭」は谷口吉郎氏の設計により1974年に建設された。迎賓館本館で執り行われる行事や接遇が洋式であるのに対し、和風の意匠と純日本のおもてなしで諸外国の賓客をお迎えするための施設として利用されている。"}, {"q": "1978(昭和53)年10月に金沢市名誉市民の称号が最初に贈られた3人は、谷口吉郎・林屋亀次郎と誰か。", "o": ["松田権六", "高光一也", "土井登", "蓮田修吾郎"], "a": 0, "e": "1978(昭和53)年10月、谷口吉郎・林屋亀次郎・松田権六の3氏に名誉市民の称号が贈られたのを皮切りに、2025(令和7)年5月現在15人が登録されている。"}, {"q": "金沢市名誉市民第1号で、市立玉川図書館・県美術館(現いしかわ生活工芸ミュージアム)・徳田秋声文学碑・室生犀星文学碑などを手がけ、明治村の初代館長を務めた建築家は誰か。", "o": ["谷口吉郎", "谷口吉生", "片岡安", "矢橋賢吉"], "a": 0, "e": "谷口吉郎(1904〜1979)は日本建築界を代表する国際的な建築家で文化勲章受章。作品に市立玉川図書館、県美術館(現いしかわ生活工芸ミュージアム)、徳田秋声文学碑、室生犀星文学碑。明治村の初代館長。名誉市民第1号(1978年10月)。"}, {"q": "ニューヨーク近代美術館や東京国立博物館法隆寺宝物館などを設計し、金沢市における作品に鈴木大拙館がある名誉市民(2022年)は誰か。", "o": ["谷口吉生", "谷口吉郎", "片岡安", "蓮田修吾郎"], "a": 0, "e": "谷口吉生(1937〜2024)は日本建築界を代表する建築家で、ニューヨーク近代美術館や東京国立博物館法隆寺宝物館などを設計。金沢市における作品に鈴木大拙館。2022年名誉市民。父は名誉市民第1号の谷口吉郎。"}, {"q": "2019(令和元)年7月に寺町5丁目に開館した「谷口吉郎・吉生記念金沢建築館」のテーマは何か。", "o": ["建築とまちづくり", "建築と工芸", "建築と自然", "建築と文学"], "a": 0, "e": "谷口吉郎・吉生記念金沢建築館は2019(令和元)年7月寺町5丁目に開館。名誉市民第1号の谷口吉郎を顕彰し「建築とまちづくり」をテーマとする。吉郎の住居があった場所に建ち、犀川や市街地を望む。2階には吉郎が手がけた迎賓館赤坂離宮和風別館「游心亭」の広間と茶室を再現。設計は長男の吉生。敷地面積2032平方メートル・建築面積823平方メートル。"}, {"q": "谷口吉郎・吉生記念金沢建築館の2階に再現されている、吉郎が手がけた迎賓館赤坂離宮和風別館の名は何か。", "o": ["游心亭", "清香軒", "対青軒", "夕顔亭"], "a": 0, "e": "建築館2階には文化勲章受章者の吉郎が手がけた迎賓館赤坂離宮和風別館「游心亭」(港区元赤坂)の広間と茶室が再現されている。再現の設計は東京国立博物館法隆寺宝物館などを手がけた吉生。"}, {"q": "石川県美術館が1959年10月、兼六園の小立野口に開館した際に設計した金沢出身の建築家は誰か。", "o": ["谷口吉郎", "谷口吉生", "妹島和世", "西沢立衛"], "a": 0, "e": "1959年10月、金沢出身の建築家・谷口吉郎(日本芸術院会員)の設計で県立の石川県美術館が兼六園の小立野口に開館。障子を思わせる意匠が清楚な趣を漂わせる建物で、地方の県立美術館として最も早く設立された一つ。"}, {"q": "卯辰山の徳田秋声文学碑を設計した、金沢出身の建築家は誰か。", "o": ["谷口吉郎", "谷口吉生", "片岡安", "丹下健三"], "a": 0, "e": "秋声文学碑は、金沢出身で後に文化勲章を受章する建築家・谷口吉郎が設計した。武家屋敷の土塀をモチーフとし、秋声自筆の陶板がはめこまれている。"}, {"q": "2011年10月に本多町3丁目に開館した「鈴木大拙館」を設計した金沢ゆかりの建築家は誰か。", "o": ["谷口吉生", "谷口吉郎", "丹下健三", "安藤忠雄"], "a": 0, "e": "鈴木大拙館は生誕地近くの本多町3丁目に2011年開館。谷口吉生が設計し、2020年に第33回村野藤吾賞を受賞。展示、学習、思索の三つの空間棟で構成され、思索空間棟は本多の森を借景とし、浅く水をたたえた「水鏡の庭」が特色。"}, {"q": "近代建築の巨匠として知られ、1978年に金沢市名誉市民第1号となった建築家は誰か。", "o": ["谷口吉郎", "谷口吉生", "片岡安", "丹下健三"], "a": 0, "e": "谷口吉郎は1904（明治37）年、片町生まれ。生家は九谷焼の窯元「谷口金陽堂」。石川県立第二中学校、四高を経て東京帝国大学工学部建築学科に進学。1943年、東京工業大学教授となった。1973年文化勲章、1978年金沢市名誉市民第1号。"}, {"q": "谷口吉郎の生家は何の窯元だったか。", "o": ["九谷焼（谷口金陽堂）", "大樋焼", "珠洲焼", "加賀焼"], "a": 0, "e": "生家は九谷焼の窯元「谷口金陽堂」だった。"}, {"q": "谷口吉郎が開設に尽力し、1964年に初代館長となった施設は何か。", "o": ["博物館明治村（愛知県犬山市）", "東京国立博物館", "金沢市立玉川図書館", "国立近代美術館"], "a": 0, "e": "谷口吉郎は博物館明治村（愛知県犬山市）の開設に尽力し、1964（昭和39）年に初代館長となった。"}],
  spots:[
   {at:0,cat:'建物',rank:'◎',name:'金沢市民芸術村（Lv1と同じ）',text:'1996年開村・大和紡績（だいわぼうせき）工場跡・24時間年中無休・稼働率ほぼ100%・埋蔵文化財包蔵地（まいぞうぶんかざいほうぞうち）・長土塀（ながどへ／通称ながどへい）校下・一角に金沢職人大学校（かなざわしょくにんだいがっこう）。',src:'市答申資料／金沢まるっと／'+'金沢検定アプリ（北國新聞社『金沢検定 攻略の基礎知識』準拠）'},
   {at:3,cat:'校下',rank:'◎',name:'長土塀（ながどへ／通称ながどへい）を東へ抜ける',text:'芸術村（げいじゅつむら・大和町（だいわまち））から東へ0.6km直進。長土塀（ながどへ／通称ながどへい）校下（長町（ながまち）・長土塀・大和町・三社町（さんじゃまち））の中を通る。旧町名「高儀町」＝今の長土塀2・3丁目。長土塀小学校（ながどへ(い)しょうがっこう）は1986年閉校。長土塀生まれの人物：藤井武（ふじいたけし・1888年生、内村鑑三（うちむらかんぞう）の影響を受けたキリスト教無教会派の伝道師）。',src:'金沢市立図書館「金沢の校下の地誌」／'+'金沢検定アプリ（北國新聞社『金沢検定 攻略の基礎知識』準拠）'},
   {at:3,cat:'建物',rank:'★',name:'長土塀青少年交流センター（ながどへ(い)せいしょうねんこうりゅうセンター）',text:'市役所の課の名前に住所が入った珍しい例。市には95の課、消防だけで4課。',src:'金沢まるっと「市役所どこに聞く？」'},
   {at:3,cat:'用水',rank:'◎',name:'大野（おおの）庄用水を横切る（長土塀（ながどへ／通称ながどへい））',text:'金沢最古。前田利長（まえだとしなが）の家臣・富永佐太郎（とみながさたろう）が天正（てんしょう）年間に開削、約10.2km・幅約6m。築城の木材を運んだ「御荷川（おにかわ／おにがわ）・鬼川（おにかわ／おにがわ）」。長町（ながまち）武家屋敷では土塀沿いを流れ、丑の刻の「鬼川の八つ橋巡り」の習わし。',src:K},
   {at:3,cat:'用水',rank:'◎',name:'鞍月用水（くらつきようすい）を横切る（玉川町（たまがわちょう））',text:'大野（おおの）庄用水に次いで古い。起源は中世までさかのぼるといわれるが定かでない（県の資料では1599年に高山右近（たかやまうこん）が総構堀（そうがまえぼり）として構築し油屋与助（あぶらやよすけ）が改修と伝える）。取水口は城南（じょうなん）2丁目・犀川（さいがわ）上菊橋の上流右岸、延長約14.6km。油車町（あぶらぐるまちょう）・里見町（さとみちょう）を経て西外惣構（にしそとそうがまえ）に使われ、香林坊（こうりんぼう・せせらぎ通り）を通り、長町（ながまち）→玉川町（たまがわちょう）→六枚町（ろくまいまち）→北西部の田へ。一部は大野庄用水に合流。明治〜大正は長町近辺の工場の動力にも使われた。疎水百選（そすいひゃくせん）。',src:K+'／石川県「歴史的用水探訪 第二回」'},
   {at:3,cat:'歴史',rank:'◎',name:'長町（ながまち）は明治の工業地帯やった',text:'1874年（明治7年）、のちの2代目金沢市長・長谷川準也（はせがわじゅんや）らが長町（ながまち）川岸（現・長町1丁目）に金沢製糸場（かなざわせいしじょう）を建てた。敷地約3,000坪の煉瓦造（れんがづくり）り、県内初の近代的工場で、富岡製糸場（とみおかせいしじょう）に次ぐ全国2番目の規模。鞍月用水（くらつきようすい）の水力で操糸機を動かした。長町に建てたのは鞍月（くらつき）・大野（おおの）庄の2つの用水があったから。一帯には水車（すいしゃ）が10〜20mおきに1基あった時代も。',src:K},
   {at:3,cat:'数字',rank:'◎',name:'金沢の用水は55本・合計約150km',text:'市内の用水は55本、全部合わせると約150km。市の用水保全審議会が55のうち20を保全指定（平成18年時点）。大野（おおの）庄・鞍月（くらつき）・長坂の3本が農水省「疎水百選（そすいひゃくせん）」。',src:K+'／金沢市 第24回用水保全審議会 会議録'},

  school:{name:'中央小学校（ちゅうおうしょうがっこう）',addr:'玉川町（たまがわちょう）2-1',spots:[
   {cat:'校下',rank:'◎',name:'ここは芳斎（ほうさい）校下（玉川町（たまがわちょう）・白銀町（しろがねちょう）・本町（ほんまち）・昭和町（しょうわまち）・六枚町（ろくまいまち）・芳斉（ほうさい）・三社町（さんじゃまち））',text:'芳斉町（ほうさいまち）の由来は武将・青木新兵衛芳斉。芳斉（ほうさい）2丁目の高巌寺（こうがんじ）には加賀蕉門の支援者・生駒万子（いこままんし・家禄1,000石）の墓。中央小は芳斉町小学校（ほうさいまちしょうがっこう・1980年の郷土副読本「のびゆく芳斉」あり）や長町小学校（ながまちしょうがっこう・1978年「校下（こうか）をさぐる」あり）などの統合校で、だから芳斎（ほうさい）・長町（ながまち）の校下には公民館があって学校がない。「中央小学校（ちゅうおうしょうがっこう）芳斎分校」の名に旧校の名残。※統合年・構成校は要確認。此花町（このはなまち）小は1995年に瓢箪町（ひょうたんまち）小と統合して明成（めいせい）小になった（中央小ではない）。',src:K+'／金沢市立図書館「金沢の校下の地誌」／金沢市公民館設置条例'},
   {cat:'歴史',rank:'◎',name:'加賀八家（かがはっか）・村井家の屋敷跡',text:'兼六園（けんろくえん）の名桜「旭桜（あさひざくら）」は村井家の屋敷（検定資料では「中央小学校（ちゅうおうしょうがっこう）跡」）から移植されたと伝わる（1937年に枯死、今は2代目）。村井家は利家（としいえ）の最初の家来・村井長頼（むらいながより・14歳で仕官、「前田氏第一の功臣」、隠居時1万1,245石）に始まる加賀八家（かがはっか）の一つ（1万6,500石）。',src:K},
   {cat:'建物',rank:'◎',name:'隣：近世史料館（きんせいしりょうかん）＝旧専売公社（せんばいこうしゃ）の煙草工場',text:'旧日本専売公社「C-1号工場」。明治44年（1911年）着工、大正2年（1913年）完成、旧大蔵省臨時建築部（おおくらしょうりんじけんちくぶ）の設計。煉瓦造（れんがづくり）2階建て・桟瓦葺き・全長280mの回廊式（かいろうしき）。浴場・理髪・食堂・保育所まで備えた。1972年の工場移転後、建物の一部を市が譲り受け図書館別館に。国登録有形文化財（1996年）。『加賀藩史料（かがはんしりょう）』編纂で集めた史料の大部分が「加越能文庫（かえつのうぶんこ）」としてここに保存されている。所蔵130,835点。',src:K+'／金沢市 IODD2019資料'},
   {cat:'建物',rank:'★',name:'隣：玉川図書館（たまがわとしょかん）・玉川こども図書館（たまがわこどもとしょかん）',text:'市の図書館4館の入館は年99.6万人、貸出181.7万冊。令和5年度は97万1,250人＝市民全員が年2回強通う計算、登録者16.9万人＝3人に1人。玉川こども図書館（たまがわこどもとしょかん）の「絵本の時間・ろうそくのおはなし会」は年346回、ほぼ毎日。玉川図書館（たまがわとしょかん）は建築的価値を残す改修の設計に1億円。2025年7月、玉川こども図書館に中高生の居場所「かなざわユースセンター」開設。',src:'金沢まるっと「金沢のハコモノ」「金沢の文化」／'+'金沢検定アプリ（北國新聞社『金沢検定 攻略の基礎知識』準拠）'},
   {cat:'歴史',rank:'◎',name:'玉川図書館（たまがわとしょかん）を設計した谷口吉郎（たにぐちよしろう・名誉市民第1号）',text:'谷口吉郎（たにぐちよしろう・1904〜1979）：金沢生まれ、実家は九谷焼（くたにやき）の窯元。作品に市立玉川図書館・県美術館（現いしかわ生活工芸ミュージアム）・徳田秋声（とくだしゅうせい）文学碑・室生犀星（むろうさいせい／むろおさいせい）文学碑・東宮御所（とうぐうごしょ）・迎賓館和風別館「游心亭（ゆうしんてい）」。明治村（めいじむら）の初代館長（1964年）。1973年文化勲章。1978年10月、林屋亀次郎（はやしやかめじろう）・松田権六（まつだごんろく）とともに金沢市名誉市民の第1号。息子の谷口吉生（たにぐちよしお・1937〜2024）はMoMA新館・法隆寺宝物館・鈴木大拙（すずきだいせつ）館、2022年名誉市民。寺町（てらまち）に谷口吉郎・吉生（よしお）記念金沢建築館（2019年開館）。',src:K},
   {cat:'交通',rank:'★',name:'此花（このはな）ルート＝ふらっとバス発祥',text:'1999年3月28日、此花（このはな）ルートから金沢ふらっとバスが始まった。4ルートは此花・菊川（きくがわ）・材木・長町（ながまち）。運賃100円、バス停約200m間隔、初代車両はオーストリア製、アナウンスは地元の小学生の声。',src:'金沢まるっと「金沢の足」／'+'金沢検定アプリ（北國新聞社『金沢検定 攻略の基礎知識』準拠）'}

   {cat:'歴史',rank:'◎',name:'【範囲外・此花町（このはなまち）】安江八幡宮（やすえはちまんぐう・鍛冶八幡さん）',text:'939年（天慶（てんぎょう）2年）創建とされ、郷土玩具「加賀八幡起上り（かがはちまんおきあがり）」発祥の地。安全の神様・水天宮（すいてんぐう）もまつる。藩政期（はんせいき）の「金沢五社（かなざわごしゃ）」（宇多須（うたす）・神明宮（しんめいぐう）・小坂（こさか）・椿原天満宮（つばきはらてんまんぐう）・安江八幡宮（やすえはちまんぐう））の一つ。',src:K},

   {cat:'交通',rank:'◎',name:'新橋（しんばし）で犀川（さいがわ）を渡る',dist:'中盤・犀川（さいがわ）',text:'まめだ大通りから犀川（さいがわ）を渡る橋。犀川大橋（さいがわおおはし）の下流。犀川は「男川（おとこがわ）」、浅野川（あさのがわ）は「女川（おんながわ）」。ここから南は寺町台地（てらまちだいち）の裾、昔の在所（村）が連なる地域に入る。',src:'金沢検定／国交省 金沢河川国道事務所'},
   {cat:'町',rank:'◎',name:'にし茶屋街（西茶屋街（にしちゃやがい））',dist:'校門から北東へ約500m',text:'加賀藩公認の三茶屋街の一つ（ひがし・にし・主計町（かずえまち））。文政3年（1820年）に町立て。大正期のベストセラー『地上』の作家・島田清次郎（しまだせいじろう）が幼年期を過ごした茶屋「吉米楼（きちべろう）」があり、市西茶屋資料館（しにしちゃやしりょうかん）がその外観を再現。大正時代、客を驚かそうと「飛行機」「ラジオ」などの風変わりな源氏名の芸妓がいた。',src:'金沢検定'},

   {cat:'歴史',rank:'◎',name:'寺町（てらまち）寺院群・伏見寺（ふしみでら）',dist:'校門から東へ約700m',text:'寺町台地（てらまちだいち）に約70の寺が集まる寺院群（国の重要伝統的建造物群保存地区）。伏見寺（ふしみでら）は養老元年（717年）、芋掘藤五郎（いもほりとうごろう）創建と伝わる古刹。金沢の地名の由来「芋を洗ったら砂金が出た＝金洗いの沢」の藤五郎の墓がある。',src:'金沢検定／tabi-mag'},

  kentei:[{"q": "大正時代に客を驚かせようと「飛行機」「ラジオ」などの風変わりな源氏名を持つ芸妓がいたのはどの茶屋街か。", "o": ["にし茶屋街", "ひがし茶屋街", "主計町", "橋場町"], "a": 0, "e": "にし茶屋街は古くから進取の気性に富むとされ、大正時代には「飛行機」「ラジオ」など風変わりな源氏名を持つ芸妓がいた。市西茶屋資料館は旧美川町(現白山市)出身で大正期のベストセラー作家・島田清次郎が幼年期を過ごした茶屋の外観を再現している。"}, {"q": "市西茶屋資料館が外観を再現している茶屋は、大正期のベストセラー作家（　　）が幼年期を過ごした茶屋である。", "o": ["島田清次郎", "徳田秋声", "室生犀星", "泉鏡花"], "a": 0, "e": "市西茶屋資料館は旧美川町(現白山市)出身で大正期のベストセラー作家・島田清次郎が幼年期を過ごした茶屋の外観を再現している。"}, {"q": "島田清次郎が5歳のとき、母と2人で移り住んだ西廓（現・にし茶屋街）の茶屋は何か。", "o": ["吉米楼", "春風楼", "三芳庵", "華の宿"], "a": 0, "e": "父・常吉の死後、母方の祖父・西野八郎が営んでいた西廓（現・にし茶屋街）の茶屋・吉米楼（現在は西茶屋資料館として当時の造りを再現）の一室を借りて、母・みつと2人で移り住んだ。"}, {"q": "『地上』の主人公で、母と共ににし茶屋街の「春風楼」に移り住む中学生は誰か。", "o": ["大河平一郎", "早瀬主税", "高野聖", "鏡太郎"], "a": 0, "e": "『地上』は母と共ににし茶屋街の「春風楼」に移り住む中学生・大河平一郎の青春を描いた作品。清次郎自身の吉米楼での暮らしが投影されている。"}, {"q": "室生犀星の「幼年時代」は（　　）での学校生活を描いている。", "o": ["中村町小学校", "野町小学校", "十一屋小学校", "菊川町小学校"], "a": 1, "e": "「幼年時代」は1919（大正8）年の「中央公論」に発表された短編小説で、犀星の処女作。幼い頃の自身の体験が描かれた自伝的小説で、「私はいつの間にか家でおとなしかったが学校では暴れものになっていた。私はよく喧嘩をした」などと記されている。"}, {"q": "金沢に生まれ、室生犀星らとともに「医峰」や「響」、「樹蔭」などの文芸誌を創刊した（　　）は後年、大伴家持の研究でも功績があった。", "o": ["尾山篤二郎", "小松砂丘", "加能作次郎", "鶴彬"], "a": 0, "e": "尾山篤二郎（1889〜1963年）は大正から昭和にかけての国文学者・歌人。室生犀星らと二葉会、北辰詩社を結成し文芸誌を創刊した。古典研究も行い、1951（昭和26）年、歌集「とふのすがごも」や「大伴家持の研究」の業績により日本芸術院賞を受賞、「大伴家持の研究」により東京大学の文学博士号を取得した。"}, {"q": "代表作「雪の喪章」がテレビドラマや映画にもなった、小説家で詩人の（　　）は、女性として初めて室生犀星の弟子になった。", "o": ["水芦光子", "広津里香", "井上雪", "芦田高子"], "a": 0, "e": "水芦光子（1914〜2003年）は現在の東山3丁目生まれで、県立金沢第二高等女学校の4年在学中に一家で大阪に移住。ファンレターを出した縁で室生犀星の弟子となった。「雪の喪章」はひがし茶屋街近くの金箔商に嫁いだ女性の半生を描いた小説で、1959（昭和34）年に出版、67年に若尾文子主演で映画化。"}, {"q": "兼六園の池のうち、5代綱紀が建てた蓮池御亭の庭池で園内最古とされるのは（　　）である。", "o": ["霞ケ池", "瓢池", "長谷池", "放生池"], "a": 1, "e": "瓢池は5代綱紀が建てた蓮池御亭の庭池であったといわれる。園内の池の中で最も古く、海石塔が立つ亀島と岩島がある。瓢池に注ぐ翠滝は金沢出身の文豪・室生犀星が園内で最も愛したといわれる。霞ケ池は園の中心部にあり園内の池の中で最も大きい。池を中心に霞ケ池拡張の際の残土を積み上げて築いたとされる栄螺山をはじめ内橋亭、徽軫灯籠、虹橋、唐崎松、蓬莱島などの名勝が配置されている。かつて観光用に屋形舟遊覧が行われていたこともある。"}, {"q": "室生犀星の小説『つくしこひしの歌』の舞台となり、1898(明治31)年の架け替えで「犀川新橋」から改名された橋はどれか。", "o": ["桜橋", "犀川大橋", "上菊橋", "雪見橋"], "a": 0, "e": "桜橋は幸町・川岸町と清川町を結ぶ。室生犀星の小説『つくしこひしの歌』の舞台で、犀星と妻とみ子の思い出の場所。1898(明治31)年の架け替えで「犀川新橋」から「桜橋」に改名され、現在の橋は1963(昭和38)年完成。"}, {"q": "金沢の三文豪の一人・室生犀星が養子に出され幼少時を過ごした、門前に「六地蔵」が安置されている千日町の寺はどれか。", "o": ["雨宝院", "静明寺", "妙法寺", "願念寺"], "a": 0, "e": "雨宝院(高野山真言宗・千日町)は室生犀星が養子に出され幼少時を過ごした寺。門前には「六地蔵」が安置されている。"}, {"q": "金沢区裁金石出張所の事務員だった室生犀星が下宿し、犀星の小説『海の僧院』の舞台となった金石北1丁目の寺はどれか。", "o": ["海月寺", "本龍寺", "道入寺", "法船寺"], "a": 0, "e": "海月寺(曹洞宗・金石北1丁目)は金沢区裁金石出張所の事務員だった室生犀星が下宿した寺で、犀星の小説『海の僧院』の舞台。"}, {"q": "金沢市名誉市民第1号で、市立玉川図書館・県美術館(現いしかわ生活工芸ミュージアム)・徳田秋声文学碑・室生犀星文学碑などを手がけ、明治村の初代館長を務めた建築家は誰か。", "o": ["谷口吉郎", "谷口吉生", "片岡安", "矢橋賢吉"], "a": 0, "e": "谷口吉郎(1904〜1979)は日本建築界を代表する国際的な建築家で文化勲章受章。作品に市立玉川図書館、県美術館(現いしかわ生活工芸ミュージアム)、徳田秋声文学碑、室生犀星文学碑。明治村の初代館長。名誉市民第1号(1978年10月)。"}, {"q": "泉鏡花が1939（昭和14）年に65歳で死去したのち、眠っている霊園はどこか。", "o": ["東京の雑司ケ谷霊園", "金沢の野田山墓地", "金沢の卯辰山", "東京の青山霊園"], "a": 0, "e": "鏡花は1939（昭和14）年に65歳で死去し、東京の雑司ケ谷霊園に眠る。犀星の墓は野田山、秋声の菩提寺は材木町の静明寺と区別したい。"}, {"q": "金沢市が浅野川左岸沿い、天神橋から中の橋に至る道路を整備して名づけた道は何か。", "o": ["鏡花のみち", "秋聲のみち", "犀星のみち", "主計町のみち"], "a": 0, "e": "金沢市は天神橋から中の橋に至る浅野川左岸沿いの道路を「鏡花のみち」として整備した。右岸の梅ノ橋〜中の橋は「秋聲のみち」、犀川両岸は「犀星のみち」。"}, {"q": "徳田秋声の命日は何月何日か。", "o": ["11月18日", "3月26日", "9月7日", "4月8日"], "a": 0, "e": "秋声は1943（昭和18）年11月18日に死去。文学碑の除幕式は1947年の命日に行われた。犀星の命日（犀星忌）は3月26日。"}, {"q": "卯辰山の秋声文学碑で、略歴の刻まれた副碑を筆で書いた作家は誰か。", "o": ["室生犀星", "川端康成", "徳田一穂", "井上靖"], "a": 0, "e": "文学碑の中央の石柱は長男の作家・徳田一穂、略歴の刻まれた副碑は室生犀星の筆による。川端康成は除幕式の講演会で「日本の小説は源氏にはじまって西鶴に飛び、西鶴から秋声に飛ぶ」と評した。"}, {"q": "1932年に室生犀星らが秋声のもとに集って発足させ、機関誌『あらくれ』を創刊した会は何か。", "o": ["秋声会（後のあらくれ会）", "二葉会", "北辰詩社", "人魚詩社"], "a": 0, "e": "1932年、室生犀星や尾崎士郎、井伏鱒二、舟橋聖一ら秋声ゆかりの作家たちが「秋声会」（後の「あらくれ会」）を発足させ、機関誌『あらくれ』を創刊した。"}, {"q": "東京都文京区に現存する徳田秋声の旧宅の庭に生い茂る竹は、誰から贈られたものか。", "o": ["室生犀星", "泉鏡花", "川端康成", "尾崎紅葉"], "a": 0, "e": "文京区の秋声旧宅（1906年建築・東京都指定史跡）の庭の竹は、同じく庭造りの趣味をもつ室生犀星から贈られた。秋声は真っ直ぐに伸びる竹の性質を愛した。"}, {"q": "室生犀星が1889（明治22）年に生まれた金沢の町はどこか。", "o": ["裏千日町（現・千日町）", "下新町", "横山町", "美川町"], "a": 0, "e": "室生犀星は1889（明治22）年、裏千日町（現・千日町）に生まれた。生家跡に2002（平成14）年開館の室生犀星記念館がある。本名は照道。"}, {"q": "室生犀星の本名は何か。", "o": ["照道", "末雄", "鏡太郎", "貞太郎"], "a": 0, "e": "犀星の本名は照道。詩人・小説家で、1962（昭和37）年に亡くなった。父・小畠弥左衛門吉種は150石どりの旧加賀藩士。"}, {"q": "室生犀星が生後まもなくから育てられた、真言宗寺院の名は何か。", "o": ["雨宝院", "宗源寺", "静明寺", "天徳院"], "a": 0, "e": "犀星は生家近くの真言宗寺院・雨宝院住職だった室生真乗の内縁の妻・赤井ハツに育てられた。室生の姓はこの縁による。"}, {"q": "室生犀星を育てた、雨宝院住職・室生真乗の内縁の妻は誰か。", "o": ["赤井ハツ", "小寺菊子", "目細てる", "湯浅しげ"], "a": 0, "e": "犀星は雨宝院住職・室生真乗の内縁の妻・赤井ハツに育てられた。実父は旧加賀藩士の小畠弥左衛門吉種。"}, {"q": "室生犀星が長町高等小学校を3学年で中退したのち、給仕として就職した先はどこか。", "o": ["金沢地方裁判所", "北國新聞社", "金沢市役所", "石川県庁"], "a": 0, "e": "犀星は1900年に長町高等小学校に入学するが3学年で中退し、金沢地方裁判所に給仕として就職。職場で河越風骨や赤倉錦風ら先輩に俳句を学び、文学に開眼した。"}, {"q": "室生犀星が15歳の時、北國新聞に掲載され「北國俳壇の最年少俳人」として注目された句は何か。", "o": ["水郭の一林紅しタ紅葉", "柿くへば鐘が鳴るなり", "古池や蛙飛び込む水の音", "朝顔につるべ取られて"], "a": 0, "e": "1904年、15歳の犀星の句「水郭の一林紅しタ紅葉」が北國新聞に掲載され、北國俳壇の最年少俳人として注目された。"}, {"q": "室生犀星が表棹影、尾山篤二郎らとともに結成した文学の会は何か。", "o": ["二葉会や北辰詩社", "人魚詩社", "あらくれ会", "我尊会"], "a": 0, "e": "犀星は表棹影、尾山篤二郎らとともに二葉会（『医峰』）や北辰詩社（『響』）を結成した。1907年には中央誌『新声』に詩「さくら石斑魚に添えて」が入選している。"}, {"q": "室生犀星が1909年、金沢地方裁判所金石出張所に転任し下宿した尼寺はどこか。", "o": ["宗源寺（現・海月寺）", "雨宝院", "静明寺", "妙立寺"], "a": 0, "e": "1909（明治42）年、犀星は金石出張所に転任し、尼寺・曹洞宗宗源寺（現・海月寺）に下宿。翌年上京した。"}, {"q": "室生犀星が上京後に師と仰いだ詩人は誰か。", "o": ["北原白秋", "萩原朔太郎", "尾崎紅葉", "山村暮鳥"], "a": 0, "e": "上京後の犀星は、師である北原白秋、盟友の萩原朔太郎らと親交を結び、詩人の地位を確固たるものとした。"}, {"q": "室生犀星の墓がある場所はどこか。", "o": ["野田山墓地", "卯辰山", "雑司ケ谷霊園", "雨宝院"], "a": 0, "e": "金沢を愛した犀星の墓は野田山墓地にある。命日（犀星忌）は3月26日。鏡花の墓は東京の雑司ケ谷霊園。"}, {"q": "室生犀星の命日「犀星忌」は何月何日か。", "o": ["3月26日", "11月18日", "9月7日", "1月1日"], "a": 0, "e": "犀星は1962（昭和37）年3月26日に死去。犀星と秋声は庭造りが共通の趣味で親交が深かったが、犀星と鏡花はあまり交流がなかった。"}, {"q": "犀川大橋から桜橋に至る犀川両岸の道筋は何と呼ばれているか。", "o": ["犀星のみち", "鏡花のみち", "秋聲のみち", "文学のみち"], "a": 0, "e": "犀川大橋から桜橋に至る両岸の道筋は「犀星のみち」と呼ばれている。"}, {"q": "室生犀星が1926年から1932年まで帰郷の折に土地を借りて庭造りをした寺はどこか。", "o": ["天徳院", "雨宝院", "大乗寺", "妙立寺"], "a": 0, "e": "犀星は1926年から1932年まで金沢の天徳院の土地を借り、帰郷の折に庭造りをした。その様子は小説『冬の蝶』（1927年）などに描かれている。"}, {"q": "室生犀星記念館の中庭に配置されている、犀星がとりわけ愛したものは何か。", "o": ["四方仏の手水鉢", "五重の石塔", "灯籠", "つくばい"], "a": 0, "e": "犀星は東京・田端から馬込に移ると庭造りに本腰を入れた。記念館の中庭には犀星がとりわけ愛した四方仏の手水鉢が配置されている。"}, {"q": "室生犀星が萩原朔太郎、山村暮鳥とともに1914（大正3）年に結成した詩社は何か。", "o": ["人魚詩社", "北辰詩社", "二葉会", "朱欒"], "a": 0, "e": "1914年、犀星は萩原朔太郎、山村暮鳥と「人魚詩社」を結成。翌年詩誌『卓上噴水』を発行したが3カ月の短命だった。その翌年、朔太郎らと詩誌『感情』を刊行した。"}, {"q": "室生犀星が萩原朔太郎らと1916年に刊行した詩誌は何か。", "o": ["感情", "卓上噴水", "朱欒", "医峰"], "a": 0, "e": "人魚詩社の詩誌『卓上噴水』は3カ月で終わり、その翌年、朔太郎らと詩誌『感情』を刊行した。師の北原白秋は詩誌『朱欒』の主宰者で「詩聖」と称せられた。"}, {"q": "室生犀星が俳句の指導を受けた、北声会の俳人は誰か。", "o": ["藤井紫影", "河越風骨", "赤倉錦風", "表棹影"], "a": 0, "e": "犀星は俳句では北声会の藤井紫影に指導を受けた。裁判所の先輩・河越風骨や赤倉錦風からも俳句を学んでいる。"}, {"q": "1924（大正13）年5月に室生犀星の招きで金沢を訪れた芥川龍之介が4泊5日滞在した兼六園の別荘は何か。", "o": ["三芳庵別荘", "成巽閣", "夕顔亭", "内橋亭"], "a": 0, "e": "芥川龍之介は犀星の招きで金沢を訪れ、兼六園の三芳庵別荘に4泊5日滞在した。三芳庵別荘は明治期に皇太子時代の大正天皇が茶を飲まれたことでも知られ、2008年に老朽化で取り壊された。"}, {"q": "芥川龍之介が加賀藩12代藩主前田斉広のエピソードを題材にした短編は何か。", "o": ["煙管", "金沢にて", "青い猿", "冬の蝶"], "a": 0, "e": "龍之介は短歌『金沢にて』で兼六園や卯辰山を詠み、短編『煙管』で加賀藩12代藩主前田斉広のエピソードを題材とした。龍之介とその周辺を題材にした犀星の作品に『青い猿』（1932年）がある。"}, {"q": "金沢を訪れた芥川龍之介が心を寄せたという「にし」の芸妓は誰か。", "o": ["しゃっぽ", "すず", "しげ", "てる"], "a": 0, "e": "龍之介は「にし」の芸妓「しゃっぽ」に心を寄せたという。犀星の日記や手紙に記されている。"}, {"q": "1889（明治22）年に横安江町に生まれ、右脚を切断して文学の道に進み、ふるさとを詠んだ短歌を多く残した歌人・国文学者は誰か。", "o": ["尾山篤二郎", "中西悟堂", "小松砂丘", "鶴彬"], "a": 0, "e": "尾山篤二郎は金沢商業学校在学中に膝関節を結核菌に冒され右脚を大腿部から切断。室生犀星や表棹影らと二葉会や北辰詩社を結成し、『医峰』『響』『樹蔭』などの文芸誌を創刊した。"}, {"q": "『歌のわかれ』の著者で、四高在学中に『北辰会雑誌』に作品を発表し、プロレタリア文学運動の中心となった作家は誰か。", "o": ["中野重治", "森山啓", "深田久弥", "杉森久英"], "a": 0, "e": "中野重治は1902（明治35）年現在の福井県坂井市生まれ。1919年に四高文科乙類に入学。東京帝国大学独逸文学科入学後、師事した室生犀星の援助を得て窪川鶴次郎、堀辰雄らと雑誌『驢馬』を創刊した。参院議員（共産党）も務めた。"}],

   {n:'五十人町',y:'ごじゅうにんまち',now:'白菊町・増泉ほか',text:'足軽（あしがる）五十人組（ごじゅうにんぐみ）が住んだことに由来。今は町名として残っていない。'}
  ],
  detours:[
   {cat:'町',rank:'◎',name:'新神田（しんかんだ）の地名',dist:'校門周辺',text:'「神田（しんでん・かんだ）」は、もともと神社の費用をまかなうためのお米をつくる田んぼのこと。この一帯は犀川（さいがわ）左岸の農地で、増泉（ますいずみ）・糸田町（いとだまち）にはさまれた在所（村）だった。',src:'金沢市公式／金沢検定'},
   {cat:'交通',rank:'◎',name:'新神田（しんかんだ）交差点・まめだ大通り',dist:'校門周辺',text:'新神田（しんかんだ）交差点は、金沢市街の南西を走る大きな交差点。国道157号・159号が交わる交通の要所で、駅西（えきにし）や有松（ありまつ）方面へつながる。',src:'金沢まるっと'},
   {cat:'町',rank:'◎',name:'増泉（ますいずみ）・泉（いずみ）の湧き水',dist:'校門から北東へ',text:'このあたり「泉（いずみ）」「増泉（ますいずみ）」は、良質の湧き水（泉）が出たことに由来する地名。犀川（さいがわ）の水が地下を流れ、豊かな水にめぐまれた土地だった。',src:'金沢検定'},
   {cat:'歴史',rank:'◎',name:'旧五十人町（ごじゅうにんまち）',dist:'校門から北へ・中村町（なかむらまち）方面',text:'藩政前期、加賀藩士小幡宮内（おばたくない）の下屋敷があったが、のちに足軽（あしがる）五十人組（ごじゅうにんぐみ）が住んだのでこの名がついた。今の中村町（なかむらまち）・増泉（ますいずみ）・白菊町（しらぎくちょう）・千日町（せんにちまち）のあたり。',src:'金沢市公式（歴史のまちしるべ）'},
   {cat:'歴史',rank:'◎',name:'白菊町（しらぎくちょう）',dist:'校門から北東へ',text:'加賀藩士・前田平太夫（まえだへいだゆう）の下屋敷があったところ。その定紋（じょうもん）「菊一文字（きくいちもんじ）」にちなんでこの名がついた。',src:'金沢市公式（歴史のまちしるべ）'},
   {cat:'食',rank:'◎',name:'旧地黄煎町（じおうせんまち）・幻の飴薬',dist:'校門から南東へ・泉が丘（いずみがおか）方面',text:'藩政初期、泉野新村（いずみのしんむら）から発達した町。地黄（じおう）という薬草をとって「地黄煎（じおうせん）」という飴薬（あめぐすり）を売り出したことから、この名がついたと伝わる。',src:'金沢市公式（歴史のまちしるべ）'}
  ],
  kentei:[],
  spots:[
   {at:0,cat:'建物',rank:'◎',name:'金沢市民芸術村（だいわまち1-1）',text:'すべてのレベルの起点。1996年（平成8年）開村。大和紡績（だいわぼうせき）金沢工場の跡地を使った、24時間365日使える市民の創作拠点。',src:'金沢まるっと'},
   {at:1,cat:'町',rank:'◎',name:'増泉（ますいずみ）・泉（いずみ）の水の道',text:'芸術村から南西へ。犀川（さいがわ）左岸の「泉（いずみ）」「増泉（ますいずみ）」は、良質の湧き水に由来する地名。',src:'金沢検定'},
   {at:1,cat:'歴史',rank:'◎',name:'旧五十人町（ごじゅうにんまち）・白菊町（しらぎくちょう）',text:'足軽（あしがる）五十人組（ごじゅうにんぐみ）が住んだ旧五十人町、前田平太夫（まえだへいだゆう）の下屋敷があった白菊町（しらぎくちょう）を通る。',src:'金沢市公式（歴史のまちしるべ）'}
  ],
  school:{name:'新神田（しんかんだ）小学校',addr:'新神田2丁目5-1',spots:[
   {cat:'建物',rank:'◎',name:'新神田（しんかんだ）小学校',text:'金沢市新神田2丁目。金沢市立高岡（たかおか）中学校のすぐ隣にある。1981年（昭和56年）、米丸（よねまる）小学校から分かれて開校した、比較的新しい学校。ユネスコスクール加盟校で「魅力発見！私たちの新神田、そして金沢」をテーマに、地域の伝統文化を学ぶ活動をしている。',src:'金沢市公式／文科省 ユネスコスクール／金沢市立新神田小学校'},
   {cat:'町',rank:'◎',name:'新神田（しんかんだ）の由来',text:'「神田（しんでん・かんだ）」は、もともと神社の費用をまかなうお米をつくる田んぼのこと。犀川（さいがわ）左岸の農地だったこの一帯が、住居表示で「新神田（しんかんだ）」となった。増泉（ますいずみ）・糸田町（いとだまち）にはさまれた土地。',src:'金沢市公式／金沢検定'}
  ]},
  around:[
   {cat:'歴史',rank:'★',name:'【範囲外】野田山（のだやま）・前田家墓所（まえだけぼしょ）',text:'校門から南へ約4km。加賀藩主・前田家（まえだけ）代々の墓がある野田山（のだやま）。1587年（天正15年）、藩祖（はんそ）利家（としいえ）の兄・利久（としひさ）をここに葬ったのが始まり。以後、歴代藩主とその家族がねむり、2009年（平成21年）に高岡市の利長（としなが）墓所とともに国史跡に指定された。文豪・室生犀星（むろうさいせい）や仏教学者・鈴木大拙（すずきだいせつ）の墓もある。',src:'金沢市公式／金沢検定'},
   {cat:'交通',rank:'★',name:'【範囲外】旧北国街道（きゅうほっこくかいどう）・野町（のまち）',text:'校門から北へ。犀川（さいがわ）左岸を進むと、北国街道（ほっこくかいどう）の宿場町として栄えた野町（のまち）に出る。野田山（のだやま）の前田家（まえだけ）墓所へ向かう街道の入り口でもあった。',src:'金沢検定'}
  ]}

// ======================= ここまで =======================

const CATS=['用水','建物','町','歴史','交通','校下','数字'];
const RANKS={'★':'金沢まるっと掲載','◎':'一次資料・金沢検定で裏取り','◇':'要裏取り'};
const byLv=Object.fromEntries(LEVELS.map(l=>[l.lv,l]));
let cur=LEVELS[0].lv, tab='route', catOn=new Set(CATS), verifiedOnly=false;

function school(lv){return BASE.schools.find(s=>s.lv===lv);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function spotHTML(sp){
  if(!catOn.has(sp.cat)) return '';
  if(verifiedOnly && sp.rank==='◇') return '';
  return `<div class="spot c-${sp.cat}"><span class="tg t-${sp.cat}">${sp.cat}</span><span class="nm">${esc(sp.name)}</span><span class="rk">${sp.rank} ${RANKS[sp.rank]}</span><p>${esc(sp.text)}</p><div class="src">出典：${esc(sp.src||'')}</div></div>`;
}
function render(){
  const s=school(cur), L=byLv[cur];
  const gmap=`https://www.google.com/maps/dir/?api=1&origin=${START.lat},${START.lon}&destination=${s.lat},${s.lon}&travelmode=walking`;
  let h=`<div class="card"><div class="head"><div><h2>Lv${s.lv} ${s.name}小学校<small>${s.yomi}しょうがっこう</small></h2><div class="meta">往復 ${s.rt}km（芸術村発着・徒歩実測）${L?'・'+(L.school.addr||''):''}</div></div><a class="gbtn" target="_blank" rel="noopener" href="${gmap}">📍 Googleマップで道順を開く</a></div>`;
  const Lx = Object.assign({steps:STEPS[s.name]||[]}, L || {spots:[], school:{name:s.name+'小学校',addr:'',spots:[]}, around:[]}); Lx.steps=STEPS[s.name]||[]; 
  h+=`<div class="tabs"><span class="tab ${tab==='route'?'on':''}" data-t="route">🛣️ 道順とうんちく</span><span class="tab ${tab==='map'?'on':''}" data-t="map">🗺️ 地図（ルート）</span><span class="tab ${tab==='school'?'on':''}" data-t="school">🏫 学校・校下</span><span class="tab ${tab==='detour'?'on':''}" data-t="detour">🧭 寄り道スポット</span><span class="tab ${tab==='hyochu'?'on':''}" data-t="hyochu">🪧 まちしるべ標柱</span><span class="tab ${tab==='kyu'?'on':''}" data-t="kyu">🏷️ 旧町名（消えた町名）</span><span class="tab ${tab==='kentei'?'on':''}" data-t="kentei">🎓 この地域の金沢検定</span><span class="tab ${tab==='around'?'on':''}" data-t="around">📚 範囲外の余談</span></div>`;
  h+=`<div class="chips">${CATS.map(c=>`<span class="chip ${catOn.has(c)?'on':''}" data-c="${c}">${c}</span>`).join('')}<span class="chip ${verifiedOnly?'on':''}" data-v="1">★◎のみ（喋る用）</span></div></div>`;
  // route
  let r=`<div class="card panel ${tab==='route'?'on':''}"><div class="strip">`;
  r+=`<div class="step start"><h3>🏁 スタート：${START.name}</h3>${Lx.spots.filter(x=>x.at===0).map(spotHTML).join('')}</div>`;
  Lx.steps.forEach((st,i)=>{ const n=i+1; const sp=Lx.spots.filter(x=>x.at===n).map(spotHTML).join(''); r+=`<div class="step"><h3>${n}. ${esc(st)}</h3>${sp}</div>`; });
  r+=`<div class="step goal"><h3>🏫 ゴール：${Lx.school.name}の校門でタッチ</h3>${(Lx.school.spots||[]).map(spotHTML).join('')}</div></div>${Lx.spots.length?'':'<p class="note">このレベルのうんちくは解放されたら装填する。</p>'}</div>`;
  h+=r;
  const gembed=`https://maps.google.com/maps?saddr=${START.lat},${START.lon}&daddr=${s.lat},${s.lon}&dirflg=w&hl=ja&output=embed`;
  h+=`<div class="card panel ${tab==='map'?'on':''}"><iframe class="gframe" src="${gembed}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><p style="margin:10px 0"><a class="gbtn" target="_blank" rel="noopener" href="${gmap}">📍 Googleマップアプリで開く（芸術村→${s.name}小・徒歩）</a></p><div id="lmap"></div><ol style="padding-left:20px;font-size:14px;margin-top:10px">${Lx.steps.map(st=>`<li style="margin:4px 0">${esc(st)}</li>`).join('')}</ol><p class="note">上：Googleマップの徒歩ルート。下：OpenStreetMap＋実際の歩道ルート（取得できないときは直線）。往復 ${s.rt}km。</p></div>`;
  h+=`<div class="card panel ${tab==='school'?'on':''}"><h3 style="font-family:'Zen Maru Gothic';font-weight:900;margin-bottom:6px">${Lx.school.name}（${Lx.school.addr||''}）</h3>${(Lx.school.spots||[]).map(spotHTML).join('')||'<p class="note">なし</p>'}</div>`;
  h+=`<div class="card panel ${tab==='detour'?'on':''}"><p class="note" style="margin-bottom:8px">走りながら「ちょっと寄ってみました」ができる場所。距離は校門またはルートからの目安。</p>${(Lx.detours||[]).map(sp=>spotHTML(Object.assign({},sp,{name:sp.name+'　📍'+(sp.dist||'')}))).join('')||'<p class="note">未装填</p>'}</div>`;
  h+=`<div class="card panel ${tab==='hyochu'?'on':''}"><p class="note" style="margin-bottom:8px">金沢市が昭和54年〜平成22年に市内224か所に建てた「歴史のまちしるべ」標柱（町名・坂・堀・用水の由来を刻んだ柱）。ルート近くの標柱を、市公式一覧の設置場所（住所）付きで。番号は市の標柱番号。住所をタップでGoogleマップ。</p>${(Lx.hyochu||[]).map(k=>`<div class="spot c-歴史"><span class="tg t-歴史">標柱 No.${k.no}</span><span class="nm">${esc(k.n)}（${esc(k.y)}）</span><span class="rk">◎ 金沢市公式</span><p>${esc(k.text)}</p><div class="src">📍 設置場所：<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('金沢市'+k.at)}" target="_blank" rel="noopener">金沢市${esc(k.at)}</a></div></div>`).join('')||'<p class="note">未装填</p>'}</div>`;
  h+=`<div class="card panel ${tab==='kyu'?'on':''}"><p class="note" style="margin-bottom:8px">金沢市公式「旧町名一覧」（よみがな・由来・現在の町名）から、このルートの足元にあった町。1963〜66年の住居表示で消えた町名。</p>${(Lx.kyu||[]).map(k=>`<div class="spot c-町"><span class="tg t-町">旧町名</span><span class="nm">${esc(k.n)}（${esc(k.y)}）</span><span class="rk">◎ 金沢市公式</span><p>${esc(k.text)}</p><div class="src">現在の町名：${esc(k.now)}</div></div>`).join('')||'<p class="note">未装填</p>'}</div>`;
  h+=`<div class="card panel ${tab==='kentei'?'on':''}"><p class="note" style="margin-bottom:8px">金沢検定アプリ（3,050問）から、このルート周辺に関する問題。タップで答えと解説。</p>${(Lx.kentei||[]).map((q,i)=>`<details class="kq"><summary><b>Q${i+1}.</b> ${esc(q.q)}<div class="kopts">${q.o.map((o,j)=>`<span>${'①②③④⑤'[j]||j+1} ${esc(o)}</span>`).join('')}</div></summary><div class="kans">✅ ${esc(q.o[q.a])}<div class="kexp">${esc(q.e||'')}</div></div></details>`).join('')||'<p class="note">未装填</p>'}</div>`;
  h+=`<div class="card panel ${tab==='around'?'on':''}">${(Lx.around||[]).map(spotHTML).join('')||'<p class="note">未装填</p>'}</div>`;
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;render();});
  document.querySelectorAll('.chip[data-c]').forEach(c=>c.onclick=()=>{const k=c.dataset.c; catOn.has(k)?catOn.delete(k):catOn.add(k); render();});
  const v=document.querySelector('.chip[data-v]'); if(v) v.onclick=()=>{verifiedOnly=!verifiedOnly;render();};
  if(tab==='map') drawLeaflet(s);
}
function drawLeaflet(s){
  if(!window.L||!document.getElementById('lmap')) return;
  const m=L.map('lmap'); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(m);
  const a=[START.lat,START.lon], b=[s.lat,s.lon];
  L.marker(a).addTo(m).bindPopup('🏁 '+START.name); L.marker(b).addTo(m).bindPopup('🏫 '+s.name+'小学校');
  const straight=L.polyline([a,b],{color:'#c9a24b',dashArray:'8 8',weight:3}).addTo(m); m.fitBounds(straight.getBounds().pad(0.25));
  fetch(`https://router.project-osrm.org/route/v1/foot/${START.lon},${START.lat};${s.lon},${s.lat}?overview=full&geometries=geojson`)
   .then(r=>r.json()).then(j=>{ if(j.routes&&j.routes[0]){ const pts=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]); const line=L.polyline(pts,{color:'#e91e7a',weight:5}).addTo(m); m.removeLayer(straight); m.fitBounds(line.getBounds().pad(0.15)); } })
   .catch(()=>{});
}
function renderBar(){
  const bar=document.getElementById('lvbar'); bar.innerHTML='';
  BASE.schools.forEach(s=>{ const has=!!byLv[s.lv]; const b=document.createElement('button'); b.className='lvbtn'+(s.lv===cur?' on':'')+(has?'':' empty'); b.textContent=`Lv${s.lv} ${s.name}`; b.title=has?'':'未装填'; b.onclick=()=>{cur=s.lv;renderBar();render();}; bar.appendChild(b); });
}
renderBar(); render();
</script>
